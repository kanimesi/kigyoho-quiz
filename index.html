の特別決議による（175条1項・309条2項3号）。なお「相続その他の一般承継」には合併も含まれ、会社分割を含むかは争いがある。", "basis": "PDF p.181（本編 p.178）。台帳要素 book-kigyoho-01-ch03-t051-e01、e02、e03、e05 の逐語引用・要約に基づく。", "page": 181, "printed": 178}, {"id": "book-kigyoho-01-ch03-case005", "ch": 3, "topic": "財源規制（461条）と違反責任（462条）・自己株式の保有・消却・処分", "caseText": "甲社は、自己株式の取得の対価として総額3000万円を支払ったが、その時点の分配可能額は2000万円であった。その後、総株主が免除の同意をした。自己株式の取得に関与した取締役等B、Cは、全額支払いの免除となるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：財源規制違反の責任（462条）と総株主の同意による免除の限度（462条3項）。461条の財源規制（分配可能額規制）に違反する自己株式の取得に関与した者（462条1項の主体）は、支払義務を負う。総株主の同意による免除は分配可能額の限度であり、本件では免除は2000万円の限度であって、B、Cは差額1000万円の支払義務をなお負うかが問題となる。", "basis": "PDF p.183（本編 p.180）。台帳要素 book-kigyoho-01-ch03-t052-e01、e02 の逐語引用・要約に基づく。", "page": 183, "printed": 180}, {"id": "book-kigyoho-01-ch03-case006", "ch": 3, "topic": "（論点）名義書換の不当拒絶（確定的効力の例外1）", "caseText": "BはAから甲社の株式の譲渡を受け、甲社に名義書換を請求した。ところが、Bは甲社の乗っ取りを企画しているとして、甲社は名義書換を拒絶した。Bは、名義書換をせずに議決権行使（権利行使）することができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：名義書換の不当拒絶（名義書換の確定的効力の例外）。株式譲受人が株主として権利行使するには名義書換が対抗要件となるのが原則である（130条：確定的効力）。もっとも、株主名簿制度を設けた趣旨は会社の事務処理の便宜を図ることにあるため、会社が株式譲受人の名義書換請求を不当に拒絶しておきながら130条を根拠に株主権の行使を認めないのは信義則（民法1条2項）に反し、名義書換を不当拒絶された株式譲受人は名義書換なくして会社に対して株主として権利行使できると解される（最判昭和42年9月28日）。本件では、Bは株券の占有者（131条1項）として株式についての権利を適法に有するものと推定されるところ、甲社が単にBが乗っ取りを企画していることを理由に名義書換を拒絶することが不当拒絶に当たるかが問題となる。", "basis": "PDF p.191（本編 p.188）。台帳要素 book-kigyoho-01-ch03-t106-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 191, "printed": 188}, {"id": "book-kigyoho-01-ch03-case007", "ch": 3, "topic": "失念株（剰余金配当・株式分割の場合）", "caseText": "BはAから甲社の株式の譲渡を受けたが、名義書換を失念していた。その間に、甲社は名義株主であるAに、1）剰余金の配当、2）株式の分割を行い、3）株主割当てで募集株式を発行した。BはAに、剰余金、分割株式、株式の割当てを受ける権利を不当利得（民法703条、704条）として返還請求できるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：失念株における失念株主の不当利得返還請求。鍵は、各権利が「株主の権利」といえるものかである。1）剰余金配当請求権は株主に対して法律上当然に認められた権利であるから（105条1項1号参照）、株式の譲渡に伴って譲受人（失念株主）に移転し、譲渡人が会社から配当を受けた場合は、譲受人は不当利得（民法703条）に基づき配当金相当額の返還を請求できる（最判昭和37年4月20日）。2）株式分割は「株主は」分割「株式を取得する」（184条1項）のであるから、株主の権利といえ、株式譲受人は分割株式の請求ができる（最判平成19年3月8日）。3）株主割当てで募集株式を発行した場合は、株式の割当を受ける権利が株主の権利といえるかが問題となる（狭義の失念株）。", "basis": "PDF p.195（本編 p.192）。台帳要素 book-kigyoho-01-ch03-t109-e01、e02、e03、e04、e05 の逐語引用・要約に基づく。", "page": 195, "printed": 192}, {"id": "book-kigyoho-01-ch03-case008", "ch": 3, "topic": "全部取得条項付種類株式の取得（171条）によるキャッシュ・アウト", "caseText": "甲社の株主構成は、Aが6000株、Bが900株、Cが100株の甲株を保有している。甲社は、甲株を全部取得条項付種類株式に変え、1000株につき新しい甲’株1株の割合で会社が取得することにより、B・Cを締め出したいと考えている（Bは0.9株分、Cは0.1株分の端数となる）。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：全部取得条項付種類株式の取得（171条）によるキャッシュ・アウト（少数株主の排除）の手続。①甲’株を発行できるよう定款変更（株主総会の特別決議・466条・309条2項11号）、②既存株式甲株を全部取得条項付種類株式に変える定款変更（株主総会の特別決議に加え甲株主の種類株主総会の特別決議・111条2項・324条2項1号。取得対価の価額の決定方法を定款に記載・108条2項7号イ）、③全部取得条項付種類株式の会社による取得手続（株主総会の特別決議・171条1項・309条2項3号）、④1株に満たない端数の金銭処理（234条1項2号）を経て、B・Cは甲社株主でなくなる。少数株主保護として、事前開示（171条の2）、事後開示（173条の2）、差止請求権（171条の3）、裁判所に対する価格決定の申立権（172条1項）の各制度が問題となり、事後に効力を争う方法としては株主総会決議取消の訴え（831条1項）によることになる。", "basis": "PDF p.206（本編 p.203）。台帳要素 book-kigyoho-01-ch03-t120-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 206, "printed": 203}, {"id": "book-kigyoho-01-ch04-case001", "ch": 4, "topic": "設立中の会社と成立会社の関係（同一性説）", "caseText": "甲設立中の会社の発起人Aは、設立事務所の賃貸借契約をBと締結した。賃料30万円×3ヶ月の合計90万円が未払いである。Bは、甲’成立会社に90万円を請求することができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：設立中の会社と成立会社の同一性（同一性説）。Bが甲’成立会社に90万円を請求できるためには、①取引内容が発起人の権限の範囲内の行為であって、②甲設立中の会社と甲’成立会社が実質的には同一であることが必要である。設立中の会社は成長発展して、最終的に設立登記によって法人格を取得して会社として成立する（49条）ので、設立中の会社と成立した会社は実質的には同一の存在であるとする同一性説が問題となる。", "basis": "PDF p.221（本編 p.218）。台帳要素 book-kigyoho-01-ch04-t019-e01、e02、e03 の逐語引用・要約に基づく。", "page": 221, "printed": 218}, {"id": "book-kigyoho-01-ch04-case002", "ch": 4, "topic": "未払いの設立費用がある場合、相手方は誰にいくら請求できるか", "caseText": "甲設立中の会社の定款には設立費用70万円と定められていた。発起人Aは設立事務所の賃貸借契約をBと締結したが、賃料30万円×3ヶ月の合計90万円が未払いである。Bが誰にいくら請求できるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：設立費用の帰属。発起人の権限は会社設立に法律上必要な行為に限定すべきであり、設立費用は会社設立に事実上・経済上必要な行為によって生じるもので発起人の権限外の行為から生じたものであるから、会社に帰属せず発起人に帰属すると解される。この立場では、Bは成立後の発起人Aに90万円を請求でき、AはBに支払後、定款に定められた設立費用70万円を甲会社に請求することになる。Bの請求先と金額の配分が問われる。", "basis": "PDF p.223（本編 p.220）。台帳要素 book-kigyoho-01-ch04-t021-e01、e02、e03 の逐語引用・要約に基づく。", "page": 223, "printed": 220}, {"id": "book-kigyoho-01-ch04-case003", "ch": 4, "topic": "定款に記載のない財産引受けの効力（会社からの追認の可否）", "caseText": "甲設立中の会社の発起人Aは、売主Bとの間で、甲社が乙土地を譲り受ける旨の売買契約を締結した。しかし、この財産引受けは甲社の定款に記載がなかった。①Bは甲成立会社に代金請求をすることができるか、②甲成立会社はBに乙土地の引き渡し請求をすることができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：定款に記載のない財産引受けの効力と会社からの追認の可否。乙土地は「会社の成立後に譲り受けることを約した財産」（28条2号）であり財産引受けにあたる。財産引受けは本来は設立中の会社の実質的権利能力の範囲外の行為であるが、会社法は成立後の会社の便宜を考慮して法定の要件を満たせば例外的に発起人の権限に属するとしたにすぎない。したがって、定款に記載のない財産引受けは絶対的に無効であって、理論上追認できないと解される（会社法28条の「その効力を有しない」を絶対的無効と解するか無権代理無効と解するかの問題。最判昭和28年12月3日と同じ立場）。また、成立会社は設立中の会社と実質的には同一の存在である（49条）から、成立会社も追認することはできない。もっとも、成立後の会社が長期間利益を享受しておきながら無効を主張することは信義則（民法1条2項）に反し許されないとする判例（最判昭和61年9月11日）もある。", "basis": "PDF p.225（本編 p.222）。台帳要素 book-kigyoho-01-ch04-t022-e04、e05、e06、e08、e09、e10 の逐語引用・要約に基づく。", "page": 225, "printed": 222}, {"id": "book-kigyoho-01-ch04-case004", "ch": 4, "topic": "教材問題1・問題1’（仮装払込の金銭の全額支払請求・現物出資の仮装）", "caseText": "甲社の設立に際し、発起人Aは払込みを仮装して甲社の株式を引き受けた（見せかけの払込みにより資本金を大きく見せた）。仮装には発起人Xや設立時取締役Yも関与した。甲社は、A（並びにX、Y）に仮装払込の金銭の全額の支払い請求ができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：出資の履行の仮装の責任（52条の2第1項1号）。会社が発起人Aに払込の金銭の全額支払い請求ができるかは、当該払込みが「払込みを仮装した場合」にあたるかによる。払込みした資金が会社資金として運用できたとはいえない場合には、払込みは無効といえ、払込みを仮装した場合にあたると解する。仮装した本人Aの支払義務は無過失責任であり（52条の2第1項）、関与した発起人X・設立時取締役Yの支払義務は過失責任である（52条の2第2項・第3項）。募集設立の場合は102条の2・103条が対応する。", "basis": "PDF p.231（本編 p.228）、前提図は PDF p.229（本編 p.226）。台帳要素 book-kigyoho-01-ch04-t030-e01、e02 の逐語引用・要約に基づく。", "page": 231, "printed": 228}, {"id": "book-kigyoho-01-ch04-case005", "ch": 4, "topic": "参考問題（現物出資と発起人の責任）", "caseText": "甲社は発起設立により設立された会社である。発起人はXとYであり、Xは設立の際、建物Aを3000万円相当として現物出資し、Yは3000万円の金銭出資をした。しかし、建物Aは構造上の欠陥があり実際には1000万円相当であった。Xは上記欠陥を知っていたが、Yは知らなかった。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：現物出資の手続（検査役の調査の要否）と、発起人等の不足額塡補責任。現物出資については、定款への記載（28条柱書）と検査役の調査（33条）が原則として必要であり、不当なら変更の請求ができる（33条7項・96条）。検査役の調査は、少額財産（500万円）の特例、市場価格のある有価証券の特例、専門家証明のある場合の特例（33条10項各号、現物出資・財産引受についてのみ）にあたれば不要となる代わりに、設立時取締役等による調査（46条1項1号2号・93条1項1号2号）と発起人等による不足額塡補責任（52条・103条1項）の適用がありうる。本件建物Aは3000万円相当であり少額特例にはあたらない。また、検査役の調査が不要だった場合に、欠陥を知っていたXと知らなかったYの塡補責任の有無・範囲が問題となる。", "basis": "PDF p.235（本編 p.232）。台帳要素 book-kigyoho-01-ch04-t034-e01、e02 の逐語引用に基づく。検査役の調査と塡補責任の枠組みは PDF p.216（本編 p.213）・p.217（本編 p.214）の記載に基づく。", "page": 235, "printed": 232}, {"id": "book-kigyoho-01-ch05-case001", "ch": 5, "topic": "出資の履行の仮装の場合の責任等（213条の2・213条の3・209条）", "caseText": "甲社の募集株式の引受人Aは、払込みを仮装して甲社の株式の発行を受け、その株式をBに譲渡した。仮装には甲社の取締役Xが関与していた。甲社はAに仮装払込の金銭の全額の支払い請求ができるか、また、A及びBは株主の権利（議決権行使、剰余金の配当請求）を行使できるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：募集株式の発行における出資の履行の仮装の責任等（213条の2・213条の3・209条）。募集株式の引受人は、払込みを仮装した場合には、払込みを仮装した払込金額の全額の支払をする義務を負い（213条の2第1項・無過失責任）、仮装に関与した取締役Xは支払義務を負う（213条の3・過失責任）。これらの規定は、出資の履行の仮装の場合は失権しない点で208条5項（当然失権）の例外である。AまたはXが義務を果たせば、Aは株主の権利を行使することができる（209条2項。会社財産が充実した以上、権利行使を否定する理由はないから）。Bは、悪意・重過失でなければ株主の権利を行使することができる（209条3項。株式取引の安全を図るため）。", "basis": "PDF p.246（本編 p.243）。台帳要素 book-kigyoho-01-ch05-t015-e01、e02、e03、e04、e05、e06 の逐語引用・要約に基づく。", "page": 246, "printed": 243}, {"id": "book-kigyoho-01-ch05-case002", "ch": 5, "topic": "＜考えてみよう＞複合問題（不公正発行＋通知・公告）", "caseText": "公開会社である甲社において、①甲社の乗っ取りを画策中の株主Bの議決権比率を低下させる目的で、取締役派の株主Aに株式が発行された。また、②株式発行の公告は払込期日の3日前にされた。株主Bによる本件新株発行の無効の訴えは認められるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：新株発行の無効原因（複合問題）。①議決権比率低下目的の発行については、「著しく不公正な方法」（210条2号参照）により新株が発行された場合の論点で処理し、それ自体は無効原因にはならない。②通知・公告については、株主への募集事項の「通知」は「公告」に代えることができるが（201条3項・4項）、差止めを行うかどうかの熟慮期間という趣旨から「2週間前まで」の通知または公告が必要であり、3日前の公告では不十分で通知・公告を欠いた場合に当たる。公開会社において募集事項の通知・公告を欠いて新株発行がなされた場合は、原則として無効（無効原因）となるが、通知・公告を欠いた以外に瑕疵がなく、差止事由が存在しなかったことを会社が立証したときは、例外的に有効となる。そこで次に、差止事由の有無、すなわち特定の株主の議決権比率の低下を目的とする発行が不公正発行に当たるか（主要目的論）が問題となる。", "basis": "PDF p.258（本編 p.255）。台帳要素 book-kigyoho-01-ch05-t029-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 258, "printed": 255}, {"id": "book-kigyoho-01-ch05-case003", "ch": 5, "topic": "教材問題：公開会社の募集株式発行の効力（令和5年・X/Y事案）", "caseText": "甲株式会社は、公開会社であり、種類株式発行会社ではない。甲会社の株主は、大株主であるX、甲会社の代表取締役でXの息子であるY、創業者一族及び甲会社の取引先である。Yは、甲会社の経営方針の違いからXと不仲になり、甲会社の取締役の地位を奪われる危険を感じていた。そこで、Xの議決権比率の低下を図るため、Yは甲会社の代表取締役として、Yのみを引受人とする募集株式の発行を行った。本件発行は、甲会社の取締役会の決議に基づくものであり、甲会社は、令和5年1月6日、本件発行に係る募集事項として、募集株式数は4万株とすること、払込金額は1株につき800円とすること、払込期日は同月27日とすること並びに増加する資本金及び資本準備金に関する事項のみを公告したが、Xに対して通知はなされなかった。本件発行時、甲会社の株式の公正な払込金額は1株につき1,000円であり、本件発行は特に有利な金額をもってなされた株式発行にあたった。なお、本件発行によっても、Yの議決権は総株主の議決権の過半数に至るものではなかった。令和5年7月24日に、Xは、本件発行の効力を争うことができるか問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：公開会社の募集株式発行の効力（株式発行無効の訴え・828条1項2号）。Xが本件発行の効力を争う方法としては株式発行無効の訴えが考えられ、令和5年7月24日は本件発行の効力発生日（同月27日・209条1項1号）から6ヶ月以内であり、甲会社の株主等（828条2項2号）であるXは、無効原因があれば訴えを提起することができる。無効原因としては、①Xの議決権比率の低下を図る目的の発行が不公正発行に当たるか、②特に有利な金額（公正な払込金額1,000円に対し800円）での発行であること、③Xへの通知がなされなかったことが、それぞれ重大な法令違反として無効原因となるかが問題となる。なお、本件発行によってもYの議決権は過半数に至らない点もあてはめで意味を持つ。", "basis": "PDF p.259（本編 p.256）。台帳要素 book-kigyoho-01-ch05-t030-e01、e03 の逐語引用・要約に基づく。", "page": 259, "printed": 256}, {"id": "book-kigyoho-01-ch05-case004", "ch": 5, "topic": "①ベルシステム24事件（東京高平決16・8・4）：主要目的論のあてはめ基準", "caseText": "Y会社（公開会社）の議決権を約40％保有する株主Xは、経営方針を巡って経営陣と対立し、定時株主総会で取締役の過半数をX側とする株主提案をした。その直後、Y会社は、Aとの業務提携のために必要な資金を調達する目的で、Bに対する募集株式の発行の取締役会決議をした。この発行がなされると、Xの持株比率は約20％に低下する。Xは差止めを求めようとしている（ベルシステム24事件・東京高決平成16年8月4日）。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：不公正発行の判断における主要目的論のあてはめ基準（210条2号）。公開会社において取締役会に募集株式の発行権限が認められた趣旨は、会社の機動的な資金調達の便宜のためである（201条1項・199条2項）。そうだとすると、募集株式の発行等の主要目的が、資金調達を超えて特定の株主の議決権比率の低下にある場合には、「著しく不公正な方法」（210条2号）にあたる。主要目的の判断は、資金調達の緊急性の有無、事業計画の合理性・事業計画のための資金調達の必要性によって行う。本件では、Xの株主提案直後に発行が決議され支配権維持目的が強く疑われるため、それに優越する資金調達の必要性・合理性（Aとの業務提携という事業計画の合理性、提携のための資金調達の必要性）があるかが問題となる。", "basis": "PDF p.264（本編 p.261）。台帳要素 book-kigyoho-01-ch05-t036-e02、e03、e06、e07 の逐語引用・要約に基づく。", "page": 264, "printed": 261}, {"id": "book-kigyoho-01-ch05-case005", "ch": 5, "topic": "②ニッポン放送事件（東京高決平成17・3・23）：主要目的でも不公正発行に当たらない場合", "caseText": "Y社（ニッポン放送）の株主X（ライブドア）はY社の株式を保有していた。Y社は新株予約権を発行し、A社（フジテレビジョン）がこれを行使すれば、Xの持株比率は約42％から約17％に低下する。Y社の経営陣は、本件新株予約権の発行の目的は、Xの持株比率を低下させA社による支配権を確保することにあることを認めたうえで、そのことがY社の企業価値維持のために必要であると主張している。Xは差止めを求めようとしている（ニッポン放送事件・東京高決平成17年3月23日）。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：経営支配権の維持・獲得が主要目的でも「著しく不公正な方法」（新株予約権については247条・210条2号参照）に当たらない場合があるか。経営支配権の維持・獲得を目的とした新株予約権の発行は、誰を経営者としてどのような方針で経営させるかは株主総会における取締役選任を通じて株主が資本多数決によって決すべき問題であるから、原則として「著しく不公正な方法」による発行にあたる（主要目的論）。しかし、株主全体の利益保護の観点から例外が認められる場合があるかが問題となる。本決定は、主要目的論を基本的に踏襲しつつ「株主全体の利益保護の観点から」例外を認めたうえで、本件ではXがY社の事業や資産を食い物にするような目的と認めるに足りる確たる資料はないとして、「著しく不公正な方法」の発行と認定した。なお、Y社は「資金調達が必要」とは主張できない（資金調達目的なら新株発行にすべきだから）点もポイントである。", "basis": "PDF p.266（本編 p.263）。台帳要素 book-kigyoho-01-ch05-t037-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 266, "printed": 263}, {"id": "book-kigyoho-01-ch06-case001", "ch": 6, "topic": "（応用）462条責任の三主体へのあてはめ―株主総会決議（454条1項）による剰余金の配当", "caseText": "甲社は、株主総会決議（454条1項）により、800万円の剰余金の配当（分配可能額は500万円）を決定した。代表取締役（業務執行取締役）Aは、金銭の交付を自ら行い、または使用人に命じて交付させ、株主Dが交付を受けた。配当議案を決定した取締役会では、Bは賛成し、Cは反対したが議事録に異議をとどめなかった。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】分配可能額を超える違法な剰余金の配当に関する責任（462条）における責任主体のあてはめ\n【理由】分配可能額500万円を超えて800万円の配当が行われた事実が、461条1項8号の財源規制違反に当たり、462条の責任が問題となる。あてはめは、Aは金銭の交付に関する職務を自ら行った（または使用人に命じた）者として462条1項柱書の「当該行為に関する職務を行った業務執行者」に、Bは取締役会で議案の決定に賛成した者として会社計算規則160条3号・462条1項6号イの「総会議案提案取締役」に、Cは反対したものの議事録に異議をとどめなかったため369条5項により賛成したものと推定され同じく「総会議案提案取締役」に、Dは462条1項柱書の「金銭等の交付を受けた者」に、それぞれ当たる。\n【関係条文】会社法454条1項、461条1項8号、462条、369条5項、会社計算規則159条・160条", "basis": "PDF p.281（本編 p.278）。台帳要素 book-kigyoho-01-ch06-t015-e01、book-kigyoho-01-ch06-t015-e02 の逐語引用に基づく。", "page": 281, "printed": 278}, {"id": "book-kigyoho-01-ch06-case002", "ch": 6, "topic": "（応用）462条責任の三主体へのあてはめ―取締役会決議（459条）による剰余金の配当", "caseText": "甲社は、取締役会決議（459条）により、800万円の剰余金の配当（分配可能額は500万円）を決定した。代表取締役（業務執行取締役）Aは、金銭の交付を自ら行い、または使用人に命じて交付させ、株主が交付を受けた。取締役会ではBが賛成し、議案を提出したのはEであった。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】分配可能額を超える違法な剰余金の配当に関する責任（462条）における責任主体のあてはめ（取締役会決議による配当の場合）\n【理由】分配可能額500万円を超える800万円の配当という事実が461条1項8号違反に当たり462条責任が問題となる点は株主総会決議の場合と同じだが、決定機関が取締役会（459条）であるため主体の根拠が異なる。Aは462条1項柱書の「当該行為に関する職務を行った業務執行者」に、Bは取締役会で配当に賛成した者として会社計算規則159条8号ハ・462条1項柱書の「当該行為に関する職務を行った業務執行者」に、Eは会社計算規則161条・462条1項6号ロの「取締役会議案提案取締役」に当たる。\n【関係条文】会社法459条、461条1項8号、462条、会社計算規則159条・161条", "basis": "PDF p.282（本編 p.279）。台帳要素 book-kigyoho-01-ch06-t016-e01、book-kigyoho-01-ch06-t016-e02 の逐語引用に基づく。", "page": 282, "printed": 279}, {"id": "book-kigyoho-01-ch06-case003", "ch": 6, "topic": "事後の欠損填補責任（465条）", "caseText": "甲社は、9月30日の臨時株主総会において剰余金の配当を決定し、配当を行った。この配当の時点では、財源規制（461条）には違反していなかった。ところが、翌年3月31日の事業年度末において、甲社に欠損が生じた。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】事後の欠損填補責任（465条1項）\n【理由】「配当時点では財源規制違反がない」ことと「事業年度末に欠損が生じた」ことの組合せが、465条1項の要件（株式会社が剰余金を配当する時点では財源規制に違反しなかったが、事業年度末に欠損が生じたこと）にそのまま当たる。462条の違法配当責任は配当時点の461条違反を前提とするため使えず、事後に生じた欠損を対象とする465条を考える場面である（教材も「財源規制違反のない剰余金の配当、その後期末に欠損とあれば465条を考える」とする）。効果として、剰余金の配当に関する業務執行者は、会社に対し連帯して超過額（欠損額と配当額のいずれか少ない額を限度）を支払う義務を負う。なお、定時株主総会における配当は465条1項10号イにより対象外となるため、本件が臨時株主総会による配当である点もあてはめ上重要である。\n【関係条文】会社法465条1項、461条", "basis": "PDF p.279（本編 p.276）の時系列図（3/31期末→6月末定時株主総会→9/30臨時株主総会（剰余金配当決定）→翌3/31期末に欠損、461条違反なし）に基づく。台帳要素 book-kigyoho-01-ch06-t014-e02、book-kigyoho-01-ch06-t014-e03、book-kigyoho-01-ch06-t014-e05 の逐語引用に基づく。", "page": 279, "printed": 276}, {"id": "book-kigyoho-01-ch08-case001", "ch": 8, "topic": "あてはめの視点1：①有機的一体として機能する財産", "caseText": "甲社は、製造加工業を3年間休業していたが、その製造工場を構成する土地・建物・機械・器具類一式を乙社に譲渡した（最判昭和40・9・22の事案）。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】事業譲渡の意義（該当性）―467条1項1号・2号の「事業譲渡」に当たるか\n【理由】判例（最判昭和40・9・22）の定義では、事業譲渡とは①一定の事業目的のために組織化された有機的一体として機能する財産の（全部または重要な一部の）譲渡であって、②必ず事業活動の承継を伴い、③譲渡会社が21条の競業避止義務を負う結果を伴うものをいう。本件では、甲社が3年間休業していたため、譲り受けてもそのまま事業を継続することが可能な状態の財産ではなく個別の財産をまとめて譲り受けたに過ぎず①を満たさず、また休業していた以上、乙社がその事業を引き継ぐわけではないので②も満たさない。したがって事業譲渡には当たらない（株主総会の特別決議は不要）という結論に至る事例である。\n【関係条文】会社法467条1項1号・2号、21条", "basis": "PDF p.295（本編 p.292）。台帳要素 book-kigyoho-01-ch08-t005-e02、book-kigyoho-01-ch08-t006-e02、book-kigyoho-01-ch08-t004-e02 の逐語引用に基づく。", "page": 295, "printed": 292}, {"id": "book-kigyoho-01-ch08-case002", "ch": 8, "topic": "あてはめの視点2：②事業活動の承継", "caseText": "甲ゴルフ場運営会社は、その所有する財産のほとんどを乙社に譲渡したが、ゴルフ会員は引き継がず、乙社は新規にゴルフ会員を募集した（旭川地判平成7・8・31の事案）。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】事業譲渡の意義（該当性）―とりわけ②事業活動の承継の有無\n【理由】財産のほとんどが譲渡されていても、事業譲渡の定義（判例）の②「事業活動の承継を伴うもの」に当たるかが問題となる。ゴルフ場事業では会員との関係が事業活動の中核であり、乙社はゴルフ会員を引き継いでいない以上、事業活動を引き継ぐとはいえないので②を満たさず、事業譲渡には当たらないというあてはめが示される事例である。\n【関係条文】会社法467条1項1号・2号、21条", "basis": "PDF p.295（本編 p.292）。台帳要素 book-kigyoho-01-ch08-t006-e03 の逐語引用に基づく。", "page": 295, "printed": 292}, {"id": "book-kigyoho-01-ch08-case003", "ch": 8, "topic": "（論点）事業名を続用した事業譲渡の譲受人の22条1項責任", "caseText": "株式会社甲は「乙ゴルフ倶楽部」を経営していた。その後、株式会社丙が、甲から乙ゴルフ倶楽部の事業の譲渡を受け、「乙ゴルフ倶楽部」という名称を引き続き使用してゴルフクラブの経営を行った（以後、甲はゴルフクラブの経営を行っていない）。丁は、甲にゴルフ会員資格保証金3000万円を預託していたが、甲丙間の事業譲渡契約によって預託金返還債務は全て丙に承継されなかった。預託金の据置期間経過後、丁は乙ゴルフ倶楽部を退会する際に、丙に対し、預託金の返還を請求した（最判平成16・2・20参考）。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】事業名を続用した事業譲渡における譲受会社の責任―会社法22条1項の類推適用\n【理由】丁の丙に対する預託金返還請求であり、債務自体は譲渡契約で丙に承継されていないため、請求の根拠は22条1項に求めることになる。もっとも、同項の要件は①譲受会社が事業の譲渡を受けたこと、②譲受会社が譲渡会社の「商号」を続用することであり、本件で丙が続用したのは「乙ゴルフ倶楽部」という事業名であって株式会社甲という商号ではないため、直接適用はできない。そこで、同項の趣旨（商号が続用された場合に債権者が同一の事業主体による事業の継続と誤認することの救済）から、事業名・ブランド名の続用によって債権者が同一の事業主体による事業の継続と誤認する場合には類推適用できると解する。ゴルフ場経営では倶楽部の名称が事業主体を表示するものとして用いられることが多いため、丁は誤認したといえ、22条1項を類推適用でき、丁は丙に預託金3000万円の返還を請求できる。\n【関係条文】会社法22条1項（467条は事業譲渡の承認規定にとどまる）", "basis": "PDF p.306（本編 p.303）の（問題）、PDF p.307（本編 p.304）の解答例。台帳要素 book-kigyoho-01-ch08-t022-e01、book-kigyoho-01-ch08-t022-e05、book-kigyoho-01-ch08-t022-e06、book-kigyoho-01-ch08-t022-e07 の逐語引用に基づく。", "page": 306, "printed": 303}, {"id": "book-kigyoho-01-ch09-case001", "ch": 9, "topic": "詐害的会社分割（詐害分割）における残存債権者保護（4項・5項）", "caseText": "甲会社は、債権者Xに対する債務を甲会社に残したまま、会社分割を行い、承継会社である乙会社から対価として乙会社の株式（非上場株式）の交付を受けた。Xは、甲会社に残された債権者（残存債権者）である。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】詐害的会社分割（詐害分割）における残存債権者の保護（会社法764条4項・5項）\n【理由】Xは会社分割によって債務が承継されなかった残存債権者であり、乙会社への履行請求の可否は詐害分割の規定による。要件は、①分割会社（甲会社）が残存債権者を「害する」ことを知って会社分割をしたこと（吸収分割の場合はさらに承継会社の悪意）である。「害する」かは、会社分割の前後で残存債権者が受けられると期待できる弁済額が減少したかで判断する。分割対価が非上場株式である場合、非上場株式は必ずしも譲渡が簡単ではなく残存債権者の債権回収は事実上困難となることもあるため、期待できる債権額は減少し「害する」といえ、甲会社も対価が非上場株式であることを知っていたため「害することを知っていた」といえる。効果として、Xは承継・設立会社（乙会社）に対し、承継した財産の価額を限度として当該債務の履行を請求できる。\n【関係条文】会社法764条4項・5項", "basis": "PDF p.328（本編 p.325）。台帳要素 book-kigyoho-01-ch09-t028-e02、book-kigyoho-01-ch09-t028-e03、book-kigyoho-01-ch09-t028-e04 の逐語引用に基づく。", "page": 328, "printed": 325}, {"id": "book-kigyoho-01-ch09-case002", "ch": 9, "topic": "詐害的会社分割（詐害分割）における残存債権者保護（4項・5項）", "caseText": "甲会社は、債権者Xに対する債務を甲会社に残したまま、会社分割を行い、乙会社に対価として乙会社の株式の交付を受けた。甲会社は、この会社分割の結果、債務超過に陥った。Xは、甲会社に残された債権者（残存債権者）である。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】詐害的会社分割（詐害分割）における残存債権者の保護（会社法764条4項・5項）\n【理由】残存債権者Xの乙会社への履行請求の可否として詐害分割の規定が問題となる。「害する」かは、会社分割の前後で残存債権者が受けられると期待できる弁済額が減少したかで判断するところ、本件では甲会社が会社分割の結果債務超過に陥っているため、Xが受けられると期待できる債権額は減少したといえ「害する」に当たり、甲会社も債務超過に陥ることを知っていたため「害することを知っていた」といえる。要件を満たせば、Xは承継・設立会社（乙会社）に対し、承継した財産の価額を限度として当該債務の履行を請求できる。\n【関係条文】会社法764条4項・5項", "basis": "PDF p.328（本編 p.325）。台帳要素 book-kigyoho-01-ch09-t028-e02、book-kigyoho-01-ch09-t028-e03、book-kigyoho-01-ch09-t028-e05 の逐語引用に基づく。", "page": 328, "printed": 325}, {"id": "book-kigyoho-01-ch09-case003", "ch": 9, "topic": "（論点）「承認しなかった債権者」の意義（X1・X2の事例）", "caseText": "甲会社は乙会社への吸収分割を行った。会社債権者X1は、この吸収分割に反対している。甲会社は、債権者異議手続を行ったものの、法律上要求される各別の催告をX1およびX2に対して行わなかった。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】吸収分割無効の訴え（828条1項9号・2項9号）における「承認しなかった債権者」の意義\n【理由】吸収分割無効の主張には、①「承認しなかった債権者」によること、②効力発生日から6箇月以内の訴えであること、③無効原因（重大な瑕疵）の存在が必要である。「承認しなかった債権者」とは、債権者異議手続において異議を述べることができる債権者の中で組織再編を承認しなかった者をいう。X1は、異議を述べることができる債権者ではない（789条1項2号参照）ため、反対していても「承認しなかった債権者」に当たらず無効を主張できない。他方X2は、異議を述べることができる債権者であるのに各別の催告がなされず異議の機会を奪われており、789条4項のみなし承認規定は適法な異議手続を前提とする趣旨から適用されないと解されるため、「承認しなかった債権者」に当たり、債権者異議手続を欠くという重大な瑕疵を理由に無効の訴えを提起できる。\n【関係条文】会社法828条1項9号・2項9号、789条1項2号・4項", "basis": "PDF p.333（本編 p.330）。台帳要素 book-kigyoho-01-ch09-t031-e01、book-kigyoho-01-ch09-t031-e02、book-kigyoho-01-ch09-t031-e03 の逐語引用に基づく。", "page": 333, "printed": 330}, {"id": "book-kigyoho-01-ch09-case004", "ch": 9, "topic": "（論点）合併比率の不公正は合併無効原因になるか（独立した関係の場合）", "caseText": "甲会社と乙会社は吸収合併を行った。甲会社と乙会社は相互に独立した関係にある。合併対価は甲株式1株に対して乙株式1株であったが、時価からすると甲1株に対して乙株1.1株が妥当であった。甲会社の株主Aは、この合併比率の不公正を理由に、吸収合併の無効を主張しようとしている。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】合併比率（対価）の不公正は合併無効原因になるか（当事会社が相互に独立した関係にある場合）\n【理由】合併無効の訴え（828条1項7号）には無効原因の存在が必要であり、合併比率の不公正がそれに当たるかが問題となる。当事会社が相互に独立した関係にあるとき、合併比率は当事会社の交渉によって定められるものであり、多くの事情を勘案して様々の方式によって算定され厳密に客観的正確性をもって唯一の数値と確定されるものではないため、裁判所が合併の無効という形で事後的に介入する必要は乏しく、介入はかえって法的安定性を害する。したがって、合併比率の不公正は合併無効原因にならないと解する。このように解しても、合併承認決議に反対した株主の保護は株式買取請求で図ることができる。\n【関係条文】会社法828条1項7号", "basis": "PDF p.335（本編 p.332）。台帳要素 book-kigyoho-01-ch09-t032-e01、book-kigyoho-01-ch09-t032-e02 の逐語引用に基づく。", "page": 335, "printed": 332}, {"id": "book-kigyoho-01-ch09-case005", "ch": 9, "topic": "（論点）合併比率の著しく不公正と831条1項3号の取消原因（独立した関係にない場合）", "caseText": "乙会社は甲会社の株式の67％を保有しており、乙会社が賛成した甲会社の株主総会決議により、甲会社と乙会社の吸収合併が行われた。合併対価は、甲株式1株の時価の半額に当たる金銭の交付に対して乙株式1株というものであった。甲会社の株主総会決議の日から4ヶ月が経過したが、吸収合併の効力発生日からは2ヶ月しか経過していない時点で、甲会社の株主Aは吸収合併の無効を主張しようとしている。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】合併比率の著しい不公正と株主総会決議取消原因（831条1項3号）の合併無効原因性、および無効の訴えの期間制限\n【理由】当事会社が独立した関係にない場合、合併比率の著しい不公正は、特別の利害関係を有する者（乙会社）が議決権を行使したことによって著しく不当な決議がされた場合（831条1項3号の取消原因）として捉えられる。無効原因は法的安定性・取引の安全の見地から重大な瑕疵に限ると解するところ、特別利害関係者の議決権行使による著しく不当な決議はまさに多数決の濫用であり少数株主保護の必要性が高いため、重大な瑕疵があるとして合併無効の無効原因になると解する。あわせて、この取消原因を無効原因とする訴えについて、決議の日から3ヶ月以内に提訴しなければならないか（決議取消の訴えの期間制限が及ぶか）も問題となり、本件の「決議から4ヶ月・効力発生から2ヶ月」という期間の事実がそのあてはめの対象となる。\n【関係条文】会社法828条1項7号、831条1項3号", "basis": "PDF p.336（本編 p.333）の事例の図・（問題）、PDF p.337（本編 p.334）の結論。台帳要素 book-kigyoho-01-ch09-t033-e01、book-kigyoho-01-ch09-t033-e03、book-kigyoho-01-ch09-t033-e05 の逐語引用に基づく。", "page": 336, "printed": 333}, {"id": "book-kigyoho-01-ch09-case006", "ch": 9, "topic": "株主総会決議の取消事由一般と組織再編行為への妥当", "caseText": "甲会社と乙会社の吸収合併について、株主総会の特別決議は存在する。しかし、株主Aへの招集通知が漏れており、Aは株主総会を欠席した。Aは、この吸収合併の無効の訴えを提起しようとしている。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】株主総会決議の取消事由は合併無効原因になるか\n【理由】合併無効の訴え（828条1項7号・2項7号）の要件は、①吸収合併後存続する会社の株主による効力発生日から6箇月以内の訴えであること、②無効原因（重大な法令定款違反・重大な瑕疵）が存在することである。Aへの招集通知漏れは株主総会決議の取消事由に当たるところ、合併が株主総会の決議によってなされる場合、株主総会決議に取消事由があることは合併の重大な瑕疵といえ、無効原因となると解する。したがってAの無効の訴えは認められる方向となる。なおこの議論は合併に限らず吸収分割など組織再編行為一般に妥当する。\n【関係条文】会社法828条1項7号・2項7号", "basis": "PDF p.339（本編 p.336）。台帳要素 book-kigyoho-01-ch09-t035-e01、book-kigyoho-01-ch09-t035-e02、book-kigyoho-01-ch09-t035-e03 の逐語引用に基づく。", "page": 339, "printed": 336}, {"id": "book-kigyoho-01-ch11-case001", "ch": 11, "topic": "スーパー・テナント関係と9条類推適用（最判平成7年11月30日参考）", "caseText": "甲は、乙会社が経営するスーパーマーケットの屋上で、テナントとしてペットショップを営業していた。甲は乙会社の商号を使用していたわけではない。Xは本件ペットショップで手乗りインコを購入したが、そのインコが原因で、Xはオウム病性肺炎に罹った。Xは、乙会社に対して損害賠償を請求しようとしている（最判平成7年11月30日参考）。", "q": "この事例で問題となる論点を挙げよ。", "a": "【論点】名板貸人の責任（会社法9条）の類推適用―商号の使用がないスーパー・テナント関係\n【理由】Xの乙会社への請求の根拠として9条の名板貸責任が考えられるが、甲は乙会社の「商号」を使用していないため、9条の直接適用はできない。そこで、同条の趣旨（名板貸人が事業主体であるかのような外観を信頼して取引をした第三者を保護する点）から、事業主体を誤認させるような外観が生じていた場合には類推適用すべきかが論点となる。類推適用の要件は、①事業主体の誤認を生じさせるような外観の存在、②会社が①の外観を許諾したこと、③相手方が①の外観を誤認して取引したことであり、特に①について、甲の売場の営業主体が乙会社でないことを買物客が外観上認識できたかがあてはめの中心となる。なお、Xの身体的損害はインコの購入という取引が原因であるため、「取引によって生じた債務」に当たり、不法行為債務かどうかは論点とならない。\n【関係条文】会社法9条（類推適用）", "basis": "PDF p.352（本編 p.349）の（問題）・（視点）、PDF p.353（本編 p.350）の解答例。台帳要素 book-kigyoho-01-ch11-t005-e01、book-kigyoho-01-ch11-t005-e05、book-kigyoho-01-ch11-t005-e07 の逐語引用に基づく。", "page": 352, "printed": 349}], "chapters": {"1": "企業法答案の書き方", "2": "機関", "3": "株式", "4": "設立", "5": "資金調達", "6": "株式会社の計算等", "7": "持分会社", "8": "事業譲渡", "9": "組織再編", "10": "定款変更", "11": "会社法総則"}};
var QUESTIONS = DATA.questions, CARDS = DATA.cards, ARTICLES = DATA.articles,
    COMPARES = DATA.compares, CASES = DATA.cases, CHAPTERS = DATA.chapters;

function loadGrades(key) {
  try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; }
}
function saveGrades(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
}
var KEYS = { q: "kigyoho2_q_grades", r: "kigyoho2_r_grades", a: "kigyoho2_a_grades",
             c: "kigyoho2_c_grades", s: "kigyoho2_s_grades" };
var stores = {};
for (var k in KEYS) stores[k] = loadGrades(KEYS[k]);

var state = {
  mode: "q",
  q: { type: "all", order: "seq", ch: "all", queue: [], idx: 0 },
  r: { order: "seq", ch: "all", queue: [], idx: 0 },
  a: { order: "seq", ch: "all", queue: [], idx: 0 },
  c: { order: "seq", ch: "all", queue: [], idx: 0 },
  s: { order: "seq", ch: "all", queue: [], idx: 0 }
};
var MODES = ["q", "r", "a", "c", "s"];
var SRC = { q: QUESTIONS, r: CARDS, a: ARTICLES, c: COMPARES, s: CASES };

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function chLabel(ch) { return "第" + ch + "章 " + (CHAPTERS[ch] || ""); }

function matchItem(mode, s, item) {
  if (mode === "q") {
    return (s.type === "all" || item.type === s.type) && (s.ch === "all" || item.ch === Number(s.ch));
  }
  if (mode === "a") {
    return s.ch === "all" || item.chs.indexOf(Number(s.ch)) >= 0;
  }
  return s.ch === "all" || item.ch === Number(s.ch);
}

function buildQueue(mode) {
  var s = state[mode];
  var items = SRC[mode].filter(function (it) { return matchItem(mode, s, it); });
  s.queue = (s.order === "rand") ? shuffle(items) : items;
  s.idx = 0;
}

function currentItem() {
  var s = state[state.mode];
  return s.idx < s.queue.length ? s.queue[s.idx] : null;
}

function render() {
  var mode = state.mode, s = state[mode], item = currentItem();
  MODES.forEach(function (m) {
    $(m + "Controls").style.display = m === mode ? "" : "none";
    $("tab" + m.toUpperCase()).classList.toggle("active", m === mode);
  });
  if (!item) {
    $("cardBox").style.display = "none";
    $("endBox").style.display = "";
    return;
  }
  $("cardBox").style.display = "";
  $("endBox").style.display = "none";
  $("counter").textContent = (s.idx + 1) + " / " + s.queue.length;
  var body = $("cardBody");
  body.classList.remove("topic");
  if (mode === "q") {
    $("cardMeta").textContent = chLabel(item.ch) + "｜" + item.type;
    body.textContent = item.q;
    $("btnShow").textContent = "答えを見る";
  } else if (mode === "r") {
    $("cardMeta").textContent = chLabel(item.ch) + "｜論点想起";
    body.classList.add("topic");
    body.textContent = item.topic;
    $("btnShow").textContent = "要点を見る";
  } else if (mode === "a") {
    $("cardMeta").textContent = "条文想起｜" + item.chs.map(function (c) { return "第" + c + "章"; }).join("、");
    body.classList.add("topic");
    body.textContent = item.article;
    $("btnShow").textContent = "要点を見る";
  } else if (mode === "c") {
    $("cardMeta").textContent = chLabel(item.ch) + "｜比較";
    body.textContent = item.q;
    $("btnShow").textContent = "答えを見る";
  } else {
    $("cardMeta").textContent = chLabel(item.ch) + "｜事例";
    body.textContent = item.caseText + "\n\n" + item.q;
    $("btnShow").textContent = "答えを見る";
  }
  $("answerBox").style.display = "none";
  $("gradeRow").style.display = "none";
  $("btnShow").style.display = "";
}

function sourceLine(item) {
  var bits = [];
  if (item.page) {
    var t = "レジュメ PDF p." + item.page;
    if (item.printed != null) t += "（本編 p." + item.printed + "）";
    else t += "（本編 p." + (item.page - 3) + "）";
    bits.push(t);
  }
  return bits;
}

function pointsHtml(item) {
  var html = "";
  item.points.forEach(function (p) {
    html += '<div class="pt">' + (p.aspect ? '<span class="aspect">' + esc(p.aspect) + "</span>" : "") + esc(p.text) + "</div>";
  });
  return html;
}

function showAnswer() {
  var mode = state.mode, item = currentItem();
  if (!item) return;
  var html = "";
  if (mode === "q") {
    html += '<div class="ans-label">模範解答</div><div class="ans-text">' + esc(item.a) + "</div>";
    if (item.reason) html += '<div class="ans-label">根拠</div><div class="basis-text">' + esc(item.reason) + "</div>";
    var bits = [];
    if (item.articles && item.articles.length) bits.push("条文：" + item.articles.join("、"));
    if (item.page) bits.push("レジュメ PDF p." + item.page + "（本編 p." + (item.page - 3) + "）");
    if (item.loc) bits.push(item.loc);
    if (bits.length) html += '<div class="ans-label">出典</div><div class="basis-text">' + esc(bits.join("｜")) + "</div>";
    if (item.caution) html += '<div class="ans-label">注意</div><div class="caution-text">' + esc(item.caution) + "</div>";
  } else if (mode === "r") {
    html += pointsHtml(item);
    var bits2 = [];
    if (item.articles && item.articles.length) bits2.push("条文：" + item.articles.join("、"));
    if (item.pages && item.pages.length) bits2.push("レジュメ PDF p." + item.pages.join(", "));
    if (bits2.length) html += '<div class="ans-label">出典</div><div class="basis-text">' + esc(bits2.join("｜")) + "</div>";
  } else if (mode === "a") {
    html += pointsHtml(item);
    if (item.topics && item.topics.length) {
      html += '<div class="ans-label">関連する論点</div>';
      item.topics.forEach(function (t) { html += '<div class="basis-text">' + esc(t) + "</div>"; });
    }
  } else if (mode === "c") {
    html += '<div class="ans-label">模範解答</div><div class="ans-text">' + esc(item.a) + "</div>";
    if (item.basis) html += '<div class="ans-label">根拠</div><div class="basis-text">' + esc(item.basis) + "</div>";
    var bits3 = sourceLine(item);
    if (bits3.length) html += '<div class="ans-label">出典</div><div class="basis-text">' + esc(bits3.join("｜")) + "</div>";
  } else {
    html += '<div class="ans-label">答え</div><div class="ans-text">' + esc(item.a) + "</div>";
    if (item.basis) html += '<div class="ans-label">根拠</div><div class="basis-text">' + esc(item.basis) + "</div>";
    var bits4 = sourceLine(item);
    if (bits4.length) html += '<div class="ans-label">出典</div><div class="basis-text">' + esc(bits4.join("｜")) + "</div>";
  }
  $("answerContent").innerHTML = html;
  $("answerBox").style.display = "";
  $("gradeRow").style.display = "";
  $("btnShow").style.display = "none";
}

function grade(g) {
  var mode = state.mode, s = state[mode], item = currentItem();
  if (!item) return;
  stores[mode][item.id] = g;
  saveGrades(KEYS[mode], stores[mode]);
  s.idx++;
  render();
}

function fillChapterSelect(sel, chs) {
  var html = '<option value="all">全章</option>';
  chs.forEach(function (ch) { html += '<option value="' + ch + '">第' + ch + "章 " + esc(CHAPTERS[ch] || "") + "</option>"; });
  sel.innerHTML = html;
}

function chaptersOf(mode) {
  var seen = {}, out = [];
  SRC[mode].forEach(function (it) {
    var cs = mode === "a" ? it.chs : [it.ch];
    cs.forEach(function (c) { if (!seen[c]) { seen[c] = 1; out.push(c); } });
  });
  return out.sort(function (x, y) { return x - y; });
}

function segWire(cls, cb) {
  var btns = document.querySelectorAll("." + cls);
  for (var i = 0; i < btns.length; i++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        for (var k = 0; k < btns.length; k++) btns[k].classList.remove("active");
        btn.classList.add("active");
        cb(btn.getAttribute("data-order") || btn.getAttribute("data-type"));
      });
    })(btns[i]);
  }
}

function init() {
  MODES.forEach(function (m) {
    fillChapterSelect($(m + "Chapter"), chaptersOf(m));
    $("tab" + m.toUpperCase()).addEventListener("click", function () { state.mode = m; render(); });
    $(m + "Chapter").addEventListener("change", function () {
      state[m].ch = $(m + "Chapter").value; buildQueue(m); render();
    });
    segWire(m + "OrderBtn", function (v) { state[m].order = v; buildQueue(m); render(); });
    buildQueue(m);
  });
  segWire("typeBtn", function (v) { state.q.type = v; buildQueue("q"); render(); });
  $("btnShow").addEventListener("click", showAnswer);
  $("btnO").addEventListener("click", function () { grade("○"); });
  $("btnT").addEventListener("click", function () { grade("△"); });
  $("btnX").addEventListener("click", function () { grade("×"); });
  $("btnRestart").addEventListener("click", function () { buildQueue(state.mode); render(); });
  render();
}

var APP = { state: state, QUESTIONS: QUESTIONS, CARDS: CARDS, ARTICLES: ARTICLES,
            COMPARES: COMPARES, CASES: CASES, stores: stores, KEYS: KEYS,
            qGrades: stores.q, rGrades: stores.r, aGrades: stores.a,
            cGrades: stores.c, sGrades: stores.s,
            buildQueue: buildQueue, render: render, showAnswer: showAnswer, grade: grade };
init();
</script>
</body>
</html>
