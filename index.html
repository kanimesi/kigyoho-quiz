"text": "一株一議決権の理由：資本団体たる株式会社では、資本的貢献度に応じた扱いをする方がかえって平等であるから"}, {"aspect": "趣旨", "text": "相互保有株式について議決権を否定する趣旨：被支配会社が支配会社株式につき議決権を持つと、議決権の歪曲化等の会社支配の不公正や資本の空洞化をもたらすおそれがあるため（図では乙社が甲社株式を25%以上保有する関係）"}, {"aspect": "原則", "text": "一株一議決権の原則：株主は株主総会において、その有する株式一株につき一個の議決権を有する（308条1項）"}, {"aspect": "原則", "text": "議決権が認められない場合（一株一議決権原則の例外）：①議決権制限株式（108条1項3号）、②自己株式（308条2項）、③相互保有株式（308条1項本文かっこ書）、④単元未満株式（189条1項、308条1項ただし書）、⑤基準日後に取得した株式（124条1項4項）、⑥自己株式の売主（140条3項、160条4項、175条2項）"}, {"aspect": "条文", "text": "308条・108条・189条・124条・140条・160条・175条"}], "articles": ["308条", "108条", "189条", "124条", "140条", "160条", "175条"], "pages": [32]}, {"id": "book-kigyoho-01-ch02-r016", "ch": 2, "topic": "議決権の行使方法の原則と例外", "points": [{"aspect": "原則", "text": "原則：議決権は、①株主が自ら株主総会に出席して、②自己の有する議決権すべてを統一的に行使するのが原則"}, {"aspect": "原則", "text": "例外：①の例外は議決権の代理行使（310条）と書面投票・電子投票（298条1項3号4号、311条、312条）、②の例外は議決権の不統一行使（313条）"}, {"aspect": "条文", "text": "310条・298条・311条・312条・313条"}], "articles": ["310条", "298条", "311条", "312条", "313条"], "pages": [32, 33]}, {"id": "book-kigyoho-01-ch02-r017", "ch": 2, "topic": "（論点）代理人を株主に限定する定款規定の効力（定款による代理人資格の制限）", "points": [{"aspect": "趣旨", "text": "310条の趣旨は、株主に議決権行使の機会を保障すること"}, {"aspect": "結論", "text": "定款規定の有効性：代理人資格を制限すべき合理的理由がある場合に、定款によって相当程度の制限を加えることまで310条は禁止していない。総会のかく乱防止を趣旨とする本問の定款規定は合理的理由があり相当程度の制限といえるので有効"}, {"aspect": "結論", "text": "判例：総会のかく乱防止の趣旨で置かれた代理人資格制限の定款規定は「合理的理由による相当程度の制限である」から有効（最判昭和43・11・1）。これにより総会屋を一定程度排除できる"}, {"aspect": "結論", "text": "定款規定の適用排除：定款規定の趣旨から、具体的事案において株主以外の第三者による株主総会のかく乱のおそれがない場合は、当該定款規定の適用が排除される"}, {"aspect": "結論", "text": "適用排除の裁判例：①病気入院中の株主が非株主である息子・甥に代理行使した場合（大阪高判昭和41・8・8）、②株主たる地方公共団体や株式会社が職員・従業員に代理行使した場合（最判昭和51・12・24）には、例外的に非株主の議決権行使が認められている"}, {"aspect": "あてはめ", "text": "論証の注意点は、①当該定款規定は有効か、②当該事件に当該定款規定を適用するのか（定款の射程範囲）の2点"}, {"aspect": "条文", "text": "310条・831条"}], "articles": ["310条", "831条"], "pages": [33, 34, 35, 36]}, {"id": "book-kigyoho-01-ch02-r018", "ch": 2, "topic": "書面投票・電子投票（298条1項3号4号、311条、312条）", "points": [{"aspect": "趣旨", "text": "書面投票・電子投票の趣旨：株主に議決権行使の機会を保障し、できるだけ多くの株主の意思を株主総会決議に反映させるため"}], "articles": [], "pages": [37]}, {"id": "book-kigyoho-01-ch02-r019", "ch": 2, "topic": "議決権の不統一行使（313条）", "points": [{"aspect": "趣旨", "text": "313条3項の趣旨：複数の実質上の株主の意向を株主総会に反映するため"}, {"aspect": "原則", "text": "会社が株主の議決権不統一行使を拒むことができないのは「他人のために株式を有する者」（313条3項）"}, {"aspect": "条文", "text": "313条"}], "articles": ["313条"], "pages": [37]}, {"id": "book-kigyoho-01-ch02-r020", "ch": 2, "topic": "株主総会の決議の省略（319条）", "points": [{"aspect": "原則", "text": "制度の所在：株主総会の決議の省略は319条。取締役会の決議の省略（370条）が参照される"}, {"aspect": "条文", "text": "319条・370条"}], "articles": ["319条", "370条"], "pages": [37]}, {"id": "book-kigyoho-01-ch02-r021", "ch": 2, "topic": "利益供与の禁止（120条1項）の要件とあてはめ", "points": [{"aspect": "原則", "text": "120条1項：株式会社は、①何人に対しても、②株主の権利等の行使に関し、③財産上の利益の供与（当該株式会社又はその子会社の計算においてするものに限る）をしてはならない"}, {"aspect": "要件", "text": "要件②「株主の権利の行使に関して」は行使・不行使の両方を含む。権利の例：議決権（105条1項3号）、質問権（314条）、株主提案権（303条〜305条）、代表訴訟提起権（847条）等"}, {"aspect": "条文", "text": "120条・105条・314条・303条・305条・847条"}], "articles": ["120条", "105条", "314条", "303条", "305条", "847条"], "pages": [38]}, {"id": "book-kigyoho-01-ch02-r022", "ch": 2, "topic": "利益供与の禁止の趣旨と120条2項の推定", "points": [{"aspect": "趣旨", "text": "利益供与の禁止の趣旨：①会社財産の浪費防止、②（総会屋を根絶して）株主総会の議事運営の適正化、企業経営の健全確保のため"}, {"aspect": "原則", "text": "120条2項の推定：特定の株主に対して無償で財産上の利益の供与をしたときは「株主の権利の行使に関し」供与したものと推定する。有償でも会社・子会社の受けた利益が著しく少ないときも同様"}, {"aspect": "条文", "text": "120条"}], "articles": ["120条"], "pages": [39]}, {"id": "book-kigyoho-01-ch02-r023", "ch": 2, "topic": "関与取締役等の支払義務（120条4項）と会社法施行規則21条", "points": [{"aspect": "原則", "text": "120条4項の責任の区別：利益供与を「した」取締役（執行役）は無過失責任、利益供与に「関与した」取締役（執行役）は過失責任"}, {"aspect": "原則", "text": "120条4項の「法務省令」は会社法施行規則21条。実際契約を締結したX1は同規則21条1号、取締役会決議に賛成したX2は同規則21条2号イの「決議に賛成した取締役」にあたる。同規則21条は重要で読めるようにすべき"}, {"aspect": "あてはめ", "text": "関連事項の所在：120条5項（免除）、970条（株主等の権利の行使に関する利益供与の罪：3年以下の懲役、300万円以下の罰金）。重要判例として蛇の目ミシン株主代表訴訟事件（最判平18・4・10）とモリテックス事件（東京地判平19・12・6）が後述として挙げられる"}, {"aspect": "条文", "text": "120条・21条・970条"}], "articles": ["120条", "21条", "970条"], "pages": [39, 40]}, {"id": "book-kigyoho-01-ch02-r024", "ch": 2, "topic": "（論点）従業員持株制度と利益供与の禁止", "points": [{"aspect": "結論", "text": "従業員持株制度に基づいて既に株式を有する従業員に奨励金を支給する場合は、120条2項で「株主の権利行使に関し」と推定され、他の要件を満たせば利益供与にあたってしまう"}, {"aspect": "結論", "text": "推定を覆す方法：従業員持株制度の目的が従業員の財産形成という福利厚生の一環、勤労意欲の向上であることを立証できれば、「株主の権利行使に関し」という要件の推定は覆される"}, {"aspect": "あてはめ", "text": "推定を覆す立証では「安定株主の形成」という面を強調しない"}, {"aspect": "条文", "text": "120条"}], "articles": ["120条"], "pages": [41]}, {"id": "book-kigyoho-01-ch02-r025", "ch": 2, "topic": "利益供与の返還請求の設例（問題1・問題2）", "points": [{"aspect": "原則", "text": "120条3項：1項の規定に違反して財産上の利益の供与をしたときは、利益の供与を受けた者はこれを当該株式会社又はその子会社に返還しなければならない（引換え給付をしたものがあるときはその返還を受けることができる）"}, {"aspect": "あてはめ", "text": "注意：Cが乙社に土地2に相当する対価を支払っていたとしても、土地を買えるということ自体が「利益」の供与を受けたといえる"}, {"aspect": "条文", "text": "120条・362条・105条"}], "articles": ["120条", "362条", "105条"], "pages": [42, 43]}, {"id": "book-kigyoho-01-ch02-r026", "ch": 2, "topic": "取締役等の説明義務（314条）と株主の質問権", "points": [{"aspect": "原則", "text": "314条：取締役、会計参与、監査役及び執行役は、株主総会において株主から特定の事項について説明を求められた場合には、当該事項について必要な説明をしなければならない（ただし、総会の目的事項に関しない場合、株主の共同の利益を著しく害する場合その他法務省令で定める正当な理由がある場合を除く）"}, {"aspect": "原則", "text": "一括回答とは、株主総会に先だって多数の質問状が出されている場合（いわゆる事前質問）に、会社側が事前質問事項のうち必要と思われるものにつき、株主からの質問を待つことなく株主総会であらかじめ一括して説明・回答すること"}, {"aspect": "要件", "text": "説明義務の要件は、①株主総会において株主から特定の事項について説明を求められたこと、②ただし書き列挙事由にあたらないこと。効果は必要な説明義務の発生"}, {"aspect": "結論", "text": "説明義務違反の効果：必要な説明がなく株主総会決議がなされたときは「決議方法の法令違反」という取消原因になる（831条1項1号）"}, {"aspect": "結論", "text": "一括回答の適法性：株主総会において株主からの質問がなされていない以上、要件①を満たさず取締役等に必要な説明義務はそもそも発生していないため、一括回答をしても314条違反はなく、決議取消しの訴えは認められない"}, {"aspect": "結論", "text": "（論点）「必要な説明」の程度：平均的な株主が、議題について合理的な理解・判断をするために客観的に必要と認められる程度で足りる（東京地判平成16・5・13）"}, {"aspect": "条文", "text": "314条・71条・831条"}], "articles": ["314条", "71条", "831条"], "pages": [44, 45]}, {"id": "book-kigyoho-01-ch02-r027", "ch": 2, "topic": "株主総会の決議の成立要件（309条）", "points": [{"aspect": "原則", "text": "決議の種類：普通決議（309条1項）、特別決議（309条2項）、特殊決議I（309条3項。1号は公開会社を非公開会社にする定款変更）、特殊決議II（309条4項）"}, {"aspect": "原則", "text": "309条5項：取締役会設置会社においては株主総会は、株主総会の目的たる事項（議題）以外の事項については議決できない"}, {"aspect": "あてはめ", "text": "特殊決議II（309条4項）を使うのは「第百九条第二項の規定による定款の定めについての定款の変更」の場合のみ。暗記を"}, {"aspect": "条文", "text": "309条・109条"}], "articles": ["309条", "109条"], "pages": [46]}, {"id": "book-kigyoho-01-ch02-r028", "ch": 2, "topic": "種類株主総会（322条・324条2項）", "points": [{"aspect": "原則", "text": "種類株主に損害を及ぼすおそれがあれば、322条・324条2項の種類株主総会の特別決議が必要"}, {"aspect": "要件", "text": "例外とその要件：種類株主に損害を及ぼすおそれがあるときでも種類株主総会決議を不要とする旨の定款規定を定めることができる（322条2項）が、その定款を定めるためには当該種類株主全員の同意が必要である（322条4項）"}, {"aspect": "結論", "text": "代償措置：不要とする定款がある場合で種類株主に損害を及ぼすおそれがあるときは、代わりに反対株主の株式買取請求権が認められている（116条1項3号）"}, {"aspect": "条文", "text": "322条・324条・116条"}], "articles": ["322条", "324条", "116条"], "pages": [47]}, {"id": "book-kigyoho-01-ch02-r029", "ch": 2, "topic": "取締役会非設置会社の機関構造と株主総会の権限（295条・348条・349条）", "points": [{"aspect": "原則", "text": "295条1項：株主総会は、会社法に規定する事項及び会社の組織・運営・管理その他会社に関する一切の事項について決議できる"}, {"aspect": "原則", "text": "348条3項：各取締役に意思決定を委任できない事項がある（cf. 362条4項）"}, {"aspect": "原則", "text": "349条4項5項は包括的不可制限的代表権を定める（後述）。取締役会設置会社でも同様"}, {"aspect": "条文", "text": "295条・348条・349条・362条"}], "articles": ["295条", "348条", "349条", "362条"], "pages": [48]}, {"id": "book-kigyoho-01-ch02-r030", "ch": 2, "topic": "取締役の選任（329条1項・341条・342条）", "points": [{"aspect": "原則", "text": "取締役の選任は株主総会の普通決議による（329条1項、341条）。309条1項の決議ではない"}, {"aspect": "原則", "text": "累積投票による取締役の選任（342条）"}, {"aspect": "条文", "text": "329条・341条・309条・342条"}], "articles": ["329条", "341条", "309条", "342条"], "pages": [49]}, {"id": "book-kigyoho-01-ch02-r031", "ch": 2, "topic": "取締役の解任（339条）と解任を争う方法", "points": [{"aspect": "原則", "text": "339条1項：役員及び会計監査人は、いつでも、株主総会の決議によって解任することができる"}, {"aspect": "原則", "text": "339条2項：解任された者は、正当な理由がある場合を除き、会社に対し、解任によって生じた損害の賠償を請求できる"}, {"aspect": "要件", "text": "339条2項の損害賠償請求の要件（①株主総会の普通決議により解任された者であること、②解任について「正当な理由」がないこと）と効果（解任によって生じた損害賠償請求の発生）"}, {"aspect": "あてはめ", "text": "論文試験で「解任」とくれば、339条と854条を考える"}, {"aspect": "あてはめ", "text": "解任自体を争いたい場合は、株主総会決議取消しの訴え（831条1項）、決議不存在・無効確認の訴え（830条1項2項）で争う"}, {"aspect": "条文", "text": "339条・854条・831条・830条"}], "articles": ["339条", "854条", "831条", "830条"], "pages": [49]}, {"id": "book-kigyoho-01-ch02-r032", "ch": 2, "topic": "（論点）解任について「正当な理由」がないとは", "points": [{"aspect": "趣旨", "text": "339条2項の趣旨は、株主は役員等を自由に解任できるので（同条1項）、せめて役員等の経済的利益は広く救済しようとするもの"}, {"aspect": "結論", "text": "「正当な理由」がないとは、当該役員等に経営等を行わせしめるに当たって障害となるべき状況が客観的に生じた場合でないことをいう"}, {"aspect": "条文", "text": "339条"}], "articles": ["339条"], "pages": [49]}, {"id": "book-kigyoho-01-ch02-r033", "ch": 2, "topic": "（論点）339条2項の「損害」とは", "points": [{"aspect": "趣旨", "text": "339条2項の趣旨から、「正当な理由がないこと」は広く考える（「正当な理由」は狭く解する）。「損害」は残存在任期間分の報酬や退職金などの喪失と解する"}, {"aspect": "結論", "text": "「損害」とは、解任されなければ得られたであろう残りの在任期間中の利益の喪失を意味する"}, {"aspect": "条文", "text": "339条"}], "articles": ["339条"], "pages": [50]}, {"id": "book-kigyoho-01-ch02-r034", "ch": 2, "topic": "取締役会の権限構造と専決事項（362条4項）", "points": [{"aspect": "原則", "text": "362条4項本文：取締役会は、次に掲げる事項その他の重要な業務執行の決定を取締役に委任することができない"}, {"aspect": "原則", "text": "362条4項1号：重要な財産の処分及び譲受け"}, {"aspect": "原則", "text": "362条4項2号：多額の借財"}, {"aspect": "原則", "text": "362条4項3号：支配人その他の重要な使用人の選任及び解任"}, {"aspect": "原則", "text": "362条4項4号：支店その他の重要な組織の設置、変更及び廃止（五号以下はレジュメで省略）"}, {"aspect": "あてはめ", "text": "「甲会社が保有する乙株式の譲渡を行った」「子会社株式の譲渡を行った」とあれば、362条4項1号の「処分」にあたるので、「重要」の要件を満たすかを考える"}, {"aspect": "あてはめ", "text": "「甲社が借入した。」「甲社が乙社の債務を保証した。」とあれば、362条4項2号の「借財」にあたるので、「多額」の要件を満たすかを考える"}, {"aspect": "条文", "text": "362条・363条・349条"}], "articles": ["362条", "363条", "349条"], "pages": [51, 52]}, {"id": "book-kigyoho-01-ch02-r035", "ch": 2, "topic": "（論点）362条4項1号の「重要」の意義（判断基準）", "points": [{"aspect": "趣旨", "text": "362条4項1号が取締役会決議を要求した趣旨は、これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである"}, {"aspect": "結論", "text": "「重要な財産の処分」に該当するかは、当該財産の価額、その会社の総資産に占める割合、当該財産の保有目的、処分行為の態様及び会社における従来の取扱いの事情を総合的に考慮して判断すべき"}, {"aspect": "結論", "text": "上記の判断基準は最判平成6・1・20の立場である"}, {"aspect": "あてはめ", "text": "「処分行為の態様」とは会社の事業のため通常行われる取引かどうか等。実務上、取締役会規則（内規）で「○○円以上の△の譲渡であれば取締役会の決議を要する」と定められていることが多く、「会社における従来の取扱い」のあてはめで使える事情である"}, {"aspect": "あてはめ", "text": "実務では総資産の1％を超える財産の処分を「重要な」財産の処分と考える立場もあるが、判例は1.6％ということのみを判断要素としたわけではない"}, {"aspect": "条文", "text": "362条"}], "articles": ["362条"], "pages": [53, 54]}, {"id": "book-kigyoho-01-ch02-r036", "ch": 2, "topic": "問題提起の書き方①・③", "points": [{"aspect": "あてはめ", "text": "問題提起の書き方①：A「法は、○○と規定している。しかし本問では、○○はない。そこで、……が問題となる。」B「本問では、……。そこで、……が問題となる。」"}, {"aspect": "あてはめ", "text": "「そこで、……が問題となる。」の部分の多くは「論点名」が入る。論証を覚える際には、論点名も覚えるべきである"}, {"aspect": "あてはめ", "text": "問題提起の書き方③：[問題]が「上記○○を行うには、取締役会決議が必要か論じなさい」であれば、オウム返しの問題提起も有効となる"}, {"aspect": "設例", "text": "書き方③の例：取締役会決議が必要かどうかは、上記○○が重要な財産の処分（362条4項1号）にあたるかによる"}, {"aspect": "条文", "text": "362条"}], "articles": ["362条"], "pages": [53]}, {"id": "book-kigyoho-01-ch02-r037", "ch": 2, "topic": "（論点）362条4項2号の「多額」の意義", "points": [{"aspect": "趣旨", "text": "362条4項2号が取締役会決議を要求した趣旨は、これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである"}, {"aspect": "結論", "text": "「多額の借財」に該当するかは、当該借財の額、その会社の資産・経常利益等に占める割合、借財の目的及び会社における従来の取扱い等の事情を総合的に考慮して判断すべき"}, {"aspect": "結論", "text": "上記の判断基準は東京地判平成9・3・17に基づく"}, {"aspect": "条文", "text": "362条"}], "articles": ["362条"], "pages": [54]}, {"id": "book-kigyoho-01-ch02-r038", "ch": 2, "topic": "取締役会の招集手続（368条）", "points": [{"aspect": "原則", "text": "368条1項：取締役会を招集する者は、取締役会の日の一週間（定款で下回る期間を定めた場合はその期間）前までに、各取締役（監査役設置会社にあっては各取締役及び各監査役）に対して通知を発しなければならない"}, {"aspect": "原則", "text": "368条2項：取締役（監査役設置会社にあっては取締役及び監査役）の全員の同意があるときは、招集の手続を経ることなく開催することができる"}, {"aspect": "原則", "text": "株主総会の招集通知（299条）との比較が重要。368条2項は300条と同趣旨であり比較を要する"}, {"aspect": "条文", "text": "368条・299条・300条"}], "articles": ["368条", "299条", "300条"], "pages": [55]}, {"id": "book-kigyoho-01-ch02-r039", "ch": 2, "topic": "取締役会決議の瑕疵 [A]（論点）一般論", "points": [{"aspect": "結論", "text": "取締役会については瑕疵ある決議の効力について会社法は特別の規定を置いていない。そこで、一般原則に従い、取締役会決議に瑕疵ある場合は当該決議は無効と解する"}, {"aspect": "あてはめ", "text": "「取締役会の決議の効力について論じなさい。」とくれば、[B-1]、[B-2]、[C]でなければ、通常[A]を書くことになる"}, {"aspect": "あてはめ", "text": "事例問題の場合は、瑕疵＝何条違反あるかを、その後あてはめで書くことになる"}], "articles": [], "pages": [56]}, {"id": "book-kigyoho-01-ch02-r040", "ch": 2, "topic": "[B-1]（論点）一部取締役への招集通知を欠く場合の取締役会決議の効力", "points": [{"aspect": "原則", "text": "取締役会の招集通知は取締役全員に発する必要がある（368条1項）"}, {"aspect": "原則", "text": "名目的取締役とは、取締役としての選任手続は経ているが、本人も会社・債権者もそのものが取締役として職務を果たすことを期待・予定していない者をいう。最判昭和44年は名目的取締役への招集通知を欠く事案を、決議の結果に影響を及ぼさない特段の事情があるとして、例外的に取締役会決議を有効とした"}, {"aspect": "結論", "text": "取締役会決議に瑕疵がある場合の効力については、株主総会決議に瑕疵がある場合と異なって特別の規定がないので、原則、無効と解する"}, {"aspect": "結論", "text": "例外的に、招集通知を欠缺された取締役が出席しても決議の結果に影響を及ぼさない特段の事情がある場合には有効と解する。そのような場合にまで無効とするのは、あまりにも形式的であり、法的安定性を害するからである"}, {"aspect": "結論", "text": "上記の立場は最判昭和44・12・2の立場である"}, {"aspect": "条文", "text": "368条"}], "articles": ["368条"], "pages": [56]}, {"id": "book-kigyoho-01-ch02-r041", "ch": 2, "topic": "[B-2]（論点）監査役への取締役会招集通知の欠缺がある場合の取締役会決議の効力", "points": [{"aspect": "趣旨", "text": "監査役に取締役会出席義務を課した趣旨は、監査役に業務執行の状況を正確に把握させ、業務監査権（381条1項）を適切に行使させることにある"}, {"aspect": "原則", "text": "監査役には取締役会への出席義務・意見陳述義務があるから（383条1項）、取締役会の招集通知は監査役にも発する必要がある（368条1項）"}, {"aspect": "結論", "text": "監査役には取締役会に出席すること自体が保障されなければならない。したがって、監査役に対する招集通知を欠く場合は取締役会決議は常に無効になると解する"}, {"aspect": "結論", "text": "この論点について判例は存在しない"}, {"aspect": "条文", "text": "383条・368条・381条"}], "articles": ["383条", "368条", "381条"], "pages": [57]}, {"id": "book-kigyoho-01-ch02-r042", "ch": 2, "topic": "特別利害関係取締役（369条2項）の意義・効果と具体例", "points": [{"aspect": "趣旨", "text": "特別利害関係を有する取締役は、公正な議決権行使が期待できないため、議決に加わることができないとされる"}, {"aspect": "原則", "text": "369条2項：前項の決議について特別の利害関係を有する取締役は、議決に加わることができない"}, {"aspect": "原則", "text": "株主総会の場合は、「特別の利害関係を有する者が議決権を行使したことによって、著しく不当な決議がされたとき」が決議取消事由となる（831条1項3号）。相違の理由は、株主は会社の実質的所有者、取締役は受任者（会社と委任関係）である点にある"}, {"aspect": "原則", "text": "特別利害関係を有する取締役とは、会社に対する忠実義務に違反するおそれがあり、取締役会の決議の公正を害するおそれがある取締役をいう"}, {"aspect": "原則", "text": "取締役会で代表取締役を選定する場合の対象取締役は、特別利害関係取締役ではない"}, {"aspect": "結論", "text": "「議決に加わることができない」とは、定足数に入れないと解し、審議に加わることもできないと解する"}, {"aspect": "条文", "text": "369条・831条・356条・365条・139条・426条"}], "articles": ["369条", "831条", "356条", "365条", "139条", "426条"], "pages": [58, 62]}, {"id": "book-kigyoho-01-ch02-r043", "ch": 2, "topic": "（論点1）解職決議の対象である代表取締役は特別利害関係取締役か", "points": [{"aspect": "趣旨", "text": "特別利害関係取締役の議決権行使を制限した趣旨は、決議に特別利害関係を有する取締役が一切の私心を捨て去って会社に対する忠実義務（355条）を果たすことは期待できないので、最初から議決に参加すらできないようにして、決議の公正を確保することにある"}, {"aspect": "原則", "text": "代表取締役の「選定」の場合、選定対象の取締役は特別利害関係取締役でない"}, {"aspect": "結論", "text": "解職決議の対象である代表取締役は自己の保身を考えるのが通常であり、会社のために忠実義務を果たすことは期待できず、決議の公正を確保できない。したがって、解職決議の対象である代表取締役本人は特別利害関係取締役にあたると解する"}, {"aspect": "結論", "text": "上記の立場は最判昭和44・3・28の立場である"}, {"aspect": "結論", "text": "（参考論証）特別利害関係があるとは、当該取締役が当該決議について会社の利益と衝突する個人的な利害関係を有し、忠実義務違反のおそれがあることをいう"}, {"aspect": "条文", "text": "355条"}], "articles": ["355条"], "pages": [59]}, {"id": "book-kigyoho-01-ch02-r044", "ch": 2, "topic": "（論点2）特別利害関係取締役が参加した取締役会の決議の効力", "points": [{"aspect": "結論", "text": "特別利害関係取締役が議決に参加して議決権を行使した場合であっても、当該取締役を除外してもなお決議の成立に必要な多数が存在するときは、その効力は否定されないと解する"}, {"aspect": "結論", "text": "上記の立場は最判平28・1・22の判例に基づく（見出しに明示）"}, {"aspect": "あてはめ", "text": "最判昭和44・12・2との整合性：「決議の成立に必要な多数が存在すること」が最判昭和44・12・2の「特段の事情」にあたるとすると、最判平28・1・22と最判昭和44・12・2は整合する"}], "articles": [], "pages": [60]}, {"id": "book-kigyoho-01-ch02-r045", "ch": 2, "topic": "特別利害関係取締役の短文論述（利益相反取締役を素材とする論述①〜③）", "points": [{"aspect": "設例", "text": "論述①：Aは、利益相反取引を行っている取締役であるから、「特別の利害関係を有する取締役」（369条2項）にあたる"}, {"aspect": "あてはめ", "text": "論述①の「〜から」とあるが、これでは理由になっていない。ただ、ほぼ争いのないこと、会計士受験生のレベルから上記論述でも合格している"}, {"aspect": "設例", "text": "論述②：利益相反取引を行うAが議決権行使できるとすると、取締役会決議の公正が害され会社の利益を損なうおそれがあるから、利益相反を行うAは「特別の利害関係を有する取締役」（369条2項）にあたる"}, {"aspect": "設例", "text": "論述③：取締役会の決議の公正さを担保し、会社の利益を保護するという369条2項の趣旨からすると、同条項の特別利害関係取締役とは取締役会の決議の公正を害し会社の利益を損なうおそれがある取締役と解するところ、Aは会社と利益相反取引を行おうとしているのであるから、取締役会の決議の公正を害し会社の利益を損なうおそれがあるといえる。したがって、Aは「特別の利害関係を有する取締役」（369条2項）にあたる"}, {"aspect": "あてはめ", "text": "趣旨→規範（基準、定義）→あてはめの順で書く論述③が一番いい。答案スペースがない、メインではない場合には論述②も書けるようにする"}, {"aspect": "条文", "text": "139条・365条・426条・369条"}], "articles": ["139条", "365条", "426条", "369条"], "pages": [61]}, {"id": "book-kigyoho-01-ch02-r046", "ch": 2, "topic": "（問題）Cが369条2項の「特別の利害関係を有する取締役」か", "points": [{"aspect": "設例", "text": "（あてはめ）決議の対象は代表取締役Aの解職であるから、会社に対する忠実義務に違反するおそれがあり、取締役会の決議の公正を害するおそれがある取締役はAであってCではない。したがって、Cは特別の利害関係を有する取締役にあたらない"}], "articles": [], "pages": [63]}, {"id": "book-kigyoho-01-ch02-r047", "ch": 2, "topic": "特別利害関係株主（831条1項3号）と取締役・株主の視点の相違", "points": [{"aspect": "原則", "text": "視点の相違：取締役は会社の受任者であるから会社と利害関係を有する取締役かどうかが問題となる。株主は会社の実質的所有者であり、会社の損害＝株主の損害なので、会社と利害関係があるかを問題にするのではなく、他の株主と利害関係がある株主かどうかが問題となる"}, {"aspect": "原則", "text": "831条1項3号の取消原因：①株主総会等の決議について特別の利害関係を有する者が②議決権を行使したことによって、著しく不当な決議がされたとき"}, {"aspect": "原則", "text": "「特別利害関係を有する」株主の定義：ある議案について他の株主とは異なる特殊な利益を得たり、他の株主が受ける不利益を免れる者（弘文堂「会社法」）、決議の結果について、他の株主とは異なる共通しない利害を有する者（東京大学出版会「会社法」）、株主としての資格と関係ない個人的な利害関係を有する株主（CPAレギュラーテキスト）"}, {"aspect": "結論", "text": "「著しく不当」とは多数決濫用で判断する"}, {"aspect": "条文", "text": "831条"}], "articles": ["831条"], "pages": [62, 64]}, {"id": "book-kigyoho-01-ch02-r048", "ch": 2, "topic": "取締役会決議に関するその他の制度（369条5項・370条・373条）", "points": [{"aspect": "趣旨", "text": "特別取締役制度の趣旨は、監督機能の強化とひきかえに、迅速な意思決定を可能にするためである"}, {"aspect": "原則", "text": "取締役会議事録に異議をとどめないものは、決議に賛成したものと推定する（369条5項）"}, {"aspect": "原則", "text": "取締役会決議の省略（370条）。cf. 株主総会決議の省略（319条）"}, {"aspect": "要件", "text": "373条1項：取締役会設置会社（委員会設置会社を除く。）が要件のいずれにも該当する場合には、取締役会は、362条4項1号及び2号に掲げる事項についての取締役会の決議については、あらかじめ選定した三人以上の取締役（特別取締役）のうち、議決に加わることができるものの過半数が出席し、その過半数をもって行うことができる旨を定めることができる"}, {"aspect": "要件", "text": "373条1項の要件：一 取締役の数が六人以上であること、二 取締役のうち一人以上が社外取締役であること"}, {"aspect": "条文", "text": "369条・370条・319条・373条・362条"}], "articles": ["369条", "370条", "319条", "373条", "362条"], "pages": [65]}, {"id": "book-kigyoho-01-ch02-r049", "ch": 2, "topic": "代表取締役の権限の全体像（349条4項・5項）", "points": [{"aspect": "原則", "text": "代表取締役の権限は、a）一定の事項についての意思決定権、b）業務執行権（対内的、363条1項1号）、c）代表権（対外的、349条）からなる"}, {"aspect": "原則", "text": "349条4項：代表取締役は、株式会社の業務に関する一切の裁判上又は裁判外の行為をする権限を有する"}, {"aspect": "原則", "text": "349条5項：前項の権限に加えた制限は、善意の第三者に対抗することができない"}, {"aspect": "原則", "text": "「前項の権限に加えた制限」とは、取締役会規則（単に内規とよばれることもある）や定款により代表取締役の権限に加えた制限（内部的制限）である"}, {"aspect": "結論", "text": "意思決定権について、代表取締役は、①取締役会から委任された事項について決定できる（362条4項柱書参照）。また、②選定された以上当然に、日常的細目的事項についても代表取締役は決定できると解する"}, {"aspect": "結論", "text": "349条5項の「善意」とは、善意・無重過失と解する（有力説）"}, {"aspect": "あてはめ", "text": "論文問題で、「取締役会規則」・「内規」などで代表取締役の権限を制限していれば、349条5項の問題か考えてみる"}, {"aspect": "条文", "text": "363条・349条・362条"}], "articles": ["363条", "349条", "362条"], "pages": [66]}, {"id": "book-kigyoho-01-ch02-r050", "ch": 2, "topic": "（問題）取締役会規則による事前承認を欠く保証と349条5項", "points": [{"aspect": "原則", "text": "「対抗」とは、発生している法律事実や法律効果を、第三者に「主張」できない（できる）の問題をいう"}, {"aspect": "結論", "text": "「重過失は悪意と同視する」（判例法理）：判例は、354条、9条、14条（商法25条）の適用において、重過失のある第三者は悪意と同視されるとして、第三者の保護を否定する。第三者の悪意は直接証明が難しいこと、第三者が容易に知り得た場合保護に値しないことが理由と考えられる"}, {"aspect": "条文", "text": "349条・354条・9条・14条・25条"}], "articles": ["349条", "354条", "9条", "14条", "25条"], "pages": [67]}, {"id": "book-kigyoho-01-ch02-r051", "ch": 2, "topic": "（比較問題）保証金額が総資産の15％を超える場合に事前承認を要する事案", "points": [{"aspect": "あてはめ", "text": "「甲社が借入した。」「甲社が乙社の債務を保証した。」とあれば、362条4項2号の「借財」にあたるので、「多額」の要件を満たすかを考える。その際に、取締役会規則（内規）が「従来の取扱い」という362条4項2号の「多額」の意義の考慮要素のあてはめで使うことになる"}, {"aspect": "条文", "text": "362条"}], "articles": ["362条"], "pages": [68]}, {"id": "book-kigyoho-01-ch02-r052", "ch": 2, "topic": "取締役会規則（内規）の使い方の2パターン", "points": [{"aspect": "原則", "text": "内規の使い方は2パターン：①1億円の借財（＝保証など）は「多額」の借財かどうかが問題となるので、その考慮要素の「従来の取扱い」で取締役会規則（内規）を書く（362条4項2号の問題）。②50万円の借財（＝保証など）は明らかに多額の借財ではないので362条4項2号の問題にしない。ただ、取締役会規則（内規）違反があれば、349条5項の問題になる"}, {"aspect": "あてはめ", "text": "「8000万円以上の借財をする場合は、取締役会の承認を要する」という内規がある会社で1億円の借財をすることは、(i)内規が「従来の取扱い」を示していると考え「多額」の借財の問題とし、取締役会の承認がない場合は362条4項2号違反の問題と、(ii)内規違反があるので349条5項の問題ということが考えられる。しかし、この場合判例は（ii）は考えていないようである"}, {"aspect": "条文", "text": "362条・349条"}], "articles": ["362条", "349条"], "pages": [69]}, {"id": "book-kigyoho-01-ch02-r053", "ch": 2, "topic": "（論点）-a 362条4項で要求される決議を欠く代表取締役の行為の効力", "points": [{"aspect": "原則", "text": "「知り又は知り得べかりしとき」とは、悪意又は有過失のことである"}, {"aspect": "結論", "text": "代表取締役が取締役会の決議を経ないでした重要な業務執行に該当する取引も、内部的な意思決定を欠くにすぎないから、原則として有効であり、取引の相手方が取締役会の決議を経ていないことを知り又は知り得べかりしときに限り無効になると解する"}, {"aspect": "結論", "text": "上記の立場は最判昭和40・9・22の立場である（「重要な財産の処分」に関する判例）"}, {"aspect": "条文", "text": "93条"}], "articles": ["93条"], "pages": [70]}, {"id": "book-kigyoho-01-ch02-r054", "ch": 2, "topic": "（論点）-b 無効の主張権者（会社以外のものも無効主張できるか）", "points": [{"aspect": "趣旨", "text": "362条4項が重要な業務執行についての決定を取締役会の決議事項と定めたのは、代表取締役への権限の集中を抑制し、取締役相互の協議による結論に沿った業務の執行を確保することによって会社の利益を保護しようとする趣旨に出たものと解される"}, {"aspect": "結論", "text": "代表取締役が取締役会の決議を経ないで重要な業務執行に該当する取引をした場合、その無効は、原則として会社のみが主張することができ、会社以外の者は、当該会社の取締役会が上記無効を主張する旨の決議をしているなどの特段の事情がない限り、これを主張することはできないと解する"}, {"aspect": "結論", "text": "上記の立場は最判平成21・4・17の立場である"}, {"aspect": "条文", "text": "362条"}], "articles": ["362条"], "pages": [71]}, {"id": "book-kigyoho-01-ch02-r055", "ch": 2, "topic": "（論点）表見代表取締役（354条）の要件", "points": [{"aspect": "原則", "text": "原則：代表権のない取締役が会社を代表して行為をしても、それは無権代表行為であって、その効果は会社に帰属しない（効果不帰属）"}, {"aspect": "原則", "text": "354条：株式会社は、①代表取締役以外の取締役に社長、副社長その他株式会社を代表する権限を有するものと認められる名称を②付した場合には、当該取締役がした行為について、③善意の第三者に対してその責任を負う"}, {"aspect": "要件", "text": "354条の要件は、①（虚偽の外観の存在）②（本人の帰責性、外観への与因）③（外観への信頼）である"}, {"aspect": "条文", "text": "354条"}], "articles": ["354条"], "pages": [72]}, {"id": "book-kigyoho-01-ch02-r056", "ch": 2, "topic": "表見代表取締役の解答例にみる論点群（「付した」・「善意」・354条と908条1項の関係）", "points": [{"aspect": "結論", "text": "（論点）354条の「付した」には黙示の許諾も含む。黙示に許諾とは、取締役が一人でもその名称の使用を知っていれば足りると解する。取締役が一人でも知っていれば取締役会を招集でき（366条）、外観作出を阻止できたからである"}, {"aspect": "結論", "text": "（論点）354条の「善意」は、重過失は悪意と同視しうることから、善意・無重過失を意味する"}, {"aspect": "結論", "text": "（論点）354条と908条1項の関係：354条の適用場面がほとんどなく同条が無意味になってしまうのを避けるため、354条は908条1項の例外規定と考え、354条が908条1項に優先して適用されると解する"}, {"aspect": "条文", "text": "354条・366条・908条"}], "articles": ["354条", "366条", "908条"], "pages": [73]}, {"id": "book-kigyoho-01-ch02-r057", "ch": 2, "topic": "問題提起の書き方②と「信じた」のあてはめ", "points": [{"aspect": "あてはめ", "text": "「例外」を問う問題は「原則」から書く。問題提起の書き方②：原則→不都合→例外が認められるか？結論（文末）は「問いの形式」に合わすこと"}, {"aspect": "あてはめ", "text": "乙は、Cに代表権があると「信じた」→知らなかったから「信じた」のだから、善意。しかし、不注意で知らなかったかは不明なので、無過失かは不明。つまり、「信じた」とくれば、善意だけど無過失かは不明"}], "articles": [], "pages": [74]}, {"id": "book-kigyoho-01-ch02-r058", "ch": 2, "topic": "登記に関する原則（908条1項）と悪意擬制", "points": [{"aspect": "原則", "text": "「正当な事由」とは、災害等による登記所閉鎖や交通遮断等の客観的障碍によって登記を閲覧しえない場合をいう"}, {"aspect": "原則", "text": "908条1項：この法律の規定により登記すべき事項は、登記の後でなければ、これをもって善意の第三者に対抗することができない。登記の後であっても、第三者が正当な事由によってその登記があることを知らなかったときは、同様とする"}, {"aspect": "結論", "text": "登記前→会社は、善意の第三者に対抗できない（908条1項前段）。登記後→会社は、善意の第三者にも対抗できる。つまり、第三者は善意でも登記後は悪意とみなされる（悪意擬制）（解釈、908条1項）"}, {"aspect": "あてはめ", "text": "論文問題で、「登記」と見たら⇒908条、911条3項"}, {"aspect": "条文", "text": "908条・911条"}], "articles": ["908条", "911条"], "pages": [75]}, {"id": "book-kigyoho-01-ch02-r059", "ch": 2, "topic": "354条と908条の関係（ケース1〜ケース4）", "points": [{"aspect": "あてはめ", "text": "論文問題で「登記」と見たら、908条、911条3項を使う。取締役等の退任なら915条（変更登記）、支配人なら918条（支配人の登記）。登記がらみの問題は、まず908条から考える"}, {"aspect": "設例", "text": "ケース1：代表取締役を辞任して平取締役になったAが、辞任登記未了の間に、代表取締役名義で会社の日常業務に属する売買契約を乙会社（売主）と締結した事案。→908条1項前段で処理。辞任登記（911条3項14号、915条）前と考え、甲会社は、善意の第三者（乙会社）に対抗できない"}, {"aspect": "設例", "text": "ケース2：辞任登記後に、代表取締役名義で売買契約を締結した事案。→登記後は悪意擬制（908条1項）となり、第三者は「正当な事由」がなければ保護されず取引の安全を害する。そこで、354条（表見代表取締役）は908条1項後段（前段）の例外規定と考える。354条の要件を満たせば、第三者は保護される"}, {"aspect": "あてはめ", "text": "ケース1で354条を使わないのは、354条を使うまでもなく、善意の第三者は保護されるからである"}, {"aspect": "設例", "text": "ケース3：取締役Aは代表取締役でないにもかかわらず、甲会社がAを代表取締役と登記した後に、Aが代表取締役名義で売買契約を乙会社（売主）と締結した事案。→908条2項（不実の登記）で処理。会社は、善意の第三者に対抗できない"}, {"aspect": "設例", "text": "ケース4：取締役Aは代表取締役でないにもかかわらず、代表取締役名義で売買契約を締結した事案（登記簿に虚偽記載なく、登記簿上もAは代表取締役ではない）。→正しく「登記後」の話なので、ケース2と同じく354条で処理する問題である"}, {"aspect": "条文", "text": "908条・911条・915条・918条・354条"}], "articles": ["908条", "911条", "915条", "918条", "354条"], "pages": [76, 77]}, {"id": "book-kigyoho-01-ch02-r060", "ch": 2, "topic": "登記の論証例（ケース1・ケース3）", "points": [{"aspect": "あてはめ", "text": "論述の書き方は、抽象（要件・条文）→具体（あてはめ）の順である"}, {"aspect": "設例", "text": "ケース1の論証例：登記すべき事項は、登記の後でなければ、これをもって善意の第三者に対抗することができない（908条1項前段）。本問において、……は登記すべき事項であるのに（911条3項○号）、登記がなされていない。そして、相手方乙は…なので、善意といえる。したがって、甲社は乙に対抗できず、乙は甲社に…を主張できる"}, {"aspect": "設例", "text": "ケース3の論証例：故意又は過失によって不実の事項を登記した者は、その事項が不実であることをもって善意の第三者に対抗することができない（908条2項）。本問において、………は不実である。……なので、甲社に故意（or過失）が認められる。そして、……なので、乙は善意といえる。したがって、甲社は乙に対抗できず、乙は甲社に…を主張できる"}, {"aspect": "設例", "text": "ケース3別論証：908条2項の要件は、①登記事項が不実であること、②登記者に故意・過失があること、③第三者が善意であることである。本問において、代表取締役は登記事項であるところ（911条3項14号）、Aは適法に取締役会決議で代表取締役に選定（362条2項3号）されていない以上、Aを「代表取締役」とする登記は不実であり要件①を満たす。したがって、908条2項適用によって乙会社は甲会社に本件取引代金の請求をすることができる"}, {"aspect": "条文", "text": "908条・911条・362条"}], "articles": ["908条", "911条", "362条"], "pages": [78]}, {"id": "book-kigyoho-01-ch02-r061", "ch": 2, "topic": "（論点）354条類推適用の可否（使用人の場合）", "points": [{"aspect": "要件", "text": "類推適用の要件：①使用人が社長、副社長その他の株式会社を代表する権限を有する名称で取引を行い、②会社がその名称を「付した」といえ、③相手方が善意（・無重過失）の場合には、相手方は会社に対して取引の効果を主張することができる"}, {"aspect": "結論", "text": "使用人は「取締役」（354条）でないので直接適用はできない。しかし、同条の趣旨は権利外観理論を基礎として取引の安全を図ることにある。代表権があると信じた相手方からすれば取引相手が取締役か使用人かは問題ではなく、外観を信頼した相手方保護の必要性は同じである。したがって、354条を類推適用して、相手方を保護できると解する"}, {"aspect": "結論", "text": "上記の立場は最判昭和35・10・14の立場である"}, {"aspect": "条文", "text": "354条"}], "articles": ["354条"], "pages": [79]}, {"id": "book-kigyoho-01-ch02-r062", "ch": 2, "topic": "（参考）社外取締役の設置義務（327条の2）と業務の執行の社外取締役への委託（348条の2）", "points": [{"aspect": "原則", "text": "327条の2（社外取締役の設置義務）：監査役会設置会社（公開会社であり、かつ、大会社であるものに限る。）であって金融商品取引法第二十四条第一項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならないものは、社外取締役を置かなければならない"}, {"aspect": "原則", "text": "348条の2（令和元年新設）：株式会社（指名委員会等設置会社を除く。）が社外取締役を置いている場合において、当該株式会社と取締役との利益が相反する状況にあるとき、その他取締役が当該株式会社の業務を執行することにより株主の利益を損なうおそれがあるときは、当該株式会社は、その都度、取締役の決定（取締役会設置会社にあっては、取締役会の決議）によって、当該株式会社の業務を執行することを社外取締役に委託することができる"}, {"aspect": "原則", "text": "348条の2第3項：前二項の規定により委託された業務の執行は、第二条第十五号イに規定する株式会社の業務の執行に該当しないものとする。ただし、社外取締役が業務執行取締役（指名委員会等設置会社にあっては、執行役）の指揮命令により当該委託された業務を執行したときは、この限りでない"}, {"aspect": "あてはめ", "text": "（問題点）Xが業務執行を行うと、社外取締役ではなくなる（2条15号イ）ので、たとえば、監査等委員会の社外取締役の員数を欠くことになってしまう。そこで、348条の2第3項が置かれている"}, {"aspect": "条文", "text": "328条・327条・331条・400条・348条・2条"}], "articles": ["328条", "327条", "331条", "400条", "348条", "2条"], "pages": [80]}, {"id": "book-kigyoho-01-ch02-r063", "ch": 2, "topic": "監査役の選任・解任に関する制度（329条〜）", "points": [{"aspect": "趣旨", "text": "336条（監査役の任期）：監査役の任期を長期とし短縮ができないとしたのは、任期の面から監査役の独立性を確保するため"}, {"aspect": "趣旨", "text": "343条（監査役の選任に関する監査役の同意等）の趣旨は、監査役の独立性を確保するためである"}, {"aspect": "あてはめ", "text": "「監査役」とくれば、①329条〜（役員等の選・解任）、②381条〜（権限）を考える"}, {"aspect": "あてはめ", "text": "監査役の解任とくれば、339条、854条を考える"}, {"aspect": "条文", "text": "329条・381条・336条・343条・339条・854条"}], "articles": ["329条", "381条", "336条", "343条", "339条", "854条"], "pages": [81]}, {"id": "book-kigyoho-01-ch02-r064", "ch": 2, "topic": "（論点）横滑り監査役の適法性（最判昭和62・4・21）", "points": [{"aspect": "結論", "text": "株主総会において、取締役を退任した者を退任と同時に監査役（横滑り監査役）に選任する決議も有効と解する。兼任禁止規定（335条2項）にも欠格事由（335条1項）にもあたらないからである"}, {"aspect": "結論", "text": "横滑り監査役も事業報告要求権や業務財産状況調査権（381条2項3項）等の権限を有しているので、監査役未就任期間の監査も可能であるから同期間の監査もできると解する"}, {"aspect": "結論", "text": "取締役であった者が立場を変えて心機一転監査役の立場で過去の取締役としての職務執行を事後監査することが可能であるから、取締役であった自己をも監査することができると解する"}, {"aspect": "条文", "text": "335条・381条"}], "articles": ["335条", "381条"], "pages": [81]}, {"id": "book-kigyoho-01-ch02-r065", "ch": 2, "topic": "監査役の監査権限の全体像（381条・436条）", "points": [{"aspect": "原則", "text": "監査役の監査権限は、会計監査権（436条）と業務監査権（381条）がある"}, {"aspect": "条文", "text": "436条・381条"}], "articles": ["436条", "381条"], "pages": [82]}, {"id": "book-kigyoho-01-ch02-r066", "ch": 2, "topic": "（論点）監査役の業務監査権の範囲（妥当性監査まで及ぶか）", "points": [{"aspect": "結論", "text": "監査役の業務監査権（381条1項）が適法性監査のみならず妥当性監査まで及ぶかが問題となる。業務執行を決定しその責任を負うのは取締役または取締役会である（348条1項、362条2項1号）にもかかわらず、決定権限も責任もない監査役に妥当性監査権を認めると、取締役または取締役会の経営判断の自由を不当に圧迫するおそれがある。そこで、監査役の業務監査権は、適法性監査に限られ、妥当性監査にまで及ばないと解する"}, {"aspect": "結論", "text": "判例はない。多数説の立場である"}, {"aspect": "条文", "text": "381条・348条・362条"}], "articles": ["381条", "348条", "362条"], "pages": [82]}, {"id": "book-kigyoho-01-ch02-r067", "ch": 2, "topic": "監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）", "points": [{"aspect": "趣旨", "text": "子会社調査権（381条3項4項）の趣旨：親子会社は法的には別法人であるが経済的一体性ゆえに、親会社は子会社を通じて違法行為を行う可能性がある。そこで、親会社の監査を十分にするため、子会社調査権が認められた"}, {"aspect": "趣旨", "text": "監査役の取締役会への出席義務・意見陳述義務（383条1項）の趣旨は、業務監査のため（取締役会で違法な決議がなされるのを事前に防止するため）"}, {"aspect": "趣旨", "text": "取締役会招集請求権・招集権（383条2項3項4項）の趣旨は、取締役の違法行為を取締役会に報告することを可能にするため"}, {"aspect": "趣旨", "text": "監査役設置会社と取締役との間の訴えにおける会社の代表（386条）の趣旨：本来、会社を代表するのは代表取締役であるが（349条4項）、なれ合い訴訟を防止するため、監査役が会社を代表することとした"}, {"aspect": "趣旨", "text": "監査役の報酬（387条）の趣旨：本来、報酬の決定は業務執行の決定として取締役会または取締役の権限であるが、それでは監査の充実がなされないので、監査役の独立性確保ため"}, {"aspect": "要件", "text": "監査役による取締役の行為の差止め（385条）の要件：①取締役の法令・定款違反のおそれある行為があること、②当該行為によって会社に著しい損害が生じるおそれがあること"}, {"aspect": "条文", "text": "381条・383条・385条・386条・349条・387条"}], "articles": ["381条", "383条", "385条", "386条", "349条", "387条"], "pages": [82]}, {"id": "book-kigyoho-01-ch02-r068", "ch": 2, "topic": "定款の定めによる監査範囲の限定（389条）", "points": [{"aspect": "趣旨", "text": "非公開会社では、株主自身による業務監査もある程度可能であるし、業務監査まで行う監査役を得ることが困難な場合もあるため、監査範囲の限定が認められる"}, {"aspect": "原則", "text": "389条1項：公開会社でない株式会社（監査役会設置会社及び会計監査人設置会社を除く。）は、381条1項の規定にかかわらず、その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができる"}, {"aspect": "原則", "text": "上記の監査役を、会計監査限定監査役、または会計限定監査役と呼ぶ"}, {"aspect": "条文", "text": "389条・381条"}], "articles": ["389条", "381条"], "pages": [83]}, {"id": "book-kigyoho-01-ch02-r069", "ch": 2, "topic": "監査役設置会社の定義（2条9号）と監査役会（390条〜）", "points": [{"aspect": "原則", "text": "2条9号（監査役設置会社）：監査役を置く株式会社（その監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがあるものを除く。）又はこの法律の規定により監査役を置かなければならない株式会社をいう"}, {"aspect": "原則", "text": "監査役会の権限（390条）。レジュメでは見出しのみで内容の説明はない"}, {"aspect": "原則", "text": "社外監査役（2条16号）。レジュメでは見出しのみで内容の説明はない"}, {"aspect": "原則", "text": "監査役会の議事録に異議をとどめないものは賛成したものと推定する（393条4項）。レジュメでは見出しのみで内容の説明はない"}, {"aspect": "条文", "text": "2条・390条・393条"}], "articles": ["2条", "390条", "393条"], "pages": [83]}, {"id": "book-kigyoho-01-ch02-r070", "ch": 2, "topic": "会計参与の条文全体像（329条〜選任・解任／374条〜権限）", "points": [{"aspect": "原則", "text": "「会計参与」とくれば、①329条〜（役員等の選・解任）、②374条〜（権限）"}, {"aspect": "条文", "text": "329条・374条"}], "articles": ["329条", "374条"], "pages": [84]}, {"id": "book-kigyoho-01-ch02-r071", "ch": 2, "topic": "会計参与の善管注意義務（330条・民法644条）", "points": [{"aspect": "原則", "text": "会社と会計参与の関係は委任に関する規定に従う（330条）。したがって、会計参与は会社に対して善管注意義務（330条、民法644条）を負う"}, {"aspect": "条文", "text": "330条・644条"}], "articles": ["330条", "644条"], "pages": [84]}, {"id": "book-kigyoho-01-ch02-r072", "ch": 2, "topic": "会計参与は忠実義務を負わない（355条・419条2項）", "points": [{"aspect": "結論", "text": "忠実義務を負うのは取締役と執行役だけであり、会計参与は忠実義務を負わない"}], "articles": [], "pages": [84]}, {"id": "book-kigyoho-01-ch02-r073", "ch": 2, "topic": "会計参与等の選任等についての意見の陳述（345条）", "points": [{"aspect": "趣旨", "text": "趣旨は、会計参与の独立性確保のため"}, {"aspect": "原則", "text": "345条（会計参与等の選任等についての意見の陳述）"}, {"aspect": "条文", "text": "345条"}], "articles": ["345条"], "pages": [84]}, {"id": "book-kigyoho-01-ch02-r074", "ch": 2, "topic": "会計参与の報酬（379条）", "points": [{"aspect": "原則", "text": "379条（会計参与の報酬）。監査役の報酬（387条）と同じ規定であり、趣旨（独立性確保）も同じ"}, {"aspect": "原則", "text": "監査役の報酬（387条）と同じ規定。趣旨（独立性確保）も同じ"}, {"aspect": "条文", "text": "379条・387条"}], "articles": ["379条", "387条"], "pages": [84]}, {"id": "book-kigyoho-01-ch02-r075", "ch": 2, "topic": "会計監査人の条文全体像と「役員ではない」ことの帰結（329条1項）", "points": [{"aspect": "原則", "text": "「会計監査人」とくれば、①329条〜（役員等の選・解任）、②396条〜（権限）"}, {"aspect": "結論", "text": "会計監査人は、役員ではない（329条1項参照）"}, {"aspect": "結論", "text": "帰結①：選任について341条は使えない"}, {"aspect": "結論", "text": "帰結②：解任に関して854条は使えない"}, {"aspect": "結論", "text": "帰結③：報酬は、定款・株主総会決議で定めない"}, {"aspect": "あてはめ", "text": "3つの帰結は全て「会計監査人は役員でないからである（329条1項参照）」と記述すればよい"}, {"aspect": "条文", "text": "329条・396条・341条・854条"}], "articles": ["329条", "396条", "341条", "854条"], "pages": [85]}, {"id": "book-kigyoho-01-ch02-r076", "ch": 2, "topic": "会計監査人の善管注意義務（330条・民法644条）", "points": [{"aspect": "原則", "text": "会社と会計監査人の関係は委任に関する規定に従う（330条）。したがって、会計監査人は会社に対して善管注意義務（330条、民法644条）を負う"}, {"aspect": "条文", "text": "330条・644条"}], "articles": ["330条", "644条"], "pages": [85]}, {"id": "book-kigyoho-01-ch02-r077", "ch": 2, "topic": "会計監査人の選任（329条1項・309条1項、341条不適用）", "points": [{"aspect": "原則", "text": "選任は株主総会の普通決議でする（329条1項、309条1項）。341条は不適用"}, {"aspect": "条文", "text": "329条・309条・341条"}], "articles": ["329条", "309条", "341条"], "pages": [85]}, {"id": "book-kigyoho-01-ch02-r078", "ch": 2, "topic": "監査役による会計監査人の選任議案内容の決定（344条）", "points": [{"aspect": "趣旨", "text": "趣旨は、会計監査人の独立性確保のため"}, {"aspect": "原則", "text": "監査役による選任の議案内容の決定（344条）"}, {"aspect": "原則", "text": "（参）343条（監査役の選任に関する監査役の同意等）、344条（会計監査人の選任等に関する議案の内容の監査役による決定）、344条の2（監査等委員である取締役の選任に関する監査等委員会の同意等）"}, {"aspect": "あてはめ", "text": "「取締役会による会計監査人の選任議案内容の決定＋監査役の同意」ではない"}, {"aspect": "条文", "text": "344条・343条"}], "articles": ["344条", "343条"], "pages": [85]}, {"id": "book-kigyoho-01-ch02-r079", "ch": 2, "topic": "会計監査人の選任等についての意見の陳述（345条1項5項）", "points": [{"aspect": "趣旨", "text": "趣旨は、会計監査人の独立性確保のため"}, {"aspect": "原則", "text": "会計監査人の選任についての当該会計監査人の意見の陳述（345条1項5項）"}, {"aspect": "条文", "text": "345条"}], "articles": ["345条"], "pages": [85]}, {"id": "book-kigyoho-01-ch02-r080", "ch": 2, "topic": "会計監査人の終任と解任（339条・340条、854条は使えない）", "points": [{"aspect": "原則", "text": "終任事由は任期の満了・辞任・解任・死亡。特に問題になるのは解任"}, {"aspect": "原則", "text": "解任とくれば、①339条（株主総会による解任）、②854条（役員解任の訴え）のはずである"}, {"aspect": "結論", "text": "854条（役員解任の訴え）は使えない。その代わりに340条（監査役等による会計監査人の解任）"}, {"aspect": "条文", "text": "339条・854条・340条"}], "articles": ["339条", "854条", "340条"], "pages": [85]}, {"id": "book-kigyoho-01-ch02-r081", "ch": 2, "topic": "会計監査人の報酬等の決定（399条）", "points": [{"aspect": "趣旨", "text": "会計監査人の場合は本来通り取締役・取締役会の決定で報酬等を決定する（役員ではないから）。ただ、独立性確保の要請から監査役の同意を要求している"}, {"aspect": "原則", "text": "399条1項：取締役は、会計監査人又は一時会計監査人の職務を行うべき者の報酬等を定める場合には、監査役（監査役が二人以上ある場合にあっては、その過半数）の同意を得なければならない"}, {"aspect": "原則", "text": "取締役・監査役・会計参与の報酬等は、お手盛りの危険・独立性確保の理由で定款または株主総会の普通決議で定めることになっており、会計監査人の報酬等の決定とは大きく異なる"}, {"aspect": "条文", "text": "399条"}], "articles": ["399条"], "pages": [86]}, {"id": "book-kigyoho-01-ch02-r082", "ch": 2, "topic": "指名委員会等設置会社の総則（執行と監督の分離）", "points": [{"aspect": "趣旨", "text": "迅速な意思決定を可能にするため大幅な委任を認め（416条4項）、監督機能を大幅に強化するため3委員会の設置を義務づけ（2条12号）、各委員会の委員の過半数は社外取締役とした（400条3項）"}, {"aspect": "条文", "text": "416条・418条・2条・400条"}], "articles": ["416条", "418条", "2条", "400条"], "pages": [87]}, {"id": "book-kigyoho-01-ch02-r083", "ch": 2, "topic": "機関構造の比較（取締役会非設置会社・取締役会設置会社・指名委員会等設置会社）", "points": [{"aspect": "図表", "text": "（2）取締役会等の表：①取締役会非設置会社は意思決定＝取締役・取締役の過半数（348条1項2項）、業務執行＝各取締役（348条1項）、代表＝各取締役（349条1項2項）。②取締役会設置会社は意思決定＝取締役会（362条2項1号）、業務執行＝代表取締役（363条1項1号）、代表＝代表取締役（349条1項ただし書き、4項）。③指名委員会等設置会社は意思決定＝取締役会（416条1項1号）＊執行役に大幅な委任可能（同条項4項）、業務執行＝執行役（418条2号）、代表＝代表執行役（420条3項、349条4項）"}, {"aspect": "条文", "text": "348条・349条・362条・363条・416条・418条・420条"}], "articles": ["348条", "349条", "362条", "363条", "416条", "418条", "420条"], "pages": [87]}, {"id": "book-kigyoho-01-ch02-r084", "ch": 2, "topic": "各委員会の委員の選定・解職（400条）", "points": [{"aspect": "原則", "text": "400条1項：各委員会は、委員三人以上で組織する。2項：各委員会の委員は、取締役の中から、取締役会の決議によって選定する。3項：各委員会の委員の過半数は、社外取締役でなければならない"}, {"aspect": "原則", "text": "各委員会の委員の解職は取締役会の決議によって行う（400条2項、400条1項への注記）"}, {"aspect": "結論", "text": "各委員会は取締役会の内部機関であり、各委員の選定・解職は329条〜を使わない"}, {"aspect": "あてはめ", "text": "監査等委員である取締役等の選任等は、329条、342条の2、344条の2による"}, {"aspect": "条文", "text": "400条・329条・342条・344条"}], "articles": ["400条", "329条", "342条", "344条"], "pages": [88]}, {"id": "book-kigyoho-01-ch02-r085", "ch": 2, "topic": "指名委員会等の権限の条文構造（404条〜409条）", "points": [{"aspect": "原則", "text": "404条1項は指名委員会の権限、2項は監査委員会の権限、3項は報酬委員会の権限"}, {"aspect": "原則", "text": "405条（監査委員会による調査）、406条（監査委員による取締役会への報告義務）、407条（監査委員による執行役等の行為の差止め）、408条（指名委員会等設置会社と執行役又は取締役との間の訴えにおける会社の代表等）は監査委員会の権限義務。監査役の権限（381条〜）と類似するが、監査委員会の権限義務には381条〜は使わない"}, {"aspect": "原則", "text": "405条〜408条は、監査委員会の権限義務である"}, {"aspect": "原則", "text": "409条（報酬委員会による報酬の決定の方法等）。報酬には361条は使わない"}, {"aspect": "あてはめ", "text": "監査委員会の権限義務には、監査役の権限である381条〜は使わない"}, {"aspect": "条文", "text": "404条・405条・406条・407条・408条・381条・409条・361条"}], "articles": ["404条", "405条", "406条", "407条", "408条", "381条", "409条", "361条"], "pages": [88]}, {"id": "book-kigyoho-01-ch02-r086", "ch": 2, "topic": "404条1項の趣旨（指名委員会の権限）", "points": [{"aspect": "趣旨", "text": "社外取締役が過半数を占める指名委員会に取締役の選任・解任に関する議案の内容を最終決定させることにより、取締役の人事について代表執行役からの独立性を確保し、執行役の業務執行に対する監督を充実させるため"}], "articles": [], "pages": [88]}, {"id": "book-kigyoho-01-ch02-r087", "ch": 2, "topic": "404条3項の趣旨（報酬委員会の権限）", "points": [{"aspect": "趣旨", "text": "本来報酬等の決定は業務執行行為として取締役会の権限に属するが、執行役への報酬等の決定の委任（416条4項本文）によるお手盛りを防止して、執行役に対する監督を充実するため"}, {"aspect": "あてはめ", "text": "報酬委員・取締役によるお手盛りのおそれは、409条1項2項によって排除される。409条3項は361条とほぼ同じ内容"}, {"aspect": "条文", "text": "416条・409条・361条"}], "articles": ["416条", "409条", "361条"], "pages": [88, 89]}, {"id": "book-kigyoho-01-ch02-r088", "ch": 2, "topic": "監査委員による執行役等の行為の差止め（407条）", "points": [{"aspect": "原則", "text": "監査役の違法行為差止請求権（385条）と同様の規定である"}, {"aspect": "要件", "text": "407条の要件はレジュメでは「①」「②」の番号のみで、要件の内容の記載がない"}, {"aspect": "条文", "text": "407条・385条"}], "articles": ["407条", "385条"], "pages": [89]}, {"id": "book-kigyoho-01-ch02-r089", "ch": 2, "topic": "408条の趣旨（訴えにおける会社の代表）", "points": [{"aspect": "趣旨", "text": "本来、会社を代表するのは代表執行役であるが（349条4項）、なれ合い訴訟を防止するため"}, {"aspect": "原則", "text": "監査役設置会社と取締役との間の訴えにおける会社の代表（386条）と同様の規定"}, {"aspect": "条文", "text": "349条・386条"}], "articles": ["349条", "386条"], "pages": [89]}, {"id": "book-kigyoho-01-ch02-r090", "ch": 2, "topic": "執行役・代表執行役・表見代表執行役（418条〜421条）", "points": [{"aspect": "原則", "text": "執行役の権限（418条）"}, {"aspect": "原則", "text": "執行役の忠実義務、競業避止義務、利益相反取引規制（419条2項、355条、356条、365条2項）"}, {"aspect": "原則", "text": "代表執行役（420条）。代表執行役の包括的・不可制限的代表権（420条3項、349条4項5項）"}, {"aspect": "原則", "text": "表見代表執行役（421条）。表見代表取締役規定（354条）と同じ規定である"}, {"aspect": "条文", "text": "418条・419条・355条・356条・365条・420条・349条・421条・354条"}], "articles": ["418条", "419条", "355条", "356条", "365条", "420条", "349条", "421条", "354条"], "pages": [89]}, {"id": "book-kigyoho-01-ch02-r091", "ch": 2, "topic": "株主による執行役の行為の差止め（422条）", "points": [{"aspect": "原則", "text": "認められるためには、①6ヶ月前から株式を継続保有する株主であること、②執行役の行為が法令・定款に反するおそれがあること、③当該行為によって会社に回復することができない損害が生じるおそれがあることが必要である"}, {"aspect": "原則", "text": "株主による取締役の違法行為差止め（360条）と同様の規定。監査委員による差止め（407条、「会社に著しい損害」）も存在するので、422条は「会社に回復することができない損害」である点に注意"}, {"aspect": "あてはめ", "text": "非公開会社であれば、①の要件が「株主であること」（422条2項）に変わる"}, {"aspect": "条文", "text": "422条・360条・407条"}], "articles": ["422条", "360条", "407条"], "pages": [89]}, {"id": "book-kigyoho-01-ch02-r092", "ch": 2, "topic": "（論点）監査委員会の業務監査権（404条2項1号）の範囲", "points": [{"aspect": "趣旨", "text": "なぜなら、監査委員は、株式会社の業務執行の妥当性を監督する取締役会の構成員である取締役であるからである"}, {"aspect": "結論", "text": "監査委員会の業務監査権の範囲は、執行役等（取締役）の適法性監査のみならず、妥当性監査にまで及ぶと解する"}], "articles": [], "pages": [90]}, {"id": "book-kigyoho-01-ch02-r093", "ch": 2, "topic": "（論点）監査等委員会の業務監査権（399条の2第3項1号）の範囲", "points": [{"aspect": "結論", "text": "監査等委員会の業務監査権（399条の2第3項1号）の範囲も、監査委員会の業務監査権と同じ論証による（適法性監査のみならず妥当性監査に及ぶ）"}, {"aspect": "条文", "text": "399条"}], "articles": ["399条"], "pages": [90]}, {"id": "book-kigyoho-01-ch02-r094", "ch": 2, "topic": "監査等委員会設置会社の全体構造（迅速と適正の調和）", "points": [{"aspect": "原則", "text": "A・監査等委員である取締役＝監査役に相当し、B・監査等委員以外の取締役は通常の取締役である。A、Bの区別を要する"}, {"aspect": "あてはめ", "text": "監査等委員会は指名・報酬の決定はできないが、これらに関し意見陳述はできる（342条の2第4項、361条6項）"}, {"aspect": "条文", "text": "342条・361条・416条・399条・362条"}], "articles": ["342条", "361条", "416条", "399条", "362条"], "pages": [91]}, {"id": "book-kigyoho-01-ch02-r095", "ch": 2, "topic": "権限の条文は399条の2〜（特に取締役会の権限は399条の13）", "points": [{"aspect": "原則", "text": "399条の2〜は、主として監査等委員会設置会社の「権限」の条文。権限を探すときは399条の2〜を見る。特に取締役会の権限とくれば399条の13"}, {"aspect": "条文", "text": "399条"}], "articles": ["399条"], "pages": [92]}, {"id": "book-kigyoho-01-ch02-r096", "ch": 2, "topic": "「権限」以外の特則（選任・解任・任期・報酬・責任）", "points": [{"aspect": "趣旨", "text": "（3）の趣旨（361条6項、423条4項かっこ書きを除く）は、監査等委員である取締役の独立性を確保し、実効ある監査等（監査等の充実）のため"}, {"aspect": "原則", "text": "選任・解任とくれば329条以下だが、329条2項。選任・解任の特則は341条以下で、特に342条の2、344条の2"}, {"aspect": "原則", "text": "任期は332条3項かっこ書き・4項"}, {"aspect": "原則", "text": "報酬は361条2項・3項・5項・6項"}, {"aspect": "原則", "text": "会社に対する損害賠償責任は423条4項かっこ書き"}, {"aspect": "条文", "text": "329条・341条・342条・344条・332条・361条・423条"}], "articles": ["329条", "341条", "342条", "344条", "332条", "361条", "423条"], "pages": [92]}, {"id": "book-kigyoho-01-ch02-r097", "ch": 2, "topic": "（参照）選任・解任関係の条文一覧（329条〜347条）", "points": [{"aspect": "原則", "text": "329条[役員・会計監査人の選任・解任]〜：第1款 選任、第2款 解任、第3款 選任及び解任の手続に関する特則。341条（役員の選任及び解任の株主総会の決議）、342条（累積投票による取締役の選任）、342条の2（監査等委員である取締役等の選任等についての意見の陳述）、343条、344条、344条の2、345条、346条（役員等に欠員を生じた場合の措置）、347条（種類株主総会における取締役又は監査役の選任等）"}, {"aspect": "条文", "text": "329条・341条・342条・343条・344条・345条・346条・347条"}], "articles": ["329条", "341条", "342条", "343条", "344条", "345条", "346条", "347条"], "pages": [92]}, {"id": "book-kigyoho-01-ch02-r098", "ch": 2, "topic": "399条の2〜の条文構造と監査等委員会設置会社の機関構造", "points": [{"aspect": "原則", "text": "条文構造：第9節の2 監査等委員会。第1款 権限等（399条の2〜399条の7）、第2款 運営（399条の8〜399条の12）、第3款 監査等委員会設置会社の取締役会の権限等（399条の13・399条の14）"}, {"aspect": "条文", "text": "399条・363条・349条"}], "articles": ["399条", "363条", "349条"], "pages": [93]}, {"id": "book-kigyoho-01-ch02-r099", "ch": 2, "topic": "善管注意義務（330条・402条3項・民法644条）", "points": [{"aspect": "原則", "text": "330条（株式会社と役員等との関係）：株式会社と役員及び会計監査人との関係は、委任に関する規定に従う"}, {"aspect": "原則", "text": "402条3項：指名委員会等設置会社と執行役との関係は、委任に関する規定に従う"}, {"aspect": "原則", "text": "民法644条[受任者の注意義務：善管注意義務]：受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う"}, {"aspect": "原則", "text": "「役員」とは、取締役、会計参与、監査役をいう（329条1項かっこ書）"}, {"aspect": "条文", "text": "330条・402条・644条・329条"}], "articles": ["330条", "402条", "644条", "329条"], "pages": [94]}, {"id": "book-kigyoho-01-ch02-r100", "ch": 2, "topic": "忠実義務と同質説（最判昭和45・6・24）", "points": [{"aspect": "趣旨", "text": "会社と利益衝突が生じるおそれがあるのは、会社の業務を執行し会社を代表する（代表）取締役・（代表）執行役である。そこで、この2者について（2）忠実義務、（3）競業取引の規制、（4）利益相反取引の規制を課し、利益衝突を防ごうとしている。逆に、会計参与・監査役・会計監査人には、忠実義務・競業取引の規制・利益相反取引の規制はない"}, {"aspect": "原則", "text": "忠実義務を負うのは、取締役（355条）と執行役（419条2項、355条）だけ"}, {"aspect": "結論", "text": "判例によれば、忠実義務は、（善管）注意義務をいっそう明確にしたにとどまり、（善管）注意義務とは別個の高度な義務なのではない（同質説、最判昭和45・6・24）"}, {"aspect": "条文", "text": "355条・419条"}], "articles": ["355条", "419条"], "pages": [94]}, {"id": "book-kigyoho-01-ch02-r101", "ch": 2, "topic": "競業取引の趣旨と＜事例1＞", "points": [{"aspect": "趣旨", "text": "取締役の競業取引を放任すれば、会社のノウハウを取締役が利用して取引機会や得意先を奪うおそれがあるので、会社の利益を保護するためである"}], "articles": [], "pages": [95]}, {"id": "book-kigyoho-01-ch02-r102", "ch": 2, "topic": "競業取引の要件（356条1項1号）", "points": [{"aspect": "原則", "text": "「取締役が自己又は第三者のために株式会社の事業の部類に属する取引をしようとするとき」"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [95]}, {"id": "book-kigyoho-01-ch02-r103", "ch": 2, "topic": "（論点）356条1項1号の「自己又は第三者のために」とは（計算説）", "points": [{"aspect": "結論", "text": "「自己又は第三者のために」とは、自己又は第三者名義を意味するのではなく、自己又は第三者の計算においてを意味する（計算説）。競業取引規制の趣旨は会社の利益保護であり、誰に経済的利益が帰属するかを問題にすべきだからである"}, {"aspect": "結論", "text": "「会社の事業の部類に属する取引」とは、会社が実際に行っている事業が市場において競合し、会社と取締役・第三者の間で利益衝突が生じるおそれがある取引をいう"}], "articles": [], "pages": [95]}, {"id": "book-kigyoho-01-ch02-r104", "ch": 2, "topic": "競業取引の手続（事前の承認・事後の報告）", "points": [{"aspect": "原則", "text": "事前の承認（356条1項柱書、365条1項）、事後の報告（365条2項）"}, {"aspect": "条文", "text": "356条・365条"}], "articles": ["356条", "365条"], "pages": [95]}, {"id": "book-kigyoho-01-ch02-r105", "ch": 2, "topic": "（論点）競業取引自体の効力", "points": [{"aspect": "結論", "text": "取締役が会社の承認を得ずに競業取引をした場合でも、取引の安全の見地から、取引自体は有効であると解する"}], "articles": [], "pages": [96]}, {"id": "book-kigyoho-01-ch02-r106", "ch": 2, "topic": "競業違反と取締役の任務懈怠責任（423条1項・2項）", "points": [{"aspect": "趣旨", "text": "423条2項の趣旨は、損害額の立証が困難なので、損害会社の救済のため（原文ママ）"}, {"aspect": "原則", "text": "会社の承認なくして競業取引をした場合、取締役等が得た利益は会社の損害額と推定される（423条2項）。本問ではAが得た800万円が会社の損害額と推定される"}, {"aspect": "要件", "text": "423条1項の要件：①取締役等、②任務懈怠（これが一番重要。まとめると「取締役等の任務懈怠であること」）、③会社に損害が発生したこと、④②の任務懈怠と③の損害の間に相当因果関係があること、⑤取締役等に故意・過失があること（明文にないが当然に）"}, {"aspect": "条文", "text": "356条・365条・423条・428条"}], "articles": ["356条", "365条", "423条", "428条"], "pages": [96]}, {"id": "book-kigyoho-01-ch02-r107", "ch": 2, "topic": "＜事例2＞同業他社の代表取締役への就任と競業取引", "points": [{"aspect": "結論", "text": "同業他社の代表取締役に「就任」すること自体は競業「取引」（356条1項1号）ではないから、就任自体は競業取引にあたらず、取締役会の承認は必要ではない"}, {"aspect": "結論", "text": "同業他社の代表取締役に就任すれば、その後は継続的に競業取引をするのは明らかである。したがって、Aが乙会社の代表取締役に就任後に同種の事業を行う場合、競業取引にあたり、甲会社の取締役会の承認が必要となる"}, {"aspect": "結論", "text": "Aが乙社を代表して取引するたびごとに甲社の承認を要求するのは煩雑である。そこで、Aが乙社を代表して初めて「取引」をする際の甲社の取締役会の包括的承認を肯定すべきと解する。包括的承認を認めても会社の利益を害することはないからである"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [97]}, {"id": "book-kigyoho-01-ch02-r108", "ch": 2, "topic": "[問題]＜事例3＞関西進出を計画する会社と取締役の競業取引", "points": [{"aspect": "設例", "text": "[問題]下記＜事例3＞において、Aは甲会社の承認を得る必要があるか論じなさい。＜事例3＞甲社（関東で事業、パンの製造販売）の取締役Aが関西でパンの製造販売を行い800万円の利益を得た。なお、甲社は関西進出を計画して準備も進めていた"}, {"aspect": "設例", "text": "[解答例]1：Aが甲会社の承認を得る必要があるかどうかは、Aの関西でのパンの製造販売行為が競業取引にあたるかによる（356条1項1号、365条1項）"}, {"aspect": "設例", "text": "[解答例]2：競業取引の定義と計算説・「会社の事業の部類に属する取引」の解釈（t334の論証の再掲）"}, {"aspect": "設例", "text": "[解答例]3：あてはめ。Aに800万円の利益が発生していることから「自己のために」取引したといえる。関東と関西と市場が異なるともいえるが、甲社は関西進出を計画し準備も進めていたので、Aの行為は関西市場において競業し利益衝突が生じるおそれがある取引といえる。以上から、Aの行為は競業取引にあたり、甲会社の承認が必要である"}, {"aspect": "あてはめ", "text": "解答の文末は、問いに合わせる。＜問題提起の書き方③＞オウム返し：問いの文末を、解答例では文頭にもってくる書き方"}, {"aspect": "条文", "text": "356条・365条"}], "articles": ["356条", "365条"], "pages": [98]}, {"id": "book-kigyoho-01-ch02-r109", "ch": 2, "topic": "利益相反取引の趣旨", "points": [{"aspect": "趣旨", "text": "会社と取締役との利益相反取引を規制しなければ、会社が不利益な取引をさせられ会社に重大な不利益が生じるおそれがあるためである"}], "articles": [], "pages": [99]}, {"id": "book-kigyoho-01-ch02-r110", "ch": 2, "topic": "間接取引（356条1項3号）の要件", "points": [{"aspect": "原則", "text": "「株式会社が取締役の債務を保証すること」"}, {"aspect": "原則", "text": "「取締役以外の者との間において株式会社と当該取締役との利益が相反する取引をしようとするとき」"}, {"aspect": "要件", "text": "間接（利益相反）取引の要件：①取締役以外の者と会社の取引であること、②当該取引によって会社と取締役の利益が相反すること"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [99]}, {"id": "book-kigyoho-01-ch02-r111", "ch": 2, "topic": "直接取引（356条1項2号）の要件", "points": [{"aspect": "原則", "text": "取締役が自己又は第三者のために株式会社と取引をしようとするとき"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [100]}, {"id": "book-kigyoho-01-ch02-r112", "ch": 2, "topic": "（論点）356条1項2号の「自己又は第三者のために」とは（名義説）", "points": [{"aspect": "結論", "text": "「自己又は第三者のために」（356条1項2号）とは、自己の名義において、又は、第三者の名義において（第三者の代表者又は代理人として）を意味する（名義説）。間接取引（同条項3号）も規定され広く規制されているので、あえて計算の意味に考える必要はないからである"}, {"aspect": "結論", "text": "「取引」とは、会社の利益が害されるおそれのある取引と解する"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [100, 101]}, {"id": "book-kigyoho-01-ch02-r113", "ch": 2, "topic": "利益相反取引の手続（事前の承認・事後の報告）", "points": [{"aspect": "原則", "text": "事前の承認（356条1項柱書、365条1項）、事後の報告（365条2項）"}, {"aspect": "条文", "text": "356条・365条"}], "articles": ["356条", "365条"], "pages": [101]}, {"id": "book-kigyoho-01-ch02-r114", "ch": 2, "topic": "要件検討の注意（「論ズレ」の防止）", "points": [{"aspect": "あてはめ", "text": "会社と取締役との利益が相反しそうな場合は利益相反取引と考えて良いか。この考えは危険であり、いわゆる「論ズレ」のおそれがある。あくまでも条文の要件から考えること"}, {"aspect": "あてはめ", "text": "直接（利益相反）取引（356条1項2号）の要件は、①取締役と会社の取引であり、②その取引が「自己または第三者のために（名義で）」なされることであるので、取締役が全く利益を受けない場合でも（第三者の名義で）直接利益相反取引といえる"}, {"aspect": "あてはめ", "text": "会社と取締役の利益が相反する場合でも、もう一つの要件である「会社が取締役以外の者との間の取引」を満たさなければ、間接（利益相反）取引（同条同項3号）とはいえない"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [102]}, {"id": "book-kigyoho-01-ch02-r115", "ch": 2, "topic": "（論点）会社の承認を得ずになされた利益相反取引の効力（相対的無効説）", "points": [{"aspect": "結論", "text": "会社の承認を得ずになされた利益相反取引は無効であると解する。ただし、会社は直接取引の相手方である取締役に対しては無効を主張できるが、取締役からの転得者や間接取引の相手方に対しては、その者が①当該取引が利益相反取引に該当すること、②会社の承認を得ていないことについて悪意であることを立証しなければ無効を主張できない"}, {"aspect": "結論", "text": "相対的無効説（最判昭和43・12・25、最判昭和46・10・13）"}, {"aspect": "あてはめ", "text": "（注意点）ここでの「第三者」とは、上図・下図でのYである（間接取引の保証の場合は直接の取引相手であることに注意）"}], "articles": [], "pages": [103]}, {"id": "book-kigyoho-01-ch02-r116", "ch": 2, "topic": "（論点）利益相反取引の相手方からの無効主張の可否", "points": [{"aspect": "結論", "text": "利益相反取引規制の趣旨は会社の利益保護にあるから、相手方からの無効主張は認められないと解する"}, {"aspect": "結論", "text": "最判昭和48・12・11の立場である"}], "articles": [], "pages": [103]}, {"id": "book-kigyoho-01-ch02-r117", "ch": 2, "topic": "（論点）会社とその一人株主（であり、かつ取締役）との取引の場合", "points": [{"aspect": "結論", "text": "会社とその一人株主との取引の場合、会社・株主の不利益は考えられない。したがって、取締役会の承認は必要ではないと解する"}, {"aspect": "結論", "text": "最判昭和45・8・20の立場である"}], "articles": [], "pages": [104]}, {"id": "book-kigyoho-01-ch02-r118", "ch": 2, "topic": "（論点）利益相反取引について株主全員の合意がある場合", "points": [{"aspect": "結論", "text": "株主全員の合意があれば、会社の承認を要求する必要もない。したがって、当該利益相反取引は有効と解する"}, {"aspect": "結論", "text": "最判昭和49・9・26の立場である"}], "articles": [], "pages": [104]}, {"id": "book-kigyoho-01-ch02-r119", "ch": 2, "topic": "利益相反取引と取締役の任務懈怠責任（423条1項・3項・428条）", "points": [{"aspect": "趣旨", "text": "423条3項：＜趣旨＞立証責任を転換し会社の利益を図るため。取締役会（会社）の承認があっても任務懈怠の推定を認めるのは、利益相反取引の際の承認は取締役会と利益相反取締役との馴れ合いの危険があるから"}, {"aspect": "趣旨", "text": "423条4項：＜趣旨＞監査等委員会設置会社への移行を促すため（政策的制度）"}, {"aspect": "趣旨", "text": "428条の趣旨は、自己のために会社と取引を行うことは利益相反性は著しく高いから"}, {"aspect": "原則", "text": "423条3項：＜効果＞任務懈怠の推定。423条2項とは異なり「違反して」という表現はない。したがって、会社の承認の有無に関係なく423条3項は適用できる"}, {"aspect": "原則", "text": "423条4項：監査等委員会設置会社の場合は3項の任務懈怠の推定はない"}, {"aspect": "要件", "text": "428条の要件：①利益相反の直接取引であること、②「自己のために」に限る"}, {"aspect": "結論", "text": "428条の効果は無過失責任"}, {"aspect": "条文", "text": "423条・369条・428条"}], "articles": ["423条", "369条", "428条"], "pages": [105, 106]}, {"id": "book-kigyoho-01-ch02-r120", "ch": 2, "topic": "＜事例問題における423条3項の考え方＞", "points": [{"aspect": "あてはめ", "text": "I 問題の事例の中に任務懈怠を肯定する「事実」がある場合：「○○という事実から、取締役Aの任務懈怠は認めることができる。」423条3項の記載は不要（423条3項は任務懈怠の立証が困難な場合に立証責任を転換したものだから）。任務懈怠を「否定」する「事実」がある場合（パターン1）も同様"}, {"aspect": "あてはめ", "text": "II 問題の事例の中に任務懈怠を肯定（否定）する「事実」がない場合：Aは甲「会社が当該取引をすることを決定した取締役であり」（423条3項2号）、「356条1項2号の取引によって」甲「会社に損害が生じた」（423条3項柱書）といえるので、Aの任務懈怠が推定される。423条3項の要件・効果を意識して書く"}, {"aspect": "あてはめ", "text": "任務懈怠を「否定」する事実がある場合、まず甲会社が423条3項を使って任務懈怠を推定して、つぎに取締役Aが事実から任務懈怠を否定するという書き方もあり得る（パターン2）。120条2項の「株主の権利の行使に関し、……と推定する。」場合も同様"}, {"aspect": "条文", "text": "423条・356条・120条"}], "articles": ["423条", "356条", "120条"], "pages": [106]}, {"id": "book-kigyoho-01-ch02-r121", "ch": 2, "topic": "[問題]甲社・乙社間の取引と両社の承認の要否", "points": [{"aspect": "設例", "text": "[解答例]1：甲社の取締役Bが乙社の代表取締役として甲社と取引しているので、取締役Bは第三者のために甲社と取引をしているといえる。したがって、当該取引は甲社にとって利益相反取引にあたるので、甲社の承諾が必要である"}, {"aspect": "設例", "text": "[解答例]2：乙社の代表取締役Bが甲社を代表または代理して当該取引を行っているわけではないので、Bは自己または第三者のために乙社と取引をしたとはいえない。したがって、当該取引は乙社にとって直接利益相反取引にあたらない"}, {"aspect": "設例", "text": "[解答例]3：当該取引は乙社と取締役以外の甲社との取引であるが、甲社が利益を受けた場合でもそれが乙社代表取締役であるBの利益となるわけではないから、乙社とBの利益が相反する取引ではない。したがって間接利益相反取引にもあたらず、乙社の承認は必要でない"}], "articles": [], "pages": [107]}, {"id": "book-kigyoho-01-ch02-r122", "ch": 2, "topic": "（問題）配偶者Bへの土地売却は直接利益相反取引にあたるか", "points": [{"aspect": "結論", "text": "Bに有利な取引がなされ、利益が相反するともいえそうだが、356条1項2号の要件を満たさない。また、AとBが配偶者や親族の関係であっても、法的にはAとBは別人格であり、原則、Bの利益＝Aの利益と考えてはいけない"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [108]}, {"id": "book-kigyoho-01-ch02-r123", "ch": 2, "topic": "（問題）甲社の保証は間接利益相反行為にあたるか（配偶者Bの借入）", "points": [{"aspect": "結論", "text": "Bが利益を受け、それが取締役Aの利益ともいえ（？）、甲社が不利益のおそれがあり、利益が相反するともいえそうだが、356条1項3号の要件を満たさない。AとBが配偶者や親族の関係であっても、法的にはAとBは別人格であり、原則、Bの利益＝Aの利益と考えてはいけない"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [108]}, {"id": "book-kigyoho-01-ch02-r124", "ch": 2, "topic": "（論点）代表取締役の権限濫用", "points": [{"aspect": "原則", "text": "代表取締役の権限濫用とは、客観的には代表権の範囲内の行為をしているが、主観的には自己または第三者の利益を図るためにする行為をいう"}, {"aspect": "原則", "text": "民法107条（代理権の濫用）：「代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。」"}, {"aspect": "結論", "text": "（注1）〜（注3）より、Aの行為は客観的には代表権の範囲内の行為である。ただ、主観的には自己の利益を図るためにする行為であるから、「代表取締役の権限濫用」の問題となる"}, {"aspect": "結論", "text": "代理も代表も、ある人の行為の効果が他者に帰属するという点では同じであるから、代表取締役の権限濫用の場合も、代理権の濫用規定である民法107条が類推適用されるべきである。したがって、取引の相手方が代表取締役の権限濫用の意図につき悪意（または善意）・有過失の場合は、取引は代表権のない者がした取引となると解する"}, {"aspect": "結論", "text": "平成29年民法改正前の判例である最判昭和38・9・5は、民法93条類推適用によって同様の結論に至っていた（原則有効、例外無効）。民法改正により代理権の濫用の規定（民法107条）が定められたことから、今後は民法107条類推適用で論述することになると考えられる"}, {"aspect": "あてはめ", "text": "（注1）「借入」「返済」の一連の行為を考えて（間接）利益相反取引と考えるのは不正解。356条1項の文言は「当該取引」。取引＝契約。「借入」は借入契約であるが、「返済」は住宅ローン契約に基づく事実行為に過ぎず、契約ではない"}, {"aspect": "あてはめ", "text": "（注2）甲社と乙銀行の取引であるので「会社」と「取締役以外の者」との取引であり、間接利益相反取引（356条1項3号）に該当しそうではある。しかし、甲乙間の金銭消費貸借契約それ自体、客観的に見て、代表取締役の利益になるものではなく、「会社と当該取締役との利益が相反する取引」とはいえない。したがって間接（利益相反）取引ではない。「Aの住宅ローン返済目的」という主観が問題に過ぎない"}, {"aspect": "あてはめ", "text": "（注3）甲「会社における従来の取扱い」は「1億円以上を借り入れる場合には取締役会の承認が必要」（取締役会規則）であるから、1億円以上の借入が「多額の借財」（362条4項2号）と考える。7000万円の借り入れは多額の借財ではなく、代表取締役Aが独断で決定しても法令違反はない"}, {"aspect": "あてはめ", "text": "（注）民法107条の効果は「無効」ではなく「代理権を有しない者がした行為とみなす」だから、会社からの「追認」（民法113条）も認められることになるであろうか"}, {"aspect": "条文", "text": "356条・362条・107条・93条・113条"}], "articles": ["356条", "362条", "107条", "93条", "113条"], "pages": [109, 110]}, {"id": "book-kigyoho-01-ch02-r125", "ch": 2, "topic": "[問題]X・Y間の保証契約は有効か（ケース①〜④）", "points": [{"aspect": "結論", "text": "ケース①：100万円の債務の保証なので「多額の借財」（362条4項2号）ではない（通常）。取締役会規則違反なので、349条5項の問題。X銀行が善意・無重過失なら、当該保証は有効"}, {"aspect": "結論", "text": "ケース②：保証契約は「多額の借財」（362条4項2号）にあたると解され、法律上取締役会の決議必要。それがないので、取締役会決議なしになされた多額の借財の効力の問題"}, {"aspect": "結論", "text": "ケース③：間接利益相反取引の問題（356条1項3号、365条2項）。ケース③の場合も、保証が「多額」なら、ケース②と同様「多額の借財」（362条4項2号）の問題も生じる"}, {"aspect": "結論", "text": "ケース④：取締役会規則違反もないし、「多額の借財」にもあたらないし、間接利益相反取引にもあたらない。つまり、客観的には代表取締役の行為は問題ない。ただ、主観的には第三者のため（配偶者Bのため）なので、代表取締役の権限濫用の問題となる"}, {"aspect": "結論", "text": "総括：代表取締役の権限濫用は、客観的に問題がないが主観的に自己または第三者のための問題である"}, {"aspect": "条文", "text": "362条・349条・356条・365条"}], "articles": ["362条", "349条", "356条", "365条"], "pages": [111, 112]}, {"id": "book-kigyoho-01-ch02-r126", "ch": 2, "topic": "取締役の報酬等の決定（361条）", "points": [{"aspect": "趣旨", "text": "本来、報酬等の決定は業務執行行為であり取締役の決定・取締役会の決議によるものである。しかし、それでは取締役によるお手盛りの危険がある。そこで、お手盛りを防止して会社の利益を保護するため、定款で定めるか株主総会決議で定めることとした"}, {"aspect": "趣旨", "text": "5項の趣旨：監査等委員である取締役の監査の適正、独立性を確保するため"}, {"aspect": "趣旨", "text": "6項の趣旨：指名委員会等設置会社の報酬委員会に準じた機能を発揮することで経営監督機能の実効性を確保するため"}, {"aspect": "原則", "text": "報酬等とは：取締役の報酬、賞与その他の職務執行の対価として株式会社から受ける財産上の利益（361条1項かっこ書き）"}, {"aspect": "原則", "text": "手続①：定款または株主総会の（普通）決議によって定める（361条1項）"}, {"aspect": "原則", "text": "手続②：株主総会における取締役の、相当とする理由の説明義務（361条4項）"}, {"aspect": "原則", "text": "監査等委員会設置会社の場合：①②のほかに361条2項・3項・5項（監査等委員である取締役の総会における意見陳述権）・6項（監査等委員である取締役以外の取締役の報酬等についての総会における意見陳述権）。2項3項5項は監査役と同じ"}, {"aspect": "原則", "text": "指名委員会等設置会社の場合は報酬委員会が定める（409条）"}, {"aspect": "条文", "text": "361条・409条"}], "articles": ["361条", "409条"], "pages": [113]}, {"id": "book-kigyoho-01-ch02-r127", "ch": 2, "topic": "（論点）株主総会で報酬の総額や上限を定めて具体的配分等を取締役会に委ねることの可否", "points": [{"aspect": "結論", "text": "取締役の報酬規制の趣旨は、お手盛りを防止して会社の利益を保護することにある。とすれば、株主総会で報酬の総額や上限が定めさえすれば、お手盛りのおそれは生じない。したがって、許されると解する"}, {"aspect": "結論", "text": "最判昭和60・3・26の立場である"}], "articles": [], "pages": [114]}, {"id": "book-kigyoho-01-ch02-r128", "ch": 2, "topic": "（論点）取締役会に一任された報酬の具体的配分等をさらに代表取締役に一任の可否", "points": [{"aspect": "結論", "text": "株主総会で報酬の総額や上限が定められている以上、取締役会が具体的配分等の決定をさらに代表取締役に一任しても、お手盛りを防止して会社の利益を保護するという取締役の報酬規制の趣旨を害さない。したがって、一任できると解する"}, {"aspect": "結論", "text": "最判昭和31・10・5"}], "articles": [], "pages": [114]}, {"id": "book-kigyoho-01-ch02-r129", "ch": 2, "topic": "個人別の報酬等の内容についての決定方針（361条7項）", "points": [{"aspect": "趣旨", "text": "361条7項の趣旨は、取締役の報酬等の内容の決定手続きに関する透明性を向上させるためである"}, {"aspect": "原則", "text": "361条7項：次に掲げる株式会社の取締役会は、取締役（監査等委員である取締役を除く。）の報酬等の内容として定款又は株主総会の決議による第1項各号の事項についての定めがある場合には、当該定めに基づく取締役の個人別の報酬等の内容についての決定に関する方針として法務省令で定める事項を決定しなければならない（ただし書あり）。一 監査役会設置会社（公開会社であり、かつ、大会社であるものに限る。）であって、有価証券報告書を提出しなければならないもの、二 監査等委員会設置会社"}, {"aspect": "原則", "text": "個人別の報酬等の内容についての決定方針を定める義務：①監査役会設置会社・②監査等委員会設置会社は361条7項・会社法施行規則98条の5、③指名委員会設置会社は409条1項2項"}, {"aspect": "原則", "text": "取締役会で定める取締役の個人別の報酬等の決定方針の内容（会社法施行規則98条の5）：i 金銭報酬等・業績連動型報酬等・非金銭報酬等ごとのその額または算定方法の決定の方針、ii 各種類の報酬等の割合の決定の方針、iii 取締役の個人別の報酬等の決定を特定の取締役に再一任する場合は、それに関する事項等"}, {"aspect": "あてはめ", "text": "（参）取締役の報酬等は、会社の業績を高めるためのインセンティブ（動機）を付与するための手段であり、投資家や株主にとっては、金額の多寡のみならず報酬の内容や条件も重要な関心事である。とりわけ上場会社のような会社については報酬等の決定手段の透明性をより向上させるべきである"}, {"aspect": "あてはめ", "text": "361条7項が問題になるのは、上記①〜③の会社で、取締役の個人別の報酬等の決定を取締役会に委任（一任）する場合である。この場合に総額・上限の論点（t358）は問題とならないか。この点に関して明確に記述している学者本はない。361条7項が適用されるからといって、お手盛りの危険性はあり、また361条7項の趣旨はお手盛り防止でもない。したがって、①〜③の会社で一任する場合でも上記論点は必要ではないか。試験的には、「総額または上限を定めて取締役会に一任した事案」で「有効か？」と問われていた場合、上記論点の論証を書けば良い"}, {"aspect": "条文", "text": "361条・98条・409条"}], "articles": ["361条", "98条", "409条"], "pages": [115, 116]}, {"id": "book-kigyoho-01-ch02-r130", "ch": 2, "topic": "（論点）使用人兼務取締役の使用人としての給与は「報酬等」にあたるか", "points": [{"aspect": "結論", "text": "使用人としての給与は、使用人としての給与体系が確立しており、それに従って支給されている場合は、361条1項の「報酬等」にはあたらないと解する。お手盛りを防止して会社の利益を保護するという同条の趣旨に反しないからである"}, {"aspect": "結論", "text": "最判昭和60・3・26の立場である"}, {"aspect": "条文", "text": "361条"}], "articles": ["361条"], "pages": [117]}, {"id": "book-kigyoho-01-ch02-r131", "ch": 2, "topic": "（論点）退職慰労金は「報酬等」にあたるか", "points": [{"aspect": "結論", "text": "退職慰労金は、在任中の功労に対する報奨という性質のほかに、報酬の後払い的性質もある以上、報酬規制を適用しないと、お手盛りを防止して会社の利益を保護するという取締役の報酬規制の趣旨が没却されることになる。したがって、取締役の退職慰労金は「報酬等」にあたると解する"}], "articles": [], "pages": [117]}, {"id": "book-kigyoho-01-ch02-r132", "ch": 2, "topic": "（論点）退職慰労金の支給だけを決めて具体的金額等の決定を取締役会に一任することの可否", "points": [{"aspect": "結論", "text": "無条件に一任することは許されないが、会社の業績・功績の軽重等から割り出した一定の基準によって退職慰労金を決定する慣例が確立しており、かつ、株主がその基準を知りうる状況にあった場合に、この慣例に従って定めることを黙示して決議したとみられるときは、取締役会への一任は許されると解する"}, {"aspect": "結論", "text": "最判昭和39・12・11、最判昭和44・10・28の立場である。ただし、両判例はこの論点に関して明確な論証をしておらず、論証は学者がしているに過ぎず、論証自体学者によって少し異なる"}, {"aspect": "あてはめ", "text": "判例の共通項：①支給基準が確立していること（取締役会規則（内規）や慣習によって）、②支給基準の周知性（支給基準を株主が知ることができる状況にあること。44年判例で明確に要求）。39年判例は年代的に会社法施行規則82条2項は存在しておらず「慣習」によって支給基準があった事案であるが、現在では「取締役会規則（内規）」の問題となるであろう"}, {"aspect": "あてはめ", "text": "実務では、一定の基準を記載した書面を会社の本店に備え置いて、株主が請求したときは閲覧させる措置をとっていることが多い。そのような措置を執っていない場合は、株主総会参考書類に一定の基準の内容を記載しなければならない（会社法施行規則82条2項）"}, {"aspect": "条文", "text": "82条"}], "articles": ["82条"], "pages": [118]}, {"id": "book-kigyoho-01-ch02-r133", "ch": 2, "topic": "（参考）361条1項3号・4号・5号（株式・新株予約権・金銭債権を報酬として）", "points": [{"aspect": "原則", "text": "445条6項：「資本金又は準備金として計上すべき額」については「法務省令」で定める。「取締役等が提供した役務の公正な評価額」（会社法計算規則42条の2、42条の3）"}, {"aspect": "条文", "text": "361条・199条・202条・236条・445条・42条"}], "articles": ["361条", "199条", "202条", "236条", "445条", "42条"], "pages": [119]}, {"id": "book-kigyoho-01-ch02-r134", "ch": 2, "topic": "（論点）取締役の報酬等の事後的な変更の可否", "points": [{"aspect": "結論", "text": "いったん定款または株主総会の決議において取締役の報酬等の額が定められた場合、その報酬額は株式会社と取締役間の委任契約の内容となり契約当事者双方を拘束することになる。したがって、たとえ事後的に株主総会の決議で取締役の報酬を無報酬（または減額）とする旨の決定がなされたとしても、会社が一方的に取締役の報酬を無報酬（または減額）とすることができないと解する。もっとも、取締役が事前に同意していれば、無報酬（または減額）も可能と解する"}, {"aspect": "結論", "text": "最判平成4・12・18"}, {"aspect": "結論", "text": "内規または慣行によって取締役の報酬額が役職ごとに決められている場合に、取締役がその内規・慣行を了知して取締役に就任した場合、任期中に役職が変更されたときは、それに伴い報酬等も減額されることに黙示に同意していると解する（東京地判平成2・4・20）"}, {"aspect": "条文", "text": "648条"}], "articles": ["648条"], "pages": [120]}, {"id": "book-kigyoho-01-ch02-r135", "ch": 2, "topic": "（論点）定款または株主総会の定めがない場合の報酬請求権", "points": [{"aspect": "結論", "text": "取締役の報酬請求権は、取締役に選任されたことによって当然に生じるものではなく、報酬に関する定款または株主総会の定めによって生じるものである。したがって、定款または株主総会の決議によって報酬の金額が定められなければ、具体的な報酬請求権は発生せず、取締役が会社に対して報酬を請求することはできない"}, {"aspect": "結論", "text": "最判平成15・2・21"}, {"aspect": "結論", "text": "ただし、報酬等の支給について、株主全員の同意がある場合には、定款または株主総会の定めがなくても、当該支給は適法・有効となる（最判平成15・2・21）"}], "articles": [], "pages": [120]}, {"id": "book-kigyoho-01-ch02-r136", "ch": 2, "topic": "（論点）報酬等に支給後の株主総会の追認決議（最判平成17・2・15）", "points": [{"aspect": "結論", "text": "報酬等の支給後に株主総会の追認決議があれば、当該支給は適法・有効となる（最判平成17・2・15）"}], "articles": [], "pages": [120]}, {"id": "book-kigyoho-01-ch02-r137", "ch": 2, "topic": "株主の監督権限の強化（総論）", "points": [{"aspect": "設例", "text": "[論証例]企業経営の合理性と適正の調和の観点からすれば、監査役の権限の縮小は、株主の監督権限の強化・拡大との引き換えに認められるにすぎない"}], "articles": [], "pages": [121]}, {"id": "book-kigyoho-01-ch02-r138", "ch": 2, "topic": "具体例① 株主による取締役の違法行為差止請求権（360条1項3項）", "points": [{"aspect": "趣旨", "text": "取締役・執行役がなれ合い、他の取締役・執行役の違法行為を差し止めることが期待できない場合もある。そこで、会社・株主の利益を保護するため、株主による差止めを認めたのである"}, {"aspect": "要件", "text": "360条1項3項の＜要件＞はレジュメでは「ⅰ」「ⅱ」「ⅲ」の番号のみで、要件の内容の記載がない"}, {"aspect": "要件", "text": "cf. 422条の＜要件＞もレジュメでは「ⅰ」「ⅱ」「ⅲ」の番号のみで内容の記載がない（422条の要件自体は項目8の t322 に記載あり）"}, {"aspect": "条文", "text": "360条・422条"}], "articles": ["360条", "422条"], "pages": [121]}, {"id": "book-kigyoho-01-ch02-r139", "ch": 2, "topic": "具体例②〜④（357条1項・367条・371条）", "points": [{"aspect": "原則", "text": "②会社に著しい損害を及ぼすおそれのある事実を発見した場合の取締役の報告の宛先は、監査役ではなく株主である（357条1項）"}, {"aspect": "原則", "text": "③株主は一定の場合には取締役会招集請求権・招集権を行使でき（367条1項3項）、当該取締役会への出席・意見陳述権を有する（同条4項）"}, {"aspect": "要件", "text": "④株主の取締役会議事録閲覧請求権の行使要件が緩和され裁判所の許可が不要（371条2項3項）"}, {"aspect": "条文", "text": "357条・367条・371条"}], "articles": ["357条", "367条", "371条"], "pages": [121]}, {"id": "book-kigyoho-01-ch02-r140", "ch": 2, "topic": "役員等の会社に対する責任（423条1項）の要件", "points": [{"aspect": "要件", "text": "423条1項責任の要件は、①役員等、②任務懈怠（「役員等の任務懈怠であること」）、③会社に損害が発生したこと、④任務懈怠と会社の損害との間の相当因果関係、⑤役員等に故意・過失があること"}, {"aspect": "結論", "text": "解答例における要件の定式：①役員等であること、②役員等に会社に対する任務懈怠があること、③会社に損害が発生していること、④会社の損害の発生と任務懈怠の間に相当因果関係があること、⑤役員等に故意または過失があること"}, {"aspect": "あてはめ", "text": "事案の着目点：「会社に損害」がある事案で「会社が」取締役等に損害賠償請求したいと思えば、多くは423条の問題になる"}, {"aspect": "条文", "text": "423条"}], "articles": ["423条"], "pages": [122, 124]}, {"id": "book-kigyoho-01-ch02-r141", "ch": 2, "topic": "任務懈怠の意義と具体的な条文違反がある場合（A）", "points": [{"aspect": "結論", "text": "任務懈怠とは法令定款違反行為である。取締役は法令を遵守すべきであるため、法令違反があればそれだけで任務懈怠があるといえる"}, {"aspect": "あてはめ", "text": "通常、取締役に法令違反があれば過失（不注意）も認められる。取締役は会社法などの条文を知っているはず（知っているべき）なので、法令違反は少なくとも不注意（過失）でなされたといえるからである"}, {"aspect": "条文", "text": "356条・365条"}], "articles": ["356条", "365条"], "pages": [122]}, {"id": "book-kigyoho-01-ch02-r142", "ch": 2, "topic": "具体的な条文違反がない場合（B）―善管注意義務・忠実義務違反としての任務懈怠", "points": [{"aspect": "結論", "text": "具体的な条文違反の行為がない場合は、善管注意義務違反（330条、民法644条）・忠実義務違反（355条）の問題と考える。両義務の一内容として「○○する義務」があると考え、その義務違反行為があると考える"}, {"aspect": "あてはめ", "text": "考え方・書き方：まず取締役ならば通常負うべき義務（例：監視義務、取締役会に報告する義務、会社財産を維持する義務）を問題文から具体的に考え、答案では「○○義務があるといえる」→「それにもかかわらず○○しなかったので○○義務違反、すなわち任務懈怠・過失が認められる」と書く"}, {"aspect": "あてはめ", "text": "「過失」は、善管注意義務・忠実義務違反があるかどうかを考える中で判断することになる"}, {"aspect": "条文", "text": "330条・644条・355条"}], "articles": ["330条", "644条", "355条"], "pages": [123]}, {"id": "book-kigyoho-01-ch02-r143", "ch": 2, "topic": "任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照", "points": [{"aspect": "趣旨", "text": "一部免除の趣旨：役員等に高額の賠償責任を負わせたのでは、経営が萎縮してしまいかえって株主に不利益を与えるおそれがあるため"}, {"aspect": "原則", "text": "424条：423条1項の責任は、総株主の同意がなければ免除することができない（全部免除）"}, {"aspect": "原則", "text": "一部免除の方法：425条は事後の株主総会特別決議による一部免除、426条は事前の定款規定＋事後の取締役会決議（取締役の過半数）による一部免除、427条は事前の定款規定＋事前の非業務執行取締役等との責任限定契約"}, {"aspect": "原則", "text": "一部免除の共通点①：「職務を行うにつき善意でかつ重大な過失がない」ことが必要"}, {"aspect": "原則", "text": "423条の推定構造（図）：競業取引は423条1項＋2項（③損害額を推定）、利益相反取引は（423条1項＋）3項（②任務懈怠を推定）、428条は無過失責任"}, {"aspect": "原則", "text": "430条：役員等の連帯責任（429条責任の解説部分における430条参照）"}, {"aspect": "あてはめ", "text": "一部免除の共通点②：監査役・監査委員の同意が必要であり、過半数の同意ではなく全員の同意であることに注意"}, {"aspect": "条文", "text": "424条・423条・425条・426条・427条・428条・430条・429条"}], "articles": ["424条", "423条", "425条", "426条", "427条", "428条", "430条", "429条"], "pages": [123]}, {"id": "book-kigyoho-01-ch02-r144", "ch": 2, "topic": "教材設例：競業取引（パンの製造販売）に対する423条1項のあてはめ", "points": [{"aspect": "設例", "text": "事案：甲社（東京でパンの製造販売）の取締役Aが、甲社の承諾なく東京でパンの製造販売を行い800万円の利益を得た。甲社はAに損害賠償請求できるか"}, {"aspect": "設例", "text": "解答例：競業取引とは、取締役が自己又は第三者のためにする株式会社の事業の部類に属する取引である。「自己又は第三者のために」とは名義ではなく自己又は第三者の計算においてを意味する（趣旨は会社の利益保護であり、誰に経済的利益が帰属するかを問題にすべきだから）"}, {"aspect": "設例", "text": "解答例：「会社の事業の部類に属する取引」とは、会社が実際に行っている事業が市場において競業し、会社と取締役・第三者の間で利益衝突が生じるおそれがある取引をいう"}, {"aspect": "設例", "text": "解答例の結論：Aの行為は競業取引にあたり承諾がないため356条1項1号、365条1項違反で任務懈怠・故意が認められ、甲社の損害額は800万円と推定され（423条2項）、相当因果関係も認められるので、Aの損害賠償責任は認められる"}, {"aspect": "あてはめ", "text": "相当因果関係の注意点：何と何との間に相当因果関係が必要か意識すること（特に任務懈怠のほう）。「相当」とは、異常でないこと、通常であること"}, {"aspect": "条文", "text": "356条・365条・423条"}], "articles": ["356条", "365条", "423条"], "pages": [124]}, {"id": "book-kigyoho-01-ch02-r145", "ch": 2, "topic": "要件⑤ 故意・過失の意義", "points": [{"aspect": "原則", "text": "法律用語の「故意」とは「わざと」ではない。故意とは認識・認容であり、任務懈怠を認識し、認容していた場合に故意ありといえる"}, {"aspect": "原則", "text": "「過失」とは注意義務違反をいう。結果予見義務違反とかそれに加えて結果回避義務違反とかいう考えもある"}, {"aspect": "あてはめ", "text": "前述の＜事例＞では、Aが承諾なくパンの製造販売をすることが法律に反することを認識しているのに、それでもいいと認容している場合は、Aに故意があるといえる（解答を「過失」ではなく「故意も認められる」としてもよい）"}, {"aspect": "あてはめ", "text": "過失の実践的な考え方：注意を払えば任務懈怠（または結果＝損害の発生）を認識できたのに、不注意で（注意を怠って）任務懈怠を認識しなかったかを考える"}], "articles": [], "pages": [125]}, {"id": "book-kigyoho-01-ch02-r146", "ch": 2, "topic": "「善意無重過失」のあてはめ（認定）に関する注意", "points": [{"aspect": "原則", "text": "重過失とは、著しい注意義務違反、注意義務違反の程度が著しい状態のことである"}, {"aspect": "あてはめ", "text": "実践的な認定①：問題の事実から「わずかな注意を払えば、○○を知り得た」「ちょっと注意すれば、○○を知り得た」かを考える"}, {"aspect": "あてはめ", "text": "認定②（重過失の認定が勝負の問題の場合）：取引の相手方に確認（調査）義務があり、確認（調査）が容易で可能なのに確認（調査）しなかったならば、相手方に重過失あり"}, {"aspect": "あてはめ", "text": "認定③（問題文から認定できない場合）：答案には「善意無重過失の場合は……」との条件付きあてはめをする"}], "articles": [], "pages": [126]}, {"id": "book-kigyoho-01-ch02-r147", "ch": 2, "topic": "（論点）内部統制システム構築義務", "points": [{"aspect": "原則", "text": "前提条文：大会社および監査等委員会設置会社・指名委員会等設置会社においては、取締役会（取締役会非設置会社においては取締役）による内部統制システムの構築義務がある（348条3項4号・4項・施行規則98条、362条4項6号・5項・施行規則100条、399条の13第1項1号ロハ・2項・施行規則110条の4、416条1項1号ロホ・2項・施行規則112条）"}, {"aspect": "原則", "text": "事業報告（435条2項）によって、内部統制システムの決定内容の概要および運用状況の概要を開示する（施行規則118条2号）"}, {"aspect": "結論", "text": "構築義務の論証：大会社である取締役会設置会社においては取締役会に内部統制システムの構築が義務づけられている（362条4項6号、5項）ため、各取締役は取締役会の構成員として、善管注意義務の一内容として内部統制システムの構築義務を負う"}, {"aspect": "結論", "text": "構築の程度（B）：最判平成21・7・9参照の論証によれば、内部統制システムの程度は通常想定される不正行為を防止し得る程度のもので足りる（一切の不正行為を完全に排除するようなシステムまでは要しない）"}, {"aspect": "あてはめ", "text": "（A）内部統制システム（リスク管理体制）を一切構築（決定）していないならば、取締役自身の任務懈怠が認められる"}, {"aspect": "条文", "text": "348条・98条・362条・100条・399条・110条・416条・112条・435条・118条"}], "articles": ["348条", "98条", "362条", "100条", "399条", "110条", "416条", "112条", "435条", "118条"], "pages": [127, 128]}, {"id": "book-kigyoho-01-ch02-r148", "ch": 2, "topic": "（論点）内部統制システム運用義務", "points": [{"aspect": "結論", "text": "運用義務の論証例：各取締役は取締役会の構成員として、善管注意義務の一内容として内部統制システムを（構築）運用する義務を負う"}, {"aspect": "結論", "text": "信頼の原則：内部統制システムの構築が適正な場合、取締役は、内部統制システムにしたがって他の取締役が適切に職務を遂行しているものと信頼することが許される。あえて疑念を差し挟むべき事情があるにもかかわらずこれを放置したなどの特段の事情がない限り、運用義務違反は認められない"}, {"aspect": "あてはめ", "text": "下線部の別表現：Xの行為に「疑いを抱かせる事情」または「躊躇を覚える事情」"}], "articles": [], "pages": [129, 130]}, {"id": "book-kigyoho-01-ch02-r149", "ch": 2, "topic": "（論点）経営判断の原則", "points": [{"aspect": "結論", "text": "経営判断原則：経営はリスクを伴うものであり、会社に損害が生じたといって取締役の義務違反が容易に認められると経営は萎縮し会社・株主の利益とならない。そこで経営判断については取締役に広い裁量が認められるべきであり、その判断の過程・内容において著しく不合理な点がなければ、善管注意義務（330条、民法644条）に違反するものではない（最判平成22・7・15）"}, {"aspect": "あてはめ", "text": "違法行為を行うことを判断した場合には経営判断原則は適用できない。そもそも違法行為を選択することの裁量は取締役にもないからである"}, {"aspect": "あてはめ", "text": "判断の「過程」のあてはめ：経営会議を経たか、弁護士の意見を求めたか、専門家の調査を行ったか等の情報収集や分析・検討を経なかった等に「著しい不合理」があるといえるかを書く"}, {"aspect": "あてはめ", "text": "判断の「内容」のあてはめ：不合理といえても「著しい」とまでいえるのかをあてはめで書く"}, {"aspect": "条文", "text": "330条・644条"}], "articles": ["330条", "644条"], "pages": [131, 132]}, {"id": "book-kigyoho-01-ch02-r150", "ch": 2, "topic": "（論点）取締役による従業員の引き抜き行為（退職勧誘行為）", "points": [{"aspect": "結論", "text": "論点1：引き抜き勧誘は競業取引にあたらない。在任中に部下の研究主任を自己の事業への参加を勧誘する行為（引き抜き行為）自体は「取引」（356条1項1号）ではないから、356条1項1号・365条1項違反という任務懈怠は認められない"}, {"aspect": "結論", "text": "論点2の義務：取締役は、善管注意義務・忠実義務（330条、民法644条、355条）の一内容として、会社の利益を犠牲にして自己または第三者の利益を図らない義務を負う"}, {"aspect": "結論", "text": "地裁判示：取締役の具体的行為が善管注意義務及び忠実義務に違反しているか否かは、従業員の引抜きや競業取引による取引先奪取等の取締役の行為に至るまでの会社内部の事情、当該取締役と従業員の人的な関係、当該取締役の行為による会社の業務に与える影響の度合い等を総合して、不当な態様か否かにより判断するのが妥当である"}, {"aspect": "あてはめ", "text": "検討の枠組み：423条1項の一番重要な要件に限って、取締役の作為（行為）・不作為が会社に対する任務懈怠となるか（本件では「勧誘」が任務懈怠となるか）を、①競業取引該当性、②その他の任務懈怠の順に考える"}, {"aspect": "あてはめ", "text": "任務懈怠にならない行為：従業員に対して退職を勧誘せず、単に自分が退任して事業を始める意図であることを伝える行為は任務懈怠にならない。また、取締役退任後に従業員を勧誘する行為は自由である"}, {"aspect": "条文", "text": "423条・356条・365条・330条・644条・355条"}], "articles": ["423条", "356条", "365条", "330条", "644条", "355条"], "pages": [133, 134]}, {"id": "book-kigyoho-01-ch02-r151", "ch": 2, "topic": "株主による責任追及等の訴え（株主代表訴訟、847条）", "points": [{"aspect": "趣旨", "text": "趣旨：役員等がなれ合い、役員等の会社に対する責任追及が不問に付されてしまう危険があるため"}, {"aspect": "要件", "text": "要件：①6ヶ月株式を保有する株主による（非公開会社は6ヶ月要件不要、2項）、②責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項）"}, {"aspect": "要件", "text": "会社が第1項の提訴請求の日から60日以内に責任追及等の訴えを提起しないこと（847条3項）が、株主が訴えを提起できる要件となる"}, {"aspect": "あてはめ", "text": "「責任追及等の訴え」の典型例は423条1項。「役員等の責任を追及する訴え」とは役員等の会社に対する取引債務（判例）をいい、役員等の会社に対する不法行為上の責任は含まない。役員等の会社に対する委任契約違反によって生じる債務＝423条1項"}, {"aspect": "条文", "text": "847条・423条"}], "articles": ["847条", "423条"], "pages": [135]}, {"id": "book-kigyoho-01-ch02-r152", "ch": 2, "topic": "旧株主による責任追及等の訴え（847条の2）", "points": [{"aspect": "趣旨", "text": "趣旨：株主が責任追及の訴えを提起する前に株式交換等がなされ、株主による役員等の責任追及を不可能にすることを防ぐため"}, {"aspect": "原則", "text": "1号（株式交換・株式移転で完全親会社株主になった場合）と2号（三角合併で完全親会社の株主になった場合）の共通点：株主Xは完全親会社株主になる"}, {"aspect": "原則", "text": "847条の2第1項：行為の効力が生じた日の6ヶ月前から当該日まで引き続き株主であった者（旧株主）は、株主でなくなった場合であっても、各号に定めるときは、株式交換等完全子会社に対し、責任追及等の訴え（効力が生じた時までに原因事実が生じた責任・義務に係るものに限る）の提起を請求できる。ただし図利加害目的の場合はこの限りでない"}, {"aspect": "原則", "text": "847条の2第1項ただし書：責任追及等の訴えが旧株主若しくは第三者の不正な利益を図り又は株式交換等完全子会社若しくは完全親会社に損害を加えることを目的とする場合は、提訴請求できない"}, {"aspect": "原則", "text": "847条の2第6項：株式交換等完全子会社が1項の請求の日から60日以内に責任追及等の訴えを提起しないときは、提訴請求をした旧株主は、株式交換等完全子会社のために責任追及等の訴えを提起することができる"}, {"aspect": "あてはめ", "text": "cf. 代表訴訟の係属中に株主でなくなった者の訴訟追行（851条）"}, {"aspect": "条文", "text": "847条・851条"}], "articles": ["847条", "851条"], "pages": [136, 137]}, {"id": "book-kigyoho-01-ch02-r153", "ch": 2, "topic": "最終完全親会社等の株主による特定責任追及の訴え（多重代表訴訟等、847条の3）", "points": [{"aspect": "趣旨", "text": "趣旨：子会社の役員等の任務懈怠等について、最終完全親会社等による責任追及の懈怠の可能性があり、その場合に最終完全親会社等の株主の利益が害されるのを防ぐため"}, {"aspect": "原則", "text": "「特定責任」とは……総資産額の1/5を超える……（4項）"}, {"aspect": "要件", "text": "要件：①6ヶ月継続して最終完全親会社等の総議決権の1/100以上株式を有する株主による（非公開会社は6ヶ月要件不要、6項）、②特定責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項）"}, {"aspect": "要件", "text": "第1項の請求の日から60日以内に特定責任追及の訴えを提起しないこと（7項）が、株主が訴えを提起できる要件となる"}, {"aspect": "条文", "text": "847条"}], "articles": ["847条"], "pages": [138]}, {"id": "book-kigyoho-01-ch02-r154", "ch": 2, "topic": "429条1項の趣旨・責任の性質（特別法定責任説）", "points": [{"aspect": "要件", "text": "参照条文（民法709条）：故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。要件の一つは加害行為についての故意過失"}, {"aspect": "結論", "text": "特別法定責任説：株式会社は経済社会において重要な地位を占め、取締役の重要性からすれば取締役の責任を加重すべき（＝第三者を広く保護すべき）である。そこで429条は法が特に規定した責任である"}, {"aspect": "あてはめ", "text": "事案の着目点：「第三者に損害」がある事案で「第三者が」取締役等に損害賠償請求したいと思えば、多くは429条の問題になる"}, {"aspect": "条文", "text": "429条・709条"}], "articles": ["429条", "709条"], "pages": [139]}, {"id": "book-kigyoho-01-ch02-r155", "ch": 2, "topic": "429条1項の要件", "points": [{"aspect": "原則", "text": "429条1項：役員等がその職務を行うについて悪意又は重大な過失があったときは、当該役員等は、これによって第三者に生じた損害を賠償する責任を負う"}, {"aspect": "原則", "text": "間接損害とは、役員等の任務懈怠によって会社に損害が発生して、その結果、第三者が被る損害。例：役員が回収の見込みのない貸付けを行い会社の損害が発生して会社が倒産し、その結果会社債権者が債権を回収できなくなる場合"}, {"aspect": "原則", "text": "直接損害とは、役員等の任務懈怠によって第三者が直接被った損害。例：役員が、代金支払いの見込みがないのに会社を代表して契約を締結する場合"}, {"aspect": "要件", "text": "要件①「役員等」の範囲の概要：名目的取締役は含む。表見的取締役は登記について本人の「承諾」があれば、退任取締役は「明示的な承諾」があれば、908条2項類推適用で「役員等」でないと主張できなくなる"}, {"aspect": "要件", "text": "要件②：何についての悪意・重過失かは、趣旨から広く、任務懈怠についての悪意・重過失であればよい（第三者への加害行為についての悪意・重過失ではない）"}, {"aspect": "要件", "text": "要件③：任務懈怠と損害の発生との間に相当因果関係があること（「異常でない」「通常」）"}, {"aspect": "要件", "text": "要件④「第三者」：会社債権者のみならず株主も含む。株主も会社から見れば第三者だからである。もっとも、間接損害の場合に株主も「第三者」に含むかは争いがある（論点）"}, {"aspect": "要件", "text": "要件⑤「損害」：趣旨から広く考え、直接損害・間接損害を含む"}, {"aspect": "条文", "text": "429条・908条"}], "articles": ["429条", "908条"], "pages": [140]}, {"id": "book-kigyoho-01-ch02-r156", "ch": 2, "topic": "教材設例1・2：429条1項のあてはめと（論点）間接損害の場合に株主も「第三者」に含むか", "points": [{"aspect": "結論", "text": "間接損害の場合に「第三者」に株主は含まないとする有力説があるが、判例は必ずしもどちらともいえないようである"}, {"aspect": "条文", "text": "429条・362条・847条"}], "articles": ["429条", "362条", "847条"], "pages": [141, 142]}, {"id": "book-kigyoho-01-ch02-r157", "ch": 2, "topic": "（論点）代表取締役の独断行為を黙認した取締役の任務懈怠・監視義務", "points": [{"aspect": "原則", "text": "監視義務と内部統制システムの構築・運用義務の関係：事業規模が相当大きくなった株式会社では取締役が自分で業務全部を監視することは非現実的であり、監視義務を補完する形で大会社等に内部統制システムの整備義務を課している。したがって問題文で内部統制システムの整備義務が問題になっている場合は監視義務違反を論ずる可能性は低い。もっとも、任務懈怠が内部統制システムの内容と全く関係のないものである場合は監視義務違反が問題となる場合もある"}, {"aspect": "結論", "text": "論点の所在：代表取締役の独断行為を黙認した取締役にも「任務懈怠」が認められるか（取締役の監視義務、その範囲。要件①に関して）"}, {"aspect": "結論", "text": "最判昭和48・5・22の立場：取締役は取締役会の構成員である以上、他の取締役を監視する義務を負う。そして取締役の監視義務は、取締役会上程事項に限定されず、会社の業務全般に及ぶ。平取締役も取締役会を招集でき（366条）、取締役会による監督機能（362条2項2号）を働かせることができる仕組みとなっており、その前提として平取締役も他の取締役を常時監視する必要があるからである"}, {"aspect": "結論", "text": "非取締役会設置会社における取締役の監視義務：「善管注意義務・忠実義務の一内容として、業務執行の監視義務を負うと解する」（新潟地判平成21・12・1）"}, {"aspect": "あてはめ", "text": "監視義務の内容（調査義務・是正義務）：問題文の事実に、取締役が「他の取締役・従業員の業務執行の適正さに疑いをいだいた」との記載があれば調査義務が、他の取締役の「不法行為等が明らかになった」との記載があれば是正義務が生じる。是正の具体的方法は代表取締役の解任（362条2項3号）、株主・監査役への報告（357条）、差止請求（360条・385条等）を促すことなど"}, {"aspect": "条文", "text": "366条・362条・357条・360条・385条"}], "articles": ["366条", "362条", "357条", "360条", "385条"], "pages": [140, 143, 144]}, {"id": "book-kigyoho-01-ch02-r158", "ch": 2, "topic": "（論点）名目的取締役・表見的取締役・退任取締役の定義と名目的取締役の「役員等」該当性", "points": [{"aspect": "原則", "text": "名目的取締役とは、適法な選任決議を経て取締役に就任しているが、会社経営にほとんど関与しない取締役"}, {"aspect": "原則", "text": "表見的取締役とは、登記簿上取締役として登記されているが、株主総会の適法な選任手続を経ていない者"}, {"aspect": "原則", "text": "退任取締役とは、登記簿上取締役として登記されているが、既に取締役の任期満了・辞任等によって取締役の地位を失った者"}, {"aspect": "結論", "text": "名目的取締役は「役員等」に含まれる：名ばかりの取締役であり会社経営に関与していなくても、名目的であれ適法に選任されている以上「役員等」に含まれる（最判昭和55・3・18の立場）"}], "articles": [], "pages": [145]}, {"id": "book-kigyoho-01-ch02-r159", "ch": 2, "topic": "（論点）表見的取締役も「役員等」に含まれるか", "points": [{"aspect": "原則", "text": "（参）908条2項：故意又は過失によって不実の事項を登記した者は、その事項が不実であることをもって善意の第三者に対抗することができない"}, {"aspect": "結論", "text": "原則：表見的取締役は株主総会の適法な選任手続を経ていない以上「役員等」でないから、429条1項の責任を負わないのが原則である。しかし、登記簿上取締役である者が一切責任を負わないとするのは妥当でない"}, {"aspect": "結論", "text": "908条2項の類推適用：同項は不実の登記をした者の責任を定め登記申請を行うのは株式会社自身であるから表見的取締役には直接適用はない。しかし同項の趣旨は権利外観理論を基礎として取引の安全を図ることにあり、不実登記の出現に帰責性のある者には類推適用すべきである。そこで、表見的取締役が登記されることに承諾を与えていた場合は、908条2項の類推適用により自己が取締役でないことを善意の第三者に対抗できず、429条1項の責任を免れない（最判昭和47・6・15の立場）"}, {"aspect": "条文", "text": "429条・908条"}], "articles": ["429条", "908条"], "pages": [146]}, {"id": "book-kigyoho-01-ch02-r160", "ch": 2, "topic": "（論点）退任取締役も「役員等」に含まれるか", "points": [{"aspect": "原則", "text": "表見的取締役と退任取締役の承諾の違い：表見的取締役は登記について本人の「承諾」（明示的・黙示的承諾）があればよいが、退任取締役は「明示的な承諾」が必要である"}, {"aspect": "結論", "text": "原則と例外：退任取締役は退任しているので「役員等」ではなく429条1項の責任を負わないのが原則である。しかし、退任取締役が不実の取締役登記を残存させることに明示的な承諾を与えていた場合は、908条2項の類推適用により自己が取締役でないことを善意の第三者に対抗できず、429条1項の責任を免れない（最判昭和62・4・16の立場）"}, {"aspect": "あてはめ", "text": "承諾の違いの理由：辞任登記の場合、辞任した取締役は辞任登記の手続を代表取締役等に託さざるを得ないが、就任登記の場合には就任承諾書の添付が要求される（商業登記法54条1項と4項対比）点で異なる（野田博先生）。また、辞任者には自ら登記申請する権利も義務もなく、会社が登記申請を怠っている場合に積極的にそれを是正することまで退任取締役に求めるのは酷である（田中亘先生）"}, {"aspect": "条文", "text": "429条・908条・54条"}], "articles": ["429条", "908条", "54条"], "pages": [147]}, {"id": "book-kigyoho-01-ch02-r161", "ch": 2, "topic": "教材問題：429条1項責任（名目的取締役B・退任取締役C）と解答例", "points": [{"aspect": "設例", "text": "問題1解答例の要件定式：429条1項は第三者保護の観点から法が認めた特別の法定責任であり、①役員等の会社に対する任務懈怠があること、②任務懈怠について悪意・重過失があること、③第三者に直接・間接を問わず損害があること、④役員の任務懈怠と第三者の損害との間に相当因果関係があることが必要"}, {"aspect": "設例", "text": "問題1（Bの主張）：Bは名目的取締役であることを理由に責任の否定を主張するが、名目的取締役であっても適法に選任され就任承諾をしているため429条1項の「役員等」（423条1項参照）であることに変わりなく、Bの主張は認められない"}, {"aspect": "設例", "text": "問題1（監視義務）：取締役会設置会社の取締役は監督権限（362条2項2号）を有する取締役会の構成員である以上、取締役の業務執行の監視義務を負い、それは取締役会非上程事項にまで及ぶ。平取締役も取締役会の招集権や招集請求権（366条）が認められているためである"}, {"aspect": "設例", "text": "問題1の結論：Bには監視義務という任務の懈怠があり少なくとも重過失があるが、Bの意見は日頃からAに一切聞き入れられなかったことから、Bが監視義務を果たしAの本件借入を止めようとしても止められたとは通常考えられず、相当因果関係があるとはいえない。したがってXのBに対する損害賠償請求は認められない"}, {"aspect": "設例", "text": "問題2（Cの主張）の論証枠組み：908条2項は登記申請者の責任を定めた規定であり退任取締役には適用がないが、その趣旨は権利外観理論を基礎として取引の安全を図ることにあり、退任取締役が不実の取締役登記を残存させることに明示的な承諾を与えていた場合は、908条2項の類推適用により取締役でないことを善意の第三者に対抗できず、429条1項の責任を免れない"}, {"aspect": "設例", "text": "問題2の結論：CはAとはもう連絡をとりたくないと思い放置していたにすぎず、明示的な承諾を与えていたわけではないから、908条類推適用はなされず、Cは429条1項の責任を負わない。Cの主張は認められ、XのCに対する損害賠償請求は認められない"}, {"aspect": "条文", "text": "429条・423条・362条・366条・908条"}], "articles": ["429条", "423条", "362条", "366条", "908条"], "pages": [148, 149]}, {"id": "book-kigyoho-01-ch02-r162", "ch": 2, "topic": "429条2項（会計監査人の責任を例に）", "points": [{"aspect": "原則", "text": "429条2項：各号に掲げる者が当該各号に定める行為をしたときも前項と同様とする。ただし、その者が当該行為をすることについて注意を怠らなかったことを証明したときはこの限りでない。4号は会計監査人による会計監査報告に記載し、又は記録すべき重要な事項についての虚偽の記載又は記録"}, {"aspect": "要件", "text": "会計監査人の429条2項責任の要件：①会計監査人による会計監査報告の虚偽記載記録、②会計監査人の過失（注意を怠らなかったことの証明のないこと）"}, {"aspect": "要件", "text": "要件③④はレジュメ本文では番号のみで内容が記載されていない（空欄）"}, {"aspect": "結論", "text": "（参考）東京地判平成19・11・28：会計監査人の責任について、公認会計士協会の作成した実務指針に則って会計監査しており、注意を怠らなかったとして否定した"}, {"aspect": "結論", "text": "（参考）東京地判平成17・6・27：役員等が虚偽記載しても、第三者の損害は虚偽記載によるものとは無関係の事情による会社の倒産によるものとして、責任を否定した（相当因果関係を否定）"}, {"aspect": "条文", "text": "429条"}], "articles": ["429条"], "pages": [150]}, {"id": "book-kigyoho-01-ch02-r163", "ch": 2, "topic": "役員等の連帯責任（430条）", "points": [{"aspect": "原則", "text": "430条：役員等が株式会社又は第三者に生じた損害を賠償する責任を負う場合において、他の役員等も当該損害を賠償する責任を負うときは、これらの者は連帯債務者とする"}, {"aspect": "あてはめ", "text": "図による問題設定：BはAと連帯責任なので、429条1項の要件を満たさなくても430条によって責任が生じるか（という疑問が図で提示されている）"}, {"aspect": "条文", "text": "430条・429条"}], "articles": ["430条", "429条"], "pages": [150]}, {"id": "book-kigyoho-01-ch02-r164", "ch": 2, "topic": "補償契約・保険契約の趣旨（令和元年改正）", "points": [{"aspect": "趣旨", "text": "趣旨：①補償契約・保険契約を自由に認めたのでは、役員等の職務の執行の適正性が損なわれるおそれがあるため、②会社と役員等との利益が相反する場面があるので、利益相反規制に準じた規制をするため"}, {"aspect": "原則", "text": "補償契約は直接利益相反取引（356条1項2号）と同じ状況である"}, {"aspect": "条文", "text": "356条"}], "articles": ["356条"], "pages": [151]}, {"id": "book-kigyoho-01-ch02-r165", "ch": 2, "topic": "補償契約（430条の2）", "points": [{"aspect": "原則", "text": "430条の2第1項：補償契約の内容決定手続は株主総会の普通決議・取締役会決議（趣旨②に対応）"}, {"aspect": "原則", "text": "423条1項の賠償金の補償を内容とする契約締結はできない。できるとすると、424条以下の免除の規定によらずに免除を認めると同じことになるからである（趣旨①）"}, {"aspect": "原則", "text": "「対処するために支出する費用」（防御費用、例：訴訟費用や弁護士報酬）は補償内容とする契約締結が可能である（1号）"}, {"aspect": "原則", "text": "429条・民法709条の賠償金等の補償を内容とする契約の締結は可能である（賠償金は2号イ、和解金は2号ロ）"}, {"aspect": "原則", "text": "2項（「補償することができない」場合）：3号により、429条1項の賠償金等の補償をすることができない場合がある"}, {"aspect": "条文", "text": "430条・423条・424条・429条・709条"}], "articles": ["430条", "423条", "424条", "429条", "709条"], "pages": [151]}, {"id": "book-kigyoho-01-ch02-r166", "ch": 2, "topic": "役員等のための保険契約（430条の3）＝役員等賠償責任保険契約（D&O保険契約）", "points": [{"aspect": "原則", "text": "役員等のための締結される保険契約（430条の3）とは、役員等賠償責任保険契約（D&O保険契約）である"}, {"aspect": "原則", "text": "保険契約は間接利益相反取引（356条1項3号）と同じ状況である。保険会社が一方的に役員等に有利な内容の保険を引き受けることはないだろうから、430条の2とは異なり、423条1項や429条の賠償金の保険を内容とする契約締結はできる"}, {"aspect": "原則", "text": "430条の3第1項：D&O保険契約の手続は取締役会決議または株主総会の決議（趣旨②に対応）"}, {"aspect": "あてはめ", "text": "保険契約は間接利益相反取引（356条1項3号）と同じ状況である"}, {"aspect": "条文", "text": "430条・356条・423条・429条"}], "articles": ["430条", "356条", "423条", "429条"], "pages": [152]}, {"id": "book-kigyoho-01-ch02-r167", "ch": 2, "topic": "取締役・執行役の行為の差止請求", "points": [{"aspect": "原則", "text": "差止請求の一覧：株主による取締役の行為の差止め（360条）、監査役による取締役の行為の差止め（385条）、監査等委員による取締役の行為の差止め（399条の6）、監査委員による執行役・取締役の行為の差止め（407条）、株主による執行役の行為の差止め（422条）"}, {"aspect": "原則", "text": "360条1項：6箇月前から引き続き株式を有する株主は、取締役が株式会社の目的の範囲外の行為その他法令若しくは定款に違反する行為をし、又はこれらの行為をするおそれがある場合において、当該行為によって株式会社に著しい損害が生ずるおそれがあるときは、当該取締役に対し当該行為をやめることを請求することができる"}, {"aspect": "原則", "text": "360条2項：公開会社でない株式会社における1項の適用については、「6箇月前から引き続き株式を有する株主」とあるのは「株主」とする"}, {"aspect": "原則", "text": "360条3項：監査役設置会社、監査等委員会設置会社又は指名委員会等設置会社における1項の適用については、「著しい損害」とあるのは「回復することができない損害」とする"}, {"aspect": "要件", "text": "要件③：会社に著しい損害が生じるおそれ、または会社に回復することができない損害（＝取締役の賠償責任により、その賠償が償われないような場合）"}, {"aspect": "要件", "text": "360条の要件①②はレジュメ本文では番号のみで内容が記載されていない（空欄）。要件③のみ説明がある"}, {"aspect": "あてはめ", "text": "要件③は正確には「当該行為によって当該株式会社に著しい損害が生ずるおそれがあるとき」であり、取締役の法令定款違反行為と会社の損害との間に相当因果関係があることも要件といえる。因果関係が怪しまれる事実がある事例問題のときは、あてはめでも丁寧に書くと評価が高くなりそうである"}, {"aspect": "条文", "text": "360条・385条・399条・407条・422条"}], "articles": ["360条", "385条", "399条", "407条", "422条"], "pages": [153]}, {"id": "book-kigyoho-01-ch02-r168", "ch": 2, "topic": "会計帳簿閲覧請求（433条）", "points": [{"aspect": "趣旨", "text": "会計帳簿閲覧請求は、株主に会計帳簿に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や役員解任の訴え（854条）を提起するために役に立つ情報を株主は得ることができる"}, {"aspect": "条文", "text": "847条・854条"}], "articles": ["847条", "854条"], "pages": [154]}, {"id": "book-kigyoho-01-ch02-r169", "ch": 2, "topic": "業務執行に関する検査役の選任（358条）", "points": [{"aspect": "趣旨", "text": "業務執行に関する検査役の選任は、株主に業務執行に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や違法行為差止請求権（360条）を行使するために役に立つ情報を株主は得ることができる"}
