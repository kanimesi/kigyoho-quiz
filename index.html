・704条・710条・701条・702条・714条・715条"}], "articles": ["348条", "362条", "399条", "416条", "676条", "742条", "704条", "710条", "701条", "702条", "714条", "715条"], "pages": [270]}, {"id": "book-kigyoho-01-ch05-r042", "ch": 5, "topic": "Ⅱ重要条文：募集株式の発行等・有利発行・割当・現物出資・差止請求", "points": [{"aspect": "原則", "text": "Ⅱ□募集株式の発行等：199条～（・公開会社の特則 201条、・株主割当 202条）。□有利発行：199条3項。□公開会社における募集株式の割当：206条の2（割当て等の特則：支配株主の変更（異動））"}, {"aspect": "原則", "text": "Ⅱ□（募集株式の発行の際の）現物出資：207条。□募集株式の差止請求：210条"}, {"aspect": "条文", "text": "199条・201条・202条・206条・207条・210条"}], "articles": ["199条", "201条", "202条", "206条", "207条", "210条"], "pages": [271]}, {"id": "book-kigyoho-01-ch05-r043", "ch": 5, "topic": "Ⅱ重要条文：募集に係る責任等・仮装の責任等・新株発行等の無効の訴え", "points": [{"aspect": "原則", "text": "Ⅱ□募集に係る責任等（212条～）：212条～（・引受人の責任 212条、・取締役等の責任 213条）。□出資の履行の仮装の場合の責任等：213条の2、213条の3、209条2項、209条3項"}, {"aspect": "原則", "text": "Ⅱ□新株発行等の無効の訴え：828条1項2号3号、同条2項2号3号（・対世効 838条、・将来効 839条）"}, {"aspect": "条文", "text": "212条・213条・209条・828条・838条・839条"}], "articles": ["212条", "213条", "209条", "828条", "838条", "839条"], "pages": [271]}, {"id": "book-kigyoho-01-ch06-r001", "ch": 6, "topic": "資本金の定義・資本金制度の趣旨・資本三原則", "points": [{"aspect": "趣旨", "text": "資本金制度の趣旨：株主は有限責任しか負わず債権者の引き当ては会社財産しかないため、会社債権者保護の観点から一定額の会社財産を会社内に留保させる"}, {"aspect": "原則", "text": "資本金の定義：会社財産を確保するための基準となる一定の計算上の数字"}, {"aspect": "原則", "text": "資本充実の原則（要請）：資本金に相当する財産が現実に会社に拠出されなければならないという原則"}, {"aspect": "原則", "text": "資本維持の原則（要請）：資本金に相当する財産が現実に会社に保有されなければならないという原則"}, {"aspect": "原則", "text": "資本不変の原則（要請）：一旦定められた資本金の額を自由に減少することは許されないという原則"}, {"aspect": "条文", "text": "104条"}], "articles": ["104条"], "pages": [272]}, {"id": "book-kigyoho-01-ch06-r002", "ch": 6, "topic": "資本金の額の減少（決定機関・債権者異議・趣旨・欠損の定義）", "points": [{"aspect": "趣旨", "text": "原則（株主総会の特別決議）の趣旨：資本金の額の減少は会社の一部清算の性格を有し、株主の利益に重大な影響を与えるから"}, {"aspect": "趣旨", "text": "例外②（定時株主総会の普通決議）の趣旨：資本金の減少によって新たに分配可能額を生じさせないので一部清算の性格は乏しく株主に重大な影響を与えないから"}, {"aspect": "趣旨", "text": "例外①（取締役の決定・取締役会の決議、447条3項）の趣旨（答案用）：このような場合結果的に資本金の額は減少しないので株主の利益は害されないから"}, {"aspect": "原則", "text": "決定機関の原則：株主総会の特別決議（447条1項、309条2項9号）"}, {"aspect": "原則", "text": "決定機関の例外①：447条3項"}, {"aspect": "原則", "text": "決定機関の例外②：447条1項、309条2項9号かっこ書"}, {"aspect": "原則", "text": "債権者異議手続（449条）：例外なく異議手続が必要"}, {"aspect": "原則", "text": "欠損の定義：分配可能額を計算するとマイナスになる状態"}, {"aspect": "条文", "text": "449条・447条・309条"}], "articles": ["449条", "447条", "309条"], "pages": [273]}, {"id": "book-kigyoho-01-ch06-r003", "ch": 6, "topic": "準備金の額の減少（決定機関・債権者異議・趣旨）", "points": [{"aspect": "趣旨", "text": "原則（株主総会の普通決議）の趣旨：資本金の額の減少より手続要件を緩和することでまず準備金の額の減少を先に行うことを促し、資本金のクッションの役割を果たすため。答案用としては、株主の利益に影響するが資本金の額の減少ほど影響は大きくないから"}, {"aspect": "趣旨", "text": "例外①（取締役の決定・取締役会の決議、448条3項）の趣旨：447条3項と同じ"}, {"aspect": "原則", "text": "決定機関の原則：株主総会の普通決議（448条1項、309条1項）"}, {"aspect": "原則", "text": "決定機関の例外①：448条3項"}, {"aspect": "原則", "text": "決定機関の例外②：459条1項2号（460条参照）。会計監査人設置会社で一定の会社は、定款に定めを置けば、欠損填補のための準備金の減少を取締役会決議でできる"}, {"aspect": "原則", "text": "債権者異議手続（449条）の例外①：449条1項柱書本文第2かっこ書き、例外②：449条1項柱書ただし書"}, {"aspect": "原則", "text": "447条3項・448条3項の内容：取締役の決定（取締役会設置会社においては取締役会の決議）。株式の発行と同時に資本金または準備金の額を減少する場合において、株式発行前の資本金・準備金の額を下回らないとき"}, {"aspect": "条文", "text": "448条・309条・459条・460条・449条・447条"}], "articles": ["448条", "309条", "459条", "460条", "449条", "447条"], "pages": [273, 274]}, {"id": "book-kigyoho-01-ch06-r004", "ch": 6, "topic": "債権者異議手続（449条1項）の趣旨と例外の趣旨", "points": [{"aspect": "趣旨", "text": "449条1項柱書本文の趣旨：資本金・準備金の額の減少は剰余金の額が増加する場合に分配可能額が増加し株主への分配がなされ会社債権者の引き当てとなる会社財産の減少となり得るので、会社債権者の利益に重大な影響を与えうるため"}, {"aspect": "趣旨", "text": "例外①（減少する準備金の額の全部を資本金とする場合）の趣旨：減額がより困難な資本金となるので会社債権者に重大な影響を与えないから"}, {"aspect": "趣旨", "text": "例外②（欠損填補の場合）の趣旨：準備金の額の減少によって新たに分配可能額を生じさせないので一部清算の性格は乏しく会社債権者に重大な影響は与えないから"}, {"aspect": "条文", "text": "449条"}], "articles": ["449条"], "pages": [274]}, {"id": "book-kigyoho-01-ch06-r005", "ch": 6, "topic": "資本金の額・準備金の額の増加", "points": [{"aspect": "趣旨", "text": "450条・451条の趣旨：本来は株主に配当できる剰余金を配当性のない資本金・準備金に振り替えるという株主の利害に関係あるから、株主総会の普通決議を要求した"}, {"aspect": "原則", "text": "承認機関：株主総会の普通決議（450条2項、451条2項、309条1項）"}, {"aspect": "原則", "text": "債権者異議手続は不要"}, {"aspect": "条文", "text": "450条・451条・309条"}], "articles": ["450条", "451条", "309条"], "pages": [275]}, {"id": "book-kigyoho-01-ch06-r006", "ch": 6, "topic": "資本金の額の減少無効の訴え（828条）", "points": [{"aspect": "原則", "text": "資本金の額の減少についてだけ特別の制度がある。一定の提訴権者が資本金の額の減少の効力が生じた日から六箇月以内に、無効を訴えをもってのみ主張できる"}, {"aspect": "原則", "text": "提訴権者：当該株式会社の株主等（株主、取締役又は清算人。監査役設置会社にあっては株主、取締役、監査役又は清算人、委員会設置会社にあっては株主、取締役、執行役又は清算人）、破産管財人、資本金の額の減少について承認をしなかった債権者"}, {"aspect": "原則", "text": "認容確定判決は第三者に対しても効力を有し（838条・対世効）、無効とされた行為は将来に向かって効力を失う（839条・将来効）"}, {"aspect": "条文", "text": "828条・838条・839条"}], "articles": ["828条", "838条", "839条"], "pages": [275]}, {"id": "book-kigyoho-01-ch06-r007", "ch": 6, "topic": "剰余金の配当規制の全体像（手続規制・純資産額規制・財源規制）", "points": [{"aspect": "原則", "text": "手続規制（決定機関）：原則、株主総会の普通決議（454条1項）"}, {"aspect": "原則", "text": "純資産額規制：純資産額300万円を下回ると配当できない（458条）"}, {"aspect": "原則", "text": "財源規制（分配可能額規制）：分配可能額を超えて配当できない（461条1項8号）"}, {"aspect": "あてはめ", "text": "1事業年度中何度でも剰余金の配当が可能（回数制限の撤廃）"}, {"aspect": "条文", "text": "454条・458条・461条"}], "articles": ["454条", "458条", "461条"], "pages": [276]}, {"id": "book-kigyoho-01-ch06-r008", "ch": 6, "topic": "剰余金の配当の決定機関（原則と例外3つ・459条・460条）", "points": [{"aspect": "趣旨", "text": "例外①の趣旨：金銭分配請求権を与えない場合は、金銭以外の配当を望まない株主はその換価性が保証されず不利益のおそれがあるので、株主総会の特別決議を必要とした"}, {"aspect": "趣旨", "text": "459条の趣旨：会社財産の分配は経営判断の一つともいえるので、適正な計算書類により分配可能額が確定している以上、その分配の決定を取締役会に委ねた方がよい場合もあるため"}, {"aspect": "趣旨", "text": "460条の趣旨：会社財産の分配は経営判断の一つともいえるが、剰余金をどのように処分するかしないかは株主が重大な利害・関心を有する事項であるから"}, {"aspect": "原則", "text": "原則：株主総会の普通決議（454条1項）。趣旨：剰余金の配当は株主にとって重大な関心事であるので株主のコントロールを及ぼすのが適当だから"}, {"aspect": "原則", "text": "例外①：株主総会の特別決議（454条4項、309条2項10号）。配当財産が金銭以外の財産であり、かつ株主に対して金銭分配請求権を与えないこととする場合に限る"}, {"aspect": "原則", "text": "例外②：中間配当、取締役会決議（454条5項）。趣旨：このような中間配当は株主の利益を害さないから"}, {"aspect": "原則", "text": "例外③：会計監査人設置会社、取締役会決議（459条1項4号・460条）"}, {"aspect": "原則", "text": "459条・460条の適用範囲：剰余金の配当（4号）のみならず、特定の者から取得の場合を除く自己株式の有償取得（1号）、欠損塡補のための準備金の額の減少（2号）、財産流出を伴わない剰余金の処分（3号）にも適用される"}, {"aspect": "原則", "text": "460条（株主の権利の制限）：459条1項の定款の定めがある場合、株式会社は同項各号の事項を株主総会の決議によっては定めない旨を定款で定めることができる。460条の定款がない限り、459条の定款の定めがあっても株主総会決議によって剰余金の配当等を決定できる"}, {"aspect": "条文", "text": "454条・309条・459条・460条"}], "articles": ["454条", "309条", "459条", "460条"], "pages": [276, 277]}, {"id": "book-kigyoho-01-ch06-r009", "ch": 6, "topic": "純資産額規制（458条）", "points": [{"aspect": "原則", "text": "（2）純資産額規制（458条）の見出し。項目2冒頭の全体像では「純資産額300万円を下回ると配当できない（458条）」とされる"}, {"aspect": "条文", "text": "458条"}], "articles": ["458条"], "pages": [277]}, {"id": "book-kigyoho-01-ch06-r010", "ch": 6, "topic": "財源規制（分配可能額規制、461条1項8号）", "points": [{"aspect": "原則", "text": "（3）財源規制（分配可能額規制、461条1項8号）の見出し。項目2冒頭の全体像では「分配可能額を超えて配当できない（461条1項8号）」とされる"}, {"aspect": "条文", "text": "461条"}], "articles": ["461条"], "pages": [277]}, {"id": "book-kigyoho-01-ch06-r011", "ch": 6, "topic": "違法な剰余金の配当に関する責任の全体構造（図）", "points": [{"aspect": "あてはめ", "text": "注記（＊）：他の取締役や監査役等の責任は、423条・429条の要件を満たせばそれら規定の責任を負う"}, {"aspect": "条文", "text": "462条・463条・461条・423条・429条"}], "articles": ["462条", "463条", "461条", "423条", "429条"], "pages": [278]}, {"id": "book-kigyoho-01-ch06-r012", "ch": 6, "topic": "（論点）違法な剰余金の配当（分配可能額違反、461条1項8号違反）の効力", "points": [{"aspect": "結論", "text": "問題提起と理由：分配可能額規制（461条）は資本維持の原則から規定されたものであり、それに反する場合無効とすべきである。また461条1項柱書は「分配可能額を超えてはならない」と規定しており、分配可能額を超える場合はその配当を無効と解するのが自然である"}, {"aspect": "結論", "text": "結論：分配可能額（461条1項8号）を超えた剰余金の配当は無効と解する"}, {"aspect": "条文", "text": "461条"}], "articles": ["461条"], "pages": [278]}, {"id": "book-kigyoho-01-ch06-r013", "ch": 6, "topic": "違法な剰余金の配当に関する責任（462条、463条）", "points": [{"aspect": "趣旨", "text": "3者が責任を負う趣旨：会社債権者保護のため（資本維持の原則のため重大な違反だから）。「交付を受けた金銭等の帳簿価額に相当する金銭」全体を支払う義務が生じる趣旨：当該分配は全体として違法であるため"}, {"aspect": "原則", "text": "462条：主体は3者。効果は、当該株式会社に対し連帯して、当該金銭等の交付を受けた者が「交付を受けた金銭等の帳簿価額に相当する金銭」を支払う義務を負う"}, {"aspect": "原則", "text": "463条の見出し（（2）違法な剰余金の配当に関する責任（462条、463条）の下位見出し）"}, {"aspect": "条文", "text": "462条・463条"}], "articles": ["462条", "463条"], "pages": [278]}, {"id": "book-kigyoho-01-ch06-r014", "ch": 6, "topic": "事後の欠損填補責任（465条）", "points": [{"aspect": "趣旨", "text": "趣旨：期末時点の株主保護（＋副次的には会社債権者保護）。剰余金配当をしすぎることによって期末時点の株主の利益を害さないようにするため"}, {"aspect": "趣旨", "text": "（参考）CPAレギュラー講義テキストの説明：業務執行者の欠損填補責任は、資本維持の原則の一環として、剰余金の配当等に関与する業務執行者に対して、事後に欠損が生じる可能性があれば剰余金の配当を行わないという義務を課したものである"}, {"aspect": "原則", "text": "465条1項の効果：剰余金の配当に関する業務執行者は、当該株式会社に対し連帯して、その超過額（当該超過額が当該剰余金の配当により株主に対して交付した金銭等の帳簿価額の総額を超える場合にあっては当該帳簿価額の総額）を支払う義務を負う"}, {"aspect": "原則", "text": "465条1項但書：立証責任を転嫁した過失責任"}, {"aspect": "原則", "text": "465条2項：総株主の同意で免除が可能"}, {"aspect": "原則", "text": "欠損填補責任が生じない場合ⅰ：定時株主総会において剰余金の配当がなされる場合（465条1項10号イ）。計算書類の承認と同時になされる事業年度ごとの剰余金の配当についてまで対象とすると、業務執行者が過度に剰余金の配当に消極的になり株主の利益に反するおそれがあるから"}, {"aspect": "原則", "text": "欠損填補責任が生じない場合ⅱ：資本金または準備金の額の減少に伴う剰余金の配当のうち一定のもの（465条1項10号ロ・ハ）。資本金・準備金の減少に関する株主総会で配当事項を定め、かつ配当財産の額が減少額を超えない場合（減少額の全部または一部を資本金・準備金とする定めがない場合に限る）は責任を負わない。資本金・準備金の減少について株主総会決議（447条1項、448条1項）と債権者異議手続（449条）がとられているため"}, {"aspect": "要件", "text": "465条1項の要件：株式会社が剰余金を配当する時点では財源規制に違反しなかったが、事業年度末に欠損が生じたこと"}, {"aspect": "あてはめ", "text": "答案上の着目点：論文事例問題で「財源規制違反のない」「剰余金の配当」その後「期末に欠損」とあれば465条を考える。説明問題であれば条文→趣旨が原則的書き方"}, {"aspect": "あてはめ", "text": "注：剰余金の配当ができたということから「剰余金を配当する時点では財源規制に違反していなかった」という要件が導かれるのであって、明確に記載されているわけではない"}, {"aspect": "あてはめ", "text": "支払額は「当該欠損額と剰余金配当額のいずれか少ない額」である"}, {"aspect": "あてはめ", "text": "立法論としての検討点：総株主の同意があっても免除できないとすべきか"}, {"aspect": "条文", "text": "465条・461条・447条・448条・449条"}], "articles": ["465条", "461条", "447条", "448条", "449条"], "pages": [279, 280]}, {"id": "book-kigyoho-01-ch06-r015", "ch": 6, "topic": "（応用）462条責任の三主体へのあてはめ―株主総会決議（454条1項）による剰余金の配当", "points": [{"aspect": "原則", "text": "会社計算規則159条：462条1項各号列記以外の部分の法務省令で定める者。8号（461条1項8号の行為）については、イ剰余金の配当による金銭等の交付に関する職務を行った取締役及び執行役、ロ454条1項の決定に係る株主総会において配当事項について説明をした取締役及び執行役、ハ454条1項の決定に係る取締役会において配当に賛成した取締役、ニ分配可能額の計算に関する報告を監査役又は会計監査人が請求したときは当該請求に応じて報告をした取締役及び執行役"}, {"aspect": "原則", "text": "会社計算規則160条：462条1項1号イの法務省令で定める者は、一株主総会に議案を提案した取締役、二前号の議案の提案の決定に同意した取締役（取締役会設置会社の取締役を除く）、三1号の議案の提案が取締役会の決議に基づいて行われたときは当該決議に賛成した取締役"}, {"aspect": "原則", "text": "会社計算規則161条：462条1項1号ロの法務省令で定めるものは、取締役会に議案を提案した取締役及び執行役"}, {"aspect": "結論", "text": "あてはめ結果：A→462条1項柱書「当該行為に関する職務を行った業務執行者」、B→会社計算規則160条3号・462条1項6号イ「総会議案提案取締役」、C→369条5項・計算規則160条3号・462条1項6号イ「総会議案提案取締役」、D→462条1項柱書「金銭等の交付を受けた者」"}, {"aspect": "条文", "text": "454条・462条・369条・160条・159条・461条・161条"}], "articles": ["454条", "462条", "369条", "160条", "159条", "461条", "161条"], "pages": [281]}, {"id": "book-kigyoho-01-ch06-r016", "ch": 6, "topic": "（応用）462条責任の三主体へのあてはめ―取締役会決議（459条）による剰余金の配当", "points": [{"aspect": "結論", "text": "あてはめ結果：A→462条1項柱書「当該行為に関する職務を行った業務執行者」、B→会社計算規則159条8号ハ・462条1項柱書「当該行為に関する職務を行った業務執行者」、E→会社計算規則161条・462条1項6号ロ「取締役会議案提案取締役」"}, {"aspect": "条文", "text": "459条・462条・159条・161条"}], "articles": ["459条", "462条", "159条", "161条"], "pages": [282]}, {"id": "book-kigyoho-01-ch07-r001", "ch": 7, "topic": "定款の記載事項（576条2項〜4項）", "points": [{"aspect": "原則", "text": "合名会社の場合の定款記載事項：第一項第五号に掲げる事項として、その社員の全部を無限責任社員とする旨を記載し、又は記録しなければならない（576条2項）"}, {"aspect": "原則", "text": "合資会社の場合の定款記載事項：第一項第五号に掲げる事項として、その社員の一部を無限責任社員とし、その他の社員を有限責任社員とする旨を記載し、又は記録しなければならない（576条3項）"}, {"aspect": "原則", "text": "合同会社の場合の定款記載事項：第一項第五号に掲げる事項として、その社員の全部を有限責任社員とする旨を記載し、又は記録しなければならない（576条4項）"}, {"aspect": "条文", "text": "576条"}], "articles": ["576条"], "pages": [284]}, {"id": "book-kigyoho-01-ch07-r002", "ch": 7, "topic": "持分会社の基本構造（社員の個性重視・所有と経営の一致）", "points": [{"aspect": "原則", "text": "（参）株式会社では、株主の個性は（それほど）重視されない。104条は株主の間接有限責任、326条1項は所有と経営の分離"}, {"aspect": "結論", "text": "持分会社では、社員の個性が重視される（580条1項、590条1項・599条1項）"}, {"aspect": "結論", "text": "持分会社では、所有と経営が一致する（590条1項、599条1項）"}, {"aspect": "あてはめ", "text": "論文試験で「持分会社」とくれば、①580条1項（無限責任。cf.580条2項は有限責任）、②590条1項（各社員→業務執行権あり）・599条1項（→代表権）が論述の出発点になる"}, {"aspect": "条文", "text": "580条・590条・599条・104条・326条"}], "articles": ["580条", "590条", "599条", "104条", "326条"], "pages": [284]}, {"id": "book-kigyoho-01-ch07-r003", "ch": 7, "topic": "持分の譲渡と他の社員の保護（585条1項・2項）", "points": [{"aspect": "設例", "text": "冒頭の問い：Q1 585条1項の趣旨は？／Q2 585条2項の趣旨は？（趣旨そのものの文章は本ページに記載がなく、問いの提示のみ）"}, {"aspect": "設例", "text": "論文試験Q1「持分の譲渡をする際の手続きについて説明しなさい。」→585条1項2項とその趣旨を書く"}, {"aspect": "設例", "text": "論文試験Q3「持分の譲渡をする場合において、譲渡社員以外の社員は会社法上どのように保護されているか説明しなさい。」→585条1項2項とその趣旨を書く"}, {"aspect": "条文", "text": "585条・586条"}], "articles": ["585条", "586条"], "pages": [285]}, {"id": "book-kigyoho-01-ch07-r004", "ch": 7, "topic": "持分の譲渡と会社債権者の保護（586条1項）", "points": [{"aspect": "設例", "text": "冒頭の問い：Q3 586条1項の趣旨は？（趣旨そのものの文章は本ページに記載がなく、問いの提示のみ）"}, {"aspect": "設例", "text": "論文試験Q2「持分の譲渡をする場合において、会社債権者は会社法上どのように保護されているか説明しなさい。」→586条1項とその趣旨を書く"}, {"aspect": "条文", "text": "586条"}], "articles": ["586条"], "pages": [285]}, {"id": "book-kigyoho-01-ch07-r005", "ch": 7, "topic": "管理の総論（590条）", "points": [{"aspect": "原則", "text": "（1）総論は590条（見出しのみで本文説明はない。590条の内容「各社員→業務執行権あり」は項目1の枠（p.284）とⅡ重要条文（p.292）に記載）"}, {"aspect": "条文", "text": "590条"}], "articles": ["590条"], "pages": [286]}, {"id": "book-kigyoho-01-ch07-r006", "ch": 7, "topic": "業務執行社員の義務（593条・594条）", "points": [{"aspect": "原則", "text": "593条1項：善管注意義務（（2）業務執行社員。cf.取締役）"}, {"aspect": "原則", "text": "593条2項：忠実義務"}, {"aspect": "原則", "text": "594条：競業の禁止。趣旨は持分会社の利益保護"}, {"aspect": "原則", "text": "594条2項＝423条2項"}, {"aspect": "要件", "text": "競業の承認要件は「当該社員以外の社員の全員の承認」"}, {"aspect": "条文", "text": "593条・594条・423条"}], "articles": ["593条", "594条", "423条"], "pages": [286]}, {"id": "book-kigyoho-01-ch07-r007", "ch": 7, "topic": "利益相反取引規制（595条）", "points": [{"aspect": "原則", "text": "595条：利益相反取引規制。趣旨は持分会社の利益保護"}, {"aspect": "原則", "text": "当該利益相反取引社員の会社に対する責任は596条による（cf.423条1項と同様に考える）"}, {"aspect": "要件", "text": "承認要件は「当該社員以外の社員の過半数の承認」（594条の全員の承認と対比）"}, {"aspect": "結論", "text": "当該社員以外の社員の過半数の承認がない場合の利益相反取引の効力については、相対的無効説による（cf.株式会社の取締役の場合と同様に考える）"}, {"aspect": "あてはめ", "text": "手続を問う説明問題ならば、595条を書き、趣旨を書く"}, {"aspect": "あてはめ", "text": "「論じなさい。」問題ならば、1①問題提起（595条を示して）②595条の要件を書き③あてはめ、という構成で書く"}, {"aspect": "条文", "text": "595条・594条・596条・423条"}], "articles": ["595条", "594条", "596条", "423条"], "pages": [286]}, {"id": "book-kigyoho-01-ch07-r008", "ch": 7, "topic": "業務執行社員の責任（596条・597条）", "points": [{"aspect": "原則", "text": "596条：業務を執行する社員の持分会社に対する損害賠償責任＝423条1項"}, {"aspect": "原則", "text": "597条：業務を執行する有限責任社員の第三者に対する損害賠償責任"}, {"aspect": "あてはめ", "text": "597条は429条1項と同じではない"}, {"aspect": "条文", "text": "596条・423条・597条・429条"}], "articles": ["596条", "423条", "597条", "429条"], "pages": [287]}, {"id": "book-kigyoho-01-ch07-r009", "ch": 7, "topic": "持分会社の代表（599条・601条）", "points": [{"aspect": "原則", "text": "599条：持分会社の代表。1項：原則、業務執行社員＝代表権あり"}, {"aspect": "原則", "text": "599条4項、5項＝349条4項5項"}, {"aspect": "原則", "text": "601条：持分会社と社員との間の訴えにおける会社の代表"}, {"aspect": "条文", "text": "599条・349条・601条"}], "articles": ["599条", "349条", "601条"], "pages": [287]}, {"id": "book-kigyoho-01-ch07-r010", "ch": 7, "topic": "社員による責任追及の訴え（602条）", "points": [{"aspect": "原則", "text": "602条は、責任追及の訴え（株主代表訴訟、847条）と似た規定である"}, {"aspect": "条文", "text": "602条・847条・596条"}], "articles": ["602条", "847条", "596条"], "pages": [287]}, {"id": "book-kigyoho-01-ch07-r011", "ch": 7, "topic": "社員の加入（604条・605条）", "points": [{"aspect": "原則", "text": "（1）社員の加入（604条・605条）（見出しのみで本文説明はない）"}, {"aspect": "条文", "text": "604条・605条"}], "articles": ["604条", "605条"], "pages": [288]}, {"id": "book-kigyoho-01-ch07-r012", "ch": 7, "topic": "社員の退社（定義・任意退社・法定退社）", "points": [{"aspect": "原則", "text": "退社とは、会社存続中に特定の社員についての社員たる地位を絶対的に消滅させること"}, {"aspect": "原則", "text": "任意退社（606条）"}, {"aspect": "原則", "text": "法定（強制）退社（607条）"}, {"aspect": "条文", "text": "606条・607条"}], "articles": ["606条", "607条"], "pages": [288]}, {"id": "book-kigyoho-01-ch07-r013", "ch": 7, "topic": "退社の際の会社債権者の保護（612条）", "points": [{"aspect": "設例", "text": "Q「社員の退社の際の会社債権者の会社法上の保護について説明しなさい。」→612条とその趣旨を書く"}, {"aspect": "条文", "text": "612条・586条"}], "articles": ["612条", "586条"], "pages": [288]}, {"id": "book-kigyoho-01-ch07-r014", "ch": 7, "topic": "計算等の総論（制限なしの原則と条文構造）", "points": [{"aspect": "結論", "text": "①利益の配当に制限なし、②払戻しに制限なし（a：退社に伴う持分の払戻し、b：出資の払戻し）。ただし、無限責任社員が存在しない合同会社では、①・②には制限あり"}, {"aspect": "条文", "text": "575条・611条"}], "articles": ["575条", "611条"], "pages": [289]}, {"id": "book-kigyoho-01-ch07-r015", "ch": 7, "topic": "利益の配当（原則・例外①）", "points": [{"aspect": "原則", "text": "原則：利益の配当、制限なし（621条1項）。趣旨：会社債権者を害さないから"}, {"aspect": "原則", "text": "例外①：有限責任社員の利益の配当に関する責任（623条1項）"}, {"aspect": "条文", "text": "621条・623条"}], "articles": ["621条", "623条"], "pages": [290]}, {"id": "book-kigyoho-01-ch07-r016", "ch": 7, "topic": "合同会社の利益の配当の特則", "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "原則", "text": "628条1項2項（利益の配当の制限）＝461条"}, {"aspect": "原則", "text": "629条1項2項（利益の配当に関する責任）cf.462条"}, {"aspect": "原則", "text": "630条＝463条（社員に対する求償権の制限等）"}, {"aspect": "原則", "text": "631条（事後の欠損填補責任）＝465条"}, {"aspect": "条文", "text": "628条・461条・629条・462条・630条・463条・631条・465条"}], "articles": ["628条", "461条", "629条", "462条", "630条", "463条", "631条", "465条"], "pages": [290]}, {"id": "book-kigyoho-01-ch07-r017", "ch": 7, "topic": "出資の払戻し", "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "原則", "text": "原則：制限なし（624条）。趣旨：会社債権者を害さないから"}, {"aspect": "原則", "text": "例外は合同会社の特則：632条（出資の払戻しの制限）。2項＝461条"}, {"aspect": "原則", "text": "633条（出資の払戻しに関する社員の責任）cf.462条"}, {"aspect": "原則", "text": "634条（社員に対する求償権の制限等）＝463条"}, {"aspect": "原則", "text": "「出資の払戻し」は、社員たる地位が残る点で、「退社に伴う持分の払戻し」とは異なる"}, {"aspect": "条文", "text": "624条・632条・461条・633条・462条・634条・463条・611条"}], "articles": ["624条", "632条", "461条", "633条", "462条", "634条", "463条", "611条"], "pages": [290]}, {"id": "book-kigyoho-01-ch07-r018", "ch": 7, "topic": "退社に伴う持分の払戻し", "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "原則", "text": "原則：制限なし（611条）。趣旨：会社債権者を害さないから"}, {"aspect": "原則", "text": "例外は合同会社の特則：635条（債権者の異議）"}, {"aspect": "原則", "text": "636条（業務を執行する社員の責任）cf.462条"}, {"aspect": "あてはめ", "text": "463条に相当する規定はない。代わりに、635条という独特の規定があることに注意"}, {"aspect": "条文", "text": "611条・635条・636条・462条・463条"}], "articles": ["611条", "635条", "636条", "462条", "463条"], "pages": [291]}, {"id": "book-kigyoho-01-ch07-r019", "ch": 7, "topic": "定款変更（637条）と関連訴訟", "points": [{"aspect": "原則", "text": "6 定款変更（637条）（見出しのみで本文説明はない）"}, {"aspect": "原則", "text": "（参）訴訟：828条（会社の組織に関する行為の無効の訴え）"}, {"aspect": "原則", "text": "（参）訴訟：832条（持分会社の設立の取消しの訴え）"}, {"aspect": "原則", "text": "（参）訴訟：845条（持分会社の設立の無効又は取消しの判決の効力）"}, {"aspect": "条文", "text": "637条・828条・832条・845条"}], "articles": ["637条", "828条", "832条", "845条"], "pages": [291]}, {"id": "book-kigyoho-01-ch07-r020", "ch": 7, "topic": "Ⅱ重要条文：持分会社", "points": [{"aspect": "原則", "text": "□持分会社：575条〜（章の対象範囲）"}, {"aspect": "条文", "text": "575条"}], "articles": ["575条"], "pages": [292]}, {"id": "book-kigyoho-01-ch07-r026", "ch": 7, "topic": "Ⅱ重要条文：計算等", "points": [{"aspect": "原則", "text": "□計算等：614条～"}, {"aspect": "条文", "text": "614条"}], "articles": ["614条"], "pages": [292]}, {"id": "book-kigyoho-01-ch07-r027", "ch": 7, "topic": "Ⅱ重要条文：合同会社の計算等に関する特則", "points": [{"aspect": "原則", "text": "□合同会社の計算等に関する特則：625条～"}, {"aspect": "条文", "text": "625条"}], "articles": ["625条"], "pages": [292]}, {"id": "book-kigyoho-01-ch08-r001", "ch": 8, "topic": "事業譲渡等の承認（467条）", "points": [{"aspect": "原則", "text": "467条柱書：株式会社は、次に掲げる行為をする場合には、効力発生日の前日までに、株主総会の決議によって、当該行為に係る契約の承認を受けなければならない"}, {"aspect": "原則", "text": "467条1項1号：事業の全部の譲渡"}, {"aspect": "原則", "text": "467条1項2号：事業の重要な一部の譲渡（譲り渡す資産の帳簿価額が総資産額の5分の1（定款で下回る割合を定めた場合はその割合）を超えないものを除く）"}, {"aspect": "原則", "text": "467条1項2号の2は本ページでは「(……後述……)」とされ、内容はp.300（本編p.297）で後述される"}, {"aspect": "原則", "text": "467条1項3号：他の会社（外国会社その他の法人を含む）の事業の全部の譲受け"}, {"aspect": "原則", "text": "467条1項4号：事業の全部の賃貸、事業の全部の経営の委任、他人と事業上の損益の全部を共通にする契約その他これらに準ずる契約の締結、変更又は解約"}, {"aspect": "条文", "text": "467条"}], "articles": ["467条"], "pages": [293]}, {"id": "book-kigyoho-01-ch08-r002", "ch": 8, "topic": "事業譲渡の位置づけ（組織再編行為ではなく取引行為）", "points": [{"aspect": "結論", "text": "事業譲渡は467条〜、他方合併などの組織再編は743条〜という条文構造からも、事業譲渡は組織再編行為ではなく、取引行為に過ぎないことがわかる。しかし、類似するので比較して試験に出される"}, {"aspect": "条文", "text": "467条・743条"}], "articles": ["467条", "743条"], "pages": [293]}, {"id": "book-kigyoho-01-ch08-r003", "ch": 8, "topic": "事業譲渡の定義図（①②③）", "points": [{"aspect": "原則", "text": "①の財産には、積極財産・消極財産の両方を含み、積極財産は「物」「権利」のみならず、営業上の秘訣・得意先・創業年代など暖簾とか老舗とか呼ばれる「事実関係」も含む"}, {"aspect": "条文", "text": "467条・21条"}], "articles": ["467条", "21条"], "pages": [293]}, {"id": "book-kigyoho-01-ch08-r004", "ch": 8, "topic": "（論点）467条1項1号2号（3号）の事業譲渡の意義（定義）", "points": [{"aspect": "結論", "text": "問題の所在と同義性：467条1項1号2号の事業譲渡の意味が問題となる。法解釈の統一性の観点から21条から24条にいう事業譲渡と同義であり、また、事業活動の承継と競業避止義務の負担という明確な基準で、株主総会特別決議の要否を明確にして、取引の相手方を保護する必要がある"}, {"aspect": "結論", "text": "判例の定義：①一定の事業目的のために組織化された有機的的一体として機能する財産の（全部または重要な一部の）譲渡であって、②必ず事業活動の承継を伴うものであり、③譲渡会社が21条の競業避止義務を負う結果を伴うものをいう（最判昭和40・9・22の立場）"}, {"aspect": "結論", "text": "意義についてさまざまな学説があるが、その後も同趣旨の最高裁判決が続いていることから、試験においては上記判例の立場を採用する方がよいであろう"}, {"aspect": "結論", "text": "しかし、事業譲渡にあたるかの判断の際に、③のあてはめまで検討したうえで③も満たすから事業譲渡にあたるとする裁判例があることから、試験的にはやはり③も事業譲渡の意義の考慮要素と考えるべきであろう"}, {"aspect": "条文", "text": "467条・21条・24条"}], "articles": ["467条", "21条", "24条"], "pages": [294]}, {"id": "book-kigyoho-01-ch08-r005", "ch": 8, "topic": "あてはめの視点1：①有機的一体として機能する財産", "points": [{"aspect": "あてはめ", "text": "本試験で重要なのは、①、②、③のあてはめを丁寧に記述すること。①は「それを譲り受けた譲受人がそのまま事業を継続することが可能な状態の財産」であることが必要"}, {"aspect": "設例", "text": "（問題）甲社は製造加工業を3年間休業していたが、その製造工場を構成する土地・建物・機械・器具類一式を乙社に譲渡（最判昭和40・9・22の事案）。[書き方]休業していたので、譲り受けてもそのまま事業を継続することが可能な状態の財産ではなく、個別の財産をまとめて譲り受けたに過ぎない。したがって、①を満たさない"}, {"aspect": "条文", "text": "467条"}], "articles": ["467条"], "pages": [295]}, {"id": "book-kigyoho-01-ch08-r006", "ch": 8, "topic": "あてはめの視点2：②事業活動の承継", "points": [{"aspect": "あてはめ", "text": "②の判断基準は、事業活動が引き継がれているか"}, {"aspect": "設例", "text": "（問題1）甲社は製造加工業を3年間休業していたが、その製造工場を構成する土地・建物・機械・器具類一式を乙社に譲渡。[書き方]休業していたのであるから、乙社がその事業を引き継ぐわけではないので、②も満たさない"}, {"aspect": "設例", "text": "（問題2）甲ゴルフ場運営会社が、その所有する財産のほとんどを乙社に譲渡したがゴルフ会員を引き継がず、乙社は新規にゴルフ会員を募集（旭川地判平成7・8・31の事案）。[書き方]乙社はゴルフ会員を引き継いでいない以上、事業活動を引き継ぐとはいえないので、②を満たさない"}, {"aspect": "条文", "text": "467条"}], "articles": ["467条"], "pages": [295]}, {"id": "book-kigyoho-01-ch08-r007", "ch": 8, "topic": "あてはめの視点3：③競業避止義務を負う結果と、事業譲渡にあたらない場合の362条4項の記述", "points": [{"aspect": "あてはめ", "text": "③：明確に、競業避止義務を負うとの契約内容がなくても、あてはめで書くべき。[書き方例]甲社は、廃業を予定しつつ乙社に当該契約を締結しているので、甲社は同種の事業を行う意図はなく、当該契約は競業避止義務を負う結果を伴うものと評価できる"}, {"aspect": "あてはめ", "text": "＜注意！＞事業譲渡（467条）にあたらないとしても、次に、取締役会決議が必ず必要となる「重要な財産の処分・譲受け」（362条4項1号等）にあたるかの記述を。なお、正確には、事業譲渡にあたる場合も、取締役会の決議必要。流れは、取締役会の決議による決定（362条4項1号2項1号）→株主総会の決議による承認（467条）"}, {"aspect": "条文", "text": "467条・21条・362条"}], "articles": ["467条", "21条", "362条"], "pages": [296]}, {"id": "book-kigyoho-01-ch08-r008", "ch": 8, "topic": "（論点）467条1項2号の「重要な一部」", "points": [{"aspect": "原則", "text": "平成17年商法改正前：「重要な一部」は量的側面及び質的側面から判断されていた"}, {"aspect": "原則", "text": "会社法は、取引の迅速を図り、取引の安全を確保する観点から5分の1基準（足切り基準）を設定。法務省令＝会社法施行規則134条"}, {"aspect": "結論", "text": "「重要な一部」の意義：事業譲渡等に株主総会の特別決議を必要とした趣旨は、譲渡会社に重大な影響を与えるからである。そうすると、「重要な一部」とは、（競業避止義務を課すことによって定款変更や解散をせざる得ないような）譲渡会社に重大な影響を与えるものを意味すると解する"}, {"aspect": "あてはめ", "text": "467条1項2号にあたり株主総会の特別決議が必要な場合の検討順序：①事業譲渡であること、②譲渡資産が総資産の5分の1を超えること、③それが重要な一部であること"}, {"aspect": "あてはめ", "text": "本試験の論文問題自体に「売上高・利益・従業員」の記載があれば、B説を書くことが期待されていると考えられるが、判例を問うているわけではないし、おそらく単純に論文本試験問題には「総資産額○○円」と書いているであろう"}, {"aspect": "条文", "text": "467条・134条"}], "articles": ["467条", "134条"], "pages": [297]}, {"id": "book-kigyoho-01-ch08-r009", "ch": 8, "topic": "事業譲渡の手続（特別決議・反対株主の株式買取請求）", "points": [{"aspect": "趣旨", "text": "①の趣旨：事業譲渡等は、会社の運命に重大な影響を及ぼし株主に重大な影響を与えるからである"}, {"aspect": "趣旨", "text": "②の趣旨：反対する株主の投下資本回収手続を保障して経済的救済を図るためである"}, {"aspect": "原則", "text": "①原則、株主総会の特別決議（467条1項、309条2項11号）。例外：略式事業譲渡・簡易事業譲渡（468条）の場合は株主総会決議不要（cf.略式・簡易は「組織再編」行為参照）"}, {"aspect": "原則", "text": "②反対株主の株式買取請求（469条）"}, {"aspect": "条文", "text": "467条・309条・468条・469条"}], "articles": ["467条", "309条", "468条", "469条"], "pages": [298]}, {"id": "book-kigyoho-01-ch08-r010", "ch": 8, "topic": "（論点1）株主総会の特別決議を欠いた事業譲渡の効力", "points": [{"aspect": "原則", "text": "取引の安全（乙社の保護）からすると、相対的無効説（原則無効、ただし善意の相手方には無効を主張できない）になりそう。しかし、判例は絶対的無効説（善意の相手方にも無効を主張できる）と考えられる"}, {"aspect": "結論", "text": "論証：株主総会の特別決議を欠いた事業譲渡の効力が明文がないので問題となる。特別決議が必要とされた趣旨は、事業譲渡等は譲渡会社・株主に重大な影響を与えるからである。そうだとすると、その効力は無効であり、その無効は特別決議を欠いていることについて善意の譲受人にも主張できると解する。なぜなら、そのように解しても、事業活動の承継・競業避止義務の負担という要件を必要とする事業譲渡の意義からすると、譲受人は株主総会特別決議が必要であることを当然知るべきだからである"}, {"aspect": "条文", "text": "467条・309条"}], "articles": ["467条", "309条"], "pages": [298]}, {"id": "book-kigyoho-01-ch08-r011", "ch": 8, "topic": "（論点2）譲受人からの無効主張の可否", "points": [{"aspect": "結論", "text": "論証：事業譲渡が特別決議を欠いて無効となる場合に、その無効は譲渡会社のみならず譲受人からも主張できるかが問題となる。趣旨からは譲渡会社やその利害関係人からの無効主張を認めれば足りるとも考えられる。しかし、譲受人からの無効主張を認めないと、譲受人は譲渡会社から無効を主張されるまでは当該事業譲渡を有効と扱うほかはなく、不安定な立場に置かれる。したがって、無効主張が信義則（民法1条2項）に反すると認められる特段の事情がない限り、譲受人からの無効主張も認められると解する（最判昭和61・9・11の立場）"}, {"aspect": "あてはめ", "text": "問題の所在：民法上、無効は誰でも主張できる。しかし、ⅰ467条の趣旨は譲渡会社・株主の保護であり譲受人の保護ではない、ⅱ合併・分割の無効の訴えは株主等（828条2項）しか訴えできず乙社側は無効主張できないこととの比較、ⅲ20年後、乙社が事業に失敗したので初めて無効主張して売却代金の返還を請求できていいのか、という問題がある"}, {"aspect": "条文", "text": "467条・828条・1条"}], "articles": ["467条", "828条", "1条"], "pages": [299]}, {"id": "book-kigyoho-01-ch08-r012", "ch": 8, "topic": "支配権を失う子会社株式等の譲渡（467条1項2号の2）", "points": [{"aspect": "趣旨", "text": "趣旨：株主に重大な影響を与えるためである。この場合、親会社が支配権を失うことや、事業の重要な一部の譲渡をしたのと異ならない点から、親会社の株主の利益に重大な影響を及ぼすからである"}, {"aspect": "原則", "text": "467条1項2号の2：その子会社の株式又は持分の全部又は一部の譲渡（次のいずれにも該当する場合における譲渡に限る）"}, {"aspect": "原則", "text": "イ：当該譲渡により譲り渡す株式又は持分の帳簿価額が当該株式会社の総資産額として法務省令で定める方法により算定される額の五分の一（これを下回る割合を定款で定めた場合にあっては、その割合）を超えるとき"}, {"aspect": "原則", "text": "ロ：当該株式会社が、効力発生日において当該子会社の議決権の総数の過半数の議決権を有しないとき"}, {"aspect": "原則", "text": "手続き：株主総会の特別決議（467条1項2号の2、309条2項11号）"}, {"aspect": "要件", "text": "レジュメの「・要件：①②③」欄は番号のみが記載され、各番号が条文のどの要件に対応するかは本文に明記されていない（原文ママ）"}, {"aspect": "条文", "text": "467条・309条"}], "articles": ["467条", "309条"], "pages": [300]}, {"id": "book-kigyoho-01-ch08-r013", "ch": 8, "topic": "（論点）株主総会の特別決議を欠いた467条1項2号の2の譲渡の効力", "points": [{"aspect": "条文", "text": "467条・309条"}], "articles": ["467条", "309条"], "pages": [300]}, {"id": "book-kigyoho-01-ch08-r014", "ch": 8, "topic": "事業財産移転義務と会社債権者の保護", "points": [{"aspect": "原則", "text": "①事業財産移転義務：事業譲渡等は、取引上の行為であるので、契約を締結しただけでは事業財産は譲受人に当然には移転しない。契約の効果として、譲渡人は譲受人に対して事業財産を移転する義務を負う"}, {"aspect": "あてはめ", "text": "論文試験では、裏から問われることある。たとえば、・甲社株主の保護は？→甲社株主の特別決議、・乙社の保護は？→甲社に競業避止義務を課す、・甲社債権者の保護は？→債権者の承諾を要求する"}, {"aspect": "条文", "text": "467条・472条・21条"}], "articles": ["467条", "472条", "21条"], "pages": [301]}, {"id": "book-kigyoho-01-ch08-r015", "ch": 8, "topic": "467条2項（事業の全部の譲渡の対価が譲受会社の株式等の場合）", "points": [{"aspect": "図表", "text": "図：甲社から乙社へ事業の全部の譲渡。対価として乙株が甲社に交付される場面で、乙社株主総会において取締役は説明を（467条2項）。（趣旨）自己株式の取得にあたるから"}, {"aspect": "条文", "text": "467条"}], "articles": ["467条"], "pages": [301]}, {"id": "book-kigyoho-01-ch08-r016", "ch": 8, "topic": "競業避止義務（21条）", "points": [{"aspect": "趣旨", "text": "（趣旨）事業譲渡の実効性を確保するためである"}, {"aspect": "原則", "text": "21条1項（譲渡会社の競業の禁止）：事業を譲渡した会社は、当事者の別段の意思表示がない限り、同一の市町村及びこれに隣接する市町村の区域内においては、その事業を譲渡した日から二十年間は、同一の事業を行ってはならない"}, {"aspect": "原則", "text": "21条2項：譲渡会社が同一の事業を行わない旨の特約をした場合には、その特約は、その事業を譲渡した日から三十年の期間内に限り、その効力を有する"}, {"aspect": "原則", "text": "21条3項：前二項の規定にかかわらず、譲渡会社は、不正の競争の目的をもって同一の事業を行ってはならない"}, {"aspect": "条文", "text": "21条"}], "articles": ["21条"], "pages": [302]}, {"id": "book-kigyoho-01-ch08-r017", "ch": 8, "topic": "第三者に対する効果の総論（債権・債務の移転と特約）", "points": [{"aspect": "結論", "text": "本来、譲渡会社が持つ債権・債務は、事業譲渡によって譲受会社に移すことになるものである。債権・債務も一定の事業目的のために組織化された有機的一体として機能する財産（意義①）だからである。もっとも、事業譲渡の場合は、事業譲渡契約（特約）によって特定の財産、債権・債務を譲渡会社に残すこともできる"}, {"aspect": "あてはめ", "text": "以下の条文（22条・23条等）は、債権・債務を譲渡会社に残した場合に適用される条文であることに注意"}, {"aspect": "条文", "text": "467条・22条・23条"}], "articles": ["467条", "22条", "23条"], "pages": [303]}, {"id": "book-kigyoho-01-ch08-r018", "ch": 8, "topic": "譲渡会社の商号を使用した譲受会社の責任等（22条）", "points": [{"aspect": "原則", "text": "22条1項：事業を譲り受けた会社が譲渡会社の商号を引き続き使用する場合には、その譲受会社も、譲渡会社の事業によって生じた債務を弁済する責任を負う"}, {"aspect": "原則", "text": "22条2項：前項の規定は、事業を譲り受けた後、遅滞なく、譲受会社がその本店の所在地において譲渡会社の債務を弁済する責任を負わない旨を登記した場合には、適用しない。事業を譲り受けた後、遅滞なく、譲受会社及び譲渡会社から第三者に対しその旨の通知をした場合において、その通知を受けた第三者についても、同様とする"}, {"aspect": "原則", "text": "22条3項：譲受会社が第一項の規定により譲渡会社の債務を弁済する責任を負う場合には、譲渡会社の責任は、事業を譲渡した日後二年以内に請求又は請求の予告をしない債権者に対しては、その期間を経過した時に消滅する"}, {"aspect": "原則", "text": "22条4項：第一項に規定する場合において、譲渡会社の事業によって生じた債権について、譲受会社にした弁済は、弁済者が善意でかつ重大な過失がないときは、その効力を有する"}, {"aspect": "条文", "text": "22条"}], "articles": ["22条"], "pages": [303]}, {"id": "book-kigyoho-01-ch08-r019", "ch": 8, "topic": "22条1項・4項の趣旨と「事業主体について誤認」", "points": [{"aspect": "趣旨", "text": "（22条1項の趣旨）商号が続用された場合、債権者は事業主体について誤認することがあるから、この債権者の誤認を救済するためである"}, {"aspect": "趣旨", "text": "（22条4項の趣旨）商号が続用された場合、債務者は事業主体について誤認することがあるから、この債務者の誤認を救済するためである"}, {"aspect": "あてはめ", "text": "「事業主体について誤認」＝同一の事業主体による事業が継続していると誤認。上図で考えると、乙社が甲社の商号を続用しているので、同一の事業主体による事業が継続しているものと思い、（旧）乙社を甲社と誤認してしまう（ことも）。そこで、債権者Ｘの（旧）乙社請求を認め(1項の場合)、債務者Ｙの（旧）乙社への債務の弁済を有効とする（4項の場合）"}, {"aspect": "条文", "text": "22条"}], "articles": ["22条"], "pages": [304]}, {"id": "book-kigyoho-01-ch08-r020", "ch": 8, "topic": "譲受会社による債務の引受け（23条）", "points": [{"aspect": "趣旨", "text": "（23条1項の趣旨）債務引受けの公告をした以上、弁済請求を否定することは禁反言の法理に反するからである"}, {"aspect": "原則", "text": "23条1項：譲受会社が譲渡会社の商号を引き続き使用しない場合においても、譲渡会社の事業によって生じた債務を引き受ける旨の広告をしたときは、譲渡会社の債権者は、その譲受会社に対して弁済の請求をすることができる"}, {"aspect": "原則", "text": "23条2項：譲受会社が前項の規定により譲渡会社の債務を弁済する責任を負う場合には、譲渡会社の責任は、同項の広告があった日後二年以内に請求又は請求の予告をしない債権者に対しては、その期間を経過した時に消滅する"}, {"aspect": "条文", "text": "23条"}], "articles": ["23条"], "pages": [304]}, {"id": "book-kigyoho-01-ch08-r021", "ch": 8, "topic": "詐害事業譲渡における残存債権者保護（23条の2）", "points": [{"aspect": "原則", "text": "23条の2第1項（詐害事業譲渡に係る譲受会社に対する債務の履行の請求）：譲渡会社が譲受会社に承継されない債務の債権者（残存債権者）を害することを知って事業を譲渡した場合には、残存債権者は、その譲受会社に対して、承継した財産の価額を限度として、当該債務の履行を請求することができる。ただし、その譲受会社が事業の譲渡の効力が生じた時において残存債権者を害することを知らなかったときは、この限りでない"}, {"aspect": "原則", "text": "23条の2第2項：譲受会社が前項の規定により同項の債務を履行する責任を負う場合には、当該責任は、譲渡会社が残存債権者を害することを知って事業を譲渡したことを知った時から二年以内に請求又は請求の予告をしない残存債権者に対しては、その期間を経過した時に消滅する。事業の譲渡の効力が生じた日から十年を経過したときも、同様とする"}, {"aspect": "原則", "text": "23条の2第3項：譲渡会社について破産手続開始の決定、再生手続開始の決定又は更生手続開始の決定があったときは、残存債権者は、譲受会社に対して第一項の規定による請求をする権利を行使することができない"}, {"aspect": "要件", "text": "レジュメの「（要件）①②（効果）」欄は、番号と見出しのみで内容の記載がない（原文ママ）"}, {"aspect": "条文", "text": "23条"}], "articles": ["23条"], "pages": [305]}, {"id": "book-kigyoho-01-ch08-r022", "ch": 8, "topic": "（論点）事業名を続用した事業譲渡の譲受人の22条1項責任", "points": [{"aspect": "原則", "text": "＜前提知識＞「商号」とは、商人が自己の営業を表示するものとして用いる名称。事業を法人登記する際に必要となる会社名義。簡単にいうと、（法律で定められた）会社等（法人）の名称。本問では、「商号の続用」ない。原則→修正・例外で書けばいい"}, {"aspect": "結論", "text": "[解答例]前段：丁の丙に対する預託金返還請求が認められるかは，22条1項が適用できるかによる。22条1項によって、譲受会社が債務を負うためには、①譲受会社が事業の譲渡を受けたこと、②譲受会社が譲渡会社の商号を続用することが必要である。本問において、甲丙間の契約は事業譲渡契約であるので、丙は事業の譲渡を受けたといえる。しかし、丙が続用したのは「乙ゴルフ倶楽部」という事業名であり，株式会社甲という商号ではない。そこで，22条1項を直接適用することはできない"}, {"aspect": "結論", "text": "[解答例]類推適用：しかし、22条1項の趣旨は、商号が続用された場合、債権者は同一の事業主体による事業が継続していると誤認することがあるから、この債権者の誤認を救済するためである。そうだとすると、②’譲受会社に商号の続用がなくても、事業名・ブランド名の続用によって債権者が同一の事業主体による事業が継続していると誤認する場合には22条1項を類推適用することができると解する"}, {"aspect": "結論", "text": "[解答例]あてはめ・結論：本問において、ゴルフ場の経営においてゴルフ倶楽部の名称は事業主体を表示するものとして用いられることが多い。丙は「乙ゴルフ倶楽部」という事業名を引き続き使用してゴルフクラブの経営を行ったのであるから、債権者丁は同一事業主体による事業が継続していると誤認したといえ、22条1項を類推適用はできる。したがって、丁は丙に預託金3000万円の返還請求をすることができる"}, {"aspect": "あてはめ", "text": "答案の検討手順：いきなり論点は何？と論点に飛びつかない。問いは何？→丁→丙の預託金返還請求。何条？→事業譲渡があったのだから467条？通常、債務も移転させるのに、債務を移転させていない。そういえば，21条以下も注意だったな！本問は、22条1項の問題だ"}, {"aspect": "あてはめ", "text": "＊（参考）「CPA 会計学院」は事業名。商号、会社名は「CPA エクセレントパートナーズ株式会社」"}, {"aspect": "条文", "text": "22条・467条・21条"}], "articles": ["22条", "467条", "21条"], "pages": [306, 307]}, {"id": "book-kigyoho-01-ch08-r023", "ch": 8, "topic": "（論点）事業名を続用した「会社分割」の新設（承継）会社の22条1項責任", "points": [{"aspect": "結論", "text": "上記最判平成16・2・20の考えが，会社分割の場合でも、同様に妥当する（最判平成20・6・10）。「なぜなら、会社分割に伴いゴルフ場の事業が他の会社又は設立会社に承継される場合、法律行為によって事業の全部又は一部が別の権利義務の主体に承継されるという点においては、事業の譲渡と異なるところはなく、事業主体を表示するものとして用いられていたゴルフクラブの名称が事業を承継した会社によって引き続き使用されているときには、（上記のような特段の事情のない限り、）ゴルフクラブの会員において、同一事業主体による事業が継続しているものと信じたり、事業主体の変更があったけれども当該事業によって生じた債務については事業を承継した会社に承継されたと信じたりすることは無理からぬものというべきであるからである。」"}, {"aspect": "条文", "text": "22条"}], "articles": ["22条"], "pages": [308]}, {"id": "book-kigyoho-01-ch09-r001", "ch": 9, "topic": "合併の定義（2条27号・28号）", "points": [{"aspect": "原則", "text": "合併とは、2以上の会社が契約によって1会社に合同すること"}, {"aspect": "原則", "text": "吸収合併（2条27号）・新設合併（2条28号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}, {"aspect": "条文", "text": "2条"}], "articles": ["2条"], "pages": [310]}, {"id": "book-kigyoho-01-ch09-r002", "ch": 9, "topic": "会社分割の定義（2条29号・30号）", "points": [{"aspect": "原則", "text": "会社分割とは、1会社を2以上の会社に分けること"}, {"aspect": "原則", "text": "吸収分割（2条29号）・新設分割（2条30号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}, {"aspect": "条文", "text": "2条"}], "articles": ["2条"], "pages": [310]}, {"id": "book-kigyoho-01-ch09-r003", "ch": 9, "topic": "株式交換・株式移転の定義（2条31号・32号）", "points": [{"aspect": "原則", "text": "株式交換（2条31号）・株式移転（2条32号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}, {"aspect": "条文", "text": "2条"}], "articles": ["2条"], "pages": [310]}, {"id": "book-kigyoho-01-ch09-r004", "ch": 9, "topic": "株式交付の定義（2条32号の2）", "points": [{"aspect": "原則", "text": "株式交付とは、株式会社が他の株式会社をその子会社とするために当該他の株式会社の株式を譲り受け、当該株式の譲渡人に対して当該株式の対価として当該株式会社の株式を交付することをいう（2条32号の2）"}, {"aspect": "あてはめ", "text": "株式交付は、いわば部分的な株式交換である"}, {"aspect": "条文", "text": "2条"}], "articles": ["2条"], "pages": [310]}, {"id": "book-kigyoho-01-ch09-r005", "ch": 9, "topic": "組織変更の定義（2条26号）", "points": [{"aspect": "原則", "text": "組織変更（2条26号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}, {"aspect": "条文", "text": "2条"}], "articles": ["2条"], "pages": [310]}, {"id": "book-kigyoho-01-ch09-r006", "ch": 9, "topic": "第五編の条文構造（全体像）", "points": [{"aspect": "原則", "text": "第五編「組織変更、合併、会社分割、株式交換、株式移転及び株式交付」のうち、第一章 組織変更・第二章 合併の構造（第一節 通則748条、第二節 吸収合併は第一款749条・750条／第二款751条・752条、第三節 新設合併は第一款753条・754条／第二款755条・756条）"}, {"aspect": "原則", "text": "第三章 会社分割（第一節 吸収分割・第二節 新設分割）、第四章 株式交換及び株式移転（第一節 株式交換・第二節 株式移転772条―774条）、第四章の二 株式交付（774条の2―774条の11）の構造"}, {"aspect": "原則", "text": "第五章（手続）の構造：第一節 組織変更の手続、第二節 吸収合併等の手続（第一款 第一目782条―792条・第二目793条、第二款 第一目794条―801条・第二目802条）、第三節 新設合併等の手続、第四節 株式交付の手続（816条の2―816条の10）"}, {"aspect": "条文", "text": "748条・749条・750条・751条・752条・753条・754条・755条・756条・772条・774条・782条・792条・793条・794条・801条・802条・816条"}], "articles": ["748条", "749条", "750条", "751条", "752条", "753条", "754条", "755条", "756条", "772条", "774条", "782条", "792条", "793条", "794条", "801条", "802条", "816条"], "pages": [311]}, {"id": "book-kigyoho-01-ch09-r007", "ch": 9, "topic": "条文構造の具体例（吸収合併の効果・手続の条文）", "points": [{"aspect": "図表", "text": "たとえば図：甲株式会社・乙株式会社の吸収合併では、効果は両社とも750条、手続きは甲社が782条〜792条、乙社が794条〜801条"}, {"aspect": "条文", "text": "750条・782条・792条・794条・801条"}], "articles": ["750条", "782条", "792条", "794条", "801条"], "pages": [311]}, {"id": "book-kigyoho-01-ch09-r008", "ch": 9, "topic": "合併の効果（3つの当然）", "points": [{"aspect": "原則", "text": "3つの当然の根拠条文：①は750条1項、②は471条4号・475条1号かっこ書き、③は749条1項2号"}, {"aspect": "原則", "text": "対価の柔軟化：749条1項2号ホは、当該金銭等が吸収合併存続株式会社の株式等以外の財産であるとき（金銭、親会社の株式等）も対価とすることを認めるもので、「ホ」を認めることが「対価の柔軟化」である"}, {"aspect": "あてはめ", "text": "三角合併は吸収型組織再編のみ可能である"}, {"aspect": "条文", "text": "750条・749条・471条・475条"}], "articles": ["750条", "749条", "471条", "475条"], "pages": [312]}, {"id": "book-kigyoho-01-ch09-r009", "ch": 9, "topic": "会社分割の効果（合併の3つの当然のあてはめ）", "points": [{"aspect": "原則", "text": "物的分割の根拠：①は759条1項。物的分割の条文は758条4号（「吸収分割会社に対して」）・759条8項（「吸収分割会社は」）"}, {"aspect": "原則", "text": "いわゆる人的分割の根拠条文：（ⅰ）758条8号ロ・760条7号ロ、（ⅱ）財源制限なしは792条2号、（ⅲ）債権者異議手続きは789条1項2号第2かっこ書き"}, {"aspect": "原則", "text": "cf. 新設分割なら：（ⅰ）763条1項12号ロ・765条1項8号ロ、（ⅱ）812条、（ⅲ）810条1項2号第2かっこ書き"}, {"aspect": "条文", "text": "759条・758条・792条・789条・760条・763条・765条・812条・810条"}], "articles": ["759条", "758条", "792条", "789条", "760条", "763条", "765条", "812条", "810条"], "pages": [313]}, {"id": "book-kigyoho-01-ch09-r010", "ch": 9, "topic": "株式交換・株式移転の効果（合併の3つの当然のあてはめ）", "points": [{"aspect": "原則", "text": "根拠条文：完全親子会社関係の構築（効果発生）は769条1項/774条1項、③の地位移転は768条1項2号/773条1項5号、769条3項/774条2項3項"}, {"aspect": "結論", "text": "株式交換・株式移転では、各当事会社の会社財産は変動しない（①の否定）。株式移転の場合、消滅する会社はない（②の否定）。完全子会社の株主の地位が移転するのみである（③のみ肯定）"}, {"aspect": "条文", "text": "769条・774条・768条・773条"}], "articles": ["769条", "774条", "768条", "773条"], "pages": [314]}, {"id": "book-kigyoho-01-ch09-r011", "ch": 9, "topic": "組織再編の手続の全体像（①特別決議・②買取請求・③債権者異議）", "points": [{"aspect": "原則", "text": "①②③の手続は、合併のみならず、株式交換・株式移転・株式交付においても原則あてはまる。ただし、株式交付の場合は、株式交付親会社に限る"}, {"aspect": "あてはめ", "text": "Q：上記手続の根拠条文は？→条文の目次から探す"}, {"aspect": "条文", "text": "783条・785条・789条"}], "articles": ["783条", "785条", "789条"], "pages": [315]}, {"id": "book-kigyoho-01-ch09-r012", "ch": 9, "topic": "株主総会の特別決議の趣旨", "points": [{"aspect": "趣旨", "text": "株主総会の特別決議を要する趣旨：組織再編行為がなされると、当事会社の株主が会社の資産状況や組織再編行為の条件に重大な利害関係を有するからである"}, {"aspect": "条文", "text": "783条・795条"}], "articles": ["783条", "795条"], "pages": [315]}, {"id": "book-kigyoho-01-ch09-r013", "ch": 9, "topic": "（問題1）吸収合併の承認決定手続（対価の種類による違い）", "points": [{"aspect": "原則", "text": "①乙社株式の場合：甲社は株主総会の特別決議（783条1項、309条2項12号）、乙社も株主総会の特別決議（795条1項、309条2項12号）"}, {"aspect": "原則", "text": "②譲渡制限株式である乙社株式の場合：甲社は株主総会の特殊決議（783条1項、309条3項2号）、乙社は株主総会の特別決議（795条1項、309条2項12号）"}, {"aspect": "原則", "text": "②の場合で、乙社が譲渡制限種類株式発行会社の場合（たとえば、c種類株式が譲渡制限株式の場合）は、乙社株主総会の特別決議に加えてc種類株主総会の特別決議（795条4項、324条2項6号）を要する"}, {"aspect": "原則", "text": "③持分の場合：甲社は総株主の同意（783条2項）、乙社は株主総会の特別決議（795条1項、309条2項12号）"}, {"aspect": "あてはめ", "text": "「説明問題」だから、（定義→）条文→趣旨の順で書く。「承認決定手続き」を問われているだけだから、上記「①株主総会の特別決議」の有無の問題だけである。まず、条文を見つけ、趣旨を考える"}, {"aspect": "条文", "text": "783条・795条・309条・324条"}], "articles": ["783条", "795条", "309条", "324条"], "pages": [316]}, {"id": "book-kigyoho-01-ch09-r014", "ch": 9, "topic": "（問題2）吸収分割の承認決定手続", "points": [{"aspect": "原則", "text": "甲社の承認決定手続きは、①、②、③すべて、株主総会の特別決議（783条1項、309条2項12号）"}, {"aspect": "原則", "text": "乙社の承認決定手続きは（問題1）と同じ。条文も同じ"}, {"aspect": "条文", "text": "783条・795条・309条"}], "articles": ["783条", "795条", "309条"], "pages": [317]}, {"id": "book-kigyoho-01-ch09-r015", "ch": 9, "topic": "（問題3）株式交換の承認決定手続", "points": [{"aspect": "原則", "text": "甲社、乙社とも（問題1）と同じ。条文も同じ"}, {"aspect": "条文", "text": "783条・795条"}], "articles": ["783条", "795条"], "pages": [317]}, {"id": "book-kigyoho-01-ch09-r016", "ch": 9, "topic": "略式組織再編（特別支配会社）", "points": [{"aspect": "趣旨", "text": "略式組織再編の趣旨：被支配会社の株主総会決議成立が確実視されるにもかかわらず、多くの時間や費用を投じて株主総会の開催を強制する合理性がないからである"}, {"aspect": "原則", "text": "784条1項（吸収合併契約等の承認を要しない場合）：前条第一項の規定は、存続会社等が消滅株式会社等の特別支配会社である場合には、適用しない"}, {"aspect": "原則", "text": "注記：「前条第一項の規定」とは、株主総会の特別決議を要求する規定である。「特別支配会社」の定義は、略式事業譲渡の規定の中にある（468条1項）"}, {"aspect": "原則", "text": "468条1項（事業譲渡等の承認を要しない場合）：特別支配会社とは、ある株式会社の総株主の議決権の十分の九（これを上回る割合を定款で定めた場合は、その割合）以上を他の会社及び当該他の会社が発行済株式の全部を有する株式会社その他これに準ずるものとして法務省令で定める法人が有している場合における当該他の会社をいう"}, {"aspect": "あてはめ", "text": "＜答案＞での書き方：特別支配会社とは、……（468条1項参照）。本問において、甲社は乙社の総株主の議決権の10分の9以上の議決権を有している。したがって、甲社は特別支配会社といえる"}, {"aspect": "条文", "text": "784条・468条"}], "articles": ["784条", "468条"], "pages": [318]}, {"id": "book-kigyoho-01-ch09-r017", "ch": 9, "topic": "簡易組織再編", "points": [{"aspect": "趣旨", "text": "簡易組織再編の趣旨：簡易組織再編の場合、株主への影響が小さいので、株主総会決議を要求しなくても株主保護に欠けるところがないからである"}, {"aspect": "原則", "text": "784条2項：前条の規定は、吸収分割により吸収分割承継会社に承継させる資産の帳簿価額の合計額が吸収分割株式会社の総資産額として法務省令で定める方法により算定される額の五分の一（これを下回る割合を吸収分割株式会社の定款で定めた場合にあっては、その割合）を超えない場合には、適用しない。「前条」とは株主総会の特別決議を要求する783条である"}, {"aspect": "あてはめ", "text": "＜答案＞（説明問題）の書き方：1 原則、株主総会の特別決議が必要（783条1項、309条2項12号）。これは、……（趣旨）。2 ただし、784条2項の条文。株主総会の特別決議は不要である。これは、……（趣旨）"}, {"aspect": "あてはめ", "text": "＜答案＞（事例問題）の書き方：株主総会の特別決議が不要かどうかは、簡易吸収分割（784条2項）にあたるかどうかによる。784条2項の要件をあてはめ、本問では株主総会の特別決議は不要である"}, {"aspect": "条文", "text": "784条・783条・309条"}], "articles": ["784条", "783条", "309条"], "pages": [319]}, {"id": "book-kigyoho-01-ch09-r018", "ch": 9, "topic": "株式買取請求が認められる4つの場合（根拠条文）", "points": [{"aspect": "原則", "text": "反対株主の買取請求が認められるのは4つの場合だけ：①116条の定款変更の場合、②株式併合の決議の場合（182条の4）、③事業譲渡等の決議の場合（469条）、④組織再編行為の決議の場合（785条、797条、806条、816条の6）"}, {"aspect": "原則", "text": "①116条の内訳：全部または一部の株式に譲渡制限の定めを設ける定款変更に反対する場合（116条1項1号2号）、全部取得条項付種類株式の定款の定めを設ける定款変更に反対する場合（116条1項2号）、種類株主総会決議不要の定款変更がある場合に種類株主に損害を及ぼすおそれがある場合（116条1項3号）"}, {"aspect": "原則", "text": "785条1項（反対株主の株式買取請求）：吸収合併等をする場合（次に掲げる場合を除く。）には、反対株主は、消滅株式会社等に対し、自己の有する株式を公正な価格で買い取ることを請求することができる"}, {"aspect": "条文", "text": "116条・182条・469条・785条・797条・806条・816条"}], "articles": ["116条", "182条", "469条", "785条", "797条", "806条", "816条"], "pages": [320]}, {"id": "book-kigyoho-01-ch09-r019", "ch": 9, "topic": "株式買取請求が認められる株主（反対株主の定義・785条2項）", "points": [{"aspect": "原則", "text": "原則、2回反対必要（785条2項1号イ）：株主総会に先立って反対する旨を通知し、かつ株主総会において反対した株主が反対株主となる"}, {"aspect": "原則", "text": "785条2項（反対株主の定義）：1号イ＝総会に先立って反対する旨を通知し、かつ総会において反対した株主（議決権を行使することができるものに限る）、1号ロ＝総会において議決権を行使することができない株主、2号＝決議を要しない場合は全ての株主（784条1項本文の場合の特別支配会社を除く）"}, {"aspect": "あてはめ", "text": "＜答案＞（事例問題でのBの書き方）：株主Aは、甲社株主総会において当該株式交換に反対したが、当該株主総会に先立って反対する旨を会社に通知していない。したがって、株主Aは「反対株主」にあたらない（785条2項1号イ）"}, {"aspect": "条文", "text": "785条・784条"}], "articles": ["785条", "784条"], "pages": [321]}, {"id": "book-kigyoho-01-ch09-r020", "ch": 9, "topic": "株式買取請求が認められない場合（1）総株主の同意が必要な場合", "points": [{"aspect": "原則", "text": "総株主の同意が必要な場合（785条1項1号、806条1項1号）は、株式買取請求権は認められない。これは、総株主の同意が要求される以上反対株主は存在しないからである"}, {"aspect": "条文", "text": "785条・806条"}], "articles": ["785条", "806条"], "pages": [321]}, {"id": "book-kigyoho-01-ch09-r021", "ch": 9, "topic": "株式買取請求が認められない場合（2）略式・簡易組織再編", "points": [{"aspect": "結論", "text": "略式組織再編等の場合：原則、「全ての株主」に買取請求が認められる（469条2項2号、785条2項2号、797条2項2号、816条の6第2項2号）"}, {"aspect": "結論", "text": "略式組織再編等の例外：「特別支配会社」には認められない（前記各条文の同条項号かっこ書）。趣旨は、特別支配会社に認める合理性はないからである"}, {"aspect": "結論", "text": "簡易組織再編等：買取請求は認められない。趣旨は、簡易組織再編等の場合、会社に与える損害・株主に与える影響は軽微であり、株式買取請求権を与えるまでの必要性がないからである"}, {"aspect": "条文", "text": "785条・469条・797条・816条・806条"}], "articles": ["785条", "469条", "797条", "816条", "806条"], "pages": [322]}, {"id": "book-kigyoho-01-ch09-r022", "ch": 9, "topic": "株式買取請求が認められない場合（3）事業の全部譲渡と解散決議", "points": [{"aspect": "趣旨", "text": "趣旨：解散決議をした場合株主は残余財産の分配を受けるので（105条1項2号、504条）、株式買取請求によって経済的救済を図る必要はないからである"}, {"aspect": "原則", "text": "事業の全部譲渡の場合に、譲渡会社が株主総会で、承認決議と同時に会社の解散決議をした場合は、買取請求は認められない（469条1項1号）"}, {"aspect": "条文", "text": "469条・105条・504条"}], "articles": ["469条", "105条", "504条"], "pages": [322]}, {"id": "book-kigyoho-01-ch09-r023", "ch": 9, "topic": "債権者異議手続の条文と趣旨", "points": [{"aspect": "趣旨", "text": "債権者異議手続の趣旨：組織再編行為によって当時会社の債権者が重大な影響を受けるおそれがあるので保護の必要があるためである"}, {"aspect": "原則", "text": "789条（債権者の異議）：次の各号に掲げる場合には、当該各号に定める債権者は、消滅株式会社等に対し、吸収合併等について異議を述べることができる（たとえばの条文例）"}, {"aspect": "原則", "text": "債権者異議手続の根拠条文は、789条1項、799条1項、810条1項、816条の8第1項である"}, {"aspect": "条文", "text": "789条・799条・810条・816条"}], "articles": ["789条", "799条", "810条", "816条"], "pages": [323]}, {"id": "book-kigyoho-01-ch09-r024", "ch": 9, "topic": "債権者異議が認められる債権者の範囲（合併・会社分割）", "points": [{"aspect": "図表", "text": "＜合併＞の図：合併により、XもYも不利益を被るおそれあり、XもYも債権者保護が必要な「債権者」である（債権者の範囲は上記各条文の各号による）"}, {"aspect": "図表", "text": "＜会社分割＞の図：原則、不利益を被るおそれがある債権者は、X2（乙社に承継される債務の債権者）とYである。ただし、いわゆる人的分割の場合にはX1も不利益を被る"}, {"aspect": "条文", "text": "789条"}], "articles": ["789条"], "pages": [324]}, {"id": "book-kigyoho-01-ch09-r025", "ch": 9, "topic": "債権者異議の範囲（株式交換・株式移転）", "points": [{"aspect": "図表", "text": "＜株式交換・株式移転＞の原則の図：甲社・乙社の会社財産の減少はないため、X、Yに不利益はなく、株式交換・株式移転の場合、債権者保護手続きは不要である"}, {"aspect": "図表", "text": "例外①の図：対価が金銭（条文上は「完全親会社の株式以外のもの」）の場合、債権者Yには乙社財産減少のおそれがある"}, {"aspect": "図表", "text": "例外②③の図：乙社が交付した新株予約権付社債（乙社が償還義務を負う社債）について、②Cから見れば償還義務者が甲社から乙社に変更という不利益のおそれがあり、③乙社が償還義務を負うので乙社財産減少のおそれがあり、Yに不利益のおそれがある。例外として、上記の①②③には債権者保護手続きが必要である"}, {"aspect": "条文", "text": "797条・806条"}], "articles": ["797条", "806条"], "pages": [325]}, {"id": "book-kigyoho-01-ch09-r026", "ch": 9, "topic": "分割会社の債権者保護の規定の位置と各別の催告", "points": [{"aspect": "原則", "text": "分割会社の債権者保護の規定の位置：条文タイトル「株式会社を設立する吸収（新設）分割の効力の発生等」の中にある。759条1項、764条1項は包括承継の規定で、その各条文の2項3項4項に債権者保護の規定がある"}, {"aspect": "原則", "text": "＜前提知識＞（＊1）各別の催告の要否：根拠条文は吸収型の甲社が789条1項、乙社が799条1項、新設型の甲社が810条1項。原則、一定の事項を官報に公告、かつ、知れている債権者には「各別の催告」をしなければならない（上記各条2項）"}, {"aspect": "原則", "text": "各別の催告の例外：官報に公告、さらに、定款に定めた時事日刊新聞紙に公告または電子公告すれば「各別の催告」不要（各3項）。会社の負担への配慮である"}, {"aspect": "原則", "text": "例外の例外：もっとも、会社分割においては、不法行為によって生じた分割会社の債務の債権者に対しては、必ず「各別の催告」が必要（789条3項かっこ書、810条3項かっこ書）。保護の必要性が高いからである"}, {"aspect": "条文", "text": "759条・764条・789条・799条・810条"}], "articles": ["759条", "764条", "789条", "799条", "810条"], "pages": [326]}, {"id": "book-kigyoho-01-ch09-r027", "ch": 9, "topic": "2項・3項の効果と要件（各別の催告を受けなかった債権者の履行請求）", "points": [{"aspect": "原則", "text": "764条2項（新設分割）：第1項の規定にかかわらず、810条1項2号の規定により異議を述べることができる新設分割会社の債権者であって、810条2項の各別の催告を受けなかったもの（810条3項に規定する場合は不法行為債権者に限る）は、新設分割計画で新設分割後に新設分割会社に対して債務の履行を請求することができないものとされているときであっても、新設分割会社に対して、新設分割会社が新設分割設立株式会社の成立の日に有していた財産の価額を限度として、当該債務の履行を請求することができる"}, {"aspect": "原則", "text": "764条3項（新設分割）：第1項の規定にかかわらず、810条1項2号の規定により異議を述べることができる新設分割会社の債権者であって、同条2項の各別の催告を受けなかったものは、新設分割計画で新設分割後に新設分割設立株式会社に対して債務の履行を請求することができないものとされているときであっても、新設分割設立株式会社に対して、承継した財産の価額を限度として、当該債務の履行を請求することができる"}, {"aspect": "要件", "text": "2項＜効果＞X2は「分割会社（甲社）に対して、当該債務の履行請求できる」。＜要件＞①債権者異議手続きが与えられている分割会社の債権者で、各別の催告（＊1）を受けなかった債権者、②分割会社に債務の履行請求ができない場合"}, {"aspect": "要件", "text": "3項＜効果＞いわゆる人的分割の場合のX1は「承継・設立会社（乙社）に対して、当該債務の履行請求できる」。＜要件＞①債権者異議手続きが与えられている分割会社の債権者で、各別の催告（＊1）を受けなかった債権者、②分割設立会社に債務の履行請求ができない場合"}, {"aspect": "条文", "text": "759条・764条・810条"}], "articles": ["759条", "764条", "810条"], "pages": [327]}, {"id": "book-kigyoho-01-ch09-r028", "ch": 9, "topic": "詐害的会社分割（詐害分割）における残存債権者保護（4項・5項）", "points": [{"aspect": "原則", "text": "764条4項（新設分割）：第1項の規定にかかわらず、新設分割会社が新設分割設立株式会社に承継されない債務の債権者（残存債権者）を害することを知って新設分割をした場合には、残存債権者は、新設分割設立株式会社に対して、承継した財産の価額を限度として、当該債務の履行を請求することができる"}, {"aspect": "原則", "text": "5項：いわゆる人的分割の場合は4項不適用（764条5項：前項の規定は、前条第一項第十二号に掲げる事項についての定めがある場合には、適用しない）。趣旨は、いわゆる人的分割の場合は債権者異議手続きがあるので（789条1項2号第二かっこ書、810条1項2号第二かっこ書）、債権者の保護は債権者異議手続で図られるからである"}, {"aspect": "要件", "text": "＜効果＞Xは「承継・設立会社（乙社）に対して、当該債務の履行請求できる」。＜要件＞①分割会社が残存債権者を「害する」ことを知って会社分割をした場合（客観的な詐害分割行為と主観的な分割会社の悪意と考えてもよい）、②吸収分割の場合は、さらに、承継会社の悪意（4項ただし書）"}, {"aspect": "あてはめ", "text": "Q：どのような場合に、「害する」といえるか（あてはめで使う）→会社分割の前後で、残存債権者が受けられると期待できる弁済額が減少したかどうかで判断する"}, {"aspect": "条文", "text": "759条・764条・763条・789条・810条"}], "articles": ["759条", "764条", "763条", "789条", "810条"], "pages": [328, 329]}, {"id": "book-kigyoho-01-ch09-r029", "ch": 9, "topic": "組織再編行為の差止請求権", "points": [{"aspect": "趣旨", "text": "（ア）の趣旨：消滅株式会社等の株主の不利益のおそれがあり、保護の必要があるため。または、消滅株式会社等の株主の不利益のおそれがあり保護の必要があるところ、効力発生後の無効の訴えは認容されにくいので、事前に差止めを認めるべきだからである"}, {"aspect": "趣旨", "text": "（イ）の理由：株主への影響が小さい組織再編行為である場合にまで株主に差止めを認める必要はないからである。（ウ）の趣旨：被支配会社の少数株主の利益保護のため"}, {"aspect": "原則", "text": "差止請求権の根拠条文は、784条の2柱書本文1号、796条の2柱書本文1号、805条の2本文、816条の5本文（目次から探す）"}, {"aspect": "原則", "text": "784条の2（吸収合併等をやめることの請求）：次に掲げる場合において、消滅株式会社等の株主が不利益を受けるおそれがあるときは、消滅株式会社等の株主は、消滅株式会社等に対し、吸収合併等をやめることを請求することができる。ただし、前条第二項に規定する場合は、この限りでない。一 当該吸収合併等が法令又は定款に違反する場合、二 対価等の事項が消滅株式会社等又は存続会社等の財産の状況その他の事情に照らして著しく不当であるとき"}, {"aspect": "要件", "text": "要件（ア）原則：①吸収合併等が法令又は定款に違反すること、②消滅株式会社等の株主が不利益を受けるおそれがあること"}, {"aspect": "要件", "text": "要件（イ）簡易組織再編の場合：差止請求なし（各条ただし書）"}, {"aspect": "要件", "text": "要件（ウ）略式組織再編の場合：①対価が著しく不当であること（784条の2第2号、796条の2第2号）、②消滅株式会社等の株主が不利益を受けるおそれがあること"}, {"aspect": "あてはめ", "text": "cf. 略式の場合に差止請求を認めた理由：通常、株主が対価に不満であれば株式買取請求をし、対価に著しく不満であれば株主総会で反対する。しかし、略式の場合、株主総会決議がなく略式組織再編に反対することでやめさせることはできない。そこで、略式の場合、対価に著しく不満があれば、それを理由に差止請求を認めた"}, {"aspect": "あてはめ", "text": "答案の書き方：説明問題なら条文→趣旨、事例問題なら①問題提起→②要件→③あてはめ"}, {"aspect": "あてはめ", "text": "事業譲渡の場合：事業譲渡は取引法上の行為（単なる大きな取引）であって、合併などの組織法上の行為とは異なる。そこで、特別な差止請求権の規定はなく、360条、422条の差止め請求を使うことになる"}, {"aspect": "条文", "text": "784条・796条・805条・816条・360条・422条"}], "articles": ["784条", "796条", "805条", "816条", "360条", "422条"], "pages": [330, 331]}, {"id": "book-kigyoho-01-ch09-r030", "ch": 9, "topic": "組織再編行為の無効の訴え（828条：要件と効力）", "points": [{"aspect": "原則", "text": "828条（会社の組織に関する行為の無効の訴え）：1項7号は吸収合併の無効は効力が生じた日から六箇月以内に訴えをもってのみ主張できること、2項7号は提訴権者（吸収合併をする会社の株主等であった者、吸収合併後存続する会社の株主等・社員等・破産管財人、吸収合併について承認をしなかった債権者）を定める。組織再編行為の無効の訴えは828条1項7号～13号・2項7号～13号"}, {"aspect": "原則", "text": "イ、効力（効果）：a）認容判決の対世効（838条）、b）認容判決の将来効（839条）→843条（合併又は会社分割の無効判決の効力）、844条（株式交換又は株式移転の無効判決の効力）、844条の2（株式交付の無効判決の効力）"}, {"aspect": "要件", "text": "ア、答案の書き出し（要件）：吸収合併無効の主張が認められるためには、①株主等による（828条2項7号）、②吸収合併の効力が生じた日から六箇月以内の訴えであること（同条1項7号）、③明文の規定を欠くが無効原因が存在することが必要である。法的安定性、取引の安全の見地から、無効原因は重大な瑕疵（重大な法令定款違反）がある場合に限ると解する"}, {"aspect": "あてはめ", "text": "無効を主張しているのが会社債権者であれば、論証の①を「①承認しなかった債権者による（828条2項7号）」と変えれば良い。②の効力発生日は、吸収型組織再編行為は契約で定めた日、新設型組織再編行為は登記の日である"}, {"aspect": "条文", "text": "828条・838条・839条・843条・844条"}], "articles": ["828条", "838条", "839条", "843条", "844条"], "pages": [332]}, {"id": "book-kigyoho-01-ch09-r031", "ch": 9, "topic": "（論点）「承認しなかった債権者」の意義（X1・X2の事例）", "points": [{"aspect": "原則", "text": "（論点）会社債権者X1・X2は当該吸収分割の無効を主張できるか：吸収分割無効の主張が認められるためには、①承認しなかった債権者による、②吸収分割の効力が生じた日から六箇月以内の訴えであること、③明文の規定を欠くが無効原因が存在することが必要である。「承認しなかった債権者」とは、債権者異議手続において異議を述べることができる債権者の中で組織再編を承認しなかった債権者である。無効原因は重大な瑕疵がある場合に限る"}, {"aspect": "結論", "text": "（妥当な結論）X1は、そもそも債権者異議をいえるものではないから、「承認しなかった債権者」にあたらない。X2は、債権者異議手続で異議をいえるものなのに、そのチャンスを奪っているから、「承認しなかった債権者」にあたるとすべきである（そのためにも4項のみなし承認規定は不適用と考えるべき）"}, {"aspect": "結論", "text": "債権者異議手続きを欠くことは重大な瑕疵といえる。したがって、X2は吸収分割の効力発生日から6ヶ月以内に吸収分割無効の訴えを提起すれば無効を主張することができる"}, {"aspect": "あてはめ", "text": "あてはめ（X1）：X1は、異議を述べることができる債権者ではない（789条1項2号参照）ため、吸収分割に反対していても承認しなかった債権者ではない。したがって、X1は当該吸収分割の無効の主張はできない"}, {"aspect": "あてはめ", "text": "＊下線部は、「各別の催告がなされなかった場合のみなし承認規定（789条4項、799条4項）の適用の可否」というマイナーな論点で、結論自体に争いはない。重要なのは、X2をなんとか「承認しなかった債権者」とできないかと考えながら、原則（条文そのものの適用）では難しいと認識し、原則（→不都合）→修正の発想で論述することである"}, {"aspect": "あてはめ", "text": "変形問題：甲社が「債権者異議手続を全く行っていなかった場合」も、X2が「異議を述べなかった」ので「承認したものとみなす」と789条4項を適用していいのか。条文の文言（789条4項は「債権者の異議」という789条の見出しの中の項である）と趣旨から考える"}, {"aspect": "条文", "text": "828条・789条・799条"}], "articles": ["828条", "789条", "799条"], "pages": [333, 334]}, {"id": "book-kigyoho-01-ch09-r032", "ch": 9, "topic": "（論点）合併比率の不公正は合併無効原因になるか（独立した関係の場合）", "points": [{"aspect": "結論", "text": "Ⅰ：当事会社が相互に独立した関係の場合、合併比率の不公正は無効原因にならない。論証：合併比率は当事会社の交渉によって定められるものであり、多くの事情を勘案して様々の方式によって算定され厳密に客観的正確性をもって唯一の数値と確定されるものではない。裁判所が合併の無効という形で事後的に介入する必要は乏しく、介入はかえって法的安定性を害する。このように解しても、合併承認決議に反対株主の保護は株式買取請求で図ることができる"}, {"aspect": "条文", "text": "828条"}], "articles": ["828条"], "pages": [335]}, {"id": "book-kigyoho-01-ch09-r033", "ch": 9, "topic": "（論点）合併比率の著しく不公正と831条1項3号の取消原因（独立した関係にない場合）", "points": [{"aspect": "原則", "text": "＜合併の無効原因の流れ＞1：乙社＝特別利害関係株主→著しく不当な決議→取消原因あり（831条1項3号）"}, {"aspect": "結論", "text": "（論点）831条1項3号の取消原因は合併無効の無効原因になる。論証：無効原因は法的安定性、取引の安全の見地から重大な瑕疵に限ると解する。特別の利害関係を有する者が議決権を行使したことによって著しく不当な決議がされたときは、まさに多数決の濫用がなされたときであり、少数株主の保護の必要性は高い。したがって、重大な瑕疵があると解し、かかる株主総会決議の取消原因は合併無効の無効原因となると解する"}, {"aspect": "結論", "text": "肯定説の論証：決議取消原因がある場合に、株主総会決議取消の訴えができるのが決議の日から3ヶ月以内とした趣旨は（831条1項柱書）、決議の効力の早期確定のためである。そうだとすると、決議取消原因を無効原因とする場合は、決議の効力の早期確定のため、合併無効の訴えも株主総会決議の日から3ヶ月以内に提訴しなければならないと解する"}, {"aspect": "あてはめ", "text": "（視点）合併比率の「著しい」不公正の場合は裁判所の介入（合併無効）を認めていいのでは？しかし、「著しい」かどうかの区別は不明確？上記のような合併比率の著しい不公正が可能なのは、甲・乙社が親子会社のような場合であり、多数決の濫用（親会社の乙社賛成）による少数株主（A）保護の必要性がある"}, {"aspect": "あてはめ", "text": "＊株主総会決議の取消事由があることが「法令違反」ではないので、ここでは、合併無効の無効原因を「重大な法令定款違反」といわず、「重大な瑕疵」と書く"}, {"aspect": "条文", "text": "828条・831条"}], "articles": ["828条", "831条"], "pages": [336, 337]}, {"id": "book-kigyoho-01-ch09-r034", "ch": 9, "topic": "（参考）株主総会決議取消の訴えと合併無効の訴えの関係（吸収説）", "points": [{"aspect": "結論", "text": "吸収説：株主総会決議取消の訴え（831条1項）は形成訴訟であり、必ず訴えによらなければならないため、本来まず取消の訴えを先に提訴すべきことになる。しかし、総会決議の取消しが確定するまで組織再編の無効原因にならないとすると、無効の訴えの提訴期間に間に合わなくなることが多い。そこで、株主総会決議取消の訴えは、組織再編の効力発生後は、無効の訴え（828条）に変更すべきである（訴えの変更、民事訴訟法143条）。いわば、総会決議取消の訴えは、組織再編行為の無効の訴えに「吸収」される（吸収説）"}, {"aspect": "あてはめ", "text": "会計士試験では、訴えの変更は出題されないので、上記のままの問題は考えにくい。会計士試験としては、「（論点）合併無効の訴えの無効原因に株主総会決議の取消原因が含まれるか？」、「（論点）株主総会決議の取消原因を合併無効の無効原因とする合併無効の訴えは、総会決議の日から3ヶ月以内に提訴しなければならないか？」の問題となる"}, {"aspect": "条文", "text": "831条・828条・143条"}], "articles": ["831条", "828条", "143条"], "pages": [338]}, {"id": "book-kigyoho-01-ch09-r035", "ch": 9, "topic": "株主総会決議の取消事由一般と組織再編行為への妥当", "points": [{"aspect": "要件", "text": "合併無効の訴えの要件（828条1項7号2項7号）：①吸収合併後存続する会社の株主による吸収合併の効力発生日から6箇月以内の訴えであること、②無効原因が存在すること（重大な法令定款違反、重大な瑕疵）"}, {"aspect": "結論", "text": "（参照）合併が株主総会の決議によってなされる場合、株主総会決議に取消事由があることは、合併の重大な瑕疵といえ、無効原因となると解する"}, {"aspect": "あてはめ", "text": "＜注意＞「株主総会決議の無効原因や不存在原因が、合併の無効原因となるか？」も同じ話なので、本試験ではこちらの形で問われるかもしれない"}, {"aspect": "あてはめ", "text": "＜注意＞以上の議論は、合併においてのみ妥当するのではなく、吸収分割など組織再編行為一般にも妥当する話である。本試験では、「分割対価が不公正」「分割対価が著しく不公正」ことが吸収分割の無効原因かという問題が出題されるかもしれない。その場合も同様のことを書けば良い"}, {"aspect": "条文", "text": "828条"}], "articles": ["828条"], "pages": [339]}, {"id": "book-kigyoho-01-ch09-r036", "ch": 9, "topic": "吸収分割と事業の重要な一部の譲渡の無効の争い方", "points": [{"aspect": "あてはめ", "text": "＊なお、吸収分割などの組織再編行為の場合も、①株主総会決議取消しの訴え（831条1項）等を書いてから、②株主総会の決議がないことが吸収分割の無効原因となるかを書くこともあり得る。しかし、それは迂遠であり、実務では端的に吸収分割無効の訴えを問うのが通常である。①→②の順で書くのは、特に「株主総会決議取消しの訴えが認められるか」を個別に問われた場合である"}, {"aspect": "条文", "text": "828条・831条"}], "articles": ["828条", "831条"], "pages": [340, 341]}, {"id": "book-kigyoho-01-ch09-r037", "ch": 9, "topic": "反対「株主」「債権者」の戦い方", "points": [{"aspect": "原則", "text": "反対する「株主」の戦い方：1 総会で反対（原則3分の1の反対あれば勝てる）、2 株式買取請求（せめて経済的救済を）、3 差止め（合併等なんか、やめろ）、4 無効の訴え（そんな合併なんか、無効だ）"}, {"aspect": "原則", "text": "反対する「債権者」の戦い方：1 総会には参加できない、2 債権者異議手続き（異議をいえば、一応債権の満足あり）、3 差止めは株主でないから不可能、4 無効の訴えは「承認しなかった債権者」なら可能"}, {"aspect": "条文", "text": "785条・784条・828条・789条"}], "articles": ["785条", "784条", "828条", "789条"], "pages": [341]}, {"id": "book-kigyoho-01-ch09-r038", "ch": 9, "topic": "（参）吸収合併消滅会社等の手続の条文一覧（782条〜792条）", "points": [{"aspect": "原則", "text": "（参）第1款第1目 株式会社の手続の条文一覧：782条（吸収合併契約等に関する書面等の備置き及び閲覧等）、783条（吸収合併契約等の承認等）、784条（吸収合併契約等の承認を要しない場合）、784条の2（吸収合併等をやめることの請求）、785条（反対株主の株式買取請求）、786条（株式の価格の決定等）、787条（新株予約権買取請求）、788条（新株予約権の価格の決定等）、789条（債権者の異議）、790条（吸収合併等の効力発生日の変更）、791条（吸収分割又は株式交換に関する書面等の備置き及び閲覧等）、792条（剰余金の配当等に関する特則）"}, {"aspect": "条文", "text": "782条・792条・783条・784条・785条・786条・787条・788条・789条・790条・791条"}], "articles": ["782条", "792条", "783条", "784条", "785条", "786条", "787条", "788条", "789条", "790条", "791条"], "pages": [341]}, {"id": "book-kigyoho-01-ch09-r039", "ch": 9, "topic": "吸収合併と事業の全部譲渡の比較", "points": [{"aspect": "結論", "text": "cf. 事業譲渡は合併と異なり甲社は消滅しないので、たとえ事業の全部を譲渡したとしても甲社は消滅しない。甲社としては①対価として得た金銭などを元に新たな事業をする（定款変更して「目的」も変更）か、②あらためて解散決議をするかであろう"}, {"aspect": "条文", "text": "467条"}], "articles": ["467条"], "pages": [342]}, {"id": "book-kigyoho-01-ch09-r040", "ch": 9, "topic": "吸収分割と事業の重要な一部の譲渡の比較", "points": [{"aspect": "図表", "text": "比較図：甲社から乙社への移転は①吸収分割・②事業の重要な一部の譲渡のいずれでも生じるが、対価は①では乙株（甲社に交付）、②では金銭である"}, {"aspect": "条文", "text": "467条"}], "articles": ["467条"], "pages": [342]}, {"id": "book-kigyoho-01-ch09-r041", "ch": 9, "topic": "略式と簡易の比較表", "points": [{"aspect": "あてはめ", "text": "略式の注記：総会を開いても無駄。しかし、株主に不利益はある"}, {"aspect": "あてはめ", "text": "簡易の注記：株主の不利益は軽微。⑤無効の訴えについて、無効原因は重大な瑕疵（法令違反）であり、必ずしも株主の利益とは関係しない"}, {"aspect": "あてはめ", "text": "＊以上のように整理したが、比較を覚えようというより、論文試験ではまず何条？の意識の方が重要である"}, {"aspect": "条文", "text": "784条・785条・828条"}], "articles": ["784条", "785条", "828条"], "pages": [343]}, {"id": "book-kigyoho-01-ch09-r042", "ch": 9, "topic": "株式交付の定義と制度の趣旨", "points": [{"aspect": "趣旨", "text": "現物出資では、①原則、検査役の調査（207条）が必要であり、②財産価額填補責任（212条、213条）が生じる。そこで、「株式交付」制度が新設された"}, {"aspect": "趣旨", "text": "（3）全体の趣旨：親子会社関係を円滑に創設するため"}, {"aspect": "原則", "text": "株式交付（774条の2〜、816条の2〜）は令和元年新設。株式交付とは、株式会社が他の株式会社をその子会社とするために当該他の株式会社の株式を譲り受け、当該株式の譲渡人に対して当該株式の対価として当該株式会社の株式を交付することをいう（2条32号の2）"}, {"aspect": "あてはめ", "text": "株式交付は、いわば部分的な株式交換である"}, {"aspect": "条文", "text": "2条・774条・816条・207条・212条・213条"}], "articles": ["2条", "774条", "816条", "207条", "212条", "213条"], "pages": [344]}, {"id": "book-kigyoho-01-ch09-r043", "ch": 9, "topic": "株式交付の条文の所在（774条の2以下と816条の2以下の区別）", "points": [{"aspect": "原則", "text": "（4）条文：まずは、774条の2（ナナヨンノニ）。（参照）第一章〜第四章は手続き以外（契約、計画、効果等）を定め、第五章は組織変更、合併、会社分割、株式交換、株式移転及び株式交付の手続（775条〜）で、第四節が株式交付の手続（816条の2〜816条の10）である"}, {"aspect": "原則", "text": "株式交付に関する手続き（株主Aの譲渡の申込→乙株の割当など）は774条の2以下である。なぜ816条の2以下ではないのか→株式交付「計画」に会社が譲り受ける株式の株の下限等を記載するのである"}, {"aspect": "原則", "text": "乙社の株主総会などの手続きは816条の2以下である（株式交付は、いわば部分的な株式交換である）。甲社の手続きは不要である。甲社は株式交付の当事者ではないからである"}, {"aspect": "原則", "text": "第4章の2 株式交付の条文一覧：774条の2（株式交付計画の作成）、774条の3（株式交付計画）、774条の4（株式交付子会社の株式の譲渡しの申込み）、774条の5（株式交付親会社が譲り受ける株式交付子会社の株式の割当て）、774条の6（譲渡しの申込み及び割当てに関する特則）、774条の7（株式交付子会社の株式の譲渡し）、774条の8（株式交付子会社の株式の譲渡しの無効又は取消しの制限）、774条の9（株式交付子会社の株式の譲渡しに関する規定の準用）、774条の10（申込みがあった株式交付子会社の株式の数が下限の数に満たない場合）、774条の11（株式交付の効力の発生等）"}, {"aspect": "あてはめ", "text": "＊上記の多くは、募集株式の発行等の203条以下の規定を参考にした規定である"}, {"aspect": "条文", "text": "774条・816条・775条・203条"}], "articles": ["774条", "816条", "775条", "203条"], "pages": [344, 345]}, {"id": "book-kigyoho-01-ch09-r044", "ch": 9, "topic": "株式交付の手続（第5章第4節）と株式交付無効の訴え", "points": [{"aspect": "原則", "text": "第5章第4節 株式交付の手続の条文一覧：816条の2（株式交付計画に関する書面等の備置き及び閲覧等）、816条の3（株式交付計画の承認等）、816条の4（株式交付計画の承認を要しない場合等）、816条の5（株式交付をやめることの請求）、816条の6（反対株主の株式買取請求）、816条の7（株式の価格の決定等）、816条の8（債権者の異議）、816条の9（株式交付の効力発生日の変更）、816条の10（株式交付に関する書面等の備置き及び閲覧等）"}, {"aspect": "原則", "text": "原則、乙社の株主総会決議による承認が必要である（816条の3第1項、309条2項12号）。趣旨は、株式交付親会社の株主は、株式交付に重大な利害関係を有しているからである"}, {"aspect": "原則", "text": "例外として簡易株式交付（816条の4第1項）がある。なお、略式株式交付というものは存在しない"}, {"aspect": "原則", "text": "（5）株式交付無効の訴え（828条1項13号、2項13号）：対世効（838条）、将来効（839条）→844条の2（株式交付の無効判決の効力）"}, {"aspect": "条文", "text": "816条・309条・828条・838条・839条・844条"}], "articles": ["816条", "309条", "828条", "838条", "839条", "844条"], "pages": [346]}, {"id": "book-kigyoho-01-ch09-r045", "ch": 9, "topic": "II 組織再編（吸収合併など）の定義", "points": [{"aspect": "原則", "text": "II重要条文：組織再編（吸収合併など）の定義＝2条"}, {"aspect": "条文", "text": "2条"}], "articles": ["2条"], "pages": [347]}, {"id": "book-kigyoho-01-ch10-r001", "ch": 10, "topic": "定款変更の原則（株主総会の特別決議）", "points": [{"aspect": "原則", "text": "定款変更には、原則として株主総会の特別決議が必要である（466条、309条2項11号）"}, {"aspect": "条文", "text": "466条・309条"}], "articles": ["466条", "309条"], "pages": [348]}, {"id": "book-kigyoho-01-ch10-r002", "ch": 10, "topic": "種類株主に損害を及ぼすおそれがある場合（種類株主総会の特別決議）", "points": [{"aspect": "原則", "text": "定款変更によって、ある種類株式の種類株主に損害を及ぼすおそれがある場合は、原則、さらに当該種類株主総会の特別決議も必要（322条1項各号、324条2項4号）"}, {"aspect": "条文", "text": "322条・324条"}], "articles": ["322条", "324条"], "pages": [348]}, {"id": "book-kigyoho-01-ch11-r001", "ch": 11, "topic": "名板貸人の責任・商号使用許諾者の責任（9条）", "points": [{"aspect": "趣旨", "text": "9条の趣旨：権利外観理論を基礎として取引の安全を図るため。名板貸人が事業主体であるかのような外観を信頼して取引をした第三者を保護するため"}, {"aspect": "原則", "text": "9条（自己の商号の使用を他人に許諾した会社の責任）：①自己の商号を使用して事業又は営業を行うことを②他人に許諾した会社は、③当該会社が当該事業を行うものと誤認して当該他人と取引をした者に対し、当該他人と連帯して、当該取引によって生じた債務を弁済する責任を負う"}, {"aspect": "要件", "text": "9条の要件：①虚偽の外観、②本人の外観作出の帰責性、③相手方の信頼"}, {"aspect": "条文", "text": "9条"}], "articles": ["9条"], "pages": [350]}, {"id": "book-kigyoho-01-ch11-r002", "ch": 11, "topic": "（論点）虚偽の外観（要件①）は、同種の事業であることを要するか", "points": [{"aspect": "結論", "text": "本条の趣旨（権利外観理論を基礎として取引の安全を図る）からすると、相手方は名板貸人と名板借人の事業が同種であるからこそ名板借人の行為を名板貸人の行為と信頼するので、特段の事情がない限り、商号使用の許諾を受けた者の営業がその許諾をした者の営業と同種の営業であることを要する"}, {"aspect": "結論", "text": "最判昭43・6・13の立場である"}, {"aspect": "条文", "text": "9条"}], "articles": ["9条"], "pages": [350]}, {"id": "book-kigyoho-01-ch11-r003", "ch": 11, "topic": "（論点）「誤認」（要件③）とは？", "points": [{"aspect": "結論", "text": "「誤認」（善意）とは、善意、無重過失を意味する。重過失は悪意と同視できるからである"}, {"aspect": "条文", "text": "9条"}], "articles": ["9条"], "pages": [351]}, {"id": "book-kigyoho-01-ch11-r004", "ch": 11, "topic": "（論点）不法行為によって生じた債務も「取引によって生じた債務」か", "points": [{"aspect": "結論", "text": "事実的不法行為によって生じた債務は「取引によって生じた債務」に含まれないが、詐欺的行為によって契約を締結させられたような取引的不法行為による債務は「取引によって生じた債務」に含まれる"}, {"aspect": "結論", "text": "最判昭和52・12・23の立場である"}, {"aspect": "条文", "text": "9条"}], "articles": ["9条"], "pages": [351]}, {"id": "book-kigyoho-01-ch11-r005", "ch": 11, "topic": "スーパー・テナント関係と9条類推適用（最判平成7年11月30日参考）", "points": [{"aspect": "原則", "text": "前提知識：「商号」とは、商人が自己の営業を表示するものとして用いる名称。事業を法人登記する際に必要となる会社名義。簡単にいうと、（法律で定められた）会社等（法人）の名称"}, {"aspect": "原則", "text": "（参）「屋号」とは、個人が営業をする際の一般的名称。「商標」とは、商品・サービスを他人・他社の商品・サービスと区別するための印で、「会社や商品のロゴマーク」や「商品・サービス名」として使われるもの"}, {"aspect": "結論", "text": "解答例：甲は乙社の商号を使用していないので9条の直接適用はできない。趣旨（外観を信頼して取引をした第三者の保護）から、事業主体を誤認させるような外観が生じていた場合には類推適用すべきであり、①事業主体の誤認を生じさせるような外観の存在、②会社が①の外観を許諾したこと、③相手方が①の外観を誤認して取引したことがあれば、類推適用が認められる"}, {"aspect": "結論", "text": "解答例の結論：これらの事実は個々的にも総合しても買物客が甲の売場の営業主体が乙社でないことを外観上認識するに足りず、要件①を満たす。乙社は店舗外部に商標を表示し出店及び店舗使用に関する契約を締結することなどにより外観を作出し、又はその作出に関与していたので要件②も満たし、乙社は9条の類推適用により名板貸人と同様の責任を負う"}, {"aspect": "結論", "text": "（参）インターネットのショッピングモールの運営者と出店者、購入者との間でも同様に考えられる。神戸地裁は、オークション運営者の責任を追及した事件で、運営者が取引の相手方が出品者か運営者かを識別困難とさせるような状態（営業主体を誤認させるような外観）を作出したと認めるに足りる証拠はないとして9条責任を否定した"}, {"aspect": "あてはめ", "text": "（視点）9条の問題として、甲は乙社の「商号」を使用したわけではないので、要件①を満たさない。趣旨から類推適用。類推適用するとして重要なのは、甲に乙社との「事業主体の同一性」「事業主体を誤認させるような外観」を認めることができる事実があるかで、あてはめで丁寧に書く"}, {"aspect": "あてはめ", "text": "Xはインコの購入自体はできたので乙社に請求する「取引によって生じた債務」は存在しないのではないかという点について、Xの身体的損害はインコが原因であるので「取引によって生じた債務」といえ、「不法行為によって生じた債務」かという論点の論述は不要である"}, {"aspect": "あてはめ", "text": "まとめ：他人の「商号」の使用はないから9条の直接適用はないが、「事業主体を誤認させるような外観が生じていた場合」には趣旨から類推的適用をする。その要件の中で特に、「事業主体を誤認させるような外観」＝事業主体の同一性があると思わせる事実を丁寧に答案に書く"}, {"aspect": "条文", "text": "9条"}], "articles": ["9条"], "pages": [352, 353, 354]}, {"id": "book-kigyoho-01-ch11-r006", "ch": 11, "topic": "支配人の選任・解任機関", "points": [{"aspect": "原則", "text": "①取締役会非設置会社：取締役の決定（348条1項2項）。特定の取締役への委任は不可能（348条3項1号）"}, {"aspect": "原則", "text": "②（委員会設置会社以外の）取締役会設置会社：取締役会の専決事項（362条4項3号）"}, {"aspect": "原則", "text": "③監査等委員会設置会社：原則、取締役会の専決事項（399条の13第4項3号）"}, {"aspect": "原則", "text": "④指名委員会等設置会社：取締役会決議（416条1項1号柱書）。もっとも、執行役への委任可能（416条4項参照）"}, {"aspect": "条文", "text": "348条・362条・399条・416条"}], "articles": ["348条", "362条", "399条", "416条"], "pages": [355]}, {"id": "book-kigyoho-01-ch11-r007", "ch": 11, "topic": "支配人の代理権（11条）", "points": [{"aspect": "原則", "text": "11条（支配人の代理権）：1 支配人は、会社に代わってその事業に関する一切の裁判上又は裁判外の行為をする権限を有する。2 支配人は、他の使用人を選任し、又は解任することができる。3 支配人の代理権に加えた制限は、善意の第三者に対抗することができない"}, {"aspect": "原則", "text": "支配人の代理権は、株式会社の代表取締役・代表執行役、持分会社の社員の代表権と同じく包括性・不可制限性を表す規定である（349条4項5項、420条3項、599条4項5項）。もっとも、支配人の代理権は、本店・支店によって個別化される"}, {"aspect": "条文", "text": "11条・349条・420条・599条"}], "articles": ["11条", "349条", "420条", "599条"], "pages": [355]}, {"id": "book-kigyoho-01-ch11-r008", "ch": 11, "topic": "支配人の競業の禁止（12条）", "points": [{"aspect": "趣旨", "text": "支配人と取締役で競業禁止の範囲が異なるのは、支配人は会社と委任関係である取締役と異なり雇用関係であるので、営業主のために専心勤務すべきであるからである"}, {"aspect": "原則", "text": "12条（支配人の競業の禁止）：1 支配人は、会社の許可を受けなければ、①自ら営業を行うこと、②自己又は第三者のために会社の事業の部類に属する取引をすること、③他の会社又は商人（会社を除く）の使用人となること、④他の会社の取締役、執行役又は業務を執行する社員となることをしてはならない。2 支配人が1項2号の行為をしたときは、当該行為によって支配人又は第三者が得た利益の額は、会社に生じた損害の額と推定する"}, {"aspect": "原則", "text": "取締役の競業避止義務は、「自己又は第三者のために会社の事業の部類に属する取引をすること」のみである（356条1項1号）"}, {"aspect": "原則", "text": "12条2項は423条2項と同じ規定である"}, {"aspect": "条文", "text": "12条・356条・423条"}], "articles": ["12条", "356条", "423条"], "pages": [356]}, {"id": "book-kigyoho-01-ch11-r009", "ch": 11, "topic": "表見支配人（13条）", "points": [{"aspect": "原則", "text": "13条（表見支配人）：①会社の本店又は支店の事業の主任者であることを示す名称を②付した使用人は、当該本店又は支店の事業に関し、一切の裁判外の行為をする権限を有するものとみなす。ただし、③相手方が悪意であったときは、この限りでない"}, {"aspect": "原則", "text": "表見支配人は、表見代表取締役制度（354条）と同様に考えればよい"}, {"aspect": "条文", "text": "13条・354条"}], "articles": ["13条", "354条"], "pages": [356]}, {"id": "book-kigyoho-01-ch11-r010", "ch": 11, "topic": "支配人の登記（918条）", "points": [{"aspect": "原則", "text": "918条（支配人の登記）：会社が支配人を選任し、又はその代理権が消滅したときは、その本店の所在地において、その登記をしなければならない"}, {"aspect": "結論", "text": "918条は、「（論点）354条と908条の関係」と同様の論証のときに使う。13条（表見支配人）があっても、支配人が登記済みであれば登記後の第三者は悪意とみなされる（悪意擬制、908条1項・918条）が、それでは第三者は常に保護されず不都合なので、13条は908条1項の例外規定であり、13条が適用され908条1項は適用されない"}, {"aspect": "条文", "text": "918条・908条・13条・354条"}], "articles": ["918条", "908条", "13条", "354条"], "pages": [357]}], "articles": [{"id": "book-kigyoho-01-art2-no9", "article": "2条9号", "chs": [2], "topics": ["監査役設置会社の定義（2条9号）と監査役会（390条〜）"], "points": [{"aspect": "要件", "text": "2条9号（監査役設置会社）：監査役を置く株式会社（その監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがあるものを除く。）又はこの法律の規定により監査役を置かなければならない株式会社をいう"}]}, {"id": "book-kigyoho-01-art2-no16", "article": "2条16号", "chs": [2], "topics": ["監査役設置会社の定義（2条9号）と監査役会（390条〜）"], "points": [{"aspect": "制度名", "text": "社外監査役の定義"}, {"aspect": "要件", "text": "社外監査役（2条16号）。レジュメでは見出しのみで内容の説明はない"}]}, {"id": "book-kigyoho-01-art2-no26", "article": "2条26号", "chs": [9], "topics": ["組織変更の定義（2条26号）"], "points": [{"aspect": "定義", "text": "組織変更（2条26号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}]}, {"id": "book-kigyoho-01-art2-no27", "article": "2条27号", "chs": [9], "topics": ["合併の定義（2条27号・28号）"], "points": [{"aspect": "定義", "text": "吸収合併（2条27号）・新設合併（2条28号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}]}, {"id": "book-kigyoho-01-art2-no29", "article": "2条29号", "chs": [9], "topics": ["会社分割の定義（2条29号・30号）"], "points": [{"aspect": "定義", "text": "吸収分割（2条29号）・新設分割（2条30号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}]}, {"id": "book-kigyoho-01-art2-no31", "article": "2条31号", "chs": [9], "topics": ["株式交換・株式移転の定義（2条31号・32号）"], "points": [{"aspect": "定義", "text": "株式交換（2条31号）・株式移転（2条32号）の定義は、レジュメでは「……」とされ条文番号のみが示されている"}]}, {"id": "book-kigyoho-01-art2-no32-2", "article": "2条32号の2", "chs": [9], "topics": ["株式交付の定義（2条32号の2）"], "points": [{"aspect": "定義", "text": "株式交付とは、株式会社が他の株式会社をその子会社とするために当該他の株式会社の株式を譲り受け、当該株式の譲渡人に対して当該株式の対価として当該株式会社の株式を交付することをいう（2条32号の2）"}]}, {"id": "book-kigyoho-01-art9", "article": "9条", "chs": [11], "topics": ["名板貸人の責任・商号使用許諾者の責任（9条）", "（論点）虚偽の外観（要件①）は、同種の事業であることを要するか", "（論点）「誤認」（要件③）とは？", "（論点）不法行為によって生じた債務も「取引によって生じた債務」か", "スーパー・テナント関係と9条類推適用（最判平成7年11月30日参考）"], "points": [{"aspect": "趣旨", "text": "9条の趣旨：権利外観理論を基礎として取引の安全を図るため。名板貸人が事業主体であるかのような外観を信頼して取引をした第三者を保護するため"}, {"aspect": "定義", "text": "前提知識：「商号」とは、商人が自己の営業を表示するものとして用いる名称。事業を法人登記する際に必要となる会社名義。簡単にいうと、（法律で定められた）会社等（法人）の名称"}, {"aspect": "要件", "text": "9条（自己の商号の使用を他人に許諾した会社の責任）：①自己の商号を使用して事業又は営業を行うことを②他人に許諾した会社は、③当該会社が当該事業を行うものと誤認して当該他人と取引をした者に対し、当該他人と連帯して、当該取引によって生じた債務を弁済する責任を負う"}, {"aspect": "要件", "text": "9条の要件：①虚偽の外観、②本人の外観作出の帰責性、③相手方の信頼"}, {"aspect": "結論", "text": "本条の趣旨（権利外観理論を基礎として取引の安全を図る）からすると、相手方は名板貸人と名板借人の事業が同種であるからこそ名板借人の行為を名板貸人の行為と信頼するので、特段の事情がない限り、商号使用の許諾を受けた者の営業がその許諾をした者の営業と同種の営業であることを要する"}, {"aspect": "結論", "text": "「誤認」（善意）とは、善意、無重過失を意味する。重過失は悪意と同視できるからである"}, {"aspect": "結論", "text": "事実的不法行為によって生じた債務は「取引によって生じた債務」に含まれないが、詐欺的行為によって契約を締結させられたような取引的不法行為による債務は「取引によって生じた債務」に含まれる"}, {"aspect": "結論", "text": "解答例：甲は乙社の商号を使用していないので9条の直接適用はできない。趣旨（外観を信頼して取引をした第三者の保護）から、事業主体を誤認させるような外観が生じていた場合には類推適用すべきであり、①事業主体の誤認を生じさせるような外観の存在、②会社が①の外観を許諾したこと、③相手方が①の外観を誤認して取引したことがあれば、類推適用が認められる"}]}, {"id": "book-kigyoho-01-art11", "article": "11条", "chs": [11], "topics": ["支配人の代理権（11条）"], "points": [{"aspect": "要件", "text": "11条（支配人の代理権）：1 支配人は、会社に代わってその事業に関する一切の裁判上又は裁判外の行為をする権限を有する。2 支配人は、他の使用人を選任し、又は解任することができる。3 支配人の代理権に加えた制限は、善意の第三者に対抗することができない"}, {"aspect": "比較", "text": "支配人の代理権は、株式会社の代表取締役・代表執行役、持分会社の社員の代表権と同じく包括性・不可制限性を表す規定である（349条4項5項、420条3項、599条4項5項）。もっとも、支配人の代理権は、本店・支店によって個別化される"}]}, {"id": "book-kigyoho-01-art12", "article": "12条", "chs": [11], "topics": ["支配人の競業の禁止（12条）"], "points": [{"aspect": "趣旨", "text": "支配人と取締役で競業禁止の範囲が異なるのは、支配人は会社と委任関係である取締役と異なり雇用関係であるので、営業主のために専心勤務すべきであるからである"}, {"aspect": "要件", "text": "12条（支配人の競業の禁止）：1 支配人は、会社の許可を受けなければ、①自ら営業を行うこと、②自己又は第三者のために会社の事業の部類に属する取引をすること、③他の会社又は商人（会社を除く）の使用人となること、④他の会社の取締役、執行役又は業務を執行する社員となることをしてはならない。2 支配人が1項2号の行為をしたときは、当該行為によって支配人又は第三者が得た利益の額は、会社に生じた損害の額と推定する"}, {"aspect": "比較", "text": "取締役の競業避止義務は、「自己又は第三者のために会社の事業の部類に属する取引をすること」のみである（356条1項1号）"}]}, {"id": "book-kigyoho-01-art13", "article": "13条", "chs": [11], "topics": ["表見支配人（13条）"], "points": [{"aspect": "要件", "text": "13条（表見支配人）：①会社の本店又は支店の事業の主任者であることを示す名称を②付した使用人は、当該本店又は支店の事業に関し、一切の裁判外の行為をする権限を有するものとみなす。ただし、③相手方が悪意であったときは、この限りでない"}, {"aspect": "比較", "text": "表見支配人は、表見代表取締役制度（354条）と同様に考えればよい"}]}, {"id": "book-kigyoho-01-art21", "article": "21条", "chs": [2, 8], "topics": ["（論点）467条1項1号2号（3号）の事業譲渡の意義（定義）", "競業避止義務（21条）", "関与取締役等の支払義務（120条4項）と会社法施行規則21条"], "points": [{"aspect": "趣旨", "text": "（趣旨）事業譲渡の実効性を確保するためである"}, {"aspect": "要件", "text": "21条1項（譲渡会社の競業の禁止）：事業を譲渡した会社は、当事者の別段の意思表示がない限り、同一の市町村及びこれに隣接する市町村の区域内においては、その事業を譲渡した日から二十年間は、同一の事業を行ってはならない"}, {"aspect": "要件", "text": "21条2項：譲渡会社が同一の事業を行わない旨の特約をした場合には、その特約は、その事業を譲渡した日から三十年の期間内に限り、その効力を有する"}, {"aspect": "要件", "text": "21条3項：前二項の規定にかかわらず、譲渡会社は、不正の競争の目的をもって同一の事業を行ってはならない"}, {"aspect": "結論", "text": "しかし、事業譲渡にあたるかの判断の際に、③のあてはめまで検討したうえで③も満たすから事業譲渡にあたるとする裁判例があることから、試験的にはやはり③も事業譲渡の意義の考慮要素と考えるべきであろう"}, {"aspect": "判例", "text": "問題の所在と同義性：467条1項1号2号の事業譲渡の意味が問題となる。法解釈の統一性の観点から21条から24条にいう事業譲渡と同義であり、また、事業活動の承継と競業避止義務の負担という明確な基準で、株主総会特別決議の要否を明確にして、取引の相手方を保護する必要がある"}, {"aspect": "判例", "text": "判例の定義：①一定の事業目的のために組織化された有機的的一体として機能する財産の（全部または重要な一部の）譲渡であって、②必ず事業活動の承継を伴うものであり、③譲渡会社が21条の競業避止義務を負う結果を伴うものをいう（最判昭和40・9・22の立場）"}, {"aspect": "学説", "text": "③は事業譲渡の効果にすぎず、事業譲渡の意義は①②にすぎないと判例を評価する見解もある"}]}, {"id": "book-kigyoho-01-art22", "article": "22条", "chs": [8], "topics": ["譲渡会社の商号を使用した譲受会社の責任等（22条）", "22条1項・4項の趣旨と「事業主体について誤認」", "（論点）事業名を続用した事業譲渡の譲受人の22条1項責任", "（論点）事業名を続用した「会社分割」の新設（承継）会社の22条1項責任"], "points": [{"aspect": "趣旨", "text": "（22条1項の趣旨）商号が続用された場合、債権者は事業主体について誤認することがあるから、この債権者の誤認を救済するためである"}, {"aspect": "趣旨", "text": "（22条4項の趣旨）商号が続用された場合、債務者は事業主体について誤認することがあるから、この債務者の誤認を救済するためである"}, {"aspect": "定義", "text": "＜前提知識＞「商号」とは、商人が自己の営業を表示するものとして用いる名称。事業を法人登記する際に必要となる会社名義。簡単にいうと、（法律で定められた）会社等（法人）の名称。本問では、「商号の続用」ない。原則→修正・例外で書けばいい"}, {"aspect": "要件", "text": "22条1項：事業を譲り受けた会社が譲渡会社の商号を引き続き使用する場合には、その譲受会社も、譲渡会社の事業によって生じた債務を弁済する責任を負う"}, {"aspect": "要件", "text": "22条2項：前項の規定は、事業を譲り受けた後、遅滞なく、譲受会社がその本店の所在地において譲渡会社の債務を弁済する責任を負わない旨を登記した場合には、適用しない。事業を譲り受けた後、遅滞なく、譲受会社及び譲渡会社から第三者に対しその旨の通知をした場合において、その通知を受けた第三者についても、同様とする"}, {"aspect": "要件", "text": "22条3項：譲受会社が第一項の規定により譲渡会社の債務を弁済する責任を負う場合には、譲渡会社の責任は、事業を譲渡した日後二年以内に請求又は請求の予告をしない債権者に対しては、その期間を経過した時に消滅する"}, {"aspect": "要件", "text": "22条4項：第一項に規定する場合において、譲渡会社の事業によって生じた債権について、譲受会社にした弁済は、弁済者が善意でかつ重大な過失がないときは、その効力を有する"}, {"aspect": "結論", "text": "[解答例]あてはめ・結論：本問において、ゴルフ場の経営においてゴルフ倶楽部の名称は事業主体を表示するものとして用いられることが多い。丙は「乙ゴルフ倶楽部」という事業名を引き続き使用してゴルフクラブの経営を行ったのであるから、債権者丁は同一事業主体による事業が継続していると誤認したといえ、22条1項を類推適用はできる。したがって、丁は丙に預託金3000万円の返還請求をすることができる"}]}, {"id": "book-kigyoho-01-art23", "article": "23条", "chs": [8], "topics": ["譲受会社による債務の引受け（23条）", "詐害事業譲渡における残存債権者保護（23条の2）"], "points": [{"aspect": "趣旨", "text": "（23条1項の趣旨）債務引受けの公告をした以上、弁済請求を否定することは禁反言の法理に反するからである"}, {"aspect": "要件", "text": "23条1項：譲受会社が譲渡会社の商号を引き続き使用しない場合においても、譲渡会社の事業によって生じた債務を引き受ける旨の広告をしたときは、譲渡会社の債権者は、その譲受会社に対して弁済の請求をすることができる"}, {"aspect": "要件", "text": "23条2項：譲受会社が前項の規定により譲渡会社の債務を弁済する責任を負う場合には、譲渡会社の責任は、同項の広告があった日後二年以内に請求又は請求の予告をしない債権者に対しては、その期間を経過した時に消滅する"}, {"aspect": "要件", "text": "レジュメの「（要件）①②（効果）」欄は、番号と見出しのみで内容の記載がない（原文ママ）"}]}, {"id": "book-kigyoho-01-art23-2", "article": "23条の2", "chs": [8], "topics": ["詐害事業譲渡における残存債権者保護（23条の2）"], "points": [{"aspect": "要件", "text": "23条の2第1項（詐害事業譲渡に係る譲受会社に対する債務の履行の請求）：譲渡会社が譲受会社に承継されない債務の債権者（残存債権者）を害することを知って事業を譲渡した場合には、残存債権者は、その譲受会社に対して、承継した財産の価額を限度として、当該債務の履行を請求することができる。ただし、その譲受会社が事業の譲渡の効力が生じた時において残存債権者を害することを知らなかったときは、この限りでない"}, {"aspect": "要件", "text": "23条の2第2項：譲受会社が前項の規定により同項の債務を履行する責任を負う場合には、当該責任は、譲渡会社が残存債権者を害することを知って事業を譲渡したことを知った時から二年以内に請求又は請求の予告をしない残存債権者に対しては、その期間を経過した時に消滅する。事業の譲渡の効力が生じた日から十年を経過したときも、同様とする"}, {"aspect": "要件", "text": "23条の2第3項：譲渡会社について破産手続開始の決定、再生手続開始の決定又は更生手続開始の決定があったときは、残存債権者は、譲受会社に対して第一項の規定による請求をする権利を行使することができない"}, {"aspect": "要件", "text": "レジュメの「（要件）①②（効果）」欄は、番号と見出しのみで内容の記載がない（原文ママ）"}]}, {"id": "book-kigyoho-01-art25", "article": "25条", "chs": [4], "topics": ["設立無効の訴えの要件"], "points": [{"aspect": "要件", "text": "設立の無効原因（重大な法令定款違反）の例：①発起人が設立時発行株式を1株も引き受けない場合（25条2項違反）、②定款の絶対的記載事項を欠く場合（27条違反）、③設立に際して出資される財産の価額が27条4号に定める最低財産を下回る場合（27条4号違反）"}]}, {"id": "book-kigyoho-01-art27", "article": "27条", "chs": [4], "topics": ["教材問題2・問題3（株主の権利行使・設立無効）", "設立無効の訴えの要件", "定款の作成・公証人の認証と絶対的記載事項"], "points": [{"aspect": "要件", "text": "例外的に設立の無効原因となる場合：①仮装出資（払込・給付）によって発行された株式数を除くと、発起人が設立時発行株式を1株も引き受けない場合（25条2項違反）、②出資財産の価額が27条4号に定める最低財産を下回る場合（27条4号違反）は、設立の無効原因となり、設立無効の訴えが認められる"}, {"aspect": "要件", "text": "設立の無効原因（重大な法令定款違反）の例：①発起人が設立時発行株式を1株も引き受けない場合（25条2項違反）、②定款の絶対的記載事項を欠く場合（27条違反）、③設立に際して出資される財産の価額が27条4号に定める最低財産を下回る場合（27条4号違反）"}, {"aspect": "要件", "text": "定款の絶対的記載・記録事項（27条・37条）。記載・記録なければ定款自体が無効になる"}]}, {"id": "book-kigyoho-01-art28", "article": "28条", "chs": [4], "topics": ["変態設立事項の定義等（28条・33条）", "現物出資（28条1号）", "財産引受け（28条2号）", "発起人の報酬・特別利益（28条3号）", "設立費用（28条4号）"], "points": [{"aspect": "趣旨", "text": "現物出資規制の趣旨：目的財産の過大な評価による不当な株式付与により、会社の財産的基礎を害するとともに、金銭出資者を害するから"}, {"aspect": "趣旨", "text": "財産引受け規制の趣旨：目的財産の過大な評価による不当な対価支払いにより会社の財産的基礎を害され、また、現物出資規制の潜脱手段として利用されるおそれがあるから"}, {"aspect": "趣旨", "text": "発起人の報酬・特別利益規制の趣旨：発起人が多額の報酬や特別利益を自由に決定できるとすると、会社の財産的基礎を害するから"}, {"aspect": "趣旨", "text": "設立費用規制の趣旨：発起人の濫費・過大な見積もりにより会社の財産的基礎を害するので"}, {"aspect": "定義", "text": "変態設立事項とくれば、①28条、②33条"}, {"aspect": "定義", "text": "変態設立事項とは28条各号に掲げる事項。具体的には①現物出資（28条1号）②財産引受（同条2号）③発起人の報酬・特別利益（同条3号）④設立費用（同条4号）の4つ。定款に記載し、又は記録しなければ、その効力を生じない（28条柱書）"}, {"aspect": "定義", "text": "現物出資とは、金銭以外の財産をもってする出資（28条1号）"}, {"aspect": "定義", "text": "財産引受けとは、「株式会社の成立後に譲り受けることを約した財産」（28条2号）"}]}, {"id": "book-kigyoho-01-art33", "article": "33条", "chs": [4], "topics": ["変態設立事項の定義等（28条・33条）", "変態設立事項の規制（3プラス2）"], "points": [{"aspect": "定義", "text": "変態設立事項とくれば、①28条、②33条"}, {"aspect": "定義", "text": "変態設立事項とは28条各号に掲げる事項。具体的には①現物出資（28条1号）②財産引受（同条2号）③発起人の報酬・特別利益（同条3号）④設立費用（同条4号）の4つ。定款に記載し、又は記録しなければ、その効力を生じない（28条柱書）"}, {"aspect": "要件", "text": "規制の「3」：ア 定款への記載・記録（28条柱書）、イ 検査役の調査（例外あり）（33条）、ウ 不当なら変更を（33条7項、96条）"}, {"aspect": "要件", "text": "33条10項各号の例外は、現物出資・財産引受についてのみの例外である"}, {"aspect": "要件", "text": "33条10項1号・少額財産（500万円）の特例：瑕疵（キズ）の程度は軽微であり、事後的に不足額塡補責任（52条、103条1項）で補えるので、特例（例外）を認めた"}, {"aspect": "要件", "text": "33条10項2号は市場価格のある有価証券の特例、3号は専門家証明のある場合の特例"}]}, {"id": "book-kigyoho-01-art34", "article": "34条", "chs": [4], "topics": ["全額払込み・全部給付（34条、63条）"], "points": [{"aspect": "要件", "text": "全額払込み・全部給付（34条、63条）。34条1項と63条1項の比較から、現物出資を行えるのは（会社設立時に）発起人に限ることがわかる"}]}, {"id": "book-kigyoho-01-art35", "article": "35条", "chs": [3], "topics": ["権利株の譲渡制限（35条・50条2項・63条2項・208条4項）"], "points": [{"aspect": "制度名", "text": "権利株の譲渡制限"}, {"aspect": "趣旨", "text": "趣旨は、設立手続または募集株式発行手続の混乱防止（会社の利益保護）である"}, {"aspect": "要件", "text": "株主となる権利の譲渡は、成立後の株式会社に対抗することができない（35条、50条2項、63条2項、208条4項）"}, {"aspect": "要件", "text": "各条文の対象：35条は出資の履行前の発起人、50条2項は出資の履行後の発起人、63条2項は設立時募集株式の引受人、208条4項は募集株式の引受人について定める"}]}, {"id": "book-kigyoho-01-art37", "article": "37条", "chs": [4], "topics": ["定款の作成・公証人の認証と絶対的記載事項"], "points": [{"aspect": "要件", "text": "定款の絶対的記載・記録事項（27条・37条）。記載・記録なければ定款自体が無効になる"}]}, {"id": "book-kigyoho-01-art46", "article": "46条", "chs": [4], "topics": ["設立時取締役等による調査（46条、93条）"], "points": [{"aspect": "要件", "text": "＜その他の手続き＞として、設立時取締役等による調査（46条、93条）が掲げられる（見出しのみで、本文に内容説明はない）"}]}, {"id": "book-kigyoho-01-art47", "article": "47条", "chs": [2], "topics": [], "points": [{"aspect": "制度名", "text": "代表取締役 ― 47条1項（第3かっこ書）"}]}, {"id": "book-kigyoho-01-art49", "article": "49条", "chs": [4], "topics": ["会社設立手続の概要（4つの実体形成と設立登記・設立方法）"], "points": [{"aspect": "要件", "text": "設立手続の全体像：①定款の作成②社員の確定③出資の確定（会社財産の形成）④機関の具備の4つの実体形成に、設立登記（49条）が加わり、団体は法人格を取得して会社として成立する"}]}, {"id": "book-kigyoho-01-art50", "article": "50条", "chs": [3], "topics": ["権利株の譲渡制限（35条・50条2項・63条2項・208条4項）"], "points": [{"aspect": "制度名", "text": "権利株の譲渡制限"}, {"aspect": "趣旨", "text": "趣旨は、設立手続または募集株式発行手続の混乱防止（会社の利益保護）である"}, {"aspect": "要件", "text": "株主となる権利の譲渡は、成立後の株式会社に対抗することができない（35条、50条2項、63条2項、208条4項）"}, {"aspect": "要件", "text": "各条文の対象：35条は出資の履行前の発起人、50条2項は出資の履行後の発起人、63条2項は設立時募集株式の引受人、208条4項は募集株式の引受人について定める"}]}, {"id": "book-kigyoho-01-art52", "article": "52条", "chs": [4], "topics": ["設立に関する責任の全体像（52条〜56条・102条の2・103条）", "不足額塡補責任（52条、103条1項）"], "points": [{"aspect": "制度名", "text": "発起人等による不足額塡補責任"}, {"aspect": "趣旨", "text": "Bが無過失責任を負う趣旨：会社の犠牲において、現物出資者等に利得させるべきでないから"}, {"aspect": "趣旨", "text": "募集設立の場合に無過失責任とする趣旨：現物出資財産等について十分な調査の機会のない株式引受人を保護するため"}, {"aspect": "要件", "text": "設立に関する責任の一覧：52条は不足額填補責任、52条の2は仮装払込（出資）の場合の責任等、53条は損害賠償責任、54条は連帯責任、55条は責任の免除、56条は株式会社不成立の場合の責任（cf.57条〜）。募集設立については102条の2（払込みを仮装した設立時募集株式の引受人の責任）、103条（発起人の責任等）"}, {"aspect": "要件", "text": "不足額塡補責任の要件：定款に記載・記録された価額に「著しく不足するとき」"}, {"aspect": "要件", "text": "現物出資者等であるBは常に責任を負う。過失なくても責任を負う無過失責任である（52条2項柱書かっこ書、2号）"}, {"aspect": "要件", "text": "他の発起人Aは、①検査役の調査を経た場合、②過失がないことを証明した場合は不足額塡補責任を負わず、それ以外は負う（原則：過失責任）"}, {"aspect": "要件", "text": "Aの過失責任の例外：募集設立の場合は無過失責任（103条1項、52条2項2号）"}, {"aspect": "要件", "text": "専門家証明をした弁護士等（52条3項）は過失責任である"}]}, {"id": "book-kigyoho-01-art52-2", "article": "52条の2", "chs": [4], "topics": ["出資の履行の仮装（払込みの仮装・給付の仮装）", "教材問題1・問題1’（仮装払込の金銭の全額支払請求・現物出資の仮装）"], "points": [{"aspect": "趣旨", "text": "Aが株主の権利を行使できる趣旨：会社財産が充実した以上、仮装払込をした発起人・引受人の権利行使を否定する理由はないから"}, {"aspect": "趣旨", "text": "Bが株主の権利を行使できる趣旨：株式取引の安全を図るため"}, {"aspect": "趣旨", "text": "Aの支払・給付義務、X・Yの支払い義務の趣旨①：出資の履行が仮装された場合、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）"}, {"aspect": "趣旨", "text": "趣旨②：会社の資金が確保されたと信じた会社債権者の保護の必要性。会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加える。もっとも、55条が総株主の同意で52条の2第1項2項の義務の免除を認めていることからすると、②は不要かとの指摘がある"}, {"aspect": "要件", "text": "Aの支払・給付義務（52条の2第1項、102条の2第1項）は無過失責任である（発起設立・募集設立を問わず、Aが発起人の場合は52条の2第1項、Aが引受人の場合は102条の2第1項）"}, {"aspect": "要件", "text": "仮装に関与したX・Yの支払義務（52条の2第2項第3項、103条2項、会社法施行規則7条の2、18条の2）は過失責任である"}, {"aspect": "要件", "text": "条文の対応：52条の2は出資の履行を仮装した場合の責任等、102条の2は払込みを仮装した設立時募集株式の引受人の責任、103条は発起人の責任等、102条は設立手続等の特則（cf.57条以下）"}, {"aspect": "要件", "text": "Aは支払・給付義務を果たせば「株主の権利を行使すること」ができる（52条の2第4項、102条3項）"}]}, {"id": "book-kigyoho-01-art53", "article": "53条", "chs": [4], "topics": ["発起人等の任務懈怠責任（53条）・連帯責任（54条）・責任の免除（55条）"], "points": [{"aspect": "要件", "text": "発起人等の任務懈怠責任（53条）：1項は会社に対する責任（cf.423条1項と同様の責任）、2項は第三者に対する責任（cf.429条1項と同様の責任）"}]}, {"id": "book-kigyoho-01-art54", "article": "54条", "chs": [4], "topics": ["発起人等の任務懈怠責任（53条）・連帯責任（54条）・責任の免除（55条）", "設立に関する責任の全体像（52条〜56条・102条の2・103条）"], "points": [{"aspect": "要件", "text": "54条の発起人等の連帯責任は、53条1項2項責任にかかる"}, {"aspect": "要件", "text": "設立に関する責任の一覧：52条は不足額填補責任、52条の2は仮装払込（出資）の場合の責任等、53条は損害賠償責任、54条は連帯責任、55条は責任の免除、56条は株式会社不成立の場合の責任（cf.57条〜）。募集設立については102条の2（払込みを仮装した設立時募集株式の引受人の責任）、103条（発起人の責任等）"}, {"aspect": "要件", "text": "発起人等の任務懈怠責任（53条）：1項は会社に対する責任（cf.423条1項と同様の責任）、2項は第三者に対する責任（cf.429条1項と同様の責任）"}]}, {"id": "book-kigyoho-01-art55", "article": "55条", "chs": [4], "topics": ["発起人等の任務懈怠責任（53条）・連帯責任（54条）・責任の免除（55条）", "出資の履行の仮装（払込みの仮装・給付の仮装）"], "points": [{"aspect": "趣旨", "text": "Bが株主の権利を行使できる趣旨：株式取引の安全を図るため"}, {"aspect": "趣旨", "text": "Aの支払・給付義務、X・Yの支払い義務の趣旨①：出資の履行が仮装された場合、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）"}, {"aspect": "趣旨", "text": "趣旨②：会社の資金が確保されたと信じた会社 ": [4], "topics": ["出資の履行の仮装（払込みの仮装・給付の仮装）", "設立に関する責任の全体像（52条〜56条・102条の2・103条）"], "points": [{"aspect": "趣旨", "text": "Bが株主の権利を行使できる趣旨：株式取引の安全を図るため"}, {"aspect": "趣旨", "text": "Aの支払・給付義務、X・Yの支払い義務の趣旨①：出資の履行が仮装された場合、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）"}, {"aspect": "要件", "text": "Aは支払・給付義務を果たせば「株主の権利を行使すること」ができる（52条の2第4項、102条3項）"}, {"aspect": "要件", "text": "甲株の譲受人Bは、悪意・重過失でなければ「株主の権利を行使すること」ができる（52条の2第5項、102条4項）"}, {"aspect": "要件", "text": "設立に関する責任の一覧：52条は不足額填補責任、52条の2は仮装払込（出資）の場合の責任等、53条は損害賠償責任、54条は連帯責任、55条は責任の免除、56条は株式会社不成立の場合の責任（cf.57条〜）。募集設立については102条の2（払込みを仮装した設立時募集株式の引受人の責任）、103条（発起人の責任等）"}, {"aspect": "結論", "text": "（論点）要件の「払込みを仮装した場合」「給付を仮装した場合」とは（短文用）：払込みした資金が会社資金として運用できたとはいえない場合には（払込みによっても会社の営業資金は何ら確保されていないといえる場合には）、払込みを仮装した場合にあたると解する"}, {"aspect": "比較", "text": "（参考）出資額100万円の場合の3類型：1 払込がなされなかった（0円）場合は株主となる権利の喪失（失権。36条3項（発起人の場合）、63条3項（引受人は当然失権））。2 払込がなされたが仮装（実際0円）の場合は支払義務が生じ株主の権利行使が可能（52条の2、102条、102条の2、103条）で、これらの規定は36条3項・63条3項の例外規定となり失権しない。3 60万円の払込の場合は争いがあり（40万円分は株主となる権利の喪失か、すべての株主となる権利の喪失か）、試験には出題されないだろう"}]}, {"id": "book-kigyoho-01-art102-2", "article": "102条の2", "chs": [4], "topics": ["設立に関する責任の全体像（52条〜56条・102条の2・103条）", "出資の履行の仮装（払込みの仮装・給付の仮装）"], "points": [{"aspect": "趣旨", "text": "Aが株主の権利を行使できる趣旨：会社財産が充実した以上、仮装払込をした発起人・引受人の権利行使を否定する理由はないから"}, {"aspect": "趣旨", "text": "Bが株主の権利を行使できる趣旨：株式取引の安全を図るため"}, {"aspect": "趣旨", "text": "Aの支払・給付義務、X・Yの支払い義務の趣旨①：出資の履行が仮装された場合、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）"}, {"aspect": "要件", "text": "設立に関する責任の一覧：52条は不足額填補責任、52条の2は仮装払込（出資）の場合の責任等、53条は損害賠償責任、54条は連帯責任、55条は責任の免除、56条は株式会社不成立の場合の責任（cf.57条〜）。募集設立については102条の2（払込みを仮装した設立時募集株式の引受人の責任）、103条（発起人の責任等）"}, {"aspect": "要件", "text": "Aの支払・給付義務（52条の2第1項、102条の2第1項）は無過失責任である（発起設立・募集設立を問わず、Aが発起人の場合は52条の2第1項、Aが引受人の場合は102条の2第1項）"}, {"aspect": "結論", "text": "（論点）要件の「払込みを仮装した場合」「給付を仮装した場合」とは（短文用）：払込みした資金が会社資金として運用できたとはいえない場合には（払込みによっても会社の営業資金は何ら確保されていないといえる場合には）、払込みを仮装した場合にあたると解する"}, {"aspect":
