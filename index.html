kigyoho-01-ch05-q5013", "ch": 5, "type": "何条", "q": "募集株式の発行等が法令・定款に違反し、または著しく不公正な方法により行われ、株主が不利益を受けるおそれがあるとき、株主が会社に対してその発行をやめることを請求できる（募集株式の発行の差止請求）のは、会社法何条の定めか。", "a": "210条である。", "reason": "Ⅱ重要条文の「募集株式の差止請求―210条」に基づく。差止事由の内容はt013（著しく不公正な方法）・t019（210条と828条の比較）の要素に依拠する。", "basis": "会社法207条・210条。PDF p.271（本編 p.268）", "caution": "", "articles": [], "page": 271, "loc": "Ⅱ 重要条文（暗記すべき条文）ー資金調達ー"}, {"id": "book-kigyoho-01-ch05-q5014", "ch": 5, "type": "何条", "q": "募集株式の引受人が、取締役と通じて著しく不公正な払込金額で引き受けた場合や、現物出資財産の価額が著しく不足する場合に、その引受人の責任を定めるのは会社法何条か。", "a": "212条（1項）である。", "reason": "責任の発生場面（1項1号・2号）の内容から条番号を識別する問題。", "basis": "会社法212条。PDF p.240（本編 p.237）", "caution": "", "articles": [], "page": 240, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5015", "ch": 5, "type": "何条", "q": "「募集株式の引受人は、208条1項の規定による払込みを仮装した場合には、払込みを仮装した払込金額の全額の支払をする義務を負う。」これは会社法何条の定めか。", "a": "213条の2第1項である。", "reason": "条文の文言から条番号を識別する問題。", "basis": "会社法213条の2第1項。PDF p.245（本編 p.242）", "caution": "", "articles": [], "page": 245, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5016", "ch": 5, "type": "何条", "q": "募集新株予約権の発行が法令・定款に違反し、または著しく不公正な方法により行われ、株主が不利益を受けるおそれがあるとき、株主が会社に対してその発行をやめることを請求できる（差止請求）のは、会社法何条の定めか。", "a": "247条である。", "reason": "条文の文言（247条全文の引用）から条番号を識別する問題。247条は募集株式の発行の差止めの規定（210条）と同じ規定である（t034-e03）。", "basis": "会社法247条。PDF p.263（本編 p.260）", "caution": "", "articles": [], "page": 263, "loc": "項目2 新株予約権の発行・払込等（1）総論"}, {"id": "book-kigyoho-01-ch05-q5017", "ch": 5, "type": "規定→趣旨", "q": "公開会社では、募集株式の発行（募集事項の決定）は原則として取締役会の決議によるものとされる（201条1項、199条2項）。このように公開会社の発行決定を取締役会に委ねる趣旨は何か。", "a": "迅速な資金調達を行えるようにするためである。公開会社の株主は通常、議決権比率に強い関心がないことも背景にある。", "reason": "レジュメは（参）として「公開会社の募集株式の発行決定 原則：取締役会（201条1項、199条2項）（趣旨）迅速な資金調達を行えるように」と明示している。", "basis": "PDF p.238（本編 p.235）。台帳要素 t003-e03（（参）公開会社の募集株式の発行決定は原則として取締役会（201条1項、199条2項）。趣旨は迅速な資金調達を行えるようにするため（公開会社の株主は通常議決権比率…）の逐語引用に基づく。", "caution": "", "articles": ["201条1項"], "page": 238, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5018", "ch": 5, "type": "何条", "q": "上場会社が、取締役の職務執行の対価として株式報酬の募集株式を発行する場合に、その募集事項について定めるのは、会社法何条か。", "a": "会社法202条の2第1項である。", "reason": "レジュメは「202条の2第1項［上場会社が株式報酬として募集株式を発行する場合の募集事項］」と示している。", "basis": "PDF p.238（本編 p.235）。台帳要素 t004-e01（202条の2第1項は、上場会社が株式報酬として募集株式を発行する場合の募集事項を定める）の逐語引用に基づく。", "caution": "", "articles": ["202条の2第1項"], "page": 238, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5019", "ch": 5, "type": "何条", "q": "募集株式の発行手続における「申込み」と「割当て」を定めるのは、それぞれ会社法何条か。", "a": "申込みは会社法203条、割当ては会社法204条である。", "reason": "レジュメは「203条［募集株式の申込み］204条［募集株式の割当て］」と示している。", "basis": "PDF p.239（本編 p.236）。台帳要素 t005-e01（203条［募集株式の申込み］、204条［募集株式の割当て］。204条2項：募集株式が譲渡制限株式ならば、割当ての決定は株主総会の特別決議（cf. 309条2項5…）の逐語引用に基づく。", "caution": "", "articles": ["203条", "204条"], "page": 239, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5020", "ch": 5, "type": "何条", "q": "募集株式について総数引受契約が締結された場合には、申込み（203条）・割当て（204条）の規定は適用されない。この総数引受けの場合の特則を定めるのは、会社法何条か。", "a": "会社法205条である。", "reason": "レジュメは「205条［特則］総数引受けの場合、前2条適用しない」と示している。", "basis": "PDF p.239（本編 p.236）。台帳要素 t005-e02（205条［特則］：総数引受けの場合、前2条（203条・204条）を適用しない。206条［募集株式の引受け］）の逐語引用に基づく。", "caution": "", "articles": ["205条"], "page": 239, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5021", "ch": 5, "type": "条文構造", "q": "会社法208条（募集株式の出資の履行）は、どのような構造の条文か。各項がそれぞれ何を定めているか述べよ。", "a": "1項が金銭の全額払込みを、2項が金銭以外の財産の全部給付を、3項が相殺の禁止を、4項が募集株式の株主となる権利（権利株）の譲渡は会社に対抗できないことを、5項が出資を履行しない場合は株主となる権利を失うこと（当然失権）を定める構造である。", "reason": "レジュメは208条について「1項：全額払込、2項：全部給付、3項：相殺禁止、4項：募集株式の株主となる権利（権利株）の譲渡は、会社に対抗できない、5項：出資を履行しない場合→株主となる権利を失う（当然失権）」と項ごとに整理している。", "basis": "PDF p.239（本編 p.236）。台帳要素 t006-e02（208条［出資の履行］：1項＝全額払込、2項＝全部給付、3項＝相殺禁止、4項＝募集株式の株主となる権利（権利株）の譲渡は会社に対抗できない、5項＝出資を履行しな…）の逐語引用に基づく。", "caution": "", "articles": ["208条", "208条1項", "208条2項", "208条3項", "208条4項", "208条5項"], "page": 239, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5022", "ch": 5, "type": "何条", "q": "募集株式の引受人が出資の履行をすることによって株主となる時期等について定めるのは、会社法何条か。", "a": "会社法209条である。", "reason": "レジュメは「209条［株主となる時期等］」の見出しを示している。", "basis": "PDF p.239（本編 p.236）。台帳要素 t006-e03（209条［株主となる時期等］の見出し）の逐語引用に基づく。", "caution": "レジュメ本範囲では見出しのみの記載。209条2項・3項の内容は（7）の論点で扱われている。", "articles": ["209条"], "page": 239, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5023", "ch": 5, "type": "条文構造", "q": "会社法206条の2（公開会社における募集株式の割当て等の特則：支配株主の変更を伴う時）は、どのような構造の条文か。原則と各項の役割を述べよ。", "a": "原則は通常どおり取締役会決議によるという構造であり、1項が株主への通知を、4項が総株主の議決権の10分の1以上の株主の反対があれば株主総会決議を必要とすることを、5項がその株主総会決議は341条と同じ普通決議であることを定めている。", "reason": "レジュメは206条の2について「原則通り、取締役会決議によって。ただし、1項：株主への通知、4項：総株主の議決権の1/10以上の株主の反対あれば、株主総会決議、必要。5項：それは341条と同じ普通決議」と整理している。", "basis": "PDF p.243（本編 p.240）。台帳要素 t010-e01（206条の2：原則通り取締役会決議による。ただし、1項＝株主への通知、4項＝総株主の議決権の1/10以上の株主の反対あれば株主総会決議が必要、5項＝それは341…）の逐語引用に基づく。", "caution": "", "articles": ["206条の2", "206条の2第1項", "206条の2第4項", "206条の2第5項"], "page": 243, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5024", "ch": 5, "type": "規定→趣旨", "q": "206条の2第4項により株主総会決議が必要となる場合、その決議は特別決議ではなく普通決議で足りる（同条5項）。この趣旨は何か。", "a": "支配株主の変更を伴う募集株式の発行等の割当ては、会社の経営者を決定する実質を伴うので、取締役を選任する決議と類似するからである。すなわち、誰に会社の経営を支配させるかという問題は、誰を取締役として会社の経営を任せるかという問題と同様であるから、特別決議ではなく普通決議の承認を要求したものである。", "reason": "レジュメは5項の趣旨として上記の2つの説明を併記している。", "basis": "PDF p.243（本編 p.240）。台帳要素 t010-e03（5項の趣旨（2つの説明が併記）：支配株主の変更を伴う割当ては会社の経営者を決定する実質を伴うので取締役を選任する決議と類似するから。or 誰に会社の経営を支配さ…）の逐語引用に基づく。", "caution": "", "articles": ["206条の2第5項"], "page": 243, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5025", "ch": 5, "type": "規定→趣旨", "q": "募集株式の発行等をやめることの請求（差止請求、210条）が認められる趣旨は何か。", "a": "募集株式の発行等によって株主が不利益を受けるおそれがあるとき、取締役・執行役の違法行為差止請求権（360条1項、422条1項）では株主の保護は不十分であるので、株主の利益保護を図る必要があるためである。", "reason": "レジュメは210条の趣旨を上記のとおり明示している。", "basis": "PDF p.244（本編 p.241）。台帳要素 t012-e02（210条の趣旨：募集株式の発行等によって株主が不利益を受けるおそれがあるとき、取締役・執行役の違法行為差止請求権（360条1項、422条1項）では株主の保護は不…）の逐語引用に基づく。", "caution": "", "articles": ["210条"], "page": 244, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5026", "ch": 5, "type": "何条", "q": "出資の履行の仮装に関与した取締役・執行役が負う支払義務（過失責任）を定めるのは、会社法何条か。", "a": "会社法213条の3である。", "reason": "レジュメは「Xの支払義務（213条の3）。過失責任」と示している。", "basis": "PDF p.245（本編 p.242）。台帳要素 t015-e03（X（仮装に関与した取締役・執行役）の支払義務（213条の3）。過失責任）の逐語引用に基づく。", "caution": "", "articles": ["213条の3"], "page": 245, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5027", "ch": 5, "type": "規定→趣旨", "q": "出資の履行を仮装した募集株式の引受人Aは、支払・給付義務を果たせば、株主の権利を行使することができる（209条2項）。このように仮装払込をした引受人の権利行使を認める趣旨は何か。", "a": "会社財産が充実した以上、仮装払込をした引受人の権利行使を否定する理由はないからである。", "reason": "レジュメは209条2項について「（趣旨）会社財産が充実した以上、仮装払込をした引受人の権利行使を否定する理由はないから」と明示している。", "basis": "PDF p.245（本編 p.242）。台帳要素 t015-e04（AまたはX・Yが義務を果たせば、Aは「株主の権利を行使すること」ができる（209条2項。例：議決権の行使、剰余金の配当請求）。趣旨は、会社財産が充実した以上、仮…）の逐語引用に基づく。", "caution": "", "articles": ["209条2項"], "page": 245, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5028", "ch": 5, "type": "規定→趣旨", "q": "出資の履行を仮装して発行された株式の譲受人Bは、悪意・重過失でなければ、株主の権利を行使することができる（209条3項）。この趣旨は何か。", "a": "株式取引の安全を図るためである。", "reason": "レジュメは209条3項について「（趣旨）株式取引の安全を図るため」と明示している。", "basis": "PDF p.245（本編 p.242）。台帳要素 t015-e05（B（譲受人）は、悪意・重過失でなければ「株主の権利を行使すること」ができる（209条3項）。趣旨は、株式取引の安全を図るため）の逐語引用に基づく。", "caution": "", "articles": ["209条3項"], "page": 245, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5029", "ch": 5, "type": "何条", "q": "新株発行等の無効の訴えのうち、株式の発行の無効の訴えの根拠条文は、会社法何条か。", "a": "会社法828条1項2号である（提訴権者は同条2項2号）。", "reason": "レジュメは新株発行等の無効の訴えの要件を、①株主等による、株式発行の効力発生日から6ヶ月以内の訴えであること、②無効原因があることとし、根拠条文を828条1項2号3号、同条2項2号3号としている。", "basis": "PDF p.248（本編 p.245）。台帳要素 t018-e01（無効の訴えの要件：①株主等による、株式発行の効力発生日から6ヶ月以内の訴えであること、②無効原因があること）の逐語引用に基づく。", "caution": "", "articles": ["828条1項2号"], "page": 248, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5030", "ch": 5, "type": "条文構造", "q": "会社法247条（募集新株予約権の発行をやめることの請求）は、どのような構造の条文か。本文と各号がそれぞれ何を定めているか述べよ。", "a": "本文が、次に掲げる場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、第二百三十八条第一項の募集に係る新株予約権の発行をやめることを請求することができるという要件と効果を定め、各号が請求できる場合を列挙する構造である。1号は、当該新株予約権の発行が法令又は定款に違反する場合、2号は、当該新株予約権の発行が著しく不公正な方法により行われる場合である。", "reason": "レジュメが全文を引用する247条は、「本文＝請求の要件・効果」「各号＝請求事由の列挙」という分担で組み立てられており、募集株式の発行の差止めの規定（210条）と同じ構造である。", "basis": "PDF p.263（本編 p.260）。台帳要素 t034-e02（247条（募集新株予約権の発行をやめることの請求）全文：次に掲げる場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、第二百三十八条第…）の逐語引用に基づく。", "caution": "", "articles": ["247条", "247条1号", "247条2号"], "page": 263, "loc": "項目2 新株予約権の発行・払込等（1）総論"}, {"id": "book-kigyoho-01-ch05-q5031", "ch": 5, "type": "何条", "q": "新株予約権の譲渡等について定める規定は、会社法何条から始まるか。", "a": "会社法254条からである。", "reason": "レジュメは「（2）新株予約権の譲渡等（254条～）」と見出しに条文を対応づけている。", "basis": "PDF p.263（本編 p.260）。台帳要素 t035-e01（（2）新株予約権の譲渡等（254条～））の逐語引用に基づく。", "caution": "レジュメでは見出しのみの記載で、本文の説明はない。", "articles": ["254条"], "page": 263, "loc": "項目2 新株予約権の発行・払込等（1）総論"}, {"id": "book-kigyoho-01-ch05-q5032", "ch": 5, "type": "何条", "q": "新株予約権の行使に際して金銭以外の財産を出資の目的とする場合の現物出資規制（募集株式の発行の場合の207条と同じ内容）を定めるのは、会社法何条か。", "a": "会社法284条である。", "reason": "レジュメは新株予約権の行使（280条～）の中で「284条：現物出資規制 cf.株式の207条と同じ内容」と示している。", "basis": "PDF p.263（本編 p.260）。台帳要素 t035-e02（（3）新株予約権の行使（280条～）：281条1項は金銭出資の全額払込義務、2項は現物出資の全部給付義務・差額支払義務、3項は相殺禁止（cf. 株式の場合と同じ…）の逐語引用に基づく。", "caution": "", "articles": ["284条"], "page": 263, "loc": "項目2 新株予約権の発行・払込等（1）総論"}, {"id": "book-kigyoho-01-ch05-q5033", "ch": 5, "type": "条文構造", "q": "会社法第四編（社債）は、どのような章立て（条文構造）になっているか。各章の名称と条文の範囲を述べよ。", "a": "第一章「総則」（676条～701条）、第二章「社債管理者」（702条～714条）、第二章の二「社債管理補助者」（714条の2～714条の7）、第三章「社債権者集会」（715条～742条）という構造である。なお、第二章のうち704条が社債管理者の義務を、710条1項が社債管理者の一般的責任を、同条2項が社債管理者の特別の責任を定める。", "reason": "レジュメは＜条文構造＞として、第四編社債の章立てと条文の範囲を明示している。", "basis": "PDF p.270（本編 p.267）。台帳要素 t041-e03（＜条文構造＞第四編社債：第一章総則（676条～701条）、第二章社債管理者（702条～714条）、第二章の二社債管理補助者（714条の2～714条の7）、第三章…）の逐語引用に基づく。", "caution": "", "articles": ["676条", "702条", "714条の2", "715条"], "page": 270, "loc": "項目3 社債の発行"}, {"id": "book-kigyoho-01-ch06-q5000", "ch": 6, "type": "規定→趣旨", "q": "資本金とは、会社財産を確保するための基準となる一定の計算上の数字であり、会社法は、一定額の会社財産を会社内に留保させる資本金制度を定めている。この資本金制度が定められた趣旨は何か。", "a": "株主は有限責任しか負わないので（104条）、株式会社の債権者が引き当てとなし得るのは会社財産しかない。そこで、会社債権者保護の観点から、一定額の会社財産を会社内に留保させるためである。", "reason": "資本金制度の趣旨は、株主の有限責任を前提に、債権者の引き当てとなる会社財産を確保する点にある。", "basis": "会社法104条。PDF p.272（本編 p.269）。台帳要素 t001-e01、t001-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 272, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5001", "ch": 6, "type": "規定→趣旨", "q": "資本金の額の減少は、原則として株主総会の特別決議（447条1項、309条2項9号）によらなければならない。このように重い決議を要する趣旨は何か。", "a": "資本金の額の減少は、会社の一部清算の性格を有し、株主の利益に重大な影響を与えるからである。", "reason": "資本金の額の減少の原則（特別決議）の趣旨は、その一部清算的性格と株主への重大な影響にある。", "basis": "PDF p.273（本編 p.270）。台帳要素 t002-e02、t002-e06 の逐語引用に基づく。", "caution": "", "articles": [], "page": 273, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5002", "ch": 6, "type": "規定→趣旨", "q": "準備金の額の減少は、原則として株主総会の普通決議（448条1項、309条1項）で足りる。資本金の額の減少（原則は特別決議）より緩い決議で足りる趣旨は何か。また、答案用としてはどのように説明するか。", "a": "資本金の額の減少の場合の手続要件より緩和することによって、まず準備金の額の減少を先に行うことを促し、資本金のクッションの役割を果たすためである。答案用としては、株主の利益に影響するが、資本金の額の減少の場合ほど株主に与える影響は大きくないから、と説明する。", "reason": "準備金の額の減少の原則（普通決議）の趣旨は、資本金のクッション機能を活かすための手続の緩和にある。", "basis": "PDF p.274（本編 p.271）。台帳要素 t003-e01、t003-e06 の逐語引用に基づく。", "caution": "", "articles": [], "page": 274, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5003", "ch": 6, "type": "規定→趣旨", "q": "資本金の額・準備金の額の減少をする場合には、原則として債権者異議手続（449条1項柱書本文）が必要である。この手続を要する趣旨は何か。", "a": "資本金の額・準備金の額の減少は、それによって剰余金の額が増加する場合、分配可能額が増加する結果、株主への分配がなされ、会社債権者の引き当てとなる会社財産の減少となり得るので、会社債権者の利益に重大な影響を与えうるためである。", "reason": "449条1項柱書本文の趣旨は、減少に伴う会社財産の減少から会社債権者を保護する点にある。", "basis": "会社法449条1項柱書本文。PDF p.274（本編 p.271）。台帳要素 t004-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 274, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5004", "ch": 6, "type": "規定→趣旨", "q": "資本金の額・準備金の額の増加には、株主総会の普通決議（450条2項、451条2項、309条1項）が必要である。この決議を要する趣旨（450条・451条）は何か。", "a": "本来は株主に配当できる剰余金を、配当性のない資本金・準備金に振り替えるという株主の利害に関係あるからである。", "reason": "増加の承認機関の趣旨は、配当可能な剰余金を配当性のない資本金・準備金へ振り替えることが株主の利害に関わる点にある。", "basis": "会社法450条、451条。PDF p.275（本編 p.272）。台帳要素 t005-e01、t005-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 275, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5005", "ch": 6, "type": "規定→趣旨", "q": "剰余金の配当は、原則として株主総会の普通決議（454条1項）によって決定する。この原則の趣旨は何か。", "a": "剰余金の配当は、株主にとって重大な関心事であるので、株主のコントロールを及ぼすのが適当だからである。", "reason": "454条1項の原則の趣旨は、配当が株主の重大な関心事であるため株主のコントロールを及ぼす点にある。", "basis": "会社法454条1項。PDF p.276（本編 p.273）。台帳要素 t008-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 276, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5006", "ch": 6, "type": "規定→趣旨", "q": "違法な剰余金の配当に関する462条の責任では、主体である3者が、当該株式会社に対し連帯して、交付を受けた者が交付を受けた金銭等の帳簿価額に相当する金銭の全額を支払う義務を負う。このうち、(1)3者が責任を負う趣旨と、(2)帳簿価額に相当する金銭の全体を支払う義務が生じる趣旨を、それぞれ述べよ。", "a": "(1)会社債権者保護のためである（資本維持の原則のため重大な違反だから）。(2)当該分配は全体として違法であるためである。", "reason": "462条の趣旨は、3者の責任については会社債権者保護（資本維持の原則）、全額の支払義務については分配全体の違法性にある。", "basis": "PDF p.278（本編 p.275）。台帳要素 t013-e01、t013-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 278, "loc": "項目3 剰余金の配当等に関する責任"}, {"id": "book-kigyoho-01-ch06-q5007", "ch": 6, "type": "規定→趣旨", "q": "465条1項の事後の欠損填補責任では、株式会社が剰余金を配当する時点では財源規制に違反しなかったが事業年度末に欠損が生じた場合に、剰余金の配当に関する業務執行者は、当該株式会社に対し連帯して、その超過額を支払う義務を負う。この責任の趣旨は何か。", "a": "期末時点の株主保護（＋副次的には会社債権者保護）のため、すなわち、剰余金配当をしすぎることによって期末時点の株主の利益を害さないようにするためである。", "reason": "465条の趣旨は、剰余金配当のしすぎから期末時点の株主を保護する点にある（副次的に会社債権者保護）。", "basis": "PDF p.279（本編 p.276）。台帳要素 t014-e03、t014-e05、t014-e07 の逐語引用に基づく。", "caution": "", "articles": [], "page": 279, "loc": "項目3 剰余金の配当等に関する責任"}, {"id": "book-kigyoho-01-ch06-q5008", "ch": 6, "type": "条文構造", "q": "資本三原則について、次の(1)〜(3)の内容は、それぞれどの原則に対応するか。(1)資本金に相当する財産が現実に会社に拠出されなければならない。(2)資本金に相当する財産が現実に会社に保有されなければならない。(3)一旦定められた資本金の額を自由に減少することは許されない。", "a": "(1)資本充実の原則（要請）、(2)資本維持の原則（要請）、(3)資本不変の原則（要請）である。", "reason": "資本三原則は、拠出（充実）・保有（維持）・減少の制限（不変）という場面ごとに対応する原則である。", "basis": "PDF p.272（本編 p.269）。台帳要素 t001-e03、t001-e04、t001-e05 の逐語引用に基づく。", "caution": "", "articles": [], "page": 272, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5009", "ch": 6, "type": "何条", "q": "「純資産額が300万円を下回る場合には、剰余金の配当をすることができない。」この純資産額規制は、会社法何条の定めか。", "a": "458条である。", "reason": "純資産額300万円を基準とする純資産額規制の根拠条文は458条である。", "basis": "会社法458条。PDF p.277（本編 p.274）。台帳要素 t009-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 277, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5010", "ch": 6, "type": "何条", "q": "「剰余金の配当は、分配可能額を超えてすることはできない。」この財源規制（分配可能額規制）は、会社法何条の定めか。", "a": "461条1項8号である。", "reason": "分配可能額を超える配当を禁じる財源規制の根拠条文は461条1項8号である。", "basis": "会社法461条1項8号。PDF p.277（本編 p.274）。台帳要素 t010-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 277, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5011", "ch": 6, "type": "何条", "q": "「株式会社が資本金の額又は準備金の額を減少する場合に、債権者が異議を述べることができる制度（債権者異議制度）」は、会社法何条の定めか。", "a": "449条である。", "reason": "資本金・準備金の額の減少に伴う債権者異議制度の根拠条文は449条である。", "basis": "PDF p.283（本編 p.280）。台帳要素 t017-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 283, "loc": "Ⅱ 重要条文（暗記すべき条文）ー株式会社の計算等ー"}, {"id": "book-kigyoho-01-ch06-q5012", "ch": 6, "type": "何条", "q": "「資本金の額の減少については、一定の提訴権者が、その効力が生じた日から6箇月以内に、無効を訴えをもってのみ主張することができる。」この資本金の額の減少無効の訴えは、会社法何条の定めか。", "a": "828条1項5号・同条2項5号である。", "reason": "資本金の額の減少無効の訴えは、828条1項5号・2項5号に定める特別の制度である。", "basis": "会社法828条1項5号、2項5号。PDF p.275（本編 p.272）。台帳要素 t006-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 275, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5013", "ch": 6, "type": "何条", "q": "「分配可能額を超えるなど違法な剰余金の配当がなされた場合に、業務執行者らが当該株式会社に対して支払義務を負う責任」およびこれに関連する社員（株主）に対する求償権の制限等を定めるのは、会社法何条か。", "a": "462条・463条である。", "reason": "違法な剰余金の配当に関する責任の根拠条文は462条・463条である。", "basis": "PDF p.283（本編 p.280）。台帳要素 t022-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 283, "loc": "Ⅱ 重要条文（暗記すべき条文）ー株式会社の計算等ー"}, {"id": "book-kigyoho-01-ch06-q5014", "ch": 6, "type": "何条", "q": "資本金の額の減少は、原則として株主総会の特別決議によらなければならない。この決定機関の原則を定めるのは、会社法何条か。", "a": "会社法447条1項である（決議要件は309条2項9号）。", "reason": "レジュメは「原則：株主総会の特別決議（447条1項、309条2項9号）」と示している。", "basis": "PDF p.273（本編 p.270）。台帳要素 t002-e02（決定機関の原則：株主総会の特別決議（447条1項、309条2項9号））の逐語引用に基づく。", "caution": "", "articles": ["447条1項", "309条2項9号"], "page": 273, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5015", "ch": 6, "type": "規定→趣旨", "q": "資本金の額の減少の決定機関には例外があり、一定の場合には定時株主総会における普通決議で足りる（例外②）。この例外②の趣旨は何か。", "a": "この場合、資本金の減少によって新たに分配可能額を生じさせないので、会社の一部清算という性格は乏しく、株主に重大な影響は与えないからである。", "reason": "レジュメは例外②の趣旨を「資本金の減少によって新たに分配可能額を生じさせないので、会社の一部清算という性格は乏しく、株主に重大な影響は与えないからである」と明示している。", "basis": "PDF p.273（本編 p.270）。台帳要素 t002-e07（例外②（定時株主総会の普通決議）の趣旨：資本金の減少によって新たに分配可能額を生じさせないので一部清算の性格は乏しく株主に重大な影響を与えないから）の逐語引用に基づく。", "caution": "", "articles": ["309条2項9号"], "page": 273, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5016", "ch": 6, "type": "規定→趣旨", "q": "資本金の額の減少の決定機関の例外①として、株式の発行と同時に資本金の額を減少する場合において株式発行前の資本金の額を下回らないときは、取締役の決定（取締役会設置会社においては取締役会の決議）で足りる（447条3項）。この例外の趣旨（答案用）は何か。", "a": "このような場合、結果的に資本金の額は減少しないので、株主の利益は害されないからである。", "reason": "レジュメは例外①の趣旨（答案用）を「結果的に資本金の額は減少しないので株主の利益は害されないから」としている。", "basis": "PDF p.273（本編 p.270）。台帳要素 t002-e08（例外①（取締役の決定・取締役会の決議、447条3項）の趣旨（答案用）：このような場合結果的に資本金の額は減少しないので株主の利益は害されないから）の逐語引用に基づく。", "caution": "レジュメ原文の表記（「こうような」「からでる」）は誤植と思われるが、台帳には原文ママで記録されている。", "articles": ["447条3項"], "page": 273, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5017", "ch": 6, "type": "何条", "q": "準備金の額の減少は、原則として株主総会の普通決議によらなければならない。この決定機関の原則を定めるのは、会社法何条か。", "a": "会社法448条1項である（決議要件は309条1項）。", "reason": "レジュメは「原則：株主総会の普通決議（448条1項、309条1項）」と示している。", "basis": "PDF p.273（本編 p.270）。台帳要素 t003-e01（決定機関の原則：株主総会の普通決議（448条1項、309条1項））の逐語引用に基づく。", "caution": "", "articles": ["448条1項", "309条1項"], "page": 273, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5018", "ch": 6, "type": "条文構造", "q": "債権者異議手続（449条1項）の例外は、同項のどの部分に定められているか。例外①・例外②それぞれについて述べよ。", "a": "例外①は449条1項柱書本文の第2かっこ書きに、例外②は449条1項柱書のただし書に定められている。", "reason": "レジュメは「例外①：449条1項柱書本文第2かっこ書き／例外②：449条1項柱書ただし書」と整理している。なお、例外①は減少する準備金の額の全部を資本金とする場合、例外②は欠損填補の場合である。", "basis": "PDF p.274（本編 p.271）。台帳要素 t003-e04（債権者異議手続（449条）の例外①：449条1項柱書本文第2かっこ書き、例外②：449条1項柱書ただし書）の逐語引用に基づく。", "caution": "", "articles": ["449条1項"], "page": 274, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5019", "ch": 6, "type": "規定→趣旨", "q": "債権者異議手続（449条1項）の例外①として、減少する準備金の額の全部を資本金とする場合には異議手続を要しない。この例外の趣旨は何か。", "a": "減少した準備金が、減額がより困難な資本金となるので、会社債権者に重大な影響を与えないからである。", "reason": "レジュメは例外①の趣旨を「減額がより困難な資本金となるので、会社債権者に重大な影響を与えないからである」と明示している。", "basis": "PDF p.274（本編 p.271）。台帳要素 t004-e02（例外①（減少する準備金の額の全部を資本金とする場合）の趣旨：減額がより困難な資本金となるので会社債権者に重大な影響を与えないから）の逐語引用に基づく。", "caution": "", "articles": ["449条1項"], "page": 274, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5020", "ch": 6, "type": "規定→趣旨", "q": "債権者異議手続（449条1項）の例外②として、欠損填補のために準備金の額を減少する場合には異議手続を要しない（同項ただし書）。この例外の趣旨は何か。", "a": "この場合、準備金の額の減少によって新たに分配可能額を生じさせないので、会社の一部清算という性格は乏しく、会社債権者に重大な影響は与えないからである。", "reason": "レジュメは例外②の趣旨を「準備金の額の減少によって新たに分配可能額を生じさせないので、会社の一部清算という性格は乏しく、会社債権者に重大な影響は与えないからである」と明示している。", "basis": "PDF p.274（本編 p.271）。台帳要素 t004-e03（例外②（欠損填補の場合）の趣旨：準備金の額の減少によって新たに分配可能額を生じさせないので一部清算の性格は乏しく会社債権者に重大な影響は与えないから）の逐語引用に基づく。", "caution": "", "articles": ["449条1項"], "page": 274, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5021", "ch": 6, "type": "何条", "q": "資本金の額の増加・準備金の額の増加には、株主総会の普通決議が必要である。この承認機関を定めるのは、会社法何条か。それぞれ答えよ。", "a": "資本金の額の増加は会社法450条2項、準備金の額の増加は会社法451条2項である（いずれも決議要件は309条1項）。", "reason": "レジュメは「株主総会の普通決議（450条2項、451条2項、309条1項）」と示している。", "basis": "PDF p.275（本編 p.272）。台帳要素 t005-e01（承認機関：株主総会の普通決議（450条2項、451条2項、309条1項））の逐語引用に基づく。", "caution": "", "articles": ["450条2項", "451条2項"], "page": 275, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5022", "ch": 6, "type": "何条", "q": "資本金の額の減少無効の訴えで請求認容の確定判決がされると、その判決は第三者に対しても効力を有し（対世効）、無効とされた行為は将来に向かって効力を失う（将来効）。この対世効・将来効を定めるのは、それぞれ会社法何条か。", "a": "対世効は会社法838条、将来効は会社法839条である。", "reason": "レジュメは資本金の額の減少無効の訴えの効果について「請求を認容する確定判決は第三者に対してもその効力を有し（838条）」「無効とされた行為は、将来に向かってその効力を失う（839条）」としている。", "basis": "PDF p.275（本編 p.272）。台帳要素 t006-e03（認容確定判決は第三者に対しても効力を有し（838条・対世効）、無効とされた行為は将来に向かって効力を失う（839条・将来効））の逐語引用に基づく。", "caution": "", "articles": ["838条", "839条"], "page": 275, "loc": "項目1 資本金の額等"}, {"id": "book-kigyoho-01-ch06-q5023", "ch": 6, "type": "何条", "q": "剰余金の配当について、配当財産が金銭以外の財産であり、かつ株主に対して金銭分配請求権を与えないこととする場合は、例外として株主総会の特別決議を要する。この例外を定めるのは、会社法何条か。", "a": "会社法454条4項である（決議要件は309条2項10号）。", "reason": "レジュメは「454条4項、309条2項10号／＜例外①：株主総会の特別決議＞」と示している。", "basis": "PDF p.276（本編 p.273）。台帳要素 t008-e02（例外①：株主総会の特別決議（454条4項、309条2項10号）。配当財産が金銭以外の財産であり、かつ株主に対して金銭分配請求権を与えないこととする場合に限る）の逐語引用に基づく。", "caution": "", "articles": ["454条4項", "309条2項10号"], "page": 276, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5024", "ch": 6, "type": "規定→趣旨", "q": "金銭以外の財産を配当財産とし、株主に対して金銭分配請求権を与えないこととする場合は、株主総会の特別決議を要する（454条4項）。この趣旨は何か。", "a": "金銭分配請求権を与えない場合は、金銭以外の配当を望まない株主はその換価性が保証されず不利益のおそれがあるので、株主総会の特別決議を必要としたものである。", "reason": "レジュメは例外①の趣旨を上記のとおり明示している。", "basis": "PDF p.276（本編 p.273）。台帳要素 t008-e03（例外①の趣旨：金銭分配請求権を与えない場合は、金銭以外の配当を望まない株主はその換価性が保証されず不利益のおそれがあるので、株主総会の特別決議を必要とした）の逐語引用に基づく。", "caution": "", "articles": ["454条4項"], "page": 276, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5025", "ch": 6, "type": "規定→趣旨", "q": "剰余金の配当の決定機関の例外②として、定款に定めがある場合には、取締役会の決議によって中間配当をすることができる（454条5項）。この趣旨は何か。", "a": "このような中間配当は株主の利益を害さないからである。", "reason": "レジュメは「454条5項／＜例外②：中間配当、取締役会決議＞／（趣旨）このような中間配当は株主の利益を害さないからである」と示している。", "basis": "PDF p.276（本編 p.273）。台帳要素 t008-e04（例外②：中間配当、取締役会決議（454条5項）。趣旨：このような中間配当は株主の利益を害さないから）の逐語引用に基づく。", "caution": "", "articles": ["454条5項"], "page": 276, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5026", "ch": 6, "type": "何条", "q": "剰余金の配当の決定機関の例外③として、一定の会計監査人設置会社では、定款の定めにより、取締役会の決議で剰余金の配当等を決定することができる。この特則を定めるのは、会社法何条か。", "a": "会社法459条1項4号である（あわせて460条）。", "reason": "レジュメは「459条1項4号・460条／＜例外③：会計監査人設置会社、取締役会決議＞」と示している。", "basis": "PDF p.277（本編 p.274）。台帳要素 t008-e05（例外③：会計監査人設置会社、取締役会決議（459条1項4号・460条））の逐語引用に基づく。", "caution": "", "articles": ["459条1項4号", "460条"], "page": 277, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5027", "ch": 6, "type": "規定→趣旨", "q": "会社法459条が、一定の場合に剰余金の配当等の決定を取締役会に委ねることを認める趣旨は何か。", "a": "会社財産の分配は経営判断の一つともいえるので、適正な計算書類により分配可能額が確定している以上、その分配の決定を取締役会に委ねた方がよい場合もあるためである。", "reason": "レジュメは「（459条の趣旨）会社財産の分配は経営判断の一つともいえるので、適正な計算書類により分配可能額が確定している以上、その分配の決定を取締役会に委ねた方がよい場合もあるため」と明示している。", "basis": "PDF p.277（本編 p.274）。台帳要素 t008-e06（459条の趣旨：会社財産の分配は経営判断の一つともいえるので、適正な計算書類により分配可能額が確定している以上、その分配の決定を取締役会に委ねた方がよい場合もあ…）の逐語引用に基づく。", "caution": "", "articles": ["459条"], "page": 277, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5028", "ch": 6, "type": "条文構造", "q": "会社法459条1項は、定款の定めにより取締役会の決議で決定することができる事項を各号に列挙している。各号がそれぞれ何を定めているか述べよ。", "a": "1号は、特定の者から取得の場合を除く自己株式の有償取得を、2号は、欠損塡補のための準備金の額の減少を、3号は、財産流出を伴わない剰余金の処分を、4号は、剰余金の配当を定めている。", "reason": "レジュメは459条・460条の適用範囲について、剰余金の配当（4号）のみならず、自己株式の有償取得（1号）、欠損塡補のための準備金の額の減少（2号）、財産流出を伴わない剰余金の処分（3号）にも適用されると整理している。", "basis": "PDF p.277（本編 p.274）。台帳要素 t008-e07（459条・460条の適用範囲：剰余金の配当（4号）のみならず、特定の者から取得の場合を除く自己株式の有償取得（1号）、欠損塡補のための準備金の額の減少（2号）、…）の逐語引用に基づく。", "caution": "", "articles": ["459条1項1号", "459条1項2号", "459条1項3号", "459条1項4号"], "page": 277, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5029", "ch": 6, "type": "規定→趣旨", "q": "会社法459条1項の定款の定めがある場合でも、同法460条の定款の定めがない限り、株式会社は株主総会の決議によって剰余金の配当等を決定することができる。このように株主総会の権限がなお残される趣旨は何か。", "a": "会社財産の分配は経営判断の一つともいえるが、剰余金をどのように処分するかしないかは、株主が重大な利害・関心を有する事項であるからである。", "reason": "レジュメは「（460条の趣旨）会社財産の分配は経営判断の一つともいえるが、剰余金をどのように処分するかしないかは、株主が重大な利害・関心を有する事項であるから」と明示している。", "basis": "PDF p.277（本編 p.274）。台帳要素 t008-e09（460条の趣旨：会社財産の分配は経営判断の一つともいえるが、剰余金をどのように処分するかしないかは株主が重大な利害・関心を有する事項であるから）の逐語引用に基づく。", "caution": "", "articles": ["460条"], "page": 277, "loc": "項目2 剰余金の配当"}, {"id": "book-kigyoho-01-ch06-q5030", "ch": 6, "type": "条文構造", "q": "会社法465条1項（事後の欠損填補責任）の効果は、どのような構造で定められているか。本文と括弧書きの役割を述べよ。", "a": "本文が、剰余金の配当に関する業務執行者は、当該株式会社に対し、連帯して、その超過額を支払う義務を負うという原則を定め、括弧書きが、その超過額が当該剰余金の配当により株主に対して交付した金銭等の帳簿価額の総額を超える場合には、支払うべき額は当該帳簿価額の総額が上限となることを定める構造である。", "reason": "レジュメは465条1項の効果を「剰余金の配当に関する業務執行者は、当該株式会社に対し、連帯して、その超過額（当該超過額が当該剰余金の配当により株主に対して交付した金銭等の帳簿価額の総額を超える場合にあっては当該帳簿価額の総額）を支払う義務を負う」と示している。", "basis": "PDF p.279（本編 p.276）。台帳要素 t014-e05（465条1項の効果：剰余金の配当に関する業務執行者は、当該株式会社に対し連帯して、その超過額（当該超過額が当該剰余金の配当により株主に対して交付した金銭等の帳簿…）の逐語引用に基づく。", "caution": "", "articles": ["465条1項"], "page": 279, "loc": "項目3 剰余金の配当等に関する責任"}, {"id": "book-kigyoho-01-ch07-q5000", "ch": 7, "type": "規定→趣旨", "q": "業務執行社員は、自己又は第三者のために会社の事業の部類に属する取引をするには、当該社員以外の社員の全員の承認を受けなければならない（594条・競業の禁止）。この規制の趣旨は何か。", "a": "持分会社の利益保護のためである。", "reason": "594条の競業の禁止の趣旨は、持分会社の利益を保護する点にある。", "basis": "会社法594条。PDF p.286（本編 p.283）。台帳要素 t006-e03、t006-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 286, "loc": "項目3 管理"}, {"id": "book-kigyoho-01-ch07-q5001", "ch": 7, "type": "規定→趣旨", "q": "業務執行社員が会社との間で利益相反取引を行うには、当該社員以外の社員の過半数の承認を要する（595条・利益相反取引規制）。この規制の趣旨は何か。", "a": "持分会社の利益保護のためである。", "reason": "595条の利益相反取引規制の趣旨は、持分会社の利益を保護する点にある。", "basis": "会社法595条。PDF p.286（本編 p.283）。台帳要素 t007-e01、t007-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 286, "loc": "項目3 管理"}, {"id": "book-kigyoho-01-ch07-q5002", "ch": 7, "type": "規定→趣旨", "q": "持分会社においては、利益の配当は原則として制限がない（621条1項）。このように制限を設けない趣旨は何か。", "a": "会社債権者を害さないからである（無限責任社員が存在し、会社債権者は無限責任社員に請求できるため、配当を制限する必要がない）。", "reason": "利益の配当に制限がない原則の趣旨は、無限責任社員の存在により会社債権者を害さない点にある。", "basis": "会社法621条1項。PDF p.290（本編 p.287）。台帳要素 t015-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 290, "loc": "項目5 計算等"}, {"id": "book-kigyoho-01-ch07-q5003", "ch": 7, "type": "規定→趣旨", "q": "合同会社の利益の配当については、株式会社の分配可能額規制（461条）に対応する制限（628条）や、利益の配当に関する責任（629条）などの特則が設けられている。これらの特則が設けられた趣旨は何か。", "a": "会社債権者の保護のためである（合同会社には無限責任社員が存在しないため、株式会社と同様の規制が必要となる）。", "reason": "合同会社の利益の配当に関する特則の趣旨は、会社債権者の保護にある。", "basis": "会社法628条〜631条。PDF p.290（本編 p.287）。台帳要素 t016-e01、t016-e05 の逐語引用に基づく。", "caution": "", "articles": [], "page": 290, "loc": "項目5 計算等"}, {"id": "book-kigyoho-01-ch07-q5004", "ch": 7, "type": "規定→趣旨", "q": "合同会社の出資の払戻しについては、払戻しの制限（632条）などの特則が設けられている。これらの特則が設けられた趣旨は何か。", "a": "会社債権者の保護のためである。", "reason": "合同会社の出資の払戻しに関する特則の趣旨は、会社債権者の保護にある。", "basis": "会社法632条〜634条。PDF p.290（本編 p.287）。台帳要素 t017-e02、t017-e05 の逐語引用に基づく。", "caution": "", "articles": [], "page": 290, "loc": "項目5 計算等"}, {"id": "book-kigyoho-01-ch07-q5005", "ch": 7, "type": "規定→趣旨", "q": "合同会社の退社に伴う持分の払戻しについては、債権者の異議（635条）などの特則が設けられている。これらの特則が設けられた趣旨は何か。", "a": "会社債権者の保護のためである。", "reason": "合同会社の退社に伴う持分の払戻しに関する特則の趣旨は、会社債権者の保護にある。", "basis": "会社法635条・636条。PDF p.291（本編 p.288）。台帳要素 t018-e02、t018-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 291, "loc": "項目5 計算等"}, {"id": "book-kigyoho-01-ch07-q5006", "ch": 7, "type": "条文構造", "q": "持分会社に関する会社法第三編第五章「計算等」の節の構成として、正しいものはどれか。", "a": "第五節は利益の配当、第六節は出資の払戻し、第七節は合同会社の計算等の特則を定める", "reason": "第五章「計算等」は、第五節（利益の配当）・第六節（出資の払戻し）・第七節（合同会社の計算等の特則）から構成される。", "basis": "会社法575条〜、611条。PDF p.289（本編 p.286）。台帳要素 t014-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 289, "loc": "項目5 計算等"}, {"id": "book-kigyoho-01-ch07-q5007", "ch": 7, "type": "何条", "q": "「業務執行社員は、善管注意義務（1項）および忠実義務（2項）を負う。」これは会社法何条の定めか。", "a": "593条である。", "reason": "業務執行社員の善管注意義務・忠実義務の根拠条文は593条である。", "basis": "会社法593条1項。PDF p.286（本編 p.283）。台帳要素 t006-e01、t006-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 286, "loc": "項目3 管理"}, {"id": "book-kigyoho-01-ch07-q5008", "ch": 7, "type": "何条", "q": "「業務執行社員は、当該社員以外の社員の全員の承認を受けなければ、自己又は第三者のために会社の事業の部類に属する取引をしてはならない。」これは会社法何条の定めか。", "a": "594条である。", "reason": "業務執行社員の競業の禁止と全員の承認の要件は594条の定めである。", "basis": "会社法594条。PDF p.286（本編 p.283）。台帳要素 t006-e03、t006-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 286, "loc": "項目3 管理"}, {"id": "book-kigyoho-01-ch07-q5009", "ch": 7, "type": "何条", "q": "「業務執行社員が会社と利益相反取引を行うには、当該社員以外の社員の過半数の承認を要する。」これは会社法何条の定めか。", "a": "595条である。", "reason": "利益相反取引規制と過半数の承認の要件は595条の定めであり、594条（競業・全員の承認）と区別される。", "basis": "会社法595条。PDF p.286（本編 p.283）。台帳要素 t007-e01、t007-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 286, "loc": "項目3 管理"}, {"id": "book-kigyoho-01-ch07-q5010", "ch": 7, "type": "何条", "q": "「退社に伴う持分の払戻しについては、原則として制限がない。」この原則は、会社法何条の定めによるものか。", "a": "611条である。", "reason": "退社に伴う持分の払戻しの根拠条文は611条であり、原則として制限がない。", "basis": "会社法611条。PDF p.291（本編 p.288）。台帳要素 t018-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 291, "loc": "項目5 計算等"}, {"id": "book-kigyoho-01-ch07-q5011", "ch": 7, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「設立しようとする持分会社が合名会社である場合には、前項第五号に掲げる事項として、その社員の全部を無限責任社員とする旨を記載し、又は記録しなければならない。」", "a": "会社法576条2項。", "reason": "合名会社の場合の定款記載事項（社員の全部を無限責任社員とする旨）は、576条2項が定める。", "basis": "会社法576条2項。PDF p.284（本編 p.281）。台帳要素 t001-e01 の逐語引用に基づく。", "caution": "", "articles": ["576条2項"], "page": 284, "loc": "項目1 総論／定款の記載事項（576条2項〜4項）"}, {"id": "book-kigyoho-01-ch07-q5012", "ch": 7, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「設立しようとする持分会社が合資会社である場合には、第一項第五号に掲げる事項として、その社員の一部を無限責任社員とし、その他の社員を有限責任社員とする旨を記載し、又は記録しなければならない。」", "a": "会社法576条3項。", "reason": "合資会社の場合の定款記載事項（社員の一部を無限責任社員とし、その他の社員を有限責任社員とする旨）は、576条3項が定める。", "basis": "会社法576条3項。PDF p.284（本編 p.281）。台帳要素 t001-e02 の逐語引用に基づく。", "caution": "", "articles": ["576条3項"], "page": 284, "loc": "項目1 総論／定款の記載事項（576条2項〜4項）"}, {"id": "book-kigyoho-01-ch07-q5013", "ch": 7, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「設立しようとする持分会社が合同会社である場合には、第一項第五号に掲げる事項として、その社員の全部を有限責任社員とする旨を記載し、又は記録しなければならない。」", "a": "会社法576条4項。", "reason": "合同会社の場合の定款記載事項（社員の全部を有限責任社員とする旨）は、576条4項が定める。", "basis": "会社法576条4項。PDF p.284（本編 p.281）。台帳要素 t001-e03 の逐語引用に基づく。", "caution": "", "articles": ["576条4項"], "page": 284, "loc": "項目1 総論／定款の記載事項（576条2項〜4項）"}, {"id": "book-kigyoho-01-ch07-q5014", "ch": 7, "type": "条文構造", "q": "会社法576条は、持分会社の定款記載事項のうち社員の責任の態様（1項5号の事項）について、2項から4項まででどのような構造をとっているか。", "a": "1項5号に掲げる事項の内容を、設立しようとする会社の類型ごとに分けて定める構造である。すなわち、2項は合名会社（その社員の全部を無限責任社員とする旨）、3項は合資会社（その社員の一部を無限責任社員とし、その他の社員を有限責任社員とする旨）、4項は合同会社（その社員の全部を有限責任社員とする旨）を定める。", "reason": "576条2項〜4項は、同一の記載事項（1項5号）について会社類型ごとに内容を割り当てる並列構造であり、持分会社の3類型の違いは社員の責任の態様の違いとしてここに現れる。", "basis": "会社法576条2項。PDF p.284（本編 p.281）。主対象は台帳要素 t001-e01。引用は t001-e01／t001-e02／t001-e03 の逐語引用に基づく。", "caution": "", "articles": ["576条2項", "576条3項", "576条4項"], "page": 284, "loc": "項目1 総論／定款の記載事項（576条2項〜4項）"}, {"id": "book-kigyoho-01-ch07-q5015", "ch": 7, "type": "何条", "q": "持分会社では「社員の個性が重視される」といわれる。その根拠となる条文を挙げよ。", "a": "580条1項（無限責任）、590条1項（各社員が業務執行権を有すること）・599条1項（代表権）である。", "reason": "レジュメは、持分会社で社員の個性が重視される根拠として、580条1項、590条1項・599条1項を挙げる。", "basis": "会社法580条1項、590条1項、599条1項。PDF p.284（本編 p.281）。台帳要素 t002-e03 の逐語引用に基づく。", "caution": "", "articles": ["580条1項", "590条1項", "599条1項"], "page": 284, "loc": "項目1 総論／持分会社の基本構造（社員の個性重視・所有と経営の一致）"}, {"id": "book-kigyoho-01-ch07-q5016", "ch": 7, "type": "何条", "q": "株式会社において、株主の間接有限責任と、所有と経営の分離は、それぞれ会社法何条に定められているか。", "a": "株主の間接有限責任は104条、所有と経営の分離は326条1項である。", "reason": "レジュメは、持分会社との対比（参考）として、株式会社では株主の個性は（それほど）重視されず、104条が株主の間接有限責任を、326条1項が所有と経営の分離を定めるとする。", "basis": "会社法104条、326条1項。PDF p.284（本編 p.281）。台帳要素 t002-e05 の逐語引用に基づく。", "caution": "", "articles": ["104条", "326条1項"], "page": 284, "loc": "項目1 総論／持分会社の基本構造（社員の個性重視・所有と経営の一致）"}, {"id": "book-kigyoho-01-ch07-q5017", "ch": 7, "type": "何条", "q": "持分会社の社員が持分を譲渡する場合に、不利益を被る他の社員と会社債権者は、それぞれ会社法何条によって保護されるか。", "a": "他の社員は585条1項・2項によって、会社債権者は586条1項によって保護される。", "reason": "レジュメの関係図は、持分の譲渡で不利益を被る者として、①他の社員（585条1項2項で保護）と②会社債権者（586条1項で保護）を整理する。", "basis": "会社法585条1項・2項、586条1項。PDF p.285（本編 p.282）。台帳要素 t003-e02 の逐語引用に基づく。", "caution": "585条・586条の趣旨そのものはレジュメ本ページに記載がなく、本問は条文番号の同定のみを問う。", "articles": ["585条1項", "585条2項", "586条1項"], "page": 285, "loc": "項目2 持分の譲渡（585条）／持分の譲渡と他の社員の保護（585条1項・2項）"}, {"id": "book-kigyoho-01-ch07-q5018", "ch": 7, "type": "規定→趣旨", "q": "持分会社において、出資の払戻しは原則として制限がない（624条）。このように制限を設けない趣旨は何か。", "a": "会社債権者を害さないからである。", "reason": "レジュメは、出資の払戻しについて「原則：制限なし（624条）」とし、その趣旨を「会社債権者を害さないから」と明示している。", "basis": "会社法624条。PDF p.290（本編 p.287）。台帳要素 t017-e01 の逐語引用に基づく。", "caution": "合同会社については、例外として特則（632条以下）による制限がある。", "articles": ["624条"], "page": 290, "loc": "項目5 計算等／出資の払戻し"}, {"id": "book-kigyoho-01-ch07-q5019", "ch": 7, "type": "何条", "q": "業務を執行する社員が持分会社に対して負う損害賠償責任は、会社法何条の定めか。", "a": "会社法596条（株式会社の取締役の任務懈怠責任・423条1項と同様の責任）。", "reason": "レジュメは、業務を執行する社員の持分会社に対する損害賠償責任を596条とし、「＝423条1項」と対応づける。", "basis": "会社法596条、423条1項。PDF p.287（本編 p.284）。台帳要素 t008-e01 の逐語引用に基づく。", "caution": "", "articles": ["596条"], "page": 287, "loc": "項目3 管理／業務執行社員の責任（596条・597条）"}, {"id": "book-kigyoho-01-ch07-q5020", "ch": 7, "type": "何条", "q": "業務を執行する有限責任社員の第三者に対する損害賠償責任は、会社法何条の定めか。", "a": "会社法597条。", "reason": "レジュメは、業務を執行する有限責任社員の第三者に対する損害賠償責任を597条とする。", "basis": "会社法597条。PDF p.287（本編 p.284）。台帳要素 t008-e02 の逐語引用に基づく。", "caution": "597条は429条1項（取締役等の第三者に対する責任）と同じではないとレジュメは注意する。", "articles": ["597条"], "page": 287, "loc": "項目3 管理／業務執行社員の責任（596条・597条）"}, {"id": "book-kigyoho-01-ch07-q5021", "ch": 7, "type": "何条", "q": "持分会社において、原則として業務執行社員が代表権を有する（業務執行社員＝代表権あり）とする規定は、会社法何条何項か。", "a": "会社法599条1項。", "reason": "レジュメは、持分会社の代表について「599条：1項：原則、業務執行社員＝代表権あり」とする。", "basis": "会社法599条1項。PDF p.287（本編 p.284）。台帳要素 t009-e01 の逐語引用に基づく。", "caution": "", "articles": ["599条1項"], "page": 287, "loc": "項目3 管理／持分会社の代表（599条・601条）"}, {"id": "book-kigyoho-01-ch07-q5022", "ch": 7, "type": "何条", "q": "持分会社と社員との間の訴えにおける会社の代表について定める規定は、会社法何条か。", "a": "会社法601条。", "reason": "レジュメは、持分会社と社員との間の訴えにおける会社の代表を601条とする。", "basis": "会社法601条。PDF p.287（本編 p.284）。台帳要素 t009-e03 の逐語引用に基づく。", "caution": "", "articles": ["601条"], "page": 287, "loc": "項目3 管理／持分会社の代表（599条・601条）"}, {"id": "book-kigyoho-01-ch07-q5023", "ch": 7, "type": "何条", "q": "持分会社の社員が会社を代表して他の社員の責任を追及する訴え（株主代表訴訟・847条と似た規定とされる）に関する規定は、会社法何条か。", "a": "会社法602条。", "reason": "レジュメは、社員による責任追及の訴えを602条とし、責任追及の訴え（株主代表訴訟、847条）と似た規定であるとする。", "basis": "会社法602条、847条。PDF p.287（本編 p.284）。台帳要素 t010-e01 の逐語引用に基づく。", "caution": "", "articles": ["602条"], "page": 287, "loc": "項目3 管理／社員による責任追及の訴え（602条）"}, {"id": "book-kigyoho-01-ch07-q5024", "ch": 7, "type": "何条", "q": "持分会社における社員の加入に関する規定は、会社法何条か。", "a": "会社法604条・605条。", "reason": "レジュメは、項目4（1）を「社員の加入（604条・605条）」として位置づける（見出しのみで本文説明はない）。", "basis": "会社法604条、605条。PDF p.288（本編 p.285）。台帳要素 t011-e01 の逐語引用に基づく。", "caution": "", "articles": ["604条", "605条"], "page": 288, "loc": "項目4 社員の加入及び退社／社員の加入（604条・605条）"}, {"id": "book-kigyoho-01-ch07-q5025", "ch": 7, "type": "何条", "q": "持分会社の社員の任意退社は、会社法何条の定めか。", "a": "会社法606条。", "reason": "レジュメは、社員の退社のうち任意退社を606条とする。", "basis": "会社法606条。PDF p.288（本編 p.285）。台帳要素 t012-e02 の逐語引用に基づく。", "caution": "", "articles": ["606条"], "page": 288, "loc": "項目4 社員の加入及び退社／社員の退社（定義・任意退社・法定退社）"}, {"id": "book-kigyoho-01-ch07-q5026", "ch": 7, "type": "何条", "q": "持分会社の社員の法定（強制）退社は、会社法何条の定めか。", "a": "会社法607条。", "reason": "レジュメは、社員の退社のうち法定（強制）退社を607条とする。", "basis": "会社法607条。PDF p.288（本編 p.285）。台帳要素 t012-e03 の逐語引用に基づく。", "caution": "", "articles": ["607条"], "page": 288, "loc": "項目4 社員の加入及び退社／社員の退社（定義・任意退社・法定退社）"}, {"id": "book-kigyoho-01-ch07-q5027", "ch": 7, "type": "何条", "q": "社員の退社の際に、会社債権者は会社法上どのように保護されるかが問われた場合に、中心となる規定は会社法何条か。", "a": "会社法612条（持分の譲渡の場合の586条1項と同様の構造）。", "reason": "レジュメは、論文試験の問い「社員の退社の際の会社債権者の会社法上の保護について説明しなさい。」に対し、612条とその趣旨を書くとする。", "basis": "会社法612条。PDF p.288（本編 p.285）。台帳要素 t013-e02 の逐語引用に基づく。", "caution": "", "articles": ["612条"], "page": 288, "loc": "項目4 社員の加入及び退社／退社の際の会社債権者の保護（612条）"}, {"id": "book-kigyoho-01-ch07-q5028", "ch": 7, "type": "何条", "q": "持分会社の利益の配当について、原則（制限なし）の例外として、有限責任社員の利益の配当に関する責任を定める規定は、会社法何条何項か。", "a": "会社法623条1項。", "reason": "レジュメは、利益の配当の原則（621条1項・制限なし）の「例外①」として、有限責任社員の利益の配当に関する責任（623条1項）を挙げる。", "basis": "会社法623条1項。PDF p.290（本編 p.287）。台帳要素 t015-e02 の逐語引用に基づく。", "caution": "", "articles": ["623条1項"], "page": 290, "loc": "項目5 計算等／利益の配当（原則・例外①）"}, {"id": "book-kigyoho-01-ch07-q5029", "ch": 7, "type": "何条", "q": "合同会社の利益の配当に関する特則は、会社法何条に定められているか。利益の配当の制限、利益の配当に関する責任、社員に対する求償権の制限等、事後の欠損填補責任のそれぞれについて答えよ。", "a": "利益の配当の制限は628条1項・2項、利益の配当に関する責任は629条1項・2項、社員に対する求償権の制限等は630条、事後の欠損填補責任は631条である。", "reason": "レジュメは合同会社の利益の配当の特則を、628条（＝461条）、629条（cf.462条）、630条（＝463条）、631条（＝465条）と、株式会社の分配規制に対応づけて列挙する。", "basis": "会社法628条1項・2項、461条。PDF p.290（本編 p.287）。主対象は台帳要素 t016-e01。引用は t016-e01／t016-e02／t016-e03／t016-e04 の逐語引用に基づく。", "caution": "", "articles": ["628条", "629条", "630条", "631条"], "page": 290, "loc": "項目5 計算等／合同会社の利益の配当の特則"}, {"id": "book-kigyoho-01-ch07-q5030", "ch": 7, "type": "何条", "q": "合同会社の出資の払戻しに関する特則は、会社法何条に定められているか。出資の払戻しの制限、出資の払戻しに関する社員の責任、社員に対する求償権の制限等のそれぞれについて答えよ。", "a": "出資の払戻しの制限は632条、出資の払戻しに関する社員の責任は633条、社員に対する求償権の制限等は634条である。", "reason": "レジュメは、出資の払戻しの原則（624条・制限なし）の例外である合同会社の特則として、632条（2項＝461条）、633条（cf.462条）、634条（＝463条）を列挙する。", "basis": "会社法632条、461条。PDF p.290（本編 p.287）。主対象は台帳要素 t017-e02。引用は t017-e02／t017-e03／t017-e04 の逐語引用に基づく。", "caution": "", "articles": ["632条", "633条", "634条"], "page": 290, "loc": "項目5 計算等／出資の払戻し"}, {"id": "book-kigyoho-01-ch07-q5031", "ch": 7, "type": "何条", "q": "合同会社の退社に伴う持分の払戻しに関する特則は、会社法何条に定められているか。債権者の異議と、業務を執行する社員の責任のそれぞれについて答えよ。", "a": "債権者の異議は635条、業務を執行する社員の責任は636条である。", "reason": "レジュメは、退社に伴う持分の払戻しの原則（611条・制限なし）の例外である合同会社の特則として、635条（債権者の異議）と636条（cf.462条）を挙げる。", "basis": "会社法635条。PDF p.291（本編 p.288）。主対象は台帳要素 t018-e02。引用は t018-e02／t018-e03 の逐語引用に基づく。", "caution": "", "articles": ["635条", "636条"], "page": 291, "loc": "項目5 計算等／退社に伴う持分の払戻し"}, {"id": "book-kigyoho-01-ch07-q5032", "ch": 7, "type": "何条", "q": "持分会社の定款変更は、会社法何条の定めか。", "a": "会社法637条。", "reason": "レジュメは、項目6を「定款変更（637条）」として位置づける（見出しのみで本文説明はない）。", "basis": "会社法637条。PDF p.291（本編 p.288）。台帳要素 t019-e01 の逐語引用に基づく。", "caution": "", "articles": ["637条"], "page": 291, "loc": "項目6 定款変更（637条）／定款変更（637条）と関連訴訟"}, {"id": "book-kigyoho-01-ch07-q5033", "ch": 7, "type": "何条", "q": "持分会社の設立の取消しの訴えは、会社法何条の定めか。", "a": "会社法832条。", "reason": "レジュメは、持分会社の定款変更に関連する訴訟（参考）として、832条（持分会社の設立の取消しの訴え）を挙げる。", "basis": "会社法832条。PDF p.291（本編 p.288）。台帳要素 t019-e03 の逐語引用に基づく。", "caution": "", "articles": ["832条"], "page": 291, "loc": "項目6 定款変更（637条）／定款変更（637条）と関連訴訟"}, {"id": "book-kigyoho-01-ch08-q5000", "ch": 8, "type": "規定→趣旨", "q": "事業譲渡等の手続として、(1)原則として株主総会の特別決議（467条1項、309条2項11号）が必要であり、(2)反対株主には株式買取請求（469条）が認められる。(1)および(2)の趣旨を、それぞれ述べよ。", "a": "(1)事業譲渡等は、会社の運命に重大な影響を及ぼし株主に重大な影響を与えるからである。(2)反対する株主の投下資本回収手続を保障して経済的救済を図るためである。", "reason": "特別決議の趣旨は株主への重大な影響、買取請求の趣旨は反対株主の経済的救済にある。", "basis": "会社法467条1項、309条2項11号。PDF p.298（本編 p.295）。台帳要素 t009-e01、t009-e03、t009-e02、t009-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 298, "loc": "（2）手続"}, {"id": "book-kigyoho-01-ch08-q5001", "ch": 8, "type": "規定→趣旨", "q": "子会社の株式等の譲渡により親会社が支配権を失う場合（467条1項2号の2）にも、株主総会の特別決議が必要である。この趣旨は何か。", "a": "株主に重大な影響を与えるためである。すなわち、この場合、親会社が支配権を失うことや、事業の重要な一部の譲渡をしたのと異ならない点から、親会社の株主の利益に重大な影響を及ぼすからである。", "reason": "2号の2の趣旨は、支配権の喪失が事業の重要な一部の譲渡と異ならず、親会社の株主に重大な影響を及ぼす点にある。", "basis": "会社法467条1項2号の2。PDF p.300（本編 p.297）。台帳要素 t012-e01、t012-e06 の逐語引用に基づく。", "caution": "", "articles": [], "page": 300, "loc": "（2）手続"}, {"id": "book-kigyoho-01-ch08-q5002", "ch": 8, "type": "規定→趣旨", "q": "事業を譲渡した会社は、当事者の別段の意思表示がない限り、同一の市町村及びこれに隣接する市町村の区域内においては、その事業を譲渡した日から20年間は、同一の事業を行ってはならない（21条1項）。この競業避止義務の趣旨は何か。", "a": "事業譲渡の実効性を確保するためである。", "reason": "21条の競業避止義務の趣旨は、事業譲渡の実効性の確保にある。", "basis": "会社法21条。PDF p.302（本編 p.299）。台帳要素 t016-e01、t016-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 302, "loc": "（3）効果"}, {"id": "book-kigyoho-01-ch08-q5003", "ch": 8, "type": "規定→趣旨", "q": "事業を譲り受けた会社が譲渡会社の商号を引き続き使用する場合には、その譲受会社も、譲渡会社の事業によって生じた債務を弁済する責任を負う（22条1項）。この定めの趣旨は何か。", "a": "商号が続用された場合、債権者は事業主体について誤認することがあるから、この債権者の誤認を救済するためである。", "reason": "22条1項の趣旨は、商号続用による債権者の事業主体についての誤認の救済にある。", "basis": "会社法22条1項。PDF p.304（本編 p.301）。台帳要素 t018-e01、t019-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 304, "loc": "（3）効果"}, {"id": "book-kigyoho-01-ch08-q5004", "ch": 8, "type": "規定→趣旨", "q": "譲受会社が譲渡会社の商号を引き続き使用しない場合においても、譲渡会社の事業によって生じた債務を引き受ける旨の広告をしたときは、譲渡会社の債権者は、その譲受会社に対して弁済の請求をすることができる（23条1項）。この定めの趣旨は何か。", "a": "債務引受けの公告をした以上、弁済請求を否定することは禁反言の法理に反するからである。", "reason": "23条1項の趣旨は、禁反言の法理にある。", "basis": "会社法23条1項。PDF p.304（本編 p.301）。台帳要素 t020-e01、t020-e03 の逐語引用に基づく。", "caution": "趣旨文中の「公告」は原文ママの表記である（23条の条文上の表記は「広告」）。", "articles": [], "page": 304, "loc": "（3）効果"}, {"id": "book-kigyoho-01-ch08-q5005", "ch": 8, "type": "条文構造", "q": "会社法22条は、第1項から第4項までで、譲渡会社の商号を引き続き使用した譲受会社の責任について、どのような規律の流れを構成しているか。各項の役割を挙げて説明せよ。", "a": "第1項は、譲受会社も譲渡会社の事業によって生じた債務を弁済する責任を負うという責任の発生を定める。第2項はその例外として、譲受会社が遅滞なく責任を負わない旨を登記した場合（および通知を受けた第三者）には第1項を適用しないことを定める。第3項は、譲受会社が責任を負う場合の譲渡会社の責任の消滅（事業を譲渡した日後2年以内に請求等がない債権者に対する消滅）を定める。第4項は、譲渡会社の事業によって生じた債権について譲受会社にした弁済の効力（弁済者が善意でかつ重大な過失がないときは効力を有する）を定める。", "reason": "22条は、1項（責任の発生）→2項（例外）→3項（譲渡会社の責任の消滅）→4項（弁済の効力）という流れで構成される。", "basis": "会社法22条1項。PDF p.303（本編 p.300）。台帳要素 t018-e01、t018-e02、t018-e03、t018-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 303, "loc": "（3）効果"}, {"id": "book-kigyoho-01-ch08-q5006", "ch": 8, "type": "条文構造", "q": "会社法23条の2は、第1項で詐害事業譲渡における残存債権者の譲受会社に対する履行請求権を定める。第1項ただし書、第2項および第3項は、それぞれこの請求権についてどのような役割を果たす規定か。", "a": "第1項ただし書は、譲受会社が事業の譲渡の効力が生じた時において残存債権者を害することを知らなかったときは請求できないとする例外である。第2項は、譲受会社の責任の消滅（譲渡会社が害することを知って事業を譲渡したことを知った時から2年以内に請求等がない残存債権者に対する消滅、および効力が生じた日から10年経過による消滅）を定める。第3項は、譲渡会社について破産手続開始の決定、再生手続開始の決定又は更生手続開始の決定があったときは、残存債権者は第1項の請求権を行使することができないとする行使の制限を定める。", "reason": "23条の2は、1項本文（請求権）とただし書（例外）、2項（責任の消滅）、3項（請求権の行使の制限）から構成される。", "basis": "会社法23条の2第1項。PDF p.305（本編 p.302）。台帳要素 t021-e02、t021-e03、t021-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 305, "loc": "（4）詐害事業譲渡における残存債権者保護の制度（23条の2）"}, {"id": "book-kigyoho-01-ch08-q5007", "ch": 8, "type": "何条", "q": "「事業を譲渡した会社は、当事者の別段の意思表示がない限り、同一の市町村の区域内及びこれに隣接する市町村の区域内においては、その事業を譲渡した日から二十年間は、同一の事業を行ってはならない。」これは会社法何条の定めか。", "a": "21条1項である。", "reason": "同一・隣接市町村の区域内における20年間の競業の禁止は、譲渡会社の競業避止義務を定める21条1項である。", "basis": "会社法21条1項。PDF p.302（本編 p.299）。台帳要素 t016-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 302, "loc": "（3）効果"}, {"id": "book-kigyoho-01-ch08-q5008", "ch": 8, "type": "何条", "q": "「事業譲渡等に反対する株主は、株式会社に対し、自己の有する株式を公正な価格で買い取ることを請求することができる。」この反対株主の株式買取請求は、会社法何条の定めか。", "a": "469条である。", "reason": "事業譲渡等における反対株主の株式買取請求の根拠条文は469条である。", "basis": "会社法469条。PDF p.298（本編 p.295）。台帳要素 t009-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 298, "loc": "（2）手続"}, {"id": "book-kigyoho-01-ch08-q5009", "ch": 8, "type": "何条", "q": "「事業譲渡等に係る契約の相手方が当該株式会社の特別支配会社である場合（略式事業譲渡）や、譲渡の規模が小さい場合（簡易事業譲渡）には、株主総会の決議による承認を要しない。」これは会社法何条の定めか。", "a": "468条である。", "reason": "略式事業譲渡・簡易事業譲渡の場合に株主総会決議を不要とする根拠条文は468条である。", "basis": "会社法467条1項、309条2項11号、468条。PDF p.298（本編 p.295）。台帳要素 t009-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 298, "loc": "（2）手続"}, {"id": "book-kigyoho-01-ch08-q5010", "ch": 8, "type": "何条", "q": "「譲渡会社が残存債権者を害することを知って事業を譲渡した場合には、残存債権者は、その譲受会社に対して、承継した財産の価額を限度として、当該債務の履行を請求することができる。」これは会社法何条の定めか。", "a": "23条の2第1項である。", "reason": "詐害事業譲渡における残存債権者の履行請求は23条の2第1項の定めである。", "basis": "会社法23条の2第1項。PDF p.305（本編 p.302）。台帳要素 t021-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 305, "loc": "（4）詐害事業譲渡における残存債権者保護の制度（23条の2）"}, {"id": "book-kigyoho-01-ch08-q5011", "ch": 8, "type": "何条", "q": "次の定めは、会社法何条の柱書のものか。「株式会社は、次に掲げる行為をする場合には、当該行為がその効力を生ずる日の前日までに、株主総会の決議によって、当該行為に係る契約の承認を受けなければならない。」", "a": "会社法467条柱書。", "reason": "事業譲渡等について株主総会の決議による契約の承認を要求する定めは、467条柱書である。", "basis": "会社法467条柱書。PDF p.293（本編 p.290）。台帳要素 t001-e01 の逐語引用に基づく。", "caution": "", "articles": ["467条"], "page": 293, "loc": "Ⅰ冒頭（467条）・（1）定義／事業譲渡等の承認（467条）"}, {"id": "book-kigyoho-01-ch08-q5012", "ch": 8, "type": "条文構造", "q": "会社法467条1項は、どのような構造で株主総会の承認を要する行為を定めているか。柱書と各号の役割を述べよ。", "a": "柱書が、効力発生日の前日までに株主総会の決議によって契約の承認を受けなければならないことを定め、各号が承認を要する行為を列挙する構造である。各号は、1号が事業の全部の譲渡、2号が事業の重要な一部の譲渡、3号が他の会社の事業の全部の譲受け、4号が事業の全部の賃貸、事業の全部の経営の委任、他人と事業上の損益の全部を共通にする契約その他これらに準ずる契約の締結、変更又は解約である。", "reason": "467条1項は「柱書＝承認の手続・時期」「各号＝対象行為の列挙」という分担で組み立てられており、答案ではまず柱書から承認の要否を、各号から該当性を読み取る。", "basis": "会社法467条柱書。PDF p.293（本編 p.290）。主対象は台帳要素 t001-e01。引用は t001-e01／t001-e02／t001-e03／t001-e05／t001-e06 の逐語引用に基づく。", "caution": "2号の2（支配権を失う子会社株式等の譲渡）は本ページでは後述とされ、内容はPDF p.300に記載される。", "articles": ["467条1項", "467条1項1号", "467条1項2号", "467条1項3号", "467条1項4号"], "page": 293, "loc": "Ⅰ冒頭（467条）・（1）定義／事業譲渡等の承認（467条）"}, {"id": "book-kigyoho-01-ch08-q5013", "ch": 8, "type": "条文構造", "q": "会社法の条文の配置上、事業譲渡と、合併等の組織再編は、それぞれ何条から始まる規定群に置かれているか。また、この配置から、事業譲渡は法律上どのように位置づけられるか。", "a": "事業譲渡は467条以下、合併等の組織再編は743条以下に置かれている。この条文構造からも、事業譲渡は組織再編行為ではなく、取引行為に過ぎないことがわかる。", "reason": "レジュメは、事業譲渡は467条〜、他方合併などの組織再編は743条〜という条文構造から、事業譲渡が組織再編行為ではなく取引行為に過ぎないことがわかるとする。", "basis": "会社法467条、743条。PDF p.293（本編 p.290）。台帳要素 t002-e01 の逐語引用に基づく。", "caution": "", "articles": ["467条", "743条"], "page": 293, "loc": "Ⅰ冒頭（467条）・（1）定義／事業譲渡の位置づけ（組織再編行為ではなく取引行為）"}, {"id": "book-kigyoho-01-ch08-q5014", "ch": 8, "type": "条文構造", "q": "会社法467条1項2号の2は、支配権を失う子会社株式等の譲渡について、どのような構造で株主総会の承認の対象を画しているか。", "a": "柱書が「その子会社の株式又は持分の全部又は一部の譲渡（次のいずれにも該当する場合における譲渡に限る）」として対象行為を示し、イ（当該譲渡により譲り渡す株式又は持分の帳簿価額が総資産額の5分の1を超えるとき）とロ（当該株式会社が、効力発生日において当該子会社の議決権の総数の過半数の議決権を有しないとき）の双方に該当する場合に限って対象とする構造である。", "reason": "2号の2は、柱書で対象行為を定め、イ・ロの2要件の双方への該当を要求する点に構造上の特徴がある。", "basis": "会社法467条1項2号の2。PDF p.300（本編 p.297）。主対象は台帳要素 t012-e01。引用は t012-e01／t012-e02／t012-e03 の逐語引用に基づく。", "caution": "レジュメの「要件：①②③」欄は番号のみの記載で、各番号と条文の要件との対応は本文に明記されていない（原文ママ）。", "articles": ["467条1項2号の2"], "page": 300, "loc": "（2）手続／支配権を失う子会社株式等の譲渡（467条1項2号の2）"}, {"id": "book-kigyoho-01-ch08-q5015", "ch": 8, "type": "条文構造", "q": "会社法21条は、譲渡会社の競業避止義務について、第1項から第3項まででどのような構造をとっているか。", "a": "1項が原則として、別段の意思表示がない限り、同一の市町村及びこれに隣接する市町村の区域内において譲渡の日から20年間は同一の事業を行ってはならないことを定め、2項が、同一の事業を行わない旨の特約の効力を譲渡の日から30年の期間内に限ることを定め、3項が、前二項の規定にかかわらず不正の競争の目的をもって同一の事業を行ってはならないことを定める構造である。", "reason": "21条は「1項＝法定の競業禁止（原則）」「2項＝特約の効力期間の上限」「3項＝不正競争目的の禁止（例外なく適用）」という3層の構造をとる。", "basis": "会社法21条1項。PDF p.302（本編 p.299）。主対象は台帳要素 t016-e01。引用は t016-e01／t016-e02／t016-e03 の逐語引用に基づく。", "caution": "", "articles": ["21条1項", "21条2項", "21条3項"], "page": 302, "loc": "（3）効果／競業避止義務（21条）"}, {"id": "book-kigyoho-01-ch08-q5016", "ch": 8, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「譲渡会社が同一の事業を行わない旨の特約をした場合には、その特約は、その事業を譲渡した日から三十年の期間内に限り、その効力を有する。」", "a": "会社法21条2項。", "reason": "競業避止の特約の効力期間（30年）を定めるのは、21条2項である。", "basis": "会社法21条2項。PDF p.302（本編 p.299）。台帳要素 t016-e02 の逐語引用に基づく。", "caution": "", "articles": ["21条2項"], "page": 302, "loc": "（3）効果／競業避止義務（21条）"}, {"id": "book-kigyoho-01-ch08-q5017", "ch": 8, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「前二項の規定にかかわらず、譲渡会社は、不正の競争の目的をもって同一の事業を行ってはならない。」", "a": "会社法21条3項。", "reason": "不正の競争の目的による同一事業の禁止を定めるのは、21条3項である。", "basis": "会社法21条3項。PDF p.302（本編 p.299）。台帳要素 t016-e03 の逐語引用に基づく。", "caution": "", "articles": ["21条3項"], "page": 302, "loc": "（3）効果／競業避止義務（21条）"}, {"id": "book-kigyoho-01-ch08-q5018", "ch": 8, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「事業を譲り受けた会社が譲渡会社の商号を引き続き使用する場合には、その譲受会社も、譲渡会社の事業によって生じた債務を弁済する責任を負う。」", "a": "会社法22条1項。", "reason": "商号続用の場合の譲受会社の弁済責任を定めるのは、22条1項である。", "basis": "会社法22条1項。PDF p.303（本編 p.300）。台帳要素 t018-e01 の逐語引用に基づく。", "caution": "", "articles": ["22条1項"], "page": 303, "loc": "（3）効果／譲渡会社の商号を使用した譲受会社の責任等（22条）"}, {"id": "book-kigyoho-01-ch08-q5019", "ch": 8, "type": "何条", "q": "譲受会社が商号続用により譲渡会社の債務を弁済する責任を負う場合に、譲渡会社の責任が、事業を譲渡した日後2年以内に請求又は請求の予告をしない債権者に対してはその期間の経過時に消滅すると定めるのは、会社法何条何項か。", "a": "会社法22条3項。", "reason": "レジュメは、22条3項が、譲受会社が1項により責任を負う場合の譲渡会社の責任の消滅（2年以内の請求・請求の予告がない債権者に対する消滅）を定めるとする。", "basis": "会社法22条3項。PDF p.303（本編 p.300）。台帳要素 t018-e03 の逐語引用に基づく。", "caution": "", "articles": ["22条3項"], "page": 303, "loc": "（3）効果／譲渡会社の商号を使用した譲受会社の責任等（22条）"}, {"id": "book-kigyoho-01-ch08-q5020", "ch": 8, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「譲受会社が譲渡会社の商号を引き続き使用しない場合においても、譲渡会社の事業によって生じた債務を引き受ける旨の広告をしたときは、譲渡会社の債権者は、その譲受会社に対して弁済の請求をすることができる。」", "a": "会社法23条1項。", "reason": "債務を引き受ける旨の広告をした場合の債権者の弁済請求を定めるのは、23条1項である。", "basis": "会社法23条1項。PDF p.304（本編 p.301）。台帳要素 t020-e01 の逐語引用に基づく。", "caution": "", "articles": ["23条1項"], "page": 304, "loc": "（3）効果／譲受会社による債務の引受け（23条）"}, {"id": "book-kigyoho-01-ch08-q5021", "ch": 8, "type": "規定→趣旨", "q": "事業の全部の譲渡の対価が譲受会社の株式等である場合に、譲受会社の株主総会において取締役が説明をしなければならないとされる（467条2項）のは、どのような趣旨によるか。", "a": "自己株式の取得にあたるからである。", "reason": "レジュメは、467条2項の場面（対価として乙株が甲社に交付され、乙社株主総会で取締役が説明をする場面）について、「（趣旨）自己株式の取得にあたるから」と明示している。", "basis": "会社法467条2項。PDF p.301（本編 p.298）。台帳要素 t015-e01 の逐語引用に基づく。", "caution": "", "articles": ["467条2項"], "page": 301, "loc": "（3）効果／467条2項（事業の全部の譲渡の対価が譲受会社の株式等の場合）"}, {"id": "book-kigyoho-01-ch08-q5022", "ch": 8, "type": "規定→趣旨", "q": "会社法22条4項は、商号続用の場合において譲渡会社の事業によって生じた債権について譲受会社にした弁済を、弁済者が善意でかつ重大な過失がないときは有効としている。この定めの趣旨は何か。", "a": "商号が続用された場合、債務者は事業主体について誤認することがあるから、この債務者の誤認を救済するためである。", "reason": "レジュメは、22条4項の趣旨を「債務者の誤認の救済」とし、1項（債権者の誤認の救済）と対になるものとして整理する。", "basis": "会社法22条4項。PDF p.304（本編 p.301）。台帳要素 t019-e02 の逐語引用に基づく。", "caution": "", "articles": ["22条4項"], "page": 304, "loc": "（3）効果／22条1項・4項の趣旨と「事業主体について誤認」"}, {"id": "book-kigyoho-01-ch09-q5000", "ch": 9, "type": "規定→趣旨", "q": "吸収合併等の組織再編行為を行うには、原則として当事会社の株主総会の特別決議による承認が必要である（783条1項等）。このように特別決議を要する趣旨は何か。", "a": "組織再編行為がなされると、当事会社の株主が会社の資産状況や組織再編行為の条件に重大な利害関係を有するからである。", "reason": "特別決議を要する趣旨は、組織再編行為の条件等に対する当事会社の株主の重大な利害関係にある。", "basis": "会社法783条1項・795条1項。PDF p.315（本編 p.312）。台帳要素 t012-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 315, "loc": "項目4 手続き（1）株主総会の特別決議（略式・簡易を含む）"}, {"id": "book-kigyoho-01-ch09-q5001", "ch": 9, "type": "規定→趣旨", "q": "吸収合併存続会社等が消滅株式会社等の特別支配会社である場合には、被支配会社である消滅株式会社等において株主総会の承認を要しない（784条1項・略式組織再編）。この趣旨は何か。", "a": "被支配会社の株主総会決議成立が確実視されるにもかかわらず、多くの時間や費用を投じて株主総会の開催を強制する合理性がないからである。", "reason": "略式組織再編の趣旨は、決議成立が確実視される場合に株主総会の開催を強制する合理性がない点にある。", "basis": "会社法784条1項。PDF p.318（本編 p.315）。台帳要素 t016-e03、t016-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 318, "loc": "項目4 手続き（1）株主総会の特別決議（略式・簡易を含む）"}, {"id": "book-kigyoho-01-ch09-q5002", "ch": 9, "type": "規定→趣旨", "q": "吸収分割により吸収分割承継会社に承継させる資産の帳簿価額の合計額が、吸収分割株式会社の総資産額の5分の1を超えない場合には、吸収分割株式会社において株主総会の承認を要しない（784条2項・簡易組織再編）。この趣旨は何か。", "a": "簡易組織再編の場合、株主への影響が小さいので、株主総会決議を要求しなくても株主保護に欠けるところがないからである。", "reason": "簡易組織再編の趣旨は、株主への影響が小さく株主保護に欠けるところがない点にある。", "basis": "会社法784条2項。PDF p.319（本編 p.316）。台帳要素 t017-e03、t017-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 319, "loc": "項目4 手続き（1）株主総会の特別決議（略式・簡易を含む）"}, {"id": "book-kigyoho-01-ch09-q5003", "ch": 9, "type": "規定→趣旨", "q": "事業の全部譲渡の場合に、譲渡会社が株主総会で承認決議と同時に会社の解散決議をしたときは、反対株主の株式買取請求は認められない（469条1項1号）。この趣旨は何か。", "a": "解散決議をした場合、株主は残余財産の分配を受けるので（105条1項2号、504条）、株式買取請求によって経済的救済を図る必要はないからである。", "reason": "買取請求を認めない趣旨は、解散による残余財産の分配により経済的救済が図られる点にある。", "basis": "会社法469条1項1号、105条1項2号、504条。PDF p.322（本編 p.319）。台帳要素 t022-e01、t022-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 322, "loc": "項目4 手続き（2）反対株主の株式買取請求権"}, {"id": "book-kigyoho-01-ch09-q5004", "ch": 9, "type": "規定→趣旨", "q": "吸収合併等の組織再編行為については、一定の債権者は、消滅株式会社等に対し、当該組織再編行為について異議を述べることができる（789条1項等）。この債権者異議手続が設けられた趣旨は何か。", "a": "組織再編行為によって当事会社の債権者が重大な影響を受けるおそれがあるので、保護の必要があるためである。", "reason": "債権者異議手続の趣旨は、組織再編行為により重大な影響を受けるおそれのある債権者の保護にある。", "basis": "会社法789条1項。PDF p.323（本編 p.320）。台帳要素 t023-e01、t023-e03 の逐語引用に基づく。", "caution": "台帳の引用中の「当時会社」は、レジュメの原文ママの表記である（文脈上は当事会社）。", "articles": [], "page": 323, "loc": "項目4 手続き（3）債権者異議手続"}, {"id": "book-kigyoho-01-ch09-q5005", "ch": 9, "type": "規定→趣旨", "q": "吸収合併等が法令又は定款に違反する場合において、消滅株式会社等の株主が不利益を受けるおそれがあるときは、消滅株式会社等の株主は、消滅株式会社等に対し、吸収合併等をやめることを請求することができる（784条の2・組織再編行為の差止請求権）。この差止請求が認められる趣旨は何か。", "a": "消滅株式会社等の株主の不利益のおそれがあり、保護の必要があるためである。または、消滅株式会社等の株主の不利益のおそれがあり保護の必要があるところ、効力発生後の無効の訴えは認容されにくいので、事前に差止めを認めるべきだからである。", "reason": "差止請求の趣旨は、株主の不利益のおそれに対する保護の必要性にあり、無効の訴えが認容されにくいことから事前の差止めを認める点にもある。", "basis": "会社法784条の2。PDF p.331（本編 p.328）。台帳要素 t029-e03、t029-e07 の逐語引用に基づく。", "caution": "", "articles": [], "page": 331, "loc": "項目4 手続き（4）差止請求権・（5）無効の訴え"}, {"id": "book-kigyoho-01-ch09-q5006", "ch": 9, "type": "規定→趣旨", "q": "株式交付（774条の2以下、816条の2以下）とは、株式会社が他の株式会社をその子会社とするために当該他の株式会社の株式を譲り受け、当該株式の譲渡人に対して当該株式の対価として当該株式会社の株式を交付することをいう（2条32号の2）。この株式交付制度全体の趣旨は何か。", "a": "親子会社関係を円滑に創設するためである。", "reason": "株式交付制度全体の趣旨は、親子会社関係の円滑な創設にある。", "basis": "会社法774条の2。PDF p.344（本編 p.341）。台帳要素 t042-e01、t042-e05 の逐語引用に基づく。", "caution": "", "articles": [], "page": 344, "loc": "項目6 株式交付（774条の2〜、816条の2〜）"}, {"id": "book-kigyoho-01-ch09-q5007", "ch": 9, "type": "規定→趣旨", "q": "株式交付においては、原則として株式交付親会社（乙社）の株主総会決議による承認が必要である（816条の3第1項、309条2項12号）。この趣旨は何か。", "a": "株式交付親会社の株主は、株式交付に重大な利害関係を有しているからである。", "reason": "株主総会承認を要する趣旨は、株式交付に対する親会社の株主の重大な利害関係にある。", "basis": "会社法816条の3第1項、309条2項12号。PDF p.346（本編 p.343）。台帳要素 t044-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 346, "loc": "項目6 株式交付（774条の2〜、816条の2〜）"}, {"id": "book-kigyoho-01-ch09-q5008", "ch": 9, "type": "規定→趣旨", "q": "詐害的会社分割における残存債権者保護の規定（759条4項・764条4項）は、いわゆる人的分割の場合には適用されない（764条5項）。この趣旨は何か。", "a": "いわゆる人的分割の場合は債権者異議手続きがあるので（789条1項2号第二かっこ書、810条1項2号第二かっこ書）、債権者の保護は債権者異議手続で図られるからである。", "reason": "4項不適用の趣旨は、人的分割では債権者異議手続により債権者保護が図られる点にある。", "basis": "会社法764条5項・763条1項12号。PDF p.329（本編 p.326）。台帳要素 t028-e07 の逐語引用に基づく。", "caution": "", "articles": [], "page": 329, "loc": "項目4 手続き（3）債権者異議手続"}, {"id": "book-kigyoho-01-ch09-q5009", "ch": 9, "type": "条文構造", "q": "株式交付に関する規定の配置について、会社法774条の2以下と816条の2以下とを比較し、それぞれがどのような事項を定める規定の集まりかを説明せよ。", "a": "774条の2以下は、第五編第四章の二に置かれ、株式交付計画の作成・株式交付計画の内容、株式交付子会社の株式の譲渡しの申込みや割当てなど、契約・計画・効果等に関する事項を定める。これに対し816条の2以下は、第五編第五章（組織変更、合併、会社分割、株式交換、株式移転及び株式交付の手続）の第四節に置かれ、株式交付親会社の株主総会による承認など、株式交付の手続を定める。譲渡しの申込み・割当てが774条の2以下に置かれるのは、株式交付計画に会社が譲り受ける株式の数の下限等を記載することによる。なお、株式交付子会社（甲社）は株式交付の当事者ではないため、甲社の手続は不要である。", "reason": "株式交付の規定は、契約・計画・効果等を定める第四章の二（774条の2以下）と、手続を定める第五章第四節（816条の2以下）に分かれて配置されている。", "basis": "会社法774条の2以下。PDF p.345（本編 p.342）。台帳要素 t043-e01、t043-e03、t043-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 345, "loc": "項目6 株式交付（774条の2〜、816条の2〜）"}, {"id": "book-kigyoho-01-ch09-q5010", "ch": 9, "type": "何条", "q": "「ある株式会社の総株主の議決権の10分の9以上を、他の会社および当該他の会社が発行済株式の全部を有する株式会社等が有している場合における、当該他の会社」を「特別支配会社」と定義する規定は、会社法何条か。", "a": "468条1項である。", "reason": "特別支配会社の定義は、略式事業譲渡の規定である468条1項に置かれている。", "basis": "会社法468条1項。PDF p.318（本編 p.315）。台帳要素 t016-e05 の逐語引用に基づく。", "caution": "", "articles": [], "page": 318, "loc": "項目4 手続き（1）株主総会の特別決議（略式・簡易を含む）"}, {"id": "book-kigyoho-01-ch09-q5011", "ch": 9, "type": "何条", "q": "「吸収合併等をする場合には、反対株主は、消滅株式会社等に対し、自己の有する株式を公正な価格で買い取ることを請求することができる。」これは会社法何条の定めか。", "a": "785条1項である。", "reason": "吸収合併等における反対株主の株式買取請求の根拠条文は785条1項である。", "basis": "会社法785条1項。PDF p.320（本編 p.317）。台帳要素 t018-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 320, "loc": "項目4 手続き（2）反対株主の株式買取請求権"}, {"id": "book-kigyoho-01-ch09-q5012", "ch": 9, "type": "何条", "q": "「次の各号に掲げる場合には、当該各号に定める債権者は、消滅株式会社等に対し、吸収合併等について異議を述べることができる。」これは会社法何条の定めか。", "a": "789条である。", "reason": "吸収合併等における債権者の異議の根拠条文は789条である。", "basis": "会社法789条1項。PDF p.323（本編 p.320）。台帳要素 t023-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 323, "loc": "項目4 手続き（3）債権者異議手続"}, {"id": "book-kigyoho-01-ch09-q5013", "ch": 9, "type": "何条", "q": "「消滅株式会社等の株主が不利益を受けるおそれがあるときは、消滅株式会社等の株主は、消滅株式会社等に対し、吸収合併等をやめることを請求することができる。」この組織再編行為の差止請求は、会社法何条の定めか。", "a": "784条の2である。", "reason": "吸収合併等をやめることの請求（差止請求）の根拠条文は784条の2である。", "basis": "会社法784条の2。PDF p.330（本編 p.327）。台帳要素 t029-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 330, "loc": "項目4 手続き（4）差止請求権・（5）無効の訴え"}, {"id": "book-kigyoho-01-ch09-q5014", "ch": 9, "type": "何条", "q": "「合併、会社分割、株式交換、株式移転等の組織再編行為の無効は、訴えをもってのみ主張することができる。」この組織再編行為の無効の訴えは、会社法何条の定めか。", "a": "828条（1項7号〜13号、同条2項7号〜13号）である。", "reason": "組織再編行為の無効の訴えの根拠条文は828条1項7号〜13号・2項7号〜13号である。", "basis": "会社法828条1項7号〜13号・2項7号〜13号。PDF p.347（本編 p.344）。台帳要素 t049-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 347, "loc": "II 重要条文（暗記すべき条文）ー組織再編ー"}, {"id": "book-kigyoho-01-ch09-q5015", "ch": 9, "type": "何条", "q": "吸収合併・新設合併の定義は、会社法2条の何号に定められているか。", "a": "吸収合併は2条27号、新設合併は2条28号である。", "reason": "レジュメは、吸収合併（2条27号）・新設合併（2条28号）について、定義文は「……」として条文番号のみを示す。", "basis": "会社法2条27号・28号。PDF p.310（本編 p.307）。台帳要素 t001-e02 の逐語引用に基づく。", "caution": "", "articles": ["2条27号", "2条28号"], "page": 310, "loc": "項目1 定義（意義）／合併の定義（2条27号・28号）"}, {"id": "book-kigyoho-01-ch09-q5016", "ch": 9, "type": "何条", "q": "吸収分割・新設分割の定義は、会社法2条の何号に定められているか。", "a": "吸収分割は2条29号、新設分割は2条30号である。", "reason": "レジュメは、吸収分割（2条29号）・新設分割（2条30号）について、定義文は「……」として条文番号のみを示す。", "basis": "会社法2条29号・30号。PDF p.310（本編 p.307）。台帳要素 t002-e02 の逐語引用に基づく。", "caution": "", "articles": ["2条29号", "2条30号"], "page": 310, "loc": "項目1 定義（意義）／会社分割の定義（2条29号・30号）"}, {"id": "book-kigyoho-01-ch09-q5017", "ch": 9, "type": "何条", "q": "株式交換・株式移転の定義は、会社法2条の何号に定められているか。", "a": "株式交換は2条31号、株式移転は2条32号である。", "reason": "レジュメは、株式交換（2条31号）・株式移転（2条32号）について、定義文は「……」として条文番号のみを示す。", "basis": "会社法2条31号・32号。PDF p.310（本編 p.307）。台帳要素 t003-e01 の逐語引用に基づく。", "caution": "", "articles": ["2条31号", "2条32号"], "page": 310, "loc": "項目1 定義（意義）／株式交換・株式移転の定義（2条31号・32号）"}, {"id": "book-kigyoho-01-ch09-q5018", "ch": 9, "type": "何条", "q": "「株式会社が他の株式会社をその子会社とするために当該他の株式会社の株式を譲り受け、当該株式の譲渡人に対して当該株式の対価として当該株式会社の株式を交付すること」と定義される株式交付は、会社法2条の何号の定めか。", "a": "会社法2条32号の2。", "reason": "株式交付の定義は、2条32号の2に定められている。", "basis": "会社法2条32号の2。PDF p.310（本編 p.307）。台帳要素 t004-e01 の逐語引用に基づく。", "caution": "", "articles": ["2条32号の2"], "page": 310, "loc": "項目1 定義（意義）／株式交付の定義（2条32号の2）"}, {"id": "book-kigyoho-01-ch09-q5019", "ch": 9, "type": "何条", "q": "吸収合併の効果である「3つの当然」（①権利義務の当然の包括承継、②消滅会社の当然の消滅、③株主の地位の当然の移転）の根拠条文を、それぞれ挙げよ。", "a": "①は750条1項、②は471条4号・475条1号かっこ書き、③は749条1項2号である。", "reason": "レジュメは、合併の効果の「3つの当然」の根拠条文として、①750条1項、②471条4号・475条1号かっこ書き、③749条1項2号を対応づける。", "basis": "会社法750条1項、471条4号、475条1号、749条1項2号。PDF p.312（本編 p.309）。台帳要素 t008-e02 の逐語引用に基づく。", "caution": "", "articles": ["750条1項", "471条4号", "475条1号", "749条1項2号"], "page": 312, "loc": "項目3 効果等／合併の効果（3つの当然）"}, {"id": "book-kigyoho-01-ch09-q5020", "ch": 9, "type": "何条", "q": "反対株主の株式買取請求が認められるのは4つの場合だけであるとされる。その4つの場合と根拠条文を挙げよ。", "a": "①定款変更の場合（116条）、②株式併合の決議の場合（182条の4）、③事業譲渡等の決議の場合（469条）、④組織再編行為の決議の場合（785条、797条、806条、816条の6）である。", "reason": "レジュメは、反対株主の買取請求が認められる場合をこの4つに限定して整理し、それぞれの根拠条文を示す。", "basis": "会社法116条・182条の4・469条・785条・797条・806条・816条の6。PDF p.320（本編 p.317）。台帳要素 t018-e01 の逐語引用に基づく。", "caution": "", "articles": ["116条", "182条の4", "469条", "785条", "797条", "806条", "816条の6"], "page": 320, "loc": "項目4 手続き（2）反対株主の株式買取請求権／株式買取請求が認められる4つの場合（根拠条文）"}, {"id": "book-kigyoho-01-ch09-q5021", "ch": 9, "type": "何条", "q": "組織再編行為における債権者異議手続の根拠条文を挙げよ。", "a": "789条1項、799条1項、810条1項、816条の8第1項である。", "reason": "レジュメは、債権者異議手続の根拠条文として、789条1項、799条1項、810条1項、816条の8第1項を挙げる。", "basis": "会社法789条1項・799条1項・810条1項・816条の8第1項。PDF p.323（本編 p.320）。台帳要素 t023-e02 の逐語引用に基づく。", "caution": "", "articles": ["789条1項", "799条1項", "810条1項", "816条の8第1項"], "page": 323, "loc": "項目4 手続き（3）債権者異議手続／債権者異議手続の条文と趣旨"}, {"id": "book-kigyoho-01-ch09-q5022", "ch": 9, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「前条第一項の規定は、存続会社等が消滅株式会社等の特別支配会社である場合には、適用しない。」（略式組織再編）", "a": "会社法784条1項。", "reason": "吸収合併契約等の承認を要しない場合（略式組織再編）を定めるのは、784条1項である。「前条第一項の規定」とは、株主総会の特別決議を要求する783条1項の規定である。", "basis": "会社法784条1項。PDF p.318（本編 p.315）。台帳要素 t016-e03 の逐語引用に基づく。", "caution": "", "articles": ["784条1項"], "page": 318, "loc": "項目4 手続き（1）株主総会の特別決議（略式・簡易を含む）／略式組織再編（特別支配会社）"}, {"id": "book-kigyoho-01-ch09-q5023", "ch": 9, "type": "何条", "q": "吸収分割により吸収分割承継会社に承継させる資産の帳簿価額の合計額が、吸収分割株式会社の総資産額の5分の1を超えない場合には、吸収分割株式会社において株主総会の承認を要しないとする規定（簡易組織再編）は、会社法何条何項か。", "a": "会社法784条2項。", "reason": "簡易組織再編の根拠は784条2項であり、「前条」とは株主総会の特別決議を要求する783条である。", "basis": "会社法784条2項。PDF p.319（本編 p.316）。台帳要素 t017-e03 の逐語引用に基づく。", "caution": "", "articles": ["784条2項"], "page": 319, "loc": "項目4 手続き（1）株主総会の特別決議（略式・簡易を含む）／簡易組織再編"}, {"id": "book-kigyoho-01-ch09-q5024", "ch": 9, "type": "条文構造", "q": "会社法第五編のうち、第一章「組織変更」・第二章「合併」はどのような構造で規定を配置しているか。第二章の節・款と、株式会社／持分会社の区別に着目して述べよ。", "a": "第二章「合併」は、第一節「通則」（748条）、第二節「吸収合併」、第三節「新設合併」からなる。第二節は、第一款「株式会社が存続する吸収合併」（749条・750条）と第二款「持分会社が存続する吸収合併」（751条・752条）に分かれ、第三節は、第一款「株式会社を設立する新設合併」（753条・754条）と第二款「持分会社を設立する新設合併」（755条・756条）に分かれる構造である。", "reason": "第五編第二章は「通則→吸収合併→新設合併」の節立てで、各節を存続・設立する会社の種類（株式会社／持分会社）によって款に分ける構造であり、契約条項の条文と効力の条文が款ごとに並ぶ。", "basis": "会社法第五編第二章。PDF p.311（本編 p.308）。台帳要素 t006-e01 の逐語引用に基づく。", "caution": "", "articles": ["748条", "749条", "750条", "751条", "752条", "753条", "754条", "755条", "756条"], "page": 311, "loc": "項目2 条文構造（一部省略あり）／第五編の条文構造（全体像）"}, {"id": "book-kigyoho-01-ch09-q5025", "ch": 9, "type": "条文構造", "q": "会社法第五編第五章「組織変更、合併、会社分割、株式交換、株式移転及び株式交付の手続」は、どのような節・款・目の構造で手続を配置しているか。", "a": "第一節「組織変更の手続」、第二節「吸収合併等の手続」、第三節「新設合併等の手続」、第四節「株式交付の手続」（816条の2〜816条の10）からなる。第二節は、第一款「吸収合併消滅会社、吸収分割会社及び株式交換完全子会社の手続」（第一目「株式会社の手続」782条〜792条、第二目「持分会社の手続」793条）と、第二款「吸収合併存続会社、吸収分割承継会社及び株式交換完全親会社の手続」（第一目「株式会社の手続」794条〜801条、第二目「持分会社の手続」802条）に分かれる構造である。", "reason": "第五章は行為の類型ごとに節を分け、吸収型については当事会社の立場（消滅会社等／存続会社等）で款を、会社の種類（株式会社／持分会社）で目を分ける構造であり、条文を探すときは目次からこの構造をたどる。", "basis": "会社法第五編第五章。PDF p.311（本編 p.308）。台帳要素 t006-e03 の逐語引用に基づく。", "caution": "", "articles": ["782条", "793条", "794条", "802条", "816条の2"], "page": 311, "loc": "項目2 条文構造（一部省略あり）／第五編の条文構造（全体像）"}, {"id": "book-kigyoho-01-ch09-q5026", "ch": 9, "type": "条文構造", "q": "会社分割における分割会社の債権者保護の規定は、条文上どのような位置に置かれているか。", "a": "「株式会社を設立する吸収（新設）分割の効力の発生等」という条文タイトルの中に置かれている。すなわち、759条1項・764条1項が包括承継の規定であり、その各条文の2項・3項・4項に債権者保護の規定がある。", "reason": "レジュメは、分割会社の債権者保護の規定の位置について、独立の条文ではなく効力発生の条文（759条・764条）の後段の項に置かれていることを指摘する。", "basis": "会社法759条・764条。PDF p.326（本編 p.323）。台帳要素 t026-e01 の逐語引用に基づく。", "caution": "", "articles": ["759条", "764条"], "page": 326, "loc": "項目4 手続き（3）債権者異議手続／分割会社の債権者保護の規定の位置と各別の催告"}, {"id": "book-kigyoho-01-ch09-q5027", "ch": 9, "type": "規定→趣旨", "q": "略式組織再編等の場合、反対株主の株式買取請求は原則として「全ての株主」に認められるが、「特別支配会社」には認められない。その趣旨は何か。", "a": "特別支配会社に認める合理性はないからである。", "reason": "レジュメは、略式組織再編等における買取請求の例外（特別支配会社には認められない）について、その趣旨を「特別支配会社に認める合理性はないから」と明示している。", "basis": "会社法785条2項2号かっこ書等。PDF p.322（本編 p.319）。台帳要素 t021-e02 の逐語引用に基づく。", "caution": "", "articles": ["785条2項2号"], "page": 322, "loc": "項目4 手続き（2）反対株主の株式買取請求権／株式買取請求が認められない場合（2）略式・簡易組織再編"}, {"id": "book-kigyoho-01-ch09-q5028", "ch": 9, "type": "規定→趣旨", "q": "簡易組織再編等の場合に、反対株主の株式買取請求が認められない趣旨は何か。", "a": "簡易組織再編等の場合、会社に与える損害・株主に与える影響は軽微であり、株式買取請求権を与えるまでの必要性がないからである。", "reason": "レジュメは、簡易組織再編等では買取請求は認められないとし、その趣旨を「会社に与える損害・株主に与える影響は軽微であり、株式買取請求権を与えるまでの必要性がないから」と明示している。", "basis": "会社法785条1項2号等。PDF p.322（本編 p.319）。台帳要素 t021-e03 の逐語引用に基づく。", "caution": "", "articles": ["785条1項2号"], "page": 322, "loc": "項目4 手続き（2）反対株主の株式買取請求権／株式買取請求が認められない場合（2）略式・簡易組織再編"}, {"id": "book-kigyoho-01-ch10-q5001", "ch": 10, "type": "何条", "q": "「定款変更には、原則として株主総会の特別決議が必要である。」この定款変更の原則と、その特別決議の要件は、会社法何条（何項何号）に定められているか。", "a": "定款変更は466条、株主総会の特別決議の要件は309条2項11号である。", "reason": "レジュメは、定款変更の原則として、466条と309条2項11号を対応づける。", "basis": "会社法466条・309条2項11号。PDF p.348（本編 p.345）。台帳要素 t001-e01 の逐語引用に基づく。", "caution": "", "articles": ["466条", "309条2項11号"], "page": 348, "loc": "Ⅰ 条文・趣旨・論証等／定款変更の原則（株主総会の特別決議）"}, {"id": "book-kigyoho-01-ch10-q5002", "ch": 10, "type": "何条", "q": "定款変更によって、ある種類株式の種類株主に損害を及ぼすおそれがある場合に、原則として当該種類株主総会の特別決議も必要とする根拠条文は何か。", "a": "322条1項各号・324条2項4号である。", "reason": "レジュメは、種類株主に損害を及ぼすおそれがある場合の種類株主総会の特別決議について、322条1項各号、324条2項4号を根拠とする。", "basis": "会社法322条1項各号・324条2項4号。PDF p.348（本編 p.345）。台帳要素 t002-e01 の逐語引用に基づく。", "caution": "", "articles": ["322条1項", "324条2項4号"], "page": 348, "loc": "Ⅰ 条文・趣旨・論証等／種類株主に損害を及ぼすおそれがある場合（種類株主総会の特別決議）"}, {"id": "book-kigyoho-01-ch10-q5003", "ch": 10, "type": "条文構造", "q": "定款変更の決議要件は、どのような構造になっているか。原則と、種類株主に損害を及ぼすおそれがある場合の取扱いを述べよ。", "a": "原則として、株主総会の特別決議（466条、309条2項11号）によって行う。これに加えて、定款変更によってある種類株式の種類株主に損害を及ぼすおそれがある場合は、原則として、さらに当該種類株主総会の特別決議（322条1項各号、324条2項4号）を要するという、二段の構造である。", "reason": "定款変更の決議要件は「全体の株主総会の特別決議」という原則に対し、種類株主の利害が特に影響を受ける場合に「種類株主総会の特別決議」を上乗せする構造である。", "basis": "会社法322条1項各号・324条2項4号。PDF p.348（本編 p.345）。主対象は台帳要素 t002-e01。引用は t002-e01／t001-e01 の逐語引用に基づく。", "caution": "", "articles": ["466条", "309条2項11号", "322条1項", "324条2項4号"], "page": 348, "loc": "Ⅰ 条文・趣旨・論証等／種類株主に損害を及ぼすおそれがある場合（種類株主総会の特別決議）"}, {"id": "book-kigyoho-01-ch11-q5000", "ch": 11, "type": "規定→趣旨", "q": "自己の商号を使用して事業又は営業を行うことを他人に許諾した会社は、当該会社が当該事業を行うものと誤認して当該他人と取引をした者に対し、当該他人と連帯して、当該取引によって生じた債務を弁済する責任を負う（9条）。この名板貸人の責任の趣旨は何か。", "a": "権利外観理論を基礎として取引の安全を図るためである。すなわち、名板貸人が事業主体であるかのような外観を信頼して取引をした第三者を保護するためである。", "reason": "9条の趣旨は、権利外観理論を基礎とする取引の安全と、外観を信頼した第三者の保護にある。", "basis": "会社法9条。PDF p.350（本編 p.347）。台帳要素 t001-e01、t001-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 350, "loc": "項目1 名板貸人の責任・商号使用許諾者の責任（9条）"}, {"id": "book-kigyoho-01-ch11-q5001", "ch": 11, "type": "規定→趣旨", "q": "支配人の競業の禁止（12条1項）は、自ら営業を行うこと、自己又は第三者のために会社の事業の部類に属する取引をすること、他の会社等の使用人となること、他の会社の取締役等となることの4つを対象とする。これに対し、取締役の競業避止義務（356条1項1号）の対象は「自己又は第三者のために会社の事業の部類に属する取引をすること」のみである。このように、支配人と取締役とで競業禁止の範囲が異なる理由（趣旨）は何か。", "a": "支配人は、会社と委任関係にある取締役と異なり、会社と雇用関係にあるので、営業主のために専心勤務すべきであるからである。", "reason": "範囲の相違の理由は、支配人が雇用関係に基づき営業主のために専心勤務すべき立場にある点にある。", "basis": "会社法12条。PDF p.356（本編 p.353）。台帳要素 t008-e01、t008-e02、t008-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 356, "loc": "項目2 会社の使用人（商業使用人）"}, {"id": "book-kigyoho-01-ch11-q5002", "ch": 11, "type": "何条", "q": "「自己の商号を使用して事業又は営業を行うことを他人に許諾した会社は、当該会社が当該事業を行うものと誤認して当該他人と取引をした者に対し、当該他人と連帯して、当該取引によって生じた債務を弁済する責任を負う。」これは会社法何条の定めか。", "a": "9条である。", "reason": "自己の商号の使用を他人に許諾した会社の責任（名板貸人の責任）の根拠条文は9条である。", "basis": "会社法9条。PDF p.350（本編 p.347）。台帳要素 t001-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 350, "loc": "項目1 名板貸人の責任・商号使用許諾者の責任（9条）"}, {"id": "book-kigyoho-01-ch11-q5003", "ch": 11, "type": "何条", "q": "「支配人は、会社に代わってその事業に関する一切の裁判上又は裁判外の行為をする権限を有する。また、支配人の代理権に加えた制限は、善意の第三者に対抗することができない。」これは会社法何条の定めか。", "a": "11条である。", "reason": "支配人の代理権の根拠条文は11条である。", "basis": "会社法11条。PDF p.355（本編 p.352）。台帳要素 t007-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 355, "loc": "項目2 会社の使用人（商業使用人）"}, {"id": "book-kigyoho-01-ch11-q5004", "ch": 11, "type": "何条", "q": "「支配人は、会社の許可を受けなければ、自ら営業を行うこと、自己又は第三者のために会社の事業の部類に属する取引をすること等をしてはならない。また、支配人がこれに違反して当該取引をしたときは、当該行為によって支配人又は第三者が得た利益の額は、会社に生じた損害の額と推定する。」これは会社法何条の定めか。", "a": "12条である。", "reason": "支配人の競業の禁止と利益額の推定の根拠条文は12条である。", "basis": "会社法12条。PDF p.356（本編 p.353）。台帳要素 t008-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 356, "loc": "項目2 会社の使用人（商業使用人）"}, {"id": "book-kigyoho-01-ch11-q5005", "ch": 11, "type": "何条", "q": "「会社の本店又は支店の事業の主任者であることを示す名称を付した使用人は、当該本店又は支店の事業に関し、一切の裁判外の行為をする権限を有するものとみなす。ただし、相手方が悪意であったときは、この限りでない。」これは会社法何条の定めか。", "a": "13条である。", "reason": "表見支配人の根拠条文は13条である。", "basis": "会社法13条。PDF p.356（本編 p.353）。台帳要素 t009-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 356, "loc": "項目2 会社の使用人（商業使用人）"}, {"id": "book-kigyoho-01-ch11-q5006", "ch": 11, "type": "何条", "q": "「会社が支配人を選任し、又はその代理権が消滅したときは、その本店の所在地において、その登記をしなければならない。」これは会社法何条の定めか。", "a": "918条である。", "reason": "支配人の登記の根拠条文は918条である。", "basis": "会社法918条。PDF p.357（本編 p.354）。台帳要素 t010-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 357, "loc": "項目2 会社の使用人（商業使用人）"}, {"id": "book-kigyoho-01-ch11-q5007", "ch": 11, "type": "何条", "q": "支配人の選任・解任は、指名委員会等設置会社以外の取締役会設置会社では、会社法何条何項何号により取締役会の専決事項とされているか。", "a": "会社法362条4項3号。", "reason": "レジュメは、支配人の選任・解任機関について、（委員会設置会社以外の）取締役会設置会社では取締役会の専決事項（362条4項3号）とする。", "basis": "会社法362条4項3号。PDF p.355（本編 p.352）。台帳要素 t006-e02 の逐語引用に基づく。", "caution": "", "articles": ["362条4項3号"], "page": 355, "loc": "項目2 会社の使用人（商業使用人）／支配人の選任・解任機関"}, {"id": "book-kigyoho-01-ch11-q5008", "ch": 11, "type": "条文構造", "q": "会社法11条（支配人の代理権）は、第1項から第3項まででどのような事項を定める構造か。", "a": "1項が、支配人は会社に代わってその事業に関する一切の裁判上又は裁判外の行為をする権限を有することを定め、2項が、支配人は他の使用人を選任し、又は解任することができることを定め、3項が、支配人の代理権に加えた制限は善意の第三者に対抗することができないことを定める構造である。", "reason": "11条は「1項＝代理権の範囲（包括性）」「2項＝使用人の選解任権」「3項＝制限の対抗不可（不可制限性）」という構造をとり、代表権と同様の包括性・不可制限性を表す規定とされる。", "basis": "会社法11条。PDF p.355（本編 p.352）。台帳要素 t007-e01 の逐語引用に基づく。", "caution": "", "articles": ["11条1項", "11条2項", "11条3項"], "page": 355, "loc": "項目2 会社の使用人（商業使用人）／支配人の代理権（11条）"}, {"id": "book-kigyoho-01-ch11-q5009", "ch": 11, "type": "条文構造", "q": "会社法12条（支配人の競業の禁止）は、第1項と第2項でどのような構造をとっているか。", "a": "1項が、支配人は会社の許可を受けなければ行うことができない行為を各号で列挙する（1号：自ら営業を行うこと、2号：自己又は第三者のために会社の事業の部類に属する取引をすること、3号：他の会社又は商人の使用人となること、4号：他の会社の取締役、執行役又は業務を執行する社員となること）構造であり、2項が、支配人が1項2号の行為をしたときは、その行為によって支配人又は第三者が得た利益の額を会社に生じた損害の額と推定することを定める。", "reason": "12条は「1項＝禁止行為の列挙（各号）」「2項＝違反時の損害額の推定」という構造であり、2項は423条2項と同じ規定である。", "basis": "会社法12条。PDF p.356（本編 p.353）。台帳要素 t008-e01 の逐語引用に基づく。", "caution": "", "articles": ["12条1項", "12条2項"], "page": 356, "loc": "項目2 会社の使用人（商業使用人）／支配人の競業の禁止（12条）"}], "cards": [{"id": "book-kigyoho-01-ch01-r001", "ch": 1, "topic": "前提：要件・効果を意識すること", "points": [{"aspect": "原則", "text": "答案作成の大前提として、条文の要件・効果を意識すること"}, {"aspect": "原則", "text": "210条の要件への分解①：株式の発行が、法令・定款違反のおそれ、または、著しく不公正な方法（不公正発行）であること"}, {"aspect": "原則", "text": "210条の要件への分解②：株主が不利益を受けるおそれがあること"}, {"aspect": "原則", "text": "210条の効果：株式発行の差止め。要件から効果へ矢印でつなぐ図式で示される"}, {"aspect": "条文", "text": "210条"}], "articles": ["210条"], "pages": [4]}, {"id": "book-kigyoho-01-ch01-r002", "ch": 1, "topic": "「～について論じなさい。」問題", "points": [{"aspect": "原則", "text": "前提：平成29年第1問の問題1・2以外、問いは「論じなさい」か「説明しなさい」のいずれかであり、使い分けられている以上、それぞれに対応する書き方を意識すべきである（平成29年第1問も実質「論じなさい」と同じ書き方でよかった）"}, {"aspect": "原則", "text": "（参考）「～について論じなさい。」の意味：ものごとの筋道を立てて述べること。あるものごとを論理的に主張して客観的な考えを述べること。反対意見を書く、または意識すること"}, {"aspect": "原則", "text": "「論じなさい」では自分の考えを述べない。自分の考えを書くのは「～について考察しなさい。」であり、会計士試験ではこの形は出題されていない"}, {"aspect": "原則", "text": "（参考・対比）「～について説明しなさい。」の意味：あるものごとを人に理解させる為に細かい内容を述べること。「論じなさい」との使い分けの前提として項目2で先に示される"}, {"aspect": "原則", "text": "全体の型：（１）非論点型・（２）論点型とも三段落で書く。ただし（１）- B（あてはめと条文を一緒に書く型）は除く"}, {"aspect": "原則", "text": "非論点型・第1段落＜①＞問題提起：書いたほうがいい。その際、何条の問題か条文を指摘すること。もっとも、答案スペースがないなどの場合には問題提起は書かないこともありうる"}, {"aspect": "原則", "text": "非論点型・第2段落＜②＞規範：条文そのもの、または、要件である"}, {"aspect": "原則", "text": "非論点型・第3段落＜③＞あてはめ：第2段落の規範の言葉とリンクする必要がある"}, {"aspect": "原則", "text": "書き分けの基準：＜②＞規範は抽象的に、＜③＞あてはめは具体的に書くことが必要である"}, {"aspect": "原則", "text": "＜②＞の別論証（要件列挙型の規範）：423条1項責任が成立するためには、①役員等が②任務を懈怠して③会社に損害を生じたこと④任務懈怠と損害との間に相当因果関係があること、（⑤役員等の故意・過失）が必要である"}, {"aspect": "原則", "text": "非論点型B（あてはめと条文を一緒に書く型）：三段落に分けず、あてはめの中で条文の文言を「取締役」「任務」「怠った」「これによって」「損害」のように引用符で拾いながら認定と条文を一緒に書く型（（１）- B、三段落の例外）"}, {"aspect": "原則", "text": "あてはめ・認定（3段落目）に注意すべきことⅰ：規範・要件（2段落目）とキーワードリンクを意識すること"}, {"aspect": "原則", "text": "あてはめ・認定（3段落目）に注意すべきことⅱ：裁判官の立場で認定すること。裁判をイメージし、当事者の主張立証を経て裁判官の前に出された「事実」だけに基づいて判断（認定）する"}, {"aspect": "原則", "text": "「論点」の意味：条文の文言の意味が不明確であったり、争いがあるものが論点となる。論点は事前に暗記して書けるようになっておくべきである"}, {"aspect": "原則", "text": "論点型・第1段落（問題提起）の形：事実関係を挙げたうえで「そこで、当該取引が利益相反取引（356条1項2号）にあたり、株主総会の承認が必要であろうか」と問いを立てる"}, {"aspect": "原則", "text": "論点型・第2段落（規範定立）の書き方：規範定立は解釈＝論証である。理由をつけて、一般的規範を書く"}, {"aspect": "原則", "text": "規範定立の理由づけの3類型：ⅰ趣旨から、ⅱ利益考慮から（たとえば、取引の安全の観点から、会社債権者保護の観点からなど）、ⅲ条文の文言から"}, {"aspect": "原則", "text": "規範とあてはめの関係：「著しく不公正な方法」の意味を規範（基準）として立てたうえで、本問がその規範にあたるか、あてはめをすることになる"}, {"aspect": "条文", "text": "423条・356条・210条・201条・199条・365条"}], "articles": ["423条", "356条", "210条", "201条", "199条", "365条"], "pages": [5, 6, 7, 8, 9]}, {"id": "book-kigyoho-01-ch01-r003", "ch": 1, "topic": "「～について説明しなさい。」説明問題", "points": [{"aspect": "原則", "text": "（１）旧パターン：1行問題（抽象的説明問題）という説明問題の型"}, {"aspect": "原則", "text": "説明問題の基本の書き方：⑴定義、⑵条文、⑶趣旨を淡々と繰り返し書いていくこと"}, {"aspect": "原則", "text": "比較問題（説明問題の仲間）の書き方の手順：1定義（意義）、2共通点（共通する条文・制度）（→共通する理由）、3相違点（異なる条文・制度）→異なる理由・趣旨、の順に書く"}, {"aspect": "原則", "text": "比較問題のポイントは相違点の理由である。条文・制度を比較し、特に相違点がなぜあるか、根本的理由にさかのぼって書くことが要求されている"}, {"aspect": "原則", "text": "比較問題の位置づけ：比較問題は説明問題の一種であり、説明問題と同じ書き方も可能である。ただしその際も重要なのは「相違点の理由」である"}, {"aspect": "原則", "text": "（２）「条文・趣旨・あてはめ」型の手順：①定義、②条文、③趣旨、④したがって、（事案の会社では）………。（結論）の順に書く"}, {"aspect": "原則", "text": "「条文・趣旨・あてはめ」型では、答案スペースの関係などで、②条文と④結論を一緒に書くこともある"}, {"aspect": "原則", "text": "「条文・趣旨・あてはめ」型の多くは、「手続を説明させる問題」であるという型の特徴"}, {"aspect": "原則", "text": "（参考）「～について説明しなさい。」の意味：あるものごとを人に理解させる為に細かい内容を述べること（三段落説明型の前提として再掲）"}, {"aspect": "原則", "text": "（３）三段落説明型の特徴：多くは、条文そのものの説明を問うている"}, {"aspect": "原則", "text": "三段落説明型の書き方：三段落説明型＝「論じなさい」の（１）の非論点型と考えて、非論点型の書き方をすればいい。具体的事案が提示され「説明しなさい」と問われる場合でもこの型で処理する"}, {"aspect": "原則", "text": "三段落説明型では「趣旨」は不要と考える。不安なら書いてもいいが、答案スペースとの関係を意識すべきである"}, {"aspect": "原則", "text": "（４）「判例の立場を説明しなさい。」型（令和6年第2問問題1）：「条文」ではなく「判例」の説明を求める問題。判例の立場＝多く普段から学習している判例の論証を伝えればいい"}, {"aspect": "原則", "text": "「判例の立場を説明しなさい。」型の書き方：論点型の三段落で書く。ただし、あてはめはない"}, {"aspect": "条文", "text": "361条"}], "articles": ["361条"], "pages": [10, 11, 12, 13]}, {"id": "book-kigyoho-01-ch01-r004", "ch": 1, "topic": "答案を書く際に考えること", "points": [{"aspect": "原則", "text": "思考フローの出発点：設問（問題）を丁寧に読む＝何が問われているかを掴む"}, {"aspect": "原則", "text": "次の確認：まず、何条の問題か（根拠条文の特定）"}, {"aspect": "原則", "text": "次の確認：どう書くか（「論じなさい」か「説明しなさい」か、問い方に応じた型の判別）"}, {"aspect": "原則", "text": "答案作成時の2つの柱：その後の確認事項は「具体的に！」の列と「丁寧に！」の列に分かれる（枠図の2列構成）"}, {"aspect": "原則", "text": "「具体的に！」の列：説明問題の趣旨は、長く書く"}, {"aspect": "原則", "text": "「具体的に！」の列：事例問題は、あてはめを長く具体的に書く（上位答案はあてはめが答案の半分）"}, {"aspect": "原則", "text": "「丁寧に！」の列：字ではなく、条文を丁寧に書く（○条○項○号まで特定して引用する）"}, {"aspect": "条文", "text": "831条・299条"}], "articles": ["831条", "299条"], "pages": [14]}, {"id": "book-kigyoho-01-ch02-r001", "ch": 2, "topic": "株主総会決議取消しの訴え（831条1項）の要件と取消事由", "points": [{"aspect": "原則", "text": "831条1項本文：株主等は決議の日から3箇月以内に訴えをもって決議の取消しを請求できる"}, {"aspect": "原則", "text": "取消事由1号：招集の手続又は決議の方法が法令若しくは定款に違反し、又は著しく不公正なとき"}, {"aspect": "原則", "text": "取消事由2号：決議の内容が定款に違反するとき"}, {"aspect": "原則", "text": "取消事由3号：特別の利害関係を有する者が議決権を行使したことによって著しく不当な決議がされたとき"}, {"aspect": "要件", "text": "取消しの訴えの要件は、①株主等による決議の日から3ヶ月以内の訴えであること、②取消事由（831条1項各号）があること"}, {"aspect": "条文", "text": "831条・369条・314条"}], "articles": ["831条", "369条", "314条"], "pages": [15]}, {"id": "book-kigyoho-01-ch02-r002", "ch": 2, "topic": "取消事由の具体例（教材問題①〜⑨）", "points": [{"aspect": "条文", "text": "299条・298条・309条・120条・310条・314条・831条"}], "articles": ["299条", "298条", "309条", "120条", "310条", "314条", "831条"], "pages": [16]}, {"id": "book-kigyoho-01-ch02-r003", "ch": 2, "topic": "（論点）株主は、他の株主に対する瑕疵につき、自ら原告となって訴えを提起することができるか", "points": [{"aspect": "結論", "text": "結論：株主は自己に対する瑕疵がない場合でも取消しの訴えを提起できる。理由は、取消しの訴えは不利益を受けた株主を保護する規定ではなく公正な決議の成立を担保する規定であり、条文上も「株主等」に限定がないため"}, {"aspect": "結論", "text": "上記結論は最判昭和42・9・28の立場である"}, {"aspect": "条文", "text": "299条"}], "articles": ["299条"], "pages": [17]}, {"id": "book-kigyoho-01-ch02-r004", "ch": 2, "topic": "（論点）提訴期間内に訴えを提起し、提訴期間経過後、裁判の中で新たに取消原因を追加できるか", "points": [{"aspect": "趣旨", "text": "831条1項が提訴期間を制限した趣旨は、総会決議の効力を早期に確定させ会社を巡る法律関係を安定させることにある"}, {"aspect": "結論", "text": "結論：提訴期間は訴えの提起のみならず取消原因の主張もすべき期間であり、期間経過後は新たな取消原因の追加主張は認められない"}, {"aspect": "結論", "text": "上記結論は最判昭和51・12・24の立場である"}, {"aspect": "条文", "text": "831条"}], "articles": ["831条"], "pages": [17]}, {"id": "book-kigyoho-01-ch02-r005", "ch": 2, "topic": "株主総会決議取消しの訴えの判決の効力（対世効・遡及効）", "points": [{"aspect": "結論", "text": "対世効（838条）：認容（勝訴）確定判決は対世効により、Bとの関係でも決議取消しとなる"}, {"aspect": "結論", "text": "棄却（敗訴）確定判決には対世効がないので、甲社とAの間で訴えが認められなかったに過ぎず、Bはその後もう一度決議取消の訴えを提起できる"}, {"aspect": "結論", "text": "取消しの訴えの認容確定判決は遡及効である（839条参照）。将来効であれば判決までの決議・会社の行為は有効となるが、遡及効では総会決議の時から決議がなかったことになる"}, {"aspect": "条文", "text": "838条・839条"}], "articles": ["838条", "839条"], "pages": [18]}, {"id": "book-kigyoho-01-ch02-r006", "ch": 2, "topic": "（問題）取締役選任決議の取消しと代表取締役Aの取引相手方Bの代金支払請求", "points": [{"aspect": "設例", "text": "設例の所在と事案：遡及効の（＊）の位置づけで置かれた問題。Aの選任決議が取り消された場合に、代表取締役Aと取引したBが甲社へ代金支払請求できるか"}], "articles": [], "pages": [18]}, {"id": "book-kigyoho-01-ch02-r007", "ch": 2, "topic": "株主総会決議無効確認の訴え（830条2項）", "points": [{"aspect": "原則", "text": "無効原因（無効事由）は「決議の内容が法令に違反すること」"}, {"aspect": "結論", "text": "無効確認判決の効力：対世効（838条）があり、決議は当初から無効（839条参照）"}, {"aspect": "条文", "text": "830条・331条・335条・109条・425条・838条・839条"}], "articles": ["830条", "331条", "335条", "109条", "425条", "838条", "839条"], "pages": [19]}, {"id": "book-kigyoho-01-ch02-r008", "ch": 2, "topic": "株主総会決議不存在確認の訴え（830条1項）", "points": [{"aspect": "原則", "text": "不存在原因は「決議が存在しないこと」であり、①実際決議の事実がない場合と、②著しい手続的瑕疵ゆえに決議不存在と法律上評価される場合の2つがある"}, {"aspect": "結論", "text": "不存在の訴えの位置づけ：決議の効力の早期確定の要請を犠牲にしてでも効力を争わせることが望ましいほど手続の瑕疵が著しい場合の訴えである"}, {"aspect": "結論", "text": "解釈：「決議が存在しないこと」には決議の事実がないことのみならず、著しい手続的瑕疵があり決議不存在と評価される場合も含まれる"}, {"aspect": "結論", "text": "⑯例1：発行済株式の約77％を有する株主に対する招集通知漏れは著しい299条1項違反という手続的瑕疵があり、決議不存在が認められる（大阪高判令和3・7・30）"}, {"aspect": "結論", "text": "⑯例2：議決権の21％を有する株主への招集通知を欠いたうえ委任状を偽造してなされた決議→不存在事由を肯定（名古屋高判平成30・4・18）"}, {"aspect": "結論", "text": "不存在確認判決の効力：対世効（838条）があり、決議は当初から不存在（839条参照）"}, {"aspect": "あてはめ", "text": "不存在の判断では、瑕疵の客観的内容だけでなく、招集権者が反対株主を排除する目的の有無など主観的態様も考慮すべきとの立場が有力である"}, {"aspect": "条文", "text": "830条・298条・296条・299条・838条・839条"}], "articles": ["830条", "298条", "296条", "299条", "838条", "839条"], "pages": [20, 21]}, {"id": "book-kigyoho-01-ch02-r009", "ch": 2, "topic": "全員出席総会（招集手続を欠く総会の効力）", "points": [{"aspect": "趣旨", "text": "修正規範：招集手続の趣旨は株主に総会への出席の機会と準備の余裕を与えることにあるため、招集権者による招集手続を欠いても株主全員が開催に同意し出席した場合は株主が自ら利益を放棄したといえ、総会決議は有効となる"}, {"aspect": "原則", "text": "300条（招集手続の省略）との相違1：300条は欠席した株主がいても決議が有効となる規定であり、事前の同意でなければならないと考えられている"}, {"aspect": "原則", "text": "300条との相違2：300条で省略できるのは299条の手続（招集期間の短縮・招集通知の省略）のみで、招集の決定（298条）は省略できない"}, {"aspect": "結論", "text": "原則：株主総会は取締役会の招集決定（298条4項）により代表取締役が招集するものであり（296条3項）、取締役を辞任したAが招集した本件総会決議は不存在であるのが原則（830条1項参照）"}, {"aspect": "結論", "text": "代理人出席の場合：株主が議題を了知したうえで代理人を出席させ、決議がその議題の範囲内で行われるものであれば、招集手続の瑕疵は治癒され決議は有効に成立する"}, {"aspect": "条文", "text": "300条・299条・298条・296条・830条"}], "articles": ["300条", "299条", "298条", "296条", "830条"], "pages": [22, 24]}, {"id": "book-kigyoho-01-ch02-r010", "ch": 2, "topic": "「株主総会の決議の効力について論じなさい」問題の検討順序と答案パターン", "points": [{"aspect": "結論", "text": "要件を満たさなければ総会決議は有効。要件を満たせば、当初から第三者との関係でも決議は無効・不存在となる（838条、839条参照）"}, {"aspect": "あてはめ", "text": "検討順序：「決議の効力について論じなさい」とくれば、①決議取消しの訴え（831条1項）②決議無効確認の訴え（830条2項）③決議不存在確認の訴え（830条1項）の要件を満たすかを検討する"}, {"aspect": "あてはめ", "text": "答案の基本パターン：原則（条文の形式適用、判例など）→不都合→修正規範（趣旨から規範を作る）→あてはめ、の流れをマスターする"}, {"aspect": "条文", "text": "831条・830条・838条・839条"}], "articles": ["831条", "830条", "838条", "839条"], "pages": [23]}, {"id": "book-kigyoho-01-ch02-r011", "ch": 2, "topic": "裁量棄却（831条2項）", "points": [{"aspect": "趣旨", "text": "裁量棄却の趣旨：招集手続・決議方法の法令定款違反は軽微な瑕疵であり、再度やり直しても同じ結果となると考えられるから"}, {"aspect": "原則", "text": "831条2項：招集手続又は決議方法が法令・定款に違反するときでも、違反する事実が重大でなく、かつ、決議に影響を及ぼさないものと認めるときは、裁判所は取消しの請求を棄却できる"}, {"aspect": "要件", "text": "裁量棄却の要件は、①決議取消しの訴えがあること、②招集手続又は決議方法が法令又は定款に違反すること、③裁判所が違反する事実が重大でなく、かつ、決議に影響を及ぼさないものと認めること"}, {"aspect": "結論", "text": "効果：裁判所の裁量で取消しの訴え（請求）を認めないことができる（裁量棄却肯定）ので、株主総会の決議は有効となる"}, {"aspect": "結論", "text": "検討判例①最判昭和46・3・18：有効な取締役会決議に基づかない招集で、招集通知の発送も法定期間より2日遅れた事案。2日遅れは株主に出席と準備の余裕を与える趣旨から「違反する事実は重大」といえ、裁量棄却は否定され決議は取り消される"}, {"aspect": "結論", "text": "「違反する事実が重大」かの判断方法：最高裁は株主の権利侵害の有無によって判断（趣旨から判断）。下級審裁判例は株主の「実質的」な権利侵害の有無を重視し、瑕疵が治癒または実質的な違反がなかったと評価できるかを考慮する"}, {"aspect": "結論", "text": "検討判例②東京地判平成24・9・11：監査役会の同意を欠く監査役選任決議について監査役が追認し特段の異議を述べなかった事案では、重大な違反事実はなく決議の結果に影響を及ぼさないとして裁量棄却を肯定"}, {"aspect": "あてはめ", "text": "答案での扱い：設問が「決議の効力」の論じなさい問題か→問題文に招集手続・決議方法の法令定款違反の事実があるか→違反が重大か・決議に影響を及ぼすかの事実があるか、の順に探し、該当すれば裁量棄却を多く書く。書くか悩んだら短く書く"}, {"aspect": "条文", "text": "831条・299条"}], "articles": ["831条", "299条"], "pages": [25, 26, 27]}, {"id": "book-kigyoho-01-ch02-r012", "ch": 2, "topic": "（論点）取締役会設置会社である非公開会社における、株主総会決議により代表取締役を選定する旨の定款の効力", "points": [{"aspect": "原則", "text": "295条2項：取締役会設置会社において株主総会は、法律及び定款で定めた事項に限り決議できる"}, {"aspect": "結論", "text": "結論：取締役会の決議によるほか株主総会の決議によっても代表取締役を定めることができる旨の定款の定めは有効であり、Aは代表取締役といえるので乙社の代金請求は認められる"}, {"aspect": "結論", "text": "有効とする理由：定款により株主総会の権限とできる範囲を制限する明文規定はなく、株主総会決議による選定を認めても取締役会の権限（362条2項3号）は否定されず、取締役会の監督権限の実効性を失わせるとはいえない"}, {"aspect": "条文", "text": "295条・362条"}], "articles": ["295条", "362条"], "pages": [28]}, {"id": "book-kigyoho-01-ch02-r013", "ch": 2, "topic": "株主総会の招集通知（299条）と招集手続の省略・全員出席総会", "points": [{"aspect": "趣旨", "text": "招集通知期間の趣旨は、株主の出席の機会と準備の余裕を与えるため"}, {"aspect": "趣旨", "text": "300条ただし書きの趣旨：書面・電子投票制度を採用した場合は招集手続は省略されない。参考書類は招集通知とともに交付されるため、招集通知が不要となれば参考書類も交付できなくなるから"}, {"aspect": "原則", "text": "299条1項（原則）：株主総会を招集するには、取締役は株主総会の日の二週間（公開会社でない会社では一週間、取締役会非設置会社で定款で下回る期間を定めた場合はその期間）前までに株主に対して通知を発しなければならない"}, {"aspect": "結論", "text": "例外②全員出席総会：招集権者による適法な招集手続がなくても、株主全員が開催に同意して出席した全員出席総会は適法に成立する（最判昭和60・12・20）"}, {"aspect": "あてはめ", "text": "299条1項の詳細趣旨の前提知識：①非公開会社は株式譲渡が困難で株主間のつながり・個性がある、②参考書類は招集通知とともに交付される、③取締役会非設置会社の株主総会は一切の事項を決議できる（295条1項）のは株主に会社経営の意思も能力もあるから"}, {"aspect": "条文", "text": "299条・300条・301条・302条・295条"}], "articles": ["299条", "300条", "301条", "302条", "295条"], "pages": [29]}, {"id": "book-kigyoho-01-ch02-r014", "ch": 2, "topic": "株主提案権（303条〜305条）", "points": [{"aspect": "趣旨", "text": "株主提案権の趣旨：株主の意見を株主総会に反映させやすくすることを通じて、会社・株主、株主相互の意思疎通を図り、株主総会の活性化を図るため"}, {"aspect": "趣旨", "text": "303条が少数株主権を含むのに304条が単独株主権のみである理由に関わる区別：少数株主権の趣旨は株主権の濫用防止。議題とは「取締役選任の件」、議案とは「甲を取締役に選任する件」"}, {"aspect": "原則", "text": "3つの権利：a）議題提案権（303条）、b）議案提案権（304条）、c）議案の要領の通知請求権（305条）"}, {"aspect": "あてはめ", "text": "＜注意＞305条4項（内容の詳述は本レジュメにない）"}, {"aspect": "条文", "text": "303条・304条・305条・309条"}], "articles": ["303条", "304条", "305条", "309条"], "pages": [30, 31]}, {"id": "book-kigyoho-01-ch02-r015", "ch": 2, "topic": "議決権と一株一議決権の原則（308条）", "points": [{"aspect": "趣旨",
