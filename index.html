、取締役等選任権付種類株式を新たに付するには株主総会の特別決議（466条、309条2項11号）が必要で、反対株主の株式買取請求権はない"}, {"aspect": "条文", "text": "466条・309条"}], "articles": ["466条", "309条"], "pages": [160]}, {"id": "book-kigyoho-01-ch03-r008", "ch": 3, "topic": "種類株主に損害を及ぼすおそれがある場合の種類株主総会決議（322条）と111条の特則関係", "points": [{"aspect": "原則", "text": "ある種類株式の種類株主に損害を及ぼすおそれがある場合は、その種類株主総会の特別決議（322条1項1号、324条2項4号）が上記手続に加わる。111条は322条の特則で前者を優先する"}, {"aspect": "条文", "text": "322条・324条・111条"}], "articles": ["322条", "324条", "111条"], "pages": [160]}, {"id": "book-kigyoho-01-ch03-r009", "ch": 3, "topic": "決議の厳格さと各趣旨のキーワードの対応", "points": [{"aspect": "趣旨", "text": "キーワード対応：株主に不利益のおそれあり→特別決議、株主にもっと不利益のおそれあり→特殊決議、株主にもっともっと不利益のおそれあり→全員の同意"}], "articles": [], "pages": [159]}, {"id": "book-kigyoho-01-ch03-r010", "ch": 3, "topic": "株式の内容についての特別の定めと定款記載（107条）", "points": [{"aspect": "原則", "text": "株式の内容についての特別の定めは107条1項各号・107条2項各号の事項を「定款」に記載する"}, {"aspect": "条文", "text": "107条"}], "articles": ["107条"], "pages": [161]}, {"id": "book-kigyoho-01-ch03-r011", "ch": 3, "topic": "既存株式の全部を譲渡制限株式に変更する定款変更", "points": [{"aspect": "図表", "text": "表：既存株式の全部を譲渡制限株式に変更するには株主総会の特殊決議（466条、309条3項1号）が必要で、反対株主に株式買取請求権あり（116条1項1号）"}, {"aspect": "条文", "text": "466条・309条・116条"}], "articles": ["466条", "309条", "116条"], "pages": [161]}, {"id": "book-kigyoho-01-ch03-r012", "ch": 3, "topic": "既存株式の全部を取得請求権付株式に変更する定款変更", "points": [{"aspect": "図表", "text": "表：既存株式の全部を取得請求権付株式に変更するには株主総会の特別決議（466条、309条2項11号）が必要で、反対株主の株式買取請求権はない"}, {"aspect": "条文", "text": "466条・309条"}], "articles": ["466条", "309条"], "pages": [161]}, {"id": "book-kigyoho-01-ch03-r013", "ch": 3, "topic": "既存株式の全部を取得条項付株式に変更する定款変更", "points": [{"aspect": "図表", "text": "表：既存株式の全部を取得条項付株式に変更するには株主全員の同意（110条）が必要で、反対株主の株式買取請求権はない"}, {"aspect": "条文", "text": "110条"}], "articles": ["110条"], "pages": [161]}, {"id": "book-kigyoho-01-ch03-r014", "ch": 3, "topic": "定款変更の原則（特別決議）と特則（2つ）", "points": [{"aspect": "結論", "text": "株式会社の定款変更は原則として株主総会の特別決議（466条、309条2項11号）によるが、上記表のうち2つ（特殊決議と株主全員の同意）はその特則である"}, {"aspect": "条文", "text": "466条・309条"}], "articles": ["466条", "309条"], "pages": [161]}, {"id": "book-kigyoho-01-ch03-r015", "ch": 3, "topic": "株主平等原則の内容と趣旨（109条1項）", "points": [{"aspect": "趣旨", "text": "趣旨は、多数決の濫用や代表者の恣意的な業務執行行為から少数株主を保護し、株式投資を促すためである"}, {"aspect": "原則", "text": "109条1項：株式会社は、株主を、その有する株式の内容及び数に応じて、平等に取り扱わなければならない"}, {"aspect": "条文", "text": "109条"}], "articles": ["109条"], "pages": [162]}, {"id": "book-kigyoho-01-ch03-r017", "ch": 3, "topic": "（論点）株主平等原則違反の決議・行為等の効力", "points": [{"aspect": "原則", "text": "問題の所在：ある定款規定・決議・行為等が株主平等原則（109条1項）に反するかどうかが問題となる"}, {"aspect": "結論", "text": "同条に反する定款規定、株主総会決議、取締役会決議、代表取締役の行為も、①合理的目的を有し、②区別の程度が軽微であり、③株主に不測の損害をあたえないならば、株主平等原則に反しないと解する"}, {"aspect": "あてはめ", "text": "注：従来の論対レジュメの論証を、最近の学説の有力説に変更したものである"}, {"aspect": "あてはめ", "text": "株主平等原則に反する株主総会決議は内容の109条1項違反（法令違反）があるので、訴えは株主総会決議無効確認の訴え（830条2項）となる"}, {"aspect": "条文", "text": "109条・830条"}], "articles": ["109条", "830条"], "pages": [162]}, {"id": "book-kigyoho-01-ch03-r018", "ch": 3, "topic": "（論点）株主優待制度と株主平等原則", "points": [{"aspect": "設例", "text": "（問題）甲社は、株主優待制度目当ての個人投資家による投資を促すため、長年、保有株式1000株までの株主には500円の商品券5枚、1万株までの株主には同商品券10枚を進呈してきた"}, {"aspect": "設例", "text": "（解答例）進呈行為は投資促進という合理的目的のためであり、金額も比較的少額で区別の程度も軽微であり、長年なされ制度内容が相当程度周知され株主に不測の損害を与えないため、株主平等原則に反しない"}], "articles": [], "pages": [163]}, {"id": "book-kigyoho-01-ch03-r019", "ch": 3, "topic": "（論点）特定の株主に対する贈与契約", "points": [{"aspect": "結論", "text": "（A）会社法制定前の判例（最判昭和45・11・24）に基づく論証：贈与は形式的には株主としての資格に基づく法律関係ではないが、実質的には剰余金の配当であり株主としての資格に基づく法律関係にあたるため、454条3項に違反し、株主平等原則に反する"}, {"aspect": "結論", "text": "（B）学説の有力説によると、決議に賛成してもらうためというのは合理的目的ではなく、損失填補の金銭100万円の贈与は区別の程度が軽微ではなく、周知され不測の損害を与えないものでもないため、株主平等原則に反する"}, {"aspect": "あてはめ", "text": "注：この事案は120条違反にもなる"}, {"aspect": "条文", "text": "120条・454条"}], "articles": ["120条", "454条"], "pages": [163]}, {"id": "book-kigyoho-01-ch03-r020", "ch": 3, "topic": "（論点）従業員持株制度による奨励金の支給", "points": [{"aspect": "結論", "text": "従業員持株制度は、株主としての資格に基づくものでなく、従業員資格に基づき会社が奨励金を支給するものであるから、株主平等原則の適用はない"}], "articles": [], "pages": [164]}, {"id": "book-kigyoho-01-ch03-r021", "ch": 3, "topic": "非公開会社における属人的な権利の定め（109条2項）", "points": [{"aspect": "趣旨", "text": "趣旨：非公開会社では株主の関係は緊密であるから、株式ではなく株主に着目して異なる取扱いを認めても不都合はないからである"}, {"aspect": "原則", "text": "非公開会社では属人的な権利の定めが認められる（109条2項）。例：1株主1議決権"}, {"aspect": "条文", "text": "109条"}], "articles": ["109条"], "pages": [164]}, {"id": "book-kigyoho-01-ch03-r022", "ch": 3, "topic": "株券の定義", "points": [{"aspect": "原則", "text": "株券とは、株式を表章する有価証券である"}], "articles": [], "pages": [165]}, {"id": "book-kigyoho-01-ch03-r023", "ch": 3, "topic": "（論点）株券の効力発生時期（成立時期）", "points": [{"aspect": "原則", "text": "問題の所在：Cは善意取得（131条2項）できるか。株主に交付されてなくても作成によって「株券」（131条2項）が成立しているか（有効になっているか）が問題となる"}, {"aspect": "結論", "text": "交付時説：株券の効力は、会社が株券を作成して株主に交付した時に生じる。交付までは株券は株主の支配下になく喪失によって株式を失わせるべき基礎がなく、株券発行には株主権の流通を意欲する会社の意思表示が必要で、その効力発生には株主への到達が必要だからである（民法97条1項参照）"}, {"aspect": "結論", "text": "判例の立場（交付時説）であれば、会社が株券を作成して株主に郵送したが郵送中に盗まれた場合、株券と同じ外観をした紙切れを盗まれたに過ぎないことになる（したがって、善意取得はあり得ない）"}, {"aspect": "条文", "text": "131条・97条"}], "articles": ["131条", "97条"], "pages": [165]}, {"id": "book-kigyoho-01-ch03-r024", "ch": 3, "topic": "株券に関する効力（資格授与的効力・免責的効力・善意取得）", "points": [{"aspect": "原則", "text": "株券に関する効力は、資格授与的効力（131条1項）、免責的効力、善意取得（131条2項）である"}, {"aspect": "条文", "text": "131条"}], "articles": ["131条"], "pages": [165]}, {"id": "book-kigyoho-01-ch03-r025", "ch": 3, "topic": "株式譲渡自由の原則（127条）とその趣旨", "points": [{"aspect": "趣旨", "text": "趣旨：株主が有限責任（104条）しか負わない株式会社では会社財産の実質的払戻しに厳格な規制があるため（461条）投下資本回収の方法として株式譲渡を認める必要があり、また所有と経営が制度的に分離されている（326条1項）ため株主の個性は問題とならず自由な交替を認めても影響がない。そこで株式譲渡自由の原則が要請される"}, {"aspect": "原則", "text": "株式譲渡自由の原則は127条に定められる"}, {"aspect": "あてはめ", "text": "答案では譲渡を認める必要性と許容性を書く"}, {"aspect": "条文", "text": "127条・104条・461条・326条"}], "articles": ["127条", "104条", "461条", "326条"], "pages": [166]}, {"id": "book-kigyoho-01-ch03-r026", "ch": 3, "topic": "譲渡制限の類型（法律・定款・契約）と基本的視点", "points": [{"aspect": "趣旨", "text": "基本的視点：株式譲渡自由の原則（127条）は基本的には唯一の投下資本回収手段といえるので自由譲渡性は可能な限り保障されなければならず、例外的に制限を規定する条文はできるだけ最小限の制限になるように解釈しなければならない"}, {"aspect": "原則", "text": "譲渡制限の類型：（1）法律による譲渡制限（権利株・株券発行前・自己株式取得・子会社による親会社株式取得）、（2）定款による譲渡制限（107条1項1号、108条1項4号）、（3）契約による譲渡制限（会社と株主間・株主相互間）"}, {"aspect": "条文", "text": "107条・108条・127条"}], "articles": ["107条", "108条", "127条"], "pages": [166]}, {"id": "book-kigyoho-01-ch03-r027", "ch": 3, "topic": "権利株の譲渡制限（35条・50条2項・63条2項・208条4項）", "points": [{"aspect": "趣旨", "text": "趣旨は、設立手続または募集株式発行手続の混乱防止（会社の利益保護）である"}, {"aspect": "原則", "text": "株主となる権利の譲渡は、成立後の株式会社に対抗することができない（35条、50条2項、63条2項、208条4項）"}, {"aspect": "原則", "text": "各条文の対象：35条は出資の履行前の発起人、50条2項は出資の履行後の発起人、63条2項は設立時募集株式の引受人、208条4項は募集株式の引受人について定める"}, {"aspect": "条文", "text": "35条・50条・63条・208条"}], "articles": ["35条", "50条", "63条", "208条"], "pages": [167]}, {"id": "book-kigyoho-01-ch03-r028", "ch": 3, "topic": "（論点）権利株譲渡の効力", "points": [{"aspect": "原則", "text": "対抗とは、有効に成立している法律関係または事実を当事者以外のものに主張することである"}, {"aspect": "結論", "text": "権利株の譲渡は譲渡当事者間においては有効と解する。50条2項や208条4項などは株式譲受人の会社への対抗を規定しているにすぎず当事者間の効力を否定しておらず、そう解しても混乱防止の趣旨は達成できるからである"}, {"aspect": "結論", "text": "権利株の譲渡は会社に対する関係においても有効であり、会社の側から権利株の譲渡を認めることは可能である。これらの規定は会社への対抗を規定しているにすぎず、趣旨が会社の利益保護にある以上、会社がその利益を放棄して自発的に認めることを禁ずる必要はないからである"}, {"aspect": "条文", "text": "50条・208条"}], "articles": ["50条", "208条"], "pages": [167]}, {"id": "book-kigyoho-01-ch03-r029", "ch": 3, "topic": "株券発行前の株式譲渡の制限（128条2項）", "points": [{"aspect": "趣旨", "text": "趣旨は、株券発行事務の混乱防止のためである（会社の利益保護）"}, {"aspect": "原則", "text": "128条2項：株券の発行前にした譲渡は、株券発行会社に対し、その効力を生じない"}, {"aspect": "条文", "text": "128条"}], "articles": ["128条"], "pages": [168]}, {"id": "book-kigyoho-01-ch03-r030", "ch": 3, "topic": "（論点）株券発行前の株式譲渡の効力", "points": [{"aspect": "結論", "text": "株券発行前の株式譲渡は、譲渡当事者間においては有効であるが、会社に対する関係では無効である。発券事務の混乱防止の趣旨からは会社に対する効力を否定すれば足り、128条2項は会社に対する効力を否定しているに過ぎず当事者間の効力を否定していないからである"}, {"aspect": "条文", "text": "128条"}], "articles": ["128条"], "pages": [168]}, {"id": "book-kigyoho-01-ch03-r031", "ch": 3, "topic": "（論点）会社から株券発行前の株式譲渡の会社に対する効力を認めることの可否", "points": [{"aspect": "結論", "text": "会社は当該譲渡の効力を認めることはできない。128条2項は「会社に対し，その効力を生じない」と明文で規定している以上、当該譲渡は会社との関係では無効と解すべきだからである（権利株の場合と結論が異なる）"}, {"aspect": "あてはめ", "text": "判例はないが、上記の立場が多数説といえる"}, {"aspect": "条文", "text": "128条"}], "articles": ["128条"], "pages": [169]}, {"id": "book-kigyoho-01-ch03-r032", "ch": 3, "topic": "（論点）会社による株券長期間不発行の場合の株券発行前の株式譲渡の効力", "points": [{"aspect": "原則", "text": "問題の所在：遅滞なく株券を発行する義務を負う（215条1項）にもかかわらず株券発行会社が長期間株券を発行しない場合にも、株券なしで行われた株式譲渡は会社に対して効力を有しないかが問題となる"}, {"aspect": "結論", "text": "合理的期間説：128条2項の「株券の発行前」とは「発券事務の混乱を防止する合理的期間が経過する前」と解釈でき、合理的期間経過後は128条2項の適用はなく、株主は単なる意思表示によって株式を譲渡でき、株券なしの譲渡も会社に対して効力を生じる"}, {"aspect": "結論", "text": "判例自体（最判昭和47・11・8）は上記合理的期間説に立っているか定かではない"}, {"aspect": "条文", "text": "215条・128条"}], "articles": ["215条", "128条"], "pages": [169]}, {"id": "book-kigyoho-01-ch03-r033", "ch": 3, "topic": "自己株式の取得制限・子会社による親会社株式の取得禁止（後述への参照）", "points": [{"aspect": "原則", "text": "法律による譲渡制限のうち、ウ自己株式の取得制限（155条〜）とエ子会社による親会社株式の原則的取得禁止（135条）はともに後述とされている（自己株式は本単位の項目8、子会社による親会社株式取得は第3章項目9以降の範囲）"}, {"aspect": "条文", "text": "155条・135条"}], "articles": ["155条", "135条"], "pages": [169]}, {"id": "book-kigyoho-01-ch03-r034", "ch": 3, "topic": "定款による譲渡制限の趣旨と承認機関（139条）", "points": [{"aspect": "趣旨", "text": "趣旨：会社にとって好ましくない者が株式取得によって対会社関係に入ってくることを防止するためである"}, {"aspect": "原則", "text": "承認機関（139条）：取締役会設置会社にあっては取締役会決議、株主総会の場合は普通決議。「定款に別段の定め」の例として、取締役会設置会社において株主総会を承認機関とすること、代表取締役を承認機関とすることがある"}, {"aspect": "条文", "text": "139条・136条・138条・137条"}], "articles": ["139条", "136条", "138条", "137条"], "pages": [170]}, {"id": "book-kigyoho-01-ch03-r035", "ch": 3, "topic": "会社が譲渡を承認しない場合の手続（会社による買取・指定買取人の指定）", "points": [{"aspect": "趣旨", "text": "会社が買い取る場合に株主総会の特別決議に限るのは、会社にとっては自己株式の取得であって弊害があるからである"}, {"aspect": "原則", "text": "会社が買い取る場合（140条1項〜3項）：140条2項の株主総会の決議は特別決議である（309条2項1号）。譲渡等承認請求者（＝自己株式の売主）は議決権なし（140条3項）"}, {"aspect": "原則", "text": "指定買取人の指定（140条4項5項）：株主総会（取締役会設置会社にあっては取締役会）の決議、または定款に別段の定めによる。140条5項の株主総会の決議は特別決議である"}, {"aspect": "原則", "text": "（重要）議決権がない自己株式の売主は3つ：175条2項、140条3項、160条4項"}, {"aspect": "条文", "text": "140条・309条・175条・160条"}], "articles": ["140条", "309条", "175条", "160条"], "pages": [170]}, {"id": "book-kigyoho-01-ch03-r036", "ch": 3, "topic": "（論点）会社の承認を欠く譲渡制限株式の譲渡の効力", "points": [{"aspect": "原則", "text": "問題の所在：会社の承認を得ずに行われた譲渡制限株式の譲渡の効力が問題となる"}, {"aspect": "結論", "text": "譲渡は譲渡当事者間では有効であるが、会社に対する関係では無効である。法は株式取得者からの買取先指定請求の規定（138条2号ハ）を設け当事者間では有効であることを前提としており、制度の趣旨達成には会社に対する関係で無効とすれば足りるからである"}, {"aspect": "結論", "text": "最判昭和48・6・15、最判昭和63・3・15の立場である"}, {"aspect": "あてはめ", "text": "用語：「買取先指定請求」＝買取人指定請求であり、指定買取人請求とはいわない"}, {"aspect": "条文", "text": "138条"}], "articles": ["138条"], "pages": [171]}, {"id": "book-kigyoho-01-ch03-r037", "ch": 3, "topic": "（論点）会社の承認を欠く譲渡制限株式の譲渡の効力＜一人会社の場合＞", "points": [{"aspect": "原則", "text": "問題の所在：一人株主が会社の承認を得ずに保有する譲渡制限株式を他人に譲渡した場合でも、会社に対する関係ではやはり無効と解すべきかが問題となる"}, {"aspect": "結論", "text": "一人株主が譲渡する場合は他の株主の利益保護を考慮する必要はないから、会社の承認がなくても会社に対する関係でも譲渡は有効である。制度の趣旨は好ましくない者の取得防止を通じて譲渡株主以外の株主の利益を保護するためである"}, {"aspect": "結論", "text": "最判平成5・3・30の立場である"}], "articles": [], "pages": [171]}, {"id": "book-kigyoho-01-ch03-r038", "ch": 3, "topic": "（論点）譲渡株主以外の全株主が譲渡に同意している場合", "points": [{"aspect": "原則", "text": "問題の所在：会社の承認なく譲渡制限株式が譲渡された場合でも、他の全株主が譲渡に同意していた場合、会社に対する関係で譲渡はなお無効のままかが問題となる"}, {"aspect": "結論", "text": "譲渡株主以外の全株主が同意している場合、譲渡株主以外の株主の利益は害されることはないので、会社の承認がなくても会社に対する関係でも譲渡は有効である"}, {"aspect": "結論", "text": "最判平成9・3・27の立場である"}], "articles": [], "pages": [172]}, {"id": "book-kigyoho-01-ch03-r039", "ch": 3, "topic": "（論点）譲渡等承認請求がない場合に、会社から譲受人に権利行使を認めることの可否", "points": [{"aspect": "結論", "text": "譲渡は当事者間では有効だが会社に対する関係では無効であり、会社は譲渡人を株主として扱う義務を負う。以上より、代表取締役Xの措置（譲受人Bへの招集通知の発送）は違法である"}, {"aspect": "結論", "text": "最判平成9・9・9、最判昭和63・3・15の立場である"}], "articles": [], "pages": [172]}, {"id": "book-kigyoho-01-ch03-r040", "ch": 3, "topic": "自己株式取得の4つの弊害と各弊害への対応", "points": [{"aspect": "原則", "text": "4つの弊害：①会社債権者を害する（対価の支払いは実質的には株主への出資の払い戻しであり会社財産を減少させるから）、②株主平等の原則（109条1項）に反する（株主AとBとで不平等）、③会社支配の不公正を招く（甲社自体が自己株式に議決権を持つことなどによって）、④株式取引の公正を害する（投資家を害する）"}, {"aspect": "結論", "text": "各弊害への対応：①は財源規制（分配可能額規制）で、②は取得手続規制で、③は自己株式には議決権を否定（308条2項）すること等で、④は金融商品取引法の規制で対応できるので、自己株式の取得は原則禁止されない"}, {"aspect": "結論", "text": "論証文：自己株式の取得が自由になされると4つの弊害が生じる。そこで、これらの弊害に対応するため、財源規制・取得手続規制に服する場合に広く自己株式の取得も認められている"}, {"aspect": "条文", "text": "109条・308条"}], "articles": ["109条", "308条"], "pages": [173]}, {"id": "book-kigyoho-01-ch03-r041", "ch": 3, "topic": "自己株式の取得が可能な場合の一覧（155条）", "points": [{"aspect": "あてはめ", "text": "116条1項、182条の4第1項の株式買取請求については、464条1項の独自の規制がある"}, {"aspect": "条文", "text": "168条・170条・144条・461条・156条・165条・166条・167条・171条・173条・174条・177条・192条・193条・197条・234条・235条・27条・116条・469条・182条・464条"}], "articles": ["168条", "170条", "144条", "461条", "156条", "165条", "166条", "167条", "171条", "173条", "174条", "177条", "192条", "193条", "197条", "234条", "235条", "27条", "116条", "469条", "182条", "464条"], "pages": [174]}, {"id": "book-kigyoho-01-ch03-r042", "ch": 3, "topic": "株主との合意による有償取得の原則的取得方法の手続（156条〜159条）", "points": [{"aspect": "原則", "text": "原則的取得方法（すべての株主を対象に、156条〜159条）：①156条「あらかじめ」株主総会の普通決議で株式取得事項の決定（取得枠の決定）、②157条「その都度」取締役会の決定（取得の決定）、③158条すべての株主に決定した取得価格等の通知・公告して売却を勧誘、④159条株主の申込み、承諾したものとみなす（売買契約成立）"}, {"aspect": "あてはめ", "text": "「手続の流れ」も①〜④の順である。会計監査人設置会社で459条の要件を満たせば、①の株主総会の決議は不要になる（459条1項1号）"}, {"aspect": "条文", "text": "156条・159条・157条・158条・459条"}], "articles": ["156条", "159条", "157条", "158条", "459条"], "pages": [175]}, {"id": "book-kigyoho-01-ch03-r043", "ch": 3, "topic": "特定の株主からの取得の手続規制（160条）", "points": [{"aspect": "趣旨", "text": "160条1項の趣旨：株主間で不平等が生じるおそれがあるため。また、会社が特定の株主から不当に高い価格で自己株式を取得することで他の株主が損失を被ったり（株主間の利益移転）、不当な目的で取得したりする（会社支配の不公正）危険性が高いため"}, {"aspect": "趣旨", "text": "160条2項3項の趣旨：株主に平等に投下資本回収の機会を与えるため"}, {"aspect": "趣旨", "text": "160条4項の趣旨：決議の公平を保つため"}, {"aspect": "原則", "text": "特定の株主からの取得の概要：株主Bに不利益・不平等が生じるため、①株主総会の特別決議（160条1項、309条2項2号かっこ書き）と「その都度」の取締役会決議による自己株式取得（157条）、②売主追加請求（160条2項3項）が取得手続規制として課される。適用条文は156条〜159条・160条"}, {"aspect": "原則", "text": "手続①の正確な内容：「あらかじめ」株主総会の特別決議で、156条1項の事項に併せて「特定の株主」に対してのみ158条の通知を行う旨を決定する（160条1項）。「特定の株主」の氏名・名称も決議事項と解されている。株主に売主追加請求できる旨の通知（160条2項）。株主は「特定の株主に自己をも含めたもの」を株主総会の議案にすることを会社に請求（＝売主追加請求）できる（160条3項）。「特定の株主」（売主追加請求権行使者も含む）は議決権を行使できない（160条4項）"}, {"aspect": "原則", "text": "手続②：157条「その都度」取締役会の決定で取得を決定する"}, {"aspect": "原則", "text": "手続③④：158条・160条5項により特定の株主に対してのみ決定した取得価格等の通知・公告して売却を勧誘し、159条により株主の申込みで承諾したものとみなされ売買契約が成立する"}, {"aspect": "原則", "text": "手続の流れ全体：160条2項（全株主への通知）→160条3項→156条1項・160条1項→157条→158条1項・160条5項（特定の株主への通知・売却勧誘）→159条→自己株式の取得"}, {"aspect": "あてはめ", "text": "取締役会非設置会社の場合の決定機関については争いがあり、1つの考えは取締役の過半数の決定（348条2項）である（p175の（A）原則的取得方法と同文が再掲）"}, {"aspect": "あてはめ", "text": "ただし、161条・162条・164条の場合は、売主追加請求の手続（160条2項3項）は不要である"}, {"aspect": "条文", "text": "160条・309条・157条・156条・159条・158条・348条・161条・162条・164条"}], "articles": ["160条", "309条", "157条", "156条", "159条", "158条", "348条", "161条", "162条", "164条"], "pages": [176, 177]}, {"id": "book-kigyoho-01-ch03-r044", "ch": 3, "topic": "市場価格のある株式の取得の特則（161条）", "points": [{"aspect": "趣旨", "text": "趣旨：市場価格ある株式については他の株主は市場において株式を売却する機会を有するから要保護性がなく、また市場価格以下で取得する場合は他の株主を害するおそれがないからである"}, {"aspect": "原則", "text": "161条（市場価格のある株式の取得の特則）：売主追加請求権の規定（160条2項3項）を適用しない"}, {"aspect": "条文", "text": "161条・160条"}], "articles": ["161条", "160条"], "pages": [177]}, {"id": "book-kigyoho-01-ch03-r045", "ch": 3, "topic": "相続人等からの取得の特則（162条）", "points": [{"aspect": "趣旨", "text": "趣旨：非公開会社で、相続等により当該会社にとって好ましくない者が株主となった場合に、当該株主も株式を手放すことに異論がないときは、その状態を解消しやすくする必要があるからである"}, {"aspect": "原則", "text": "162条（相続人等からの取得の特則）：売主追加請求権の規定（160条2項3項）を適用しない"}, {"aspect": "条文", "text": "162条・160条"}], "articles": ["162条", "160条"], "pages": [178]}, {"id": "book-kigyoho-01-ch03-r046", "ch": 3, "topic": "定款で売主追加請求排除（164条）", "points": [{"aspect": "趣旨", "text": "趣旨：株主全員の同意を必要とする定款規定（164条2項）に基づくのであれば、会社が合意により特定の株主のみから自己株式を有償取得することを認めても、他の株主に不測の損害を与えるおそれは小さいからである"}, {"aspect": "原則", "text": "164条（定款で売主追加請求排除）：161条・162条と同様、売主追加請求権（160条2項3項）が排除されるだけである"}, {"aspect": "条文", "text": "164条・161条・162条・160条"}], "articles": ["164条", "161条", "162条", "160条"], "pages": [178]}, {"id": "book-kigyoho-01-ch03-r047", "ch": 3, "topic": "子会社からの株式の取得（163条）", "points": [{"aspect": "趣旨", "text": "趣旨：子会社は相当の時期に親会社株式を処分しなければならない（135条3項）が、その処分が容易でない場合もあるため、容易に親会社が子会社保有の親会社株式を取得することを可能にしたものである"}, {"aspect": "原則", "text": "163条：株主総会の普通決議、ただし取締役会設置会社では取締役会決議で、子会社から自己株式を取得できる。163条は①156条1項の適用の修正、②157条〜160条の適用排除を定める（普通決議で足りるのは165条1項が160条1項を除外しているためと記載）"}, {"aspect": "条文", "text": "163条・156条・157条・160条・165条・135条"}], "articles": ["163条", "156条", "157条", "160条", "165条", "135条"], "pages": [179]}, {"id": "book-kigyoho-01-ch03-r048", "ch": 3, "topic": "市場取引等による取得（165条）", "points": [{"aspect": "原則", "text": "165条：市場取引等による自己株式の取得は株主間に不平等が生じないし機動的な取得の要請から、株主総会の普通決議または定款に定めれば取締役会決議（取締役会設置会社の場合）で取得できる。165条1項は157条〜160条の適用排除、2項3項は156条1項の適用の修正を定める（普通決議で足りるのは165条1項が160条1項を除外しているため）"}, {"aspect": "条文", "text": "165条・157条・160条・156条"}], "articles": ["165条", "157条", "160条", "156条"], "pages": [179]}, {"id": "book-kigyoho-01-ch03-r049", "ch": 3, "topic": "財源規制（分配可能額規制）の趣旨（461条1項2号3号）", "points": [{"aspect": "趣旨", "text": "財源規制の趣旨：自己株式の有償取得は実質的には株主への会社財産の分配であるから、株主が有限責任（104条）しか負わない株式会社においては会社債権者を害するおそれがある。そこで財源規制が課された"}, {"aspect": "条文", "text": "104条"}], "articles": ["104条"], "pages": [179]}, {"id": "book-kigyoho-01-ch03-r050", "ch": 3, "topic": "取得請求権付株式・取得条項付株式・全部取得条項付種類株式の取得と財源規制", "points": [{"aspect": "原則", "text": "3類型の対比：取得請求権付株式は株主が会社に株式の取得を請求するもの、取得条項付株式は一定の事由の発生を条件に会社が取得するもの、全部取得条項付株式は株主総会の特別決議で会社が取得するもの。すべて会社から見れば自己株式の取得である。財源規制は順に166条1項ただし書き、170条5項、461条1項4号"}, {"aspect": "原則", "text": "168条（取得する日の決定）：107条2項3号ロに掲げる事項の定めがある場合、株式会社は同号ロの日を株主総会（取締役会設置会社にあっては取締役会）の決議によって定めなければならない。ただし定款に別段の定めがある場合はこの限りでない（取得条項付株式に関する注意すべき条文）"}, {"aspect": "原則", "text": "169条（取得する株式の決定等）：107条2項3号ハに掲げる事項の定めがある場合において取得条項付株式を取得しようとするときは、その取得する取得条項付株式を決定しなければならず（1項）、その株式は株主総会（取締役会設置会社にあっては取締役会）の決議によって定めなければならない。ただし定款に別段の定めがある場合はこの限りでない（2項）"}, {"aspect": "条文", "text": "166条・170条・461条・168条・107条・169条"}], "articles": ["166条", "170条", "461条", "168条", "107条", "169条"], "pages": [180]}, {"id": "book-kigyoho-01-ch03-r051", "ch": 3, "topic": "相続人等への売渡請求（174条〜177条）", "points": [{"aspect": "原則", "text": "譲渡の場合との比較：株式譲渡については定款で譲渡制限を定めればよい（107条1項1号、108条1項4号）が、「相続その他の一般承継」と「譲渡（特定承継）」は異なり、一般承継の場合は会社の承認は必要ない（134条4号参照）"}, {"aspect": "原則", "text": "174条：株式会社は、相続その他の一般承継により当該株式会社の株式（譲渡制限株式に限る）を取得した者に対し、当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。すなわち譲渡制限株式に定款で売渡請求権をつければよい"}, {"aspect": "原則", "text": "売渡請求の決定は株主総会の特別決議による（175条1項、309条2項3号）。売渡請求の相手方（自己株式の売主）は甲社株主だが議決権なし（175条2項）。p182の図は合併により甲株を取得したY会社に対する売渡請求の場面"}, {"aspect": "あてはめ", "text": "「相続その他の一般承継」なので、相続のみならず合併で出題される可能性があり、会社分割も含まれるかは争いがある"}, {"aspect": "条文", "text": "174条・177条・107条・108条・134条・175条・309条"}], "articles": ["174条", "177条", "107条", "108条", "134条", "175条", "309条"], "pages": [181, 182]}, {"id": "book-kigyoho-01-ch03-r052", "ch": 3, "topic": "財源規制（461条）と違反責任（462条）・自己株式の保有・消却・処分", "points": [{"aspect": "原則", "text": "（5）財源規制（分配可能額規制）（461条）：461条違反の剰余金の配当の効力は後述。461条違反責任は462条（しっかり読めるように）。462条1項は主体3者（A,B,C）と効果、2項はB,Cの（立証責任が転換された）過失責任、3項は総株主の同意による免除（B,Cに関して）"}, {"aspect": "原則", "text": "関連（自己株式の保有・消却・処分）：保有はいつまでも保有でき、「相当の時期に処分」しなければならないという規定は会社法では削除された。消却は178条（後述）で自己株式のみ消却できる（甲社はCが保有する甲株を消却できない）。処分は199条以下（後述）で「募集株式の発行等」の「等」にあたる"}, {"aspect": "条文", "text": "461条・462条・178条・199条"}], "articles": ["461条", "462条", "178条", "199条"], "pages": [183]}, {"id": "book-kigyoho-01-ch03-r053", "ch": 3, "topic": "適法な自己株式の法律上の地位（議決権・配当・残余財産）", "points": [{"aspect": "原則", "text": "議決権：308条2項「前項の規定にかかわらず、株式会社は、自己株式については、議決権を有しない。」"}, {"aspect": "原則", "text": "剰余金配当請求権：453条「株式会社は、その株主（当該株式会社を除く。）に対し、剰余金の配当をすることができる。」"}, {"aspect": "原則", "text": "残余財産分配請求権：504条3項は、残余財産の割当てに関する定めは株主（当該清算株式会社等を除く）の有する株式の数に応じて割り当てる内容でなければならないとする"}, {"aspect": "結論", "text": "要は、自己株式については自益権・共益権とも認められないということである"}, {"aspect": "条文", "text": "308条・453条・504条"}], "articles": ["308条", "453条", "504条"], "pages": [184]}, {"id": "book-kigyoho-01-ch03-r054", "ch": 3, "topic": "（論点）取得手続規制に違反した自己株式取得の効力", "points": [{"aspect": "原則", "text": "問題の所在：取得手続規制（156条から165条）に違反する自己株式取得の効力が問題となる"}, {"aspect": "原則", "text": "整理：取得手続違反の自己株式の取得の効力は無効（見出しの「所得」は原文ママ）"}, {"aspect": "結論", "text": "相対的無効説：株主平等原則（109条1項）に反するなど自己株式取得による弊害防止のために取得手続規制等を設けた趣旨からすれば、取得手続規制に違反した自己株式の取得は無効である。しかし、違法な取得であることにつき譲渡人が善意である場合は、取引の安全の観点から、会社は譲渡人に対して無効を主張できない"}, {"aspect": "あてはめ", "text": "上場会社が市場で自己株式を取得（買付け）する場合（165条）、市場取引は金融商品取引会社（証券会社）を通じて証券会社（問屋）の名で買付けが行われるため、譲渡人Aは甲社の取得手続違反について善意であることが通常であり、その無効を主張することは難しい"}, {"aspect": "あてはめ", "text": "無効の主張権者：①会社。ただし譲渡人が善意（有効と思っている場合）まで無効を主張できるのは取引の安全を害するので相対的無効説による。②譲渡人については下記の論点で扱う。一般原則からは「いつでも、誰でも、どんな方法でも」無効主張できるはずである点に注意"}, {"aspect": "条文", "text": "156条・165条・109条"}], "articles": ["156条", "165条", "109条"], "pages": [185]}, {"id": "book-kigyoho-01-ch03-r055", "ch": 3, "topic": "（論点）譲渡人からの無効主張の可否（自己株式取得の無効の主張権者）", "points": [{"aspect": "原則", "text": "問題の所在：自己株式の取得が無効と解される場合、会社がその無効を主張しないとき、譲渡人からの無効主張が認められるかが問題となる"}, {"aspect": "結論", "text": "①趣旨から：自己株式取得の手続規制の趣旨が株主間の公平を図るためであるから、手続規制違反による譲渡人からの自己株式取得の無効の主張は認められない。法的根拠になるのは本来①である"}, {"aspect": "結論", "text": "②妥当な結論から：譲渡人Aは対価を得ており契約目的を達成しているのであるから、Aによる無効主張を認める必要はない"}, {"aspect": "結論", "text": "東京高判平成元年2月27日"}, {"aspect": "あてはめ", "text": "①＝趣旨から、②＝妥当な結論から。答案スペースがあれば①・②両方書く方が良い。譲渡人からの無効主張を認めるべきとの有力説もある"}], "articles": [], "pages": [186]}, {"id": "book-kigyoho-01-ch03-r056", "ch": 3, "topic": "（論点）財源規制（461条）に違反した自己株式取得の効力", "points": [{"aspect": "結論", "text": "財源規制違反の取得は無効である。①461条1項は「分配可能額を超えてはならない」と規定していることから無効と解するのが自然であり、②461条が資本維持の原則（要請）から規定されたとの趣旨からもその違反は無効と解すべきである"}, {"aspect": "あてはめ", "text": "違法（財源規制違反）な剰余金の配当と同じ論証になる。答案スペースが少ない場合は①の理由だけを書くことが多い"}, {"aspect": "あてはめ", "text": "Aの善意悪意を問わず自己株式の取得は無効。Aに渡された対価は462条・463条の問題となり、Aからの無効主張が可能か論じなくても462条によってAは甲社に対価を返還しなければならない"}, {"aspect": "条文", "text": "461条・462条・463条"}], "articles": ["461条", "462条", "463条"], "pages": [187]}, {"id": "book-kigyoho-01-ch03-r057", "ch": 3, "topic": "子会社による親会社株式の取得禁止・例外・処分（135条）", "points": [{"aspect": "趣旨", "text": "135条1項の趣旨：親子会社間の経済的一体性や支配・従属関係から、取得を自由に認めると親会社からの実質的な出資の払戻しになるおそれや、親会社の経営者の不正な支配がなされるおそれがあるため"}, {"aspect": "原則", "text": "135条の構造：1項で原則取得禁止、2項で例外許容、3項で保有した場合に「相当の時期」に処分する。cf.163条。親会社・子会社の定義は2条3号4号"}, {"aspect": "原則", "text": "2項の例外：やむを得ない取得の場合は、例外的に親会社株式の取得が認められる"}, {"aspect": "条文", "text": "135条・163条・2条"}], "articles": ["135条", "163条", "2条"], "pages": [188]}, {"id": "book-kigyoho-01-ch03-r058", "ch": 3, "topic": "（論点）子会社が適法に保有している親会社株式の法律上の地位", "points": [{"aspect": "趣旨", "text": "議決権を否定する理由：親会社の支配の公正を害するおそれがあるため"}, {"aspect": "原則", "text": "子会社は保有する親会社株式については議決権を有しない（308条1項本文かっこ書）"}, {"aspect": "結論", "text": "議決権以外の共益権は、議決権の行使を前提とする権利は否定されるべきであるが、自益権は全て認められる（子会社と親会社は別法人格者であるため）"}, {"aspect": "条文", "text": "308条"}], "articles": ["308条"], "pages": [189]}, {"id": "book-kigyoho-01-ch03-r059", "ch": 3, "topic": "株主名簿の定義", "points": [{"aspect": "原則", "text": "株主名簿とは、株主及びその持ち株等に関する事項を明らかにするため、会社法上作成を要する帳簿をいう"}], "articles": [], "pages": [190]}, {"id": "book-kigyoho-01-ch03-r060", "ch": 3, "topic": "基準日制度（124条）と基準日後に株式を取得した者の権利行使（124条4項）", "points": [{"aspect": "趣旨", "text": "124条1項の趣旨：権利行使時における権利行使株主を一時に確定することを容易にするため（会社の利益）"}, {"aspect": "原則", "text": "124条4項：基準日株主が行使することができる権利が株主総会又は種類株主総会における議決権である場合、会社は基準日後に株式を取得した者の全部又は一部を権利行使者と定めることができる。ただし基準日株主の権利を害することができない"}, {"aspect": "あてはめ", "text": "I剰余金配当の利害株主はA。II合併に利害があるのはBとCだが、「議決権」については124条4項本文による。ただしAとB二人に議決権を認めるのは1株に2議決権を認めるのと同じで妥当でなく、124条4項ただし書によりAの同意等がない限りBは議決権を行使できない"}, {"aspect": "条文", "text": "124条"}], "articles": ["124条"], "pages": [190]}, {"id": "book-kigyoho-01-ch03-r061", "ch": 3, "topic": "名義書換の効力（確定的効力・資格授与的効力・免責的効力）", "points": [{"aspect": "原則", "text": "名義書換の効力：①確定的効力（会社への対抗力）（130条）②資格授与的効力③免責的効力"}, {"aspect": "条文", "text": "130条"}], "articles": ["130条"], "pages": [191]}, {"id": "book-kigyoho-01-ch03-r062", "ch": 3, "topic": "（論点）名義書換の不当拒絶（確定的効力の例外1）", "points": [{"aspect": "趣旨", "text": "株主名簿制度を設けた趣旨は会社の事務処理の便宜を図ることにある。会社が名義書換請求を不当に拒絶しておきながら130条を根拠に株主権の行使を認めないのは信義則（民法1条2項）に反する（会社の過失によって名義書換がなされなかった場合も同じ）"}, {"aspect": "結論", "text": "名義書換を不当拒絶された株式譲受人は、名義書換なくして、会社に対して株主として権利行使できる"}, {"aspect": "結論", "text": "最判昭和42・9・28の規範。判例は「会社の過失によって名義書換がなされなかった場合」についても同様とする（最判昭和41・7・28）"}, {"aspect": "あてはめ", "text": "株券がない問題の場合も、「適法に株式が譲渡されている以上（127条）、Bは適法な株主といえ、甲社が単にBが乗っ取りを企てていることを理由に…………」とあてはめれば良い"}, {"aspect": "条文", "text": "130条・1条・131条・127条・299条・308条・831条"}], "articles": ["130条", "1条", "131条", "127条", "299条", "308条", "831条"], "pages": [191, 192]}, {"id": "book-kigyoho-01-ch03-r063", "ch": 3, "topic": "（論点）会社側から譲受人の権利行使を許容することはできるか（確定的効力の例外2）", "points": [{"aspect": "趣旨", "text": "株主名簿制度の趣旨は会社の事務処理の便宜を図ることにあり、会社が自らこの利益を放棄して譲受人を株主として取り扱うことは認められてよい。また130条の文言は「会社に対抗することができない」と対抗要件にすぎない"}, {"aspect": "原則", "text": "問題設定：譲受人は名義書換を受けない限り会社に対して株主であることを対抗できない（130条、確定的効力）。しかし会社側から名義書換未了の譲受人を株主と認めて権利行使させることはできるか"}, {"aspect": "結論", "text": "会社が自己の危険において名義書換未了の株式譲受人を株主と認めて権利行使させることはできる"}, {"aspect": "条文", "text": "130条"}], "articles": ["130条"], "pages": [192, 193]}, {"id": "book-kigyoho-01-ch03-r064", "ch": 3, "topic": "名義書換失念の場合と会社の承諾なく譲渡制限株式を譲渡した場合の比較", "points": [{"aspect": "原則", "text": "□1 名義書換失念の場合（確定的効力の例外2）：会社が自己の危険において名義書換未了の株式譲受人を株主と認めて権利行使させることはできる"}, {"aspect": "原則", "text": "□2 会社の承諾なく譲渡制限株式を譲渡した場合：譲渡当事者間では有効であるが、会社に対する関係では株式譲渡は無効。会社は譲渡人を株主として取り扱う義務を負う"}, {"aspect": "結論", "text": "□2の場合、甲会社は自己の危険においてもBを株主として取り扱うことはできない。ここでは株主名簿の確定的効力の例外を認めない（最判平成9・9・9）"}, {"aspect": "あてはめ", "text": "□1と□2が矛盾しない理由：□1は名義書換の趣旨が会社の事務処理の便宜にすぎず条文の文言も「会社に対抗」であるのに対し、□2は承認機関の承認（139条1項）を「要する」（107条1項1号、108条1項4号）とされており、会社にとって好ましいかどうかを代表取締役による承認で判断させるべきでないため"}, {"aspect": "条文", "text": "139条・107条・108条"}], "articles": ["139条", "107条", "108条"], "pages": [193]}, {"id": "book-kigyoho-01-ch03-r065", "ch": 3, "topic": "失念株（剰余金配当・株式分割の場合）", "points": [{"aspect": "結論", "text": "1）剰余金配当：剰余金配当請求権は株主に対して法律上当然に認められた権利であるから（105条1項1号参照）、株式の譲渡に伴って譲受人（失念株主）に移転する。譲渡人が会社から配当を受けた場合は、譲受人は譲渡人に対して不当利得（民法703条）に基づき配当金相当額の返還を請求できる"}, {"aspect": "結論", "text": "2）株式分割：「株主は」分割「株式を取得する」（184条1項）のであるから、（ある意味）株主の権利といえる。したがって株式譲受人は分割株式の請求ができる"}, {"aspect": "結論", "text": "1）剰余金配当について最判昭和37・4・20、2）株式分割について最判平成19・3・8"}, {"aspect": "あてはめ", "text": "判断のポイントは「株主の権利」といえるものかである"}, {"aspect": "条文", "text": "703条・704条・105条・184条"}], "articles": ["703条", "704条", "105条", "184条"], "pages": [195]}, {"id": "book-kigyoho-01-ch03-r066", "ch": 3, "topic": "狭義の失念株（株主割当てで募集株式を発行した場合）", "points": [{"aspect": "原則", "text": "202条1項：株式会社は第199条1項の募集において株主に株式の割当てを受ける権利を与える「ことができる」。会社が与えても与えなくてもよいので、株主からみたら「権利」ではない"}, {"aspect": "結論", "text": "当事者間の結論：株式の割当てを受ける権利を与えるか否かは取締役会等が任意に決定できるから（202条1項3項）、法律上株主の当然の権利ではなく、株式譲渡に随伴して移転しない。また名義書換を失念したことに過失がある以上、譲受人が不利益を受けるのはやむをえない。したがって割当てを受ける権利は譲渡当事者間においても譲渡人に帰属し、譲受人（失念株主）は譲渡人に対して何らの請求もできない"}, {"aspect": "結論", "text": "最判昭和35・9・15の立場（譲渡人帰属説）である"}, {"aspect": "結論", "text": "会社との関係：株式譲受人は名義書換を失念している以上、会社に対して自己が株主であり募集株式の割当てを受ける権利を有していること、そして新株が自己のものであることを主張できない（130条、確定的効力）"}, {"aspect": "条文", "text": "202条・199条・130条"}], "articles": ["202条", "199条", "130条"], "pages": [195, 196]}, {"id": "book-kigyoho-01-ch03-r067", "ch": 3, "topic": "株式振替制度の概要（振替法）", "points": [{"aspect": "原則", "text": "「社債、株式等の振替に関する法律」（振替法）は平成16年成立・平成21年1月施行。上場会社はすべて同制度に参加し株券は廃止したため、上場株式の譲渡はすべて同法の振替制度によって行われている"}, {"aspect": "原則", "text": "振替法第七章（株式の振替）の構成：第一節通則（第百二十八条）、第二節振替口座簿（第百二十九条―第百三十九条）、第三節振替の効果等（第百四十条―第百四十九条）、第四節会社法等の特例（第百五十条―第百六十一条）、第五節雑則（第百六十二条）"}, {"aspect": "原則", "text": "振替法140条（振替株式の譲渡）：振替株式の譲渡は、振替の申請により、譲受人がその口座における保有欄に当該譲渡に係る数の増加の記載又は記録を受けなければ、その効力を生じない"}, {"aspect": "条文", "text": "140条"}], "articles": ["140条"], "pages": [197]}, {"id": "book-kigyoho-01-ch03-r068", "ch": 3, "topic": "株式の消却（178条）", "points": [{"aspect": "趣旨", "text": "取締役会決議・取締役の決定で足りる趣旨：消却の対象は自己株式のみであって他の株主に不利益がないので、株主総会決議まで要求する必要がないため"}, {"aspect": "原則", "text": "株式の消却とは、株式会社がその存続中に特定の自己株式を絶対的に消滅させる会社の行為をいう"}, {"aspect": "原則", "text": "手続：取締役会決議（178条2項）。取締役会非設置会社の場合は取締役の決定（解釈）。消却できるのは自己株式のみ（178条1項）"}, {"aspect": "条文", "text": "178条"}], "articles": ["178条"], "pages": [198]}, {"id": "book-kigyoho-01-ch03-r069", "ch": 3, "topic": "株式の併合（180条～）", "points": [{"aspect": "趣旨", "text": "特別決議を要する趣旨：株式の併合は、併合割合如何によっては端数が生じたり、小さい単位で株式を譲渡する利益を失われる等、株主に不利益のおそれがあるため"}, {"aspect": "原則", "text": "株式の併合とは、複数の株式を合わせてそれよりも少数の株式にすることをいう。併合がなされると発行済株式総数は減少するが、会社財産は変動しない"}, {"aspect": "原則", "text": "180条2項：株式会社は株式の併合をしようとするときは、その都度、株主総会の決議によって、①併合の割合、②株式の併合がその効力を生ずる日、③種類株式発行会社である場合には併合する株式の種類を定めなければならない。取締役は株主総会において併合を必要とする理由を説明しなければならない（4項）"}, {"aspect": "原則", "text": "端数の処理：株式の併合・分割・無償割当て等によって1株未満の端数が生じる場合、その端数の合計数に相当する株式を売却し（原則、競売の方法で）、売却代金を株主に交付する（235条）"}, {"aspect": "あてはめ", "text": "2項の「株主総会の決議」は309条2項4号によって「株主総会の特別決議」と読む。2項3号より、特定の種類株式だけを併合することも可能"}, {"aspect": "条文", "text": "180条・309条・235条"}], "articles": ["180条", "309条", "235条"], "pages": [198, 199]}, {"id": "book-kigyoho-01-ch03-r070", "ch": 3, "topic": "決議の重さと趣旨の考え方（手続と趣旨の対照）", "points": [{"aspect": "あてはめ", "text": "この考え方は様々なところで使えるので重要であり、普段あまり引かない条文の趣旨を論文本試験で訊かれたときに特に役立つ"}, {"aspect": "あてはめ", "text": "具体的に趣旨を書く方法：当該条文の規制がなければどのような不利益が生じるか／効果から考えて（手続きの趣旨）←組織再編等の条文の場合"}], "articles": [], "pages": [199]}, {"id": "book-kigyoho-01-ch03-r071", "ch": 3, "topic": "株式の分割（183条～）", "points": [{"aspect": "趣旨", "text": "趣旨：株式分割は基本的には既存株主に不利益を与えないので、株主総会特別決議は要求されていない"}, {"aspect": "原則", "text": "株式の分割とは、既発行株式を細分化して発行済株式総数を増加させること。分割がなされると発行済株式総数は増加するが、会社財産は変動しない"}, {"aspect": "原則", "text": "手続：株主総会の普通決議、または取締役会決議（取締役会設置会社）（183条2項）"}, {"aspect": "原則", "text": "183条2項3号より、特定の種類株式だけを分割することも可能"}, {"aspect": "条文", "text": "183条・322条・324条"}], "articles": ["183条", "322条", "324条"], "pages": [200]}, {"id": "book-kigyoho-01-ch03-r072", "ch": 3, "topic": "株式分割と発行可能株式総数の増加（184条2項）", "points": [{"aspect": "趣旨", "text": "184条2項の趣旨：株式分割と同時に、発行可能株式総数を分割割合の範囲内で増加しても、既存株主の支配比率に不利益を与えないため"}, {"aspect": "原則", "text": "184条2項：株式会社（現に二以上の種類の株式を発行しているものを除く。）は、466条の規定にかかわらず、株主総会の決議によらないで、前条第二項第二号の日における発行可能株式総数をその日の前日の発行可能株式総数に同項第一号の割合を乗じて得た数の範囲内で増加する定款の変更をすることができる"}, {"aspect": "原則", "text": "発行可能株式総数は定款に記載しなければならない（37条1項）。したがって発行可能株式総数を変更する場合、定款変更が必要となり、定款変更には本来は株主総会の特別決議が必要である（466条）。しかし、184条2項はその例外となる"}, {"aspect": "あてはめ", "text": "「定款変更」は原則、466条により株主総会の特別決議が必要のはず。「同項第一号の割合」とは分割割合のこと"}, {"aspect": "条文", "text": "184条・466条・37条"}], "articles": ["184条", "466条", "37条"], "pages": [201]}, {"id": "book-kigyoho-01-ch03-r073", "ch": 3, "topic": "株式無償割当て（185条～）", "points": [{"aspect": "趣旨", "text": "186条3項の趣旨：株主割当てによって、基本的には既存株主に不利益を与えないため"}, {"aspect": "原則", "text": "株式無償割当てとは、会社が株主に対して、保有株式に応じて、新たな払込をさせないで当該会社の株式を交付する（割り当てる）ことをいう（185条）。無償割当てがなされると発行済株式総数は増加するが、会社財産は変動しない"}, {"aspect": "原則", "text": "手続：株主総会（取締役会設置会社にあっては、取締役会）の決議。ただし、定款に別段の定めがある場合は、この限りでない（186条3項）"}, {"aspect": "あてはめ", "text": "1項3号：特定の種類株式に対してだけの株式無償割当てができることを示す。1項1号：X種類株式にY種類株式の無償割当ても可能（株式分割と異なる点）"}, {"aspect": "条文", "text": "185条・186条・322条・324条"}], "articles": ["185条", "186条", "322条", "324条"], "pages": [202]}, {"id": "book-kigyoho-01-ch03-r074", "ch": 3, "topic": "単元株制度（188条～）と単元未満株主の権利", "points": [{"aspect": "趣旨", "text": "原則として株主総会の特別決議を要求する趣旨：単元株式制度の採用及び単元株式数の増加により、議決権を失う株主が出てくる可能性もあるなど、既存株主に不利益のおそれがあるため"}, {"aspect": "原則", "text": "単元株制度とは、定款により、一定数の株式を一単元とし、単元株主には株主総会又は種類株主総会において一個の議決権を行使することを認めるが、単元未満株主にはその議決権の行使を認めないこととする制度をいう（188条1項）"}, {"aspect": "原則", "text": "191条：定款変更なのに株主総会決議不要。例：株主A（100株保有、1単元＝100株で1議決権）が株式分割で200株となり単元が200株に変わっても1議決権のままで不利益のおそれがないため、株主総会の特別決議は不要"}, {"aspect": "原則", "text": "単元未満株主の権利は189条に定めがある（見出しのみの記載）"}, {"aspect": "原則", "text": "単元未満株主の投下資本回収方法：①単元未満株式買取請求権（192条。趣旨：単元未満株主の投下資本回収のため）④単元未満株式売渡請求権（194条。趣旨：単元株主の権利を確保するため）"}, {"aspect": "条文", "text": "188条・466条・309条・190条・191条・195条・189条・192条・194条"}], "articles": ["188条", "466条", "309条", "190条", "191条", "195条", "189条", "192条", "194条"], "pages": [203, 204]}, {"id": "book-kigyoho-01-ch03-r075", "ch": 3, "topic": "キャッシュ・アウトの定義・方法・共通規定", "points": [{"aspect": "原則", "text": "キャッシュ・アウトとは、株主の個別の同意を得ることなく、金銭を交付して少数派株主全員を会社から締め出すこと"}, {"aspect": "原則", "text": "4つの方法に共通の規定（キャッシュ・アウトされる少数派株主保護のため）：①事前開示・事後開示②差止め請求③価格決定申立権。特にキャッシュ・アウトの「説明問題」の場合、上記①～③を条文から探すことが特に大事となる"}, {"aspect": "あてはめ", "text": "実務では、二段階買収（まず公開買い付け→その後上記キャッシュ・アウト方法）がなされることが多い"}, {"aspect": "条文", "text": "171条・180条・179条"}], "articles": ["171条", "180条", "179条"], "pages": [205]}, {"id": "book-kigyoho-01-ch03-r076", "ch": 3, "topic": "全部取得条項付種類株式の取得（171条）によるキャッシュ・アウト", "points": [{"aspect": "原則", "text": "手順：①甲’株を発行できるよう定款変更（株主総会の特別決議、466条、309条2項11号）。この時点では甲’株は未発行。②既存株式甲株を全部取得条項付種類株式に変える定款変更（株主総会の特別決議、466条、309条2項11号、プラス甲株主の種類株主総会の特別決議、111条2項、324条2項1号）。「取得対価の価額の決定方法」を定款に記載する（108条2項7号ｲ）。③全部取得条項付種類株式の会社による取得手続（株主総会の特別決議、171条1項、309条2項3号）。④1株に満たない端数の金銭処理（234条1項2号）。以上によりB・Cは甲社株主でなくなり（少数株主の排除）、甲社はAの完全子会社となる"}, {"aspect": "要件", "text": "手続：株主総会の特別決議（171条1項、309条2項3号）。事前開示（171条の2）、事後開示（173条の2）。差止請求権（171条の3。要件：①法令・定款違反②株主が不利益を受けるおそれがあること。趣旨：株主（少数株主）保護のため）。裁判所に対する価格決定の申立権（172条1項。趣旨：「取得対価」に不満な株主を保護するため）"}, {"aspect": "あてはめ", "text": "事後に効力を争う方法：無効の訴え等、特別の訴えの制度はない。そこで株主総会決議取消の訴え（831条1項）で争うことになる"}, {"aspect": "条文", "text": "234条・466条・309条・111条・324条・108条・171条・173条・172条・831条"}], "articles": ["234条", "466条", "309条", "111条", "324条", "108条", "171条", "173条", "172条", "831条"], "pages": [206]}, {"id": "book-kigyoho-01-ch03-r077", "ch": 3, "topic": "株式併合（180条）によるキャッシュ・アウト", "points": [{"aspect": "原則", "text": "多くの端数により市場価格が下落し適切な対価を期待できないため、その端数についての反対株主の株式買取請求権（182条の4）があり、価格協議が整わない場合に裁判所に対する価格決定の申立権（182条の5第2項）がある（趣旨：「取得対価」に不満な株主を保護するため）"}, {"aspect": "要件", "text": "手続：株主総会の特別決議（180条2項、309条2項4号）。事前開示（182条の2）、事後開示（182条の6）。差止請求権（182条の3。要件：①法令・定款違反②株主が不利益を受けるおそれがあること。趣旨：株主（少数株主）保護のため）。端数処理（235条・234条2項～5項）"}, {"aspect": "あてはめ", "text": "4つの制度とも、裁判所に対する価格決定の申立ては「取得対価」に対してである。事後に効力を争う方法：無効の訴え等、特別の訴えの制度はない。そこで株主総会決議取消の訴え（831条1項）で争うことになる"}, {"aspect": "条文", "text": "235条・234条・180条・309条・182条・831条"}], "articles": ["235条", "234条", "180条", "309条", "182条", "831条"], "pages": [207]}, {"id": "book-kigyoho-01-ch03-r078", "ch": 3, "topic": "金銭を対価とする（略式）株式交換によるキャッシュ・アウト", "points": [{"aspect": "原則", "text": "手続：甲社・A社とも株主総会の特別決議による承認（783条1項、795条1項、309条2項12号）。略式株式交換の場合は、甲社においては株主総会決議不要（784条1項本文）、A社においては株主総会決議による承認（795条1項、309条2項12号）"}, {"aspect": "原則", "text": "裁判所に対する価格決定の申立権（786条2項、798条2項。趣旨：「取得対価」に不満な株主を保護するため）。事後に効力を争う方法：特別の訴えの制度あり。株式交換無効の訴え（828条1項11号）。詳細は後述"}, {"aspect": "要件", "text": "事前開示（782条1項、794条1項）、事後開示（791条1項2項、801条2項3項）。差止請求権（784条の2柱書本文1号、796条の2柱書本文1号。要件：①法令・定款違反②株主が不利益を受けるおそれがあること）。略式株式交換の場合は784条の2柱書本文2号、796条の2柱書本文2号で、要件は①対価が著しく不当である場合②株式交換完全子会社の株主が不利益を受けるおそれがあること（いずれも趣旨は株主（少数株主）保護のため）"}, {"aspect": "条文", "text": "783条・795条・309条・784条・782条・794条・791条・801条・796条・786条・798条・828条"}], "articles": ["783条", "795条", "309条", "784条", "782条", "794条", "791条", "801条", "796条", "786条", "798条", "828条"], "pages": [208]}, {"id": "book-kigyoho-01-ch03-r079", "ch": 3, "topic": "特別支配株主の株式等売渡請求（179条～）", "points": [{"aspect": "趣旨", "text": "趣旨：株主総会の決議を経ずに、キャッシュ・アウトを行う要請に応えるため。cf.金銭を対価とする略式株式交換は、税制上の理由から従来あまり利用されてこなかった"}, {"aspect": "原則", "text": "事後に効力を争う方法：特別の訴えの制度あり。売渡株式等取得無効の訴え（846条の2～）。828条ではない点に注意"}, {"aspect": "原則", "text": "売渡株式等取得無効の訴えの被告は特別支配株主（対象会社でないことに注意）。無効判決（認容判決）の効力は対世効（846条の7）、将来効（846条の8）"}, {"aspect": "要件", "text": "手続：取締役会決議による承認（取締役会設置会社の場合。179条の3第1項3項）。事前開示（179条の5）、事後開示（179条の10）。差止請求権（179条の7。要件：①ⅰ株式売渡請求が法令に違反する場合、ⅱ（略）、ⅲ特別支配株主が定めた売渡対価が著しく不当である場合（＊2）のいずれかで、②売渡株主が不利益を受けるおそれがあること。趣旨：株主（少数株主）保護のため）。裁判所に対する価格決定の申立権（179条の8第1項）"}, {"aspect": "要件", "text": "売渡株式等取得無効の訴えが認められるための要件：①取得日から6ヶ月以内の訴えであること、②無効原因があること。法的安定性確保と取引の安全の見地から、無効原因は重大な瑕疵に限ると解する"}, {"aspect": "あてはめ", "text": "（参）＊1・＊2のみ「対価の著しい不当性」が差止請求権の要件となる理由：略式株式交換と特別支配株主の株式等売渡請求の場合は株主総会決議を要求していない。それ以外のキャッシュ・アウトでは対価を不当と考える株主は株主総会で反対の意思表示ができるが、上記2制度においては株主は反対の意思表示ができない。そこで株主保護の観点から、対価を不当と考える株主に差止請求権を認めた"}, {"aspect": "条文", "text": "179条・846条・828条"}], "articles": ["179条", "846条", "828条"], "pages": [209, 210]}, {"id": "book-kigyoho-01-ch03-r080", "ch": 3, "topic": "Ⅱ重要条文（暗記すべき条文）：株主の権利・種類株式・定款変更関係", "points": [{"aspect": "原則", "text": "暗記対象条文：株主有限責任 ― 104条"}, {"aspect": "原則", "text": "暗記対象条文：「株主の権利」の条文 ― 105条"}, {"aspect": "原則", "text": "暗記対象条文：種類株式 ― 108条1項、2項"}, {"aspect": "原則", "text": "暗記対象条文：定款変更（原則）― 466条、309条2項11号"}, {"aspect": "原則", "text": "暗記対象条文：定款変更（原則）のcf. ― 111条1項、111条2項、324条2項1号・3項1号、116条1項"}, {"aspect": "原則", "text": "暗記対象条文：cf. ― 309条3項1号、116条1項、110条"}, {"aspect": "原則", "text": "暗記対象条文：種類株主の損害を及ぼすおそれある場合 ― 322条、324条2項"}, {"aspect": "原則", "text": "暗記対象条文：株式の内容についての特別の定め ― 107条1項、107条2項"}, {"aspect": "原則", "text": "暗記対象条文：公開会社を非公開会社に（全ての株式を譲渡制限株式に）― 309条3項、107条1項1号"}, {"aspect": "原則", "text": "暗記対象条文：全ての株式を取得条項付株式に ― 110条"}, {"aspect": "原則", "text": "暗記対象条文：株主平等原則 ― 109条1項"}, {"aspect": "原則", "text": "暗記対象条文：非公開会社における属人的な権利の定め ― 109条2項"}, {"aspect": "条文", "text": "104条・105条・108条・466条・309条・111条・324条・116条・110条・322条・107条・109条"}], "articles": ["104条", "105条", "108条", "466条", "309条", "111条", "324条", "116条", "110条", "322条", "107条", "109条"], "pages": [211]}, {"id": "book-kigyoho-01-ch03-r081", "ch": 3, "topic": "Ⅱ重要条文（暗記すべき条文）：株券・譲渡制限・自己株式関係", "points": [{"aspect": "原則", "text": "暗記対象条文：株券の資格授与的効力 ― 131条1項"}, {"aspect": "原則", "text": "暗記対象条文：株券の善意取得 ― 131条2項"}, {"aspect": "原則", "text": "暗記対象条文：株式譲渡自由の原則 ― 127条"}, {"aspect": "原則", "text": "暗記対象条文：権利株の譲渡制限 ― 35条、50条2項、63条2項、208条4項"}, {"aspect": "原則", "text": "暗記対象条文：株券発行前の株式譲渡の制限 ― 128条2項"}, {"aspect": "原則", "text": "暗記対象条文：株券の発行、遅滞なく ― 215条1項"}, {"aspect": "原則", "text": "暗記対象条文：定款による譲渡制限 ― 107条1項1号、108条1項4号"}, {"aspect": "原則", "text": "暗記対象条文：譲渡承認請求 ― 136条、138条1号、137条、138条2号"}, {"aspect": "原則", "text": "暗記対象条文：譲渡承認機関 ― 139条"}, {"aspect": "原則", "text": "暗記対象条文：自己株式の取得・取得手続規制 ― 155条～"}, {"aspect": "原則", "text": "暗記対象条文：自己株式の取得・財源規制 ― 461条"}, {"aspect": "原則", "text": "暗記対象条文：特定の株主からの自己株式の取得 原則：160条（取得手続規制）"}, {"aspect": "原則", "text": "暗記対象条文：特定の株主からの自己株式の取得 例外：161条～165条"}, {"aspect": "原則", "text": "暗記対象条文：461条（財源）違反の場合の責任 ― 462条"}, {"aspect": "原則", "text": "暗記対象条文：子会社による親会社株式の原則的取得禁止 ― 135条"}, {"aspect": "条文", "text": "131条・127条・35条・50条・63条・208条・128条・215条・107条・108条・136条・138条・137条・139条・155条・461条・160条・161条・165条・462条・135条"}], "articles": ["131条", "127条", "35条", "50条", "63条", "208条", "128条", "215条", "107条", "108条", "136条", "138条", "137条", "139条", "155条", "461条", "160条", "161条", "165条", "462条", "135条"], "pages": [211]}, {"id": "book-kigyoho-01-ch03-r082", "ch": 3, "topic": "Ⅱ重要条文（暗記すべき条文）：基準日・名義書換・消却〜キャッシュ・アウト関係", "points": [{"aspect": "原則", "text": "暗記対象条文：基準日 ― 124条、特に124条4項が重要"}, {"aspect": "原則", "text": "暗記対象条文：名義書換の確定的効力 ― 130条"}, {"aspect": "原則", "text": "暗記対象条文：(自己)株式の消却 ― 178条"}, {"aspect": "原則", "text": "暗記対象条文：株式の併合 ― 180条～"}, {"aspect": "原則", "text": "暗記対象条文：株式の分割 ― 183条～。特に184条2項は重要"}, {"aspect": "原則", "text": "暗記対象条文：株式無償割当 ― 185条～"}, {"aspect": "原則", "text": "暗記対象条文：単元株式制度 ― 188条～"}, {"aspect": "原則", "text": "暗記対象条文：全部取得条項付種類株式の取得 ― 171条"}, {"aspect": "原則", "text": "暗記対象条文：特別支配株主の株式等売渡請求 ― 179条～"}, {"aspect": "原則", "text": "暗記対象条文：売渡株式等取得無効の訴え ― 846条の2～"}, {"aspect": "条文", "text": "124条・130条・178条・180条・183条・184条・185条・188条・171条・179条・846条"}], "articles": ["124条", "130条", "178条", "180条", "183条", "184条", "185条", "188条", "171条", "179条", "846条"], "pages": [211, 212]}, {"id": "book-kigyoho-01-ch04-r001", "ch": 4, "topic": "会社設立手続の概要（4つの実体形成と設立登記・設立方法）", "points": [{"aspect": "原則", "text": "設立手続の全体像：①定款の作成②社員の確定③出資の確定（会社財産の形成）④機関の具備の4つの実体形成に、設立登記（49条）が加わり、団体は法人格を取得して会社として成立する"}, {"aspect": "原則", "text": "株式会社の設立方法：発起設立は25条1項1号、募集設立は25条1項2号"}, {"aspect": "条文", "text": "49条・25条"}], "articles": ["49条", "25条"], "pages": [213]}, {"id": "book-kigyoho-01-ch04-r002", "ch": 4, "topic": "定款の作成・公証人の認証と絶対的記載事項", "points": [{"aspect": "原則", "text": "定款の作成・公証人の認証（見出しのみで、本文に内容説明はない）"}, {"aspect": "原則", "text": "定款の絶対的記載・記録事項（27条・37条）。記載・記録なければ定款自体が無効になる"}, {"aspect": "条文", "text": "27条・37条"}], "articles": ["27条", "37条"], "pages": [213]}, {"id": "book-kigyoho-01-ch04-r003", "ch": 4, "topic": "変態設立事項の定義等（28条・33条）", "points": [{"aspect": "原則", "text": "変態設立事項とくれば、①28条、②33条"}, {"aspect": "原則", "text": "変態設立事項とは28条各号に掲げる事項。具体的には①現物出資（28条1号）②財産引受（同条2号）③発起人の報酬・特別利益（同条3号）④設立費用（同条4号）の4つ。定款に記載し、又は記録しなければ、その効力を生じない（28条柱書）"}, {"aspect": "条文", "text": "28条・33条"}], "articles": ["28条", "33条"], "pages": [213]}, {"id": "book-kigyoho-01-ch04-r004", "ch": 4, "topic": "現物出資（28条1号）", "points": [{"aspect": "趣旨", "text": "現物出資規制の趣旨：目的財産の過大な評価による不当な株式付与により、会社の財産的基礎を害するとともに、金銭出資者を害するから"}, {"aspect": "原則", "text": "現物出資とは、金銭以外の財産をもってする出資（28条1号）"}, {"aspect": "あてはめ", "text": "設立段階で現物出資できるのは発起人のみ（34条1項、63条1項対照）"}, {"aspect": "条文", "text": "28条・34条・63条"}], "articles": ["28条", "34条", "63条"], "pages": [214]}, {"id": "book-kigyoho-01-ch04-r005", "ch": 4, "topic": "財産引受け（28条2号）", "points": [{"aspect": "趣旨", "text": "財産引受け規制の趣旨：目的財産の過大な評価による不当な対価支払いにより会社の財産的基礎を害され、また、現物出資規制の潜脱手段として利用されるおそれがあるから"}, {"aspect": "原則", "text": "財産引受けとは、「株式会社の成立後に譲り受けることを約した財産」（28条2号）"}, {"aspect": "結論", "text": "財産引受けは、設立中の会社がする売買契約である"}, {"aspect": "条文", "text": "28条"}], "articles": ["28条"], "pages": [214]}, {"id": "book-kigyoho-01-ch04-r006", "ch": 4, "topic": "事後設立（467条1項5号）", "points": [{"aspect": "趣旨", "text": "事後設立規制の趣旨：財産引受け規制の潜脱手段として利用されるおそれがあるから"}, {"aspect": "原則", "text": "事後設立は簡単に言うと、会社成立後直後の売買契約である"}, {"aspect": "原則", "text": "事後設立は①現物出資・財産引受けとは異なり変態設立事項ではなく異なる規制であり、②本来成立後の会社が高値で土地等を買うことも自由であるので、規制される事後設立というものは制限的に解される"}, {"aspect": "原則", "text": "467条1項5号の条文：株式会社は、成立後2年以内における成立前から存在する財産で事業のために継続して使用するものの取得については、効力発生日の前日までに株主総会の決議によって契約の承認を受けなければならない。ただし、対価として交付する財産の帳簿価額の合計額（イ）の純資産額（ロ）に対する割合が5分の1（定款で定めた場合はその割合）を超えない場合を除く"}, {"aspect": "原則", "text": "事後設立の承認決議は株主総会の特別決議（309条2項11号）。第六章＝466条"}, {"aspect": "条文", "text": "467条・309条・466条"}], "articles": ["467条", "309条", "466条"], "pages": [215]}, {"id": "book-kigyoho-01-ch04-r007", "ch": 4, "topic": "発起人の報酬・特別利益（28条3号）", "points": [{"aspect": "趣旨", "text": "発起人の報酬・特別利益規制の趣旨：発起人が多額の報酬や特別利益を自由に決定できるとすると、会社の財産的基礎を害するから"}, {"aspect": "原則", "text": "特別利益とは、会社の設備利用の特権授与など将来にわたる継続的利益"}], "articles": [], "pages": [216]}, {"id": "book-kigyoho-01-ch04-r008", "ch": 4, "topic": "設立費用（28条4号）", "points": [{"aspect": "趣旨", "text": "設立費用規制の趣旨：発起人の濫費・過大な見積もりにより会社の財産的基礎を害するので"}, {"aspect": "原則", "text": "設立費用の定義：発起人が（設立中の会社の機関として）会社設立のために支出した費用"}, {"aspect": "原則", "text": "発起人の濫費・過大な見積もりのおそれがないので設立費用に含めないもの：会社法上は定款の認証手数料、法務省令上は払込取扱機関への報酬・登録免許税"}], "articles": [], "pages": [216]}, {"id": "book-kigyoho-01-ch04-r009", "ch": 4, "topic": "変態設立事項の規制（3プラス2）", "points": [{"aspect": "原則", "text": "規制の「3」：ア 定款への記載・記録（28条柱書）、イ 検査役の調査（例外あり）（33条）、ウ 不当なら変更を（33条7項、96条）"}, {"aspect": "原則", "text": "33条10項各号の例外は、現物出資・財産引受についてのみの例外である"}, {"aspect": "原則", "text": "33条10項1号・少額財産（500万円）の特例：瑕疵（キズ）の程度は軽微であり、事後的に不足額塡補責任（52条、103条1項）で補えるので、特例（例外）を認めた"}, {"aspect": "原則", "text": "33条10項2号は市場価格のある有価証券の特例、3号は専門家証明のある場合の特例"}, {"aspect": "原則", "text": "規制のプラス「2」：検査役の調査が不要になる代わりに、①設立時取締役等による調査（46条1項1号2号、93条1項1号2号）、②発起人等による不足額塡補責任（52条、103条1項）の2つの条文適用の可能性がある"}, {"aspect": "条文", "text": "28条・33条・96条・52条・103条・46条・93条"}], "articles": ["28条", "33条", "96条", "52条", "103条", "46条", "93条"], "pages": [216, 217]}, {"id": "book-kigyoho-01-ch04-r010", "ch": 4, "topic": "社員の確定（発起設立・募集設立の手続と適用条文）", "points": [{"aspect": "図表", "text": "フロー図（発起設立）：株式発行事項の決定（32条）→発起人の全部引受け（25条1項1号）"}, {"aspect": "図表", "text": "フロー図（募集設立）：株式発行事項の決定（32条、58条）→発起人の一部引受け（25条1項2号）→引受人の募集・申込み（57条〜59条）→割当て・引受け（60条〜62条）"}, {"aspect": "図表", "text": "適用条文表：発起設立・募集設立に共通して25条〜37条・39条・47条〜56条が適用され、発起設立のみ38条・40条〜46条、募集設立のみ57条〜103条が適用される"}, {"aspect": "条文", "text": "32条・25条・58条・57条・59条・60条・62条・37条・39条・47条・56条・38条・40条・46条・103条"}], "articles": ["32条", "25条", "58条", "57条", "59条", "60条", "62条", "37条", "39条", "47条", "56条", "38条", "40条", "46条", "103条"], "pages": [217]}, {"id": "book-kigyoho-01-ch04-r011", "ch": 4, "topic": "全額払込み・全部給付（34条、63条）", "points": [{"aspect": "原則", "text": "全額払込み・全部給付（34条、63条）。34条1項と63条1項の比較から、現物出資を行えるのは（会社設立時に）発起人に限ることがわかる"}, {"aspect": "条文", "text": "34条・63条"}], "articles": ["34条", "63条"], "pages": [218]}, {"id": "book-kigyoho-01-ch04-r012", "ch": 4, "topic": "預合い", "points": [{"aspect": "原則", "text": "預合いの定義：発起人が払込取扱機関の役職員（支店長等）と通謀して、払込取扱機関から借入れをしてそれを払込みに充てるが、借入れを返済するまでは預金を引き出さないことを約束する行為"}, {"aspect": "原則", "text": "預合いの民事責任：任務懈怠責任（53条1項2項）、払込取扱機関の払込金保管証明責任（64条2項）、出資の履行を仮装した場合の責任等（52条の2）等（後述）"}, {"aspect": "要件", "text": "預合いの刑事罰：965条（預合いの罪）、960条（取締役等の特別背任罪。図利加害目的が要件）"}, {"aspect": "結論", "text": "（論点）預合いによる払込の効力：無効と解する。現実の拠出なく実質的に会社財産の形成に役立っていないからである"}, {"aspect": "あてはめ", "text": "金銭の仮装払込みの視点：会社財産を形成したといえるか？会社資金として運用できたか？"}, {"aspect": "条文", "text": "53条・64条・52条・965条・960条"}], "articles": ["53条", "64条", "52条", "965条", "960条"], "pages": [218]}, {"id": "book-kigyoho-01-ch04-r013", "ch": 4, "topic": "見せ金", "points": [{"aspect": "原則", "text": "見せ金の定義：発起人が払込取扱機関以外のものから借り入れた金銭を株式の払込みに充て、会社の成立後にそれを引き出して借入金の返済に充てること"}, {"aspect": "要件", "text": "見せ金による払込みとして無効となるのは発起人に当初から仮装払込みの意図があった場合であり、その判断は①会社成立後借入金を返済するまでの期間の長短、②払込金が会社資金として運用された事実の有無、③借入金の返済が会社の資金関係に及ぼす影響の有無等を総合的に考慮する（見せ金3要件）"}, {"aspect": "結論", "text": "（論点）見せ金による払込の効力：無効と解する。一連の行為を全体的に考察すれば当初から計画された払込み仮装のためのからくりの一環であり、有効としたのでは全額払込み制度（34条1項、63条1項）などの制度を置いた会社法の趣旨が没却されるからである"}, {"aspect": "結論", "text": "見せ金による払込の効力に関する判例：最判昭和38・12・6"}, {"aspect": "あてはめ", "text": "見せ金3要件の③のあてはめ：現在の会社資金に余裕があり、借入金を返済しても会社資金に及ぼす影響が少ない場合は、見せ金による払込は有効となる方向になる"}, {"aspect": "あてはめ", "text": "記述の際は、ⅰ現実の払込があるのに見せ金による払込みは無効か（預合い禁止の脱法行為として計画的に行われる払込み仮装の一環であるから無効）と、ⅱどのような場合に見せ金による払込が無効となるか（見せ金3要件で判断）とは区別する。現在はⅱの方が大事"}, {"aspect": "あてはめ", "text": "「論点体系 会社法1」も、見せ金による払込みが無効であるとしてどのような場合に無効となるかが問題となると記述し、その判断基準として「期間の長短」などの3要件を挙げている"}, {"aspect": "条文", "text": "34条・63条"}], "articles": ["34条", "63条"], "pages": [219, 220]}, {"id": "book-kigyoho-01-ch04-r014", "ch": 4, "topic": "その他の仮装払込", "points": [{"aspect": "あてはめ", "text": "その他の仮装払込にあたるかの感覚的判断は、その払込金が「会社財産として運用できたか」どうかで判断する。払込みが無効かどうかを書くときは見せ金3要件（短文用としては「会社財産として運用できたか」）を書く"}], "articles": [], "pages": [220]}, {"id": "book-kigyoho-01-ch04-r015", "ch": 4, "topic": "見せ金の場合の責任（民事責任・払込金保管証明責任・刑事罰）", "points": [{"aspect": "原則", "text": "見せ金の民事責任：任務懈怠責任（53条1項2項）、出資の履行を仮装した場合の責任等（52条の2）等（後述）"}, {"aspect": "要件", "text": "見せ金の刑事罰：罪刑法定主義より965条に見せ金の規定がない以上、965条は適用も類推適用もできない。図利加害目的等の要件を満たせば960条は適用される"}, {"aspect": "結論", "text": "（論点）見せ金の場合の払込取扱機関の払込金保管証明責任（64条2項）：払込取扱機関が責任を負うのは、払込みの仮装について悪意・重過失の場合に限る。64条2項は禁反言に基づく法定責任であるが、見せ金の場合、通常は現実に金銭による払込みがあり、発起人と払込取扱機関の間に通謀もなく払込取扱機関は払込みの仮装について善意であるからである"}, {"aspect": "条文", "text": "53条・52条・64条・965条・960条"}], "articles": ["53条", "52条", "64条", "965条", "960条"], "pages": [220]}, {"id": "book-kigyoho-01-ch04-r016", "ch": 4, "topic": "機関の具備（設立時役員等の選任・解任）", "points": [{"aspect": "原則", "text": "機関の具備は設立時役員等の選任・解任を指す（見出しのみで、本文に内容説明はない）"}], "articles": [], "pages": [221]}, {"id": "book-kigyoho-01-ch04-r017", "ch": 4, "topic": "設立時取締役等による調査（46条、93条）", "points": [{"aspect": "原則", "text": "＜その他の手続き＞として、設立時取締役等による調査（46条、93条）が掲げられる（見出しのみで、本文に内容説明はない）"}, {"aspect": "条文", "text": "46条・93条"}], "articles": ["46条", "93条"], "pages": [221]}, {"id": "book-kigyoho-01-ch04-r018", "ch": 4, "topic": "発起人の定義", "points": [{"aspect": "原則", "text": "発起人とは、定款に発起人として署名または記名押印したもの（形式説、大判明治41・1・29）"}], "articles": [], "pages": [221]}, {"id": "book-kigyoho-01-ch04-r019", "ch": 4, "topic": "設立中の会社と成立会社の関係（同一性説）", "points": [{"aspect": "原則", "text": "Bが甲’成立会社に90万円請求できるためには、①取引内容が発起人の権限の範囲内の行為であって、②甲設立中の会社と甲’成立会社が実質的には同一であることが必要である"}, {"aspect": "結論", "text": "同一性説：設立中の会社が成長発展して、最終的に設立登記によって法人格を取得して会社として成立する（49条）。したがって、設立中の会社と成立した会社は実質的には同一の存在である"}, {"aspect": "条文", "text": "49条"}], "articles": ["49条"], "pages": [221]}, {"id": "book-kigyoho-01-ch04-r020", "ch": 4, "topic": "発起人の権限の範囲", "points": [{"aspect": "原則", "text": "発起人の行為の4分類：①会社設立に法律上必要な行為（例：定款の作成、株主募集、株式の割当て・引受け・払込みに関する行為、創立総会の招集）、②会社設立に事実上・経済上必要な行為（＝設立費用。例：印刷会社への定款等の印刷委託、設立事務所の貸借、設立事務所の事務員の雇用）、③開業準備行為（財産引受け＋それ以外。例：営業所・工場の敷地の譲受け・賃借・建築、原材料の仕入れ、成立後の会社の従業員の雇用、広告契約の締結）、④営業行為（例：商品の販売など）"}, {"aspect": "結論", "text": "論証例（A説）：設立中の会社の目的は会社の設立であり、会社法が設立に関して厳格な規制をしている趣旨は成立後の会社の財産的基礎の確保のためであるから、発起人の権限は会社設立に法律上必要な行為に限定すべきである。もっとも、財産引受は、成立後の会社の便宜を考慮して、法定の要件を満たせば例外的に発起人の権限に属するものとしている"}, {"aspect": "結論", "text": "最判昭和38年12月24日は、C説でないことは明らかであるが、A説かB説か不明である"}, {"aspect": "あてはめ", "text": "設立段階では、健全性（成立後の会社財産的基礎の確保）と迅速な事業活動の開始のどちらを重視するかが問題となる"}], "articles": [], "pages": [222]}, {"id": "book-kigyoho-01-ch04-r021", "ch": 4, "topic": "未払いの設立費用がある場合、相手方は誰にいくら請求できるか", "points": [{"aspect": "結論", "text": "論証例：発起人の権限は会社設立に法律上必要な行為に限定すべきであり、設立費用は会社設立に事実上・経済上必要な行為によって生じるもので発起人の権限外の行為から生じたものであるから、会社に帰属せず発起人に帰属する。このように解しても、取引の相手方は発起人を信頼して取引に入ったのであるから妥当性を欠くことにもならない"}, {"aspect": "結論", "text": "上記論証例の立場では、Bは成立後の発起人Aに90万円請求でき、AはBに支払後、甲会社に70万円請求することになる"}], "articles": [], "pages": [223]}, {"id": "book-kigyoho-01-ch04-r022", "ch": 4, "topic": "定款に記載のない財産引受けの効力（会社からの追認の可否）", "points": [{"aspect": "原則", "text": "民法113条1項：「代理権を有しない者が他人の代理人としてした契約は、本人がその追認をしなければ、本人に対してその効力を生じない。」"}, {"aspect": "原則", "text": "この論点は、会社法28条の「……定款に記載し、又は記録しなければ、その効力を有しない。」を絶対的無効と解するか、無権代理無効と解するかの問題でもある"}, {"aspect": "結論", "text": "論証例：財産引受けは本来は設立中の会社の実質的権利能力の範囲外の行為であるが、会社法は成立後の会社の便宜を考慮して法定の要件を満たせば例外的に発起人の権限に属するとしたにすぎない。したがって、定款に記載のない財産引受けは絶対的に無効であって、理論上追認できない"}, {"aspect": "結論", "text": "成立会社も追認できない：成立会社は、設立中の会社が成長発展して設立登記によって法人格を取得して成立したもので、設立中の会社と実質的には同一の存在である（49条）から、定款に記載のない財産引受けを追認することはできない"}, {"aspect": "結論", "text": "上記論証は判例（最判昭和28・12・3）と同じ立場である"}, {"aspect": "結論", "text": "解答例1（①Bは甲成立会社に代金請求できるか）：乙土地は財産引受け（28条2号）にあたり、甲会社の定款に記載がない以上「その効力を有しない」。したがって、Bは甲成立会社に代金請求をすることはできない"}, {"aspect": "あてはめ", "text": "解答例2の注記：無効であるので財産の譲受人（成立後の会社）はいつでも無効主張できるのが原則である。もっとも、判例は、9年間何の異議を唱えることなく利益を享受しておきながら残代金の請求を免れるため無効を突如として主張した事案において、成立後の会社の無効主張は信義則（民法1条2項）に反し許されないとした（最判昭和61・9・11）"}, {"aspect": "条文", "text": "113条・349条・49条・28条・1条"}], "articles": ["113条", "349条", "49条", "28条", "1条"], "pages": [224, 225]}, {"id": "book-kigyoho-01-ch04-r023", "ch": 4, "topic": "設立に関する責任の全体像（52条〜56条・102条の2・103条）", "points": [{"aspect": "原則", "text": "設立に関する責任の一覧：52条は不足額填補責任、52条の2は仮装払込（出資）の場合の責任等、53条は損害賠償責任、54条は連帯責任、55条は責任の免除、56条は株式会社不成立の場合の責任（cf.57条〜）。募集設立については102条の2（払込みを仮装した設立時募集株式の引受人の責任）、103条（発起人の責任等）"}, {"aspect": "あてはめ", "text": "効果による条文の識別：52条は「不足額を支払う義務」、52条の2は「払込みを仮装した出資に係る金銭の全額の支払」（「給付を仮装した出資に係る金銭以外の財産の全部の給付」）、53条は「損害を賠償する責任」。「不足額の請求ができるか？」なら発起設立では52条、「出資金相当額の支払いを請求できるか」なら52条の2、「損害金の請求ができるか？」なら53条を考え、それぞれ要件を検討する"}, {"aspect": "条文", "text": "52条・56条・102条・103条・53条・54条・55条・57条"}], "articles": ["52条", "56条", "102条", "103条", "53条", "54条", "55条", "57条"], "pages": [226]}, {"id": "book-kigyoho-01-ch04-r024", "ch": 4, "topic": "不足額塡補責任（52条、103条1項）", "points": [{"aspect": "趣旨", "text": "Bが無過失責任を負う趣旨：会社の犠牲において、現物出資者等に利得させるべきでないから"}, {"aspect": "趣旨", "text": "募集設立の場合に無過失責任とする趣旨：現物出資財産等について十分な調査の機会のない株式引受人を保護するため"}, {"aspect": "原則", "text": "現物出資者等であるBは常に責任を負う。過失なくても責任を負う無過失責任である（52条2項柱書かっこ書、2号）"}, {"aspect": "原則", "text": "他の発起人Aは、①検査役の調査を経た場合、②過失がないことを証明した場合は不足額塡補責任を負わず、それ以外は負う（原則：過失責任）"}, {"aspect": "原則", "text": "Aの過失責任の例外：募集設立の場合は無過失責任（103条1項、52条2項2号）"}, {"aspect": "原則", "text": "専門家証明をした弁護士等（52条3項）は過失責任である"}, {"aspect": "要件", "text": "不足額塡補責任の要件：定款に記載・記録された価額に「著しく不足するとき」"}, {"aspect": "条文", "text": "52条・103条"}], "articles": ["52条", "103条"], "pages": [227]}, {"id": "book-kigyoho-01-ch04-r025", "ch": 4, "topic": "発起人等の任務懈怠責任（53条）・連帯責任（54条）・責任の免除（55条）", "points": [{"aspect": "原則", "text": "発起人等の任務懈怠責任（53条）：1項は会社に対する責任（cf.423条1項と同様の責任）、2項は第三者に対する責任（cf.429条1項と同様の責任）"}, {"aspect": "原則", "text": "54条の発起人等の連帯責任は、53条1項2項責任にかかる"}, {"aspect": "原則", "text": "55条の総株主の同意による責任の免除の対象は、52条1項責任、52条の2第1項2項、53条1項責任である"}, {"aspect": "条文", "text": "53条・423条・429条・54条・55条・52条"}], "articles": ["53条", "423条", "429条", "54条", "55条", "52条"], "pages": [227]}, {"id": "book-kigyoho-01-ch04-r026", "ch": 4, "topic": "会社不成立の場合の発起人の責任（56条）", "points": [{"aspect": "原則", "text": "会社不成立の場合の発起人の責任は56条（見出しのみで、本文に内容説明はない）"}, {"aspect": "条文", "text": "56条"}], "articles": ["56条"], "pages": [228]}, {"id": "book-kigyoho-01-ch04-r027", "ch": 4, "topic": "擬似発起人の責任（103条4項）", "points": [{"aspect": "趣旨", "text": "擬似発起人の責任の趣旨：擬似発起人の賛助を信頼して株式を引き受けたものを保護するため"}, {"aspect": "原則", "text": "擬似発起人の責任は103条4項（見出しのみ）"}, {"aspect": "条文", "text": "103条"}], "articles": ["103条"], "pages": [228]}, {"id": "book-kigyoho-01-ch04-r028", "ch": 4, "topic": "払込取扱機関の払込金保管証明責任（64条2項）〔項目8（5）〕", "points": [{"aspect": "趣旨", "text": "払込金保管証明責任の趣旨：募集設立における株式引受人を保護するため"}, {"aspect": "原則", "text": "払込取扱機関の払込金保管証明責任は64条2項（見出しのみ）"}, {"aspect": "条文", "text": "64条"}], "articles": ["64条"], "pages": [228]}, {"id": "book-kigyoho-01-ch04-r029", "ch": 4, "topic": "出資の履行の仮装（払込みの仮装・給付の仮装）", "points": [{"aspect": "趣旨", "text": "Aが株主の権利を行使できる趣旨：会社財産が充実した以上、仮装払込をした発起人・引受人の権利行使を否定する理由はないから"}, {"aspect": "趣旨", "text": "Bが株主の権利を行使できる趣旨：株式取引の安全を図るため"}, {"aspect": "趣旨", "text": "Aの支払・給付義務、X・Yの支払い義務の趣旨①：出資の履行が仮装された場合、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）"}, {"aspect": "趣旨", "text": "趣旨②：会社の資金が確保されたと信じた会社債権者の保護の必要性。会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加える。もっとも、55条が総株主の同意で52条の2第1項2項の義務の免除を認めていることからすると、②は不要かとの指摘がある"}, {"aspect": "原則", "text": "Aの支払・給付義務（52条の2第1項、102条の2第1項）は無過失責任である（発起設立・募集設立を問わず、Aが発起人の場合は52条の2第1項、Aが引受人の場合は102条の2第1項）"}, {"aspect": "原則", "text": "仮装に関与したX・Yの支払義務（52条の2第2項第3項、103条2項、会社法施行規則7条の2、18条の2）は過失責任である"}, {"aspect": "原則", "text": "条文の対応：52条の2は出資の履行を仮装した場合の責任等、102条の2は払込みを仮装した設立時募集株式の引受人の責任、103条は発起人の責任等、102条は設立手続等の特則（cf.57条以下）"}, {"aspect": "原則", "text": "Aは支払・給付義務を果たせば「株主の権利を行使すること」ができる（52条の2第4項、102条3項）"}, {"aspect": "原則", "text": "甲株の譲受人Bは、悪意・重過失でなければ「株主の権利を行使すること」ができる（52条の2第5項、102条4項）"}, {"aspect": "原則", "text": "（参考）出資額100万円の場合の3類型：1 払込がなされなかった（0円）場合は株主となる権利の喪失（失権。36条3項（発起人の場合）、63条3項（引受人は当然失権））。2 払込がなされたが仮装（実際0円）の場合は支払義務が生じ株主の権利行使が可能（52条の2、102条、102条の2、103条）で、これらの規定は36条3項・63条3項の例外規定となり失権しない。3 60万円の払込の場合は争いがあり（40万円分は株主となる権利の喪失か、すべての株主となる権利の喪失か）、試験には出題されないだろう"}, {"aspect": "結論", "text": "（論点）要件の「払込みを仮装した場合」「給付を仮装した場合」とは（短文用）：払込みした資金が会社資金として運用できたとはいえない場合には（払込みによっても会社の営業資金は何ら確保されていないといえる場合には）、払込みを仮装した場合にあたると解する"}, {"aspect": "あてはめ", "text": "「払込の効力について論じなさい。」のように払込の効力を問われた場合は、上記の下線部分を「払込は無効と解する。」とすれば良い。（長文用）は「見せ金による払い込みの効力」（見せ金3要件）を2段落目に記述する"}, {"aspect": "あてはめ", "text": "この趣旨は、事例問題ではあまり書くことがなく、説明問題では記述が必要である"}, {"aspect": "条文", "text": "52条・102条・103条・7条・18条・57条・55条・36条・63条"}], "articles": ["52条", "102条", "103条", "7条", "18条", "57条", "55条", "36条", "63条"], "pages": [229, 230]}, {"id": "book-kigyoho-01-ch04-r030", "ch": 4, "topic": "教材問題1・問題1’（仮装払込の金銭の全額支払請求・現物出資の仮装）", "points": [{"aspect": "原則", "text": "52条の2第1項の条文：発起人は、①34条1項の規定による払込みを仮装した場合には払込みを仮装した出資に係る金銭の全額の支払、②34条1項の規定による給付を仮装した場合には給付を仮装した出資に係る金銭以外の財産の全部の給付（株式会社が当該給付に代えて当該財産の価額に相当する金銭の支払を請求した場合にあっては、当該金銭の全額の支払）をする義務を負う"}, {"aspect": "結論", "text": "問題1の論証例：会社が発起人Aに払込の金銭の全額支払い請求ができるかは、当該払込みが払込みを仮装した場合（52条の2第1項1号）にあたるかによる。払込みした資金が会社資金として運用できたとはいえない場合には、払込みは無効といえ、払込みを仮装した場合にあたると解する"}, {"aspect": "結論", "text": "問題1’の解答例：発起人が給付を仮装した場合、会社に対して、給付を仮装した出資に係る金銭以外の財産の全部の給付（株式会社が当該給付に代えて当該財産の価額に相当する金銭の支払を請求した場合にあっては、当該金銭の全額の支払）する義務を負う（52条の2第1項2号）"}, {"aspect": "条文", "text": "52条・34条"}], "articles": ["52条", "34条"], "pages": [231]}, {"id": "book-kigyoho-01-ch04-r031", "ch": 4, "topic": "教材問題2・問題3（株主の権利行使・設立無効）", "points": [{"aspect": "原則", "text": "例外的に設立の無効原因となる場合：①仮装出資（払込・給付）によって発行された株式数を除くと、発起人が設立時発行株式を1株も引き受けない場合（25条2項違反）、②出資財産の価額が27条4号に定める最低財産を下回る場合（27条4号違反）は、設立の無効原因となり、設立無効の訴えが認められる"}, {"aspect": "要件", "text": "問題2の論証例：Bが議決権の行使ができるかどうかは52条の2第5項の要件を満たすかどうかによる。株主の権利を行使できるためには、①払込の仮装があること、②株主となる権利を譲り受けたこと、③その者の善意・無重過失が必要である。そこで、本問の払込が仮装といえるかが問題となる"}, {"aspect": "結論", "text": "問題3の論証例：全額払込義務（34条1項、63条1項）は、そもそも失権制度（36条3項、63条3項）を認めていることからも絶対的なものではない。Aが全額払込みをしていなくても（全額払込義務違反は）、重大な法令違反とはいえず、設立の無効原因にならない"}, {"aspect": "条文", "text": "52条・34条・63条・36条・25条・27条"}], "articles": ["52条", "34条", "63条", "36条", "25条", "27条"], "pages": [232]}, {"id": "book-kigyoho-01-ch04-r032", "ch": 4, "topic": "設立無効の訴えの要件", "points": [{"aspect": "原則", "text": "設立の無効原因（重大な法令定款違反）の例：①発起人が設立時発行株式を1株も引き受けない場合（25条2項違反）、②定款の絶対的記載事項を欠く場合（27条違反）、③設立に際して出資される財産の価額が27条4号に定める最低財産を下回る場合（27条4号違反）"}, {"aspect": "要件", "text": "設立無効の訴えの要件：①株主等の提訴権者によること（828条2項1号）、②会社設立から2年以内の訴えであること（828条1項1号）、③明文の規定を欠くが無効原因が存在すること"}, {"aspect": "結論", "text": "無効原因は、法的安定性の見地から、重大な瑕疵（重大な法令定款違反）がある場合に限ると解する"}, {"aspect": "あてはめ", "text": "（別論証）認容確定判決がなされれば判決の効力は第三者にも及び（838条、対世効）、会社の清算手続（475条2号）が開始される（839条、将来効）ので、軽微な瑕疵であれば設立無効とはせず、重大な瑕疵（客観的瑕疵）がある場合のみ無効原因となると解する"}, {"aspect": "条文", "text": "828条・838条・839条・475条・25条・27条"}], "articles": ["828条", "838条", "839条", "475条", "25条", "27条"], "pages": [233]}, {"id": "book-kigyoho-01-ch04-r033", "ch": 4, "topic": "設立無効の効力（対世効・将来効）", "points": [{"aspect": "原則", "text": "a）認容判決の対世効（838条）：会社の組織に関する訴えとは828条から833条の訴えをいい、設立無効の訴え（828条1項1号、同条2項1号）を含む"}, {"aspect": "原則", "text": "b）認容判決の将来効（839条）：民法の原則は無効・取消は遡って無効である（遡及効、Aの時点から無効）"}, {"aspect": "結論", "text": "839条の適用があると将来効であるので、B以降、会社設立は無効となり会社の清算手続が開始される（475条2号）。したがってBまでになされた取引は有効のままである。将来効は認容確定判決までに生じた法律関係の安定に資するものである"}, {"aspect": "条文", "text": "838条・828条・833条・839条・475条"}], "articles": ["838条", "828条", "833条", "839条", "475条"], "pages": [234]}, {"id": "book-kigyoho-01-ch04-r034", "ch": 4, "topic": "参考問題（現物出資と発起人の責任）", "points": [{"aspect": "設例", "text": "参考問題の事案：甲社設立（発起設立）。発起人XとY。Xが設立の際、建物Aを現物出資（3000万円相当として）し、Yは3000万円の金銭出資をした。建物Aは構造上の欠陥があり実際には1000万円相当。Xは上記欠陥を知っていたが、Yは知らなかった"}, {"aspect": "設例", "text": "参考問題の設問：問題1 Xの出資に関して、会社法上の手続きを説明しなさい（検査役の調査の要否についても触れること）。問題2 本問において検査役の調査が不要だったとして、XおよびYの会社法上の責任について説明しなさい"}], "articles": [], "pages": [235]}, {"id": "book-kigyoho-01-ch04-r035", "ch": 4, "topic": "Ⅱ重要条文：設立手続・定款関係", "points": [{"aspect": "原則", "text": "暗記対象条文：設立 ― 25条～"}, {"aspect": "原則", "text": "暗記対象条文：設立登記 ― 49条"}, {"aspect": "原則", "text": "暗記対象条文：定款の絶対的記載・記録事項 ― 27条、37条"}, {"aspect": "原則", "text": "暗記対象条文：変態設立事項とくれば ― 28条、33条"}, {"aspect": "原則", "text": "暗記対象条文：現物出資 ― 28条1号"}, {"aspect": "原則", "text": "暗記対象条文：財産引受 ― 28条2号"}, {"aspect": "原則", "text": "暗記対象条文：事後設立 ― 467条1項5号"}, {"aspect": "原則", "text": "暗記対象条文：設立時取締役等による調査 ― 46条、93条"}, {"aspect": "条文", "text": "25条・49条・27条・37条・28条・33条・467条・46条・93条"}], "articles": ["25条", "49条", "27条", "37条", "28条", "33条", "467条", "46条", "93条"], "pages": [236]}, {"id": "book-kigyoho-01-ch05-r001", "ch": 5, "topic": "募集株式の発行等の全体像（資金調達の方法）", "points": [{"aspect": "原則", "text": "募集株式の発行等の手続の流れ：募集事項の決定⇒申込み⇒割当て⇒引受け⇒払込（出資）"}, {"aspect": "条文", "text": "199条・209条"}], "articles": ["199条", "209条"], "pages": [237]}, {"id": "book-kigyoho-01-ch05-r002", "ch": 5, "topic": "募集事項の決定（199条・200条・201条・202条）", "points": [{"aspect": "原則", "text": "199条：1項＝募集事項の決定、2項＝株主総会によって決定、3項＝「特に有利な金額」の場合は株主総会に理由の説明を要する、4項＝譲渡制限種類株式発行会社が当該種類株式をさらに発行する場合は株主総会決議のほかに種類株主総会特別決議を要する（199条4項、324条2項2号）、5項＝募集事項は募集ごとに均等に定める"}, {"aspect": "原則", "text": "200条［委任］1項：199条2項及び4項の規定にかかわらず、株主総会決議で、取締役または取締役会（取締役会設置会社の場合）へ委任できる"}, {"aspect": "原則", "text": "201条［公開会社の特則］1項：199条3項の場合を除き、199条2項の「株主総会」を「取締役会」とする"}, {"aspect": "原則", "text": "202条［株主割り当て］3項：1号＝定款の定めがあれば取締役の決定で、2号＝定款の定めあれば取締役会の決議で、3号＝公開会社は取締役会決議で、4号＝前3号以外は株主総会決議で"}, {"aspect": "原則", "text": "＜注＞309条2項5号により、199条2項・200条1項・202条3項4号の株主総会決議は特別決議である"}, {"aspect": "条文", "text": "199条・324条・200条・201条・202条・309条"}], "articles": ["199条", "324条", "200条", "201条", "202条", "309条"], "pages": [237, 238]}, {"id": "book-kigyoho-01-ch05-r003", "ch": 5, "topic": "株主割当て（202条）", "points": [{"aspect": "原則", "text": "株主割当てとは、既存の株主に持株数に比例して株式の割当てを受ける権利を付与して募集株式を割り当てる方法"}, {"aspect": "原則", "text": "（参）公開会社の募集株式の発行決定は原則として取締役会（201条1項、199条2項）。趣旨は迅速な資金調達を行えるようにするため（公開会社の株主は通常議決権比率に強い関心がない）"}, {"aspect": "原則", "text": "委任の特則：指名委員会等設置会社では執行役に委任可能（416条4項）。監査等委員会設置会社では399条の13第5項6項の場合は取締役に委任可能"}, {"aspect": "条文", "text": "202条・201条・199条・416条・399条"}], "articles": ["202条", "201条", "199条", "416条", "399条"], "pages": [238]}, {"id": "book-kigyoho-01-ch05-r004", "ch": 5, "topic": "上場会社が株式報酬として募集株式を発行する場合（202条の2第1項）", "points": [{"aspect": "趣旨", "text": "202条の2第1項1号の趣旨：会社は取締役の職務執行の対価として募集株式を交付するのであるから、あえて取締役に財産の出資を求める必要はないから"}, {"aspect": "原則", "text": "202条の2第1項は、上場会社が株式報酬として募集株式を発行する場合の募集事項を定める"}, {"aspect": "条文", "text": "202条"}], "articles": ["202条"], "pages": [238]}, {"id": "book-kigyoho-01-ch05-r005", "ch": 5, "topic": "募集株式の申込み・割当て（203条〜206条の2）", "points": [{"aspect": "原則", "text": "203条［募集株式の申込み］、204条［募集株式の割当て］。204条2項：募集株式が譲渡制限株式ならば、割当ての決定は株主総会の特別決議（cf. 309条2項5号）、取締役会決議（取締役会設置会社の場合）によるか、定款に別段の定めあればそれによる"}, {"aspect": "原則", "text": "205条［特則］：総数引受けの場合、前2条（203条・204条）を適用しない。206条［募集株式の引受け］"}, {"aspect": "原則", "text": "206条の2［公開会社における募集株式の割当て等の特則：支配株主の変更を伴う時］：原則通り取締役会決議によるが、1項＝株主への通知、4項＝総株主の議決権の1/10以上の株主の反対あれば株主総会決議が必要、5項＝それは341条と同じ普通決議"}, {"aspect": "条文", "text": "203条・204条・309条・205条・206条・2条・341条"}], "articles": ["203条", "204条", "309条", "205条", "206条", "2条", "341条"], "pages": [239]}, {"id": "book-kigyoho-01-ch05-r006", "ch": 5, "topic": "金銭以外の出資・出資の履行等（207条〜209条）", "points": [{"aspect": "原則", "text": "207条［現物出資］：＜注＞①定款の記載は不要、②発起人に限らない"}, {"aspect": "原則", "text": "208条［出資の履行］：1項＝全額払込、2項＝全部給付、3項＝相殺禁止、4項＝募集株式の株主となる権利（権利株）の譲渡は会社に対抗できない、5項＝出資を履行しない場合は株主となる権利を失う（当然失権）"}, {"aspect": "原則", "text": "209条［株主となる時期等］の見出し"}, {"aspect": "条文", "text": "207条・208条・209条"}], "articles": ["207条", "208条", "209条"], "pages": [239]}, {"id": "book-kigyoho-01-ch05-r007", "ch": 5, "topic": "募集に係る責任等の条文構造（211条〜213条の3）", "points": [{"aspect": "原則", "text": "211条［引受の無効・取消の主張の制限］。＜比較＞設立時の51条1項2項、102条3項4項"}, {"aspect": "原則", "text": "212条［引受人の責任］1項：1号＝取締役と通じて著しく不公正な金額で引き受けた場合、2号＝現物出資財産の価額が著しく不足する場合"}, {"aspect": "原則", "text": "213条［212条1項2号の場合の取締役等の責任］、213条の2［仮装払込みをした引受人の責任］、213条の3［仮装払込みをした取締役等の責任］の見出し"}, {"aspect": "条文", "text": "211条・51条・102条・212条・213条"}], "articles": ["211条", "51条", "102条", "212条", "213条"], "pages": [240]}, {"id": "book-kigyoho-01-ch05-r008", "ch": 5, "topic": "募集株式の発行等をめぐる視点（公開会社・非公開会社の保護の差異）", "points": [{"aspect": "結論", "text": "公開会社の場合は既存株主の経済的利益だけを保護し（201条1項、199条2項3項、309条2項5号）、支配的利益を保護していない。これは、公開会社では資金調達の機動性を図る必要性が高く、また既存株主は通常は市場で株式を購入することにより持株比率を維持できるからである"}, {"aspect": "結論", "text": "非公開会社の場合は既存株主の経済的利益のみならず支配的利益も保護している（199条2項、200条1項、309条2項5号）。これは、非公開会社では資金調達の機動性よりも株主間の緊密な関係の維持の方が重要であり、また既存株主は市場で株式を購入できず持株比率を維持する方法がないからである"}, {"aspect": "条文", "text": "201条・199条・309条・200条"}], "articles": ["201条", "199条", "309条", "200条"], "pages": [241]}, {"id": "book-kigyoho-01-ch05-r009", "ch": 5, "topic": "（論点）有利発行規制（199条3項）と「特に有利な金額」の意義", "points": [{"aspect": "原則", "text": "「特に有利な金額」（199条3項）での発行（有利発行）の場合は、公開会社・非公開会社を問わず、株主総会の特別決議と株主総会における取締役の理由の説明を要求している（201条1項、199条2項3項、309条2項5号）。有利発行は既存株主に経済的不利益（保有株式の希釈化による経済的損失）をもたらすおそれがあるからである"}, {"aspect": "原則", "text": "「特に有利な金額」とは、払込金額とすべき公正な払込金額に比べて特に低い払込金額をいう。公正な払込金額とは、募集株式の発行によって企画される会社の資金調達の目的が達せられる限度で、既存株主にとってもっとも有利な金額をいう"}, {"aspect": "あてはめ", "text": "本問のあてはめ：甲社は緊急に大型の事業計画もなく資金調達の必要性は低いにもかかわらず、時価よりも安い払込金額で発行がなされているため、公正な払込金額と比べても特に低い払込金額といえ、「特に有利な金額」といえる"}, {"aspect": "あてはめ", "text": "（参）市場価格より○○％低いから「特に有利な金額」といえる、と決まるわけではない"}, {"aspect": "条文", "text": "199条・201条・309条"}], "articles": ["199条", "201条", "309条"], "pages": [242]}, {"id": "book-kigyoho-01-ch05-r010", "ch": 5, "topic": "（論点）206条の2（支配株主の変更を伴う募集株式の割当て等の特則）", "points": [{"aspect": "趣旨", "text": "4項の趣旨：支配株主の変更は合併・株式交換等に準じる会社の基礎の変更であって、株主に影響があるから"}, {"aspect": "趣旨", "text": "5項の趣旨（2つの説明が併記）：支配株主の変更を伴う割当ては会社の経営者を決定する実質を伴うので取締役を選任する決議と類似するから。or 誰に会社の経営を支配させるかという問題は、誰を取締役として会社の経営を任せるかという問題と同様であるから、特別決議ではなく普通決議の承認を要求した"}, {"aspect": "原則", "text": "206条の2：原則通り取締役会決議による。ただし、1項＝株主への通知、4項＝総株主の議決権の1/10以上の株主の反対あれば株主総会決議が必要、5項＝それは341条と同じ普通決議"}, {"aspect": "条文", "text": "206条・341条"}], "articles": ["206条", "341条"], "pages": [243]}, {"id": "book-kigyoho-01-ch05-r011", "ch": 5, "topic": "（論点）金銭以外の財産の出資（207条・現物出資）", "points": [{"aspect": "趣旨", "text": "現物出資の規制の趣旨：設立時と同様に、目的財産の過大な評価による不当な株式付与により、会社の財産的基礎を害するとともに金銭出資者を害するおそれがあるため、規制されている"}, {"aspect": "原則", "text": "現物出資の問題。設立時の現物出資（3＋2など）との相違は、①定款の記載が不要、②発起人に限らない、の2点"}, {"aspect": "原則", "text": "207条9項：検査役の調査が省略できる場合。5号は、いわゆるデット・エクイティ・スワップ"}, {"aspect": "条文", "text": "207条"}], "articles": ["207条"], "pages": [243]}, {"id": "book-kigyoho-01-ch05-r012", "ch": 5, "topic": "（論点）募集株式の発行をやめることの請求（210条・差止請求）", "points": [{"aspect": "趣旨", "text": "210条の趣旨：募集株式の発行等によって株主が不利益を受けるおそれがあるとき、取締役・執行役の違法行為差止請求権（360条1項、422条1項）では株主の保護は不十分であるので、株主の利益保護を図る必要があるため"}, {"aspect": "要件", "text": "210条の差止請求の＜要件＞欄（①②）"}, {"aspect": "条文", "text": "210条・360条・422条"}], "articles": ["210条", "360条", "422条"], "pages": [244]}, {"id": "book-kigyoho-01-ch05-r013", "ch": 5, "topic": "（論点）議決権比率の低下を目的とする募集株式の発行等は不公正発行か（主要目的論）", "points": [{"aspect": "結論", "text": "主要目的論：取締役会に募集事項の決定を認めた趣旨は主として会社の機動的な資金調達の便宜のためであるから、募集株式の発行等の主要目的が、資金調達目的を超えて特定の株主の議決権比率の低下にある場合は、「著しく不公正な方法」にあたる"}, {"aspect": "結論", "text": "東京地裁決平成元7・25の立場（主要目的論）である"}, {"aspect": "条文", "text": "210条・201条"}], "articles": ["210条", "201条"], "pages": [244]}, {"id": "book-kigyoho-01-ch05-r014", "ch": 5, "topic": "募集に係る責任等（212条・213条）", "points": [{"aspect": "図表", "text": "図：募集に係る責任の関係。引受人Aが取締役等Xと通じて著しく不公正な払込金額で金銭出資した場合・現物出資の価格が著しく不足した場合に、引受人の責任＝212条、取締役等の責任＝213条（cf. 設立時の52条責任と類似）"}, {"aspect": "条文", "text": "212条・213条・52条"}], "articles": ["212条", "213条", "52条"], "pages": [244]}, {"id": "book-kigyoho-01-ch05-r015", "ch": 5, "topic": "出資の履行の仮装の場合の責任等（213条の2・213条の3・209条）", "points": [{"aspect": "趣旨", "text": "Aの支払・給付義務、Xの支払い義務の趣旨：①出資の履行が仮装された場合、これに関与していない株主から仮装した株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）、②会社の資金が確保されたと信じた会社債権者の保護の必要性"}, {"aspect": "原則", "text": "A（引受人）の支払・給付義務（213条の2第1項）。無過失責任"}, {"aspect": "原則", "text": "X（仮装に関与した取締役・執行役）の支払義務（213条の3）。過失責任"}, {"aspect": "原則", "text": "AまたはX・Yが義務を果たせば、Aは「株主の権利を行使すること」ができる（209条2項。例：議決権の行使、剰余金の配当請求）。趣旨は、会社財産が充実した以上、仮装払込をした引受人の権利行使を否定する理由はないから"}, {"aspect": "原則", "text": "B（譲受人）は、悪意・重過失でなければ「株主の権利を行使すること」ができる（209条3項）。趣旨は、株式取引の安全を図るため"}, {"aspect": "原則", "text": "213条の2第1項の条文：募集株式の引受人は、208条1項の規定による払込みを仮装した場合には、払込みを仮装した払込金額の全額の支払をする義務を負う"}, {"aspect": "あてはめ", "text": "（論点）要件の「払込みを仮装した場合」「給付を仮装した場合」とは？――本文は「ー省略ー」と明記し、内容を省略している"}, {"aspect": "あてはめ", "text": "この趣旨は、事例問題ではあまり書くことがない。説明問題では記述必要"}, {"aspect": "条文", "text": "213条・209条・208条"}], "articles": ["213条", "209条", "208条"], "pages": [245, 246]}, {"id": "book-kigyoho-01-ch05-r016", "ch": 5, "topic": "（参考）払込がなされなかった場合と仮装の場合の比較", "points": [{"aspect": "原則", "text": "出資額100万円の例：1＝払込がなされなかった（0円）場合は株主となる権利の喪失（208条5項、当然失権）。2＝払込がなされたが仮装（実際0円）の場合は支払義務＋株主の権利行使可能（213条の2第1項、213条の3、209条2項3項）。これらの規定は208条5項の例外規定となり、仮装の場合は失権しない"}, {"aspect": "条文", "text": "208条・213条・209条"}], "articles": ["208条", "213条", "209条"], "pages": [246]}, {"id": "book-kigyoho-01-ch05-r017", "ch": 5, "topic": "（問題3）出資の履行の仮装は新株発行の無効原因となるか", "points": [{"aspect": "結論", "text": "「株主の権利を行使することができない」（209条2項）、「できる」（同条3項）との文言からすると、出資の履行の仮装がなされても株式は有効であるので、出資の履行の仮装は、新株発行の無効の訴えの無効原因にはならない"}, {"aspect": "あてはめ", "text": "争いあるが、試験上は以下のような理解で足りる（直接本試験には出題されないでしょう）という位置づけ"}, {"aspect": "条文", "text": "828条・209条"}], "articles": ["828条", "209条"], "pages": [247]}, {"id": "book-kigyoho-01-ch05-r018", "ch": 5, "topic": "新株発行等の無効の訴え（828条）の要件・効果と答案の流れ", "points": [{"aspect": "原則", "text": "認容判決の効力（効果）：対世効（838条）、将来効（839条）"}, {"aspect": "要件", "text": "無効の訴えの要件：①株主等による、株式発行の効力発生日から6ヶ月以内の訴えであること、②無効原因があること"}, {"aspect": "あてはめ", "text": "答案の流れ：甲社「株主」Aは、「株式発行の効力発生日から6ヶ月以内」である○年○月○日に、新株発行無効の「訴え」を提起している（828条1項2号、同条2項2号）。そこで、かかる訴えが認められるかは、公開会社において取締役会の決議を欠いて新株を発行したことが無効原因となるかによる"}, {"aspect": "条文", "text": "828条・838条・839条"}], "articles": ["828条", "838条", "839条"], "pages": [248]}, {"id": "book-kigyoho-01-ch05-r019", "ch": 5, "topic": "（論点）210条の差止事由と828条の無効原因の比較", "points": [{"aspect": "結論", "text": "発行前は新たな株主が現れていないので取引の安全を考慮する必要はなく、差止事由は広く認めてもよい。これに対し、発行後は新たな株主が生まれ株式が流通することがあり得るので取引の安全を考慮する必要があり、新株発行の無効原因は重大な瑕疵（法令定款違反）に限る"}, {"aspect": "条文", "text": "210条・828条"}], "articles": ["210条", "828条"], "pages": [248]}, {"id": "book-kigyoho-01-ch05-r020", "ch": 5, "topic": "（論点）公開会社において株主総会の特別決議を欠いた有利発行の効力", "points": [{"aspect": "結論", "text": "論証例A：新株発行は会社の業務執行に準ずるものであり、株主総会の特別決議の要件も取締役会の権限行使についての内部的要件に過ぎず、取締役会の権限に基づき代表取締役が新株を発行した以上、取引の安全を重視して、株主総会の特別決議を欠く新株発行も無効原因はない（最判昭和46・7・16も同様に考える）"}, {"aspect": "結論", "text": "論証例B：新株の効力発生後は取引の安全を重視すべきであり、有効な株主総会決議がないからといって新株の有利発行を無効とすると取引の安全を害する。また、株主は事前に差止請求権（210条）を行使できた以上、不利益を受けてもやむをえない。したがって、有効な株主総会特別決議を欠いて第三者に行った新株の有利発行も有効（無効原因にはならない）"}, {"aspect": "あてはめ", "text": "＜視点1＞株式発行の性質：①会社の人的物的拡大行為（組織法上の行為）か、②業務執行に準ずる行為（取引的行為←資金調達のため）か。②を重視すれば、株式発行に瑕疵があっても取引の安全の観点から株式発行は有効（無効原因とはならない）"}, {"aspect": "あてはめ", "text": "上記の事案で、取締役会の決議はあるが株主への通知・公告（201条3項4項）を欠く場合は別問題。それが令和7年の第1問の問題である（詳しくは過去問検討の際に解説する）"}, {"aspect": "条文", "text": "828条・201条・199条・210条"}], "articles": ["828条", "201条", "199条", "210条"], "pages": [249, 250]}, {"id": "book-kigyoho-01-ch05-r021", "ch": 5, "topic": "（論点）公開会社において取締役会の決議を欠いて新株を発行した場合の効力", "points": [{"aspect": "結論", "text": "論証例A：新株の発行は会社の業務執行に準じて取り扱われるものであるから、たとえ新株発行に関する有効な取締役会の決議がなくても、取引の安全を重視して、無効原因にはならない（最判昭和36・3・31も同様に考える）"}, {"aspect": "結論", "text": "論証例B：新株の効力発生後は取引の安全を重視すべきであり、取締役会決議がないことを理由に新株発行を無効とすると取引の安全を害する。また、株主は事前に差止請求権（210条）を行使できた以上、不利益を受けてもやむをえない。したがって、有効な取締役会決議を欠いて代表取締役が行った新株発行も有効（無効原因にはならない）"}, {"aspect": "あてはめ", "text": "前提：株主への通知・公告（201条3項4項）はあった場合である。具体例として、一部取締役への招集通知漏れがあり取締役会決議が無効となった事案がこの論点である"}, {"aspect": "条文", "text": "201条・828条・210条"}], "articles": ["201条", "828条", "210条"], "pages": [251]}, {"id": "book-kigyoho-01-ch05-r022", "ch": 5, "topic": "（論点）著しく不公正な方法により新株が発行された場合", "points": [{"aspect": "結論", "text": "論証例A：新株の発行は会社の業務執行に準じて取り扱われるものであるから、取引の安全を重視して、たとえ新株が著しく不公正な方法により発行された場合であっても、無効原因にはならない（最判平成6・7・14も同様に考える）"}, {"aspect": "結論", "text": "論証例B：新株発行が著しく不公正な方法だったという事情は会社の内部事情にすぎず、無効とすべきでない。また、株主は事前に差止請求権（210条）を行使できた以上、不利益を受けてもやむをえない。したがって、著しく不公正な方法による新株発行は無効原因にならない"}, {"aspect": "条文", "text": "210条・828条"}], "articles": ["210条", "828条"], "pages": [252]}, {"id": "book-kigyoho-01-ch05-r023", "ch": 5, "topic": "（論点）株主の差止請求（210条）を無視した新株発行の効力", "points": [{"aspect": "結論", "text": "差止めの仮処分等まで出ている場合にこれを無視した新株発行は無効（無効原因になる）。裁判所の公権的判断がなされている場合にまで有効としたのでは法秩序の維持という司法制度の目的に反し、また株主保護のために差止めを認めた210条の趣旨に反するからである。もっとも、口頭や書面で差止請求がされたにすぎない場合は、これを無視した新株発行は有効（無効原因にはならない）"}, {"aspect": "結論", "text": "最判平成5・12・16の立場である"}, {"aspect": "条文", "text": "210条・828条"}], "articles": ["210条", "828条"], "pages": [253]}, {"id": "book-kigyoho-01-ch05-r024", "ch": 5, "topic": "（論点）公開会社において募集事項の通知・公告を欠いて新株発行がなされた場合", "points": [{"aspect": "結論", "text": "通知・公告を欠いた新株発行は、原則、無効（無効原因になる）。通知・公告を要求した趣旨は株主の差止請求権（210条）行使の機会の保障にあり、この重大な権利行使の機会を奪っているからである。ただし、通知・公告を欠いた以外に瑕疵がない場合で、差止事由が存在しなかったことを会社が立証したときは、例外的に有効（無効原因にはならない）"}, {"aspect": "結論", "text": "最判平成9・1・28の立場である"}, {"aspect": "条文", "text": "201条・210条"}], "articles": ["201条", "210条"], "pages": [253]}, {"id": "book-kigyoho-01-ch05-r025", "ch": 5, "topic": "判例法理の整合的理解", "points": [{"aspect": "結論", "text": "判例は、新株発行の紛争はできるだけ差止請求により争わせるものとし、差止制度が機能しなかったときに限り新株発行の効力を事後的に否定するという立場として、整合的に理解できる（吉本）。公開会社における新株発行の違法性に関する争いは、できるだけ事前の差止請求の中で解決しようとする最高裁の姿勢がうかがえる（田中）"}, {"aspect": "条文", "text": "210条・828条"}], "articles": ["210条", "828条"], "pages": [254]}, {"id": "book-kigyoho-01-ch05-r026", "ch": 5, "topic": "悪意の株式引受人が株式を保有している場合（折衷説と判例）", "points": [{"aspect": "結論", "text": "判例（最判平成6・7・14）は、「新株の発行が会社と取引関係に立つ第三者を含めて広い範囲の法律関係に影響を及ぼす可能性があることにかんがみれば……」と表現して、募集株式の発行を無効とは解さないとしている。＊「第三者」とは、たとえば会社債権者か"}, {"aspect": "あてはめ", "text": "（参）最判平成6・7・14の判示：発行された新株が取締役の地位にある者によって引き受けられ現に保有していること、あるいは会社が小規模で閉鎖的な会社であることなどの事情は結論に影響を及ぼすものではない。新株の発行が広い範囲の法律関係に影響を及ぼす可能性があることにかんがみれば、その効力を画一的に判断する必要があり、個々の事案ごとに判断することは相当でないからである"}, {"aspect": "条文", "text": "828条・201条"}], "articles": ["828条", "201条"], "pages": [255]}, {"id": "book-kigyoho-01-ch05-r027", "ch": 5, "topic": "（論点）非公開会社において株主総会の特別決議を欠いて新株が発行された場合", "points": [{"aspect": "結論", "text": "非公開会社では持株比率の維持という既存株主の支配的利益の保護を重視すべきであり（提訴期間が非公開会社は1年に延長されていること（828条1項2号）からも）、取引の安全よりも支配的利益の保護を重視すべく、株主総会の特別決議を経ない募集株式の発行は新株発行無効の訴えの無効原因になる（最判平成24・4・24の立場）"}, {"aspect": "あてはめ", "text": "前提：非公開会社の場合、株式発行（募集事項の決定）を株主総会の特別決議としたのは、既存株主の支配的利益をより重視するからである"}, {"aspect": "あてはめ", "text": "＜非公開会社におけるキー・ワード＞「持株比率の維持に対する既存株主の利益を尊重するのが，会社法の趣旨」（最判平成24・4・24）、「株式取引の安全を考慮する必要性が公開会社ほど強くない」"}, {"aspect": "条文", "text": "199条・309条・828条"}], "articles": ["199条", "309条", "828条"], "pages": [256]}, {"id": "book-kigyoho-01-ch05-r028", "ch": 5, "topic": "（参考）（論点）行使条件に反する新株予約権の行使と非公開会社の新株発行の効力", "points": [{"aspect": "結論", "text": "＜考え方＞非公開会社は「持株比率の維持に対する既存株主の利益を尊重するのが，会社法の趣旨」。非公開会社では、既存株主の持株比率が既存株主の意思に反して影響を受けることになれば株式発行は無効にすべきであり、重要な行使条件に違反して新株予約権が行使され株式発行がなされた場合、支配的利益が意思に反して害される点で上記論点と同様なので無効原因となる"}, {"aspect": "あてはめ", "text": "本件は、Y社株式を証券取引所に上場して安定させてくれたら経営者の持株比率を上げてもいいからがんばって、という意図で株主総会の特別決議によって行使条件を付与しているのであるから、重要な行使条件といえる"}, {"aspect": "条文", "text": "828条"}], "articles": ["828条"], "pages": [257]}, {"id": "book-kigyoho-01-ch05-r029", "ch": 5, "topic": "＜考えてみよう＞複合問題（不公正発行＋通知・公告）", "points": [{"aspect": "結論", "text": "①（議決権比率低下目的の発行）では無効原因にはならない。←「（論点）著しく不公正な方法（210条2号参照）により新株が発行された場合」で処理する"}, {"aspect": "結論", "text": "②（公告の時期）：募集事項の「通知」は「公告」に代えることができる（201条3項4項）が、「2週間前まで」の通知または公告が必要であり、趣旨（210条の差止めを行うかどうかの熟慮期間）からすると3日前の公告では不十分で、通知・公告とはいえない。そこで「通知・公告を欠いた場合」の論点となり、原則、無効（無効原因）。例外は、通知・公告を欠いた以外に瑕疵がない場合で差止事由が存在しなかったことを会社が立証したとき"}, {"aspect": "あてはめ", "text": "次に、差止事由（原因）の有無が問題となる。「（論点）公開会社において特定の株主の議決権比率の低下を目的とする募集株式の発行等は不公正発行か。」について、主要目的が何かを書いていく"}, {"aspect": "条文", "text": "828条・201条・210条"}], "articles": ["828条", "201条", "210条"], "pages": [258]}, {"id": "book-kigyoho-01-ch05-r030", "ch": 5, "topic": "教材問題：公開会社の募集株式発行の効力（令和5年・X/Y事案）", "points": [{"aspect": "結論", "text": "（解答例）5：本件発行がXの議決権比率の低下を図るため、また特に有利な金額をもってなされているが、無効原因が存在するとはいえない。したがって、株式発行無効の訴えは認められず、Xは、本件発行の効力を争うことができない"}, {"aspect": "あてはめ", "text": "＊注目：問題が「令和5年7月24日に、Xは、本件発行の効力を争うことができるか」である場合、無効原因の有無だけを書けば良いのではなく、828条1項2号2項2号の要件も書く必要がある。問題に日付やXが株主である事実が書かれていることからも、あてはめでそれらの事実を書いて欲しい問題と理解すべきである"}, {"aspect": "あてはめ", "text": "（解答例）1：Xが本件発行の効力を争う方法としては株式発行無効の訴え（828条1項2号）が考えられる。令和5年7月24日は、本件発行の効力発生日（同月27日、209条1項1号）から「6ヶ月以内」であるので、無効原因があれば、甲会社の「株主等」（828条2項2号）であるXは訴えを提起することができる"}, {"aspect": "条文", "text": "828条・209条"}], "articles": ["828条", "209条"], "pages": [259, 260]}, {"id": "book-kigyoho-01-ch05-r031", "ch": 5, "topic": "論述検討：無効原因は重大な法令定款違反に限るという規範", "points": [{"aspect": "あてはめ", "text": "＜論述検討＞設立無効の訴え、合併などの組織再編行為の無効の訴えの場合のように、828条の要件の「無効原因」の多くは「重大な法令定款違反（重大な瑕疵）」を規範とする場合が多い"}, {"aspect": "あてはめ", "text": "会社設立無効の主張が認められるためには、①株主等による会社設立から2年以内の訴えであること、②明文の規定を欠くが無効原因が存在することが必要である。そして、法的安定性、取引の安全の見地から、無効原因は重大な法令定款違反がある場合に限ると解する"}, {"aspect": "あてはめ", "text": "この規範の限界：ⅰ判例自体は「重大な法令定款違反」という規範を採用していない。ⅱこの規範が使えない場合がある（（論点）著しく不公正な方法（210条2号参照）により新株が発行された場合には、上記の論述は使えない）。もっとも、判例でない問題の場合は、上記論述は使える"}, {"aspect": "設例", "text": "（例）検査役の調査を欠く現物出資がなされて発行された株式の効力：無効の主張には①効力発生日から6ヶ月以内の訴え、②無効原因の存在が必要で、無効原因は重大な法令定款違反に限る。本件出資は現物出資であるのに検査役の調査を欠いている点に207条違反があり、その違反は重大な法令違反といえるので②も満たし、本件株式発行の無効の訴えは認められる"}, {"aspect": "条文", "text": "828条・210条・207条"}], "articles": ["828条", "210条", "207条"], "pages": [261]}, {"id": "book-kigyoho-01-ch05-r032", "ch": 5, "topic": "＜視点Ⅰ＞新株予約権の「2つの払込」と出資該当性", "points": [{"aspect": "結論", "text": "Q 2つの払込とも、出資か？→発行の際の払込は出資ではない／行使の際の払込は出資である（ヒント：出資すれば株主になる）。発行の際の払込は、①無償も可能、②金銭以外での払込であっても現物出資ではない。したがって、検査役の調査などの規制はない"}], "articles": [], "pages": [262]}, {"id": "book-kigyoho-01-ch05-r033", "ch": 5, "topic": "＜視点Ⅱ＞新株予約権は潜在的株式（株式の規定との対応）", "points": [{"aspect": "あてはめ", "text": "新株予約権は、いわば潜在的株式。したがって、新株予約権の規定（条文）は、原則として株式の規定（条文）と同じ。（参考）新株予約権は譲渡可能（254条）。これに対し、募集株式の割当を受ける権利（←株主割当て、202条）は譲渡不可能（（理由）204条4項「株主」）"}, {"aspect": "条文", "text": "254条・202条・204条"}], "articles": ["254条", "202条", "204条"], "pages": [262]}, {"id": "book-kigyoho-01-ch05-r034", "ch": 5, "topic": "（1）新株予約権の発行（238条～）と247条差止め", "points": [{"aspect": "原則", "text": "238条から241条は、株式の募集事項の決定に関する199条～202条と同じ規定である"}, {"aspect": "原則", "text": "247条（募集新株予約権の発行をやめることの請求）全文：次に掲げる場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、第二百三十八条第一項の募集に係る新株予約権の発行をやめることを請求することができる。一 当該新株予約権の発行が法令又は定款に違反する場合、二 当該新株予約権の発行が著しく不公正な方法により行われる場合"}, {"aspect": "あてはめ", "text": "247条は募集株式の発行の差止めの規定（210条）と同じ規定である。cf. 新株予約権発行無効の訴え（828条1項4号）"}, {"aspect": "条文", "text": "238条・241条・199条・202条・247条・210条・828条"}], "articles": ["238条", "241条", "199条", "202条", "247条", "210条", "828条"], "pages": [263]}, {"id": "book-kigyoho-01-ch05-r035", "ch": 5, "topic": "（2）新株予約権の譲渡等・（3）行使・（4）新株予約権者・取締役の責任", "points": [{"aspect": "原則", "text": "（2）新株予約権の譲渡等（254条～）"}, {"aspect": "原則", "text": "（3）新株予約権の行使（280条～）：281条1項は金銭出資の全額払込義務、2項は現物出資の全部給付義務・差額支払義務、3項は相殺禁止（cf. 株式の場合と同じ（208条3項））。284条は現物出資規制（cf. 株式の207条と同じ内容）"}, {"aspect": "原則", "text": "（4）新株予約権者・取締役の責任（285条～）：株式の場合の責任と原則同じであり、新株予約権を株式と読みかえて考える（285条≒212条、286条＝213条）。仮装払込等の場合の責任等として、新株予約権を行使した新株予約権者の支払等の義務（286条の2第1項）、仮装に関与した取締役・執行役の支払義務（286条の3）、（出資の履行後の）引受人の権利行使の許容（282条2項）、（善意・無重過失の）譲受人の株主権の行使の許容（282条3項）。cf. 282条1項＝「株主となる時期」"}, {"aspect": "条文", "text": "254条・281条・284条・208条・207条・280条・285条・286条・282条・212条・213条"}], "articles": ["254条", "281条", "284条", "208条", "207条", "280条", "285条", "286条", "282条", "212条", "213条"], "pages": [263]}, {"id": "book-kigyoho-01-ch05-r036", "ch": 5, "topic": "①ベルシステム24事件（東京高平決16・8・4）：主要目的論のあてはめ基準", "points": [{"aspect": "結論", "text": "公開会社において取締役会に募集株式の発行権限が認められた趣旨は、会社の機動的な資金調達の便宜のためである（201条1項、199条2項）。そうだとすると、募集株式の発行等の主要目的が、資金調達を超えて特定の株主の議決権比率の低下にある場合には、「著しく不公正な方法」（210条2号）にあたる。主要目的の判断は、資金調達の緊急性の要否や、事業計画の合理性・事業計画のための資金調達の必要性から判断する"}, {"aspect": "結論", "text": "そうだとすると、支配権維持目的があるからといってそれが主たる目的とはいえない。したがって、本件募集株式の発行は、「著しく不公正な方法」による株式発行とはいえない"}, {"aspect": "あてはめ", "text": "本問のあてはめ：Xと対立するY会社の経営陣がXの株主提案直後に本件募集株式の発行を決議していることからすると、支配権維持目的との疑いを容易に否定できない。しかし、本件Aとの業務提携という事業計画は合理性あるといえるし、Aとの業務提携のためには資金調達も必要であったといえる"}, {"aspect": "あてはめ", "text": "本問では、支配権争いが現実に生じているなかで、急遽業務提携が計画され募集株式の発行がなされようとしていることから、支配権維持目的が強く疑われる。そこで、それに優越する資金調達の必要性・合理性があるかを具体的に書くことが望まれる"}, {"aspect": "あてはめ", "text": "Q なお、Bの持株比率が50％を超えていた場合は？→平成26年改正によって、206条の2の問題となり、株主総会の普通決議が必要となる。そこでこの場合は、Xは株主総会決議を否決させる可能性がある"}, {"aspect": "条文", "text": "210条・201条・199条・206条"}], "articles": ["210条", "201条", "199条", "206条"], "pages": [264, 265]}, {"id": "book-kigyoho-01-ch05-r037", "ch": 5, "topic": "②ニッポン放送事件（東京高決平成17・3・23）：主要目的でも不公正発行に当たらない場合", "points": [{"aspect": "結論", "text": "経営支配権の維持・獲得を目的とした新株予約権の発行は原則「著しく不公正な方法」による発行にあたる（誰を経営者としてどのような方針で経営させるかは、株主総会における取締役選任を通じて株主が資本多数決によって決すべき問題だから）。しかし、株主全体の利益保護の観点から、敵対的買収者が真摯に合理的な経営を目指すものでなく、敵対買収者による支配権取得が会社に回復しがたい損害をもたらす事情があることを会社が疎明、立証した場合には、当該新株予約権の発行は「著しく不公正な方法」による発行に当たらない"}, {"aspect": "結論", "text": "本決定は、210条に関する従来の判例法理である主要目的論を基本的に踏襲し、そのうえで「株主全体の利益保護の観点から」例外を認めている。なお、ニッポン放送事件の決定は、「X社がY社の事業や資産を食い物にするような目的」と「認めるに足りる確たる資料はない」として「著しく不公正な方法」の発行と認定している"}, {"aspect": "条文", "text": "247条・210条"}], "articles": ["247条", "210条"], "pages": [266]}, {"id": "book-kigyoho-01-ch05-r038", "ch": 5, "topic": "③ブルドックソース事件（論点1）247条類推適用の可否", "points": [{"aspect": "要件", "text": "（論点1）Xによる当該新株予約権の無償割当ての差止め（247条類推適用）が認められるか。↓Yes（本決定では争われておらず）。247条（類推適用）の要件：①当該新株予約権の無償割当が法令定款に違反すること、または、著しく不公正な方法により行われたこと、②株主が不利益を受けるおそれがあること。（論点2）差別的条件を有する本件新株予約権無償割当ては、株主平等原則（109条）違反という法令違反、および、不公正発行に該当するといえるか"}, {"aspect": "結論", "text": "（論点1の論述）新株予約権無償割当て（277条）によって、通常は既存株主が不利益を受けるおそれがないので差止め請求を認める規定はない。しかし、新株予約権無償割当てによって既存株主が不利益を受けるおそれがある場合には、募集新株予約権発行（238条）によって既存株主が不利益を受けるおそれがある場合と変わるところはない。したがって、新株予約権無償割当てにも新株予約権発行の差止めの規定（247条）が類推適用される"}, {"aspect": "条文", "text": "247条・277条・278条・109条・238条"}], "articles": ["247条", "277条", "278条", "109条", "238条"], "pages": [267]}, {"id": "book-kigyoho-01-ch05-r039", "ch": 5, "topic": "③ブルドックソース事件（論点2）109条（株主平等の原則）違反の可否", "points": [{"aspect": "結論", "text": "判例の考え方：株主平等原則は個々の株主の利益を保護するものであるが、個々の株主の利益は会社の存立、発展なくしては考えられない。①特定の株主による経営支配権の取得に伴い会社の存立、発展が阻害されるおそれが生じるなど、会社の企業価値が毀損され、会社の利益ひいては株主の共同の利益が害されることになるような場合には、②その防止のため当該株主を差別的に取り扱ったとしても、当該取扱いが衡平の理念に反し、相当性を欠くものでない限り、株主平等原則の趣旨に反するものということはできない。また、株主の共同の利益が害されるか否かの判断は最終的には株主自身によって判断されるべきであり、株主総会における判断が尊重されるべきである。本問では株主総会決議によって防衛策が必要と判断され、Xには1個約400円で新株予約権を取得されるという経済的補償が予定されていることから、当該取扱いが相当性を欠くものとはいえず、当該新株予約権の無償割当が株主平等原則に反するとはいえない"}, {"aspect": "結論", "text": "したがって、「当該新株予約権の無償割当が法令定款に違反すること」という247条類推適用の要件を満たさない。＊判例は、上記と同様の理由から、「当該新株予約権の無償割当が著しく不公正な方法により行われたこと」（不公正発行）に該当しないとしている"}, {"aspect": "あてはめ", "text": "上記判例の例外を認める規範①②：①＝買収によって株主共同の利益が害されることを防止するために必要なものであること（防衛策の必要性）、②＝買収者に対する差別的取扱いが相当性を欠くものでないこと（防衛策の相当性）"}, {"aspect": "条文", "text": "109条・247条"}], "articles": ["109条", "247条"], "pages": [268]}, {"id": "book-kigyoho-01-ch05-r040", "ch": 5, "topic": "＜使える現場思考＞例外を認めるときのキーワード", "points": [{"aspect": "あてはめ", "text": "＜使える現場思考＞判例がよく使う例外を認めるときのキーワード：必要性・許容性・相当性・緊急性。↓趣旨を書き、趣旨からすると例外を認めても許される"}], "articles": [], "pages": [269]}, {"id": "book-kigyoho-01-ch05-r041", "ch": 5, "topic": "3 社債の発行（決定機関・趣旨・条文構造）", "points": [{"aspect": "趣旨", "text": "（趣旨）社債発行が取締役の決定・取締役会決議とされた趣旨は、社債の発行は本質的には借入れであり、業務執行の一環であるからである"}, {"aspect": "原則", "text": "＜条文構造＞第四編社債：第一章総則（676条～701条）、第二章社債管理者（702条～714条）、第二章の二社債管理補助者（714条の2～714条の7）、第三章社債権者集会（715条～742条）。・704条（社債管理者の義務）、・710条1項（社債管理者の一般的責任）、710条2項（社債管理者の特別の責任）"}, {"aspect": "条文", "text": "348条・362条・399条・416条・676条・742条
