<script>
var DATA = {"questions": [{"id": "book-kigyoho-01-ch01-q5000", "ch": 1, "type": "規定→趣旨", "q": "公開会社においては、募集株式の発行等は、取締役会の決定によることができるものとされている（201条1項、199条2項）。このように取締役会に発行権限が認められている趣旨は何か。また、その趣旨は、募集株式の発行等が「著しく不公正な方法」（210条2号）にあたるかの判断にどう結びつくか。", "a": "取締役会に発行権限が認められる趣旨は、主として機動的な資金調達の便宜のためである。そのため、発行等の主要目的が資金調達目的をこえて特定の株主の議決権比率の低下にある場合は、「著しく不公正な方法」にあたると解する（主要目的基準）。", "reason": "発行権限の趣旨が機動的な資金調達の便宜にある以上、その趣旨を逸脱し、支配関係の維持・変更を主要目的とする発行は「著しく不公正な方法」にあたるという規範が、趣旨からの理由づけによって立てられる。", "basis": "PDF p.9（本編 p.6）。台帳要素 t002-e22（条文の文言解釈の場合の論証例：特定の株主の議決権比率の低下を目的とする募集株式の発行等が「著しく不公正な方法」（210条2号）にあたるか。公開会社で取締役会に発行権限が認められる趣旨（201条1項、199条2項）は主として機動的な資金調達の便宜のためであるから、発行等の主要目的が資金調達目的をこえて特定の株主の議決権比率の低下にある場合は「著しく不公正な方法」にあたると解する（主要目的基準）） の逐語引用に基づく。", "caution": "本問は第1章の論証例（条文の文言解釈の場合）に基づく。", "articles": ["201条1項", "199条2項", "210条"], "page": 9, "loc": "項目2 「～について論じなさい。」問題"}, {"id": "book-kigyoho-01-ch01-q5001", "ch": 1, "type": "規定→趣旨", "q": "取締役が会社の承認を得ずに利益相反取引（356条1項2号・3号、365条1項）をした場合、その取引の効力が問題となる。この場面で、会社の承認を要求する制限（規制）の趣旨は何か。また、その趣旨から、取引の効力はどのように解されるか。", "a": "制限の趣旨は会社の利益を保護することにあるから、無効と解する。ただし、取引の安全に配慮し、取締役からの転得者や間接取引の相手方に対しては、会社は、その者が①当該取引が利益相反取引に該当すること、②会社の承認を得ていないことについて悪意であることを立証しなければ、無効を主張できない。", "reason": "承認規制の趣旨（会社の利益の保護）からは無効が導かれるが、相手方の保護（取引の安全）との衡量から、転得者・間接取引の相手方に対しては悪意の立証を要する相対的無効の構成がとられる。", "basis": "PDF p.9（本編 p.6）。台帳要素 t002-e24（明文がない場合の論証例：会社の承認を得ずになされた利益相反取引（356条1項2号3号、365条1項）の効力。制限の趣旨は会社の利益を保護することにあるから無効と解する。ただし取引の安全に配慮し、取締役からの転得者や間接取引の相手方に対しては、会社はその者が①当該取引が利益相反取引に該当すること、②会社の承認を得ていないことについて悪意であることを立証しなければ無効を主張できない） の逐語引用に基づく。", "caution": "本問は第1章の論証例（明文がない場合）に基づく。", "articles": ["356条1項", "365条1項"], "page": 9, "loc": "項目2 「～について論じなさい。」問題"}, {"id": "book-kigyoho-01-ch01-q5002", "ch": 1, "type": "何条", "q": "次の定めは、会社法何条のものか。「次に掲げる場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、第百九十九条第一項の募集に係る株式の発行又は自己株式の処分をやめることを請求することができる。」", "a": "会社法210条（募集株式の発行等の差止請求）。", "reason": "各号に掲げる場合（1号：法令・定款違反、2号：著しく不公正な方法）に、株主が発行・処分をやめることを請求できる制度は210条の差止請求である。", "basis": "PDF p.4（本編 p.1）。台帳要素 t001-e02（例として引かれる会社法210条の条文そのもの（募集株式の発行等の差止請求）） の逐語引用に基づく。", "caution": "第1章では、要件・効果を読み取る素材として引用される条文である。", "articles": ["210条"], "page": 4, "loc": "項目1 前提：要件・効果を意識すること"}, {"id": "book-kigyoho-01-ch01-q5003", "ch": 1, "type": "条文構造", "q": "会社法210条（募集株式の発行等の差止請求）は、どのような構造の条文か。本文と各号がそれぞれ何を定めているか述べよ。", "a": "本文が、株主が不利益を受けるおそれがあるときに、募集株式の発行又は自己株式の処分をやめることを請求できるという要件と効果を定め、各号が差止めの対象となる場合を列挙する構造である。1号は、当該株式の発行又は自己株式の処分が法令又は定款に違反する場合、2号は、著しく不公正な方法により行われる場合である。", "reason": "210条は「本文＝請求の要件・効果」「各号＝差止事由の列挙」という分担で組み立てられており、第1章の答案例もこの本文と各号から要件を分解して読み取っている。", "basis": "PDF p.4（本編 p.1）。台帳要素 t001-e02（例として引かれる会社法210条の条文そのもの。本文と1号・2号） の逐語引用に基づく。", "caution": "第1章では、要件・効果を読み取る素材として引用される条文である。", "articles": ["210条", "210条1号", "210条2号"], "page": 4, "loc": "項目1 前提：要件・効果を意識すること"}, {"id": "book-kigyoho-01-ch01-q5004", "ch": 1, "type": "何条", "q": "役員等が任務を懈怠して会社に損害を生じさせた場合に、その役員等が会社に対して損害賠償責任を負うという、任務懈怠責任を定める規定は、会社法何条何項か。", "a": "会社法423条1項。", "reason": "423条1項責任の成立要件は、①役員等が②任務を懈怠して③会社に損害を生じたこと④任務懈怠と損害との間に相当因果関係があること（⑤役員等の故意・過失）と整理される。", "basis": "PDF p.6（本編 p.3）。台帳要素 t002-e11（＜②＞の別論証（要件列挙型の規範）：423条1項責任の成立要件） の逐語引用に基づく。", "caution": "第1章の非論点型の答案例で用いられる条文である。", "articles": ["423条1項"], "page": 6, "loc": "項目2 「～について論じなさい。」問題"}, {"id": "book-kigyoho-01-ch01-q5005", "ch": 1, "type": "何条", "q": "論証例では、取締役Aが会社の承認を受けずに取引を行ったことについて、「当該取引が利益相反取引にあたり、株主総会の承認が必要であろうか」と問いが立てられた。この利益相反取引（取締役が自己又は第三者のために株式会社と取引をすること）の根拠規定は、会社法何条何項何号か。", "a": "会社法356条1項2号。", "reason": "「自己又は第三者のために」株式会社と取引をすることは、356条1項2号の利益相反取引（直接取引）にあたる。", "basis": "PDF p.8（本編 p.5）。台帳要素 t002-e17（論点型・第1段落（問題提起）の形：利益相反取引（356条1項2号）にあたるかという問い立て） の逐語引用に基づく。", "caution": "第1章の論点型の論証例で用いられる条文である。", "articles": ["356条1項2号"], "page": 8, "loc": "項目2 「～について論じなさい。」問題"}, {"id": "book-kigyoho-01-ch01-q5006", "ch": 1, "type": "何条", "q": "「条文・趣旨・あてはめ」型の適用例（平成25年の問題）で、取締役の報酬等の決定手続の根拠として挙げられた規定は、会社法何条か。", "a": "会社法361条（株主総会の普通決議による）。", "reason": "取締役の報酬等は、定款にその額を定めていないときは、株主総会の決議によって定める（361条）というのが、適用例の②「条文」に対応する。", "basis": "PDF p.11（本編 p.8）。台帳要素 t003-e11（平成25年の問題への型の適用例：②361条（株主総会の普通決議）） の逐語引用に基づく。", "caution": "第1章の説明問題の型の適用例に基づく。", "articles": ["361条"], "page": 11, "loc": "項目3 「～について説明しなさい。」説明問題"}, {"id": "book-kigyoho-01-ch01-q5007", "ch": 1, "type": "規定→趣旨", "q": "会社法361条は、取締役の報酬等について、定款にその額を定めていないときは、株主総会の決議によって定めるとしている。このように、取締役の報酬等の決定を株主総会の決議に委ねている趣旨は何か。", "a": "取締役が自らの報酬等を自ら決定することによる、いわゆるお手盛りを防止するためである。レジュメはこの趣旨を「趣旨（お手盛り防止）」と明示している。", "reason": "報酬等の決定を取締役自身に委ねれば自己優遇のおそれがあるため、株主の機関である株主総会の決議に委ねるというのが、361条の趣旨からの理由づけである。「条文・趣旨・あてはめ」型でも、③趣旨としてこのお手盛り防止を書くことが求められる。", "basis": "PDF p.11（本編 p.8）。台帳要素 t003-e11（平成25年の問題への型の適用例：③趣旨（お手盛り防止）） の逐語引用に基づく。", "caution": "第1章の説明問題の型の適用例に基づく。", "articles": ["361条"], "page": 11, "loc": "項目3 「～について説明しなさい。」説明問題"}, {"id": "book-kigyoho-01-ch01-q5008", "ch": 1, "type": "何条", "q": "思考フローの［解答例］では、「本件決議の取消の訴え」が認められるためには、株主等による総会決議の日から3ヶ月以内の訴えであること、取消原因があることが必要とされた。この株主総会決議取消の訴えの根拠規定は、会社法何条何項か。", "a": "会社法831条1項。", "reason": "決議取消の訴えは831条1項が定めるものであり、［解答例］の規範部分も同項に基づいて要件を整理している。", "basis": "PDF p.14（本編 p.11）。台帳要素 t004-e08（[解答例]の規範部分：本件決議の取消の訴え（831条1項）の要件） の逐語引用に基づく。", "caution": "第1章の思考フローの［解答例］に基づく。", "articles": ["831条1項"], "page": 14, "loc": "項目4 答案を書く際に考えること"}, {"id": "book-kigyoho-01-ch01-q5009", "ch": 1, "type": "何条", "q": "思考フローの［解答例］のあてはめでは、各株主に株主総会招集通知を発すべきところ、株主Bへの招集通知を欠いたことが法令違反とされた。この招集通知の根拠規定は、会社法何条何項か。", "a": "会社法299条1項。", "reason": "株主総会の招集通知は299条1項が定めるものであり、同項違反は招集手続の法令違反として決議取消原因となる。", "basis": "PDF p.14（本編 p.11）。台帳要素 t004-e09（[解答例]のあてはめ・結論部分：招集通知（299条1項）違反という法令違反） の逐語引用に基づく。", "caution": "第1章の思考フローの［解答例］に基づく。", "articles": ["299条1項"], "page": 14, "loc": "項目4 答案を書く際に考えること"}, {"id": "book-kigyoho-01-ch02-q5000", "ch": 2, "type": "規定→趣旨", "q": "会社法831条1項は、株主総会決議取消しの訴えについて、株主総会等の決議の日から3箇月以内に訴えをもって請求しなければならないという提訴期間を定めている。このように提訴期間を制限した趣旨は何か。", "a": "総会決議の効力を早期に確定させ、会社を巡る法律関係を安定させることにある。", "reason": "この趣旨から、提訴期間は、訴えの提起のみならず取消原因の主張もすべき期間であると解され、提訴期間経過後は新たな取消原因の追加主張は認められない（最判昭和51・12・24の立場）。", "basis": "PDF p.17（本編 p.14）。台帳要素 t104-e01（831条1項が提訴期間を制限した趣旨は、総会決議の効力を早期に確定させ会社を巡る法律関係を安定させることにある）。PDF p.17（本編 p.14） ／ PDF p.17（本編 p.14）。台帳要素 t104-e02（結論：提訴期間は訴えの提起のみならず取消原因の主張もすべき期間であり、期間経過後は新たな取消原因の追加主張は認められない）。PDF p.17（本編 p.14） の逐語引用に基づく。", "caution": "", "articles": ["831条1項"], "page": 17, "loc": "（1）株主総会決議の瑕疵を争う訴え／（論点）提訴期間内に訴えを提起し、提訴期間経過後、裁判の中で新たに取消原因を追加できるか"}, {"id": "book-kigyoho-01-ch02-q5001", "ch": 2, "type": "規定→趣旨", "q": "株主総会は、取締役会の招集決定（298条4項）により代表取締役が招集するものであり（296条3項）、招集権者でない者が招集した総会の決議は不存在であるのが原則である。もっとも、招集権者による招集手続を欠いても、株主全員が開催に同意し出席した場合には、総会決議は有効になると解される。この結論を支える、株主総会の招集手続が設けられた趣旨は何か。", "a": "招集手続の趣旨は、株主に総会への出席の機会と準備の余裕を与えることにある。そのため、株主全員が開催に同意し出席した場合は、株主が自らその利益を放棄したといえる。", "reason": "招集手続は株主の出席機会と準備の余裕を保障するためのものであるから、その利益を享受する株主全員が同意・出席した場合には、瑕疵を理由に決議を不存在とする必要はない。", "basis": "PDF p.24（本編 p.21）。台帳要素 t109-e05（修正規範：招集手続の趣旨は株主に総会への出席の機会と準備の余裕を与えることにあるため、招集権者による招集手続を欠いても株主全員が開催に同意し出席した場合は株主が自ら利益を放棄したといえ、総会決議は有効となる）。PDF p.24（本編 p.21）[解答例] ／ PDF p.24（本編 p.21）。台帳要素 t109-e04（原則：株主総会は取締役会の招集決定（298条4項）により代表取締役が招集するものであり（296条3項）、取締役を辞任したAが招集した本件総会決議は不存在であるのが原則（830条1項参照））。PDF p.24（本編 p.21）[解答例] の逐語引用に基づく。", "caution": "株主が議題を了知したうえで代理人を出席させ、決議がその議題の範囲内で行われる場合も、瑕疵は治癒され決議は有効に成立する。", "articles": ["298条4項", "296条3項"], "page": 24, "loc": "（1）株主総会決議の瑕疵を争う訴え／全員出席総会（招集手続を欠く総会の効力）"}, {"id": "book-kigyoho-01-ch02-q5002", "ch": 2, "type": "規定→趣旨", "q": "会社法831条2項は、株主総会等の招集の手続又は決議の方法が法令又は定款に違反するときであっても、裁判所は、その違反する事実が重大でなく、かつ、決議に影響を及ぼさないものであると認めるときは、取消しの請求を棄却することができると定める（裁量棄却）。このような裁量棄却が認められる趣旨は何か。", "a": "招集手続・決議方法の法令定款違反は軽微な瑕疵であり、また再度やり直しても同じ結果となると考えられるからである。", "reason": "取消原因となる手続・方法の違反があっても、その違反が軽微で決議の結果に影響しないのであれば、決議を取り消してやり直させる実益がないため、裁判所の裁量による棄却が認められる。", "basis": "PDF p.25（本編 p.22）。台帳要素 t111-e04（裁量棄却の趣旨：招集手続・決議方法の法令定款違反は軽微な瑕疵であり、再度やり直しても同じ結果となると考えられるから）。PDF p.25（本編 p.22）[書き方]説明問題の場合 ／ PDF p.25（本編 p.22）。台帳要素 t111-e01（831条2項：招集手続又は決議方法が法令・定款に違反するときでも、違反する事実が重大でなく、かつ、決議に影響を及ぼさないものと認めるときは、裁判所は取消しの請求を棄却できる）。会社法831条2項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["831条2項"], "page": 25, "loc": "（1）株主総会決議の瑕疵を争う訴え／裁量棄却（831条2項）"}, {"id": "book-kigyoho-01-ch02-q5003", "ch": 2, "type": "規定→趣旨", "q": "会社法299条1項は、株主総会を招集するには、取締役は、株主総会の日の二週間（公開会社でない株式会社にあっては、一週間）前までに、株主に対してその通知を発しなければならないと定める。この招集通知の期間が設けられた趣旨は何か。", "a": "株主の出席の機会と準備の余裕を与えるためである。", "reason": "招集通知の期間は、株主が総会に出席し議案を検討するための機会と余裕を保障するものであり、裁量棄却の判断（「違反する事実が重大」かどうか）においてもこの趣旨が用いられる。", "basis": "PDF p.29（本編 p.26）。台帳要素 t113-e02（招集通知期間の趣旨は、株主の出席の機会と準備の余裕を与えるため）。PDF p.29（本編 p.26）。t111-e06（最判昭和46・3・18）でも同じ趣旨が用いられている ／ PDF p.29（本編 p.26）。台帳要素 t113-e01（299条1項（原則）：株主総会を招集するには、取締役は株主総会の日の二週間（公開会社でない会社では一週間、取締役会非設置会社で定款で下回る期間を定めた場合はその期間）前までに株主に対して通知を発しなければならない）。会社法299条1項（レジュメ引用） の逐語引用に基づく。", "caution": "取締役会非設置会社で定款で下回る期間を定めた場合は、その期間で足りる。", "articles": ["299条1項"], "page": 29, "loc": "（3）株主総会の招集通知（299条）／株主総会の招集通知（299条）と招集手続の省略・全員出席総会"}, {"id": "book-kigyoho-01-ch02-q5004", "ch": 2, "type": "規定→趣旨", "q": "会社法は、株主提案権として、議題提案権（303条）、議案提案権（304条）、議案の要領の通知請求権（305条）を定めている。これらの株主提案権が認められる趣旨は何か。", "a": "株主の意見を株主総会に反映させやすくすることを通じて、会社・株主、株主相互の意思疎通を図り、株主総会の活性化を図るためである。", "reason": "株主提案権は、取締役（会）が議題を支配する構造のもとで、株主の意見を総会に取り込むための制度であり、意思疎通を通じた総会の活性化が目的である。", "basis": "PDF p.30（本編 p.27）。台帳要素 t114-e01（株主提案権の趣旨：株主の意見を株主総会に反映させやすくすることを通じて、会社・株主、株主相互の意思疎通を図り、株主総会の活性化を図るため）。PDF p.30（本編 p.27） ／ PDF p.30（本編 p.27）。台帳要素 t114-e02（3つの権利：a）議題提案権（303条）、b）議案提案権（304条）、c）議案の要領の通知請求権（305条））。会社法303条・304条・305条。PDF p.30（本編 p.27） の逐語引用に基づく。", "caution": "", "articles": ["303条", "304条", "305条"], "page": 30, "loc": "（4）株主提案権（303条〜305条）／株主提案権（303条〜305条）"}, {"id": "book-kigyoho-01-ch02-q5005", "ch": 2, "type": "規定→趣旨", "q": "会社法308条1項は、株主は株主総会において、その有する株式一株につき一個の議決権を有すると定める（一株一議決権の原則）。株主一人につき一個とするのではなく、このような原則が採られる趣旨（理由）は何か。", "a": "資本団体たる株式会社では、資本的貢献度に応じた扱いをする方がかえって平等であるからである。", "reason": "株式会社は資本団体であり、出資の多寡に応じた議決権の配分こそが株主間の平等に適うため、株式数に比例する一株一議決権の原則が採られる。", "basis": "PDF p.32（本編 p.29）。台帳要素 t115-e02（一株一議決権の理由：資本団体たる株式会社では、資本的貢献度に応じた扱いをする方がかえって平等であるから）。PDF p.32（本編 p.29） ／ PDF p.32（本編 p.29）。台帳要素 t115-e01（一株一議決権の原則：株主は株主総会において、その有する株式一株につき一個の議決権を有する（308条1項））。会社法308条1項。PDF p.32（本編 p.29） の逐語引用に基づく。", "caution": "", "articles": ["308条1項"], "page": 32, "loc": "（5）決議／議決権と一株一議決権の原則（308条）"}, {"id": "book-kigyoho-01-ch02-q5006", "ch": 2, "type": "規定→趣旨", "q": "会社法310条は、株主が代理人によってその議決権を行使できることを定めている。この規定の趣旨は何か。", "a": "株主に議決権行使の機会を保障することである。", "reason": "この趣旨から、代理人資格を制限すべき合理的理由がある場合に、定款によって相当程度の制限を加えることまで310条は禁止していないと解される（総会のかく乱防止を趣旨とする定款規定は有効）。", "basis": "PDF p.34（本編 p.31）。台帳要素 t117-e02（310条の趣旨は、株主に議決権行使の機会を保障すること）。会社法310条。PDF p.34（本編 p.31） ／ PDF p.34（本編 p.31）。台帳要素 t117-e03（定款規定の有効性：代理人資格を制限すべき合理的理由がある場合に、定款によって相当程度の制限を加えることまで310条は禁止していない。総会のかく乱防止を趣旨とする本問の定款規定は合理的理由があり相当程度の制限といえるので有効）。PDF p.34（本編 p.31） の逐語引用に基づく。", "caution": "", "articles": ["310条"], "page": 34, "loc": "（5）決議／（論点）代理人を株主に限定する定款規定の効力（定款による代理人資格の制限）"}, {"id": "book-kigyoho-01-ch02-q5007", "ch": 2, "type": "規定→趣旨", "q": "株主総会に出席しなくても議決権を行使できる書面投票・電子投票の制度（298条1項3号4号、311条、312条）が設けられた趣旨は何か。", "a": "株主に議決権行使の機会を保障し、できるだけ多くの株主の意思を株主総会決議に反映させるためである。", "reason": "書面投票・電子投票は、出席が困難な株主にも議決権行使の機会を保障し、株主の意思を広く決議に反映させるための制度である。", "basis": "PDF p.37（本編 p.34）。台帳要素 t118-e01（書面投票・電子投票の趣旨：株主に議決権行使の機会を保障し、できるだけ多くの株主の意思を株主総会決議に反映させるため）。PDF p.37（本編 p.34）b）書面投票・電子投票。本レジュメでは趣旨のみの記載 の逐語引用に基づく。", "caution": "本レジュメでは、書面投票・電子投票については趣旨のみが記載されている。", "articles": ["298条1項", "311条", "312条"], "page": 37, "loc": "（5）決議／書面投票・電子投票（298条1項3号4号、311条、312条）"}, {"id": "book-kigyoho-01-ch02-q5008", "ch": 2, "type": "規定→趣旨", "q": "会社法313条3項は、「他人のために株式を有する者」が議決権の不統一行使をすることを、会社は拒むことができないと定める。この定めの趣旨は何か。", "a": "複数の実質上の株主の意向を株主総会に反映するためである。", "reason": "信託やファンドのように名義上の株主の背後に複数の実質上の株主がいる場合、その意向を分けて反映させる必要があるため、不統一行使を拒めないとされる。", "basis": "PDF p.37（本編 p.34）。台帳要素 t119-e03（313条3項の趣旨：複数の実質上の株主の意向を株主総会に反映するため）。PDF p.37（本編 p.34） ／ PDF p.37（本編 p.34）。台帳要素 t119-e01（会社が株主の議決権不統一行使を拒むことができないのは「他人のために株式を有する者」（313条3項））。会社法313条3項。PDF p.37（本編 p.34） の逐語引用に基づく。", "caution": "", "articles": ["313条3項"], "page": 37, "loc": "（5）決議／議決権の不統一行使（313条）"}, {"id": "book-kigyoho-01-ch02-q5009", "ch": 2, "type": "規定→趣旨", "q": "会社法120条1項は、株式会社は、株主の権利の行使に関し、財産上の利益の供与をしてはならないと定める。この利益供与の禁止の趣旨を2つ挙げよ。", "a": "①会社財産の浪費を防止すること、②（総会屋を根絶して）株主総会の議事運営の適正化を図り、企業経営の健全を確保することである。", "reason": "利益供与は、会社の財産を株主の権利行使と引き換えに流出させるものであり、会社財産の保全と総会運営の公正・経営の健全確保の観点から禁止される。", "basis": "PDF p.39（本編 p.36）。台帳要素 t122-e01（利益供与の禁止の趣旨：①会社財産の浪費防止、②（総会屋を根絶して）株主総会の議事運営の適正化、企業経営の健全確保のため）。PDF p.39（本編 p.36） ／ PDF p.38（本編 p.35）。台帳要素 t121-e01（120条1項：株式会社は、①何人に対しても、②株主の権利等の行使に関し、③財産上の利益の供与（当該株式会社又はその子会社の計算においてするものに限る）をしてはならない）。会社法120条1項（レジュメ引用）。要件は①②③、効果は③の禁止 の逐語引用に基づく。", "caution": "", "articles": ["120条1項"], "page": 39, "loc": "（5）決議／利益供与の禁止の趣旨と120条2項の推定"}, {"id": "book-kigyoho-01-ch02-q5010", "ch": 2, "type": "規定→趣旨", "q": "会社法339条1項により、役員及び会計監査人は、いつでも、株主総会の決議によって解任することができる。同条2項は、その解任について正当な理由がある場合を除き、解任された者は会社に対して解任によって生じた損害の賠償を請求することができると定める。この2項の趣旨は何か。", "a": "株主は役員等を自由に解任できるので（同条1項）、せめて役員等の経済的利益は広く救済しようとするものである。", "reason": "解任の自由そのものは株主総会の権限として認めつつ、解任によって不利益を受ける役員等の経済的利益を損害賠償によって救済するのが339条2項の趣旨である。", "basis": "PDF p.49（本編 p.46）。台帳要素 t204-e01（339条2項の趣旨は、株主は役員等を自由に解任できるので（同条1項）、せめて役員等の経済的利益は広く救済しようとするもの）。PDF p.49（本編 p.46） ／ PDF p.49（本編 p.46）。台帳要素 t203-e02（339条1項：役員及び会計監査人は、いつでも、株主総会の決議によって解任することができる）。会社法339条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["339条1項"], "page": 49, "loc": "3 取締役会設置会社／（論点）解任について「正当な理由」がないとは"}, {"id": "book-kigyoho-01-ch02-q5011", "ch": 2, "type": "規定→趣旨", "q": "会社法339条2項は、解任について「正当な理由」がある場合を除き、解任によって生じた「損害」の賠償を請求することができると定める。同条2項の趣旨から、「正当な理由」と「損害」はどのように解釈されるか。", "a": "同条2項の趣旨は、解任される役員等の経済的救済を図ることにあるため、「正当な理由がないこと」は広く考える（すなわち「正当な理由」は狭く解する）。また「損害」とは、解任されなければ得られたであろう残りの在任期間中の利益（残存在任期間分の報酬や退職金など）の喪失を意味する。", "reason": "株主は正当な理由がなくても解任自体はできる（339条1項）ため、2項は経済的救済に徹する制度であり、その要件である「正当な理由」は狭く、「損害」は残任期間中の利益の喪失と解される。", "basis": "PDF p.50（本編 p.47）。台帳要素 t205-e03（339条2項の趣旨から、「正当な理由がないこと」は広く考える（「正当な理由」は狭く解する）。「損害」は残存在任期間分の報酬や退職金などの喪失と解する）。PDF p.50（本編 p.47） ／ PDF p.49（本編 p.46）。台帳要素 t203-e03（339条2項：解任された者は、正当な理由がある場合を除き、会社に対し、解任によって生じた損害の賠償を請求できる）。会社法339条2項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["339条2項"], "page": 50, "loc": "3 取締役会設置会社／（論点）339条2項の「損害」とは"}, {"id": "book-kigyoho-01-ch02-q5012", "ch": 2, "type": "規定→趣旨", "q": "会社法362条4項は、重要な財産の処分及び譲受け（1号）その他の重要な業務執行の決定を、取締役に委任することができないとする。このうち1号について、取締役会の決議が要求される趣旨は何か。", "a": "これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである。", "reason": "会社に重大な影響を及ぼす決定については、単独の取締役の判断に委ねず、合議体である取締役会で慎重に判断させることが求められる。この趣旨が「重要な財産の処分」の判断基準の前提となる。", "basis": "PDF p.53（本編 p.50）。台帳要素 t207-e01（362条4項1号が取締役会決議を要求した趣旨は、これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである）。PDF p.53（本編 p.50） ／ PDF p.51（本編 p.48）。台帳要素 t206-e02（362条4項本文：取締役会は、次に掲げる事項その他の重要な業務執行の決定を取締役に委任することができない）。会社法362条4項本文（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["362条4項"], "page": 53, "loc": "3 取締役会設置会社／（論点）362条4項1号の「重要」の意義（判断基準）"}, {"id": "book-kigyoho-01-ch02-q5013", "ch": 2, "type": "規定→趣旨", "q": "会社法362条4項2号は、「多額の借財」を、取締役に委任することができない重要な業務執行の決定として掲げる。この2号について、取締役会の決議が要求される趣旨は何か。", "a": "これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである。", "reason": "多額の借財も会社の財産状態に重大な影響を及ぼす決定であるため、362条4項1号と同様の趣旨により、合議体である取締役会で慎重に判断させることが求められる。", "basis": "PDF p.54（本編 p.51）。台帳要素 t209-e01（362条4項2号が取締役会決議を要求した趣旨は、これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである）。PDF p.54（本編 p.51） ／ PDF p.51（本編 p.48）。台帳要素 t206-e04（362条4項2号：多額の借財）。会社法362条4項2号 の逐語引用に基づく。", "caution": "362条4項1号の「重要」と2号の「多額」とで、取締役会決議が要求される趣旨は共通する。", "articles": ["362条4項"], "page": 54, "loc": "3 取締役会設置会社／（論点）362条4項2号の「多額」の意義"}, {"id": "book-kigyoho-01-ch02-q5014", "ch": 2, "type": "規定→趣旨", "q": "監査役には取締役会への出席義務・意見陳述義務があるから（383条1項）、取締役会の招集通知は監査役にも発する必要がある（368条1項）。このように、監査役に取締役会への出席義務を課した趣旨は何か。", "a": "監査役に業務執行の状況を正確に把握させ、業務監査権（381条1項）を適切に行使させることにある。", "reason": "監査役が取締役会に出席して業務執行の状況を直接把握することが、業務監査権の適切な行使の前提となる。この趣旨から、監査役に対する招集通知を欠く場合は取締役会決議は常に無効になると解される。", "basis": "PDF p.57（本編 p.54）。台帳要素 t213-e02（監査役に取締役会出席義務を課した趣旨は、監査役に業務執行の状況を正確に把握させ、業務監査権（381条1項）を適切に行使させることにある）。PDF p.57（本編 p.54） ／ PDF p.57（本編 p.54）。台帳要素 t213-e01（監査役には取締役会への出席義務・意見陳述義務があるから（383条1項）、取締役会の招集通知は監査役にも発する必要がある（368条1項））。PDF p.57（本編 p.54） の逐語引用に基づく。", "caution": "", "articles": ["383条1項", "368条1項", "381条1項"], "page": 57, "loc": "3 取締役会設置会社／[B-2]（論点）監査役への取締役会招集通知の欠缺がある場合の取締役会決議の効力"}, {"id": "book-kigyoho-01-ch02-q5015", "ch": 2, "type": "規定→趣旨", "q": "会社法369条2項は、前項の決議について特別の利害関係を有する取締役は、議決に加わることができないと定める。この定めの趣旨は何か。", "a": "特別利害関係を有する取締役は、公正な議決権行使が期待できないためである。", "reason": "決議の結果に個人的な利害を有する取締役については、会社の利益に沿った公正な判断が期待できないため、あらかじめ議決から排除される。", "basis": "PDF p.58（本編 p.55）。台帳要素 t214-e02（特別利害関係を有する取締役は、公正な議決権行使が期待できないため、議決に加わることができないとされる）。PDF p.58（本編 p.55） ／ PDF p.58（本編 p.55）。台帳要素 t214-e01（369条2項：前項の決議について特別の利害関係を有する取締役は、議決に加わることができない）。会社法369条2項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["369条2項"], "page": 58, "loc": "3 取締役会設置会社／特別利害関係取締役（369条2項）の意義・効果と具体例"}, {"id": "book-kigyoho-01-ch02-q5016", "ch": 2, "type": "規定→趣旨", "q": "会社法369条2項は、特別の利害関係を有する取締役について、議決に加わること自体を禁じている。このように、最初から議決への参加自体を禁じる趣旨を、忠実義務（355条）との関係で説明せよ。", "a": "決議に特別利害関係を有する取締役が一切の私心を捨て去って会社に対する忠実義務（355条）を果たすことは期待できないので、最初から議決に参加すらできないようにして、決議の公正を確保することにある。", "reason": "利害の衝突がある場面では忠実義務の履行自体が期待できないため、行使された議決を事後的に取り消すのではなく、参加の段階で排除することにより決議の公正を確保する趣旨である。", "basis": "PDF p.59（本編 p.56）。台帳要素 t215-e01（特別利害関係取締役の議決権行使を制限した趣旨は、決議に特別利害関係を有する取締役が一切の私心を捨て去って会社に対する忠実義務（355条）を果たすことは期待できないので、最初から議決に参加すらできないようにして、決議の公正を確保することにある）。PDF p.59（本編 p.56） ／ PDF p.58（本編 p.55）。台帳要素 t214-e01（369条2項：前項の決議について特別の利害関係を有する取締役は、議決に加わることができない）。会社法369条2項（レジュメ引用） の逐語引用に基づく。", "caution": "株主総会の場合と異なり、取締役会では議決権行使の結果（著しく不当な決議）を待たずに排除される点に、取締役が会社の受任者であることが表れている。", "articles": ["369条2項", "355条"], "page": 59, "loc": "3 取締役会設置会社／（論点1）解職決議の対象である代表取締役は特別利害関係取締役か"}, {"id": "book-kigyoho-01-ch02-q5017", "ch": 2, "type": "規定→趣旨", "q": "会社法373条1項は、取締役の数が六人以上であり、かつ、取締役のうち一人以上が社外取締役であること等の要件を満たす取締役会設置会社（委員会設置会社を除く）について、特別取締役による取締役会決議の方法を定めることを認める。この特別取締役制度の趣旨は何か。", "a": "監督機能の強化とひきかえに、迅速な意思決定を可能にするためである。", "reason": "社外取締役の存在等により監督機能の強化が図られる会社については、その代わりに、少人数の特別取締役による迅速な意思決定を認める趣旨である。", "basis": "PDF p.65（本編 p.62）。台帳要素 t220-e05（特別取締役制度の趣旨は、監督機能の強化とひきかえに、迅速な意思決定を可能にするためである）。PDF p.65（本編 p.62） ／ PDF p.65（本編 p.62）。台帳要素 t220-e03（373条1項：取締役会設置会社（委員会設置会社を除く。）が要件のいずれにも該当する場合には、取締役会は、362条4項1号及び2号に掲げる事項についての取締役会の決議については、あらかじめ選定した三人以上の取締役（特別取締役）のうち、議決に加わることができるものの過半数が出席し、その過半数をもって行うことができる旨を定めることができる）。会社法373条1項（レジュメ引用） の逐語引用に基づく。", "caution": "特別取締役による決議の対象は、362条4項1号及び2号に掲げる事項に限られる。", "articles": ["373条1項"], "page": 65, "loc": "3 取締役会設置会社／取締役会決議に関するその他の制度（369条5項・370条・373条）"}, {"id": "book-kigyoho-01-ch02-q5018", "ch": 2, "type": "規定→趣旨", "q": "会社法362条4項は、重要な財産の処分及び譲受け、多額の借財その他の重要な業務執行の決定を、取締役会の決議事項とし、取締役に委任できないとする。この定めの趣旨は何か。", "a": "代表取締役への権限の集中を抑制し、取締役相互の協議による結論に沿った業務の執行を確保することによって、会社の利益を保護しようとする趣旨である。", "reason": "重要な業務執行の決定を合議体である取締役会に留保する趣旨は、代表取締役への権限集中を抑え、取締役相互の協議に基づく執行を確保して会社の利益を保護することにある。この趣旨から、取締役会決議を経ない取引の無効は、原則として会社のみが主張できると解される（最判平成21・4・17の立場）。", "basis": "PDF p.71（本編 p.68）。台帳要素 t226-e01（362条4項が重要な業務執行についての決定を取締役会の決議事項と定めたのは、代表取締役への権限の集中を抑制し、取締役相互の協議による結論に沿った業務の執行を確保することによって会社の利益を保護しようとする趣旨に出たものと解される）。PDF p.71（本編 p.68） の逐語引用に基づく。", "caution": "", "articles": ["362条4項"], "page": 71, "loc": "4 代表取締役／（論点）-b 無効の主張権者（会社以外のものも無効主張できるか）"}, {"id": "book-kigyoho-01-ch02-q5019", "ch": 2, "type": "規定→趣旨", "q": "監査役の任期は長期とされ、短縮することができないものとされ（336条）、また、監査役の選任に関する議案については監査役の同意等が必要とされる（343条）。これらの定めに共通する趣旨は何か。", "a": "監査役の独立性を確保するためである。", "reason": "任期の面（336条）と選任手続の面（343条）のいずれからも、監査の対象である取締役等からの監査役の独立性を確保する趣旨が貫かれている。", "basis": "PDF p.81（本編 p.78）。台帳要素 t235-e02（336条（監査役の任期）：監査役の任期を長期とし短縮ができないとしたのは、任期の面から監査役の独立性を確保するため）。PDF p.81（本編 p.78） ／ PDF p.81（本編 p.78）。台帳要素 t235-e03（343条（監査役の選任に関する監査役の同意等）の趣旨は、監査役の独立性を確保するためである）。PDF p.81（本編 p.78） の逐語引用に基づく。", "caution": "", "articles": ["336条", "343条"], "page": 81, "loc": "5 監査役（会）／監査役の選任・解任に関する制度（329条〜）"}, {"id": "book-kigyoho-01-ch02-q5020", "ch": 2, "type": "規定→趣旨", "q": "親会社の監査役は、その職務を行うため必要があるときは、子会社に対して事業の報告を求め、又はその業務及び財産の状況を調査することができる（381条3項4項、子会社調査権）。この権限が認められる趣旨は何か。", "a": "親子会社は法的には別法人であるが経済的一体性ゆえに、親会社は子会社を通じて違法行為を行う可能性がある。そこで、親会社の監査を十分にするため、子会社調査権が認められた。", "reason": "子会社を通じた違法行為の可能性がある以上、親会社の監査役の調査が親会社内部にとどまるのでは監査が十分でないため、子会社への調査権が認められる。", "basis": "PDF p.82（本編 p.79）。台帳要素 t239-e01（子会社調査権（381条3項4項）の趣旨：親子会社は法的には別法人であるが経済的一体性ゆえに、親会社は子会社を通じて違法行為を行う可能性がある。そこで、親会社の監査を十分にするため、子会社調査権が認められた）。PDF p.82（本編 p.79） の逐語引用に基づく。", "caution": "", "articles": ["381条3項"], "page": 82, "loc": "5 監査役（会）／監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"}, {"id": "book-kigyoho-01-ch02-q5021", "ch": 2, "type": "規定→趣旨", "q": "会社法389条1項は、公開会社でない株式会社（監査役会設置会社及び会計監査人設置会社を除く）は、381条1項の規定にかかわらず、その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができるとする。このような監査範囲の限定が認められる趣旨は何か。", "a": "非公開会社では、株主自身による業務監査もある程度可能であるし、業務監査まで行う監査役を得ることが困難な場合もあるためである。", "reason": "非公開会社では株主自身による監督が期待でき、また業務監査まで担える人材の確保が困難な場合もあることから、定款による監査範囲の限定が認められる。このような監査役は会計監査限定監査役（会計限定監査役）と呼ばれる。", "basis": "PDF p.83（本編 p.80）。台帳要素 t240-e03（非公開会社では、株主自身による業務監査もある程度可能であるし、業務監査まで行う監査役を得ることが困難な場合もあるため、監査範囲の限定が認められる）。PDF p.83（本編 p.80） ／ PDF p.83（本編 p.80）。台帳要素 t240-e01（389条1項：公開会社でない株式会社（監査役会設置会社及び会計監査人設置会社を除く。）は、381条1項の規定にかかわらず、その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができる）。会社法389条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["389条1項", "381条1項"], "page": 83, "loc": "5 監査役（会）／定款の定めによる監査範囲の限定（389条）"}, {"id": "book-kigyoho-01-ch02-q5022", "ch": 2, "type": "規定→趣旨", "q": "会計参与等の選任等については、会計参与等が株主総会において意見を述べることができる（345条）。この定めの趣旨は何か。", "a": "会計参与の独立性確保のためである。", "reason": "選任等に際して会計参与自身に意見陳述の機会を保障することは、計算関係の職務を担う会計参与が取締役等から独立した立場を保つための仕組みである。", "basis": "PDF p.84（本編 p.81）。台帳要素 t304-e02（趣旨は、会計参与の独立性確保のため）。PDF p.84（本編 p.81） ／ PDF p.84（本編 p.81）。台帳要素 t304-e01（345条（会計参与等の選任等についての意見の陳述））。会社法345条（見出し） の逐語引用に基づく。", "caution": "", "articles": ["345条"], "page": 84, "loc": "6 会計参与／会計参与等の選任等についての意見の陳述（345条）"}, {"id": "book-kigyoho-01-ch02-q5023", "ch": 2, "type": "規定→趣旨", "q": "会計監査人の選任に関する株主総会の議案の内容は、取締役ではなく、監査役が決定する（344条）。このように監査役が議案内容を決定することとした趣旨は何か。", "a": "会計監査人の独立性確保のためである。", "reason": "監査の対象である取締役が会計監査人の選任議案の内容を決めるのでは会計監査人の独立性が損なわれるため、監査役が議案内容を決定するものとされる。「取締役会による議案内容の決定＋監査役の同意」ではない点に注意する。", "basis": "PDF p.85（本編 p.82）。台帳要素 t309-e02（趣旨は、会計監査人の独立性確保のため）。PDF p.85（本編 p.82） ／ PDF p.85（本編 p.82）。台帳要素 t309-e01（監査役による選任の議案内容の決定（344条））。会社法344条。PDF p.85（本編 p.82） の逐語引用に基づく。", "caution": "", "articles": ["344条"], "page": 85, "loc": "7 会計監査人／監査役による会計監査人の選任議案内容の決定（344条）"}, {"id": "book-kigyoho-01-ch02-q5024", "ch": 2, "type": "規定→趣旨", "q": "会計監査人の選任等については、当該会計監査人が株主総会において意見を述べることができる（345条1項5項）。この定めの趣旨は何か。", "a": "会計監査人の独立性確保のためである。", "reason": "選任等に際して会計監査人自身に意見陳述の機会を保障することは、監査の対象である取締役等からの会計監査人の独立性を確保するための仕組みである。", "basis": "PDF p.85（本編 p.82）。台帳要素 t310-e02（趣旨は、会計監査人の独立性確保のため）。PDF p.85（本編 p.82） ／ PDF p.85（本編 p.82）。台帳要素 t310-e01（会計監査人の選任についての当該会計監査人の意見の陳述（345条1項5項））。会社法345条1項・5項。PDF p.85（本編 p.82） の逐語引用に基づく。", "caution": "", "articles": ["345条1項"], "page": 85, "loc": "7 会計監査人／会計監査人の選任等についての意見の陳述（345条1項5項）"}, {"id": "book-kigyoho-01-ch02-q5025", "ch": 2, "type": "規定→趣旨", "q": "会社法399条1項は、取締役は、会計監査人の報酬等を定める場合には、監査役（監査役が二人以上ある場合にあっては、その過半数）の同意を得なければならないと定める。この同意が要求される趣旨は何か。", "a": "会計監査人の独立性確保の要請からである。", "reason": "会計監査人は役員ではないため（329条1項参照）、その報酬等は本来どおり取締役・取締役会の決定によるが、監査の対象から報酬を決められるのでは独立性が損なわれるため、監査役の同意が要求される。取締役・監査役・会計参与の報酬等が定款または株主総会の普通決議で定められるのとは仕組みが異なる。", "basis": "PDF p.86（本編 p.83）。台帳要素 t312-e03（会計監査人の場合は本来通り取締役・取締役会の決定で報酬等を決定する（役員ではないから）。ただ、独立性確保の要請から監査役の同意を要求している）。PDF p.86（本編 p.83） ／ PDF p.86（本編 p.83）。台帳要素 t312-e01（399条1項：取締役は、会計監査人又は一時会計監査人の職務を行うべき者の報酬等を定める場合には、監査役（監査役が二人以上ある場合にあっては、その過半数）の同意を得なければならない）。会社法399条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["399条1項"], "page": 86, "loc": "7 会計監査人／会計監査人の報酬等の決定（399条）"}, {"id": "book-kigyoho-01-ch02-q5026", "ch": 2, "type": "規定→趣旨", "q": "指名委員会等設置会社では、取締役会から執行役への業務執行の決定権限の大幅な委任が認められる（416条4項）一方で、取締役会の内部機関として3委員会の設置が義務づけられ（2条12号）、各委員会の委員の過半数は社外取締役とされる（400条3項）。この制度設計の趣旨を、委任と委員会のそれぞれについて述べよ。", "a": "大幅な委任を認めるのは、迅速な意思決定を可能にするためである。一方、3委員会の設置を義務づけ各委員会の委員の過半数を社外取締役とするのは、監督機能を大幅に強化するためである。", "reason": "指名委員会等設置会社は、執行と監督を分離し、執行側には迅速な意思決定を、監督側には社外取締役中心の委員会による強い監督を、それぞれ確保する制度設計である。", "basis": "PDF p.87（本編 p.84）。台帳要素 t313-e02（迅速な意思決定を可能にするため大幅な委任を認め（416条4項）、監督機能を大幅に強化するため3委員会の設置を義務づけ（2条12号）、各委員会の委員の過半数は社外取締役とした（400条3項））。PDF p.87（本編 p.84） ／ PDF p.87（本編 p.84）。台帳要素 t313-e01（総則図：取締役会は①業務執行の決定（416条1項）・②監督を担い、監督強化のため3委員会の設置を義務づける（監督機関）。執行役は①業務執行の決定・②業務執行行為（418条）を担う（執行機関）。取締役会から執行役への大幅な委任（416条4項）により執行と監督を分離する）。図表（PDF p.87、本編 p.84）。ラベルはテキスト層に含まれ、関係性は画像化して目視確認済み（work/figcheck/p087.png） の逐語引用に基づく。", "caution": "", "articles": ["416条4項", "2条", "400条3項"], "page": 87, "loc": "8 指名委員会等設置会社／指名委員会等設置会社の総則（執行と監督の分離）"}, {"id": "book-kigyoho-01-ch02-q5027", "ch": 2, "type": "規定→趣旨", "q": "指名委員会等設置会社では、取締役の選任・解任に関する株主総会の議案の内容は、指名委員会が最終的に決定する（404条1項）。この権限配分の趣旨は何か。", "a": "社外取締役が過半数を占める指名委員会に取締役の選任・解任に関する議案の内容を最終決定させることにより、取締役の人事について代表執行役からの独立性を確保し、執行役の業務執行に対する監督を充実させるためである。", "reason": "執行のトップである代表執行役が取締役の人事を左右できるのでは監督が機能しないため、人事の最終決定を社外取締役が過半数を占める指名委員会に委ねる趣旨である。", "basis": "PDF p.88（本編 p.85）。台帳要素 t317-e01（社外取締役が過半数を占める指名委員会に取締役の選任・解任に関する議案の内容を最終決定させることにより、取締役の人事について代表執行役からの独立性を確保し、執行役の業務執行に対する監督を充実させるため）。PDF p.88（本編 p.85） の逐語引用に基づく。", "caution": "", "articles": ["404条1項"], "page": 88, "loc": "8 指名委員会等設置会社／404条1項の趣旨（指名委員会の権限）"}, {"id": "book-kigyoho-01-ch02-q5028", "ch": 2, "type": "規定→趣旨", "q": "指名委員会等設置会社では、執行役等の個人別の報酬等の内容は、報酬委員会が定める（404条3項）。この権限配分の趣旨は何か。", "a": "本来報酬等の決定は業務執行行為として取締役会の権限に属するが、執行役への報酬等の決定の委任（416条4項本文）によるお手盛りを防止して、執行役に対する監督を充実するためである。", "reason": "執行と監督を分離する制度のもとで、執行役の報酬まで執行側に委ねるとお手盛りのおそれがあるため、報酬委員会が定めるものとされる。なお、報酬委員・取締役によるお手盛りのおそれは409条1項2項によって排除される。", "basis": "PDF p.88（本編 p.85）。台帳要素 t318-e01（本来報酬等の決定は業務執行行為として取締役会の権限に属するが、執行役への報酬等の決定の委任（416条4項本文）によるお手盛りを防止して、執行役に対する監督を充実するため）。PDF p.88（本編 p.85） の逐語引用に基づく。", "caution": "", "articles": ["404条3項", "416条4項"], "page": 88, "loc": "8 指名委員会等設置会社／404条3項の趣旨（報酬委員会の権限）"}, {"id": "book-kigyoho-01-ch02-q5029", "ch": 2, "type": "規定→趣旨", "q": "指名委員会等設置会社と執行役又は取締役との間の訴えにおいては、会社を代表するのは、本来会社を代表する代表執行役ではなく、監査委員等である（408条）。この定めの趣旨は何か。", "a": "本来、会社を代表するのは代表執行役であるが（349条4項参照）、なれ合い訴訟を防止するためである。", "reason": "訴えの相手方である執行役・取締役と近い代表執行役が会社を代表すると、なれ合い訴訟となるおそれがあるためである。監査役設置会社と取締役との間の訴えにおける会社の代表（386条）と同様の趣旨の規定である。", "basis": "PDF p.89（本編 p.86）。台帳要素 t320-e01（本来、会社を代表するのは代表執行役であるが（349条4項）、なれ合い訴訟を防止するため）。PDF p.89（本編 p.86） ／ PDF p.89（本編 p.86）。台帳要素 t320-e02（監査役設置会社と取締役との間の訴えにおける会社の代表（386条）と同様の規定）。PDF p.89（本編 p.86） の逐語引用に基づく。", "caution": "", "articles": ["408条", "349条4項"], "page": 89, "loc": "8 指名委員会等設置会社／408条の趣旨（訴えにおける会社の代表）"}, {"id": "book-kigyoho-01-ch02-q5030", "ch": 2, "type": "規定→趣旨", "q": "監査委員会の業務監査権（404条2項1号）の範囲は、執行役等の適法性監査のみならず、妥当性監査にまで及ぶと解される。その理由（趣旨）は何か。", "a": "監査委員は、株式会社の業務執行の妥当性を監督する取締役会の構成員である取締役であるからである。", "reason": "監査委員は監査役とは異なり取締役会の構成員たる取締役であり、妥当性の監督をも担う立場にあるため、その業務監査権は妥当性監査にまで及ぶと解される。", "basis": "PDF p.90（本編 p.87）。台帳要素 t323-e02（なぜなら、監査委員は、株式会社の業務執行の妥当性を監督する取締役会の構成員である取締役であるからである）。PDF p.90（本編 p.87） ／ PDF p.90（本編 p.87）。台帳要素 t323-e01（監査委員会の業務監査権の範囲は、執行役等（取締役）の適法性監査のみならず、妥当性監査にまで及ぶと解する）。PDF p.90（本編 p.87） の逐語引用に基づく。", "caution": "", "articles": ["404条2項"], "page": 90, "loc": "8 指名委員会等設置会社／（論点）監査委員会の業務監査権（404条2項1号）の範囲"}, {"id": "book-kigyoho-01-ch02-q5031", "ch": 2, "type": "規定→趣旨", "q": "監査等委員会設置会社については、選任・解任（341条以下）、任期（332条）、報酬（361条）といった事項について、通常の取締役とは異なる特則が置かれている。これらの特則（361条6項、423条4項かっこ書きを除く）に共通する趣旨は何か。", "a": "監査等委員である取締役の独立性を確保し、実効ある監査等（監査等の充実）のためである。", "reason": "監査等委員である取締役は監査を担う立場にあるため、その選任・任期・報酬等について、監査の対象からの独立性を確保する特則が各所に置かれている。", "basis": "PDF p.92（本編 p.89）。台帳要素 t327-e05（（3）の趣旨（361条6項、423条4項かっこ書きを除く）は、監査等委員である取締役の独立性を確保し、実効ある監査等（監査等の充実）のため）。PDF p.92（本編 p.89） ／ PDF p.92（本編 p.89）。台帳要素 t327-e01（選任・解任とくれば329条以下だが、329条2項。選任・解任の特則は341条以下で、特に342条の2、344条の2）。PDF p.92（本編 p.89） の逐語引用に基づく。", "caution": "", "articles": ["341条", "332条", "361条", "361条6項", "423条4項"], "page": 92, "loc": "9 監査等委員会設置会社／「権限」以外の特則（選任・解任・任期・報酬・責任）"}, {"id": "book-kigyoho-01-ch02-q5032", "ch": 2, "type": "規定→趣旨", "q": "忠実義務を負うのは、取締役（355条）と執行役（419条2項、355条）だけであり、会計参与・監査役・会計監査人には、忠実義務のほか競業取引の規制、利益相反取引の規制も課されていない。このように忠実義務・競業規制・利益相反規制がこの2者にのみ課される趣旨は何か。", "a": "会社と利益衝突が生じるおそれがあるのは、会社の業務を執行し会社を代表する（代表）取締役・（代表）執行役である。そこで、この2者について忠実義務、競業取引の規制、利益相反取引の規制を課し、利益衝突を防ごうとしている。", "reason": "これらの規制は、業務を執行し会社を代表する立場ゆえに生じる利益衝突を防ぐためのものであり、そのような立場にない会計参与・監査役・会計監査人には課されない。", "basis": "PDF p.94（本編 p.91）。台帳要素 t331-e03（会社と利益衝突が生じるおそれがあるのは、会社の業務を執行し会社を代表する（代表）取締役・（代表）執行役である。そこで、この2者について（2）忠実義務、（3）競業取引の規制、（4）利益相反取引の規制を課し、利益衝突を防ごうとしている。逆に、会計参与・監査役・会計監査人には、忠実義務・競業取引の規制・利益相反取引の規制はない）。PDF p.94（本編 p.91） ／ PDF p.94（本編 p.91）。台帳要素 t331-e02（忠実義務を負うのは、取締役（355条）と執行役（419条2項、355条）だけ）。PDF p.94（本編 p.91） の逐語引用に基づく。", "caution": "", "articles": ["355条", "419条2項"], "page": 94, "loc": "10 役員等の義務（1）善管注意義務・（2）忠実義務／忠実義務と同質説（最判昭和45・6・24）"}, {"id": "book-kigyoho-01-ch02-q5033", "ch": 2, "type": "規定→趣旨", "q": "取締役が自己又は第三者のために株式会社の事業の部類に属する取引（競業取引）をしようとするときは、重要な事実を開示して会社の承認を受けなければならない（356条1項1号、365条1項）。この競業取引の規制の趣旨は何か。", "a": "取締役の競業取引を放任すれば、会社のノウハウを取締役が利用して取引機会や得意先を奪うおそれがあるので、会社の利益を保護するためである。", "reason": "競業取引は、取締役が会社の内部情報を利用して会社の利益を奪う危険を伴うため、開示と承認による規制が置かれる。", "basis": "PDF p.95（本編 p.92）。台帳要素 t332-e01（取締役の競業取引を放任すれば、会社のノウハウを取締役が利用して取引機会や得意先を奪うおそれがあるので、会社の利益を保護するためである）。PDF p.95（本編 p.92） の逐語引用に基づく。", "caution": "", "articles": ["356条1項", "365条1項"], "page": 95, "loc": "10 役員等の義務（3）競業取引／競業取引の趣旨と＜事例1＞"}, {"id": "book-kigyoho-01-ch02-q5034", "ch": 2, "type": "規定→趣旨", "q": "会社法423条2項は、取締役等が会社の承認なくして競業取引をした場合、当該取引によって取締役等又は第三者が得た利益の額を、会社に生じた損害の額と推定すると定める。この推定規定の趣旨は何か。", "a": "損害額の立証が困難なので、損害を受けた会社の救済のためである。", "reason": "競業取引による会社の損害額は立証が困難であるため、取締役等が得た利益の額をもって損害の額と推定し、会社の救済を図る趣旨である。", "basis": "PDF p.96（本編 p.93）。台帳要素 t337-e03（423条2項の趣旨は、損害額の立証が困難なので、損害会社の救済のため（原文ママ））。PDF p.96（本編 p.93） ／ PDF p.96（本編 p.93）。台帳要素 t337-e02（会社の承認なくして競業取引をした場合、取締役等が得た利益は会社の損害額と推定される（423条2項）。本問ではAが得た800万円が会社の損害額と推定される）。会社法423条2項。PDF p.96（本編 p.93） の逐語引用に基づく。", "caution": "423条2項の原文では「損害会社の救済のため」と記載されている（原文ママ）。", "articles": ["423条2項"], "page": 96, "loc": "10 役員等の義務（3）競業取引／競業違反と取締役の任務懈怠責任（423条1項・2項）"}, {"id": "book-kigyoho-01-ch02-q5035", "ch": 2, "type": "規定→趣旨", "q": "取締役が自己又は第三者のために株式会社と取引をしようとするとき（356条1項2号）、及び取締役以外の者との間において株式会社と取締役との利益が相反する取引をしようとするとき（同項3号）は、重要な事実を開示して会社の承認を受けなければならない。この利益相反取引の規制の趣旨は何か。", "a": "会社と取締役との利益相反取引を規制しなければ、会社が不利益な取引をさせられ会社に重大な不利益が生じるおそれがあるためである。", "reason": "利益相反取引では、取締役が自己の利益を優先して会社に不利益な条件の取引をさせる危険があるため、開示と承認による規制が置かれる。", "basis": "PDF p.99（本編 p.96）。台帳要素 t340-e01（会社と取締役との利益相反取引を規制しなければ、会社が不利益な取引をさせられ会社に重大な不利益が生じるおそれがあるためである）。PDF p.99（本編 p.96） の逐語引用に基づく。", "caution": "", "articles": ["356条1項"], "page": 99, "loc": "10 役員等の義務（4）利益相反取引／利益相反取引の趣旨"}, {"id": "book-kigyoho-01-ch02-q5036", "ch": 2, "type": "規定→趣旨", "q": "会社法423条3項は、利益相反取引をした取締役等について任務懈怠があったものと推定する。この推定は、取締役会（会社）の承認があった場合にも及ぶが、そのように承認があっても任務懈怠の推定を認める趣旨は何か。", "a": "利益相反取引の際の承認は、取締役会と利益相反取締役との馴れ合いの危険があるので、任務懈怠を推定し、立証責任を転換して会社の利益を図るためである。", "reason": "423条3項には423条2項と異なり「違反して」という表現がないため、承認の有無にかかわらず適用でき、承認手続を経た場合でも、馴れ合いの危険に備えて任務懈怠が推定される。", "basis": "PDF p.105（本編 p.102）。台帳要素 t350-e03（423条3項：＜趣旨＞立証責任を転換し会社の利益を図るため。取締役会（会社）の承認があっても任務懈怠の推定を認めるのは、利益相反取引の際の承認は取締役会と利益相反取締役との馴れ合いの危険があるから）。PDF p.105（本編 p.102） ／ PDF p.105（本編 p.102）。台帳要素 t350-e01（423条3項：＜効果＞任務懈怠の推定。423条2項とは異なり「違反して」という表現はない。したがって、会社の承認の有無に関係なく423条3項は適用できる）。会社法423条3項。PDF p.105（本編 p.102） の逐語引用に基づく。", "caution": "監査等委員会設置会社の場合は、423条4項により3項の任務懈怠の推定はない。", "articles": ["423条3項"], "page": 105, "loc": "10 役員等の義務（4）利益相反取引／利益相反取引と取締役の任務懈怠責任（423条1項・3項・428条）"}, {"id": "book-kigyoho-01-ch02-q5037", "ch": 2, "type": "規定→趣旨", "q": "会社法428条は、取締役等が自己のために株式会社と直接取引をした場合について、一定の要件のもとで無過失責任を定める。このように重い責任が課される趣旨は何か。", "a": "自己のために会社と取引を行うことは利益相反性は著しく高いからである。", "reason": "自己のための直接取引は利益相反の程度が著しく高いため、故意・過失がなくても責任を負う無過失責任とされる。428条の要件は、①利益相反の直接取引であること、②「自己のために」に限ることである。", "basis": "PDF p.106（本編 p.103）。台帳要素 t350-e08（428条の趣旨は、自己のために会社と取引を行うことは利益相反性は著しく高いから）。PDF p.106（本編 p.103） ／ PDF p.106（本編 p.103）。台帳要素 t350-e06（428条の要件：①利益相反の直接取引であること、②「自己のために」に限る）。会社法428条。PDF p.106（本編 p.103） の逐語引用に基づく。", "caution": "", "articles": ["428条"], "page": 106, "loc": "10 役員等の義務（4）利益相反取引／利益相反取引と取締役の任務懈怠責任（423条1項・3項・428条）"}, {"id": "book-kigyoho-01-ch02-q5038", "ch": 2, "type": "規定→趣旨", "q": "取締役の報酬等は、定款にその額を定めていないときは、株主総会の決議によって定める（361条1項）。本来、報酬等の決定は業務執行行為であり取締役の決定・取締役会の決議によるものであるにもかかわらず、このような定め方がされる趣旨は何か。", "a": "それでは取締役によるお手盛りの危険がある。そこで、お手盛りを防止して会社の利益を保護するため、定款で定めるか株主総会決議で定めることとした。", "reason": "自己の報酬を自己が決めることになるお手盛りの危険を防ぐため、報酬等の決定は会社の所有者である株主の意思決定（定款・株主総会決議）に委ねられる。", "basis": "PDF p.113（本編 p.110）。台帳要素 t357-e04（本来、報酬等の決定は業務執行行為であり取締役の決定・取締役会の決議によるものである。しかし、それでは取締役によるお手盛りの危険がある。そこで、お手盛りを防止して会社の利益を保護するため、定款で定めるか株主総会決議で定めることとした）。PDF p.113（本編 p.110） ／ PDF p.113（本編 p.110）。台帳要素 t357-e02（手続①：定款または株主総会の（普通）決議によって定める（361条1項））。PDF p.113（本編 p.110） の逐語引用に基づく。", "caution": "", "articles": ["361条1項"], "page": 113, "loc": "10 役員等の義務（5）取締役の報酬等の決定／取締役の報酬等の決定（361条）"}, {"id": "book-kigyoho-01-ch02-q5039", "ch": 2, "type": "規定→趣旨", "q": "会社法361条7項は、監査役会設置会社（公開会社であり、かつ、大会社であるものに限る）であって有価証券報告書を提出しなければならないもの及び監査等委員会設置会社の取締役会は、取締役の個人別の報酬等の内容についての決定に関する方針として法務省令で定める事項を決定しなければならないと定める。この定めの趣旨は何か。", "a": "取締役の報酬等の内容の決定手続きに関する透明性を向上させるためである。", "reason": "報酬等は会社の業績を高めるためのインセンティブ付与の手段であり、投資家や株主にとって金額のみならず内容や条件も重要な関心事であるため、とりわけ上場会社のような会社については決定手続の透明性を向上させる趣旨である。", "basis": "PDF p.115（本編 p.112）。台帳要素 t360-e03（361条7項の趣旨は、取締役の報酬等の内容の決定手続きに関する透明性を向上させるためである）。PDF p.115（本編 p.112） ／ PDF p.115（本編 p.112）。台帳要素 t360-e01（361条7項：次に掲げる株式会社の取締役会は、取締役（監査等委員である取締役を除く。）の報酬等の内容として定款又は株主総会の決議による第1項各号の事項についての定めがある場合には、当該定めに基づく取締役の個人別の報酬等の内容についての決定に関する方針として法務省令で定める事項を決定しなければならない（ただし書あり）。一 監査役会設置会社（公開会社であり、かつ、大会社であるものに限る。）であって、有価証券報告書を提出しなければならないもの、二 監査等委員会設置会社）。会社法361条7項（レジュメ引用） の逐語引用に基づく。", "caution": "個人別の報酬等の内容が定款又は株主総会の決議により定められているときは、361条7項は適用されない（同項ただし書）。", "articles": ["361条7項"], "page": 115, "loc": "10 役員等の義務（5）取締役の報酬等の決定／個人別の報酬等の内容についての決定方針（361条7項）"}, {"id": "book-kigyoho-01-ch02-q5040", "ch": 2, "type": "規定→趣旨", "q": "株主は、取締役が法令若しくは定款に違反する行為をし、又はするおそれがある場合において、その行為によって会社に損害が生じるおそれがあるときは、当該取締役に対しその行為をやめることを請求することができる（360条1項3項）。この株主による違法行為差止請求権が認められる趣旨は何か。", "a": "取締役・執行役がなれ合い、他の取締役・執行役の違法行為を差し止めることが期待できない場合もある。そこで、会社・株主の利益を保護するため、株主による差止めを認めたのである。", "reason": "違法行為の差止めは本来、監査役や他の取締役による監督に期待されるところ、そのなれ合いが懸念されるため、株主自身による差止めが認められる。", "basis": "PDF p.121（本編 p.118）。台帳要素 t369-e03（取締役・執行役がなれ合い、他の取締役・執行役の違法行為を差し止めることが期待できない場合もある。そこで、会社・株主の利益を保護するため、株主による差止めを認めたのである）。PDF p.121（本編 p.118） の逐語引用に基づく。", "caution": "本レジュメでは、360条1項3項の要件の内容は記載されておらず、番号のみが示されている（要件欄は空白）。", "articles": ["360条1項"], "page": 121, "loc": "10 役員等の義務（6）株主の監督権限の強化／具体例① 株主による取締役の違法行為差止請求権（360条1項3項）"}, {"id": "book-kigyoho-01-ch02-q5041", "ch": 2, "type": "規定→趣旨", "q": "任務懈怠責任（423条1項）の全部免除には総株主の同意が必要である（424条）一方で、一定の方法による一部免除が認められている（425条の株主総会特別決議、426条の定款規定＋取締役会決議、427条の責任限定契約）。この一部免除が認められる趣旨は何か。", "a": "役員等に高額の賠償責任を負わせたのでは、経営が萎縮してしまいかえって株主に不利益を与えるおそれがあるためである。", "reason": "責任追及による萎縮効果がかえって株主の不利益になることを避けるため、善意無重過失等の要件のもとで一部免除の方法が用意される。", "basis": "PDF p.123（本編 p.120）。台帳要素 t404-e03（一部免除の趣旨：役員等に高額の賠償責任を負わせたのでは、経営が萎縮してしまいかえって株主に不利益を与えるおそれがあるため）。PDF p.123（本編 p.120） ／ PDF p.123（本編 p.120）。台帳要素 t404-e02（一部免除の方法：425条は事後の株主総会特別決議による一部免除、426条は事前の定款規定＋事後の取締役会決議（取締役の過半数）による一部免除、427条は事前の定款規定＋事前の非業務執行取締役等との責任限定契約）。PDF p.123（本編 p.120） の逐語引用に基づく。", "caution": "一部免除の共通要件として、「職務を行うにつき善意でかつ重大な過失がない」ことと、監査役・監査委員の全員の同意が必要である。", "articles": ["423条1項", "424条", "425条", "426条", "427条"], "page": 123, "loc": "11 役員等の会社に対する責任（任務懈怠責任、423条）―要件・任務懈怠・免除等／任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"}, {"id": "book-kigyoho-01-ch02-q5042", "ch": 2, "type": "規定→趣旨", "q": "株主は、会社に対し、責任追及等の訴えの提起を請求し、会社が請求の日から60日以内に訴えを提起しないときは、自らその訴えを提起することができる（847条、株主代表訴訟）。この制度の趣旨は何か。", "a": "役員等がなれ合い、役員等の会社に対する責任追及が不問に付されてしまう危険があるためである。", "reason": "会社自身による責任追及は、追及する側とされる側がともに役員等であるため不問に付される危険があることから、株主が会社に代わって追及する仕組みが認められる。", "basis": "PDF p.135（本編 p.132）。台帳要素 t412-e01（趣旨：役員等がなれ合い、役員等の会社に対する責任追及が不問に付されてしまう危険があるため）。PDF p.135（本編 p.132） ／ PDF p.135（本編 p.132）。台帳要素 t412-e02（要件：①6ヶ月株式を保有する株主による（非公開会社は6ヶ月要件不要、2項）、②責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項））。会社法847条1項・2項（レジュメの要件整理） の逐語引用に基づく。", "caution": "", "articles": ["847条"], "page": 135, "loc": "12 株主による責任追及等の訴え等／株主による責任追及等の訴え（株主代表訴訟、847条）"}, {"id": "book-kigyoho-01-ch02-q5043", "ch": 2, "type": "規定→趣旨", "q": "株式交換等により当該株式会社の株主でなくなった者（旧株主）にも、一定の場合に、株式交換等完全子会社に対する責任追及等の訴えの提起の請求が認められている（847条の2）。この定めの趣旨は何か。", "a": "株主が責任追及の訴えを提起する前に、株式交換等がなされ、株主による役員等の責任追及を不可能にすることを防ぐためである。", "reason": "組織再編によって株主の地位を失わせることで責任追及を封じることを防ぐため、旧株主にも提訴請求が認められる。対象は、効力が生じた時までに原因事実が生じた責任・義務に係るものに限られる。", "basis": "PDF p.136（本編 p.133）。台帳要素 t413-e01（趣旨：株主が責任追及の訴えを提起する前に株式交換等がなされ、株主による役員等の責任追及を不可能にすることを防ぐため）。PDF p.136（本編 p.133） ／ PDF p.137（本編 p.134）。台帳要素 t413-e03（847条の2第1項：行為の効力が生じた日の6ヶ月前から当該日まで引き続き株主であった者（旧株主）は、株主でなくなった場合であっても、各号に定めるときは、株式交換等完全子会社に対し、責任追及等の訴え（効力が生じた時までに原因事実が生じた責任・義務に係るものに限る）の提起を請求できる。ただし図利加害目的の場合はこの限りでない）。会社法847条の2第1項本文（レジュメ引用。①〜④はレジュメが付した番号） の逐語引用に基づく。", "caution": "", "articles": ["847条の2"], "page": 136, "loc": "12 株主による責任追及等の訴え等／旧株主による責任追及等の訴え（847条の2）"}, {"id": "book-kigyoho-01-ch02-q5044", "ch": 2, "type": "規定→趣旨", "q": "最終完全親会社等の株主は、子会社である株式交換等完全子会社の役員等の責任について、特定責任追及の訴えの提起を請求することができる（847条の3、多重代表訴訟等）。この制度の趣旨は何か。", "a": "子会社の役員等の任務懈怠等について、最終完全親会社等による責任追及の懈怠の可能性がある。その場合に、最終完全親会社等の株主の利益が害されるのを防ぐためである。", "reason": "子会社の役員等の責任追及を最終完全親会社等が怠ると、その不利益は最終的には最終完全親会社等の株主に及ぶため、その株主による特定責任追及が認められる。", "basis": "PDF p.138（本編 p.135）。台帳要素 t414-e01（趣旨：子会社の役員等の任務懈怠等について、最終完全親会社等による責任追及の懈怠の可能性があり、その場合に最終完全親会社等の株主の利益が害されるのを防ぐため）。PDF p.138（本編 p.135） ／ PDF p.138（本編 p.135）。台帳要素 t414-e02（要件：①6ヶ月継続して最終完全親会社等の総議決権の1/100以上株式を有する株主による（非公開会社は6ヶ月要件不要、6項）、②特定責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項））。会社法847条の3第1項・6項（レジュメの要件整理） の逐語引用に基づく。", "caution": "", "articles": ["847条の3"], "page": 138, "loc": "12 株主による責任追及等の訴え等／最終完全親会社等の株主による特定責任追及の訴え（多重代表訴訟等、847条の3）"}, {"id": "book-kigyoho-01-ch02-q5045", "ch": 2, "type": "規定→趣旨", "q": "補償契約（430条の2）及び役員等のための保険契約（430条の3）については、その締結に規制が設けられている。この規制の趣旨を2つ挙げよ。", "a": "①補償契約・保険契約を自由に認めたのでは、役員等の職務の執行の適正性が損なわれるおそれがあるため、②会社と役員等との利益が相反する場面があるので、利益相反規制に準じた規制をするためである。", "reason": "補償契約は直接利益相反取引（356条1項2号）と同じ状況にあるため、利益相反規制に準じた規制が及び、また職務執行の適正性確保の観点からも規制が設けられる（令和元年改正）。", "basis": "PDF p.151（本編 p.148）。台帳要素 t425-e01（趣旨：①補償契約・保険契約を自由に認めたのでは、役員等の職務の執行の適正性が損なわれるおそれがあるため、②会社と役員等との利益が相反する場面があるので、利益相反規制に準じた規制をするため）。PDF p.151（本編 p.148） の逐語引用に基づく。", "caution": "", "articles": ["430条の2", "430条の3"], "page": 151, "loc": "14 補償契約（430条の2）・役員等のための保険契約（430条の3）／補償契約・保険契約の趣旨（令和元年改正）"}, {"id": "book-kigyoho-01-ch02-q5046", "ch": 2, "type": "規定→趣旨", "q": "株主は、一定の要件のもとで、会社の会計帳簿の閲覧等を請求することができる（433条）。この会計帳簿閲覧請求が認められる趣旨は何か。", "a": "株主に会計帳簿に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や役員解任の訴え（854条）を提起するために役に立つ情報を株主は得ることができる。", "reason": "株主の権利行使には前提として情報収集が必要であるため、会計帳簿の閲覧によって、代表訴訟や解任の訴えの提起に役立つ情報の収集が保障される。", "basis": "PDF p.154（本編 p.151）。台帳要素 t429-e01（会計帳簿閲覧請求は、株主に会計帳簿に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や役員解任の訴え（854条）を提起するために役に立つ情報を株主は得ることができる）。PDF p.154（本編 p.151） の逐語引用に基づく。", "caution": "", "articles": ["433条", "847条", "854条"], "page": 154, "loc": "15 取締役等の行為の差止請求等／会計帳簿閲覧請求（433条）"}, {"id": "book-kigyoho-01-ch02-q5047", "ch": 2, "type": "規定→趣旨", "q": "株主は、一定の要件のもとで、業務執行に関する検査役の選任を請求することができる（358条）。この制度の趣旨は何か。", "a": "株主に業務執行に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や違法行為差止請求権（360条）を行使するために役に立つ情報を株主は得ることができる。", "reason": "会計帳簿閲覧請求（433条）と同様に、株主の権利行使の前提となる情報収集を保障する制度であり、検査役による調査を通じて必要な情報が得られる。", "basis": "PDF p.154（本編 p.151）。台帳要素 t430-e01（業務執行に関する検査役の選任は、株主に業務執行に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や違法行為差止請求権（360条）を行使するために役に立つ情報を株主は得ることができる）。PDF p.154（本編 p.151） の逐語引用に基づく。", "caution": "", "articles": ["358条", "847条", "360条"], "page": 154, "loc": "15 取締役等の行為の差止請求等／業務執行に関する検査役の選任（358条）"}, {"id": "book-kigyoho-01-ch02-q5048", "ch": 2, "type": "条文構造", "q": "会社法120条は、利益供与について、1項から4項まででどのような仕組み（構造）を定めているか。各項の役割を順に述べよ。", "a": "1項が、株主の権利の行使に関する財産上の利益の供与の禁止を定め、2項が、特定の株主に対して無償で財産上の利益の供与をした場合等に「株主の権利の行使に関し」供与したものと推定し、3項が、利益の供与を受けた者の返還義務を定め、4項が、利益供与をした取締役（執行役）・関与した取締役（執行役）の会社に対する支払義務を定める、という構造である。", "reason": "120条は、禁止（1項）→推定（2項）→受領者への返還請求（3項）→関与取締役等への支払請求（4項）という流れで、利益供与の禁止とその実効性確保の仕組みを一体として定めている。", "basis": "PDF p.38（本編 p.35）。台帳要素 t121-e01（120条1項：株式会社は、①何人に対しても、②株主の権利等の行使に関し、③財産上の利益の供与（当該株式会社又はその子会社の計算においてするものに限る）をしてはならない）。会社法120条1項（レジュメ引用）。要件は①②③、効果は③の禁止 ／ PDF p.39（本編 p.36）。台帳要素 t122-e02（120条2項の推定：特定の株主に対して無償で財産上の利益の供与をしたときは「株主の権利の行使に関し」供与したものと推定する。有償でも会社・子会社の受けた利益が著しく少ないときも同様）。会社法120条2項（レジュメ引用） ／ PDF p.39（本編 p.36）。台帳要素 t122-e03（設例（おしぼりリース）での推定と問題所在：A・X1・X2が「取引行為であって株主の権利行使に関するものでない」と主張しても、120条2項によって「株主の権利の行使に関」すると推定される。返還請求は120条3項、取締役への支払請求は120条4項の問題）。PDF p.39（本編 p.36）。設例の当事者（代取X1が実際契約締結、平取X2が取締役会決議に賛成）は同ページの図による ／ PDF p.40（本編 p.37）。台帳要素 t123-e01（120条4項の責任の区別：利益供与を「した」取締役（執行役）は無過失責任、利益供与に「関与した」取締役（執行役）は過失責任）。会社法120条4項。PDF p.40（本編 p.37） の逐語引用に基づく。", "caution": "4項では、利益供与を「した」取締役（執行役）は無過失責任、「関与した」取締役（執行役）は過失責任と区別される。", "articles": ["120条"], "page": 38, "loc": "（5）決議／利益供与の禁止の趣旨と120条2項の推定"}, {"id": "book-kigyoho-01-ch02-q5049", "ch": 2, "type": "条文構造", "q": "取締役会設置会社においては、株主総会は、株主総会の目的である事項（議題）以外の事項については決議することができない（309条5項）。この定めと、株主の議題提案権（303条）とは、条文の構造上どのように結びついているか。", "a": "取締役会設置会社では、株主は株主総会の場で議題を提案することができない（309条5項参照）。そのため、株主が新たな事項を株主総会に取り上げさせるには、総会に先だって303条の議題提案権を行使し、議題とするよう請求する必要があるという構造になっている（304条の議案提案権は単独株主権として総会の場でも行使できる）。", "reason": "309条5項が議題外決議を禁じるため、議題の設定は原則として取締役会に委ねられ、株主が議題を加える手段として303条の事前の議題提案権が用意されている。", "basis": "PDF p.46（本編 p.43）。台帳要素 t127-e03（309条5項：取締役会設置会社においては株主総会は、株主総会の目的たる事項（議題）以外の事項については議決できない）。会社法309条5項。PDF p.46（本編 p.43）。t102-e03・t114-e04と関連 ／ PDF p.31（本編 p.28）。台帳要素 t114-e04（前提図（取締役会設置会社）：取締役会が株主総会へ議題提出し、株主に2週間前に招集通知（議題を記載）。株主は株主総会において議案は提案できる（304条、単独株主権）が、議題は提案できない（309条5項参照））。PDF p.31（本編 p.28）の図。ページを画像化して目視確認済み（work/figcheck/p031.png）：取締役会→株主総会への矢印「議題提出」、取締役会→株主への矢印「2週間前に招集通知」、株主→株主総会への矢印（＊） の逐語引用に基づく。", "caution": "", "articles": ["309条5項", "303条", "304条"], "page": 46, "loc": "（5）決議／株主総会の決議の成立要件（309条）"}, {"id": "book-kigyoho-01-ch02-q5050", "ch": 2, "type": "条文構造", "q": "会社法356条1項各号が定める取引の類型と号の対応として、正しいものはどれか。", "a": "1号は競業取引、2号は直接取引、3号は間接取引である。", "reason": "356条1項は、1号で競業取引、2号で直接の利益相反取引、3号で間接の利益相反取引を並べ、いずれについても重要な事実の開示と会社の承認を要求する構造である（取締役会設置会社では365条1項の取締役会の承認）。", "basis": "PDF p.95（本編 p.92）。台帳要素 t333-e01（「取締役が自己又は第三者のために株式会社の事業の部類に属する取引をしようとするとき」）。会社法356条1項1号（レジュメ引用）。PDF p.95（本編 p.92） ／ PDF p.100（本編 p.97）。台帳要素 t342-e01（取締役が自己又は第三者のために株式会社と取引をしようとするとき）。会社法356条1項2号（レジュメ引用）。PDF p.100（本編 p.97） ／ PDF p.99（本編 p.96）。台帳要素 t341-e03（「取締役以外の者との間において株式会社と当該取締役との利益が相反する取引をしようとするとき」）。会社法356条1項3号（レジュメ引用）。PDF p.99（本編 p.96） の逐語引用に基づく。", "caution": "", "articles": ["356条1項"], "page": 95, "loc": "10 役員等の義務（4）利益相反取引／間接取引（356条1項3号）の要件"}, {"id": "book-kigyoho-01-ch02-q5051", "ch": 2, "type": "条文構造", "q": "取締役・執行役に対する義務・規制は、条文上どのように構造化されているか。善管注意義務との関係と、規制が及ぶ者の範囲をあわせて述べよ。", "a": "善管注意義務（取締役は330条・民法644条、執行役は402条・民法644条）を土台として、会社と利益衝突が生じるおそれがある（代表）取締役・（代表）執行役については、さらに忠実義務（355条）、競業取引の規制、利益相反取引の規制が課される構造である。これに対し、会計参与・監査役・会計監査人には、忠実義務・競業取引の規制・利益相反取引の規制はない。", "reason": "利益衝突のおそれは業務を執行し会社を代表する立場に特有であるため、利益衝突を防ぐ規制は（代表）取締役・（代表）執行役に重ねて課され、それ以外の役員等には課されないという構造になっている。", "basis": "PDF p.94（本編 p.91）。台帳要素 t331-e03（会社と利益衝突が生じるおそれがあるのは、会社の業務を執行し会社を代表する（代表）取締役・（代表）執行役である。そこで、この2者について（2）忠実義務、（3）競業取引の規制、（4）利益相反取引の規制を課し、利益衝突を防ごうとしている。逆に、会計参与・監査役・会計監査人には、忠実義務・競業取引の規制・利益相反取引の規制はない）。PDF p.94（本編 p.91） ／ PDF p.94（本編 p.91）。台帳要素 t331-e02（忠実義務を負うのは、取締役（355条）と執行役（419条2項、355条）だけ）。PDF p.94（本編 p.91） の逐語引用に基づく。", "caution": "", "articles": ["330条", "644条", "402条", "355条"], "page": 94, "loc": "10 役員等の義務（1）善管注意義務・（2）忠実義務／忠実義務と同質説（最判昭和45・6・24）"}, {"id": "book-kigyoho-01-ch02-q5052", "ch": 2, "type": "条文構造", "q": "株主総会の招集手続（298条・299条）と取締役会の招集手続（368条）とを比較し、①通知の時期、②通知の相手方、③招集手続を省略できる場合について、構造の違いを述べよ。", "a": "①通知の時期は、株主総会が総会の日の二週間（非公開会社では一週間）前まで（299条1項）であるのに対し、取締役会は会日の一週間（定款で下回る期間を定めた場合はその期間）前まで（368条1項）である。②通知の相手方は、株主総会は株主であるのに対し、取締役会は各取締役（監査役設置会社にあっては、各取締役及び各監査役）である。③省略については、株主総会は株主全員の同意がある場合に300条による省略が認められ、取締役会は取締役（監査役設置会社にあっては、取締役及び監査役）の全員の同意があるときに招集手続を経ることなく開催できる（368条2項）点で、並行する構造である。", "reason": "368条2項は300条と同趣旨の規定であり、株主総会の招集通知（299条）と取締役会の招集手続（368条）の比較は、本レジュメでも特に重要とされている。", "basis": "PDF p.55（本編 p.52）。台帳要素 t210-e01（368条1項：取締役会を招集する者は、取締役会の日の一週間（定款で下回る期間を定めた場合はその期間）前までに、各取締役（監査役設置会社にあっては各取締役及び各監査役）に対して通知を発しなければならない）。会社法368条1項（レジュメ引用） ／ PDF p.55（本編 p.52）。台帳要素 t210-e02（368条2項：取締役（監査役設置会社にあっては取締役及び監査役）の全員の同意があるときは、招集の手続を経ることなく開催することができる）。会社法368条2項（レジュメ引用） ／ PDF p.55（本編 p.52）。台帳要素 t210-e03（株主総会の招集通知（299条）との比較が重要。368条2項は300条と同趣旨であり比較を要する）。PDF p.55（本編 p.52） の逐語引用に基づく。", "caution": "株主総会の招集は、取締役会設置会社では取締役会の招集決定（298条4項）を前提とする点でも取締役会の招集と異なる。", "articles": ["298条", "299条", "368条", "299条1項", "368条1項", "300条"], "page": 55, "loc": "3 取締役会設置会社／取締役会の招集手続（368条）"}, {"id": "book-kigyoho-01-ch02-q5053", "ch": 2, "type": "条文構造", "q": "株主総会決議の瑕疵を争う訴えは、瑕疵の性質に応じてどのように分かれているか。決議取消しの訴え（831条1項）、決議無効確認の訴え（830条2項）、決議不存在確認の訴え（830条1項）の3つについて、対象となる瑕疵を対比して述べよ。", "a": "決議取消しの訴え（831条1項）は、招集の手続・決議の方法の法令・定款違反、決議の内容の定款違反、特別利害関係者の議決権行使による著しく不当な決議といった瑕疵を対象とし、決議無効確認の訴え（830条2項）は、決議の内容が法令に違反する瑕疵を対象とし、決議不存在確認の訴え（830条1項）は、決議が存在しないこと、すなわち決議の事実がない場合及び著しい手続的瑕疵ゆえに決議不存在と法律上評価される場合を対象とする。", "reason": "決議の瑕疵は、その性質（手続・方法の違反か、内容の法令違反か、決議の不存在か）に応じて、831条1項の取消しの訴えと830条の確認の訴え（1項・2項）に分かれる構造である。取消しの訴えには決議の日から3箇月という提訴期間の制限がある。", "basis": "PDF p.15（本編 p.12）。台帳要素 t101-e01（831条1項本文：株主等は決議の日から3箇月以内に訴えをもって決議の取消しを請求できる）。会社法831条1項本文（レジュメ引用。途中「…………」の省略は原文ママ） ／ PDF p.19（本編 p.16）。台帳要素 t107-e01（無効原因（無効事由）は「決議の内容が法令に違反すること」）。会社法830条2項。PDF p.19（本編 p.16） ／ PDF p.20（本編 p.17）。台帳要素 t108-e01（不存在原因は「決議が存在しないこと」であり、①実際決議の事実がない場合と、②著しい手続的瑕疵ゆえに決議不存在と法律上評価される場合の2つがある）。会社法830条1項。PDF p.20（本編 p.17） の逐語引用に基づく。", "caution": "", "articles": ["831条1項", "830条2項", "830条1項"], "page": 15, "loc": "（1）株主総会決議の瑕疵を争う訴え／株主総会決議取消しの訴え（831条1項）の要件と取消事由"}, {"id": "book-kigyoho-01-ch02-q5054", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株主総会を招集するには、取締役は、株主総会の日の二週間（公開会社でない株式会社にあっては、一週間（当該株式会社が取締役会設置会社以外の株式会社である場合において、これを下回る期間を定款で定めた場合にあっては、その期間））前までに、株主に対してその通知を発しなければならない。」", "a": "会社法299条1項。", "reason": "株主総会の招集通知の発送時期を定める規定は299条1項である。", "basis": "PDF p.29（本編 p.26）。台帳要素 t113-e01（299条1項（原則）：株主総会を招集するには、取締役は株主総会の日の二週間（公開会社でない会社では一週間、取締役会非設置会社で定款で下回る期間を定めた場合はその期間）前までに株主に対して通知を発しなければならない）。会社法299条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["299条1項"], "page": 29, "loc": "（3）株主総会の招集通知（299条）／株主総会の招集通知（299条）と招集手続の省略・全員出席総会"}, {"id": "book-kigyoho-01-ch02-q5055", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株主は、株主総会において、その有する株式一株につき一個の議決権を有する。」", "a": "会社法308条1項。", "reason": "一株一議決権の原則を定める規定は308条1項である。", "basis": "PDF p.32（本編 p.29）。台帳要素 t115-e01（一株一議決権の原則：株主は株主総会において、その有する株式一株につき一個の議決権を有する（308条1項））。会社法308条1項。PDF p.32（本編 p.29） の逐語引用に基づく。", "caution": "", "articles": ["308条1項"], "page": 32, "loc": "（5）決議／議決権と一株一議決権の原則（308条）"}, {"id": "book-kigyoho-01-ch02-q5056", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「取締役会設置会社においては、株主総会は、株主総会の目的である事項（議題）以外の事項については決議することができない。」", "a": "会社法309条5項。", "reason": "取締役会設置会社の株主総会における議題外決議の禁止を定める規定は309条5項である。", "basis": "PDF p.46（本編 p.43）。台帳要素 t127-e03（309条5項：取締役会設置会社においては株主総会は、株主総会の目的たる事項（議題）以外の事項については議決できない）。会社法309条5項。PDF p.46（本編 p.43）。t102-e03・t114-e04と関連 の逐語引用に基づく。", "caution": "", "articles": ["309条5項"], "page": 46, "loc": "（5）決議／株主総会の決議の成立要件（309条）"}, {"id": "book-kigyoho-01-ch02-q5057", "ch": 2, "type": "何条", "q": "種類株主に損害を及ぼすおそれがあるときでも、種類株主総会の決議を不要とする旨の定款規定を定めることができ、ただし、その定款を定めるためには当該種類株主全員の同意が必要である、という定めは、会社法何条のものか。", "a": "会社法322条2項・4項", "reason": "種類株主総会の決議を原則として必要とするのは322条1項各号であり、その例外として決議を不要とする定款規定を認めるのが322条2項、その定款設定に種類株主全員の同意を要求するのが同条4項である。", "basis": "PDF p.47（本編 p.44）。台帳要素 t128-e02（例外とその要件：種類株主に損害を及ぼすおそれがあるときでも種類株主総会決議を不要とする旨の定款規定を定めることができる（322条2項）が、その定款を定めるためには当該種類株主全員の同意が必要である（322条4項））。会社法322条2項・4項。PDF p.47（本編 p.44）＜注＞ の逐語引用に基づく。", "caution": "", "articles": ["322条2項"], "page": 47, "loc": "（6）種類株主総会／種類株主総会（322条・324条2項）"}, {"id": "book-kigyoho-01-ch02-q5058", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株主総会等の招集の手続又は決議の方法が法令又は定款に違反するときであっても、裁判所は、その違反する事実が重大でなく、かつ、決議に影響を及ぼさないものであると認めるときは、決議の取消しの請求を棄却することができる。」", "a": "会社法831条2項（裁量棄却）。", "reason": "決議取消しの訴えにおける裁判所の裁量棄却を定める規定は831条2項である。", "basis": "PDF p.25（本編 p.22）。台帳要素 t111-e01（831条2項：招集手続又は決議方法が法令・定款に違反するときでも、違反する事実が重大でなく、かつ、決議に影響を及ぼさないものと認めるときは、裁判所は取消しの請求を棄却できる）。会社法831条2項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["831条2項"], "page": 25, "loc": "（1）株主総会決議の瑕疵を争う訴え／裁量棄却（831条2項）"}, {"id": "book-kigyoho-01-ch02-q5059", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株式会社が特定の株主に対して無償で財産上の利益の供与をしたときは、当該株式会社は、株主の権利の行使に関し、財産上の利益の供与をしたものと推定する。」", "a": "会社法120条2項。", "reason": "利益供与に関する推定規定は120条2項である。有償で利益を供与した場合で会社・子会社の受けた利益が著しく少ないときも同様である。", "basis": "PDF p.39（本編 p.36）。台帳要素 t122-e02（120条2項の推定：特定の株主に対して無償で財産上の利益の供与をしたときは「株主の権利の行使に関し」供与したものと推定する。有償でも会社・子会社の受けた利益が著しく少ないときも同様）。会社法120条2項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["120条2項"], "page": 39, "loc": "（5）決議／利益供与の禁止の趣旨と120条2項の推定"}, {"id": "book-kigyoho-01-ch02-q5060", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株主総会の決議により解任された者は、その解任について正当な理由がある場合を除き、株式会社に対し、解任によって生じた損害の賠償を請求することができる。」", "a": "会社法339条2項。", "reason": "解任された役員等の損害賠償請求を定める規定は339条2項である（解任自体を定めるのは同条1項）。", "basis": "PDF p.49（本編 p.46）。台帳要素 t203-e03（339条2項：解任された者は、正当な理由がある場合を除き、会社に対し、解任によって生じた損害の賠償を請求できる）。会社法339条2項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["339条2項"], "page": 49, "loc": "3 取締役会設置会社／取締役の解任（339条）と解任を争う方法"}, {"id": "book-kigyoho-01-ch02-q5061", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株式会社は、代表取締役以外の取締役に社長、副社長その他株式会社を代表する権限を有するものと認められる名称を付した場合には、当該取締役がした行為について、善意の第三者に対してその責任を負う。」", "a": "会社法354条（表見代表取締役）。", "reason": "表見代表取締役の規定は354条である。指名委員会等設置会社の表見代表執行役については、同じ内容の421条がある。", "basis": "PDF p.72（本編 p.69）。台帳要素 t227-e02（354条：株式会社は、①代表取締役以外の取締役に社長、副社長その他株式会社を代表する権限を有するものと認められる名称を②付した場合には、当該取締役がした行為について、③善意の第三者に対してその責任を負う）。会社法354条（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["354条"], "page": 72, "loc": "4 代表取締役／（論点）表見代表取締役（354条）の要件"}, {"id": "book-kigyoho-01-ch02-q5062", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「六箇月前から引き続き株式を有する株主は、取締役が株式会社の目的の範囲外の行為その他法令若しくは定款に違反する行為をし、又はこれらの行為をするおそれがある場合において、当該行為によって株式会社に著しい損害が生ずるおそれがあるときは、当該取締役に対し、当該行為をやめることを請求することができる。」", "a": "会社法360条1項。", "reason": "株主による取締役の行為の差止請求を定める規定は360条1項である。", "basis": "PDF p.153（本編 p.150）。台帳要素 t428-e02（360条1項：6箇月前から引き続き株式を有する株主は、取締役が株式会社の目的の範囲外の行為その他法令若しくは定款に違反する行為をし、又はこれらの行為をするおそれがある場合において、当該行為によって株式会社に著しい損害が生ずるおそれがあるときは、当該取締役に対し当該行為をやめることを請求することができる）。会社法360条1項（レジュメ引用） の逐語引用に基づく。", "caution": "360条2項（非公開会社では6箇月要件の読替え）、同条3項（監査機関設置会社では「回復することができない損害」への読替え）がある。", "articles": ["360条1項"], "page": 153, "loc": "15 取締役等の行為の差止請求等／取締役・執行役の行為の差止請求"}, {"id": "book-kigyoho-01-ch02-q5063", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「監査役会設置会社（公開会社であり、かつ、大会社であるものに限る）であって、有価証券報告書を提出しなければならないもの及び監査等委員会設置会社の取締役会は、取締役の個人別の報酬等の内容についての決定に関する方針として法務省令で定める事項を決定しなければならない。」", "a": "会社法361条7項。", "reason": "個人別の報酬等の内容についての決定方針の決定を義務づける規定は361条7項である（方針の内容は会社法施行規則98条の5）。", "basis": "PDF p.115（本編 p.112）。台帳要素 t360-e01（361条7項：次に掲げる株式会社の取締役会は、取締役（監査等委員である取締役を除く。）の報酬等の内容として定款又は株主総会の決議による第1項各号の事項についての定めがある場合には、当該定めに基づく取締役の個人別の報酬等の内容についての決定に関する方針として法務省令で定める事項を決定しなければならない（ただし書あり）。一 監査役会設置会社（公開会社であり、かつ、大会社であるものに限る。）であって、有価証券報告書を提出しなければならないもの、二 監査等委員会設置会社）。会社法361条7項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["361条7項"], "page": 115, "loc": "10 役員等の義務（5）取締役の報酬等の決定／個人別の報酬等の内容についての決定方針（361条7項）"}, {"id": "book-kigyoho-01-ch02-q5064", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「取締役会を招集する者は、取締役会の日の一週間（これを下回る期間を定款で定めた場合にあっては、その期間）前までに、各取締役（監査役設置会社にあっては、各取締役及び各監査役）に対してその通知を発しなければならない。」", "a": "会社法368条1項。", "reason": "取締役会の招集通知を定める規定は368条1項である。株主総会の招集通知（299条1項）と対比して覚える。", "basis": "PDF p.55（本編 p.52）。台帳要素 t210-e01（368条1項：取締役会を招集する者は、取締役会の日の一週間（定款で下回る期間を定めた場合はその期間）前までに、各取締役（監査役設置会社にあっては各取締役及び各監査役）に対して通知を発しなければならない）。会社法368条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["368条1項"], "page": 55, "loc": "3 取締役会設置会社／取締役会の招集手続（368条）"}, {"id": "book-kigyoho-01-ch02-q5065", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「前項の決議について特別の利害関係を有する取締役は、議決に加わることができない。」", "a": "会社法369条2項", "reason": "特別利害関係取締役の議決排除を定める規定は369条2項である。株主総会における特別利害関係株主の扱い（831条1項3号）とは仕組みが異なる。", "basis": "PDF p.58（本編 p.55）。台帳要素 t214-e01（369条2項：前項の決議について特別の利害関係を有する取締役は、議決に加わることができない）。会社法369条2項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["369条2項"], "page": 58, "loc": "3 取締役会設置会社／特別利害関係取締役（369条2項）の意義・効果と具体例"}, {"id": "book-kigyoho-01-ch02-q5066", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「取締役会設置会社（委員会設置会社を除く）が、取締役の数が六人以上であり、かつ、取締役のうち一人以上が社外取締役である場合には、取締役会は、第三百六十二条第四項第一号及び第二号に掲げる事項についての決議については、あらかじめ選定した三人以上の取締役（特別取締役）によって行うことができる旨を定めることができる。」", "a": "会社法373条1項。", "reason": "特別取締役による取締役会決議の方法を定める規定は373条1項である。", "basis": "PDF p.65（本編 p.62）。台帳要素 t220-e03（373条1項：取締役会設置会社（委員会設置会社を除く。）が要件のいずれにも該当する場合には、取締役会は、362条4項1号及び2号に掲げる事項についての取締役会の決議については、あらかじめ選定した三人以上の取締役（特別取締役）のうち、議決に加わることができるものの過半数が出席し、その過半数をもって行うことができる旨を定めることができる）。会社法373条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["373条1項"], "page": 65, "loc": "3 取締役会設置会社／取締役会決議に関するその他の制度（369条5項・370条・373条）"}, {"id": "book-kigyoho-01-ch02-q5067", "ch": 2, "type": "何条", "q": "監査役は、①取締役が法令・定款に違反する行為をするおそれがあり、②その行為によって会社に著しい損害が生じるおそれがあるときは、当該取締役に対しその行為をやめることを請求することができる。この監査役による取締役の行為の差止めは、会社法何条の定めか。", "a": "会社法385条。", "reason": "監査役による取締役の行為の差止めは385条である。株主による差止め（360条）、監査委員による差止め（407条）と主体を区別する。", "basis": "PDF p.82（本編 p.79）。台帳要素 t239-e04（監査役による取締役の行為の差止め（385条）の要件：①取締役の法令・定款違反のおそれある行為があること、②当該行為によって会社に著しい損害が生じるおそれがあること）。PDF p.82（本編 p.79） の逐語引用に基づく。", "caution": "", "articles": ["385条"], "page": 82, "loc": "5 監査役（会）／監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"}, {"id": "book-kigyoho-01-ch02-q5068", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「公開会社でない株式会社（監査役会設置会社及び会計監査人設置会社を除く）は、第三百八十一条第一項の規定にかかわらず、その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができる。」", "a": "会社法389条1項。", "reason": "定款による監査範囲の限定を定める規定は389条1項であり、このような監査役は会計監査限定監査役（会計限定監査役）と呼ばれる。", "basis": "PDF p.83（本編 p.80）。台帳要素 t240-e01（389条1項：公開会社でない株式会社（監査役会設置会社及び会計監査人設置会社を除く。）は、381条1項の規定にかかわらず、その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができる）。会社法389条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["389条1項"], "page": 83, "loc": "5 監査役（会）／定款の定めによる監査範囲の限定（389条）"}, {"id": "book-kigyoho-01-ch02-q5069", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「取締役は、会計監査人又は一時会計監査人の職務を行うべき者の報酬等を定める場合には、監査役（監査役が二人以上ある場合にあっては、その過半数）の同意を得なければならない。」", "a": "会社法399条1項。", "reason": "会計監査人の報酬等の決定に監査役の同意を要求する規定は399条1項である。", "basis": "PDF p.86（本編 p.83）。台帳要素 t312-e01（399条1項：取締役は、会計監査人又は一時会計監査人の職務を行うべき者の報酬等を定める場合には、監査役（監査役が二人以上ある場合にあっては、その過半数）の同意を得なければならない）。会社法399条1項（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["399条1項"], "page": 86, "loc": "7 会計監査人／会計監査人の報酬等の決定（399条）"}, {"id": "book-kigyoho-01-ch02-q5070", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「取締役等が会社の承認なくして競業取引をした場合、当該取引によって取締役等又は第三者が得た利益の額は、会社に生じた損害の額と推定する。」", "a": "会社法423条2項。", "reason": "競業取引についての損害額の推定規定は423条2項である。利益相反取引についての任務懈怠の推定は同条3項であり、区別する。", "basis": "PDF p.96（本編 p.93）。台帳要素 t337-e02（会社の承認なくして競業取引をした場合、取締役等が得た利益は会社の損害額と推定される（423条2項）。本問ではAが得た800万円が会社の損害額と推定される）。会社法423条2項。PDF p.96（本編 p.93） の逐語引用に基づく。", "caution": "", "articles": ["423条2項"], "page": 96, "loc": "10 役員等の義務（3）競業取引／競業違反と取締役の任務懈怠責任（423条1項・2項）"}, {"id": "book-kigyoho-01-ch02-q5071", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「前条第一項の責任（423条1項の任務懈怠責任）は、総株主の同意がなければ、免除することができない。」", "a": "会社法424条。", "reason": "任務懈怠責任の全部免除を定める規定は424条である。一部免除の方法は425条〜427条に定められる。", "basis": "PDF p.123（本編 p.120）。台帳要素 t404-e01（424条：423条1項の責任は、総株主の同意がなければ免除することができない（全部免除））。会社法424条（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["423条1項", "424条"], "page": 123, "loc": "11 役員等の会社に対する責任（任務懈怠責任、423条）―要件・任務懈怠・免除等／任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"}, {"id": "book-kigyoho-01-ch02-q5072", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株式交換等の効力が生じた日の六箇月前から当該日まで引き続き株式会社の株主であった者（旧株主）は、当該株式会社の株主でなくなった場合であっても、一定の場合に、株式交換等完全子会社に対し、責任追及等の訴えの提起を請求することができる。」", "a": "会社法847条の2第1項。", "reason": "旧株主による責任追及等の訴えの提起請求を定める規定は847条の2第1項である。株主代表訴訟の原則は847条、多重代表訴訟等は847条の3である。", "basis": "PDF p.137（本編 p.134）。台帳要素 t413-e03（847条の2第1項：行為の効力が生じた日の6ヶ月前から当該日まで引き続き株主であった者（旧株主）は、株主でなくなった場合であっても、各号に定めるときは、株式交換等完全子会社に対し、責任追及等の訴え（効力が生じた時までに原因事実が生じた責任・義務に係るものに限る）の提起を請求できる。ただし図利加害目的の場合はこの限りでない）。会社法847条の2第1項本文（レジュメ引用。①〜④はレジュメが付した番号） の逐語引用に基づく。", "caution": "", "articles": ["847条の2第1項"], "page": 137, "loc": "12 株主による責任追及等の訴え等／旧株主による責任追及等の訴え（847条の2）"}, {"id": "book-kigyoho-01-ch02-q5073", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「この法律の規定により登記すべき事項は、登記の後でなければ、これをもって善意の第三者に対抗することができない。登記の後であっても、第三者が正当な事由によってその登記があることを知らなかったときは、同様とする。」", "a": "会社法908条1項。", "reason": "登記すべき事項の対抗力を定める規定は908条1項である。「登記」と見たら908条、911条3項を考える。", "basis": "PDF p.75（本編 p.72）。台帳要素 t230-e04（908条1項：この法律の規定により登記すべき事項は、登記の後でなければ、これをもって善意の第三者に対抗することができない。登記の後であっても、第三者が正当な事由によってその登記があることを知らなかったときは、同様とする）。会社法908条1項（レジュメ（参）引用） の逐語引用に基づく。", "caution": "", "articles": ["908条1項"], "page": 75, "loc": "4 代表取締役／登記に関する原則（908条1項）と悪意擬制"}, {"id": "book-kigyoho-01-ch02-q5074", "ch": 2, "type": "何条", "q": "次の定義は、会社法何条のものか。「監査役を置く株式会社（その監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがあるものを除く）又はこの法律の規定により監査役を置かなければならない株式会社をいう。」", "a": "会社法2条9号（監査役設置会社の定義）。", "reason": "監査役設置会社の定義規定は2条9号である。社外監査役の定義は2条16号である。", "basis": "PDF p.83（本編 p.80）。台帳要素 t241-e01（2条9号（監査役設置会社）：監査役を置く株式会社（その監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがあるものを除く。）又はこの法律の規定により監査役を置かなければならない株式会社をいう）。会社法2条9号（レジュメ引用） の逐語引用に基づく。", "caution": "", "articles": ["2条"], "page": 83, "loc": "5 監査役（会）／監査役設置会社の定義（2条9号）と監査役会（390条〜）"}, {"id": "book-kigyoho-01-ch02-q5075", "ch": 2, "type": "何条", "q": "役員等がその職務を行うについて悪意又は重大な過失があったときは、これによって第三者に生じた損害を賠償する責任を負う、という役員等の第三者に対する責任の定めは、会社法何条のものか。", "a": "会社法429条", "reason": "役員等の第三者に対する責任は429条に定められる（2項は虚偽記載等に関する特則）。会社に対する責任（423条1項）と区別する。", "basis": "PDF p.158（本編 p.155）。台帳要素 t434-e05（暗記対象条文：役員等の第三者に対する責任 ― 429条）。Ⅱ重要条文リスト（PDF p.158（本編 p.155）） の逐語引用に基づく。", "caution": "", "articles": ["429条"], "page": 158, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：責任追及・補償・差止め等関係"}, {"id": "book-kigyoho-01-ch02-q5076", "ch": 2, "type": "何条", "q": "公開会社である監査役会設置会社について、社外取締役の設置を強制する定めは、会社法何条のものか。", "a": "会社法327条の2。", "reason": "公開会社である監査役会設置会社の社外取締役の設置強制は327条の2に定められる（Ⅱ重要条文リスト掲載）。", "basis": "PDF p.155（本編 p.152）。台帳要素 t431-e05（暗記対象条文：公開会社である監査役会設置会社の社外取締役の設置強制 ― 327条の2）。Ⅱ重要条文リスト（PDF p.155（本編 p.152）） の逐語引用に基づく。", "caution": "", "articles": ["327条の2"], "page": 155, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：機関設計・株主総会関係"}, {"id": "book-kigyoho-01-ch02-q5077", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「株主等は、株主総会等の決議の日から三箇月以内に、訴えをもって当該決議の取消しを請求することができる。」", "a": "会社法831条1項。", "reason": "決議の日から3箇月以内に訴えをもって取消しを請求できるという定めは、831条1項本文である。", "basis": "PDF p.15（本編 p.12）。台帳要素 t101-e01（831条1項本文：株主等は決議の日から3箇月以内に訴えをもって決議の取消しを請求できる） の逐語引用に基づく。", "caution": "", "articles": ["831条1項"], "page": 15, "loc": "（1）株主総会決議の瑕疵を争う訴え／株主総会決議取消しの訴え（831条1項）の要件と取消事由"}, {"id": "book-kigyoho-01-ch02-q5078", "ch": 2, "type": "何条", "q": "株主総会の決議の内容が法令に違反することを理由として、決議の無効の確認を求める訴え（株主総会決議無効確認の訴え）を定める規定は、会社法何条何項か。", "a": "会社法830条2項。", "reason": "無効原因は「決議の内容が法令に違反すること」であり、これを理由とする無効確認の訴えは830条2項が定める。", "basis": "PDF p.19（本編 p.16）。台帳要素 t107-e01（無効原因（無効事由）は「決議の内容が法令に違反すること」） の逐語引用に基づく。", "caution": "", "articles": ["830条2項"], "page": 19, "loc": "（1）株主総会決議の瑕疵を争う訴え／株主総会決議無効確認の訴え（830条2項）"}, {"id": "book-kigyoho-01-ch02-q5079", "ch": 2, "type": "何条", "q": "株主総会の決議が存在しないことの確認を求める訴え（株主総会決議不存在確認の訴え）を定める規定は、会社法何条何項か。", "a": "会社法830条1項。", "reason": "不存在原因は「決議が存在しないこと」であり、これを理由とする不存在確認の訴えは830条1項が定める（830条2項の無効確認の訴えと項で分かれている）。", "basis": "PDF p.20（本編 p.17）。台帳要素 t108-e01（不存在原因は「決議が存在しないこと」） の逐語引用に基づく。", "caution": "", "articles": ["830条1項"], "page": 20, "loc": "（1）株主総会決議の瑕疵を争う訴え／株主総会決議不存在確認の訴え（830条1項）"}, {"id": "book-kigyoho-01-ch02-q5080", "ch": 2, "type": "何条", "q": "株主総会決議取消しの訴えの認容（勝訴）確定判決が、訴えを提起していない株主との関係でも効力を有する（対世効）とする根拠規定は、会社法何条か。", "a": "会社法838条。", "reason": "認容確定判決の対世効は838条に基づく。これに対し、棄却（敗訴）確定判決には対世効はなく、他の株主はあらためて訴えを提起できる。", "basis": "PDF p.18（本編 p.15）。台帳要素 t105-e01（対世効（838条）：認容（勝訴）確定判決は対世効により、Bとの関係でも決議取消しとなる） の逐語引用に基づく。", "caution": "", "articles": ["838条"], "page": 18, "loc": "（1）株主総会決議の瑕疵を争う訴え／株主総会決議取消しの訴えの判決の効力（対世効・遡及効）"}, {"id": "book-kigyoho-01-ch02-q5081", "ch": 2, "type": "何条", "q": "株主全員が同意した場合は、招集手続を経ることなく株主総会を開催することができるという、招集手続の省略を定める規定は、会社法何条か。", "a": "会社法300条。", "reason": "300条は「前条の規定にかかわらず」と定め、株主全員の同意がある場合に299条の招集手続の省略を認める規定である。", "basis": "PDF p.22（本編 p.19）。台帳要素 t109-e03（300条との相違2：300条本文は「前条の規定にかかわらず」と規定し、省略できるのは299条の手続） の逐語引用に基づく。", "caution": "", "articles": ["300条"], "page": 22, "loc": "（1）株主総会決議の瑕疵を争う訴え／全員出席総会（招集手続を欠く総会の効力）"}, {"id": "book-kigyoho-01-ch02-q5082", "ch": 2, "type": "何条", "q": "取締役会設置会社において、株主総会は、法律及び定款で定めた事項に限り決議をすることができるとする規定は、会社法何条何項か。", "a": "会社法295条2項。", "reason": "295条2項は、取締役会設置会社の株主総会の権限を、法律及び定款で定めた事項に限定する規定である（取締役会非設置会社の295条1項と対になる）。", "basis": "PDF p.28（本編 p.25）。台帳要素 t112-e01（295条2項：取締役会設置会社において株主総会は、法律及び定款で定めた事項に限り決議できる） の逐語引用に基づく。", "caution": "", "articles": ["295条2項"], "page": 28, "loc": "（2）株主総会の権限（295条）／（論点）取締役会設置会社である非公開会社における、株主総会決議により代表取締役を選定する旨の定款の効力"}, {"id": "book-kigyoho-01-ch02-q5083", "ch": 2, "type": "何条", "q": "株主が代理人によってその議決権を行使することができるとする、議決権の代理行使の規定は、会社法何条か。", "a": "会社法310条。", "reason": "議決権行使の原則①（株主が自ら出席すること）の例外である代理行使は、310条が定める。", "basis": "PDF p.33（本編 p.30）。台帳要素 t116-e02（例外：①の例外は議決権の代理行使（310条）） の逐語引用に基づく。", "caution": "", "articles": ["310条"], "page": 33, "loc": "（5）決議／議決権の行使方法の原則と例外"}, {"id": "book-kigyoho-01-ch02-q5084", "ch": 2, "type": "何条", "q": "株主総会に出席しない株主が書面によって議決権を行使する書面投票と、電磁的方法によって議決権を行使する電子投票とは、それぞれ会社法何条に定められているか。", "a": "書面投票は311条、電子投票は312条。", "reason": "議決権行使の原則①の例外のうち、書面によるものを311条、電磁的方法によるものを312条が定める（いずれも298条1項3号・4号で定めることを前提とする）。", "basis": "PDF p.33（本編 p.30）。台帳要素 t116-e02（例外：①の例外は…書面投票・電子投票（298条1項3号4号、311条、312条）） の逐語引用に基づく。", "caution": "", "articles": ["311条", "312条"], "page": 33, "loc": "（5）決議／議決権の行使方法の原則と例外"}, {"id": "book-kigyoho-01-ch02-q5085", "ch": 2, "type": "何条", "q": "株主がその有する議決権を統一しないで行使する議決権の不統一行使について定め、「他人のために株式を有する者」については会社がこれを拒むことができないとする規定は、会社法何条何項か。", "a": "会社法313条3項（不統一行使自体は313条）。", "reason": "不統一行使は313条の定めであり、その3項は、他人のために株式を有する者の不統一行使を会社が拒むことができないとする。", "basis": "PDF p.37（本編 p.34）。台帳要素 t119-e01（会社が株主の議決権不統一行使を拒むことができないのは「他人のために株式を有する者」（313条3項）） の逐語引用に基づく。", "caution": "レジュメ原文の表記「議決権不行使」は「議決権不統一行使」の誤植と思われる（台帳note参照）。", "articles": ["313条3項"], "page": 37, "loc": "（5）決議／議決権の不統一行使（313条）"}, {"id": "book-kigyoho-01-ch02-q5086", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「株式会社は、何人に対しても、株主の権利の行使に関し、財産上の利益の供与（当該株式会社又はその子会社の計算においてするものに限る。）をしてはならない。」", "a": "会社法120条1項（利益供与の禁止）。", "reason": "株主の権利の行使に関する財産上の利益の供与の禁止は、120条1項が定める。", "basis": "PDF p.38（本編 p.35）。台帳要素 t121-e01（120条1項：株式会社は、①何人に対しても、②株主の権利等の行使に関し、③財産上の利益の供与をしてはならない） の逐語引用に基づく。", "caution": "", "articles": ["120条1項"], "page": 38, "loc": "（5）決議／利益供与の禁止（120条1項）の要件とあてはめ"}, {"id": "book-kigyoho-01-ch02-q5087", "ch": 2, "type": "何条", "q": "利益供与の禁止に違反して財産上の利益の供与を受けた者が、その利益を当該株式会社又はその子会社に返還しなければならないとする規定は、会社法何条何項か。", "a": "会社法120条3項。", "reason": "120条3項は、1項違反の利益供与を受けた者の返還義務を定める（引換え給付をしたものがあるときはその返還を受けることができる）。", "basis": "PDF p.42（本編 p.39）。台帳要素 t125-e01（120条3項：1項の規定に違反して財産上の利益の供与をしたときは、利益の供与を受けた者はこれを当該株式会社又はその子会社に返還しなければならない） の逐語引用に基づく。", "caution": "", "articles": ["120条3項"], "page": 42, "loc": "（5）決議／利益供与の返還請求の設例（問題1・問題2）"}, {"id": "book-kigyoho-01-ch02-q5088", "ch": 2, "type": "何条", "q": "利益供与をした取締役（執行役）等が、当該株式会社に対して、供与した利益に相当する額の金銭の支払義務を負うとする、関与取締役等の支払義務の規定は、会社法何条何項か。", "a": "会社法120条4項。", "reason": "120条4項は、利益供与を「した」取締役（執行役）の無過失責任と、利益供与に「関与した」取締役（執行役）の過失責任を定める。", "basis": "PDF p.40（本編 p.37）。台帳要素 t123-e01（120条4項の責任の区別：利益供与を「した」取締役（執行役）は無過失責任、「関与した」取締役（執行役）は過失責任） の逐語引用に基づく。", "caution": "", "articles": ["120条4項"], "page": 40, "loc": "（5）決議／関与取締役等の支払義務（120条4項）と会社法施行規則21条"}, {"id": "book-kigyoho-01-ch02-q5089", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「取締役、会計参与、監査役及び執行役は、株主総会において、株主から特定の事項について説明を求められた場合には、当該事項について必要な説明をしなければならない。」", "a": "会社法314条（取締役等の説明義務）。", "reason": "株主総会における取締役等の説明義務は314条が定める本文の定めである。", "basis": "PDF p.44（本編 p.41）。台帳要素 t126-e01（314条：取締役、会計参与、監査役及び執行役は、株主総会において株主から特定の事項について説明を求められた場合には、当該事項について必要な説明をしなければならない） の逐語引用に基づく。", "caution": "", "articles": ["314条"], "page": 44, "loc": "（5）決議／取締役等の説明義務（314条）と株主の質問権"}, {"id": "book-kigyoho-01-ch02-q5090", "ch": 2, "type": "何条", "q": "種類株主に損害を及ぼすおそれがある場合に必要となる種類株主総会の決議が、特別決議によることを定める規定は、会社法何条何項か。", "a": "会社法324条2項。", "reason": "レジュメは、種類株主に損害を及ぼすおそれがあれば322条・324条2項の種類株主総会の特別決議が必要と整理しており、決議の方法（特別決議）に対応するのが324条2項である。", "basis": "PDF p.47（本編 p.44）。台帳要素 t128-e01（種類株主に損害を及ぼすおそれがあれば、322条・324条2項の種類株主総会の特別決議が必要） の逐語引用に基づく。", "caution": "", "articles": ["324条2項", "322条"], "page": 47, "loc": "（6）種類株主総会／種類株主総会（322条・324条2項）"}, {"id": "book-kigyoho-01-ch02-q5091", "ch": 2, "type": "条文構造", "q": "会社法831条1項は、どのような構造で株主総会決議取消しの訴えを定めているか。本文と各号の役割を述べよ。", "a": "本文は、取消しを請求できる者（株主等）と、期間・方法（株主総会等の決議の日から三箇月以内に、訴えをもって）を定める。各号は取消事由を列挙する部分であり、1号は株主総会等の招集の手続又は決議の方法が法令若しくは定款に違反し、又は著しく不公正なとき、2号は株主総会等の決議の内容が定款に違反するとき、3号は株主総会等の決議について特別の利害関係を有する者が議決権を行使したことによって、著しく不当な決議がされたときである。", "reason": "831条1項は「本文＝主体・期間・方法」「各号＝取消事由の列挙」という構造であり、答案でも、本文から要件①（株主等による3ヶ月以内の訴え）を、各号から要件②（取消事由）を分解して取り出す。", "basis": "PDF p.15（本編 p.12）。主対象は台帳要素 t101-e02（取消しの訴えの要件は、①株主等による決議の日から3ヶ月以内の訴えであること、②取消事由（831条1項各号）があること）。引用は t101-e01（831条1項本文）／t101-e03（取消事由1号）／t101-e04（取消事由2号）／t101-e05（取消事由3号） の逐語引用に基づく。", "caution": "", "articles": ["831条1項", "831条1項1号", "831条1項2号", "831条1項3号"], "page": 15, "loc": "（1）株主総会決議の瑕疵を争う訴え／株主総会決議取消しの訴え（831条1項）の要件と取消事由"}, {"id": "book-kigyoho-01-ch02-q5092", "ch": 2, "type": "条文構造", "q": "会社法299条1項の招集通知の期間は、どのような構造で定められているか。本文と括弧書きの関係を述べよ。", "a": "本文は、取締役は株主総会の日の二週間前までに株主に対して通知を発しなければならないとする原則を定める。括弧書きはその例外を定める部分であり、公開会社でない株式会社にあっては一週間とする。さらに、その括弧書きの内側に、当該株式会社が取締役会設置会社以外の株式会社である場合において、これを下回る期間を定款で定めた場合にあっては、その期間によるとする二重の括弧書きが置かれている。", "reason": "299条1項は「本文＝原則2週間」「括弧書き＝非公開会社1週間」「内側の括弧書き＝取締役会非設置会社の定款による短縮」という入れ子構造であり、会社の形態に応じて期間が読み替わる。", "basis": "PDF p.29（本編 p.26）。台帳要素 t113-e01（299条1項（原則）：二週間（公開会社でない会社では一週間、取締役会非設置会社で定款で下回る期間を定めた場合はその期間）前までに通知） の逐語引用に基づく。", "caution": "", "articles": ["299条1項"], "page": 29, "loc": "（3）株主総会の招集通知（299条）／株主総会の招集通知（299条）と招集手続の省略・全員出席総会"}, {"id": "book-kigyoho-01-ch02-q5093", "ch": 2, "type": "条文構造", "q": "会社法314条は、どのような構造で取締役等の説明義務を定めているか。本文とただし書の役割を述べよ。", "a": "本文は、取締役、会計参与、監査役及び執行役は、株主総会において、株主から特定の事項について説明を求められた場合には、当該事項について必要な説明をしなければならないとする原則を定める。ただし書はその例外を定める部分であり、当該事項が株主総会の目的である事項に関しないものである場合、その説明をすることにより株主の共同の利益を著しく害する場合、その他正当な理由がある場合として法務省令で定める場合は、説明を要しないとする構造である。", "reason": "314条は「本文＝説明義務の原則」「ただし書＝説明を要しない場合の列挙」という原則・例外の構造であり、答案でも、要件としてただし書き列挙事由にあたらないことを確認する。", "basis": "PDF p.44（本編 p.41）。台帳要素 t126-e01（314条：必要な説明をしなければならない（ただし、総会の目的事項に関しない場合、株主の共同の利益を著しく害する場合その他法務省令で定める正当な理由がある場合を除く）） の逐語引用に基づく。", "caution": "", "articles": ["314条"], "page": 44, "loc": "（5）決議／取締役等の説明義務（314条）と株主の質問権"}, {"id": "book-kigyoho-01-ch02-q5094", "ch": 2, "type": "条文構造", "q": "会社法308条は、一株一議決権の原則に対する例外を、条文のどの部分に配置して定めているか。308条の内部に置かれた例外と、別条文に置かれた例外とを区別して述べよ。", "a": "308条の内部では、1項本文のかっこ書に相互保有株式、1項ただし書に単元未満株式、2項に自己株式が置かれている。これに対し、議決権制限株式（108条1項3号）、基準日後に取得した株式（124条1項・4項）、自己株式の売主（140条3項等）のように、別条文に例外が置かれているものもある。", "reason": "一株一議決権の原則（308条1項本文）の例外は、同一条文内のかっこ書・ただし書・次項に分散配置されるものと、株式の種類や取得時期を規律する別条文に置かれるものとに分かれる。", "basis": "PDF p.32（本編 p.29）。台帳要素 t115-e03（議決権が認められない場合（一株一議決権原則の例外）：①議決権制限株式（108条1項3号）、②自己株式（308条2項）、③相互保有株式（308条1項本文かっこ書）、④単元未満株式（189条1項、308条1項ただし書）ほか） の逐語引用に基づく。", "caution": "", "articles": ["308条1項", "308条2項"], "page": 32, "loc": "（5）決議／議決権と一株一議決権の原則（308条）"}, {"id": "book-kigyoho-01-ch02-q5095", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「株主総会は、この法律に規定する事項及び株式会社の組織、運営、管理その他株式会社に関する一切の事項について決議をすることができる。」", "a": "会社法295条1項。", "reason": "取締役会非設置会社では、株主総会が会社に関する一切の事項について決議できる機関となることを定めた規定である。", "basis": "PDF p.48（本編 p.45）。台帳要素 t201-e01（295条1項：株主総会は、会社法に規定する事項及び会社の組織・運営・管理その他会社に関する一切の事項について決議できる） の逐語引用に基づく。", "caution": "", "articles": ["295条1項"], "page": 48, "loc": "2 取締役会非設置会社／取締役会非設置会社の機関構造と株主総会の権限（295条・348条・349条）"}, {"id": "book-kigyoho-01-ch02-q5096", "ch": 2, "type": "何条", "q": "取締役の選任は、株主総会の普通決議によるものとされている。この選任の根拠となる条文は、会社法何条か。", "a": "会社法329条1項・341条。", "reason": "選任自体は329条1項が定め、その決議の種類（普通決議）は341条による。", "basis": "PDF p.49（本編 p.46）。台帳要素 t202-e01（取締役の選任は株主総会の普通決議による（329条1項、341条）。309条1項の決議ではない） の逐語引用に基づく。", "caution": "309条1項の決議ではない（レジュメ明記）。", "articles": ["329条1項", "341条"], "page": 49, "loc": "3 取締役会設置会社／取締役の選任（329条1項・341条・342条）"}, {"id": "book-kigyoho-01-ch02-q5097", "ch": 2, "type": "何条", "q": "累積投票による取締役の選任を定める条文は、会社法何条か。", "a": "会社法342条。", "reason": "累積投票による取締役の選任は342条が定める。", "basis": "PDF p.49（本編 p.46）。台帳要素 t202-e02（累積投票による取締役の選任（342条）） の逐語引用に基づく。", "caution": "", "articles": ["342条"], "page": 49, "loc": "3 取締役会設置会社／取締役の選任（329条1項・341条・342条）"}, {"id": "book-kigyoho-01-ch02-q5098", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「役員及び会計監査人は、いつでも、株主総会の決議によって解任することができる。」", "a": "会社法339条1項。", "reason": "役員及び会計監査人をいつでも株主総会の決議によって解任できることを定めるのは339条1項である。", "basis": "PDF p.49（本編 p.46）。台帳要素 t203-e02（339条1項：役員及び会計監査人は、いつでも、株主総会の決議によって解任することができる） の逐語引用に基づく。", "caution": "", "articles": ["339条1項"], "page": 49, "loc": "3 取締役会設置会社／取締役の解任（339条）と解任を争う方法"}, {"id": "book-kigyoho-01-ch02-q5099", "ch": 2, "type": "条文構造", "q": "会社法362条4項は、取締役会が取締役に委任できない事項について、どのような構造で定めているか。本文と各号の役割を述べよ。", "a": "本文は、次に掲げる事項その他の重要な業務執行の決定を取締役に委任することができないという枠組みを定める。各号は委任できない事項を列挙する部分であり、1号は重要な財産の処分及び譲受け、2号は多額の借財、3号は支配人その他の重要な使用人の選任及び解任、4号は支店その他の重要な組織の設置、変更及び廃止である。", "reason": "362条4項は「本文＝委任禁止の枠組み」「各号＝対象事項の列挙」という構造であり、答案でも、本文から委任できないという結論を、各号から個別の対象事項を取り出す。", "basis": "PDF p.51（本編 p.48）。主対象は台帳要素 t206-e02（362条4項本文：取締役会は、次に掲げる事項その他の重要な業務執行の決定を取締役に委任することができない）。引用は t206-e02（362条4項本文：取締役会は、次に掲げる事項その他の重要な業務執行の決定を取締役に委任することができない） ／ t206-e03（362条4項1号：重要な財産の処分及び譲受け） ／ t206-e04（362条4項2号：多額の借財） ／ t206-e05（362条4項3号：支配人その他の重要な使用人の選任及び解任） ／ t206-e06（362条4項4号：支店その他の重要な組織の設置、変更及び廃止（五号以下はレジュメで省略）） の逐語引用に基づく。", "caution": "レジュメでは5号以下は省略されている。", "articles": ["362条4項", "362条4項1号", "362条4項2号", "362条4項3号", "362条4項4号"], "page": 51, "loc": "3 取締役会設置会社／取締役会の権限構造と専決事項（362条4項）"}, {"id": "book-kigyoho-01-ch02-q5100", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「前項の規定にかかわらず、取締役会は、取締役（監査役設置会社にあっては、取締役及び監査役）の全員の同意があるときは、招集の手続を経ることなく開催することができる。」", "a": "会社法368条2項。", "reason": "取締役の全員（監査役設置会社にあっては取締役及び監査役の全員）の同意があるときに、招集の手続を経ることなく取締役会を開催できることを定めるのは368条2項である。", "basis": "PDF p.55（本編 p.52）。台帳要素 t210-e02（368条2項：取締役（監査役設置会社にあっては取締役及び監査役）の全員の同意があるときは、招集の手続を経ることなく開催することができる） の逐語引用に基づく。", "caution": "", "articles": ["368条2項"], "page": 55, "loc": "3 取締役会設置会社／取締役会の招集手続（368条）"}, {"id": "book-kigyoho-01-ch02-q5101", "ch": 2, "type": "何条", "q": "取締役会の議事録に異議をとどめない取締役は、その決議に賛成したものと推定される。この推定を定める条文は、会社法何条何項か。", "a": "会社法369条5項。", "reason": "議事録に異議をとどめない者を決議に賛成したものと推定する規定は369条5項である。", "basis": "PDF p.65（本編 p.62）。台帳要素 t220-e01（取締役会議事録に異議をとどめないものは、決議に賛成したものと推定する（369条5項）） の逐語引用に基づく。", "caution": "", "articles": ["369条5項"], "page": 65, "loc": "3 取締役会設置会社／取締役会決議に関するその他の制度（369条5項・370条・373条）"}, {"id": "book-kigyoho-01-ch02-q5102", "ch": 2, "type": "何条", "q": "取締役会決議の省略を定める条文は、会社法何条か。なお、株主総会決議の省略は319条である。", "a": "会社法370条。", "reason": "取締役会決議の省略は370条が定め、対になる株主総会決議の省略は319条である。", "basis": "PDF p.65（本編 p.62）。台帳要素 t220-e02（取締役会決議の省略（370条）。cf. 株主総会決議の省略（319条）） の逐語引用に基づく。", "caution": "", "articles": ["370条"], "page": 65, "loc": "3 取締役会設置会社／取締役会決議に関するその他の制度（369条5項・370条・373条）"}, {"id": "book-kigyoho-01-ch02-q5103", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「代表取締役は、株式会社の業務に関する一切の裁判上又は裁判外の行為をする権限を有する。」", "a": "会社法349条4項。", "reason": "代表取締役の包括的な代表権を定めるのは349条4項である。", "basis": "PDF p.66（本編 p.63）。台帳要素 t221-e03（349条4項：代表取締役は、株式会社の業務に関する一切の裁判上又は裁判外の行為をする権限を有する） の逐語引用に基づく。", "caution": "", "articles": ["349条4項"], "page": 66, "loc": "4 代表取締役／代表取締役の権限の全体像（349条4項・5項）"}, {"id": "book-kigyoho-01-ch02-q5104", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条何項のものか。「前項の権限に加えた制限は、善意の第三者に対抗することができない。」", "a": "会社法349条5項。", "reason": "代表権に加えた制限を善意の第三者に対抗できないとするのは349条5項であり、代表権の不可制限性を定める。", "basis": "PDF p.66（本編 p.63）。台帳要素 t221-e04（349条5項：前項の権限に加えた制限は、善意の第三者に対抗することができない） の逐語引用に基づく。", "caution": "", "articles": ["349条5項"], "page": 66, "loc": "4 代表取締役／代表取締役の権限の全体像（349条4項・5項）"}, {"id": "book-kigyoho-01-ch02-q5105", "ch": 2, "type": "条文構造", "q": "会社法349条は、4項と5項で代表取締役の代表権についてどのような構造の定めを置いているか。", "a": "4項は、代表取締役が株式会社の業務に関する一切の裁判上又は裁判外の行為をする権限を有すること（包括的な代表権）を定める。5項は、その権限に加えた制限は善意の第三者に対抗することができないこと（代表権の不可制限性）を定め、4項の権限を対外的に保障する。", "reason": "349条は「4項＝権限の範囲」「5項＝制限の対抗力」という構造であり、代表権の包括性と不可制限性はこの2つの項の組合せで理解する。", "basis": "PDF p.66（本編 p.63）。主対象は台帳要素 t221-e03（349条4項：代表取締役は、株式会社の業務に関する一切の裁判上又は裁判外の行為をする権限を有する）。引用は t221-e03（349条4項：代表取締役は、株式会社の業務に関する一切の裁判上又は裁判外の行為をする権限を有する） ／ t221-e04（349条5項：前項の権限に加えた制限は、善意の第三者に対抗することができない） の逐語引用に基づく。", "caution": "", "articles": ["349条4項", "349条5項"], "page": 66, "loc": "4 代表取締役／代表取締役の権限の全体像（349条4項・5項）"}, {"id": "book-kigyoho-01-ch02-q5106", "ch": 2, "type": "何条", "q": "株式会社と取締役との利益が相反する状況にあるときなどに、その都度、取締役の決定（取締役会設置会社にあっては、取締役会の決議）によって、株式会社の業務を執行することを社外取締役に委託することができる。この制度を定める条文は、会社法何条か。", "a": "会社法348条の2。", "reason": "業務の執行の社外取締役への委託は、令和元年改正で新設された348条の2が定める。", "basis": "PDF p.80（本編 p.77）。台帳要素 t234-e03（348条の2（令和元年新設）：株式会社（指名委員会等設置会社を除く。）が社外取締役を置いている場合において、当該株式会社と取締役との利益が相反する状況にあるとき、その他取締役が当該株式会社の業務を執行することにより株主の利益を損なうおそれがあるときは、当該株式会社は、その都度、取締役の決定（取締役会設置会社にあっては、取締役会の決議）によって、当該株式会社の業務を執行することを社外取締役に委託することができる） の逐語引用に基づく。", "caution": "レジュメ本文には項番号の表記がないため、条のみを答える。", "articles": ["348条の2"], "page": 80, "loc": "4 代表取締役／（参考）社外取締役の設置義務（327条の2）と業務の執行の社外取締役への委託（348条の2）"}, {"id": "book-kigyoho-01-ch02-q5107", "ch": 2, "type": "規定→趣旨", "q": "会社法343条は、監査役の選任に関する監査役の同意等について定めている。この制度の趣旨は何か。", "a": "監査役の独立性を確保するためである。", "reason": "監査役の選任に監査役の同意等を関与させることで、監査役の独立性を確保しようとするものである。", "basis": "PDF p.81（本編 p.78）。台帳要素 t235-e03（343条（監査役の選任に関する監査役の同意等）の趣旨は、監査役の独立性を確保するためである） の逐語引用に基づく。", "caution": "", "articles": ["343条"], "page": 81, "loc": "5 監査役（会）／監査役の選任・解任に関する制度（329条〜）"}, {"id": "book-kigyoho-01-ch02-q5108", "ch": 2, "type": "何条", "q": "監査役の監査権限には、業務監査権と会計監査権がある。それぞれの根拠条文は、会社法何条か。", "a": "業務監査権は381条、会計監査権は436条。", "reason": "監査役の権限は、業務監査権（381条）と会計監査権（436条）から構成される。", "basis": "PDF p.82（本編 p.79）。台帳要素 t237-e01（監査役の監査権限は、会計監査権（436条）と業務監査権（381条）がある） の逐語引用に基づく。", "caution": "", "articles": ["381条", "436条"], "page": 82, "loc": "5 監査役（会）／監査役の監査権限の全体像（381条・436条）"}, {"id": "book-kigyoho-01-ch02-q5109", "ch": 2, "type": "規定→趣旨", "q": "監査役には、取締役会への出席義務・意見陳述義務（383条1項）が課されている。その趣旨は何か。", "a": "業務監査のためである（取締役会で違法な決議がなされるのを事前に防止するため）。", "reason": "監査役が出席し意見を述べることで、取締役会で違法な決議がなされるのを事前に防止し、業務監査を実効あるものとする趣旨である。", "basis": "PDF p.82（本編 p.79）。台帳要素 t239-e02（監査役の取締役会への出席義務・意見陳述義務（383条1項）の趣旨は、業務監査のため（取締役会で違法な決議がなされるのを事前に防止するため）） の逐語引用に基づく。", "caution": "", "articles": ["383条1項"], "page": 82, "loc": "5 監査役（会）／監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"}, {"id": "book-kigyoho-01-ch02-q5110", "ch": 2, "type": "規定→趣旨", "q": "監査役には、取締役会の招集請求権・招集権（383条2項・3項・4項）が認められている。その趣旨は何か。", "a": "取締役の違法行為を取締役会に報告することを可能にするためである。", "reason": "監査役が取締役会の招集を請求し、または自ら招集できることで、発見した取締役の違法行為を取締役会に報告する機会が保障される。", "basis": "PDF p.82（本編 p.79）。台帳要素 t239-e03（取締役会招集請求権・招集権（383条2項3項4項）の趣旨は、取締役の違法行為を取締役会に報告することを可能にするため） の逐語引用に基づく。", "caution": "", "articles": ["383条2項", "383条3項", "383条4項"], "page": 82, "loc": "5 監査役（会）／監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"}, {"id": "book-kigyoho-01-ch02-q5111", "ch": 2, "type": "規定→趣旨", "q": "監査役設置会社と取締役との間の訴えにおいては、代表取締役ではなく監査役が会社を代表する（386条）。このような定めが置かれた趣旨は何か。", "a": "本来、会社を代表するのは代表取締役であるが（349条4項）、なれ合い訴訟を防止するため、監査役が会社を代表することとしたものである。", "reason": "386条は、会社と取締役との間の訴えで生じうるなれ合い訴訟を防止するため、会社を代表する者を監査役とした規定である。", "basis": "PDF p.82（本編 p.79）。台帳要素 t239-e05（監査役設置会社と取締役との間の訴えにおける会社の代表（386条）の趣旨：本来、会社を代表するのは代表取締役であるが（349条4項）、なれ合い訴訟を防止するため、監査役が会社を代表することとした） の逐語引用に基づく。", "caution": "", "articles": ["386条"], "page": 82, "loc": "5 監査役（会）／監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"}, {"id": "book-kigyoho-01-ch02-q5112", "ch": 2, "type": "規定→趣旨", "q": "監査役の報酬（387条）は、業務執行の決定として取締役会または取締役が決定するものとはされていない。その趣旨は何か。", "a": "本来、報酬の決定は業務執行の決定として取締役会または取締役の権限であるが、それでは監査の充実がなされないので、監査役の独立性を確保するためである。", "reason": "報酬の決定を監査の対象である取締役側の権限とすると監査の充実がなされないため、387条は監査役の独立性確保の観点からこれを切り離している。", "basis": "PDF p.82（本編 p.79）。台帳要素 t239-e06（監査役の報酬（387条）の趣旨：本来、報酬の決定は業務執行の決定として取締役会または取締役の権限であるが、それでは監査の充実がなされないので、監査役の独立性確保ため） の逐語引用に基づく。", "caution": "", "articles": ["387条"], "page": 82, "loc": "5 監査役（会）／監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"}, {"id": "book-kigyoho-01-ch02-q5113", "ch": 2, "type": "規定→趣旨", "q": "会計参与の報酬を定める379条は、監査役の報酬（387条）と同じ趣旨の規定とされる。その趣旨は何か。", "a": "会計参与の独立性を確保するためである。", "reason": "379条は監査役の報酬（387条）と同じ規定であり、趣旨（独立性確保）も同じであるとレジュメは整理している。", "basis": "PDF p.84（本編 p.81）。台帳要素 t305-e01（379条（会計参与の報酬）。監査役の報酬（387条）と同じ規定であり、趣旨（独立性確保）も同じ）に関するレジュメ本文（「監査役の報酬（387条）と同じ規定。趣旨（独立性確保）も同じ。」）の逐語引用に基づく。", "caution": "", "articles": ["379条"], "page": 84, "loc": "6 会計参与／会計参与の報酬（379条）"}, {"id": "book-kigyoho-01-ch02-q5114", "ch": 2, "type": "何条", "q": "会計監査人は、会社法上の「役員」には当たらない。このことは、会社法何条を参照することで確認できるか。", "a": "会社法329条1項（参照）。", "reason": "329条1項が「役員」として挙げるのは取締役・会計参与・監査役であり、会計監査人は含まれない。ここから、選任について341条は使えないこと、解任に関して854条は使えないこと、報酬は定款・株主総会決議で定めないこと、という帰結が導かれる。", "basis": "PDF p.85（本編 p.82）。台帳要素 t306-e02（会計監査人は、役員ではない（329条1項参照）） の逐語引用に基づく。", "caution": "", "articles": ["329条1項"], "page": 85, "loc": "7 会計監査人／会計監査人の条文全体像と「役員ではない」ことの帰結（329条1項）"}, {"id": "book-kigyoho-01-ch02-q5115", "ch": 2, "type": "何条", "q": "会計監査人の解任について、役員解任の訴え（854条）は使うことができない。代わりに、監査役等が会計監査人を解任できることを定める条文は、会社法何条か。", "a": "会社法340条。", "reason": "会計監査人は役員ではないため854条は使えず、監査役等による会計監査人の解任は340条による。", "basis": "PDF p.85（本編 p.82）。台帳要素 t311-e03（854条（役員解任の訴え）は使えない。その代わりに340条（監査役等による会計監査人の解任）） の逐語引用に基づく。", "caution": "", "articles": ["340条"], "page": 85, "loc": "7 会計監査人／会計監査人の終任と解任（339条・340条、854条は使えない）"}, {"id": "book-kigyoho-01-ch02-q5116", "ch": 2, "type": "条文構造", "q": "会社法400条は、指名委員会等の各委員会の委員について、各項でどのような構造の定めを置いているか。", "a": "1項は、各委員会は委員三人以上で組織すること（組織）を定める。2項は、各委員会の委員は取締役の中から、取締役会の決議によって選定すること（選定）を定め、委員の解職も取締役会の決議によって行う。3項は、各委員会の委員の過半数は、社外取締役でなければならないこと（構成）を定める。", "reason": "400条は「1項＝組織」「2項＝選定・解職」「3項＝社外取締役が過半数」という構造である。各委員会は取締役会の内部機関であり、委員の選定・解職は329条〜によらない。", "basis": "PDF p.88（本編 p.85）。主対象は台帳要素 t315-e01（400条1項：各委員会は、委員三人以上で組織する。2項：各委員会の委員は、取締役の中から、取締役会の決議によって選定する。3項：各委員会の委員の過半数は、社外取締役でなければならない）。引用は t315-e01（400条1項：各委員会は、委員三人以上で組織する。2項：各委員会の委員は、取締役の中から、取締役会の決議によって選定する。3項：各委員会の委員の過半数は、社外取締役でなければならない） ／ t315-e02（各委員会の委員の解職は取締役会の決議によって行う（400条2項、400条1項への注記）） の逐語引用に基づく。", "caution": "", "articles": ["400条1項", "400条2項", "400条3項"], "page": 88, "loc": "8 指名委員会等設置会社／各委員会の委員の選定・解職（400条）"}, {"id": "book-kigyoho-01-ch02-q5117", "ch": 2, "type": "条文構造", "q": "会社法404条は、指名委員会等の権限を、各項でどのように割り振っているか。", "a": "1項は指名委員会の権限、2項は監査委員会の権限、3項は報酬委員会の権限を定めている。", "reason": "404条は、項ごとに担当する委員会の権限を定める構造であり、指名委員会＝1項、監査委員会＝2項、報酬委員会＝3項と対応させて把握する。", "basis": "PDF p.88（本編 p.85）。台帳要素 t316-e01（404条1項は指名委員会の権限、2項は監査委員会の権限、3項は報酬委員会の権限） の逐語引用に基づく。", "caution": "", "articles": ["404条"], "page": 88, "loc": "8 指名委員会等設置会社／指名委員会等の権限の条文構造（404条〜409条）"}, {"id": "book-kigyoho-01-ch02-q5118", "ch": 2, "type": "何条", "q": "指名委員会等設置会社において、代表執行役が包括的・不可制限的な代表権を有することの根拠として、レジュメが挙げる条文は会社法何条何項か。", "a": "会社法420条3項（349条4項・5項）。", "reason": "代表執行役の代表権については420条3項に定めがあり、代表取締役の代表権に関する349条4項・5項とあわせて、包括的・不可制限的な代表権が構成される。", "basis": "PDF p.89（本編
