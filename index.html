", "定款変更の原則（特別決議）と特則（2つ）"], "points": [{"aspect": "要件", "text": "株式の内容についての特別の定めは107条1項各号・107条2項各号の事項を「定款」に記載する"}, {"aspect": "結論", "text": "株式会社の定款変更は原則として株主総会の特別決議（466条、309条2項11号）によるが、上記表のうち2つ（特殊決議と株主全員の同意）はその特則である"}]}, {"id": "book-kigyoho-01-art108", "article": "108条", "chs": [3], "topics": ["種類株式と定款記載事項（108条）", "決議の厳格さと各趣旨のキーワードの対応"], "points": [{"aspect": "趣旨", "text": "キーワード対応：株主に不利益のおそれあり→特別決議、株主にもっと不利益のおそれあり→特殊決議、株主にもっともっと不利益のおそれあり→全員の同意"}, {"aspect": "要件", "text": "種類株式については108条1項各号・108条2項各号の事項を「定款」に記載する"}]}, {"id": "book-kigyoho-01-art109", "article": "109条", "chs": [3, 5], "topics": ["株主平等原則の内容と趣旨（109条1項）", "株主平等原則の性質をめぐる考え方の変遷", "（論点）株主平等原則違反の決議・行為等の効力", "（論点）特定の株主に対する贈与契約", "（論点）従業員持株制度による奨励金の支給", "非公開会社における属人的な権利の定め（109条2項）"], "points": [{"aspect": "趣旨", "text": "趣旨は、多数決の濫用や代表者の恣意的な業務執行行為から少数株主を保護し、株式投資を促すためである"}, {"aspect": "趣旨", "text": "趣旨：非公開会社では株主の関係は緊密であるから、株式ではなく株主に着目して異なる取扱いを認めても不都合はないからである"}, {"aspect": "要件", "text": "109条1項：株式会社は、株主を、その有する株式の内容及び数に応じて、平等に取り扱わなければならない"}, {"aspect": "要件", "text": "問題の所在：ある定款規定・決議・行為等が株主平等原則（109条1項）に反するかどうかが問題となる"}, {"aspect": "要件", "text": "非公開会社では属人的な権利の定めが認められる（109条2項）。例：1株主1議決権"}, {"aspect": "結論", "text": "同条に反する定款規定、株主総会決議、取締役会決議、代表取締役の行為も、①合理的目的を有し、②区別の程度が軽微であり、③株主に不測の損害をあたえないならば、株主平等原則に反しないと解する"}, {"aspect": "結論", "text": "（B）学説の有力説によると、決議に賛成してもらうためというのは合理的目的ではなく、損失填補の金銭100万円の贈与は区別の程度が軽微ではなく、周知され不測の損害を与えないものでもないため、株主平等原則に反する"}, {"aspect": "結論", "text": "従業員持株制度は、株主としての資格に基づくものでなく、従業員資格に基づき会社が奨励金を支給するものであるから、株主平等原則の適用はない"}]}, {"id": "book-kigyoho-01-art110", "article": "110条", "chs": [3], "topics": [], "points": [{"aspect": "制度名", "text": "全ての株式を取得条項付株式に ― 110条"}]}, {"id": "book-kigyoho-01-art111", "article": "111条", "chs": [3], "topics": ["種類株主に損害を及ぼすおそれがある場合の種類株主総会決議（322条）と111条の特則関係"], "points": [{"aspect": "要件", "text": "ある種類株式の種類株主に損害を及ぼすおそれがある場合は、その種類株主総会の特別決議（322条1項1号、324条2項4号）が上記手続に加わる。111条は322条の特則で前者を優先する"}]}, {"id": "book-kigyoho-01-art116", "article": "116条", "chs": [3, 9], "topics": ["株式買取請求が認められる4つの場合（根拠条文）"], "points": [{"aspect": "要件", "text": "反対株主の買取請求が認められるのは4つの場合だけ：①116条の定款変更の場合、②株式併合の決議の場合（182条の4）、③事業譲渡等の決議の場合（469条）、④組織再編行為の決議の場合（785条、797条、806条、816条の6）"}, {"aspect": "要件", "text": "①116条の内訳：全部または一部の株式に譲渡制限の定めを設ける定款変更に反対する場合（116条1項1号2号）、全部取得条項付種類株式の定款の定めを設ける定款変更に反対する場合（116条1項2号）、種類株主総会決議不要の定款変更がある場合に種類株主に損害を及ぼすおそれがある場合（116条1項3号）"}]}, {"id": "book-kigyoho-01-art120", "article": "120条", "chs": [2], "topics": ["利益供与の禁止（120条1項）の要件とあてはめ", "利益供与の禁止の趣旨と120条2項の推定", "関与取締役等の支払義務（120条4項）と会社法施行規則21条"], "points": [{"aspect": "趣旨", "text": "利益供与の禁止の趣旨：①会社財産の浪費防止、②（総会屋を根絶して）株主総会の議事運営の適正化、企業経営の健全確保のため"}, {"aspect": "要件", "text": "120条1項：株式会社は、①何人に対しても、②株主の権利等の行使に関し、③財産上の利益の供与（当該株式会社又はその子会社の計算においてするものに限る）をしてはならない"}, {"aspect": "要件", "text": "120条2項の推定：特定の株主に対して無償で財産上の利益の供与をしたときは「株主の権利の行使に関し」供与したものと推定する。有償でも会社・子会社の受けた利益が著しく少ないときも同様"}, {"aspect": "要件", "text": "120条4項の責任の区別：利益供与を「した」取締役（執行役）は無過失責任、利益供与に「関与した」取締役（執行役）は過失責任"}, {"aspect": "要件", "text": "120条4項の「法務省令」は会社法施行規則21条。実際契約を締結したX1は同規則21条1号、取締役会決議に賛成したX2は同規則21条2号イの「決議に賛成した取締役」にあたる。同規則21条は重要で読めるようにすべき"}, {"aspect": "要件", "text": "要件②「株主の権利の行使に関して」は行使・不行使の両方を含む。権利の例：議決権（105条1項3号）、質問権（314条）、株主提案権（303条〜305条）、代表訴訟提起権（847条）等"}, {"aspect": "その他", "text": "設例（おしぼりリース）での推定と問題所在：A・X1・X2が「取引行為であって株主の権利行使に関するものでない」と主張しても、120条2項によって「株主の権利の行使に関」すると推定される。返還請求は120条3項、取締役への支払請求は120条4項の問題"}, {"aspect": "その他", "text": "答案例：X1は「利益の供与をした取締役」にあたり50万円の支払義務を負い無過失責任（120条4項、施行規則21条1号）。X2は「取締役会の決議に賛成した取締役」であるから、過失のないことを証明した場合を除き50万円の支払義務を負う（120条4項、同規則21条2号イ）"}]}, {"id": "book-kigyoho-01-art124", "article": "124条", "chs": [3], "topics": ["基準日制度（124条）と基準日後に株式を取得した者の権利行使（124条4項）"], "points": [{"aspect": "趣旨", "text": "124条1項の趣旨：権利行使時における権利行使株主を一時に確定することを容易にするため（会社の利益）"}, {"aspect": "要件", "text": "124条4項：基準日株主が行使することができる権利が株主総会又は種類株主総会における議決権である場合、会社は基準日後に株式を取得した者の全部又は一部を権利行使者と定めることができる。ただし基準日株主の権利を害することができない"}]}, {"id": "book-kigyoho-01-art127", "article": "127条", "chs": [3], "topics": ["株式譲渡自由の原則（127条）とその趣旨"], "points": [{"aspect": "趣旨", "text": "趣旨：株主が有限責任（104条）しか負わない株式会社では会社財産の実質的払戻しに厳格な規制があるため（461条）投下資本回収の方法として株式譲渡を認める必要があり、また所有と経営が制度的に分離されている（326条1項）ため株主の個性は問題とならず自由な交替を認めても影響がない。そこで株式譲渡自由の原則が要請される"}, {"aspect": "要件", "text": "株式譲渡自由の原則は127条に定められる"}]}, {"id": "book-kigyoho-01-art128", "article": "128条", "chs": [3], "topics": ["株券発行前の株式譲渡の制限（128条2項）"], "points": [{"aspect": "制度名", "text": "株券発行前の株式譲渡の制限"}, {"aspect": "趣旨", "text": "趣旨は、株券発行事務の混乱防止のためである（会社の利益保護）"}, {"aspect": "要件", "text": "128条2項：株券の発行前にした譲渡は、株券発行会社に対し、その効力を生じない"}]}, {"id": "book-kigyoho-01-art130", "article": "130条", "chs": [3], "topics": ["（論点）会社側から譲受人の権利行使を許容することはできるか（確定的効力の例外2）"], "points": [{"aspect": "制度名", "text": "名義書換の確定的効力"}, {"aspect": "趣旨", "text": "株主名簿制度の趣旨は会社の事務処理の便宜を図ることにあり、会社が自らこの利益を放棄して譲受人を株主として取り扱うことは認められてよい。また130条の文言は「会社に対抗することができない」と対抗要件にすぎない"}, {"aspect": "要件", "text": "問題設定：譲受人は名義書換を受けない限り会社に対して株主であることを対抗できない（130条、確定的効力）。しかし会社側から名義書換未了の譲受人を株主と認めて権利行使させることはできるか"}, {"aspect": "結論", "text": "会社が自己の危険において名義書換未了の株式譲受人を株主と認めて権利行使させることはできる"}]}, {"id": "book-kigyoho-01-art131", "article": "131条", "chs": [3], "topics": ["株券に関する効力（資格授与的効力・免責的効力・善意取得）"], "points": [{"aspect": "制度名", "text": "株券の資格授与的効力"}, {"aspect": "要件", "text": "株券に関する効力は、資格授与的効力（131条1項）、免責的効力、善意取得（131条2項）である"}]}, {"id": "book-kigyoho-01-art135", "article": "135条", "chs": [3], "topics": ["子会社による親会社株式の取得禁止・例外・処分（135条）", "（論点）子会社が適法に保有している親会社株式の法律上の地位"], "points": [{"aspect": "制度名", "text": "子会社による親会社株式の原則的取得禁止"}, {"aspect": "趣旨", "text": "135条1項の趣旨：親子会社間の経済的一体性や支配・従属関係から、取得を自由に認めると親会社からの実質的な出資の払戻しになるおそれや、親会社の経営者の不正な支配がなされるおそれがあるため"}, {"aspect": "趣旨", "text": "議決権を否定する理由：親会社の支配の公正を害するおそれがあるため"}, {"aspect": "要件", "text": "135条の構造：1項で原則取得禁止、2項で例外許容、3項で保有した場合に「相当の時期」に処分する。cf.163条。親会社・子会社の定義は2条3号4号"}, {"aspect": "要件", "text": "2項の例外：やむを得ない取得の場合は、例外的に親会社株式の取得が認められる"}, {"aspect": "要件", "text": "子会社は保有する親会社株式については議決権を有しない（308条1項本文かっこ書）"}, {"aspect": "結論", "text": "議決権以外の共益権は、議決権の行使を前提とする権利は否定されるべきであるが、自益権は全て認められる（子会社と親会社は別法人格者であるため）"}]}, {"id": "book-kigyoho-01-art136", "article": "136条", "chs": [3], "topics": ["定款による譲渡制限の趣旨と承認機関（139条）"], "points": [{"aspect": "制度名", "text": "譲渡承認請求"}, {"aspect": "その他", "text": "図：株主Aから株式取得者Bへの譲渡制限株式の譲渡に対し、Aは136条・138条1号、Bは137条・138条2号により甲社の承認機関（139条）へ承認請求を行う"}]}, {"id": "book-kigyoho-01-art137", "article": "137条", "chs": [3], "topics": ["定款による譲渡制限の趣旨と承認機関（139条）"], "points": [{"aspect": "制度名", "text": "譲渡承認請求"}, {"aspect": "その他", "text": "図：株主Aから株式取得者Bへの譲渡制限株式の譲渡に対し、Aは136条・138条1号、Bは137条・138条2号により甲社の承認機関（139条）へ承認請求を行う"}]}, {"id": "book-kigyoho-01-art138", "article": "138条", "chs": [3], "topics": ["（論点）会社の承認を欠く譲渡制限株式の譲渡の効力"], "points": [{"aspect": "制度名", "text": "譲渡承認請求"}, {"aspect": "結論", "text": "譲渡は譲渡当事者間では有効であるが、会社に対する関係では無効である。法は株式取得者からの買取先指定請求の規定（138条2号ハ）を設け当事者間では有効であることを前提としており、制度の趣旨達成には会社に対する関係で無効とすれば足りるからである"}]}, {"id": "book-kigyoho-01-art139", "article": "139条", "chs": [3], "topics": ["定款による譲渡制限の趣旨と承認機関（139条）"], "points": [{"aspect": "制度名", "text": "譲渡承認機関"}, {"aspect": "趣旨", "text": "趣旨：会社にとって好ましくない者が株式取得によって対会社関係に入ってくることを防止するためである"}, {"aspect": "要件", "text": "承認機関（139条）：取締役会設置会社にあっては取締役会決議、株主総会の場合は普通決議。「定款に別段の定め」の例として、取締役会設置会社において株主総会を承認機関とすること、代表取締役を承認機関とすることがある"}, {"aspect": "その他", "text": "図：株主Aから株式取得者Bへの譲渡制限株式の譲渡に対し、Aは136条・138条1号、Bは137条・138条2号により甲社の承認機関（139条）へ承認請求を行う"}]}, {"id": "book-kigyoho-01-art140", "article": "140条", "chs": [3], "topics": ["会社が譲渡を承認しない場合の手続（会社による買取・指定買取人の指定）"], "points": [{"aspect": "趣旨", "text": "会社が買い取る場合に株主総会の特別決議に限るのは、会社にとっては自己株式の取得であって弊害があるからである"}, {"aspect": "要件", "text": "会社が買い取る場合（140条1項〜3項）：140条2項の株主総会の決議は特別決議である（309条2項1号）。譲渡等承認請求者（＝自己株式の売主）は議決権なし（140条3項）"}, {"aspect": "要件", "text": "指定買取人の指定（140条4項5項）：株主総会（取締役会設置会社にあっては取締役会）の決議、または定款に別段の定めによる。140条5項の株主総会の決議は特別決議である"}, {"aspect": "要件", "text": "（重要）議決権がない自己株式の売主は3つ：175条2項、140条3項、160条4項"}]}, {"id": "book-kigyoho-01-art155", "article": "155条", "chs": [3], "topics": ["自己株式の取得が可能な場合の一覧（155条）"], "points": [{"aspect": "制度名", "text": "自己株式の取得・取得手続規制"}, {"aspect": "その他", "text": "一覧表①〜⑤：①取得条項付株式の取得（手続168条〜170条／財源170条5項）、②譲渡制限株式の取得（140・141・144条／461条1項1号）、③株主との合意による有償取得（156条〜165条／461条1項2号3号）、④取得請求権付株式の取得（166条・167条／166条1項但書）、⑤全部取得条項付種類株式の取得（171条〜173条／461条1項4号）"}, {"aspect": "その他", "text": "一覧表⑥〜⑨：⑥相続人等への売渡請求に基づく取得（174条〜177条／461条1項5号）、⑦単元未満株式の買取請求に基づく取得（192条・193条／財源規制なし）、⑧所在不明株主の株式の買取り（197条3項4項／461条1項6号）、⑨端数処理手続における買取り（234条・235条／461条1項7号）"}, {"aspect": "その他", "text": "一覧表⑩〜⑬：⑩他の会社の事業の全部の譲受けに伴う取得（特別な手続きなし／財源規制なし）、⑪合併後消滅会社からの株式の承継（同左）、⑫吸収分割する会社からの株式の承継（同左）、⑬会社法施行規則27条所定の取得（反対株主の株式買取請求に基づく取得。各買取請求の手続きで／116条・469条など、財源規制なし（＊））"}]}, {"id": "book-kigyoho-01-art156", "article": "156条", "chs": [3], "topics": ["株主との合意による有償取得の原則的取得方法の手続（156条〜159条）", "特定の株主からの取得の手続規制（160条）"], "points": [{"aspect": "要件", "text": "原則的取得方法（すべての株主を対象に、156条〜159条）：①156条「あらかじめ」株主総会の普通決議で株式取得事項の決定（取得枠の決定）、②157条「その都度」取締役会の決定（取得の決定）、③158条すべての株主に決定した取得価格等の通知・公告して売却を勧誘、④159条株主の申込み、承諾したものとみなす（売買契約成立）"}, {"aspect": "要件", "text": "手続①の正確な内容：「あらかじめ」株主総会の特別決議で、156条1項の事項に併せて「特定の株主」に対してのみ158条の通知を行う旨を決定する（160条1項）。「特定の株主」の氏名・名称も決議事項と解されている。株主に売主追加請求できる旨の通知（160条2項）。株主は「特定の株主に自己をも含めたもの」を株主総会の議案にすることを会社に請求（＝売主追加請求）できる（160条3項）。「特定の株主」（売主追加請求権行使者も含む）は議決権を行使できない（160条4項）"}]}, {"id": "book-kigyoho-01-art158", "article": "158条", "chs": [3], "topics": ["特定の株主からの取得の手続規制（160条）"], "points": [{"aspect": "要件", "text": "手続①の正確な内容：「あらかじめ」株主総会の特別決議で、156条1項の事項に併せて「特定の株主」に対してのみ158条の通知を行う旨を決定する（160条1項）。「特定の株主」の氏名・名称も決議事項と解されている。株主に売主追加請求できる旨の通知（160条2項）。株主は「特定の株主に自己をも含めたもの」を株主総会の議案にすることを会社に請求（＝売主追加請求）できる（160条3項）。「特定の株主」（売主追加請求権行使者も含む）は議決権を行使できない（160条4項）"}, {"aspect": "要件", "text": "手続③④：158条・160条5項により特定の株主に対してのみ決定した取得価格等の通知・公告して売却を勧誘し、159条により株主の申込みで承諾したものとみなされ売買契約が成立する"}, {"aspect": "要件", "text": "手続の流れ全体：160条2項（全株主への通知）→160条3項→156条1項・160条1項→157条→158条1項・160条5項（特定の株主への通知・売却勧誘）→159条→自己株式の取得"}]}, {"id": "book-kigyoho-01-art159", "article": "159条", "chs": [3, 6], "topics": ["株主との合意による有償取得の原則的取得方法の手続（156条〜159条）", "（応用）462条責任の三主体へのあてはめ―株主総会決議（454条1項）による剰余金の配当"], "points": [{"aspect": "要件", "text": "原則的取得方法（すべての株主を対象に、156条〜159条）：①156条「あらかじめ」株主総会の普通決議で株式取得事項の決定（取得枠の決定）、②157条「その都度」取締役会の決定（取得の決定）、③158条すべての株主に決定した取得価格等の通知・公告して売却を勧誘、④159条株主の申込み、承諾したものとみなす（売買契約成立）"}, {"aspect": "要件", "text": "会社計算規則159条：462条1項各号列記以外の部分の法務省令で定める者。8号（461条1項8号の行為）については、イ剰余金の配当による金銭等の交付に関する職務を行った取締役及び執行役、ロ454条1項の決定に係る株主総会において配当事項について説明をした取締役及び執行役、ハ454条1項の決定に係る取締役会において配当に賛成した取締役、ニ分配可能額の計算に関する報告を監査役又は会計監査人が請求したときは当該請求に応じて報告をした取締役及び執行役"}]}, {"id": "book-kigyoho-01-art160", "article": "160条", "chs": [3, 6], "topics": ["特定の株主からの取得の手続規制（160条）", "（応用）462条責任の三主体へのあてはめ―株主総会決議（454条1項）による剰余金の配当"], "points": [{"aspect": "趣旨", "text": "160条1項の趣旨：株主間で不平等が生じるおそれがあるため。また、会社が特定の株主から不当に高い価格で自己株式を取得することで他の株主が損失を被ったり（株主間の利益移転）、不当な目的で取得したりする（会社支配の不公正）危険性が高いため"}, {"aspect": "趣旨", "text": "160条2項3項の趣旨：株主に平等に投下資本回収の機会を与えるため"}, {"aspect": "趣旨", "text": "160条4項の趣旨：決議の公平を保つため"}, {"aspect": "要件", "text": "特定の株主からの取得の概要：株主Bに不利益・不平等が生じるため、①株主総会の特別決議（160条1項、309条2項2号かっこ書き）と「その都度」の取締役会決議による自己株式取得（157条）、②売主追加請求（160条2項3項）が取得手続規制として課される。適用条文は156条〜159条・160条"}, {"aspect": "要件", "text": "手続①の正確な内容：「あらかじめ」株主総会の特別決議で、156条1項の事項に併せて「特定の株主」に対してのみ158条の通知を行う旨を決定する（160条1項）。「特定の株主」の氏名・名称も決議事項と解されている。株主に売主追加請求できる旨の通知（160条2項）。株主は「特定の株主に自己をも含めたもの」を株主総会の議案にすることを会社に請求（＝売主追加請求）できる（160条3項）。「特定の株主」（売主追加請求権行使者も含む）は議決権を行使できない（160条4項）"}, {"aspect": "要件", "text": "手続の流れ全体：160条2項（全株主への通知）→160条3項→156条1項・160条1項→157条→158条1項・160条5項（特定の株主への通知・売却勧誘）→159条→自己株式の取得"}, {"aspect": "要件", "text": "会社計算規則160条：462条1項1号イの法務省令で定める者は、一株主総会に議案を提案した取締役、二前号の議案の提案の決定に同意した取締役（取締役会設置会社の取締役を除く）、三1号の議案の提案が取締役会の決議に基づいて行われたときは当該決議に賛成した取締役"}, {"aspect": "結論", "text": "あてはめ結果：A→462条1項柱書「当該行為に関する職務を行った業務執行者」、B→会社計算規則160条3号・462条1項6号イ「総会議案提案取締役」、C→369条5項・計算規則160条3号・462条1項6号イ「総会議案提案取締役」、D→462条1項柱書「金銭等の交付を受けた者」"}]}, {"id": "book-kigyoho-01-art161", "article": "161条", "chs": [3], "topics": ["市場価格のある株式の取得の特則（161条）"], "points": [{"aspect": "趣旨", "text": "趣旨：市場価格ある株式については他の株主は市場において株式を売却する機会を有するから要保護性がなく、また市場価格以下で取得する場合は他の株主を害するおそれがないからである"}, {"aspect": "要件", "text": "161条（市場価格のある株式の取得の特則）：売主追加請求権の規定（160条2項3項）を適用しない"}]}, {"id": "book-kigyoho-01-art162", "article": "162条", "chs": [3], "topics": ["相続人等からの取得の特則（162条）"], "points": [{"aspect": "趣旨", "text": "趣旨：非公開会社で、相続等により当該会社にとって好ましくない者が株主となった場合に、当該株主も株式を手放すことに異論がないときは、その状態を解消しやすくする必要があるからである"}, {"aspect": "要件", "text": "162条（相続人等からの取得の特則）：売主追加請求権の規定（160条2項3項）を適用しない"}]}, {"id": "book-kigyoho-01-art163", "article": "163条", "chs": [3], "topics": ["子会社からの株式の取得（163条）"], "points": [{"aspect": "趣旨", "text": "趣旨：子会社は相当の時期に親会社株式を処分しなければならない（135条3項）が、その処分が容易でない場合もあるため、容易に親会社が子会社保有の親会社株式を取得することを可能にしたものである"}, {"aspect": "要件", "text": "163条：株主総会の普通決議、ただし取締役会設置会社では取締役会決議で、子会社から自己株式を取得できる。163条は①156条1項の適用の修正、②157条〜160条の適用排除を定める（普通決議で足りるのは165条1項が160条1項を除外しているためと記載）"}]}, {"id": "book-kigyoho-01-art164", "article": "164条", "chs": [3], "topics": ["定款で売主追加請求排除（164条）"], "points": [{"aspect": "趣旨", "text": "趣旨：株主全員の同意を必要とする定款規定（164条2項）に基づくのであれば、会社が合意により特定の株主のみから自己株式を有償取得することを認めても、他の株主に不測の損害を与えるおそれは小さいからである"}, {"aspect": "要件", "text": "164条（定款で売主追加請求排除）：161条・162条と同様、売主追加請求権（160条2項3項）が排除されるだけである"}]}, {"id": "book-kigyoho-01-art165", "article": "165条", "chs": [3], "topics": ["市場取引等による取得（165条）"], "points": [{"aspect": "要件", "text": "165条：市場取引等による自己株式の取得は株主間に不平等が生じないし機動的な取得の要請から、株主総会の普通決議または定款に定めれば取締役会決議（取締役会設置会社の場合）で取得できる。165条1項は157条〜160条の適用排除、2項3項は156条1項の適用の修正を定める（普通決議で足りるのは165条1項が160条1項を除外しているため）"}]}, {"id": "book-kigyoho-01-art171", "article": "171条", "chs": [3], "topics": ["全部取得条項付種類株式の取得（171条）によるキャッシュ・アウト"], "points": [{"aspect": "制度名", "text": "全部取得条項付種類株式の取得"}, {"aspect": "要件", "text": "手順：①甲’株を発行できるよう定款変更（株主総会の特別決議、466条、309条2項11号）。この時点では甲’株は未発行。②既存株式甲株を全部取得条項付種類株式に変える定款変更（株主総会の特別決議、466条、309条2項11号、プラス甲株主の種類株主総会の特別決議、111条2項、324条2項1号）。「取得対価の価額の決定方法」を定款に記載する（108条2項7号ｲ）。③全部取得条項付種類株式の会社による取得手続（株主総会の特別決議、171条1項、309条2項3号）。④1株に満たない端数の金銭処理（234条1項2号）。以上によりB・Cは甲社株主でなくなり（少数株主の排除）、甲社はAの完全子会社となる"}, {"aspect": "要件", "text": "手続：株主総会の特別決議（171条1項、309条2項3号）。事前開示（171条の2）、事後開示（173条の2）。差止請求権（171条の3。要件：①法令・定款違反②株主が不利益を受けるおそれがあること。趣旨：株主（少数株主）保護のため）。裁判所に対する価格決定の申立権（172条1項。趣旨：「取得対価」に不満な株主を保護するため）"}]}, {"id": "book-kigyoho-01-art174", "article": "174条", "chs": [3], "topics": ["相続人等への売渡請求（174条〜177条）"], "points": [{"aspect": "要件", "text": "174条：株式会社は、相続その他の一般承継により当該株式会社の株式（譲渡制限株式に限る）を取得した者に対し、当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。すなわち譲渡制限株式に定款で売渡請求権をつければよい"}, {"aspect": "要件", "text": "売渡請求の決定は株主総会の特別決議による（175条1項、309条2項3号）。売渡請求の相手方（自己株式の売主）は甲社株主だが議決権なし（175条2項）。p182の図は合併により甲株を取得したY会社に対する売渡請求の場面"}, {"aspect": "比較", "text": "譲渡の場合との比較：株式譲渡については定款で譲渡制限を定めればよい（107条1項1号、108条1項4号）が、「相続その他の一般承継」と「譲渡（特定承継）」は異なり、一般承継の場合は会社の承認は必要ない（134条4号参照）"}, {"aspect": "その他", "text": "（問題）甲社の株主Aが死亡し、甲社にとって好ましくない者DがAの唯一の相続人として甲株式（譲渡制限株式）を取得した。甲社はDに甲株式の売渡請求をすることができるか（根拠は174条〜177条）"}]}, {"id": "book-kigyoho-01-art177", "article": "177条", "chs": [3], "topics": ["相続人等への売渡請求（174条〜177条）"], "points": [{"aspect": "要件", "text": "売渡請求の決定は株主総会の特別決議による（175条1項、309条2項3号）。売渡請求の相手方（自己株式の売主）は甲社株主だが議決権なし（175条2項）。p182の図は合併により甲株を取得したY会社に対する売渡請求の場面"}, {"aspect": "比較", "text": "譲渡の場合との比較：株式譲渡については定款で譲渡制限を定めればよい（107条1項1号、108条1項4号）が、「相続その他の一般承継」と「譲渡（特定承継）」は異なり、一般承継の場合は会社の承認は必要ない（134条4号参照）"}, {"aspect": "その他", "text": "（問題）甲社の株主Aが死亡し、甲社にとって好ましくない者DがAの唯一の相続人として甲株式（譲渡制限株式）を取得した。甲社はDに甲株式の売渡請求をすることができるか（根拠は174条〜177条）"}]}, {"id": "book-kigyoho-01-art178", "article": "178条", "chs": [3], "topics": ["株式の消却（178条）"], "points": [{"aspect": "制度名", "text": "(自己)株式の消却"}, {"aspect": "趣旨", "text": "取締役会決議・取締役の決定で足りる趣旨：消却の対象は自己株式のみであって他の株主に不利益がないので、株主総会決議まで要求する必要がないため"}, {"aspect": "定義", "text": "株式の消却とは、株式会社がその存続中に特定の自己株式を絶対的に消滅させる会社の行為をいう"}, {"aspect": "要件", "text": "手続：取締役会決議（178条2項）。取締役会非設置会社の場合は取締役の決定（解釈）。消却できるのは自己株式のみ（178条1項）"}]}, {"id": "book-kigyoho-01-art179", "article": "179条", "chs": [3], "topics": ["特別支配株主の株式等売渡請求（179条～）"], "points": [{"aspect": "制度名", "text": "特別支配株主の株式等売渡請求"}, {"aspect": "趣旨", "text": "趣旨：株主総会の決議を経ずに、キャッシュ・アウトを行う要請に応えるため。cf.金銭を対価とする略式株式交換は、税制上の理由から従来あまり利用されてこなかった"}, {"aspect": "要件", "text": "売渡株式等取得無効の訴えが認められるための要件：①取得日から6ヶ月以内の訴えであること、②無効原因があること。法的安定性確保と取引の安全の見地から、無効原因は重大な瑕疵に限ると解する"}, {"aspect": "要件", "text": "手続：取締役会決議による承認（取締役会設置会社の場合。179条の3第1項3項）。事前開示（179条の5）、事後開示（179条の10）。差止請求権（179条の7。要件：①ⅰ株式売渡請求が法令に違反する場合、ⅱ（略）、ⅲ特別支配株主が定めた売渡対価が著しく不当である場合（＊2）のいずれかで、②売渡株主が不利益を受けるおそれがあること。趣旨：株主（少数株主）保護のため）。裁判所に対する価格決定の申立権（179条の8第1項）"}, {"aspect": "要件", "text": "事後に効力を争う方法：特別の訴えの制度あり。売渡株式等取得無効の訴え（846条の2～）。828条ではない点に注意"}, {"aspect": "要件", "text": "売渡株式等取得無効の訴えの被告は特別支配株主（対象会社でないことに注意）。無効判決（認容判決）の効力は対世効（846条の7）、将来効（846条の8）"}, {"aspect": "学説", "text": "（論点）「対価が著しく不当」であることは無効原因か：単に取得対価が不当である場合は価格決定の申立（179条の8第1項）で争うことはできるから無効原因にならないが、対価が著しく不当な場合にはそのような取得を抑制するため無効原因になると解する。対価の著しい不当性は取得の差止事由でもあるが（179条の7第1項3号）、通常仮処分手続の中で争われる差止請求では対価の相当性に十分な審理を期待できないため、事後的な無効主張を認めるべきである。判例はなく、上記論証は有力説"}]}, {"id": "book-kigyoho-01-art180", "article": "180条", "chs": [3], "topics": ["株式の併合（180条～）", "株式併合（180条）によるキャッシュ・アウト"], "points": [{"aspect": "趣旨", "text": "特別決議を要する趣旨：株式の併合は、併合割合如何によっては端数が生じたり、小さい単位で株式を譲渡する利益を失われる等、株主に不利益のおそれがあるため"}, {"aspect": "定義", "text": "株式の併合とは、複数の株式を合わせてそれよりも少数の株式にすることをいう。併合がなされると発行済株式総数は減少するが、会社財産は変動しない"}, {"aspect": "要件", "text": "180条2項：株式会社は株式の併合をしようとするときは、その都度、株主総会の決議によって、①併合の割合、②株式の併合がその効力を生ずる日、③種類株式発行会社である場合には併合する株式の種類を定めなければならない。取締役は株主総会において併合を必要とする理由を説明しなければならない（4項）"}, {"aspect": "要件", "text": "手続：株主総会の特別決議（180条2項、309条2項4号）。事前開示（182条の2）、事後開示（182条の6）。差止請求権（182条の3。要件：①法令・定款違反②株主が不利益を受けるおそれがあること。趣旨：株主（少数株主）保護のため）。端数処理（235条・234条2項～5項）"}, {"aspect": "要件", "text": "端数の処理：株式の併合・分割・無償割当て等によって1株未満の端数が生じる場合、その端数の合計数に相当する株式を売却し（原則、競売の方法で）、売却代金を株主に交付する（235条）"}, {"aspect": "要件", "text": "多くの端数により市場価格が下落し適切な対価を期待できないため、その端数についての反対株主の株式買取請求権（182条の4）があり、価格協議が整わない場合に裁判所に対する価格決定の申立権（182条の5第2項）がある（趣旨：「取得対価」に不満な株主を保護するため）"}]}, {"id": "book-kigyoho-01-art182-4", "article": "182条の4", "chs": [3], "topics": ["株式併合（180条）によるキャッシュ・アウト"], "points": [{"aspect": "要件", "text": "多くの端数により市場価格が下落し適切な対価を期待できないため、その端数についての反対株主の株式買取請求権（182条の4）があり、価格協議が整わない場合に裁判所に対する価格決定の申立権（182条の5第2項）がある（趣旨：「取得対価」に不満な株主を保護するため）"}]}, {"id": "book-kigyoho-01-art183", "article": "183条", "chs": [3], "topics": ["株式の分割（183条～）"], "points": [{"aspect": "趣旨", "text": "趣旨：株式分割は基本的には既存株主に不利益を与えないので、株主総会特別決議は要求されていない"}, {"aspect": "定義", "text": "株式の分割とは、既発行株式を細分化して発行済株式総数を増加させること。分割がなされると発行済株式総数は増加するが、会社財産は変動しない"}, {"aspect": "要件", "text": "手続：株主総会の普通決議、または取締役会決議（取締役会設置会社）（183条2項）"}, {"aspect": "要件", "text": "183条2項3号より、特定の種類株式だけを分割することも可能"}]}, {"id": "book-kigyoho-01-art184", "article": "184条", "chs": [3], "topics": ["株式分割と発行可能株式総数の増加（184条2項）"], "points": [{"aspect": "制度名", "text": "株式の分割"}, {"aspect": "趣旨", "text": "184条2項の趣旨：株式分割と同時に、発行可能株式総数を分割割合の範囲内で増加しても、既存株主の支配比率に不利益を与えないため"}, {"aspect": "要件", "text": "184条2項：株式会社（現に二以上の種類の株式を発行しているものを除く。）は、466条の規定にかかわらず、株主総会の決議によらないで、前条第二項第二号の日における発行可能株式総数をその日の前日の発行可能株式総数に同項第一号の割合を乗じて得た数の範囲内で増加する定款の変更をすることができる"}, {"aspect": "要件", "text": "発行可能株式総数は定款に記載しなければならない（37条1項）。したがって発行可能株式総数を変更する場合、定款変更が必要となり、定款変更には本来は株主総会の特別決議が必要である（466条）。しかし、184条2項はその例外となる"}]}, {"id": "book-kigyoho-01-art185", "article": "185条", "chs": [3], "topics": ["株式無償割当て（185条～）"], "points": [{"aspect": "定義", "text": "株式無償割当てとは、会社が株主に対して、保有株式に応じて、新たな払込をさせないで当該会社の株式を交付する（割り当てる）ことをいう（185条）。無償割当てがなされると発行済株式総数は増加するが、会社財産は変動しない"}, {"aspect": "要件", "text": "手続：株主総会（取締役会設置会社にあっては、取締役会）の決議。ただし、定款に別段の定めがある場合は、この限りでない（186条3項）"}]}, {"id": "book-kigyoho-01-art186", "article": "186条", "chs": [3], "topics": ["株式無償割当て（185条～）"], "points": [{"aspect": "趣旨", "text": "186条3項の趣旨：株主割当てによって、基本的には既存株主に不利益を与えないため"}, {"aspect": "要件", "text": "手続：株主総会（取締役会設置会社にあっては、取締役会）の決議。ただし、定款に別段の定めがある場合は、この限りでない（186条3項）"}]}, {"id": "book-kigyoho-01-art188", "article": "188条", "chs": [3], "topics": ["単元株制度（188条～）と単元未満株主の権利"], "points": [{"aspect": "趣旨", "text": "原則として株主総会の特別決議を要求する趣旨：単元株式制度の採用及び単元株式数の増加により、議決権を失う株主が出てくる可能性もあるなど、既存株主に不利益のおそれがあるため"}, {"aspect": "定義", "text": "単元株制度とは、定款により、一定数の株式を一単元とし、単元株主には株主総会又は種類株主総会において一個の議決権を行使することを認めるが、単元未満株主にはその議決権の行使を認めないこととする制度をいう（188条1項）"}, {"aspect": "要件", "text": "単元未満株主の権利は189条に定めがある（見出しのみの記載）"}, {"aspect": "要件", "text": "単元未満株主の投下資本回収方法：①単元未満株式買取請求権（192条。趣旨：単元未満株主の投下資本回収のため）④単元未満株式売渡請求権（194条。趣旨：単元株主の権利を確保するため）"}, {"aspect": "その他", "text": "手続の表：単元株制度の採用・単元株式数増加の場合は、定款変更のための株主総会の特別決議（188条1項、466条、309条2項11号）と取締役の理由説明（190条）。例外191条。単元株制度を廃止・単元株式数減少の場合は、取締役の決定（取締役会設置会社では取締役会の決議）（195条1項）。理由は株主に不利益を与えないから"}]}, {"id": "book-kigyoho-01-art199", "article": "199条", "chs": [5], "topics": ["募集事項の決定（199条・200条・201条・202条）", "募集株式の発行等をめぐる視点（公開会社・非公開会社の保護の差異）", "（論点）有利発行規制（199条3項）と「特に有利な金額」の意義"], "points": [{"aspect": "定義", "text": "「特に有利な金額」とは、払込金額とすべき公正な払込金額に比べて特に低い払込金額をいう。公正な払込金額とは、募集株式の発行によって企画される会社の資金調達の目的が達せられる限度で、既存株主にとってもっとも有利な金額をいう"}, {"aspect": "要件", "text": "199条：1項＝募集事項の決定、2項＝株主総会によって決定、3項＝「特に有利な金額」の場合は株主総会に理由の説明を要する、4項＝譲渡制限種類株式発行会社が当該種類株式をさらに発行する場合は株主総会決議のほかに種類株主総会特別決議を要する（199条4項、324条2項2号）、5項＝募集事項は募集ごとに均等に定める"}, {"aspect": "要件", "text": "「特に有利な金額」（199条3項）での発行（有利発行）の場合は、公開会社・非公開会社を問わず、株主総会の特別決議と株主総会における取締役の理由の説明を要求している（201条1項、199条2項3項、309条2項5号）。有利発行は既存株主に経済的不利益（保有株式の希釈化による経済的損失）をもたらすおそれがあるからである"}, {"aspect": "結論", "text": "公開会社の場合は既存株主の経済的利益だけを保護し（201条1項、199条2項3項、309条2項5号）、支配的利益を保護していない。これは、公開会社では資金調達の機動性を図る必要性が高く、また既存株主は通常は市場で株式を購入することにより持株比率を維持できるからである"}, {"aspect": "結論", "text": "非公開会社の場合は既存株主の経済的利益のみならず支配的利益も保護している（199条2項、200条1項、309条2項5号）。これは、非公開会社では資金調達の機動性よりも株主間の緊密な関係の維持の方が重要であり、また既存株主は市場で株式を購入できず持株比率を維持する方法がないからである"}, {"aspect": "その他", "text": "表：公開会社では原則取締役会決議（株主割当ての場合も）で、有利発行（201条1項、199条3項）のみ株主総会の特別決議。非公開会社では株主総会の特別決議（有利発行の場合も、株主割当ての場合も）"}]}, {"id": "book-kigyoho-01-art200", "article": "200条", "chs": [5], "topics": ["募集事項の決定（199条・200条・201条・202条）"], "points": [{"aspect": "要件", "text": "200条［委任］1項：199条2項及び4項の規定にかかわらず、株主総会決議で、取締役または取締役会（取締役会設置会社の場合）へ委任できる"}]}, {"id": "book-kigyoho-01-art201", "article": "201条", "chs": [5], "topics": ["募集事項の決定（199条・200条・201条・202条）"], "points": [{"aspect": "要件", "text": "201条［公開会社の特則］1項：199条3項の場合を除き、199条2項の「株主総会」を「取締役会」とする"}, {"aspect": "その他", "text": "表：公開会社では原則取締役会決議（株主割当ての場合も）で、有利発行（201条1項、199条3項）のみ株主総会の特別決議。非公開会社では株主総会の特別決議（有利発行の場合も、株主割当ての場合も）"}]}, {"id": "book-kigyoho-01-art202", "article": "202条", "chs": [5], "topics": ["募集事項の決定（199条・200条・201条・202条）", "株主割当て（202条）"], "points": [{"aspect": "定義", "text": "株主割当てとは、既存の株主に持株数に比例して株式の割当てを受ける権利を付与して募集株式を割り当てる方法"}, {"aspect": "要件", "text": "202条［株主割り当て］3項：1号＝定款の定めがあれば取締役の決定で、2号＝定款の定めあれば取締役会の決議で、3号＝公開会社は取締役会決議で、4号＝前3号以外は株主総会決議で"}, {"aspect": "要件", "text": "（参）公開会社の募集株式の発行決定は原則として取締役会（201条1項、199条2項）。趣旨は迅速な資金調達を行えるようにするため（公開会社の株主は通常議決権比率に強い関心がない）"}, {"aspect": "要件", "text": "委任の特則：指名委員会等設置会社では執行役に委任可能（416条4項）。監査等委員会設置会社では399条の13第5項6項の場合は取締役に委任可能"}]}, {"id": "book-kigyoho-01-art202-2", "article": "202条の2", "chs": [5], "topics": ["上場会社が株式報酬として募集株式を発行する場合（202条の2第1項）"], "points": [{"aspect": "趣旨", "text": "202条の2第1項1号の趣旨：会社は取締役の職務執行の対価として募集株式を交付するのであるから、あえて取締役に財産の出資を求める必要はないから"}, {"aspect": "要件", "text": "202条の2第1項は、上場会社が株式報酬として募集株式を発行する場合の募集事項を定める"}]}, {"id": "book-kigyoho-01-art203", "article": "203条", "chs": [5], "topics": ["募集株式の申込み・割当て（203条〜206条の2）"], "points": [{"aspect": "要件", "text": "203条［募集株式の申込み］、204条［募集株式の割当て］。204条2項：募集株式が譲渡制限株式ならば、割当ての決定は株主総会の特別決議（cf. 309条2項5号）、取締役会決議（取締役会設置会社の場合）によるか、定款に別段の定めあればそれによる"}]}, {"id": "book-kigyoho-01-art206-2", "article": "206条の2", "chs": [5], "topics": ["募集株式の申込み・割当て（203条〜206条の2）", "（論点）206条の2（支配株主の変更を伴う募集株式の割当て等の特則）"], "points": [{"aspect": "趣旨", "text": "4項の趣旨：支配株主の変更は合併・株式交換等に準じる会社の基礎の変更であって、株主に影響があるから"}, {"aspect": "趣旨", "text": "5項の趣旨（2つの説明が併記）：支配株主の変更を伴う割当ては会社の経営者を決定する実質を伴うので取締役を選任する決議と類似するから。or 誰に会社の経営を支配させるかという問題は、誰を取締役として会社の経営を任せるかという問題と同様であるから、特別決議ではなく普通決議の承認を要求した"}, {"aspect": "要件", "text": "206条の2［公開会社における募集株式の割当て等の特則：支配株主の変更を伴う時］：原則通り取締役会決議によるが、1項＝株主への通知、4項＝総株主の議決権の1/10以上の株主の反対あれば株主総会決議が必要、5項＝それは341条と同じ普通決議"}, {"aspect": "要件", "text": "206条の2：原則通り取締役会決議による。ただし、1項＝株主への通知、4項＝総株主の議決権の1/10以上の株主の反対あれば株主総会決議が必要、5項＝それは341条と同じ普通決議"}]}, {"id": "book-kigyoho-01-art207", "article": "207条", "chs": [5], "topics": ["金銭以外の出資・出資の履行等（207条〜209条）", "（論点）金銭以外の財産の出資（207条・現物出資）"], "points": [{"aspect": "趣旨", "text": "現物出資の規制の趣旨：設立時と同様に、目的財産の過大な評価による不当な株式付与により、会社の財産的基礎を害するとともに金銭出資者を害するおそれがあるため、規制されている"}, {"aspect": "要件", "text": "207条［現物出資］：＜注＞①定款の記載は不要、②発起人に限らない"}, {"aspect": "要件", "text": "207条9項：検査役の調査が省略できる場合。5号は、いわゆるデット・エクイティ・スワップ"}, {"aspect": "比較", "text": "現物出資の問題。設立時の現物出資（3＋2など）との相違は、①定款の記載が不要、②発起人に限らない、の2点"}]}, {"id": "book-kigyoho-01-art208", "article": "208条", "chs": [3], "topics": ["権利株の譲渡制限（35条・50条2項・63条2項・208条4項）"], "points": [{"aspect": "制度名", "text": "権利株の譲渡制限"}, {"aspect": "趣旨", "text": "趣旨は、設立手続または募集株式発行手続の混乱防止（会社の利益保護）である"}, {"aspect": "要件", "text": "株主となる権利の譲渡は、成立後の株式会社に対抗することができない（35条、50条2項、63条2項、208条4項）"}, {"aspect": "要件", "text": "各条文の対象：35条は出資の履行前の発起人、50条2項は出資の履行後の発起人、63条2項は設立時募集株式の引受人、208条4項は募集株式の引受人について定める"}]}, {"id": "book-kigyoho-01-art209", "article": "209条", "chs": [5], "topics": ["金銭以外の出資・出資の履行等（207条〜209条）", "出資の履行の仮装の場合の責任等（213条の2・213条の3・209条）"], "points": [{"aspect": "趣旨", "text": "Aの支払・給付義務、Xの支払い義務の趣旨：①出資の履行が仮装された場合、これに関与していない株主から仮装した株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）、②会社の資金が確保されたと信じた会社債権者の保護の必要性"}, {"aspect": "要件", "text": "209条［株主となる時期等］の見出し"}, {"aspect": "要件", "text": "AまたはX・Yが義務を果たせば、Aは「株主の権利を行使すること」ができる（209条2項。例：議決権の行使、剰余金の配当請求）。趣旨は、会社財産が充実した以上、仮装払込をした引受人の権利行使を否定する理由はないから"}, {"aspect": "要件", "text": "B（譲受人）は、悪意・重過失でなければ「株主の権利を行使すること」ができる（209条3項）。趣旨は、株式取引の安全を図るため"}, {"aspect": "要件", "text": "A（引受人）の支払・給付義務（213条の2第1項）。無過失責任"}, {"aspect": "要件", "text": "X（仮装に関与した取締役・執行役）の支払義務（213条の3）。過失責任"}, {"aspect": "学説", "text": "趣旨をめぐる立場：会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加える。もっとも、213条の2第2項が総株主の同意で同条1項の義務の免除を認めていることからすると、②は不要か、という問題提起がある"}]}, {"id": "book-kigyoho-01-art210", "article": "210条", "chs": [5], "topics": ["（論点）募集株式の発行をやめることの請求（210条・差止請求）", "（論点）210条の差止事由と828条の無効原因の比較", "（論点）株主の差止請求（210条）を無視した新株発行の効力", "①ベルシステム24事件（東京高平決16・8・4）：主要目的論のあてはめ基準"], "points": [{"aspect": "趣旨", "text": "210条の趣旨：募集株式の発行等によって株主が不利益を受けるおそれがあるとき、取締役・執行役の違法行為差止請求権（360条1項、422条1項）では株主の保護は不十分であるので、株主の利益保護を図る必要があるため"}, {"aspect": "要件", "text": "210条の差止請求の＜要件＞欄（①②）"}, {"aspect": "結論", "text": "発行前は新たな株主が現れていないので取引の安全を考慮する必要はなく、差止事由は広く認めてもよい。これに対し、発行後は新たな株主が生まれ株式が流通することがあり得るので取引の安全を考慮する必要があり、新株発行の無効原因は重大な瑕疵（法令定款違反）に限る"}, {"aspect": "結論", "text": "差止めの仮処分等まで出ている場合にこれを無視した新株発行は無効（無効原因になる）。裁判所の公権的判断がなされている場合にまで有効としたのでは法秩序の維持という司法制度の目的に反し、また株主保護のために差止めを認めた210条の趣旨に反するからである。もっとも、口頭や書面で差止請求がされたにすぎない場合は、これを無視した新株発行は有効（無効原因にはならない）"}, {"aspect": "結論", "text": "公開会社において取締役会に募集株式の発行権限が認められた趣旨は、会社の機動的な資金調達の便宜のためである（201条1項、199条2項）。そうだとすると、募集株式の発行等の主要目的が、資金調達を超えて特定の株主の議決権比率の低下にある場合には、「著しく不公正な方法」（210条2号）にあたる。主要目的の判断は、資金調達の緊急性の要否や、事業計画の合理性・事業計画のための資金調達の必要性から判断する"}, {"aspect": "結論", "text": "そうだとすると、支配権維持目的があるからといってそれが主たる目的とはいえない。したがって、本件募集株式の発行は、「著しく不公正な方法」による株式発行とはいえない"}, {"aspect": "判例", "text": "最判平成5・12・16の立場である"}, {"aspect": "その他", "text": "図：株式発行をめぐる＜事前＞差止め（210条）と＜事後＞無効の訴え（828条）の対比。発行後は新たな株主Bが生まれ取引の安全の考慮が必要となる"}]}, {"id": "book-kigyoho-01-art211", "article": "211条", "chs": [5], "topics": ["募集に係る責任等の条文構造（211条〜213条の3）"], "points": [{"aspect": "要件", "text": "211条［引受の無効・取消の主張の制限］。＜比較＞設立時の51条1項2項、102条3項4項"}]}, {"id": "book-kigyoho-01-art212", "article": "212条", "chs": [5], "topics": ["募集に係る責任等の条文構造（211条〜213条の3）", "募集に係る責任等（212条・213条）"], "points": [{"aspect": "要件", "text": "212条［引受人の責任］1項：1号＝取締役と通じて著しく不公正な金額で引き受けた場合、2号＝現物出資財産の価額が著しく不足する場合"}, {"aspect": "その他", "text": "図：募集に係る責任の関係。引受人Aが取締役等Xと通じて著しく不公正な払込金額で金銭出資した場合・現物出資の価格が著しく不足した場合に、引受人の責任＝212条、取締役等の責任＝213条（cf. 設立時の52条責任と類似）"}]}, {"id": "book-kigyoho-01-art213", "article": "213条", "chs": [5], "topics": ["募集に係る責任等（212条・213条）", "出資の履行の仮装の場合の責任等（213条の2・213条の3・209条）"], "points": [{"aspect": "趣旨", "text": "Aの支払・給付義務、Xの支払い義務の趣旨：①出資の履行が仮装された場合、これに関与していない株主から仮装した株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）、②会社の資金が確保されたと信じた会社債権者の保護の必要性"}, {"aspect": "要件", "text": "A（引受人）の支払・給付義務（213条の2第1項）。無過失責任"}, {"aspect": "要件", "text": "X（仮装に関与した取締役・執行役）の支払義務（213条の3）。過失責任"}, {"aspect": "要件", "text": "B（譲受人）は、悪意・重過失でなければ「株主の権利を行使すること」ができる（209条3項）。趣旨は、株式取引の安全を図るため"}, {"aspect": "学説", "text": "趣旨をめぐる立場：会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加える。もっとも、213条の2第2項が総株主の同意で同条1項の義務の免除を認めていることからすると、②は不要か、という問題提起がある"}, {"aspect": "その他", "text": "図：募集に係る責任の関係。引受人Aが取締役等Xと通じて著しく不公正な払込金額で金銭出資した場合・現物出資の価格が著しく不足した場合に、引受人の責任＝212条、取締役等の責任＝213条（cf. 設立時の52条責任と類似）"}]}, {"id": "book-kigyoho-01-art213-2", "article": "213条の2", "chs": [5], "topics": ["出資の履行の仮装の場合の責任等（213条の2・213条の3・209条）"], "points": [{"aspect": "趣旨", "text": "Aの支払・給付義務、Xの支払い義務の趣旨：①出資の履行が仮装された場合、これに関与していない株主から仮装した株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）、②会社の資金が確保されたと信じた会社債権者の保護の必要性"}, {"aspect": "要件", "text": "A（引受人）の支払・給付義務（213条の2第1項）。無過失責任"}, {"aspect": "要件", "text": "213条の2第1項の条文：募集株式の引受人は、208条1項の規定による払込みを仮装した場合には、払込みを仮装した払込金額の全額の支払をする義務を負う"}, {"aspect": "要件", "text": "X（仮装に関与した取締役・執行役）の支払義務（213条の3）。過失責任"}, {"aspect": "要件", "text": "B（譲受人）は、悪意・重過失でなければ「株主の権利を行使すること」ができる（209条3項）。趣旨は、株式取引の安全を図るため"}, {"aspect": "学説", "text": "趣旨をめぐる立場：会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加える。もっとも、213条の2第2項が総株主の同意で同条1項の義務の免除を認めていることからすると、②は不要か、という問題提起がある"}]}, {"id": "book-kigyoho-01-art213-3", "article": "213条の3", "chs": [5], "topics": ["出資の履行の仮装の場合の責任等（213条の2・213条の3・209条）"], "points": [{"aspect": "趣旨", "text": "Aの支払・給付義務、Xの支払い義務の趣旨：①出資の履行が仮装された場合、これに関与していない株主から仮装した株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）、②会社の資金が確保されたと信じた会社債権者の保護の必要性"}, {"aspect": "要件", "text": "X（仮装に関与した取締役・執行役）の支払義務（213条の3）。過失責任"}, {"aspect": "要件", "text": "A（引受人）の支払・給付義務（213条の2第1項）。無過失責任"}, {"aspect": "要件", "text": "B（譲受人）は、悪意・重過失でなければ「株主の権利を行使すること」ができる（209条3項）。趣旨は、株式取引の安全を図るため"}, {"aspect": "学説", "text": "趣旨をめぐる立場：会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加える。もっとも、213条の2第2項が総株主の同意で同条1項の義務の免除を認めていることからすると、②は不要か、という問題提起がある"}]}, {"id": "book-kigyoho-01-art215", "article": "215条", "chs": [3], "topics": ["（論点）会社による株券長期間不発行の場合の株券発行前の株式譲渡の効力"], "points": [{"aspect": "制度名", "text": "株券の発行、遅滞なく"}, {"aspect": "要件", "text": "問題の所在：遅滞なく株券を発行する義務を負う（215条1項）にもかかわらず株券発行会社が長期間株券を発行しない場合にも、株券なしで行われた株式譲渡は会社に対して効力を有しないかが問題となる"}]}, {"id": "book-kigyoho-01-art238", "article": "238条", "chs": [5], "topics": [], "points": [{"aspect": "制度名", "text": "Ⅱ□新株予約権の発行：238条～。□新株予約権発行の差止請求：247条。□社債とくれば：676条～"}]}, {"id": "book-kigyoho-01-art247", "article": "247条", "chs": [5], "topics": ["（1）新株予約権の発行（238条～）と247条差止め", "②ニッポン放送事件（東京高決平成17・3・23）：主要目的でも不公正発行に当たらない場合", "③ブルドックソース事件（論点1）247条類推適用の可否"], "points": [{"aspect": "要件", "text": "247条（募集新株予約権の発行をやめることの請求）全文：次に掲げる場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、第二百三十八条第一項の募集に係る新株予約権の発行をやめることを請求することができる。一 当該新株予約権の発行が法令又は定款に違反する場合、二 当該新株予約権の発行が著しく不公正な方法により行われる場合"}, {"aspect": "要件", "text": "（論点1）Xによる当該新株予約権の無償割当ての差止め（247条類推適用）が認められるか。↓Yes（本決定では争われておらず）。247条（類推適用）の要件：①当該新株予約権の無償割当が法令定款に違反すること、または、著しく不公正な方法により行われたこと、②株主が不利益を受けるおそれがあること。（論点2）差別的条件を有する本件新株予約権無償割当ては、株主平等原則（109条）違反という法令違反、および、不公正発行に該当するといえるか"}, {"aspect": "結論", "text": "経営支配権の維持・獲得を目的とした新株予約権の発行は原則「著しく不公正な方法」による発行にあたる（誰を経営者としてどのような方針で経営させるかは、株主総会における取締役選任を通じて株主が資本多数決によって決すべき問題だから）。しかし、株主全体の利益保護の観点から、敵対的買収者が真摯に合理的な経営を目指すものでなく、敵対買収者による支配権取得が会社に回復しがたい損害をもたらす事情があることを会社が疎明、立証した場合には、当該新株予約権の発行は「著しく不公正な方法」による発行に当たらない"}, {"aspect": "結論", "text": "（論点1の論述）新株予約権無償割当て（277条）によって、通常は既存株主が不利益を受けるおそれがないので差止め請求を認める規定はない。しかし、新株予約権無償割当てによって既存株主が不利益を受けるおそれがある場合には、募集新株予約権発行（238条）によって既存株主が不利益を受けるおそれがある場合と変わるところはない。したがって、新株予約権無償割当てにも新株予約権発行の差止めの規定（247条）が類推適用される"}, {"aspect": "その他", "text": "図：ブルドックソース事件の事案。Y社は取締役会決議で決定できるのに（278条3項）、定款で株主総会の特別決議事項とした。新株予約権の無償割当て（①一株につき新株予約権3個、②Xは新株予約権を行使できない（差別的条件）、③Xからは1個約400円で、X以外からは1個につきY株1個の対価でY社は新株予約権を取得できる（取得条項付き））に対し、株主X（買収目的で公開買付け中）が差止め（247条類推適用）を求める。結果、AとXの持株比率1：1が4：1となり新株予約権無償割当ては買収防衛策となる"}]}, {"id": "book-kigyoho-01-art295", "article": "295条", "chs": [2], "topics": ["（論点）取締役会設置会社である非公開会社における、株主総会決議により代表取締役を選定する旨の定款の効力", "取締役会非設置会社の機関構造と株主総会の権限（295条・348条・349条）"], "points": [{"aspect": "要件", "text": "295条2項：取締役会設置会社において株主総会は、法律及び定款で定めた事項に限り決議できる"}, {"aspect": "要件", "text": "295条1項：株主総会は、会社法に規定する事項及び会社の組織・運営・管理その他会社に関する一切の事項について決議できる"}, {"aspect": "結論", "text": "結論：取締役会の決議によるほか株主総会の決議によっても代表取締役を定めることができる旨の定款の定めは有効であり、Aは代表取締役といえるので乙社の代金請求は認められる"}, {"aspect": "結論", "text": "有効とする理由：定款により株主総会の権限とできる範囲を制限する明文規定はなく、株主総会決議による選定を認めても取締役会の権限（362条2項3号）は否定されず、取締役会の監督権限の実効性を失わせるとはいえない"}, {"aspect": "学説", "text": "別解：代表取締役の選定・解職を取締役会の権限とした趣旨は合理的経営の確保にあるが、本来株主の意思で会社の代表者を定めるものであり、合理的経営という利益を株主は放棄することもできるから、定款の定めは有効"}]}, {"id": "book-kigyoho-01-art298", "article": "298条", "chs": [2], "topics": ["書面投票・電子投票（298条1項3号4号、311条、312条）", "議決権の行使方法の原則と例外", "全員出席総会（招集手続を欠く総会の効力）"], "points": [{"aspect": "趣旨", "text": "書面投票・電子投票の趣旨：株主に議決権行使の機会を保障し、できるだけ多くの株主の意思を株主総会決議に反映させるため"}, {"aspect": "要件", "text": "例外：①の例外は議決権の代理行使（310条）と書面投票・電子投票（298条1項3号4号、311条、312条）、②の例外は議決権の不統一行使（313条）"}, {"aspect": "結論", "text": "原則：株主総会は取締役会の招集決定（298条4項）により代表取締役が招集するものであり（296条3項）、取締役を辞任したAが招集した本件総会決議は不存在であるのが原則（830条1項参照）"}]}, {"id": "book-kigyoho-01-art299", "article": "299条", "chs": [2], "topics": ["株主総会の招集通知（299条）と招集手続の省略・全員出席総会"], "points": [{"aspect": "制度名", "text": "株主総会の招集通知"}, {"aspect": "趣旨", "text": "招集通知期間の趣旨は、株主の出席の機会と準備の余裕を与えるため"}, {"aspect": "要件", "text": "299条1項（原則）：株主総会を招集するには、取締役は株主総会の日の二週間（公開会社でない会社では一週間、取締役会非設置会社で定款で下回る期間を定めた場合はその期間）前までに株主に対して通知を発しなければならない"}, {"aspect": "判例", "text": "例外②全員出席総会：招集権者による適法な招集手続がなくても、株主全員が開催に同意して出席した全員出席総会は適法に成立する（最判昭和60・12・20）"}]}, {"id": "book-kigyoho-01-art300", "article": "300条", "chs": [2], "topics": ["全員出席総会（招集手続を欠く総会の効力）", "株主総会の招集通知（299条）と招集手続の省略・全員出席総会"], "points": [{"aspect": "趣旨", "text": "修正規範：招集手続の趣旨は株主に総会への出席の機会と準備の余裕を与えることにあるため、招集権者による招集手続を欠いても株主全員が開催に同意し出席した場合は株主が自ら利益を放棄したといえ、総会決議は有効となる"}, {"aspect": "趣旨", "text": "招集通知期間の趣旨は、株主の出席の機会と準備の余裕を与えるため"}, {"aspect": "趣旨", "text": "300条ただし書きの趣旨：書面・電子投票制度を採用した場合は招集手続は省略されない。参考書類は招集通知とともに交付されるため、招集通知が不要となれば参考書類も交付できなくなるから"}, {"aspect": "結論", "text": "代理人出席の場合：株主が議題を了知したうえで代理人を出席させ、決議がその議題の範囲内で行われるものであれば、招集手続の瑕疵は治癒され決議は有効に成立する"}, {"aspect": "結論", "text": "原則：株主総会は取締役会の招集決定（298条4項）により代表取締役が招集するものであり（296条3項）、取締役を辞任したAが招集した本件総会決議は不存在であるのが原則（830条1項参照）"}, {"aspect": "判例", "text": "例外②全員出席総会：招集権者による適法な招集手続がなくても、株主全員が開催に同意して出席した全員出席総会は適法に成立する（最判昭和60・12・20）"}, {"aspect": "比較", "text": "300条（招集手続の省略）との相違1：300条は欠席した株主がいても決議が有効となる規定であり、事前の同意でなければならないと考えられている"}, {"aspect": "比較", "text": "300条との相違2：300条で省略できるのは299条の手続（招集期間の短縮・招集通知の省略）のみで、招集の決定（298条）は省略できない"}]}, {"id": "book-kigyoho-01-art303", "article": "303条", "chs": [2], "topics": ["株主提案権（303条〜305条）"], "points": [{"aspect": "趣旨", "text": "株主提案権の趣旨：株主の意見を株主総会に反映させやすくすることを通じて、会社・株主、株主相互の意思疎通を図り、株主総会の活性化を図るため"}, {"aspect": "趣旨", "text": "303条が少数株主権を含むのに304条が単独株主権のみである理由に関わる区別：少数株主権の趣旨は株主権の濫用防止。議題とは「取締役選任の件」、議案とは「甲を取締役に選任する件」"}, {"aspect": "要件", "text": "3つの権利：a）議題提案権（303条）、b）議案提案権（304条）、c）議案の要領の通知請求権（305条）"}, {"aspect": "その他", "text": "タイムライン図：総会の8週間前に①303条で議題化を請求し（例「剰余金配当請求」）、②305条で議案要領の通知を請求するのが通常セット。2週間前に株主に招集通知が発送される。303条・305条は（少数・単独の）株主権、304条は単独株主権"}]}, {"id": "book-kigyoho-01-art304", "article": "304条", "chs": [2], "topics": ["株主提案権（303条〜305条）"], "points": [{"aspect": "趣旨", "text": "株主提案権の趣旨：株主の意見を株主総会に反映させやすくすることを通じて、会社・株主、株主相互の意思疎通を図り、株主総会の活性化を図るため"}, {"aspect": "要件", "text": "3つの権利：a）議題提案権（303条）、b）議案提案権（304条）、c）議案の要領の通知請求権（305条）"}]}, {"id": "book-kigyoho-01-art305", "article": "305条", "chs": [2], "topics": ["株主提案権（303条〜305条）"], "points": [{"aspect": "趣旨", "text": "株主提案権の趣旨：株主の意見を株主総会に反映させやすくすることを通じて、会社・株主、株主相互の意思疎通を図り、株主総会の活性化を図るため"}, {"aspect": "要件", "text": "3つの権利：a）議題提案権（303条）、b）議案提案権（304条）、c）議案の要領の通知請求権（305条）"}, {"aspect": "その他", "text": "タイムライン図：総会の8週間前に①303条で議題化を請求し（例「剰余金配当請求」）、②305条で議案要領の通知を請求するのが通常セット。2週間前に株主に招集通知が発送される。303条・305条は（少数・単独の）株主権、304条は単独株主権"}]}, {"id": "book-kigyoho-01-art308", "article": "308条", "chs": [2], "topics": ["議決権と一株一議決権の原則（308条）"], "points": [{"aspect": "趣旨", "text": "一株一議決権の理由：資本団体たる株式会社では、資本的貢献度に応じた扱いをする方がかえって平等であるから"}, {"aspect": "趣旨", "text": "相互保有株式について議決権を否定する趣旨：被支配会社が支配会社株式につき議決権を持つと、議決権の歪曲化等の会社支配の不公正や資本の空洞化をもたらすおそれがあるため（図では乙社が甲社株式を25%以上保有する関係）"}, {"aspect": "要件", "text": "一株一議決権の原則：株主は株主総会において、その有する株式一株につき一個の議決権を有する（308条1項）"}, {"aspect": "要件", "text": "議決権が認められない場合（一株一議決権原則の例外）：①議決権制限株式（108条1項3号）、②自己株式（308条2項）、③相互保有株式（308条1項本文かっこ書）、④単元未満株式（189条1項、308条1項ただし書）、⑤基準日後に取得した株式（124条1項4項）、⑥自己株式の売主（140条3項、160条4項、175条2項）"}]}, {"id": "book-kigyoho-01-art309", "article": "309条", "chs": [2, 3, 6, 8, 10], "topics": ["株主総会の決議の成立要件（309条）"], "points": [{"aspect": "要件", "text": "決議の種類：普通決議（309条1項）、特別決議（309条2項）、特殊決議I（309条3項。1号は公開会社を非公開会社にする定款変更）、特殊決議II（309条4項）"}, {"aspect": "要件", "text": "309条5項：取締役会設置会社においては株主総会は、株主総会の目的たる事項（議題）以外の事項については議決できない"}]}, {"id": "book-kigyoho-01-art310", "article": "310条", "chs": [2], "topics": ["（論点）代理人を株主に限定する定款規定の効力（定款による代理人資格の制限）"], "points": [{"aspect": "制度名", "text": "議決権の代理行使"}, {"aspect": "趣旨", "text": "310条の趣旨は、株主に議決権行使の機会を保障すること"}, {"aspect": "結論", "text": "定款規定の有効性：代理人資格を制限すべき合理的理由がある場合に、定款によって相当程度の制限を加えることまで310条は禁止していない。総会のかく乱防止を趣旨とする本問の定款規定は合理的理由があり相当程度の制限といえるので有効"}, {"aspect": "結論", "text": "定款規定の適用排除：定款規定の趣旨から、具体的事案において株主以外の第三者による株主総会のかく乱のおそれがない場合は、当該定款規定の適用が排除される"}, {"aspect": "判例", "text": "判例：総会のかく乱防止の趣旨で置かれた代理人資格制限の定款規定は「合理的理由による相当程度の制限である」から有効（最判昭和43・11・1）。これにより総会屋を一定程度排除できる"}, {"aspect": "判例", "text": "適用排除の裁判例：①病気入院中の株主が非株主である息子・甥に代理行使した場合（大阪高判昭和41・8・8）、②株主たる地方公共団体や株式会社が職員・従業員に代理行使した場合（最判昭和51・12・24）には、例外的に非株主の議決権行使が認められている"}]}, {"id": "book-kigyoho-01-art311", "article": "311条", "chs": [2], "topics": ["書面投票・電子投票（298条1項3号4号、311条、312条）", "議決権の行使方法の原則と例外"], "points": [{"aspect": "趣旨", "text": "書面投票・電子投票の趣旨：株主に議決権行使の機会を保障し、できるだけ多くの株主の意思を株主総会決議に反映させるため"}, {"aspect": "要件", "text": "例外：①の例外は議決権の代理行使（310条）と書面投票・電子投票（298条1項3号4号、311条、312条）、②の例外は議決権の不統一行使（313条）"}]}, {"id": "book-kigyoho-01-art312", "article": "312条", "chs": [2], "topics": ["書面投票・電子投票（298条1項3号4号、311条、312条）", "議決権の行使方法の原則と例外"], "points": [{"aspect": "趣旨", "text": "書面投票・電子投票の趣旨：株主に議決権行使の機会を保障し、できるだけ多くの株主の意思を株主総会決議に反映させるため"}, {"aspect": "要件", "text": "例外：①の例外は議決権の代理行使（310条）と書面投票・電子投票（298条1項3号4号、311条、312条）、②の例外は議決権の不統一行使（313条）"}]}, {"id": "book-kigyoho-01-art313", "article": "313条", "chs": [2], "topics": ["議決権の不統一行使（313条）"], "points": [{"aspect": "制度名", "text": "議決権の不統一行使"}, {"aspect": "趣旨", "text": "313条3項の趣旨：複数の実質上の株主の意向を株主総会に反映するため"}, {"aspect": "要件", "text": "会社が株主の議決権不統一行使を拒むことができないのは「他人のために株式を有する者」（313条3項）"}]}, {"id": "book-kigyoho-01-art314", "article": "314条", "chs": [2], "topics": ["取締役等の説明義務（314条）と株主の質問権"], "points": [{"aspect": "制度名", "text": "取締役等の説明義務"}, {"aspect": "定義", "text": "一括回答とは、株主総会に先だって多数の質問状が出されている場合（いわゆる事前質問）に、会社側が事前質問事項のうち必要と思われるものにつき、株主からの質問を待つことなく株主総会であらかじめ一括して説明・回答すること"}, {"aspect": "要件", "text": "314条：取締役、会計参与、監査役及び執行役は、株主総会において株主から特定の事項について説明を求められた場合には、当該事項について必要な説明をしなければならない（ただし、総会の目的事項に関しない場合、株主の共同の利益を著しく害する場合その他法務省令で定める正当な理由がある場合を除く）"}, {"aspect": "要件", "text": "説明義務の要件は、①株主総会において株主から特定の事項について説明を求められたこと、②ただし書き列挙事由にあたらないこと。効果は必要な説明義務の発生"}, {"aspect": "効果", "text": "説明義務違反の効果：必要な説明がなく株主総会決議がなされたときは「決議方法の法令違反」という取消原因になる（831条1項1号）"}, {"aspect": "結論", "text": "一括回答の適法性：株主総会において株主からの質問がなされていない以上、要件①を満たさず取締役等に必要な説明義務はそもそも発生していないため、一括回答をしても314条違反はなく、決議取消しの訴えは認められない"}, {"aspect": "判例", "text": "（論点）「必要な説明」の程度：平均的な株主が、議題について合理的な理解・判断をするために客観的に必要と認められる程度で足りる（東京地判平成16・5・13）"}]}, {"id": "book-kigyoho-01-art319", "article": "319条", "chs": [2], "topics": ["株主総会の決議の省略（319条）"], "points": [{"aspect": "制度名", "text": "株主総会決議の省略"}, {"aspect": "要件", "text": "制度の所在：株主総会の決議の省略は319条。取締役会の決議の省略（370条）が参照される"}]}, {"id": "book-kigyoho-01-art322", "article": "322条", "chs": [2, 3, 10], "topics": ["種類株主総会（322条・324条2項）", "種類株主に損害を及ぼすおそれがある場合の種類株主総会決議（322条）と111条の特則関係"], "points": [{"aspect": "要件", "text": "種類株主に損害を及ぼすおそれがあれば、322条・324条2項の種類株主総会の特別決議が必要"}, {"aspect": "要件", "text": "例外とその要件：種類株主に損害を及ぼすおそれがあるときでも種類株主総会決議を不要とする旨の定款規定を定めることができる（322条2項）が、その定款を定めるためには当該種類株主全員の同意が必要である（322条4項）"}, {"aspect": "要件", "text": "ある種類株式の種類株主に損害を及ぼすおそれがある場合は、その種類株主総会の特別決議（322条1項1号、324条2項4号）が上記手続に加わる。111条は322条の特則で前者を優先する"}, {"aspect": "効果", "text": "代償措置：不要とする定款がある場合で種類株主に損害を及ぼすおそれがあるときは、代わりに反対株主の株式買取請求権が認められている（116条1項3号）"}]}, {"id": "book-kigyoho-01-art324", "article": "324条", "chs": [2, 3, 10], "topics": ["種類株主総会（322条・324条2項）"], "points": [{"aspect": "要件", "text": "種類株主に損害を及ぼすおそれがあれば、322条・324条2項の種類株主総会の特別決議が必要"}, {"aspect": "要件", "text": "例外とその要件：種類株主に損害を及ぼすおそれがあるときでも種類株主総会決議を不要とする旨の定款規定を定めることができる（322条2項）が、その定款を定めるためには当該種類株主全員の同意が必要である（322条4項）"}, {"aspect": "効果", "text": "代償措置：不要とする定款がある場合で種類株主に損害を及ぼすおそれがあるときは、代わりに反対株主の株式買取請求権が認められている（116条1項3号）"}]}, {"id": "book-kigyoho-01-art326", "article": "326条", "chs": [2, 7], "topics": ["持分会社の基本構造（社員の個性重視・所有と経営の一致）"], "points": [{"aspect": "制度名", "text": "機関設計の自由"}, {"aspect": "比較", "text": "（参）株式会社では、株主の個性は（それほど）重視されない。104条は株主の間接有限責任、326条1項は所有と経営の分離"}]}, {"id": "book-kigyoho-01-art327", "article": "327条", "chs": [2], "topics": [], "points": [{"aspect": "制度名", "text": "機関設計自由の原則の例外 ― 327条、328条"}]}, {"id": "book-kigyoho-01-art327-2", "article": "327条の2", "chs": [2], "topics": ["（参考）社外取締役の設置義務（327条の2）と業務の執行の社外取締役への委託（348条の2）"], "points": [{"aspect": "制度名", "text": "公開会社である監査役会設置会社の社外取締役の設置強制"}, {"aspect": "要件", "text": "327条の2（社外取締役の設置義務）：監査役会設置会社（公開会社であり、かつ、大会社であるものに限る。）であって金融商品取引法第二十四条第一項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならないものは、社外取締役を置かなければならない"}]}, {"id": "book-kigyoho-01-art328", "article": "328条", "chs": [2], "topics": [], "points": [{"aspect": "制度名", "text": "機関設計自由の原則の例外 ― 327条、328条"}]}, {"id": "book-kigyoho-01-art329", "article": "329条", "chs": [2], "topics": ["取締役の選任（329条1項・341条・342条）", "会計参与の条文全体像（329条〜選任・解任／374条〜権限）", "会計監査人の条文全体像と「役員ではない」ことの帰結（329条1項）", "会計監査人の選任（329条1項・309条1項、341条不適用）", "（参照）選任・解任関係の条文一覧（329条〜347条）"], "points": [{"aspect": "要件", "text": "取締役の選任は株主総会の普通決議による（329条1項、341条）。309条1項の決議ではない"}, {"aspect": "要件", "text": "「会計参与」とくれば、①329条〜（役員等の選・解任）、②374条〜（権限）"}, {"aspect": "要件", "text": "「会計監査人」とくれば、①329条〜（役員等の選・解任）、②396条〜（権限）"}, {"aspect": "要件", "text": "選任は株主総会の普通決議でする（329条1項、309条1項）。341条は不適用"}, {"aspect": "要件", "text": "329条[役員・会計監査人の選任・解任]〜：第1款 選任、第2款 解任、第3款 選任及び解任の手続に関する特則。341条（役員の選任及び解任の株主総会の決議）、342条（累積投票による取締役の選任）、342条の2（監査等委員である取締役等の選任等についての意見の陳述）、343条、344条、344条の2、345条、346条（役員等に欠員を生じた場合の措置）、347条（種類株主総会における取締役又は監査役の選任等）"}, {"aspect": "要件", "text": "累積投票による取締役の選任（342条）"}, {"aspect": "結論", "text": "会計監査人は、役員ではない（329条1項参照）"}, {"aspect": "結論", "text": "帰結③：報酬は、定款・株主総会決議で定めない"}]}, {"id": "book-kigyoho-01-art330", "article": "330条", "chs": [2], "topics": ["会計参与の善管注意義務（330条・民法644条）", "会計監査人の善管注意義務（330条・民法644条）", "善管注意義務（330条・402条3項・民法644条）"], "points": [{"aspect": "要件", "text": "会社と会計参与の関係は委任に関する規定に従う（330条）。したがって、会計参与は会社に対して善管注意義務（330条、民法644条）を負う"}, {"aspect": "要件", "text": "会社と会計監査人の関係は委任に関する規定に従う（330条）。したがって、会計監査人は会社に対して善管注意義務（330条、民法644条）を負う"}, {"aspect": "要件", "text": "330条（株式会社と役員等との関係）：株式会社と役員及び会計監査人との関係は、委任に関する規定に従う"}]}, {"id": "book-kigyoho-01-art331", "article": "331条", "chs": [2], "topics": [], "points": [{"aspect": "制度名", "text": "所有と経営の分離 ― 326条1項（非公開会社の場合は、331条2項本文も可能）"}]}, {"id": "book-kigyoho-01-art336", "article": "336条", "chs": [2], "topics": ["監査役の選任・解任に関する制度（329条〜）"], "points": [{"aspect": "趣旨", "text": "336条（監査役の任期）：監査役の任期を長期とし短縮ができないとしたのは、任期の面から監査役の独立性を確保するため"}]}, {"id": "book-kigyoho-01-art339", "article": "339条", "chs": [2], "topics": ["取締役の解任（339条）と解任を争う方法", "（論点）解任について「正当な理由」がないとは", "（論点）339条2項の「損害」とは", "会計監査人の終任と解任（339条・340条、854条は使えない）"], "points": [{"aspect": "制度名", "text": "取締役（役員）の解任とくれば"}, {"aspect": "趣旨", "text": "339条2項の趣旨は、株主は役員等を自由に解任できるので（同条1項）、せめて役員等の経済的利益は広く救済しようとするもの"}, {"aspect": "趣旨", "text": "339条2項の趣旨から、「正当な理由がないこと」は広く考える（「正当な理由」は狭く解する）。「損害」は残存在任期間分の報酬や退職金などの喪失と解する"}, {"aspect": "要件", "text": "339条1項：役員及び会計監査人は、いつでも、株主総会の決議によって解任することができる"}, {"aspect": "要件", "text": "339条2項：解任された者は、正当な理由がある場合を除き、会社に対し、解任によって生じた損害の賠償を請求できる"}, {"aspect": "要件", "text": "339条2項の損害賠償請求の要件（①株主総会の普通決議により解任された者であること、②解任について「正当な理由」がないこと）と効果（解任によって生じた損害賠償請求の発生）"}, {"aspect": "要件", "text": "終任事由は任期の満了・辞任・解任・死亡。特に問題になるのは解任"}, {"aspect": "要件", "text": "解任とくれば、①339条（株主総会による解任）、②854条（役員解任の訴え）のはずである"}, {"aspect": "結論", "text": "「正当な理由」がないとは、当該役員等に経営等を行わせしめるに当たって障害となるべき状況が客観的に生じた場合でないことをいう"}]}, {"id": "book-kigyoho-01-art340", "article": "340条", "chs": [2], "topics": ["会計監査人の終任と解任（339条・340条、854条は使えない）"], "points": [{"aspect": "要件", "text": "終任事由は任期の満了・辞任・解任・死亡。特に問題になるのは解任"}, {"aspect": "要件", "text": "解任とくれば、①339条（株主総会による解任）、②854条（役員解任の訴え）のはずである"}]}, {"id": "book-kigyoho-01-art341", "article": "341条", "chs": [2], "topics": ["取締役の選任（329条1項・341条・342条）", "会計監査人の選任（329条1項・309条1項、341条不適用）"], "points": [{"aspect": "要件", "text": "取締役の選任は株主総会の普通決議による（329条1項、341条）。309条1項の決議ではない"}, {"aspect": "要件", "text": "選任は株主総会の普通決議でする（329条1項、309条1項）。341条は不適用"}, {"aspect": "要件", "text": "累積投票による取締役の選任（342条）"}]}, {"id": "book-kigyoho-01-art342", "article": "342条", "chs": [2], "topics": ["取締役の選任（329条1項・341条・342条）"], "points": [{"aspect": "制度名", "text": "累積投票による取締役選任"}, {"aspect": "要件", "text": "累積投票による取締役の選任（342条）"}, {"aspect": "要件", "text": "取締役の選任は株主総会の普通決議による（329条1項、341条）。309条1項の決議ではない"}]}, {"id": "book-kigyoho-01-art343", "article": "343条", "chs": [2], "topics": ["監査役の選任・解任に関する制度（329条〜）", "監査役による会計監査人の選任議案内容の決定（344条）"], "points": [{"aspect": "趣旨", "text": "343条（監査役の選任に関する監査役の同意等）の趣旨は、監査役の独立性を確保するためである"}, {"aspect": "要件", "text": "（参）343条（監査役の選任に関する監査役の同意等）、344条（会計監査人の選任等に関する議案の内容の監査役による決定）、344条の2（監査等委員である取締役の選任に関する監査等委員会の同意等）"}]}, {"id": "book-kigyoho-01-art344", "article": "344条", "chs": [2], "topics": ["監査役による会計監査人の選任議案内容の決定（344条）"], "points": [{"aspect": "趣旨", "text": "趣旨は、会計監査人の独立性確保のため"}, {"aspect": "要件", "text": "監査役による選任の議案内容の決定（344条）"}]}, {"id": "book-kigyoho-01-art345", "article": "345条", "chs": [2], "topics": ["会計参与等の選任等についての意見の陳述（345条）", "会計監査人の選任等についての意見の陳述（345条1項5項）"], "points": [{"aspect": "趣旨", "text": "趣旨は、会計参与の独立性確保のため"}, {"aspect": "趣旨", "text": "趣旨は、会計監査人の独立性確保のため"}, {"aspect": "要件", "text": "345条（会計参与等の選任等についての意見の陳述）"}, {"aspect": "要件", "text": "会計監査人の選任についての当該会計監査人の意見の陳述（345条1項5項）"}]}, {"id": "book-kigyoho-01-art348", "article": "348条", "chs": [2, 11], "topics": ["取締役会非設置会社の機関構造と株主総会の権限（295条・348条・349条）"], "points": [{"aspect": "制度名", "text": "取締役会非設置会社"}, {"aspect": "要件", "text": "348条3項：各取締役に意思決定を委任できない事項がある（cf. 362条4項）"}, {"aspect": "その他", "text": "機関構造表：業務執行の意思決定＝取締役・取締役の過半数（348条1項2項）、業務執行＝各取締役（348条1項）、代表＝各取締役（349条1項2項）"}]}, {"id": "book-kigyoho-01-art348-2", "article": "348条の2", "chs": [2], "topics": ["（参考）社外取締役の設置義務（327条の2）と業務の執行の社外取締役への委託（348条の2）"], "points": [{"aspect": "制度名", "text": "業務の執行の社外取締役への委託"}, {"aspect": "要件", "text": "348条の2（令和元年新設）：株式会社（指名委員会等設置会社を除く。）が社外取締役を置いている場合において、当該株式会社と取締役との利益が相反する状況にあるとき、その他取締役が当該株式会社の業務を執行することにより株主の利益を損なうおそれがあるときは、当該株式会社は、その都度、取締役の決定（取締役会設置会社にあっては、取締役会の決議）によって、当該株式会社の業務を執行することを社外取締役に委託することができる"}, {"aspect": "要件", "text": "348条の2第3項：前二項の規定により委託された業務の執行は、第二条第十五号イに規定する株式会社の業務の執行に該当しないものとする。ただし、社外取締役が業務執行取締役（指名委員会等設置会社にあっては、執行役）の指揮命令により当該委託された業務を執行したときは、この限りでない"}, {"aspect": "その他", "text": "348条の2の図：甲会社と取締役Bとの「利益が相反する状況」があり、代表取締役Aが業務執行するのは望ましくないため、社外取締役Xに業務執行を委託する関係図"}]}, {"id": "book-kigyoho-01-art349", "article": "349条", "chs": [2], "topics": ["取締役会非設置会社の機関構造と株主総会の権限（295条・348条・349条）", "代表取締役の権限の全体像（349条4項・5項）", "（問題）取締役会規則による事前承認を欠く保証と349条5項"], "points": [{"aspect": "制度名", "text": "代表権の包括的不可制限性"}, {"aspect": "定義", "text": "「前項の権限に加えた制限」とは、取締役会規則（単に内規とよばれることもある）や定款により代表取締役の権限に加えた制限（内部的制限）である"}, {"aspect": "定義", "text": "「対抗」とは、発生している法律事実や法律効果を、第三者に「主張」できない（できる）の問題をいう"}, {"aspect": "要件", "text": "349条4項5項は包括的不可制限的代表権を定める（後述）。取締役会設置会社でも同様"}, {"aspect": "要件", "text": "代表取締役の権限は、a）一定の事項についての意思決定権、b）業務執行権（対内的、363条1項1号）、c）代表権（対外的、349条）からなる"}, {"aspect": "要件", "text": "349条4項：代表取締役は、株式会社の業務に関する一切の裁判上又は裁判外の行為をする権限を有する"}, {"aspect": "要件", "text": "349条5項：前項の権限に加えた制限は、善意の第三者に対抗することができない"}, {"aspect": "結論", "text": "349条5項の「善意」とは、善意・無重過失と解する（有力説）"}, {"aspect": "結論", "text": "意思決定権について、代表取締役は、①取締役会から委任された事項について決定できる（362条4項柱書参照）。また、②選定された以上当然に、日常的細目的事項についても代表取締役は決定できると解する"}]}, {"id": "book-kigyoho-01-art354", "article": "354条", "chs": [2], "topics": ["（論点）表見代表取締役（354条）の要件", "表見代表取締役の解答例にみる論点群（「付した」・「善意」・354条と908条1項の関係）", "（論点）354条類推適用の可否（使用人の場合）", "354条と908条の関係（ケース1〜ケース4）"], "points": [{"aspect": "制度名", "text": "表見代表取締役"}, {"aspect": "要件", "text": "原則：代表権のない取締役が会社を代表して行為をしても、それは無権代表行為であって、その効果は会社に帰属しない（効果不帰属）"}, {"aspect": "要件", "text": "354条：株式会社は、①代表取締役以外の取締役に社長、副社長その他株式会社を代表する権限を有するものと認められる名称を②付した場合には、当該取締役がした行為について、③善意の第三者に対してその責任を負う"}, {"aspect": "要件", "text": "354条の要件は、①（虚偽の外観の存在）②（本人の帰責性、外観への与因）③（外観への信頼）である"}, {"aspect": "要件", "text": "類推適用の要件：①使用人が社長、副社長その他の株式会社を代表する権限を有する名称で取引を行い、②会社がその名称を「付した」といえ、③相手方が善意（・無重過失）の場合には、相手方は会社に対して取引の効果を主張することができる"}, {"aspect": "結論", "text": "（論点）354条の「付した」には黙示の許諾も含む。黙示に許諾とは、取締役が一人でもその名称の使用を知っていれば足りると解する。取締役が一人でも知っていれば取締役会を招集でき（366条）、外観作出を阻止できたからである"}, {"aspect": "結論", "text": "（論点）354条の「善意」は、重過失は悪意と同視しうることから、善意・無重過失を意味する"}, {"aspect": "結論", "text": "（論点）354条と908条1項の関係：354条の適用場面がほとんどなく同条が無意味になってしまうのを避けるため、354条は908条1項の例外規定と考え、354条が908条1項に優先して適用されると解する"}, {"aspect": "結論", "text": "使用人は「取締役」（354条）でないので直接適用はできない。しかし、同条の趣旨は権利外観理論を基礎として取引の安全を図ることにある。代表権があると信じた相手方からすれば取引相手が取締役か使用人かは問題ではなく、外観を信頼した相手方保護の必要性は同じである。したがって、354条を類推適用して、相手方を保護できると解する"}]}, {"id": "book-kigyoho-01-art355", "article": "355条", "chs": [2], "topics": ["会計参与は忠実義務を負わない（355条・419条2項）"], "points": [{"aspect": "結論", "text": "忠実義務を負うのは取締役と執行役だけであり、会計参与は忠実義務を負わない"}]}, {"id": "book-kigyoho-01-art356", "article": "356条", "chs": [2], "topics": ["競業取引の要件（356条1項1号）", "（論点）356条1項1号の「自己又は第三者のために」とは（計算説）", "間接取引（356条1項3号）の要件", "直接取引（356条1項2号）の要件", "（論点）356条1項2号の「自己又は第三者のために」とは（名義説）"], "points": [{"aspect": "制度名", "text": "取締役の競業取引"}, {"aspect": "要件", "text": "「取締役が自己又は第三者のために株式会社の事業の部類に属する取引をしようとするとき」"}, {"aspect": "要件", "text": "「株式会社が取締役の債務を保証すること」"}, {"aspect": "要件", "text": "「取締役以外の者との間において株式会社と当該取締役との利益が相反する取引をしようとするとき」"}, {"aspect": "要件", "text": "間接（利益相反）取引の要件：①取締役以外の者と会社の取引であること、②当該取引によって会社と取締役の利益が相反すること"}, {"aspect": "要件", "text": "取締役が自己又は第三者のために株式会社と取引をしようとするとき"}, {"aspect": "結論", "text": "「自己又は第三者のために」とは、自己又は第三者名義を意味するのではなく、自己又は第三者の計算においてを意味する（計算説）。競業取引規制の趣旨は会社の利益保護であり、誰に経済的利益が帰属するかを問題にすべきだからである"}, {"aspect": "結論", "text": "「会社の事業の部類に属する取引」とは、会社が実際に行っている事業が市場において競合し、会社と取締役・第三者の間で利益衝突が生じるおそれがある取引をいう"}, {"aspect": "結論", "text": "「自己又は第三者のために」（356条1項2号）とは、自己の名義において、又は、第三者の名義において（第三者の代表者又は代理人として）を意味する（名義説）。間接取引（同条項3号）も規定され広く規制されているので、あえて計算の意味に考える必要はないからである"}]}, {"id": "book-kigyoho-01-art357", "article": "357条", "chs": [2], "topics": ["具体例②〜④（357条1項・367条・371条）"], "points": [{"aspect": "要件", "text": "②会社に著しい損害を及ぼすおそれのある事実を発見した場合の取締役の報告の宛先は、監査役ではなく株主である（357条1項）"}, {"aspect": "要件", "text": "③株主は一定の場合には取締役会招集請求権・招集権を行使でき（367条1項3項）、当該取締役会への出席・意見陳述権を有する（同条4項）"}, {"aspect": "要件", "text": "④株主の取締役会議事録閲覧請求権の行使要件が緩和され裁判所の許可が不要（371条2項3項）"}]}, {"id": "book-kigyoho-01-art358", "article": "358条", "chs": [2], "topics": ["業務執行に関する検査役の選任（358条）"], "points": [{"aspect": "趣旨", "text": "業務執行に関する検査役の選任は、株主に業務執行に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や違法行為差止請求権（360条）を行使するために役に立つ情報を株主は得ることができる"}]}, {"id": "book-kigyoho-01-art360", "article": "360条", "chs": [2], "topics": ["具体例① 株主による取締役の違法行為差止請求権（360条1項3項）", "取締役・執行役の行為の差止請求"], "points": [{"aspect": "制度名", "text": "取締役・執行役の行為の差止請求"}, {"aspect": "趣旨", "text": "取締役・執行役がなれ合い、他の取締役・執行役の違法行為を差し止めることが期待できない場合もある。そこで、会社・株主の利益を保護するため、株主による差止めを認めたのである"}, {"aspect": "要件", "text": "360条1項3項の＜要件＞はレジュメでは「ⅰ」「ⅱ」「ⅲ」の番号のみで、要件の内容の記載がない"}, {"aspect": "要件", "text": "差止請求の一覧：株主による取締役の行為の差止め（360条）、監査役による取締役の行為の差止め（385条）、監査等委員による取締役の行為の差止め（399条の6）、監査委員による執行役・取締役の行為の差止め（407条）、株主による執行役の行為の差止め（422条）"}, {"aspect": "要件", "text": "360条1項：6箇月前から引き続き株式を有する株主は、取締役が株式会社の目的の範囲外の行為その他法令若しくは定款に違反する行為をし、又はこれらの行為をするおそれがある場合において、当該行為によって株式会社に著しい損害が生ずるおそれがあるときは、当該取締役に対し当該行為をやめることを請求することができる"}, {"aspect": "要件", "text": "360条2項：公開会社でない株式会社における1項の適用については、「6箇月前から引き続き株式を有する株主」とあるのは「株主」とする"}, {"aspect": "要件", "text": "360条3項：監査役設置会社、監査等委員会設置会社又は指名委員会等設置会社における1項の適用については、「著しい損害」とあるのは「回復することができない損害」とする"}, {"aspect": "要件", "text": "要件③：会社に著しい損害が生じるおそれ、または会社に回復することができない損害（＝取締役の賠償責任により、その賠償が償われないような場合）"}, {"aspect": "要件", "text": "360条の要件①②はレジュメ本文では番号のみで内容が記載されていない（空欄）。要件③のみ説明がある"}]}, {"id": "book-kigyoho-01-art361", "article": "361条", "chs": [2], "topics": ["「権限」以外の特則（選任・解任・任期・報酬・責任）", "取締役の報酬等の決定（361条）", "個人別の報酬等の内容についての決定方針（361条7項）", "（参考）361条1項3号・4号・5号（株式・新株予約権・金銭債権を報酬として）"], "points": [{"aspect": "制度名", "text": "取締役の報酬等の決定"}, {"aspect": "趣旨", "text": "（3）の趣旨（361条6項、423条4項かっこ書きを除く）は、監査等委員である取締役の独立性を確保し、実効ある監査等（監査等の充実）のため"}, {"aspect": "趣旨", "text": "本来、報酬等の決定は業務執行行為であり取締役の決定・取締役会の決議によるものである。しかし、それでは取締役によるお手盛りの危険がある。そこで、お手盛りを防止して会社の利益を保護するため、定款で定めるか株主総会決議で定めることとした"}, {"aspect": "趣旨", "text": "5項の趣旨：監査等委員である取締役の監査の適正、独立性を確保するため"}, {"aspect": "趣旨", "text": "6項の趣旨：指名委員会等設置会社の報酬委員会に準じた機能を発揮することで経営監督機能の実効性を確保するため"}, {"aspect": "趣旨", "text": "361条7項の趣旨は、取締役の報酬等の内容の決定手続きに関する透明性を向上させるためである"}, {"aspect": "定義", "text": "報酬等とは：取締役の報酬、賞与その他の職務執行の対価として株式会社から受ける財産上の利益（361条1項かっこ書き）"}, {"aspect": "要件", "text": "報酬は361条2項・3項・5項・6項"}, {"aspect": "要件", "text": "手続①：定款または株主総会の（普通）決議によって定める（361条1項）"}]}, {"id": "book-kigyoho-01-art362", "article": "362条", "chs": [2, 11], "topics": ["取締役会の権限構造と専決事項（362条4項）", "（論点）362条4項1号の「重要」の意義（判断基準）", "（論点）362条4項2号の「多額」の意義", "（論点）-a 362条4項で要求される決議を欠く代表取締役の行為の効力", "（論点）-b 無効の主張権者（会社以外のものも無効主張できるか）"], "points": [{"aspect": "制度名", "text": "取締役会設置会社"}, {"aspect": "趣旨", "text": "362条4項1号が取締役会決議を要求した趣旨は、これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである"}, {"aspect": "趣旨", "text": "362条4項2号が取締役会決議を要求した趣旨は、これらの決定は会社に重大な影響を及ぼすので、合議体で慎重に判断させるのが妥当だからである"}, {"aspect": "趣旨", "text": "362条4項が重要な業務執行についての決定を取締役会の決議事項と定めたのは、代表取締役への権限の集中を抑制し、取締役相互の協議による結論に沿った業務の執行を確保することによって会社の利益を保護しようとする趣旨に出たものと解される"}, {"aspect": "定義", "text": "「知り又は知り得べかりしとき」とは、悪意又は有過失のことである"}, {"aspect": "要件", "text": "362条4項本文：取締役会は、次に掲げる事項その他の重要な業務執行の決定を取締役に委任することができない"}, {"aspect": "要件", "text": "362条4項1号：重要な財産の処分及び譲受け"}, {"aspect": "要件", "text": "362条4項2号：多額の借財"}, {"aspect": "要件", "text": "362条4項3号：支配人その他の重要な使用人の選任及び解任"}]}, {"id": "book-kigyoho-01-art363", "article": "363条", "chs": [2], "topics": ["代表取締役の権限の全体像（349条4項・5項）"], "points": [{"aspect": "制度名", "text": "取締役会設置会社の業務執行権者"}, {"aspect": "要件", "text": "代表取締役の権限は、a）一定の事項についての意思決定権、b）業務執行権（対内的、363条1項1号）、c）代表権（対外的、349条）からなる"}]}, {"id": "book-kigyoho-01-art365", "article": "365条", "chs": [2], "topics": ["利益相反取引の趣旨", "（論点）会社の承認を得ずになされた利益相反取引の効力（相対的無効説）", "（論点）利益相反取引の相手方からの無効主張の可否", "（論点）利益相反取引について株主全員の合意がある場合"], "points": [{"aspect": "制度名", "text": "取締役の利益相反取引"}, {"aspect": "趣旨", "text": "会社と取締役との利益相反取引を規制しなければ、会社が不利益な取引をさせられ会社に重大な不利益が生じるおそれがあるためである"}, {"aspect": "要件", "text": "利益相反取引の手続：事前の承認（356条1項柱書、365条1項）、事後の報告（365条2項）"}, {"aspect": "結論", "text": "会社の承認を得ずになされた利益相反取引は無効であると解する。ただし、会社は直接取引の相手方である取締役に対しては無効を主張できるが、取締役からの転得者や間接取引の相手方に対しては、その者が①当該取引が利益相反取引に該当すること、②会社の承認を得ていないことについて悪意であることを立証しなければ無効を主張できない"}, {"aspect": "結論", "text": "利益相反取引規制の趣旨は会社の利益保護にあるから、相手方からの無効主張は認められないと解する"}, {"aspect": "結論", "text": "株主全員の合意があれば、会社の承認を要求する必要もない。したがって、当該利益相反取引は有効と解する"}, {"aspect": "判例", "text": "相対的無効説（最判昭和43・12・25、最判昭和46・10・13）"}, {"aspect": "判例", "text": "最判昭和48・12・11の立場である"}, {"aspect": "判例", "text": "最判昭和49・9・26の立場である"}]}, {"id": "book-kigyoho-01-art367", "article": "367条", "chs": [2], "topics": ["具体例②〜④（357条1項・367条・371条）"], "points": [{"aspect": "要件", "text": "③株主は一定の場合には取締役会招集請求権・招集権を行使でき（367条1項3項）、当該取締役会への出席・意見陳述権を有する（同条4項）"}, {"aspect": "要件", "text": "②会社に著しい損害を及ぼすおそれのある事実を発見した場合の取締役の報告の宛先は、監査役ではなく株主である（357条1項）"}, {"aspect": "要件", "text": "④株主の取締役会議事録閲覧請求権の行使要件が緩和され裁判所の許可が不要（371条2項3項）"}]}, {"id": "book-kigyoho-01-art368", "article": "368条", "chs": [2], "topics": ["取締役会の招集手続（368条）"], "points": [{"aspect": "制度名", "text": "取締役会の招集通知"}, {"aspect": "要件", "text": "368条1項：取締役会を招集する者は、取締役会の日の一週間（定款で下回る期間を定めた場合はその期間）前までに、各取締役（監査役設置会社にあっては各取締役及び各監査役）に対して通知を発しなければならない"}, {"aspect": "要件", "text": "368条2項：取締役（監査役設置会社にあっては取締役及び監査役）の全員の同意があるときは、招集の手続を経ることなく開催することができる"}, {"aspect": "比較", "text": "株主総会の招集通知（299条）との比較が重要。368条2項は300条と同趣旨であり比較を要する"}]}, {"id": "book-kigyoho-01-art369", "article": "369条", "chs": [2], "topics": ["特別利害関係取締役（369条2項）の意義・効果と具体例", "取締役会決議に関するその他の制度（369条5項・370条・373条）"], "points": [{"aspect": "趣旨", "text": "特別利害関係を有する取締役は、公正な議決権行使が期待できないため、議決に加わることができないとされる"}, {"aspect": "趣旨", "text": "特別取締役制度の趣旨は、監督機能の強化とひきかえに、迅速な意思決定を可能にするためである"}, {"aspect": "定義", "text": "特別利害関係を有する取締役とは、会社に対する忠実義務に違反するおそれがあり、取締役会の決議の公正を害するおそれがある取締役をいう"}, {"aspect": "要件", "text": "369条2項：前項の決議について特別の利害関係を有する取締役は、議決に加わることができない"}, {"aspect": "要件", "text": "取締役会議事録に異議をとどめないものは、決議に賛成したものと推定する（369条5項）"}, {"aspect": "要件", "text": "取締役会決議の省略（370条）。cf. 株主総会決議の省略（319条）"}, {"aspect": "結論", "text": "「議決に加わることができない」とは、定足数に入れないと解し、審議に加わることもできないと解する"}, {"aspect": "比較", "text": "取締役会で代表取締役を選定する場合の対象取締役は、特別利害関係取締役ではない"}]}, {"id": "book-kigyoho-01-art370", "article": "370条", "chs": [2], "topics": ["取締役会決議に関するその他の制度（369条5項・370条・373条）"], "points": [{"aspect": "趣旨", "text": "特別取締役制度の趣旨は、監督機能の強化とひきかえに、迅速な意思決定を可能にするためである"}, {"aspect": "要件", "text": "取締役会決議の省略（370条）。cf. 株主総会決議の省略（319条）"}, {"aspect": "要件", "text": "取締役会議事録に異議をとどめないものは、決議に賛成したものと推定する（369条5項）"}]}, {"id": "book-kigyoho-01-art371", "article": "371条", "chs": [2], "topics": ["具体例②〜④（357条1項・367条・371条）"], "points": [{"aspect": "要件", "text": "④株主の取締役会議事録閲覧請求権の行使要件が緩和され裁判所の許可が不要（371条2項3項）"}, {"aspect": "要件", "text": "②会社に著しい損害を及ぼすおそれのある事実を発見した場合の取締役の報告の宛先は、監査役ではなく株主である（357条1項）"}, {"aspect": "要件", "text": "③株主は一定の場合には取締役会招集請求権・招集権を行使でき（367条1項3項）、当該取締役会への出席・意見陳述権を有する（同条4項）"}]}, {"id": "book-kigyoho-01-art373", "article": "373条", "chs": [2], "topics": ["取締役会決議に関するその他の制度（369条5項・370条・373条）"], "points": [{"aspect": "制度名", "text": "特別取締役による取締役会決議"}, {"aspect": "趣旨", "text": "特別取締役制度の趣旨は、監督機能の強化とひきかえに、迅速な意思決定を可能にするためである"}, {"aspect": "要件", "text": "373条1項：取締役会設置会社（委員会設置会社を除く。）が要件のいずれにも該当する場合には、取締役会は、362条4項1号及び2号に掲げる事項についての取締役会の決議については、あらかじめ選定した三人以上の取締役（特別取締役）のうち、議決に加わることができるものの過半数が出席し、その過半数をもって行うことができる旨を定めることができる"}, {"aspect": "要件", "text": "373条1項の要件：一 取締役の数が六人以上であること、二 取締役のうち一人以上が社外取締役であること"}, {"aspect": "要件", "text": "取締役会議事録に異議をとどめないものは、決議に賛成したものと推定する（369条5項）"}, {"aspect": "要件", "text": "取締役会決議の省略（370条）。cf. 株主総会決議の省略（319条）"}]}, {"id": "book-kigyoho-01-art374", "article": "374条", "chs": [2], "topics": ["会計参与の条文全体像（329条〜選任・解任／374条〜権限）"], "points": [{"aspect": "要件", "text": "「会計参与」とくれば、①329条〜（役員等の選・解任）、②374条〜（権限）"}]}, {"id": "book-kigyoho-01-art379", "article": "379条", "chs": [2], "topics": ["会計参与の報酬（379条）"], "points": [{"aspect": "要件", "text": "379条（会計参与の報酬）。監査役の報酬（387条）と同じ規定であり、趣旨（独立性確保）も同じ"}, {"aspect": "比較", "text": "監査役の報酬（387条）と同じ規定。趣旨（独立性確保）も同じ"}]}, {"id": "book-kigyoho-01-art381", "article": "381条", "chs": [2], "topics": ["監査役の監査権限の全体像（381条・436条）", "監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"], "points": [{"aspect": "趣旨", "text": "子会社調査権（381条3項4項）の趣旨：親子会社は法的には別法人であるが経済的一体性ゆえに、親会社は子会社を通じて違法行為を行う可能性がある。そこで、親会社の監査を十分にするため、子会社調査権が認められた"}, {"aspect": "趣旨", "text": "監査役の取締役会への出席義務・意見陳述義務（383条1項）の趣旨は、業務監査のため（取締役会で違法な決議がなされるのを事前に防止するため）"}, {"aspect": "趣旨", "text": "取締役会招集請求権・招集権（383条2項3項4項）の趣旨は、取締役の違法行為を取締役会に報告することを可能にするため"}, {"aspect": "趣旨", "text": "監査役設置会社と取締役との間の訴えにおける会社の代表（386条）の趣旨：本来、会社を代表するのは代表取締役であるが（349条4項）、なれ合い訴訟を防止するため、監査役が会社を代表することとした"}, {"aspect": "趣旨", "text": "監査役の報酬（387条）の趣旨：本来、報酬の決定は業務執行の決定として取締役会または取締役の権限であるが、それでは監査の充実がなされないので、監査役の独立性確保ため"}, {"aspect": "要件", "text": "監査役の監査権限は、会計監査権（436条）と業務監査権（381条）がある"}, {"aspect": "要件", "text": "監査役による取締役の行為の差止め（385条）の要件：①取締役の法令・定款違反のおそれある行為があること、②当該行為によって会社に著しい損害が生じるおそれがあること"}]}, {"id": "book-kigyoho-01-art383", "article": "383条", "chs": [2], "topics": ["監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"], "points": [{"aspect": "趣旨", "text": "監査役の取締役会への出席義務・意見陳述義務（383条1項）の趣旨は、業務監査のため（取締役会で違法な決議がなされるのを事前に防止するため）"}, {"aspect": "趣旨", "text": "取締役会招集請求権・招集権（383条2項3項4項）の趣旨は、取締役の違法行為を取締役会に報告することを可能にするため"}, {"aspect": "趣旨", "text": "子会社調査権（381条3項4項）の趣旨：親子会社は法的には別法人であるが経済的一体性ゆえに、親会社は子会社を通じて違法行為を行う可能性がある。そこで、親会社の監査を十分にするため、子会社調査権が認められた"}, {"aspect": "趣旨", "text": "監査役設置会社と取締役との間の訴えにおける会社の代表（386条）の趣旨：本来、会社を代表するのは代表取締役であるが（349条4項）、なれ合い訴訟を防止するため、監査役が会社を代表することとした"}, {"aspect": "趣旨", "text": "監査役の報酬（387条）の趣旨：本来、報酬の決定は業務執行の決定として取締役会または取締役の権限であるが、それでは監査の充実がなされないので、監査役の独立性確保ため"}, {"aspect": "要件", "text": "監査役による取締役の行為の差止め（385条）の要件：①取締役の法令・定款違反のおそれある行為があること、②当該行為によって会社に著しい損害が生じるおそれがあること"}]}, {"id": "book-kigyoho-01-art385", "article": "385条", "chs": [2], "topics": ["監査役の個別権限とその趣旨（381条3項4項・383条・385条・386条・387条）"], "points": [{"aspect": "趣旨", "tex 旨は、取締役の違法行為を取締役会に報告することを可能にするため"}, {"aspect": "趣旨", "text": "監査役設置会社と取締役との間の訴えにおける会社の代表（386条）の趣旨：本来、会社を代表するのは代表取締役であるが（349条4項）、なれ合い訴訟を防止するため、監査役が会社を代表することとした"}, {"aspect": "要件", "text": "監査役による取締役の行為の差止め（385条）の要件：①取締役の法令・定款違反のおそれある行為があること、②当該行為によって会社に著しい損害が生じるおそれがあること"}, {"aspect": "比較", "text": "監査役の報酬（387条）と同じ規定。趣旨（独立性確保）も同じ"}]}, {"id": "book-kigyoho-01-art389", "article": "389条", "chs": [2], "topics": ["定款の定めによる監査範囲の限定（389条）"], "points": [{"aspect": "趣旨", "text": "非公開会社では、株主自身による業務監査もある程度可能であるし、業務監査まで行う監査役を得ることが困難な場合もあるため、監査範囲の限定が認められる"}, {"aspect": "定義", "text": "上記の監査役を、会計監査限定監査役、または会計限定監査役と呼ぶ"}, {"aspect": "要件", "text": "389条1項：公開会社でない株式会社（監査役会設置会社及び会計監査人設置会社を除く。）は、381条1項の規定にかかわらず、その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができる"}]}, {"id": "book-kigyoho-01-art390", "article": "390条", "chs": [2], "topics": ["監査役設置会社の定義（2条9号）と監査役会（390条〜）"], "points": [{"aspect": "制度名", "text": "監査役会とくれば何条？"}, {"aspect": "要件", "text": "監査役会の権限（390条）。レジュメでは見出しのみで内容の説明はない"}, {"aspect": "要件", "text": "監査役会の議事録に異議をとどめないものは賛成したものと推定する（393条4項）。レジュメでは見出しのみで内容の説明はない"}]}, {"id": "book-kigyoho-01-art393", "article": "393条", "chs": [2], "topics": ["監査役設置会社の定義（2条9号）と監査役会（390条〜）"], "points": [{"aspect": "制度名", "text": "監査役会議事録に異議をとどめないものは賛成したものと推定"}, {"aspect": "要件", "text": "監査役会の議事録に異議をとどめないものは賛成したものと推定する（393条4項）。レジュメでは見出しのみで内容の説明はない"}]}, {"id": "book-kigyoho-01-art396", "article": "396条", "chs": [2], "topics": ["会計監査人の条文全体像と「役員ではない」ことの帰結（329条1項）"], "points": [{"aspect": "要件", "text": "「会計監査人」とくれば、①329条〜（役員等の選・解任）、②396条〜（権限）"}]}, {"id": "book-kigyoho-01-art399", "article": "399条", "chs": [2], "topics": ["会計監査人の報酬等の決定（399条）", "（論点）監査等委員会の業務監査権（399条の2第3項1号）の範囲", "399条の2〜の条文構造と監査等委員会設置会社の機関構造"], "points": [{"aspect": "趣旨", "text": "会計監査人の場合は本来通り取締役・取締役会の決定で報酬等を決定する（役員ではないから）。ただ、独立性確保の要請から監査役の同意を要求している"}, {"aspect": "要件", "text": "399条1項：取締役は、会計監査人又は一時会計監査人の職務を行うべき者の報酬等を定める場合には、監査役（監査役が二人以上ある場合にあっては、その過半数）の同意を得なければならない"}, {"aspect": "要件", "text": "条文構造：第9節の2 監査等委員会。第1款 権限等（399条の2〜399条の7）、第2款 運営（399条の8〜399条の12）、第3款 監査等委員会設置会社の取締役会の権限等（399条の13・399条の14）"}, {"aspect": "結論", "text": "監査等委員会の業務監査権（399条の2第3項1号）の範囲も、監査委員会の業務監査権と同じ論証による（適法性監査のみならず妥当性監査に及ぶ）"}, {"aspect": "比較", "text": "取締役・監査役・会計参与の報酬等は、お手盛りの危険・独立性確保の理由で定款または株主総会の普通決議で定めることになっており、会計監査人の報酬等の決定とは大きく異なる"}, {"aspect": "その他", "text": "④監査等委員会設置会社の表：業務執行の意思決定＝取締役会（399条の13第1項1号）＊委任（4項5項6項）、業務執行＝代表取締役（363条1項1号）、代表＝代表取締役（349条1項ただし書き、4項）"}]}, {"id": "book-kigyoho-01-art399-2", "article": "399条の2", "chs": [2], "topics": ["（論点）監査等委員会の業務監査権（399条の2第3項1号）の範囲", "権限の条文は399条の2〜（特に取締役会の権限は399条の13）", "399条の2〜の条文構造と監査等委員会設置会社の機関構造"], "points": [{"aspect": "要件", "text": "399条の2〜は、主として監査等委員会設置会社の「権限」の条文。権限を探すときは399条の2〜を見る。特に取締役会の権限とくれば399条の13"}, {"aspect": "要件", "text": "条文構造：第9節の2 監査等委員会。第1款 権限等（399条の2〜399条の7）、第2款 運営（399条の8〜399条の12）、第3款 監査等委員会設置会社の取締役会の権限等（399条の13・399条の14）"}, {"aspect": "結論", "text": "監査等委員会の業務監査権（399条の2第3項1号）の範囲も、監査委員会の業務監査権と同じ論証による（適法性監査のみならず妥当性監査に及ぶ）"}]}, {"id": "book-kigyoho-01-art399-6", "article": "399条の6", "chs": [2], "topics": ["取締役・執行役の行為の差止請求"], "points": [{"aspect": "要件", "text": "差止請求の一覧：株主による取締役の行為の差止め（360条）、監査役による取締役の行為の差止め（385条）、監査等委員による取締役の行為の差止め（399条の6）、監査委員による執行役・取締役の行為の差止め（407条）、株主による執行役の行為の差止め（422条）"}]}, {"id": "book-kigyoho-01-art399-13", "article": "399条の13", "chs": [2, 11], "topics": [], "points": [{"aspect": "制度名", "text": "監査等委員会設置会社の取締役会 ― 399条の13"}]}, {"id": "book-kigyoho-01-art400", "article": "400条", "chs": [2], "topics": ["各委員会の委員の選定・解職（400条）"], "points": [{"aspect": "制度名", "text": "指名委員会等設置会社"}, {"aspect": "要件", "text": "400条1項：各委員会は、委員三人以上で組織する。2項：各委員会の委員は、取締役の中から、取締役会の決議によって選定する。3項：各委員会の委員の過半数は、社外取締役でなければならない"}, {"aspect": "要件", "text": "各委員会の委員の解職は取締役会の決議によって行う（400条2項、400条1項への注記）"}, {"aspect": "結論", "text": "各委員会は取締役会の内部機関であり、各委員の選定・解職は329条〜を使わない"}]}, {"id": "book-kigyoho-01-art402", "article": "402条", "chs": [2], "topics": ["善管注意義務（330条・402条3項・民法644条）"], "points": [{"aspect": "要件", "text": "402条3項：指名委員会等設置会社と執行役との関係は、委任に関する規定に従う"}]}, {"id": "book-kigyoho-01-art404", "article": "404条", "chs": [2], "topics": ["指名委員会等の権限の条文構造（404条〜409条）", "404条1項の趣旨（指名委員会の権限）", "（論点）監査委員会の業務監査権（404条2項1号）の範囲", "404条3項の趣旨（報酬委員会の権限）"], "points": [{"aspect": "制度名", "text": "指名委員会等の権限"}, {"aspect": "趣旨", "text": "社外取締役が過半数を占める指名委員会に取締役の選任・解任に関する議案の内容を最終決定させることにより、取締役の人事について代表執行役からの独立性を確保し、執行役の業務執行に対する監督を充実させるため"}, {"aspect": "趣旨", "text": "なぜなら、監査委員は、株式会社の業務執行の妥当性を監督する取締役会の構成員である取締役であるからである"}, {"aspect": "趣旨", "text": "本来報酬等の決定は業務執行行為として取締役会の権限に属するが、執行役への報酬等の決定の委任（416条4項本文）によるお手盛りを防止して、執行役に対する監督を充実するため"}, {"aspect": "要件", "text": "404条1項は指名委員会の権限、2項は監査委員会の権限、3項は報酬委員会の権限"}, {"aspect": "結論", "text": "監査委員会の業務監査権の範囲は、執行役等（取締役）の適法性監査のみならず、妥当性監査にまで及ぶと解する"}]}, {"id": "book-kigyoho-01-art405", "article": "405条", "chs": [2], "topics": ["指名委員会等の権限の条文構造（404条〜409条）"], "points": [{"aspect": "要件", "text": "405条（監査委員会による調査）、406条（監査委員による取締役会への報告義務）、407条（監査委員による執行役等の行為の差止め）、408条（指名委員会等設置会社と執行役又は取締役との間の訴えにおける会社の代表等）は監査委員会の権限義務。監査役の権限（381条〜）と類似するが、監査委員会の権限義務には381条〜は使わない"}]}, {"id": "book-kigyoho-01-art407", "article": "407条", "chs": [2], "topics": ["監査委員による執行役等の行為の差止め（407条）"], "points": [{"aspect": "制度名", "text": "監査委員による執行役等の行為の差止め"}, {"aspect": "要件", "text": "407条の要件はレジュメでは「①」「②」の番号のみで、要件の内容の記載がない"}, {"aspect": "比較", "text": "監査役の違法行為差止請求権（385条）と同様の規定である"}]}, {"id": "book-kigyoho-01-art408", "article": "408条", "chs": [2], "topics": ["408条の趣旨（訴えにおける会社の代表）"], "points": [{"aspect": "趣旨", "text": "本来、会社を代表するのは代表執行役であるが（349条4項）、なれ合い訴訟を防止するため"}, {"aspect": "比較", "text": "監査役設置会社と取締役との間の訴えにおける会社の代表（386条）と同様の規定"}]}, {"id": "book-kigyoho-01-art409", "article": "409条", "chs": [2], "topics": ["指名委員会等の権限の条文構造（404条〜409条）"], "points": [{"aspect": "要件", "text": "409条（報酬委員会による報酬の決定の方法等）。報酬には361条は使わない"}]}, {"id": "book-kigyoho-01-art416", "article": "416条", "chs": [2, 11], "topics": ["404条3項の趣旨（報酬委員会の権限）", "指名委員会等設置会社の総則（執行と監督の分離）"], "points": [{"aspect": "制度名", "text": "指名委員会等設置会社の取締役会"}, {"aspect": "趣旨", "text": "本来報酬等の決定は業務執行行為として取締役会の権限に属するが、執行役への報酬等の決定の委任（416条4項本文）によるお手盛りを防止して、執行役に対する監督を充実するため"}, {"aspect": "趣旨", "text": "迅速な意思決定を可能にするため大幅な委任を認め（416条4項）、監督機能を大幅に強化するため3委員会の設置を義務づけ（2条12号）、各委員会の委員の過半数は社外取締役とした（400条3項）"}]}, {"id": "book-kigyoho-01-art418", "article": "418条", "chs": [2], "topics": ["執行役・代表執行役・表見代表執行役（418条〜421条）"], "points": [{"aspect": "要件", "text": "執行役の権限（418条）"}, {"aspect": "要件", "text": "執行役の忠実義務、競業避止義務、利益相反取引規制（419条2項、355条、356条、365条2項）"}, {"aspect": "要件", "text": "表見代表執行役（421条）。表見代表取締役規定（354条）と同じ規定である"}]}, {"id": "book-kigyoho-01-art419", "article": "419条", "chs": [2], "topics": ["会計参与は忠実義務を負わない（355条・419条2項）", "忠実義務と同質説（最判昭和45・6・24）", "執行役・代表執行役・表見代表執行役（418条〜421条）"], "points": [{"aspect": "要件", "text": "忠実義務を負うのは、取締役（355条）と執行役（419条2項、355条）だけ"}, {"aspect": "要件", "text": "執行役の忠実義務、競業避止義務、利益相反取引規制（419条2項、355条、356条、365条2項）"}, {"aspect": "結論", "text": "忠実義務を負うのは取締役と執行役だけであり、会計参与は忠実義務を負わない"}]}, {"id": "book-kigyoho-01-art420", "article": "420条", "chs": [2], "topics": ["執行役・代表執行役・表見代表執行役（418条〜421条）"], "points": [{"aspect": "制度名", "text": "代表執行役の代表権"}, {"aspect": "要件", "text": "代表執行役（420条）。代表執行役の包括的・不可制限的代表権（420条3項、349条4項5項）"}]}, {"id": "book-kigyoho-01-art421", "article": "421条", "chs": [2], "topics": ["執行役・代表執行役・表見代表執行役（418条〜421条）"], "points": [{"aspect": "要件", "text": "表見代表執行役（421条）。表見代表取締役規定（354条）と同じ規定である"}, {"aspect": "要件", "text": "執行役の権限（418条）"}, {"aspect": "要件", "text": "執行役の忠実義務、競業避止義務、利益相反取引規制（419条2項、355条、356条、365条2項）"}]}, {"id": "book-kigyoho-01-art422", "article": "422条", "chs": [2], "topics": ["株主による執行役の行為の差止め（422条）"], "points": [{"aspect": "制度名", "text": "株主による執行役の行為の差止め"}, {"aspect": "要件", "text": "認められるためには、①6ヶ月前から株式を継続保有する株主であること、②執行役の行為が法令・定款に反するおそれがあること、③当該行為によって会社に回復することができない損害が生じるおそれがあることが必要である"}, {"aspect": "比較", "text": "株主による取締役の違法行為差止め（360条）と同様の規定。監査委員による差止め（407条、「会社に著しい損害」）も存在するので、422条は「会社に回復することができない損害」である点に注意"}]}, {"id": "book-kigyoho-01-art423-para1", "article": "423条1項", "chs": [2], "topics": ["競業違反と取締役の任務懈怠責任（423条1項・2項）", "役員等の会社に対する責任（423条1項）の要件", "任務懈怠の意義と具体的な条文違反がある場合（A）", "任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照", "要件⑤ 故意・過失の意義", "「善意無重過失」のあてはめ（認定）に関する注意"], "points": [{"aspect": "定義", "text": "法律用語の「故意」とは「わざと」ではない。故意とは認識・認容であり、任務懈怠を認識し、認容していた場合に故意ありといえる"}, {"aspect": "定義", "text": "「過失」とは注意義務違反をいう。結果予見義務違反とかそれに加えて結果回避義務違反とかいう考えもある"}, {"aspect": "定義", "text": "重過失とは、著しい注意義務違反、注意義務違反の程度が著しい状態のことである"}, {"aspect": "要件", "text": "423条1項の要件：①取締役等、②任務懈怠（これが一番重要。まとめると「取締役等の任務懈怠であること」）、③会社に損害が発生したこと、④②の任務懈怠と③の損害の間に相当因果関係があること、⑤取締役等に故意・過失があること（明文にないが当然に）"}, {"aspect": "要件", "text": "423条1項責任の要件は、①役員等、②任務懈怠（「役員等の任務懈怠であること」）、③会社に損害が発生したこと、④任務懈怠と会社の損害との間の相当因果関係、⑤役員等に故意・過失があること"}, {"aspect": "結論", "text": "解答例における要件の定式：①役員等であること、②役員等に会社に対する任務懈怠があること、③会社に損害が発生していること、④会社の損害の発生と任務懈怠の間に相当因果関係があること、⑤役員等に故意または過失があること"}]}, {"id": "book-kigyoho-01-art423-para2", "article": "423条2項", "chs": [2], "topics": ["競業違反と取締役の任務懈怠責任（423条1項・2項）", "教材設例：競業取引（パンの製造販売）に対する423条1項のあてはめ"], "points": [{"aspect": "趣旨", "text": "423条2項の趣旨は、損害額の立証が困難なので、損害会社の救済のため（原文ママ）"}, {"aspect": "要件", "text": "会社の承認なくして競業取引をした場合、取締役等が得た利益は会社の損害額と推定される（423条2項）。本問ではAが得た800万円が会社の損害額と推定される"}, {"aspect": "その他", "text": "解答例の結論：Aの行為は競業取引にあたり承諾がないため356条1項1号、365条1項違反で任務懈怠・故意が認められ、甲社の損害額は800万円と推定され（423条2項）、相当因果関係も認められるので、Aの損害賠償責任は認められる"}]}, {"id": "book-kigyoho-01-art423-para3", "article": "423条3項", "chs": [2], "topics": ["利益相反取引と取締役の任務懈怠責任（423条1項・3項・428条）"], "points": [{"aspect": "趣旨", "text": "423条3項：＜趣旨＞立証責任を転換し会社の利益を図るため。取締役会（会社）の承認があっても任務懈怠の推定を認めるのは、利益相反取引の際の承認は取締役会と利益相反取締役との馴れ合いの危険があるから"}, {"aspect": "要件", "text": "423条3項：＜効果＞任務懈怠の推定。423条2項とは異なり「違反して」という表現はない。したがって、会社の承認の有無に関係なく423条3項は適用できる"}, {"aspect": "その他", "text": "423条3項各号の図：甲社（損害あり）がXに土地売却し、XからY（転得者）へ。取締役X＝423条3項1号、代表取締役A＝2号、取締役B（決議に賛成）＝3号、取締役C（決議に異議をとどめず）は369条5項→423条3項3号。また＜利益相反＞の場合、423条3項は423条1項の要件②任務懈怠を推定し、428条の要件を満たせば⑤故意・過失さえ不要になる"}]}, {"id": "book-kigyoho-01-art423-para4", "article": "423条4項", "chs": [2], "topics": ["利益相反取引と取締役の任務懈怠責任（423条1項・3項・428条）"], "points": [{"aspect": "趣旨", "text": "423条4項：＜趣旨＞監査等委員会設置会社への移行を促すため（政策的制度）"}, {"aspect": "要件", "text": "423条4項：監査等委員会設置会社の場合は3項の任務懈怠の推定はない"}]}, {"id": "book-kigyoho-01-art424", "article": "424条", "chs": [2], "topics": ["任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"], "points": [{"aspect": "制度名", "text": "全部免除"}, {"aspect": "趣旨", "text": "一部免除の趣旨：役員等に高額の賠償責任を負わせたのでは、経営が萎縮してしまいかえって株主に不利益を与えるおそれがあるため"}, {"aspect": "要件", "text": "一部免除の共通点①：「職務を行うにつき善意でかつ重大な過失がない」ことが必要"}, {"aspect": "要件", "text": "一部免除の方法：425条は事後の株主総会特別決議による一部免除、426条は事前の定款規定＋事後の取締役会決議（取締役の過半数）による一部免除、427条は事前の定款規定＋事前の非業務執行取締役等との責任限定契約"}]}, {"id": "book-kigyoho-01-art425", "article": "425条", "chs": [2], "topics": ["任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"], "points": [{"aspect": "趣旨", "text": "一部免除の趣旨：役員等に高額の賠償責任を負わせたのでは、経営が萎縮してしまいかえって株主に不利益を与えるおそれがあるため"}, {"aspect": "要件", "text": "一部免除の方法：425条は事後の株主総会特別決議による一部免除、426条は事前の定款規定＋事後の取締役会決議（取締役の過半数）による一部免除、427条は事前の定款規定＋事前の非業務執行取締役等との責任限定契約"}, {"aspect": "要件", "text": "一部免除の共通点①：「職務を行うにつき善意でかつ重大な過失がない」ことが必要"}]}, {"id": "book-kigyoho-01-art426", "article": "426条", "chs": [2], "topics": ["任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"], "points": [{"aspect": "趣旨", "text": "一部免除の趣旨：役員等に高額の賠償責任を負わせたのでは、経営が萎縮してしまいかえって株主に不利益を与えるおそれがあるため"}, {"aspect": "要件", "text": "一部免除の方法：425条は事後の株主総会特別決議による一部免除、426条は事前の定款規定＋事後の取締役会決議（取締役の過半数）による一部免除、427条は事前の定款規定＋事前の非業務執行取締役等との責任限定契約"}]}, {"id": "book-kigyoho-01-art427", "article": "427条", "chs": [2], "topics": ["任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"], "points": [{"aspect": "趣旨", "text": "一部免除の趣旨：役員等に高額の賠償責任を負わせたのでは、経営が萎縮してしまいかえって株主に不利益を与えるおそれがあるため"}, {"aspect": "要件", "text": "一部免除の方法：425条は事後の株主総会特別決議による一部免除、426条は事前の定款規定＋事後の取締役会決議（取締役の過半数）による一部免除、427条は事前の定款規定＋事前の非業務執行取締役等との責任限定契約"}, {"aspect": "要件", "text": "一部免除の共通点①：「職務を行うにつき善意でかつ重大な過失がない」ことが必要"}]}, {"id": "book-kigyoho-01-art428", "article": "428条", "chs": [2], "topics": ["利益相反取引と取締役の任務懈怠責任（423条1項・3項・428条）"], "points": [{"aspect": "制度名", "text": "取締役の利益相反取引"}, {"aspect": "趣旨", "text": "428条の趣旨は、自己のために会社と取引を行うことは利益相反性は著しく高いから"}, {"aspect": "要件", "text": "428条の要件：①利益相反の直接取引であること、②「自己のために」に限る"}, {"aspect": "効果", "text": "428条の効果は無過失責任"}]}, {"id": "book-kigyoho-01-art429-para1", "article": "429条1項", "chs": [2], "topics": ["429条1項の趣旨・責任の性質（特別法定責任説）", "429条1項の要件", "教材設例1・2：429条1項のあてはめと（論点）間接損害の場合に株主も「第三者」に含むか", "（論点）代表取締役の独断行為を黙認した取締役の任務懈怠・監視義務", "（論点）名目的取締役・表見的取締役・退任取締役の定義と名目的取締役の「役員等」該当性", "（論点）表見的取締役も「役員等」に含まれるか"], "points": [{"aspect": "定義", "text": "間接損害とは、役員等の任務懈怠によって会社に損害が発生して、その結果、第三者が被る損害。例：役員が回収の見込みのない貸付けを行い会社の損害が発生して会社が倒産し、その結果会社債権者が債権を回収できなくなる場合"}, {"aspect": "定義", "text": "直接損害とは、役員等の任務懈怠によって第三者が直接被った損害。例：役員が、代金支払いの見込みがないのに会社を代表して契約を締結する場合"}, {"aspect": "定義", "text": "名目的取締役とは、適法な選任決議を経て取締役に就任しているが、会社経営にほとんど関与しない取締役"}, {"aspect": "定義", "text": "表見的取締役とは、登記簿上取締役として登記されているが、株主総会の適法な選任手続を経ていない者"}, {"aspect": "定義", "text": "退任取締役とは、登記簿上取締役として登記されているが、既に取締役の任期満了・辞任等によって取締役の地位を失った者"}, {"aspect": "要件", "text": "429条1項：役員等がその職務を行うについて悪意又は重大な過失があったときは、当該役員等は、これによって第三者に生じた損害を賠償する責任を負う"}, {"aspect": "要件", "text": "要件②：何についての悪意・重過失かは、趣旨から広く、任務懈怠についての悪意・重過失であればよい（第三者への加害行為についての悪意・重過失ではない）"}, {"aspect": "要件", "text": "要件③：任務懈怠と損害の発生との間に相当因果関係があること（「異常でない」「通常」）"}]}, {"id": "book-kigyoho-01-art429-para2", "article": "429条2項", "chs": [2], "topics": ["429条2項（会計監査人の責任を例に）"], "points": [{"aspect": "要件", "text": "429条2項：各号に掲げる者が当該各号に定める行為をしたときも前項と同様とする。ただし、その者が当該行為をすることについて注意を怠らなかったことを証明したときはこの限りでない。4号は会計監査人による会計監査報告に記載し、又は記録すべき重要な事項についての虚偽の記載又は記録"}, {"aspect": "要件", "text": "会計監査人の429条2項責任の要件：①会計監査人による会計監査報告の虚偽記載記録、②会計監査人の過失（注意を怠らなかったことの証明のないこと）"}, {"aspect": "要件", "text": "要件③④はレジュメ本文では番号のみで内容が記載されていない（空欄）"}, {"aspect": "判例", "text": "（参考）東京地判平成19・11・28：会計監査人の責任について、公認会計士協会の作成した実務指針に則って会計監査しており、注意を怠らなかったとして否定した"}, {"aspect": "判例", "text": "（参考）東京地判平成17・6・27：役員等が虚偽記載しても、第三者の損害は虚偽記載によるものとは無関係の事情による会社の倒産によるものとして、責任を否定した（相当因果関係を否定）"}]}, {"id": "book-kigyoho-01-art430", "article": "430条", "chs": [2], "topics": ["429条2項（会計監査人の責任を例に）", "役員等の連帯責任（430条）", "補償契約（430条の2）", "役員等のための保険契約（430条の3）＝役員等賠償責任保険契約（D&O保険契約）"], "points": [{"aspect": "制度名", "text": "役員等の連帯責任"}, {"aspect": "定義", "text": "役員等のための締結される保険契約（430条の3）とは、役員等賠償責任保険契約（D&O保険契約）である"}, {"aspect": "要件", "text": "要件③④はレジュメ本文では番号のみで内容が記載されていない（空欄）"}, {"aspect": "要件", "text": "430条：役員等が株式会社又は第三者に生じた損害を賠償する責任を負う場合において、他の役員等も当該損害を賠償する責任を負うときは、これらの者は連帯債務者とする"}, {"aspect": "要件", "text": "「対処するために支出する費用」（防御費用、例：訴訟費用や弁護士報酬）は補償内容とする契約締結が可能である（1号）"}, {"aspect": "要件", "text": "2項（「補償することができない」場合）：3号により、429条1項の賠償金等の補償をすることができない場合がある"}, {"aspect": "判例", "text": "（参考）東京地判平成19・11・28：会計監査人の責任について、公認会計士協会の作成した実務指針に則って会計監査しており、注意を怠らなかったとして否定した"}, {"aspect": "判例", "text": "（参考）東京地判平成17・6・27：役員等が虚偽記載しても、第三者の損害は虚偽記載によるものとは無関係の事情による会社の倒産によるものとして、責任を否定した（相当因果関係を否定）"}, {"aspect": "比較", "text": "保険契約は間接利益相反取引（356条1項3号）と同じ状況である。保険会社が一方的に役員等に有利な内容の保険を引き受けることはないだろうから、430条の2とは異なり、423条1項や429条の賠償金の保険を内容とする契約締結はできる"}]}, {"id": "book-kigyoho-01-art430-2", "article": "430条の2", "chs": [2], "topics": ["補償契約・保険契約の趣旨（令和元年改正）", "補償契約（430条の2）", "役員等のための保険契約（430条の3）＝役員等賠償責任保険契約（D&O保険契約）"], "points": [{"aspect": "趣旨", "text": "趣旨：①補償契約・保険契約を自由に認めたのでは、役員等の職務の執行の適正性が損なわれるおそれがあるため、②会社と役員等との利益が相反する場面があるので、利益相反規制に準じた規制をするため"}, {"aspect": "要件", "text": "430条の2第1項：補償契約の内容決定手続は株主総会の普通決議・取締役会決議（趣旨②に対応）"}, {"aspect": "要件", "text": "「対処するために支出する費用」（防御費用、例：訴訟費用や弁護士報酬）は補償内容とする契約締結が可能である（1号）"}, {"aspect": "要件", "text": "2項（「補償することができない」場合）：3号により、429条1項の賠償金等の補償をすることができない場合がある"}, {"aspect": "比較", "text": "保険契約は間接利益相反取引（356条1項3号）と同じ状況である。保険会社が一方的に役員等に有利な内容の保険を引き受けることはないだろうから、430条の2とは異なり、423条1項や429条の賠償金の保険を内容とする契約締結はできる"}]}, {"id": "book-kigyoho-01-art430-3", "article": "430条の3", "chs": [2], "topics": ["補償契約・保険契約の趣旨（令和元年改正）", "補償契約（430条の2）", "役員等のための保険契約（430条の3）＝役員等賠償責任保険契約（D&O保険契約）"], "points": [{"aspect": "趣旨", "text": "趣旨：①補償契約・保険契約を自由に認めたのでは、役員等の職務の執行の適正性が損なわれるおそれがあるため、②会社と役員等との利益が相反する場面があるので、利益相反規制に準じた規制をするため"}, {"aspect": "定義", "text": "役員等のための締結される保険契約（430条の3）とは、役員等賠償責任保険契約（D&O保険契約）である"}, {"aspect": "要件", "text": "「対処するために支出する費用」（防御費用、例：訴訟費用や弁護士報酬）は補償内容とする契約締結が可能である（1号）"}, {"aspect": "要件", "text": "430条の3第1項：D&O保険契約の手続は取締役会決議または株主総会の決議（趣旨②に対応）"}, {"aspect": "比較", "text": "保険契約は間接利益相反取引（356条1項3号）と同じ状況である。保険会社が一方的に役員等に有利な内容の保険を引き受けることはないだろうから、430条の2とは異なり、423条1項や429条の賠償金の保険を内容とする契約締結はできる"}]}, {"id": "book-kigyoho-01-art433", "article": "433条", "chs": [2], "topics": ["会計帳簿閲覧請求（433条）"], "points": [{"aspect": "趣旨", "text": "会計帳簿閲覧請求は、株主に会計帳簿に関する情報収集を保障するためであり、これによって責任追及等の訴え（847条）や役員解任の訴え（854条）を提起するために役に立つ情報を株主は得ることができる"}]}, {"id": "book-kigyoho-01-art436", "article": "436条", "chs": [2], "topics": ["監査役の監査権限の全体像（381条・436条）"], "points": [{"aspect": "制度名", "text": "監査役の会計監査権"}, {"aspect": "要件", "text": "監査役の監査権限は、会計監査権（436条）と業務監査権（381条）がある"}]}, {"id": "book-kigyoho-01-art447", "article": "447条", "chs": [6], "topics": ["資本金の額の減少（決定機関・債権者異議・趣旨・欠損の定義）"], "points": [{"aspect": "趣旨", "text": "原則（株主総会の特別決議）の趣旨：資本金の額の減少は会社の一部清算の性格を有し、株主の利益に重大な影響を与えるから"}, {"aspect": "趣旨", "text": "例外①（取締役の決定・取締役会の決議、447条3項）の趣旨（答案用）：このような場合結果的に資本金の額は減少しないので株主の利益は害されないから"}, {"aspect": "定義", "text": "欠損の定義：分配可能額を計算するとマイナスになる状態"}, {"aspect": "要件", "text": "決定機関の原則：株主総会の特別決議（447条1項、309条2項9号）"}, {"aspect": "要件", "text": "決定機関の例外①：447条3項"}, {"aspect": "要件", "text": "決定機関の例外②：447条1項、309条2項9号かっこ書"}]}, {"id": "book-kigyoho-01-art448", "article": "448条", "chs": [6], "topics": ["準備金の額の減少（決定機関・債権者異議・趣旨）"], "points": [{"aspect": "趣旨", "text": "原則（株主総会の普通決議）の趣旨：資本金の額の減少より手続要件を緩和することでまず準備金の額の減少を先に行うことを促し、資本金のクッションの役割を果たすため。答案用としては、株主の利益に影響するが資本金の額の減少ほど影響は大きくないから"}, {"aspect": "趣旨", "text": "例外①（取締役の決定・取締役会の決議、448条3項）の趣旨：447条3項と同じ"}, {"aspect": "要件", "text": "決定機関の原則：株主総会の普通決議（448条1項、309条1項）"}, {"aspect": "要件", "text": "決定機関の例外①：448条3項"}]}, {"id": "book-kigyoho-01-art449", "article": "449条", "chs": [6], "topics": ["債権者異議手続（449条1項）の趣旨と例外の趣旨"], "points": [{"aspect": "趣旨", "text": "449条1項柱書本文の趣旨：資本金・準備金の額の減少は剰余金の額が増加する場合に分配可能額が増加し株主への分配がなされ会社債権者の引き当てとなる会社財産の減少となり得るので、会社債権者の利益に重大な影響を与えうるため"}, {"aspect": "趣旨", "text": "例外①（減少する準備金の額の全部を資本金とする場合）の趣旨：減額がより困難な資本金となるので会社債権者に重大な影響を与えないから"}, {"aspect": "趣旨", "text": "例外②（欠損填補の場合）の趣旨：準備金の額の減少によって新たに分配可能額を生じさせないので一部清算の性格は乏しく会社債権者に重大な影響は与えないから"}]}, {"id": "book-kigyoho-01-art450", "article": "450条", "chs": [6], "topics": ["資本金の額・準備金の額の増加"], "points": [{"aspect": "要件", "text": "承認機関：株主総会の普通決議（450条2項、451条2項、309条1項）"}, {"aspect": "要件", "text": "債権者異議手続は不要"}]}, {"id": "book-kigyoho-01-art451", "article": "451条", "chs": [6], "topics": ["資本金の額・準備金の額の増加"], "points": [{"aspect": "要件", "text": "承認機関：株主総会の普通決議（450条2項、451条2項、309条1項）"}, {"aspect": "要件", "text": "債権者異議手続は不要"}]}, {"id": "book-kigyoho-01-art454", "article": "454条", "chs": [6], "topics": ["剰余金の配当の決定機関（原則と例外3つ・459条・460条）", "（応用）462条責任の三主体へのあてはめ―株主総会決議（454条1項）による剰余金の配当"], "points": [{"aspect": "趣旨", "text": "例外①の趣旨：金銭分配請求権を与えない場合は、金銭以外の配当を望まない株主はその換価性が保証されず不利益のおそれがあるので、株主総会の特別決議を必要とした"}, {"aspect": "要件", "text": "原則：株主総会の普通決議（454条1項）。趣旨：剰余金の配当は株主にとって重大な関心事であるので株主のコントロールを及ぼすのが適当だから"}, {"aspect": "要件", "text": "例外①：株主総会の特別決議（454条4項、309条2項10号）。配当財産が金銭以外の財産であり、かつ株主に対して金銭分配請求権を与えないこととする場合に限る"}, {"aspect": "要件", "text": "例外②：中間配当、取締役会決議（454条5項）。趣旨：このような中間配当は株主の利益を害さないから"}, {"aspect": "結論", "text": "あてはめ結果：A→462条1項柱書「当該行為に関する職務を行った業務執行者」、B→会社計算規則160条3号・462条1項6号イ「総会議案提案取締役」、C→369条5項・計算規則160条3号・462条1項6号イ「総会議案提案取締役」、D→462条1項柱書「金銭等の交付を受けた者」"}, {"aspect": "その他", "text": "設例の事案：甲社が株主総会決議（454条1項）で800万円の剰余金の配当（分配可能額500万円）を決定。代表取締役（業務執行取締役）Aが金銭の交付を自らしたか使用人に命じて交付させ、株主Dが交付を受けた。取締役会で議案決定の際、Bは賛成、Cは反対するも議事録に異議をとどめなかった"}]}, {"id": "book-kigyoho-01-art458", "article": "458条", "chs": [6], "topics": ["純資産額規制（458条）"], "points": [{"aspect": "要件", "text": "（2）純資産額規制（458条）の見出し。項目2冒頭の全体像では「純資産額300万円を下回ると配当できない（458条）」とされる"}]}, {"id": "book-kigyoho-01-art459", "article": "459条", "chs": [6], "topics": ["剰余金の配当の決定機関（原則と例外3つ・459条・460条）", "（応用）462条責任の三主体へのあてはめ―取締役会決議（459条）による剰余金の配当"], "points": [{"aspect": "趣旨", "text": "例外①の趣旨：金銭分配請求権を与えない場合は、金銭以外の配当を望まない株主はその換価性が保証されず不利益のおそれがあるので、株主総会の特別決議を必要とした"}, {"aspect": "趣旨", "text": "459条の趣旨：会社財産の分配は経営判断の一つともいえるので、適正な計算書類により分配可能額が確定している以上、その分配の決定を取締役会に委ねた方がよい場合もあるため"}, {"aspect": "要件", "text": "例外③：会計監査人設置会社、取締役会決議（459条1項
