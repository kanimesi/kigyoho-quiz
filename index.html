4号・460条）"}, {"aspect": "要件", "text": "原則：株主総会の普通決議（454条1項）。趣旨：剰余金の配当は株主にとって重大な関心事であるので株主のコントロールを及ぼすのが適当だから"}, {"aspect": "要件", "text": "例外①：株主総会の特別決議（454条4項、309条2項10号）。配当財産が金銭以外の財産であり、かつ株主に対して金銭分配請求権を与えないこととする場合に限る"}, {"aspect": "要件", "text": "例外②：中間配当、取締役会決議（454条5項）。趣旨：このような中間配当は株主の利益を害さないから"}, {"aspect": "結論", "text": "あてはめ結果：A→462条1項柱書「当該行為に関する職務を行った業務執行者」、B→会社計算規則159条8号ハ・462条1項柱書「当該行為に関する職務を行った業務執行者」、E→会社計算規則161条・462条1項6号ロ「取締役会議案提案取締役」"}, {"aspect": "その他", "text": "設例の事案：甲社が取締役会決議（459条）で800万円の剰余金の配当（分配可能額500万円）を決定。代表取締役（業務執行取締役）Aが金銭の交付を自らしたか使用人に命じて交付させ、株主が交付を受けた。Bは賛成、議案提出はE"}]}, {"id": "book-kigyoho-01-art460", "article": "460条", "chs": [6], "topics": ["剰余金の配当の決定機関（原則と例外3つ・459条・460条）"], "points": [{"aspect": "趣旨", "text": "460条の趣旨：会社財産の分配は経営判断の一つともいえるが、剰余金をどのように処分するかしないかは株主が重大な利害・関心を有する事項であるから"}, {"aspect": "要件", "text": "例外③：会計監査人設置会社、取締役会決議（459条1項4号・460条）"}, {"aspect": "要件", "text": "460条（株主の権利の制限）：459条1項の定款の定めがある場合、株式会社は同項各号の事項を株主総会の決議によっては定めない旨を定款で定めることができる。460条の定款がない限り、459条の定款の定めがあっても株主総会決議によって剰余金の配当等を決定できる"}, {"aspect": "要件", "text": "原則：株主総会の普通決議（454条1項）。趣旨：剰余金の配当は株主にとって重大な関心事であるので株主のコントロールを及ぼすのが適当だから"}, {"aspect": "要件", "text": "例外①：株主総会の特別決議（454条4項、309条2項10号）。配当財産が金銭以外の財産であり、かつ株主に対して金銭分配請求権を与えないこととする場合に限る"}, {"aspect": "要件", "text": "例外②：中間配当、取締役会決議（454条5項）。趣旨：このような中間配当は株主の利益を害さないから"}]}, {"id": "book-kigyoho-01-art461", "article": "461条", "chs": [3, 6], "topics": ["財源規制（461条）と違反責任（462条）・自己株式の保有・消却・処分", "（論点）財源規制（461条）に違反した自己株式取得の効力", "財源規制（分配可能額規制、461条1項8号）", "（論点）違法な剰余金の配当（分配可能額違反、461条1項8号違反）の効力", "財源規制（分配可能額規制）の趣旨（461条1項2号3号）"], "points": [{"aspect": "制度名", "text": "自己株式の取得・財源規制"}, {"aspect": "趣旨", "text": "財源規制の趣旨：自己株式の有償取得は実質的には株主への会社財産の分配であるから、株主が有限責任（104条）しか負わない株式会社においては会社債権者を害するおそれがある。そこで財源規制が課された"}, {"aspect": "要件", "text": "（5）財源規制（分配可能額規制）（461条）：461条違反の剰余金の配当の効力は後述。461条違反責任は462条（しっかり読めるように）。462条1項は主体3者（A,B,C）と効果、2項はB,Cの（立証責任が転換された）過失責任、3項は総株主の同意による免除（B,Cに関して）"}, {"aspect": "要件", "text": "（3）財源規制（分配可能額規制、461条1項8号）の見出し。項目2冒頭の全体像では「分配可能額を超えて配当できない（461条1項8号）」とされる"}, {"aspect": "要件", "text": "関連（自己株式の保有・消却・処分）：保有はいつまでも保有でき、「相当の時期に処分」しなければならないという規定は会社法では削除された。消却は178条（後述）で自己株式のみ消却できる（甲社はCが保有する甲株を消却できない）。処分は199条以下（後述）で「募集株式の発行等」の「等」にあたる"}, {"aspect": "結論", "text": "財源規制違反の取得は無効である。①461条1項は「分配可能額を超えてはならない」と規定していることから無効と解するのが自然であり、②461条が資本維持の原則（要請）から規定されたとの趣旨からもその違反は無効と解すべきである"}, {"aspect": "結論", "text": "問題提起と理由：分配可能額規制（461条）は資本維持の原則から規定されたものであり、それに反する場合無効とすべきである。また461条1項柱書は「分配可能額を超えてはならない」と規定しており、分配可能額を超える場合はその配当を無効と解するのが自然である"}, {"aspect": "結論", "text": "結論：分配可能額（461条1項8号）を超えた剰余金の配当は無効と解する"}]}, {"id": "book-kigyoho-01-art462", "article": "462条", "chs": [3, 6], "topics": ["財源規制（461条）と違反責任（462条）・自己株式の保有・消却・処分", "違法な剰余金の配当に関する責任（462条、463条）", "（応用）462条責任の三主体へのあてはめ―株主総会決議（454条1項）による剰余金の配当"], "points": [{"aspect": "制度名", "text": "461条（財源）違反の場合の責任"}, {"aspect": "趣旨", "text": "3者が責任を負う趣旨：会社債権者保護のため（資本維持の原則のため重大な違反だから）。「交付を受けた金銭等の帳簿価額に相当する金銭」全体を支払う義務が生じる趣旨：当該分配は全体として違法であるため"}, {"aspect": "要件", "text": "（5）財源規制（分配可能額規制）（461条）：461条違反の剰余金の配当の効力は後述。461条違反責任は462条（しっかり読めるように）。462条1項は主体3者（A,B,C）と効果、2項はB,Cの（立証責任が転換された）過失責任、3項は総株主の同意による免除（B,Cに関して）"}, {"aspect": "要件", "text": "462条：主体は3者。効果は、当該株式会社に対し連帯して、当該金銭等の交付を受けた者が「交付を受けた金銭等の帳簿価額に相当する金銭」を支払う義務を負う"}, {"aspect": "要件", "text": "関連（自己株式の保有・消却・処分）：保有はいつまでも保有でき、「相当の時期に処分」しなければならないという規定は会社法では削除された。消却は178条（後述）で自己株式のみ消却できる（甲社はCが保有する甲株を消却できない）。処分は199条以下（後述）で「募集株式の発行等」の「等」にあたる"}, {"aspect": "結論", "text": "あてはめ結果：A→462条1項柱書「当該行為に関する職務を行った業務執行者」、B→会社計算規則160条3号・462条1項6号イ「総会議案提案取締役」、C→369条5項・計算規則160条3号・462条1項6号イ「総会議案提案取締役」、D→462条1項柱書「金銭等の交付を受けた者」"}, {"aspect": "その他", "text": "設例：自己株式の取得の対価として会社が総額3000万円支払ったが（分配可能額は2000万円）、総株主が免除の同意をした場合、B,Cは全額支払いの免除となるか。免除は2000万円の限度であって、B,Cは1000万円の支払義務をなお負う（462条3項）"}]}, {"id": "book-kigyoho-01-art463", "article": "463条", "chs": [6], "topics": ["違法な剰余金の配当に関する責任（462条、463条）"], "points": [{"aspect": "趣旨", "text": "3者が責任を負う趣旨：会社債権者保護のため（資本維持の原則のため重大な違反だから）。「交付を受けた金銭等の帳簿価額に相当する金銭」全体を支払う義務が生じる趣旨：当該分配は全体として違法であるため"}, {"aspect": "要件", "text": "463条の見出し（（2）違法な剰余金の配当に関する責任（462条、463条）の下位見出し）"}]}, {"id": "book-kigyoho-01-art465", "article": "465条", "chs": [6], "topics": ["事後の欠損填補責任（465条）"], "points": [{"aspect": "趣旨", "text": "趣旨：期末時点の株主保護（＋副次的には会社債権者保護）。剰余金配当をしすぎることによって期末時点の株主の利益を害さないようにするため"}, {"aspect": "趣旨", "text": "（参考）CPAレギュラー講義テキストの説明：業務執行者の欠損填補責任は、資本維持の原則の一環として、剰余金の配当等に関与する業務執行者に対して、事後に欠損が生じる可能性があれば剰余金の配当を行わないという義務を課したものである"}, {"aspect": "要件", "text": "465条1項の要件：株式会社が剰余金を配当する時点では財源規制に違反しなかったが、事業年度末に欠損が生じたこと"}, {"aspect": "要件", "text": "465条1項の効果：剰余金の配当に関する業務執行者は、当該株式会社に対し連帯して、その超過額（当該超過額が当該剰余金の配当により株主に対して交付した金銭等の帳簿価額の総額を超える場合にあっては当該帳簿価額の総額）を支払う義務を負う"}, {"aspect": "要件", "text": "465条1項但書：立証責任を転嫁した過失責任"}, {"aspect": "要件", "text": "465条2項：総株主の同意で免除が可能"}, {"aspect": "要件", "text": "欠損填補責任が生じない場合ⅰ：定時株主総会において剰余金の配当がなされる場合（465条1項10号イ）。計算書類の承認と同時になされる事業年度ごとの剰余金の配当についてまで対象とすると、業務執行者が過度に剰余金の配当に消極的になり株主の利益に反するおそれがあるから"}, {"aspect": "要件", "text": "欠損填補責任が生じない場合ⅱ：資本金または準備金の額の減少に伴う剰余金の配当のうち一定のもの（465条1項10号ロ・ハ）。資本金・準備金の減少に関する株主総会で配当事項を定め、かつ配当財産の額が減少額を超えない場合（減少額の全部または一部を資本金・準備金とする定めがない場合に限る）は責任を負わない。資本金・準備金の減少について株主総会決議（447条1項、448条1項）と債権者異議手続（449条）がとられているため"}]}, {"id": "book-kigyoho-01-art466", "article": "466条", "chs": [3, 10], "topics": ["定款変更の原則（株主総会の特別決議）", "定款変更の原則（特別決議）と特則（2つ）"], "points": [{"aspect": "制度名", "text": "定款変更（原則）"}, {"aspect": "要件", "text": "定款変更には、原則として株主総会の特別決議が必要である（466条、309条2項11号）"}, {"aspect": "結論", "text": "株式会社の定款変更は原則として株主総会の特別決議（466条、309条2項11号）によるが、上記表のうち2つ（特殊決議と株主全員の同意）はその特則である"}]}, {"id": "book-kigyoho-01-art467", "article": "467条", "chs": [4, 8], "topics": ["事後設立（467条1項5号）", "事業譲渡等の承認（467条）", "事業譲渡の位置づけ（組織再編行為ではなく取引行為）", "事業譲渡の定義図（①②③）", "（論点）467条1項1号2号（3号）の事業譲渡の意義（定義）", "（論点）467条1項2号の「重要な一部」"], "points": [{"aspect": "趣旨", "text": "事後設立規制の趣旨：財産引受け規制の潜脱手段として利用されるおそれがあるから"}, {"aspect": "趣旨", "text": "①の趣旨：事業譲渡等は、会社の運命に重大な影響を及ぼし株主に重大な影響を与えるからである"}, {"aspect": "趣旨", "text": "趣旨：株主に重大な影響を与えるためである。この場合、親会社が支配権を失うことや、事業の重要な一部の譲渡をしたのと異ならない点から、親会社の株主の利益に重大な影響を及ぼすからである"}, {"aspect": "定義", "text": "事後設立は簡単に言うと、会社成立後直後の売買契約である"}, {"aspect": "定義", "text": "①の財産には、積極財産・消極財産の両方を含み、積極財産は「物」「権利」のみならず、営業上の秘訣・得意先・創業年代など暖簾とか老舗とか呼ばれる「事実関係」も含む"}, {"aspect": "要件", "text": "467条1項5号の条文：株式会社は、成立後2年以内における成立前から存在する財産で事業のために継続して使用するものの取得については、効力発生日の前日までに株主総会の決議によって契約の承認を受けなければならない。ただし、対価として交付する財産の帳簿価額の合計額（イ）の純資産額（ロ）に対する割合が5分の1（定款で定めた場合はその割合）を超えない場合を除く"}, {"aspect": "要件", "text": "467条柱書：株式会社は、次に掲げる行為をする場合には、効力発生日の前日までに、株主総会の決議によって、当該行為に係る契約の承認を受けなければならない"}, {"aspect": "要件", "text": "467条1項1号：事業の全部の譲渡"}]}, {"id": "book-kigyoho-01-art468", "article": "468条", "chs": [8, 9], "topics": ["略式組織再編（特別支配会社）"], "points": [{"aspect": "要件", "text": "注記：「前条第一項の規定」とは、株主総会の特別決議を要求する規定である。「特別支配会社」の定義は、略式事業譲渡の規定の中にある（468条1項）"}, {"aspect": "要件", "text": "468条1項（事業譲渡等の承認を要しない場合）：特別支配会社とは、ある株式会社の総株主の議決権の十分の九（これを上回る割合を定款で定めた場合は、その割合）以上を他の会社及び当該他の会社が発行済株式の全部を有する株式会社その他これに準ずるものとして法務省令で定める法人が有している場合における当該他の会社をいう"}]}, {"id": "book-kigyoho-01-art469", "article": "469条", "chs": [8, 9], "topics": ["事業譲渡の手続（特別決議・反対株主の株式買取請求）", "株式買取請求が認められない場合（3）事業の全部譲渡と解散決議"], "points": [{"aspect": "趣旨", "text": "②の趣旨：反対する株主の投下資本回収手続を保障して経済的救済を図るためである"}, {"aspect": "趣旨", "text": "趣旨：解散決議をした場合株主は残余財産の分配を受けるので（105条1項2号、504条）、株式買取請求によって経済的救済を図る必要はないからである"}, {"aspect": "要件", "text": "②反対株主の株式買取請求（469条）"}, {"aspect": "要件", "text": "事業の全部譲渡の場合に、譲渡会社が株主総会で、承認決議と同時に会社の解散決議をした場合は、買取請求は認められない（469条1項1号）"}]}, {"id": "book-kigyoho-01-art576", "article": "576条", "chs": [7], "topics": ["定款の記載事項（576条2項〜4項）"], "points": [{"aspect": "要件", "text": "合名会社の場合の定款記載事項：第一項第五号に掲げる事項として、その社員の全部を無限責任社員とする旨を記載し、又は記録しなければならない（576条2項）"}, {"aspect": "要件", "text": "合資会社の場合の定款記載事項：第一項第五号に掲げる事項として、その社員の一部を無限責任社員とし、その他の社員を有限責任社員とする旨を記載し、又は記録しなければならない（576条3項）"}, {"aspect": "要件", "text": "合同会社の場合の定款記載事項：第一項第五号に掲げる事項として、その社員の全部を有限責任社員とする旨を記載し、又は記録しなければならない（576条4項）"}]}, {"id": "book-kigyoho-01-art585", "article": "585条", "chs": [7], "topics": ["持分の譲渡と他の社員の保護（585条1項・2項）"], "points": [{"aspect": "その他", "text": "冒頭の問い：Q1 585条1項の趣旨は？／Q2 585条2項の趣旨は？（趣旨そのものの文章は本ページに記載がなく、問いの提示のみ）"}, {"aspect": "その他", "text": "関係図：甲持分会社の社員Cが持分の全部をDに譲渡する。譲渡で不利益を被るのは、①他の社員（A,B）→585条1項2項で保護、②会社債権者X（甲社に債権を有する）→586条1項で保護"}, {"aspect": "その他", "text": "論文試験Q1「持分の譲渡をする際の手続きについて説明しなさい。」→585条1項2項とその趣旨を書く"}, {"aspect": "その他", "text": "論文試験Q3「持分の譲渡をする場合において、譲渡社員以外の社員は会社法上どのように保護されているか説明しなさい。」→585条1項2項とその趣旨を書く"}]}, {"id": "book-kigyoho-01-art586", "article": "586条", "chs": [7], "topics": ["持分の譲渡と会社債権者の保護（586条1項）"], "points": [{"aspect": "その他", "text": "冒頭の問い：Q3 586条1項の趣旨は？（趣旨そのものの文章は本ページに記載がなく、問いの提示のみ）"}, {"aspect": "その他", "text": "論文試験Q2「持分の譲渡をする場合において、会社債権者は会社法上どのように保護されているか説明しなさい。」→586条1項とその趣旨を書く"}]}, {"id": "book-kigyoho-01-art590", "article": "590条", "chs": [7], "topics": ["持分会社の基本構造（社員の個性重視・所有と経営の一致）", "管理の総論（590条）"], "points": [{"aspect": "要件", "text": "（1）総論は590条（見出しのみで本文説明はない。590条の内容「各社員→業務執行権あり」は項目1の枠（p.284）とⅡ重要条文（p.292）に記載）"}, {"aspect": "結論", "text": "持分会社では、社員の個性が重視される（580条1項、590条1項・599条1項）"}, {"aspect": "結論", "text": "持分会社では、所有と経営が一致する（590条1項、599条1項）"}]}, {"id": "book-kigyoho-01-art593", "article": "593条", "chs": [7], "topics": ["業務執行社員の義務（593条・594条）"], "points": [{"aspect": "要件", "text": "593条1項：善管注意義務（（2）業務執行社員。cf.取締役）"}, {"aspect": "要件", "text": "593条2項：忠実義務"}, {"aspect": "要件", "text": "競業の承認要件は「当該社員以外の社員の全員の承認」"}]}, {"id": "book-kigyoho-01-art594", "article": "594条", "chs": [7], "topics": ["業務執行社員の義務（593条・594条）"], "points": [{"aspect": "要件", "text": "594条：競業の禁止。趣旨は持分会社の利益保護"}, {"aspect": "要件", "text": "競業の承認要件は「当該社員以外の社員の全員の承認」"}, {"aspect": "要件", "text": "594条2項＝423条2項"}]}, {"id": "book-kigyoho-01-art595", "article": "595条", "chs": [7], "topics": ["利益相反取引規制（595条）"], "points": [{"aspect": "要件", "text": "595条：利益相反取引規制。趣旨は持分会社の利益保護"}, {"aspect": "要件", "text": "承認要件は「当該社員以外の社員の過半数の承認」（594条の全員の承認と対比）"}, {"aspect": "要件", "text": "当該利益相反取引社員の会社に対する責任は596条による（cf.423条1項と同様に考える）"}, {"aspect": "結論", "text": "当該社員以外の社員の過半数の承認がない場合の利益相反取引の効力については、相対的無効説による（cf.株式会社の取締役の場合と同様に考える）"}]}, {"id": "book-kigyoho-01-art596", "article": "596条", "chs": [7], "topics": ["業務執行社員の責任（596条・597条）", "利益相反取引規制（595条）"], "points": [{"aspect": "要件", "text": "596条：業務を執行する社員の持分会社に対する損害賠償責任＝423条1項"}, {"aspect": "要件", "text": "当該利益相反取引社員の会社に対する責任は596条による（cf.423条1項と同様に考える）"}]}, {"id": "book-kigyoho-01-art597", "article": "597条", "chs": [7], "topics": ["業務執行社員の責任（596条・597条）"], "points": [{"aspect": "要件", "text": "597条：業務を執行する有限責任社員の第三者に対する損害賠償責任"}, {"aspect": "その他", "text": "設例図：倒産の恐れのある甲社の業務執行社員の任務懈怠によりXに損害（1000万円）が生じた場面。Xは無限責任社員Aには責任追及が可能だが、有限責任社員Bに1000万円の責任追及はできない。そこで597条が問題になる"}]}, {"id": "book-kigyoho-01-art599", "article": "599条", "chs": [7], "topics": ["持分会社の基本構造（社員の個性重視・所有と経営の一致）", "持分会社の代表（599条・601条）"], "points": [{"aspect": "要件", "text": "599条：持分会社の代表。1項：原則、業務執行社員＝代表権あり"}, {"aspect": "要件", "text": "599条4項、5項＝349条4項5項"}, {"aspect": "結論", "text": "持分会社では、社員の個性が重視される（580条1項、590条1項・599条1項）"}, {"aspect": "結論", "text": "持分会社では、所有と経営が一致する（590条1項、599条1項）"}]}, {"id": "book-kigyoho-01-art601", "article": "601条", "chs": [7], "topics": ["持分会社の代表（599条・601条）"], "points": [{"aspect": "要件", "text": "601条：持分会社と社員との間の訴えにおける会社の代表"}]}, {"id": "book-kigyoho-01-art602", "article": "602条", "chs": [7], "topics": ["社員による責任追及の訴え（602条）"], "points": [{"aspect": "要件", "text": "602条は、責任追及の訴え（株主代表訴訟、847条）と似た規定である"}]}, {"id": "book-kigyoho-01-art604", "article": "604条", "chs": [7], "topics": ["社員の加入（604条・605条）"], "points": [{"aspect": "要件", "text": "（1）社員の加入（604条・605条）（見出しのみで本文説明はない）"}]}, {"id": "book-kigyoho-01-art605", "article": "605条", "chs": [7], "topics": ["社員の加入（604条・605条）"], "points": [{"aspect": "要件", "text": "（1）社員の加入（604条・605条）（見出しのみで本文説明はない）"}]}, {"id": "book-kigyoho-01-art606", "article": "606条", "chs": [7], "topics": ["社員の退社（定義・任意退社・法定退社）"], "points": [{"aspect": "要件", "text": "任意退社（606条）"}]}, {"id": "book-kigyoho-01-art611", "article": "611条", "chs": [7], "topics": ["退社に伴う持分の払戻し"], "points": [{"aspect": "要件", "text": "原則：制限なし（611条）。趣旨：会社債権者を害さないから"}]}, {"id": "book-kigyoho-01-art612", "article": "612条", "chs": [7], "topics": ["退社の際の会社債権者の保護（612条）"], "points": [{"aspect": "その他", "text": "設例図：Xは「Aがいるから安心」と思い甲社に1億円を貸したが、A（たとえば、大金持ちの無限責任社員。個性あり）が退社する。そこで612条（cf.586条1項）が問題になる。「持分の譲渡」の場合と同様の構造"}, {"aspect": "その他", "text": "Q「社員の退社の際の会社債権者の会社法上の保護について説明しなさい。」→612条とその趣旨を書く"}]}, {"id": "book-kigyoho-01-art614", "article": "614条", "chs": [7], "topics": [], "points": [{"aspect": "制度名", "text": "□計算等：614条～"}]}, {"id": "book-kigyoho-01-art624", "article": "624条", "chs": [7], "topics": ["出資の払戻し"], "points": [{"aspect": "要件", "text": "原則：制限なし（624条）。趣旨：会社債権者を害さないから"}, {"aspect": "比較", "text": "「出資の払戻し」は、社員たる地位が残る点で、「退社に伴う持分の払戻し」とは異なる"}]}, {"id": "book-kigyoho-01-art625", "article": "625条", "chs": [7], "topics": [], "points": [{"aspect": "制度名", "text": "□合同会社の計算等に関する特則：625条～"}]}, {"id": "book-kigyoho-01-art628", "article": "628条", "chs": [7], "topics": ["合同会社の利益の配当の特則"], "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "要件", "text": "628条1項2項（利益の配当の制限）＝461条"}]}, {"id": "book-kigyoho-01-art629", "article": "629条", "chs": [7], "topics": ["合同会社の利益の配当の特則"], "points": [{"aspect": "要件", "text": "629条1項2項（利益の配当に関する責任）cf.462条"}]}, {"id": "book-kigyoho-01-art630", "article": "630条", "chs": [7], "topics": ["合同会社の利益の配当の特則"], "points": [{"aspect": "要件", "text": "630条＝463条（社員に対する求償権の制限等）"}]}, {"id": "book-kigyoho-01-art631", "article": "631条", "chs": [7], "topics": ["合同会社の利益の配当の特則"], "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "要件", "text": "631条（事後の欠損填補責任）＝465条"}]}, {"id": "book-kigyoho-01-art632", "article": "632条", "chs": [7], "topics": ["出資の払戻し"], "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "要件", "text": "例外は合同会社の特則：632条（出資の払戻しの制限）。2項＝461条"}]}, {"id": "book-kigyoho-01-art633", "article": "633条", "chs": [7], "topics": ["出資の払戻し"], "points": [{"aspect": "要件", "text": "633条（出資の払戻しに関する社員の責任）cf.462条"}]}, {"id": "book-kigyoho-01-art634", "article": "634条", "chs": [7], "topics": ["出資の払戻し"], "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "要件", "text": "634条（社員に対する求償権の制限等）＝463条"}]}, {"id": "book-kigyoho-01-art635", "article": "635条", "chs": [7], "topics": ["退社に伴う持分の払戻し"], "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "要件", "text": "例外は合同会社の特則：635条（債権者の異議）"}]}, {"id": "book-kigyoho-01-art636", "article": "636条", "chs": [7], "topics": ["退社に伴う持分の払戻し"], "points": [{"aspect": "趣旨", "text": "合同会社の特則の趣旨は、会社債権者の保護のため"}, {"aspect": "要件", "text": "636条（業務を執行する社員の責任）cf.462条"}]}, {"id": "book-kigyoho-01-art637", "article": "637条", "chs": [7], "topics": ["定款変更（637条）と関連訴訟"], "points": [{"aspect": "要件", "text": "6 定款変更（637条）（見出しのみで本文説明はない）"}]}, {"id": "book-kigyoho-01-art676", "article": "676条", "chs": [5], "topics": [], "points": [{"aspect": "制度名", "text": "Ⅱ□新株予約権の発行：238条～。□新株予約権発行の差止請求：247条。□社債とくれば：676条～"}]}, {"id": "book-kigyoho-01-art749", "article": "749条", "chs": [9], "topics": ["合併の効果（3つの当然）"], "points": [{"aspect": "要件", "text": "3つの当然の根拠条文：①は750条1項、②は471条4号・475条1号かっこ書き、③は749条1項2号"}, {"aspect": "要件", "text": "対価の柔軟化：749条1項2号ホは、当該金銭等が吸収合併存続株式会社の株式等以外の財産であるとき（金銭、親会社の株式等）も対価とすることを認めるもので、「ホ」を認めることが「対価の柔軟化」である"}]}, {"id": "book-kigyoho-01-art750", "article": "750条", "chs": [9], "topics": ["合併の効果（3つの当然）", "条文構造の具体例（吸収合併の効果・手続の条文）"], "points": [{"aspect": "要件", "text": "3つの当然の根拠条文：①は750条1項、②は471条4号・475条1号かっこ書き、③は749条1項2号"}, {"aspect": "その他", "text": "たとえば図：甲株式会社・乙株式会社の吸収合併では、効果は両社とも750条、手続きは甲社が782条〜792条、乙社が794条〜801条"}]}, {"id": "book-kigyoho-01-art758", "article": "758条", "chs": [9], "topics": ["会社分割の効果（合併の3つの当然のあてはめ）"], "points": [{"aspect": "要件", "text": "物的分割の根拠：①は759条1項。物的分割の条文は758条4号（「吸収分割会社に対して」）・759条8項（「吸収分割会社は」）"}, {"aspect": "要件", "text": "いわゆる人的分割の根拠条文：（ⅰ）758条8号ロ・760条7号ロ、（ⅱ）財源制限なしは792条2号、（ⅲ）債権者異議手続きは789条1項2号第2かっこ書き"}]}, {"id": "book-kigyoho-01-art759", "article": "759条", "chs": [9], "topics": ["2項・3項の効果と要件（各別の催告を受けなかった債権者の履行請求）"], "points": [{"aspect": "要件", "text": "2項＜効果＞X2は「分割会社（甲社）に対して、当該債務の履行請求できる」。＜要件＞①債権者異議手続きが与えられている分割会社の債権者で、各別の催告（＊1）を受けなかった債権者、②分割会社に債務の履行請求ができない場合"}, {"aspect": "要件", "text": "3項＜効果＞いわゆる人的分割の場合のX1は「承継・設立会社（乙社）に対して、当該債務の履行請求できる」。＜要件＞①債権者異議手続きが与えられている分割会社の債権者で、各別の催告（＊1）を受けなかった債権者、②分割設立会社に債務の履行請求ができない場合"}]}, {"id": "book-kigyoho-01-art764", "article": "764条", "chs": [9], "topics": ["2項・3項の効果と要件（各別の催告を受けなかった債権者の履行請求）", "詐害的会社分割（詐害分割）における残存債権者保護（4項・5項）"], "points": [{"aspect": "要件", "text": "2項＜効果＞X2は「分割会社（甲社）に対して、当該債務の履行請求できる」。＜要件＞①債権者異議手続きが与えられている分割会社の債権者で、各別の催告（＊1）を受けなかった債権者、②分割会社に債務の履行請求ができない場合"}, {"aspect": "要件", "text": "764条2項（新設分割）：第1項の規定にかかわらず、810条1項2号の規定により異議を述べることができる新設分割会社の債権者であって、810条2項の各別の催告を受けなかったもの（810条3項に規定する場合は不法行為債権者に限る）は、新設分割計画で新設分割後に新設分割会社に対して債務の履行を請求することができないものとされているときであっても、新設分割会社に対して、新設分割会社が新設分割設立株式会社の成立の日に有していた財産の価額を限度として、当該債務の履行を請求することができる"}, {"aspect": "要件", "text": "3項＜効果＞いわゆる人的分割の場合のX1は「承継・設立会社（乙社）に対して、当該債務の履行請求できる」。＜要件＞①債権者異議手続きが与えられている分割会社の債権者で、各別の催告（＊1）を受けなかった債権者、②分割設立会社に債務の履行請求ができない場合"}, {"aspect": "要件", "text": "764条3項（新設分割）：第1項の規定にかかわらず、810条1項2号の規定により異議を述べることができる新設分割会社の債権者であって、同条2項の各別の催告を受けなかったものは、新設分割計画で新設分割後に新設分割設立株式会社に対して債務の履行を請求することができないものとされているときであっても、新設分割設立株式会社に対して、承継した財産の価額を限度として、当該債務の履行を請求することができる"}, {"aspect": "要件", "text": "＜効果＞Xは「承継・設立会社（乙社）に対して、当該債務の履行請求できる」。＜要件＞①分割会社が残存債権者を「害する」ことを知って会社分割をした場合（客観的な詐害分割行為と主観的な分割会社の悪意と考えてもよい）、②吸収分割の場合は、さらに、承継会社の悪意（4項ただし書）"}, {"aspect": "要件", "text": "764条4項（新設分割）：第1項の規定にかかわらず、新設分割会社が新設分割設立株式会社に承継されない債務の債権者（残存債権者）を害することを知って新設分割をした場合には、残存債権者は、新設分割設立株式会社に対して、承継した財産の価額を限度として、当該債務の履行を請求することができる"}, {"aspect": "要件", "text": "5項：いわゆる人的分割の場合は4項不適用（764条5項：前項の規定は、前条第一項第十二号に掲げる事項についての定めがある場合には、適用しない）。趣旨は、いわゆる人的分割の場合は債権者異議手続きがあるので（789条1項2号第二かっこ書、810条1項2号第二かっこ書）、債権者の保護は債権者異議手続で図られるからである"}]}, {"id": "book-kigyoho-01-art768", "article": "768条", "chs": [9], "topics": ["株式交換・株式移転の効果（合併の3つの当然のあてはめ）"], "points": [{"aspect": "要件", "text": "根拠条文：完全親子会社関係の構築（効果発生）は769条1項/774条1項、③の地位移転は768条1項2号/773条1項5号、769条3項/774条2項3項"}, {"aspect": "結論", "text": "株式交換・株式移転では、各当事会社の会社財産は変動しない（①の否定）。株式移転の場合、消滅する会社はない（②の否定）。完全子会社の株主の地位が移転するのみである（③のみ肯定）"}]}, {"id": "book-kigyoho-01-art769", "article": "769条", "chs": [9], "topics": ["株式交換・株式移転の効果（合併の3つの当然のあてはめ）"], "points": [{"aspect": "要件", "text": "根拠条文：完全親子会社関係の構築（効果発生）は769条1項/774条1項、③の地位移転は768条1項2号/773条1項5号、769条3項/774条2項3項"}, {"aspect": "結論", "text": "株式交換・株式移転では、各当事会社の会社財産は変動しない（①の否定）。株式移転の場合、消滅する会社はない（②の否定）。完全子会社の株主の地位が移転するのみである（③のみ肯定）"}]}, {"id": "book-kigyoho-01-art773", "article": "773条", "chs": [9], "topics": ["株式交換・株式移転の効果（合併の3つの当然のあてはめ）"], "points": [{"aspect": "要件", "text": "根拠条文：完全親子会社関係の構築（効果発生）は769条1項/774条1項、③の地位移転は768条1項2号/773条1項5号、769条3項/774条2項3項"}, {"aspect": "結論", "text": "株式交換・株式移転では、各当事会社の会社財産は変動しない（①の否定）。株式移転の場合、消滅する会社はない（②の否定）。完全子会社の株主の地位が移転するのみである（③のみ肯定）"}]}, {"id": "book-kigyoho-01-art774", "article": "774条", "chs": [9], "topics": ["株式交換・株式移転の効果（合併の3つの当然のあてはめ）", "株式交付の条文の所在（774条の2以下と816条の2以下の区別）"], "points": [{"aspect": "要件", "text": "根拠条文：完全親子会社関係の構築（効果発生）は769条1項/774条1項、③の地位移転は768条1項2号/773条1項5号、769条3項/774条2項3項"}, {"aspect": "要件", "text": "（4）条文：まずは、774条の2（ナナヨンノニ）。（参照）第一章〜第四章は手続き以外（契約、計画、効果等）を定め、第五章は組織変更、合併、会社分割、株式交換、株式移転及び株式交付の手続（775条〜）で、第四節が株式交付の手続（816条の2〜816条の10）である"}, {"aspect": "要件", "text": "株式交付に関する手続き（株主Aの譲渡の申込→乙株の割当など）は774条の2以下である。なぜ816条の2以下ではないのか→株式交付「計画」に会社が譲り受ける株式の株の下限等を記載するのである"}, {"aspect": "要件", "text": "乙社の株主総会などの手続きは816条の2以下である（株式交付は、いわば部分的な株式交換である）。甲社の手続きは不要である。甲社は株式交付の当事者ではないからである"}, {"aspect": "要件", "text": "第4章の2 株式交付の条文一覧：774条の2（株式交付計画の作成）、774条の3（株式交付計画）、774条の4（株式交付子会社の株式の譲渡しの申込み）、774条の5（株式交付親会社が譲り受ける株式交付子会社の株式の割当て）、774条の6（譲渡しの申込み及び割当てに関する特則）、774条の7（株式交付子会社の株式の譲渡し）、774条の8（株式交付子会社の株式の譲渡しの無効又は取消しの制限）、774条の9（株式交付子会社の株式の譲渡しに関する規定の準用）、774条の10（申込みがあった株式交付子会社の株式の数が下限の数に満たない場合）、774条の11（株式交付の効力の発生等）"}, {"aspect": "結論", "text": "株式交換・株式移転では、各当事会社の会社財産は変動しない（①の否定）。株式移転の場合、消滅する会社はない（②の否定）。完全子会社の株主の地位が移転するのみである（③のみ肯定）"}]}, {"id": "book-kigyoho-01-art774-2", "article": "774条の2", "chs": [9], "topics": ["株式交付の定義と制度の趣旨", "株式交付の条文の所在（774条の2以下と816条の2以下の区別）"], "points": [{"aspect": "趣旨", "text": "（3）全体の趣旨：親子会社関係を円滑に創設するため"}, {"aspect": "定義", "text": "株式交付（774条の2〜、816条の2〜）は令和元年新設。株式交付とは、株式会社が他の株式会社をその子会社とするために当該他の株式会社の株式を譲り受け、当該株式の譲渡人に対して当該株式の対価として当該株式会社の株式を交付することをいう（2条32号の2）"}, {"aspect": "要件", "text": "（4）条文：まずは、774条の2（ナナヨンノニ）。（参照）第一章〜第四章は手続き以外（契約、計画、効果等）を定め、第五章は組織変更、合併、会社分割、株式交換、株式移転及び株式交付の手続（775条〜）で、第四節が株式交付の手続（816条の2〜816条の10）である"}, {"aspect": "要件", "text": "株式交付に関する手続き（株主Aの譲渡の申込→乙株の割当など）は774条の2以下である。なぜ816条の2以下ではないのか→株式交付「計画」に会社が譲り受ける株式の株の下限等を記載するのである"}, {"aspect": "要件", "text": "第4章の2 株式交付の条文一覧：774条の2（株式交付計画の作成）、774条の3（株式交付計画）、774条の4（株式交付子会社の株式の譲渡しの申込み）、774条の5（株式交付親会社が譲り受ける株式交付子会社の株式の割当て）、774条の6（譲渡しの申込み及び割当てに関する特則）、774条の7（株式交付子会社の株式の譲渡し）、774条の8（株式交付子会社の株式の譲渡しの無効又は取消しの制限）、774条の9（株式交付子会社の株式の譲渡しに関する規定の準用）、774条の10（申込みがあった株式交付子会社の株式の数が下限の数に満たない場合）、774条の11（株式交付の効力の発生等）"}, {"aspect": "要件", "text": "乙社の株主総会などの手続きは816条の2以下である（株式交付は、いわば部分的な株式交換である）。甲社の手続きは不要である。甲社は株式交付の当事者ではないからである"}]}, {"id": "book-kigyoho-01-art782", "article": "782条", "chs": [3, 9], "topics": ["（参）吸収合併消滅会社等の手続の条文一覧（782条〜792条）", "金銭を対価とする（略式）株式交換によるキャッシュ・アウト"], "points": [{"aspect": "要件", "text": "（参）第1款第1目 株式会社の手続の条文一覧：782条（吸収合併契約等に関する書面等の備置き及び閲覧等）、783条（吸収合併契約等の承認等）、784条（吸収合併契約等の承認を要しない場合）、784条の2（吸収合併等をやめることの請求）、785条（反対株主の株式買取請求）、786条（株式の価格の決定等）、787条（新株予約権買取請求）、788条（新株予約権の価格の決定等）、789条（債権者の異議）、790条（吸収合併等の効力発生日の変更）、791条（吸収分割又は株式交換に関する書面等の備置き及び閲覧等）、792条（剰余金の配当等に関する特則）"}, {"aspect": "要件", "text": "事前開示（782条1項、794条1項）、事後開示（791条1項2項、801条2項3項）。差止請求権（784条の2柱書本文1号、796条の2柱書本文1号。要件：①法令・定款違反②株主が不利益を受けるおそれがあること）。略式株式交換の場合は784条の2柱書本文2号、796条の2柱書本文2号で、要件は①対価が著しく不当である場合②株式交換完全子会社の株主が不利益を受けるおそれがあること（いずれも趣旨は株主（少数株主）保護のため）"}]}, {"id": "book-kigyoho-01-art783", "article": "783条", "chs": [9], "topics": ["（問題1）吸収合併の承認決定手続（対価の種類による違い）"], "points": [{"aspect": "要件", "text": "①乙社株式の場合：甲社は株主総会の特別決議（783条1項、309条2項12号）、乙社も株主総会の特別決議（795条1項、309条2項12号）"}, {"aspect": "要件", "text": "②譲渡制限株式である乙社株式の場合：甲社は株主総会の特殊決議（783条1項、309条3項2号）、乙社は株主総会の特別決議（795条1項、309条2項12号）"}, {"aspect": "要件", "text": "③持分の場合：甲社は総株主の同意（783条2項）、乙社は株主総会の特別決議（795条1項、309条2項12号）"}]}, {"id": "book-kigyoho-01-art784", "article": "784条", "chs": [9], "topics": ["略式組織再編（特別支配会社）", "簡易組織再編"], "points": [{"aspect": "趣旨", "text": "略式組織再編の趣旨：被支配会社の株主総会決議成立が確実視されるにもかかわらず、多くの時間や費用を投じて株主総会の開催を強制する合理性がないからである"}, {"aspect": "趣旨", "text": "簡易組織再編の趣旨：簡易組織再編の場合、株主への影響が小さいので、株主総会決議を要求しなくても株主保護に欠けるところがないからである"}, {"aspect": "要件", "text": "784条1項（吸収合併契約等の承認を要しない場合）：前条第一項の規定は、存続会社等が消滅株式会社等の特別支配会社である場合には、適用しない"}, {"aspect": "要件", "text": "注記：「前条第一項の規定」とは、株主総会の特別決議を要求する規定である。「特別支配会社」の定義は、略式事業譲渡の規定の中にある（468条1項）"}, {"aspect": "要件", "text": "784条2項：前条の規定は、吸収分割により吸収分割承継会社に承継させる資産の帳簿価額の合計額が吸収分割株式会社の総資産額として法務省令で定める方法により算定される額の五分の一（これを下回る割合を吸収分割株式会社の定款で定めた場合にあっては、その割合）を超えない場合には、適用しない。「前条」とは株主総会の特別決議を要求する783条である"}]}, {"id": "book-kigyoho-01-art784-2", "article": "784条の2", "chs": [9], "topics": ["組織再編行為の差止請求権"], "points": [{"aspect": "趣旨", "text": "（ア）の趣旨：消滅株式会社等の株主の不利益のおそれがあり、保護の必要があるため。または、消滅株式会社等の株主の不利益のおそれがあり保護の必要があるところ、効力発生後の無効の訴えは認容されにくいので、事前に差止めを認めるべきだからである"}, {"aspect": "趣旨", "text": "（イ）の理由：株主への影響が小さい組織再編行為である場合にまで株主に差止めを認める必要はないからである。（ウ）の趣旨：被支配会社の少数株主の利益保護のため"}, {"aspect": "要件", "text": "差止請求権の根拠条文は、784条の2柱書本文1号、796条の2柱書本文1号、805条の2本文、816条の5本文（目次から探す）"}, {"aspect": "要件", "text": "784条の2（吸収合併等をやめることの請求）：次に掲げる場合において、消滅株式会社等の株主が不利益を受けるおそれがあるときは、消滅株式会社等の株主は、消滅株式会社等に対し、吸収合併等をやめることを請求することができる。ただし、前条第二項に規定する場合は、この限りでない。一 当該吸収合併等が法令又は定款に違反する場合、二 対価等の事項が消滅株式会社等又は存続会社等の財産の状況その他の事情に照らして著しく不当であるとき"}, {"aspect": "要件", "text": "要件（ア）原則：①吸収合併等が法令又は定款に違反すること、②消滅株式会社等の株主が不利益を受けるおそれがあること"}, {"aspect": "要件", "text": "要件（イ）簡易組織再編の場合：差止請求なし（各条ただし書）"}, {"aspect": "要件", "text": "要件（ウ）略式組織再編の場合：①対価が著しく不当であること（784条の2第2号、796条の2第2号）、②消滅株式会社等の株主が不利益を受けるおそれがあること"}]}, {"id": "book-kigyoho-01-art785", "article": "785条", "chs": [9], "topics": ["株式買取請求が認められる4つの場合（根拠条文）", "株式買取請求が認められる株主（反対株主の定義・785条2項）", "株式買取請求が認められない場合（2）略式・簡易組織再編"], "points": [{"aspect": "要件", "text": "反対株主の買取請求が認められるのは4つの場合だけ：①116条の定款変更の場合、②株式併合の決議の場合（182条の4）、③事業譲渡等の決議の場合（469条）、④組織再編行為の決議の場合（785条、797条、806条、816条の6）"}, {"aspect": "要件", "text": "785条1項（反対株主の株式買取請求）：吸収合併等をする場合（次に掲げる場合を除く。）には、反対株主は、消滅株式会社等に対し、自己の有する株式を公正な価格で買い取ることを請求することができる"}, {"aspect": "要件", "text": "原則、2回反対必要（785条2項1号イ）：株主総会に先立って反対する旨を通知し、かつ株主総会において反対した株主が反対株主となる"}, {"aspect": "要件", "text": "785条2項（反対株主の定義）：1号イ＝総会に先立って反対する旨を通知し、かつ総会において反対した株主（議決権を行使することができるものに限る）、1号ロ＝総会において議決権を行使することができない株主、2号＝決議を要しない場合は全ての株主（784条1項本文の場合の特別支配会社を除く）"}, {"aspect": "結論", "text": "略式組織再編等の場合：原則、「全ての株主」に買取請求が認められる（469条2項2号、785条2項2号、797条2項2号、816条の6第2項2号）"}, {"aspect": "結論", "text": "略式組織再編等の例外：「特別支配会社」には認められない（前記各条文の同条項号かっこ書）。趣旨は、特別支配会社に認める合理性はないからである"}, {"aspect": "結論", "text": "簡易組織再編等：買取請求は認められない。趣旨は、簡易組織再編等の場合、会社に与える損害・株主に与える影響は軽微であり、株式買取請求権を与えるまでの必要性がないからである"}]}, {"id": "book-kigyoho-01-art789", "article": "789条", "chs": [9], "topics": ["債権者異議手続の条文と趣旨", "分割会社の債権者保護の規定の位置と各別の催告", "（論点）「承認しなかった債権者」の意義（X1・X2の事例）"], "points": [{"aspect": "趣旨", "text": "債権者異議手続の趣旨：組織再編行為によって当時会社の債権者が重大な影響を受けるおそれがあるので保護の必要があるためである"}, {"aspect": "要件", "text": "789条（債権者の異議）：次の各号に掲げる場合には、当該各号に定める債権者は、消滅株式会社等に対し、吸収合併等について異議を述べることができる（たとえばの条文例）"}, {"aspect": "要件", "text": "債権者異議手続の根拠条文は、789条1項、799条1項、810条1項、816条の8第1項である"}, {"aspect": "要件", "text": "＜前提知識＞（＊1）各別の催告の要否：根拠条文は吸収型の甲社が789条1項、乙社が799条1項、新設型の甲社が810条1項。原則、一定の事項を官報に公告、かつ、知れている債権者には「各別の催告」をしなければならない（上記各条2項）"}, {"aspect": "要件", "text": "各別の催告の例外：官報に公告、さらに、定款に定めた時事日刊新聞紙に公告または電子公告すれば「各別の催告」不要（各3項）。会社の負担への配慮である"}, {"aspect": "要件", "text": "例外の例外：もっとも、会社分割においては、不法行為によって生じた分割会社の債務の債権者に対しては、必ず「各別の催告」が必要（789条3項かっこ書、810条3項かっこ書）。保護の必要性が高いからである"}, {"aspect": "結論", "text": "（妥当な結論）X1は、そもそも債権者異議をいえるものではないから、「承認しなかった債権者」にあたらない。X2は、債権者異議手続で異議をいえるものなのに、そのチャンスを奪っているから、「承認しなかった債権者」にあたるとすべきである（そのためにも4項のみなし承認規定は不適用と考えるべき）"}, {"aspect": "学説", "text": "789条4項（みなし承認）の適用：同条項の趣旨は、適法な債権者異議手続において異議を述べなかった債権者は保護する必要はないというものである。そうだとすると、各別の催告がなされなかった債権者異議手続の場合には、789条4項は適用されないと解する。したがって、X2は承認しなかった債権者にあたる"}]}, {"id": "book-kigyoho-01-art792", "article": "792条", "chs": [9], "topics": ["（参）吸収合併消滅会社等の手続の条文一覧（782条〜792条）"], "points": [{"aspect": "要件", "text": "（参）第1款第1目 株式会社の手続の条文一覧：782条（吸収合併契約等に関する書面等の備置き及び閲覧等）、783条（吸収合併契約等の承認等）、784条（吸収合併契約等の承認を要しない場合）、784条の2（吸収合併等をやめることの請求）、785条（反対株主の株式買取請求）、786条（株式の価格の決定等）、787条（新株予約権買取請求）、788条（新株予約権の価格の決定等）、789条（債権者の異議）、790条（吸収合併等の効力発生日の変更）、791条（吸収分割又は株式交換に関する書面等の備置き及び閲覧等）、792条（剰余金の配当等に関する特則）"}]}, {"id": "book-kigyoho-01-art795", "article": "795条", "chs": [9], "topics": ["（問題1）吸収合併の承認決定手続（対価の種類による違い）"], "points": [{"aspect": "要件", "text": "①乙社株式の場合：甲社は株主総会の特別決議（783条1項、309条2項12号）、乙社も株主総会の特別決議（795条1項、309条2項12号）"}, {"aspect": "要件", "text": "②譲渡制限株式である乙社株式の場合：甲社は株主総会の特殊決議（783条1項、309条3項2号）、乙社は株主総会の特別決議（795条1項、309条2項12号）"}, {"aspect": "要件", "text": "②の場合で、乙社が譲渡制限種類株式発行会社の場合（たとえば、c種類株式が譲渡制限株式の場合）は、乙社株主総会の特別決議に加えてc種類株主総会の特別決議（795条4項、324条2項6号）を要する"}, {"aspect": "要件", "text": "③持分の場合：甲社は総株主の同意（783条2項）、乙社は株主総会の特別決議（795条1項、309条2項12号）"}]}, {"id": "book-kigyoho-01-art796-2", "article": "796条の2", "chs": [9], "topics": ["組織再編行為の差止請求権"], "points": [{"aspect": "要件", "text": "差止請求権の根拠条文は、784条の2柱書本文1号、796条の2柱書本文1号、805条の2本文、816条の5本文（目次から探す）"}, {"aspect": "要件", "text": "要件（ウ）略式組織再編の場合：①対価が著しく不当であること（784条の2第2号、796条の2第2号）、②消滅株式会社等の株主が不利益を受けるおそれがあること"}]}, {"id": "book-kigyoho-01-art799", "article": "799条", "chs": [9], "topics": ["分割会社の債権者保護の規定の位置と各別の催告"], "points": [{"aspect": "要件", "text": "＜前提知識＞（＊1）各別の催告の要否：根拠条文は吸収型の甲社が789条1項、乙社が799条1項、新設型の甲社が810条1項。原則、一定の事項を官報に公告、かつ、知れている債権者には「各別の催告」をしなければならない（上記各条2項）"}, {"aspect": "要件", "text": "各別の催告の例外：官報に公告、さらに、定款に定めた時事日刊新聞紙に公告または電子公告すれば「各別の催告」不要（各3項）。会社の負担への配慮である"}]}, {"id": "book-kigyoho-01-art810", "article": "810条", "chs": [9], "topics": ["分割会社の債権者保護の規定の位置と各別の催告"], "points": [{"aspect": "要件", "text": "＜前提知識＞（＊1）各別の催告の要否：根拠条文は吸収型の甲社が789条1項、乙社が799条1項、新設型の甲社が810条1項。原則、一定の事項を官報に公告、かつ、知れている債権者には「各別の催告」をしなければならない（上記各条2項）"}, {"aspect": "要件", "text": "各別の催告の例外：官報に公告、さらに、定款に定めた時事日刊新聞紙に公告または電子公告すれば「各別の催告」不要（各3項）。会社の負担への配慮である"}, {"aspect": "要件", "text": "例外の例外：もっとも、会社分割においては、不法行為によって生じた分割会社の債務の債権者に対しては、必ず「各別の催告」が必要（789条3項かっこ書、810条3項かっこ書）。保護の必要性が高いからである"}]}, {"id": "book-kigyoho-01-art816-2", "article": "816条の2", "chs": [9], "topics": ["株式交付の条文の所在（774条の2以下と816条の2以下の区別）", "株式交付の手続（第5章第4節）と株式交付無効の訴え"], "points": [{"aspect": "要件", "text": "（4）条文：まずは、774条の2（ナナヨンノニ）。（参照）第一章〜第四章は手続き以外（契約、計画、効果等）を定め、第五章は組織変更、合併、会社分割、株式交換、株式移転及び株式交付の手続（775条〜）で、第四節が株式交付の手続（816条の2〜816条の10）である"}, {"aspect": "要件", "text": "株式交付に関する手続き（株主Aの譲渡の申込→乙株の割当など）は774条の2以下である。なぜ816条の2以下ではないのか→株式交付「計画」に会社が譲り受ける株式の株の下限等を記載するのである"}, {"aspect": "要件", "text": "乙社の株主総会などの手続きは816条の2以下である（株式交付は、いわば部分的な株式交換である）。甲社の手続きは不要である。甲社は株式交付の当事者ではないからである"}, {"aspect": "要件", "text": "第5章第4節 株式交付の手続の条文一覧：816条の2（株式交付計画に関する書面等の備置き及び閲覧等）、816条の3（株式交付計画の承認等）、816条の4（株式交付計画の承認を要しない場合等）、816条の5（株式交付をやめることの請求）、816条の6（反対株主の株式買取請求）、816条の7（株式の価格の決定等）、816条の8（債権者の異議）、816条の9（株式交付の効力発生日の変更）、816条の10（株式交付に関する書面等の備置き及び閲覧等）"}, {"aspect": "要件", "text": "第4章の2 株式交付の条文一覧：774条の2（株式交付計画の作成）、774条の3（株式交付計画）、774条の4（株式交付子会社の株式の譲渡しの申込み）、774条の5（株式交付親会社が譲り受ける株式交付子会社の株式の割当て）、774条の6（譲渡しの申込み及び割当てに関する特則）、774条の7（株式交付子会社の株式の譲渡し）、774条の8（株式交付子会社の株式の譲渡しの無効又は取消しの制限）、774条の9（株式交付子会社の株式の譲渡しに関する規定の準用）、774条の10（申込みがあった株式交付子会社の株式の数が下限の数に満たない場合）、774条の11（株式交付の効力の発生等）"}]}, {"id": "book-kigyoho-01-art828", "article": "828条", "chs": [4, 5, 6, 9], "topics": ["新株発行等の無効の訴え（828条）の要件・効果と答案の流れ", "（論点）210条の差止事由と828条の無効原因の比較", "（論点）公開会社において取締役会の決議を欠いて新株を発行した場合の効力", "（論点）著しく不公正な方法により新株が発行された場合", "資本金の額の減少無効の訴え（828条）", "組織再編行為の無効の訴え（828条：要件と効力）"], "points": [{"aspect": "制度名", "text": "会社設立の無効の訴え"}, {"aspect": "要件", "text": "無効の訴えの要件：①株主等による、株式発行の効力発生日から6ヶ月以内の訴えであること、②無効原因があること"}, {"aspect": "要件", "text": "資本金の額の減少についてだけ特別の制度がある。一定の提訴権者が資本金の額の減少の効力が生じた日から六箇月以内に、無効を訴えをもってのみ主張できる"}, {"aspect": "要件", "text": "提訴権者：当該株式会社の株主等（株主、取締役又は清算人。監査役設置会社にあっては株主、取締役、監査役又は清算人、委員会設置会社にあっては株主、取締役、執行役又は清算人）、破産管財人、資本金の額の減少について承認をしなかった債権者"}, {"aspect": "要件", "text": "828条（会社の組織に関する行為の無効の訴え）：1項7号は吸収合併の無効は効力が生じた日から六箇月以内に訴えをもってのみ主張できること、2項7号は提訴権者（吸収合併をする会社の株主等であった者、吸収合併後存続する会社の株主等・社員等・破産管財人、吸収合併について承認をしなかった債権者）を定める。組織再編行為の無効の訴えは828条1項7号～13号・2項7号～13号"}, {"aspect": "要件", "text": "ア、答案の書き出し（要件）：吸収合併無効の主張が認められるためには、①株主等による（828条2項7号）、②吸収合併の効力が生じた日から六箇月以内の訴えであること（同条1項7号）、③明文の規定を欠くが無効原因が存在することが必要である。法的安定性、取引の安全の見地から、無効原因は重大な瑕疵（重大な法令定款違反）がある場合に限ると解する"}, {"aspect": "要件", "text": "（論点）会社債権者X1・X2は当該吸収分割の無効を主張できるか：吸収分割無効の主張が認められるためには、①承認しなかった債権者による、②吸収分割の効力が生じた日から六箇月以内の訴えであること、③明文の規定を欠くが無効原因が存在することが必要である。「承認しなかった債権者」とは、債権者異議手続において異議を述べることができる債権者の中で組織再編を承認しなかった債権者である。無効原因は重大な瑕疵がある場合に限る"}, {"aspect": "要件", "text": "合併無効の訴えの要件（828条1項7号2項7号）：①吸収合併後存続する会社の株主による吸収合併の効力発生日から6箇月以内の訴えであること、②無効原因が存在すること（重大な法令定款違反、重大な瑕疵）"}, {"aspect": "要件", "text": "認容判決の効力（効果）：対世効（838条）、将来効（839条）"}]}, {"id": "book-kigyoho-01-art830", "article": "830条", "chs": [2], "topics": ["株主総会決議無効確認の訴え（830条2項）", "株主総会決議不存在確認の訴え（830条1項）"], "points": [{"aspect": "制度名", "text": "総会決議不存在確認の訴え"}, {"aspect": "要件", "text": "無効原因（無効事由）は「決議の内容が法令に違反すること」"}, {"aspect": "要件", "text": "不存在原因は「決議が存在しないこと」であり、①実際決議の事実がない場合と、②著しい手続的瑕疵ゆえに決議不存在と法律上評価される場合の2つがある"}, {"aspect": "効果", "text": "無効確認判決の効力：対世効（838条）があり、決議は当初から無効（839条参照）"}, {"aspect": "効果", "text": "不存在確認判決の効力：対世効（838条）があり、決議は当初から不存在（839条参照）"}, {"aspect": "結論", "text": "不存在の訴えの位置づけ：決議の効力の早期確定の要請を犠牲にしてでも効力を争わせることが望ましいほど手続の瑕疵が著しい場合の訴えである"}, {"aspect": "結論", "text": "解釈：「決議が存在しないこと」には決議の事実がないことのみならず、著しい手続的瑕疵があり決議不存在と評価される場合も含まれる"}, {"aspect": "判例", "text": "⑯例2：議決権の21％を有する株主への招集通知を欠いたうえ委任状を偽造してなされた決議→不存在事由を肯定（名古屋高判平成30・4・18）"}, {"aspect": "判例", "text": "⑯例1：発行済株式の約77％を有する株主に対する招集通知漏れは著しい299条1項違反という手続的瑕疵があり、決議不存在が認められる（大阪高判令和3・7・30）"}]}, {"id": "book-kigyoho-01-art831-para1", "article": "831条1項", "chs": [2, 9], "topics": ["株主総会決議取消しの訴え（831条1項）の要件と取消事由", "（論点）提訴期間内に訴えを提起し、提訴期間経過後、裁判の中で新たに取消原因を追加できるか", "裁量棄却（831条2項）", "特別利害関係株主（831条1項3号）と取締役・株主の視点の相違", "（論点）合併比率の著しく不公正と831条1項3号の取消原因（独立した関係にない場合）"], "points": [{"aspect": "趣旨", "text": "831条1項が提訴期間を制限した趣旨は、総会決議の効力を早期に確定させ会社を巡る法律関係を安定させることにある"}, {"aspect": "定義", "text": "「特別利害関係を有する」株主の定義：ある議案について他の株主とは異なる特殊な利益を得たり、他の株主が受ける不利益を免れる者（弘文堂「会社法」）、決議の結果について、他の株主とは異なる共通しない利害を有する者（東京大学出版会「会社法」）、株主としての資格と関係ない個人的な利害関係を有する株主（CPAレギュラーテキスト）"}, {"aspect": "要件", "text": "831条1項本文：株主等は決議の日から3箇月以内に訴えをもって決議の取消しを請求できる"}, {"aspect": "要件", "text": "取消しの訴えの要件は、①株主等による決議の日から3ヶ月以内の訴えであること、②取消事由（831条1項各号）があること"}, {"aspect": "要件", "text": "取消事由1号：招集の手続又は決議の方法が法令若しくは定款に違反し、又は著しく不公正なとき"}, {"aspect": "要件", "text": "取消事由2号：決議の内容が定款に違反するとき"}, {"aspect": "要件", "text": "取消事由3号：特別の利害関係を有する者が議決権を行使したことによって著しく不当な決議がされたとき"}]}, {"id": "book-kigyoho-01-art831-para2", "article": "831条2項", "chs": [2], "topics": ["裁量棄却（831条2項）"], "points": [{"aspect": "趣旨", "text": "裁量棄却の趣旨：招集手続・決議方法の法令定款違反は軽微な瑕疵であり、再度やり直しても同じ結果となると考えられるから"}, {"aspect": "要件", "text": "831条2項：招集手続又は決議方法が法令・定款に違反するときでも、違反する事実が重大でなく、かつ、決議に影響を及ぼさないものと認めるときは、裁判所は取消しの請求を棄却できる"}, {"aspect": "判例", "text": "検討判例①最判昭和46・3・18：有効な取締役会決議に基づかない招集で、招集通知の発送も法定期間より2日遅れた事案。2日遅れは株主に出席と準備の余裕を与える趣旨から「違反する事実は重大」といえ、裁量棄却は否定され決議は取り消される"}]}, {"id": "book-kigyoho-01-art838", "article": "838条", "chs": [2, 4, 5, 6], "topics": ["株主総会決議取消しの訴えの判決の効力（対世効・遡及効）", "設立無効の効力（対世効・将来効）"], "points": [{"aspect": "制度名", "text": "総会決議取消の訴えの認容判決の効力"}, {"aspect": "要件", "text": "a）認容判決の対世効（838条）：会社の組織に関する訴えとは828条から833条の訴えをいい、設立無効の訴え（828条1項1号、同条2項1号）を含む"}, {"aspect": "効果", "text": "対世効（838条）：認容（勝訴）確定判決は対世効により、Bとの関係でも決議取消しとなる"}]}, {"id": "book-kigyoho-01-art839", "article": "839条", "chs": [2, 4, 5, 6], "topics": ["設立無効の効力（対世効・将来効）", "株主総会決議取消しの訴えの判決の効力（対世効・遡及効）"], "points": [{"aspect": "要件", "text": "b）認容判決の将来効（839条）：民法の原則は無効・取消は遡って無効である（遡及効、Aの時点から無効）"}, {"aspect": "効果", "text": "取消しの訴えの認容確定判決は遡及効である（839条参照）。将来効であれば判決までの決議・会社の行為は有効となるが、遡及効では総会決議の時から決議がなかったことになる"}, {"aspect": "結論", "text": "839条の適用があると将来効であるので、B以降、会社設立は無効となり会社の清算手続が開始される（475条2号）。したがってBまでになされた取引は有効のままである。将来効は認容確定判決までに生じた法律関係の安定に資するものである"}]}, {"id": "book-kigyoho-01-art846-2", "article": "846条の2", "chs": [3], "topics": ["特別支配株主の株式等売渡請求（179条～）"], "points": [{"aspect": "要件", "text": "事後に効力を争う方法：特別の訴えの制度あり。売渡株式等取得無効の訴え（846条の2～）。828条ではない点に注意"}]}, {"id": "book-kigyoho-01-art847", "article": "847条", "chs": [2], "topics": ["株主による責任追及等の訴え（株主代表訴訟、847条）", "旧株主による責任追及等の訴え（847条の2）", "最終完全親会社等の株主による特定責任追及の訴え（多重代表訴訟等、847条の3）"], "points": [{"aspect": "制度名", "text": "株主による責任追及等の訴え（株主代表訴訟）"}, {"aspect": "趣旨", "text": "趣旨：役員等がなれ合い、役員等の会社に対する責任追及が不問に付されてしまう危険があるため"}, {"aspect": "趣旨", "text": "趣旨：株主が責任追及の訴えを提起する前に株式交換等がなされ、株主による役員等の責任追及を不可能にすることを防ぐため"}, {"aspect": "趣旨", "text": "趣旨：子会社の役員等の任務懈怠等について、最終完全親会社等による責任追及の懈怠の可能性があり、その場合に最終完全親会社等の株主の利益が害されるのを防ぐため"}, {"aspect": "定義", "text": "「特定責任」とは……総資産額の1/5を超える……（4項）"}, {"aspect": "要件", "text": "要件：①6ヶ月株式を保有する株主による（非公開会社は6ヶ月要件不要、2項）、②責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項）"}, {"aspect": "要件", "text": "会社が第1項の提訴請求の日から60日以内に責任追及等の訴えを提起しないこと（847条3項）が、株主が訴えを提起できる要件となる"}, {"aspect": "要件", "text": "要件：①6ヶ月継続して最終完全親会社等の総議決権の1/100以上株式を有する株主による（非公開会社は6ヶ月要件不要、6項）、②特定責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項）"}, {"aspect": "要件", "text": "第1項の請求の日から60日以内に特定責任追及の訴えを提起しないこと（7項）が、株主が訴えを提起できる要件となる"}]}, {"id": "book-kigyoho-01-art847-2", "article": "847条の2", "chs": [2], "topics": ["旧株主による責任追及等の訴え（847条の2）"], "points": [{"aspect": "制度名", "text": "旧株主による責任追及等の訴え"}, {"aspect": "趣旨", "text": "趣旨：株主が責任追及の訴えを提起する前に株式交換等がなされ、株主による役員等の責任追及を不可能にすることを防ぐため"}, {"aspect": "要件", "text": "847条の2第1項：行為の効力が生じた日の6ヶ月前から当該日まで引き続き株主であった者（旧株主）は、株主でなくなった場合であっても、各号に定めるときは、株式交換等完全子会社に対し、責任追及等の訴え（効力が生じた時までに原因事実が生じた責任・義務に係るものに限る）の提起を請求できる。ただし図利加害目的の場合はこの限りでない"}, {"aspect": "要件", "text": "847条の2第1項ただし書：責任追及等の訴えが旧株主若しくは第三者の不正な利益を図り又は株式交換等完全子会社若しくは完全親会社に損害を加えることを目的とする場合は、提訴請求できない"}, {"aspect": "要件", "text": "847条の2第6項：株式交換等完全子会社が1項の請求の日から60日以内に責任追及等の訴えを提起しないときは、提訴請求をした旧株主は、株式交換等完全子会社のために責任追及等の訴えを提起することができる"}, {"aspect": "比較", "text": "1号（株式交換・株式移転で完全親会社株主になった場合）と2号（三角合併で完全親会社の株主になった場合）の共通点：株主Xは完全親会社株主になる"}]}, {"id": "book-kigyoho-01-art847-3", "article": "847条の3", "chs": [2], "topics": ["最終完全親会社等の株主による特定責任追及の訴え（多重代表訴訟等、847条の3）"], "points": [{"aspect": "制度名", "text": "最終完全親会社等の株主による特定責任追及の訴え"}, {"aspect": "趣旨", "text": "趣旨：子会社の役員等の任務懈怠等について、最終完全親会社等による責任追及の懈怠の可能性があり、その場合に最終完全親会社等の株主の利益が害されるのを防ぐため"}, {"aspect": "定義", "text": "「特定責任」とは……総資産額の1/5を超える……（4項）"}, {"aspect": "要件", "text": "要件：①6ヶ月継続して最終完全親会社等の総議決権の1/100以上株式を有する株主による（非公開会社は6ヶ月要件不要、6項）、②特定責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項）"}, {"aspect": "要件", "text": "第1項の請求の日から60日以内に特定責任追及の訴えを提起しないこと（7項）が、株主が訴えを提起できる要件となる"}]}, {"id": "book-kigyoho-01-art854", "article": "854条", "chs": [2], "topics": ["会計監査人の終任と解任（339条・340条、854条は使えない）"], "points": [{"aspect": "制度名", "text": "取締役（役員）の解任とくれば"}, {"aspect": "要件", "text": "終任事由は任期の満了・辞任・解任・死亡。特に問題になるのは解任"}, {"aspect": "要件", "text": "解任とくれば、①339条（株主総会による解任）、②854条（役員解任の訴え）のはずである"}, {"aspect": "結論", "text": "854条（役員解任の訴え）は使えない。その代わりに340条（監査役等による会計監査人の解任）"}]}, {"id": "book-kigyoho-01-art908", "article": "908条", "chs": [2], "topics": ["登記に関する原則（908条1項）と悪意擬制", "354条と908条の関係（ケース1〜ケース4）", "（論点）表見的取締役も「役員等」に含まれるか"], "points": [{"aspect": "制度名", "text": "「登記」とくれば"}, {"aspect": "定義", "text": "「正当な事由」とは、災害等による登記所閉鎖や交通遮断等の客観的障碍によって登記を閲覧しえない場合をいう"}, {"aspect": "要件", "text": "908条1項：この法律の規定により登記すべき事項は、登記の後でなければ、これをもって善意の第三者に対抗することができない。登記の後であっても、第三者が正当な事由によってその登記があることを知らなかったときは、同様とする"}, {"aspect": "要件", "text": "（参）908条2項：故意又は過失によって不実の事項を登記した者は、その事項が不実であることをもって善意の第三者に対抗することができない"}, {"aspect": "結論", "text": "登記前→会社は、善意の第三者に対抗できない（908条1項前段）。登記後→会社は、善意の第三者にも対抗できる。つまり、第三者は善意でも登記後は悪意とみなされる（悪意擬制）（解釈、908条1項）"}, {"aspect": "結論", "text": "908条2項の類推適用：同項は不実の登記をした者の責任を定め登記申請を行うのは株式会社自身であるから表見的取締役には直接適用はない。しかし同項の趣旨は権利外観理論を基礎として取引の安全を図ることにあり、不実登記の出現に帰責性のある者には類推適用すべきである。そこで、表見的取締役が登記されることに承諾を与えていた場合は、908条2項の類推適用により自己が取締役でないことを善意の第三者に対抗できず、429条1項の責任を免れない（最判昭和47・6・15の立場）"}, {"aspect": "学説", "text": "「悪意擬制」という考えをとらない有力説もある。この立場では、会社が登記をした後は、第三者が「正当な事由」により登記があることを知らなかった場合に限り、会社は第三者に責任を負うことになる（908条1項後段）"}, {"aspect": "学説", "text": "ケース3は、当初からAは代表取締役でなかった点が、ケース1・2と異なる。ケース1においても、908条2項（不実の登記）で処理する少数説も存在する"}, {"aspect": "その他", "text": "ケース1：代表取締役を辞任して平取締役になったAが、辞任登記未了の間に、代表取締役名義で会社の日常業務に属する売買契約を乙会社（売主）と締結した事案。→908条1項前段で処理。辞任登記（911条3項14号、915条）前と考え、甲会社は、善意の第三者（乙会社）に対抗できない"}]}, {"id": "book-kigyoho-01-art911", "article": "911条", "chs": [2], "topics": ["登記に関する原則（908条1項）と悪意擬制", "354条と908条の関係（ケース1〜ケース4）"], "points": [{"aspect": "制度名", "text": "「登記」とくれば"}, {"aspect": "注意", "text": "論文問題で、「登記」と見たら⇒908条、911条3項"}, {"aspect": "注意", "text": "論文問題で「登記」と見たら、908条、911条3項を使う。取締役等の退任なら915条（変更登記）、支配人なら918条（支配人の登記）。登記がらみの問題は、まず908条から考える"}]}, {"id": "book-kigyoho-01-art915", "article": "915条", "chs": [2], "topics": ["354条と908条の関係（ケース1〜ケース4）"], "points": [{"aspect": "注意", "text": "論文問題で「登記」と見たら、908条、911条3項を使う。取締役等の退任なら915条（変更登記）、支配人なら918条（支配人の登記）。登記がらみの問題は、まず908条から考える"}]}, {"id": "book-kigyoho-01-art918", "article": "918条", "chs": [2, 11], "topics": ["支配人の登記（918条）"], "points": [{"aspect": "要件", "text": "918条（支配人の登記）：会社が支配人を選任し、又はその代理権が消滅したときは、その本店の所在地において、その登記をしなければならない"}, {"aspect": "結論", "text": "918条は、「（論点）354条と908条の関係」と同様の論証のときに使う。13条（表見支配人）があっても、支配人が登記済みであれば登記後の第三者は悪意とみなされる（悪意擬制、908条1項・918条）が、それでは第三者は常に保護されず不都合なので、13条は908条1項の例外規定であり、13条が適用され908条1項は適用されない"}]}, {"id": "book-kigyoho-01-art960", "article": "960条", "chs": [4], "topics": ["預合い", "見せ金の場合の責任（民事責任・払込金保管証明責任・刑事罰）"], "points": [{"aspect": "要件", "text": "預合いの刑事罰：965条（預合いの罪）、960条（取締役等の特別背任罪。図利加害目的が要件）"}, {"aspect": "要件", "text": "見せ金の刑事罰：罪刑法定主義より965条に見せ金の規定がない以上、965条は適用も類推適用もできない。図利加害目的等の要件を満たせば960条は適用される"}]}, {"id": "book-kigyoho-01-art965", "article": "965条", "chs": [4], "topics": ["預合い", "見せ金の場合の責任（民事責任・払込金保管証明責任・刑事罰）"], "points": [{"aspect": "制度名", "text": "預合いの刑事罰規定"}, {"aspect": "要件", "text": "預合いの刑事罰：965条（預合いの罪）、960条（取締役等の特別背任罪。図利加害目的が要件）"}, {"aspect": "要件", "text": "見せ金の刑事罰：罪刑法定主義より965条に見せ金の規定がない以上、965条は適用も類推適用もできない。図利加害目的等の要件を満たせば960条は適用される"}]}, {"id": "book-kigyoho-01-art970", "article": "970条", "chs": [2], "topics": ["関与取締役等の支払義務（120条4項）と会社法施行規則21条"], "points": [{"aspect": "制度名", "text": "利益供与の刑事罰"}, {"aspect": "注意", "text": "関連事項の所在：120条5項（免除）、970条（株主等の権利の行使に関する利益供与の罪：3年以下の懲役、300万円以下の罰金）。重要判例として蛇の目ミシン株主代表訴訟事件（最判平18・4・10）とモリテックス事件（東京地判平19・12・6）が後述として挙げられる"}]}, {"id": "book-kigyoho-01-art-minpo107", "article": "民法107条", "chs": [2], "topics": ["（論点）代表取締役の権限濫用"], "points": [{"aspect": "定義", "text": "代表取締役の権限濫用とは、客観的には代表権の範囲内の行為をしているが、主観的には自己または第三者の利益を図るためにする行為をいう"}, {"aspect": "要件", "text": "民法107条（代理権の濫用）：「代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。」"}, {"aspect": "結論", "text": "（注1）〜（注3）より、Aの行為は客観的には代表権の範囲内の行為である。ただ、主観的には自己の利益を図るためにする行為であるから、「代表取締役の権限濫用」の問題となる"}, {"aspect": "結論", "text": "代理も代表も、ある人の行為の効果が他者に帰属するという点では同じであるから、代表取締役の権限濫用の場合も、代理権の濫用規定である民法107条が類推適用されるべきである。したがって、取引の相手方が代表取締役の権限濫用の意図につき悪意（または善意）・有過失の場合は、取引は代表権のない者がした取引となると解する"}, {"aspect": "判例", "text": "平成29年民法改正前の判例である最判昭和38・9・5は、民法93条類推適用によって同様の結論に至っていた（原則有効、例外無効）。民法改正により代理権の濫用の規定（民法107条）が定められたことから、今後は民法107条類推適用で論述することになると考えられる"}]}, {"id": "book-kigyoho-01-art-minpo113", "article": "民法113条", "chs": [4], "topics": ["定款に記載のない財産引受けの効力（会社からの追認の可否）"], "points": [{"aspect": "要件", "text": "民法113条1項：「代理権を有しない者が他人の代理人としてした契約は、本人がその追認をしなければ、本人に対してその効力を生じない。」"}]}, {"id": "book-kigyoho-01-art-minpo644", "article": "民法644条", "chs": [2], "topics": ["会計参与の善管注意義務（330条・民法644条）", "会計監査人の善管注意義務（330条・民法644条）", "善管注意義務（330条・402条3項・民法644条）"], "points": [{"aspect": "制度名", "text": "取締役・執行役の善管注意義務"}, {"aspect": "要件", "text": "会社と会計参与の関係は委任に関する規定に従う（330条）。したがって、会計参与は会社に対して善管注意義務（330条、民法644条）を負う"}, {"aspect": "要件", "text": "会社と会計監査人の関係は委任に関する規定に従う（330条）。したがって、会計監査人は会社に対して善管注意義務（330条、民法644条）を負う"}, {"aspect": "要件", "text": "民法644条[受任者の注意義務：善管注意義務]：受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う"}]}], "compares": [{"id": "book-kigyoho-01-ch02-cmp001", "ch": 2, "topic": "全員出席総会（招集手続を欠く総会の効力）", "q": "株主総会の招集手続を欠く場合の効力について、会社法300条の「株主総会の招集手続の省略」と「全員出席総会」とは、省略できる範囲においてどのように異なるか。", "a": "【300条（招集手続の省略）】省略できるのは299条の手続（法定の招集期間の短縮、法定の招集通知の省略）のみであり、招集の決定（298条）は省略できない。また、欠席した株主がいても決議が有効となる規定であり、同意は事前のものでなければならないと考えられている。\n【全員出席総会】招集権者による招集手続を欠いたとしても、株主全員が開催に同意し出席した場合は、総会決議は有効となる。招集手続を必要とした趣旨は株主に総会への出席の機会と準備の余裕を与えることにあるため、この場合、株主が自らその利益を放棄したといえるからである。", "basis": "PDF p.22（本編 p.19）、PDF p.24（本編 p.21）。台帳要素 book-kigyoho-01-ch02-t109-e03、book-kigyoho-01-ch02-t109-e02、book-kigyoho-01-ch02-t109-e05 の逐語引用に基づく。", "page": 22, "printed": 19}, {"id": "book-kigyoho-01-ch02-cmp002", "ch": 2, "topic": "特別利害関係取締役（369条2項）の意義・効果と具体例", "q": "特別の利害関係を有する者の議決への関与について、取締役会（369条2項）と株主総会（831条1項3号）とでは、規律の仕方がどのように異なるか。", "a": "【取締役会】前項の決議について特別の利害関係を有する取締役は、議決に加わることができない（369条2項）。特別利害関係を有する取締役は公正な議決権行使が期待できないためであり、「議決に加わることができない」とは、定足数に入れず、審議に加わることもできないと解する。\n【株主総会】特別の利害関係を有する株主の議決権行使自体は禁止されず、その者が議決権を行使したことによって、著しく不当な決議がされたときが、決議取消事由となる（831条1項3号）。\n【相違の理由】株主は会社の実質的所有者であるのに対し、取締役は受任者（会社と委任関係）である点にある。", "basis": "PDF p.58（本編 p.55）。台帳要素 book-kigyoho-01-ch02-t214-e01、book-kigyoho-01-ch02-t214-e02、book-kigyoho-01-ch02-t214-e03、book-kigyoho-01-ch02-t214-e04 の逐語引用に基づく。", "page": 58, "printed": 55}, {"id": "book-kigyoho-01-ch02-cmp003", "ch": 2, "topic": "機関構造の比較（取締役会非設置会社・取締役会設置会社・指名委員会等設置会社）", "q": "取締役会非設置会社・取締役会設置会社・指名委員会等設置会社について、業務執行の意思決定、業務執行、会社の代表を担う者を比較せよ。", "a": "【取締役会非設置会社】意思決定＝取締役・取締役の過半数（348条1項2項）、業務執行＝各取締役（348条1項）、代表＝各取締役（349条1項2項）。\n【取締役会設置会社】意思決定＝取締役会（362条2項1号）、業務執行＝代表取締役（363条1項1号）、代表＝代表取締役（349条1項ただし書き、4項）。\n【指名委員会等設置会社】意思決定＝取締役会（416条1項1号）＊執行役に大幅な委任が可能（同条項4項）、業務執行＝執行役（418条2号）、代表＝代表執行役（420条3項、349条4項）。", "basis": "PDF p.87（本編 p.84）。台帳要素 book-kigyoho-01-ch02-t314-e01 の逐語引用に基づく。", "page": 87, "printed": 84}, {"id": "book-kigyoho-01-ch02-cmp004", "ch": 2, "topic": "株主による執行役の行為の差止め（422条）", "q": "執行役の行為の差止めについて、株主による差止め（422条）と監査委員による差止め（407条）とでは、会社に生じる損害の要件がどのように異なるか。", "a": "【株主による差止め（422条）】6ヶ月前から株式を継続保有する株主（非公開会社であれば「株主であること」、422条2項）が、執行役の行為が法令・定款に反するおそれがあり、当該行為によって会社に「回復することができない損害」が生じるおそれがある場合に請求できる。\n【監査委員による差止め（407条）】損害の要件は「会社に著しい損害」であり、422条の「回復することができない損害」とは異なる点に注意を要する。\nなお、株主による取締役の違法行為差止め（360条）は422条と同様の規定である。", "basis": "PDF p.89（本編 p.86）。台帳要素 book-kigyoho-01-ch02-t322-e01、book-kigyoho-01-ch02-t322-e02、book-kigyoho-01-ch02-t322-e03 の逐語引用に基づく。", "page": 89, "printed": 86}, {"id": "book-kigyoho-01-ch02-cmp005", "ch": 2, "topic": "（論点）356条1項1号の「自己又は第三者のために」とは（計算説）", "q": "会社法356条1項の「自己又は第三者のために」の解釈は、1号（競業取引）と2号（直接利益相反取引）とでどのように異なるか。", "a": "【1号（競業取引）】自己又は第三者名義を意味するのではなく、自己又は第三者の「計算において」を意味する（計算説）。競業取引規制の趣旨は会社の利益保護であり、誰に経済的利益が帰属するかを問題にすべきだからである。\n【2号（直接利益相反取引）】自己の名義において、又は、第三者の名義において（第三者の代表者又は代理人として）を意味する（名義説）。間接取引（同条項3号）も規定され広く規制されているので、あえて計算の意味に考える必要はないからである。", "basis": "PDF p.95（本編 p.92）、PDF p.100（本編 p.97）。台帳要素 book-kigyoho-01-ch02-t334-e01、book-kigyoho-01-ch02-t343-e01 の逐語引用に基づく。", "page": 95, "printed": 92}, {"id": "book-kigyoho-01-ch02-cmp006", "ch": 2, "topic": "任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照", "q": "取締役の会社に対する責任（423条）における推定規定は、競業取引と利益相反取引とでどのように異なるか。", "a": "【競業取引】423条1項＋2項により、損害額が推定される（③損害額を推定）。\n【利益相反取引】（423条1項＋）3項により、任務懈怠が推定される（②任務懈怠を推定）。\nなお、428条は無過失責任の規定である。", "basis": "PDF p.123（本編 p.120）。台帳要素 book-kigyoho-01-ch02-t404-e06 の逐語引用に基づく。", "page": 123, "printed": 120}, {"id": "book-kigyoho-01-ch02-cmp007", "ch": 2, "topic": "株主総会決議取消しの訴え（831条1項）の要件と取消事由", "q": "株主総会決議の瑕疵を争う訴えについて、決議取消しの訴え（831条）・決議無効確認の訴え（830条2項）・決議不存在確認の訴え（830条1項）は、対象となる瑕疵の内容においてどのように異なるか。", "a": "【決議取消しの訴え（831条1項）】株主等が決議の日から3ヶ月以内に訴えをもって請求するもので、対象は、①招集の手続又は決議の方法が法令若しくは定款に違反し、又は著しく不公正なとき、②決議の内容が定款に違反するとき、③特別の利害関係を有する者が議決権を行使したことによって、著しく不当な決議がされたとき。招集手続・決議方法の違反は取消原因であり、軽微な瑕疵を扱う。\n【決議無効確認の訴え（830条2項）】対象は「決議の内容が法令に違反すること」であり、重大な瑕疵を扱う。\n【決議不存在確認の訴え（830条1項）】対象は「決議が存在しないこと」であり、実際決議の事実がない場合と、著しい手続的瑕疵ゆえに決議不存在と法律上評価される場合の2つがある。", "basis": "PDF p.15（本編 p.12）、PDF p.19（本編 p.16）、PDF p.20（本編 p.17）。台帳要素 book-kigyoho-01-ch02-t101-e02、book-kigyoho-01-ch02-t101-e03、book-kigyoho-01-ch02-t101-e04、book-kigyoho-01-ch02-t101-e05、book-kigyoho-01-ch02-t101-e07、book-kigyoho-01-ch02-t107-e01、book-kigyoho-01-ch02-t108-e01 の逐語引用に基づく。", "page": 15, "printed": 12}, {"id": "book-kigyoho-01-ch02-cmp008", "ch": 2, "topic": "会計監査人の報酬等の決定（399条）", "q": "報酬等の決定方法について、取締役・監査役・会計参与と会計監査人とではどのように異なるか。", "a": "【取締役・監査役・会計参与】本来、報酬等の決定は業務執行の意思決定に含まれるので取締役・取締役会の決定でなされるものであるが、お手盛りの危険があったり独立性確保ができないといった理由で、定款または株主総会の普通決議で定めることになっている。\n【会計監査人】会計監査人は役員ではない（329条1項参照）から、本来通り取締役・取締役会の決定で報酬等を決定する。ただし、会計監査人の独立性確保の要請から、取締役は、会計監査人の報酬等を定める場合には、監査役（監査役が二人以上ある場合にあっては、その過半数）の同意を得なければならない（399条1項）。", "basis": "PDF p.86（本編 p.83）。台帳要素 book-kigyoho-01-ch02-t312-e01、book-kigyoho-01-ch02-t312-e02、book-kigyoho-01-ch02-t312-e03 の逐語引用に基づく。", "page": 86, "printed": 83}, {"id": "book-kigyoho-01-ch02-cmp009", "ch": 2, "topic": "（論点）退任取締役も「役員等」に含まれるか", "q": "取締役でない者が取締役として責任を負う場面について、表見的取締役と退任取締役とでは、908条2項の類推適用に必要とされる本人の承諾においてどのように異なるか。", "a": "【表見的取締役】登記について本人の「承諾」（明示的・黙示的承諾）があればよく、908条2項の類推適用により、「役員等」でないと主張できなくなる。\n【退任取締役】「明示的な承諾」が必要であり、退任取締役が不実の取締役登記を残存させることに明示的な承諾を与えていた場合は、908条2項の類推適用により自己が取締役でないことを善意の第三者に対抗できず、429条1項の責任を免れない（最判昭和62・4・16の立場）。なお、原則として退任取締役は「役員等」ではなく、429条1項の責任を負わない。", "basis": "PDF p.147（本編 p.144）。台帳要素 book-kigyoho-01-ch02-t421-e02、book-kigyoho-01-ch02-t421-e01 の逐語引用に基づく。", "page": 147, "printed": 144}, {"id": "book-kigyoho-01-ch03-cmp001", "ch": 3, "topic": "取得請求権付株式・取得条項付株式・全部取得条項付種類株式の取得と財源規制", "q": "取得請求権付株式・取得条項付株式・全部取得条項付種類株式について、会社が当該株式を取得する仕組みはどのように異なるか。", "a": "【取得請求権付株式】株主が会社に株式の取得を請求するもの。\n【取得条項付株式】一定の事由の発生を条件に会社が取得するもの。\n【全部取得条項付種類株式】株主総会の特別決議で会社が取得するもの。\nすべて会社から見れば自己株式の取得であり、財源規制は順に166条1項ただし書き、170条5項、461条1項4号による。", "basis": "PDF p.180（本編 p.177）。台帳要素 book-kigyoho-01-ch03-t050-e01 の逐語引用に基づく。", "page": 180, "printed": 177}, {"id": "book-kigyoho-01-ch03-cmp002", "ch": 3, "topic": "名義書換失念の場合と会社の承諾なく譲渡制限株式を譲渡した場合の比較", "q": "会社が自己の危険において株式の譲受人を株主として取り扱うことができるかについて、名義書換失念の場合と、会社の承認なく譲渡制限株式を譲渡した場合とではどのように異なるか。", "a": "【名義書換失念の場合】会社が自己の危険において名義書換未了の株式譲受人を株主と認めて権利行使させることはできる。株主名簿の名義書換の趣旨は会社の事務処理の便宜を図るためにすぎず、条文の文言も「会社に対抗」であるからである。\n【会社の承認なく譲渡制限株式を譲渡した場合】譲渡当事者間では有効であるが、会社に対する関係では株式譲渡は無効であり、会社は譲渡人を株主として取り扱う義務を負う。甲会社は自己の危険においても譲受人を株主として取り扱うことはできない（最判平成9・9・9）。承認機関の承認（139条1項）を「要する」（107条1項1号、108条1項4号）とされており、会社にとって好ましいかどうかを代表取締役による承認で判断させるべきでないから、名義書換失念の場合と矛盾するわけではない。", "basis": "PDF p.194（本編 p.190）。台帳要素 book-kigyoho-01-ch03-t108-e01、book-kigyoho-01-ch03-t108-e02、book-kigyoho-01-ch03-t108-e03、book-kigyoho-01-ch03-t108-e04 の逐語引用に基づく。", "page": 194, "printed": 190}, {"id": "book-kigyoho-01-ch03-cmp003", "ch": 3, "topic": "相続人等への売渡請求（174条〜177条）", "q": "譲渡制限株式について、譲渡（特定承継）による取得と、相続その他の一般承継による取得とでは、会社の承認の要否においてどのように異なるか。", "a": "【譲渡（特定承継）】株式譲渡については、定款で譲渡制限を定めればよい（107条1項1号、108条1項4号）ので、譲渡には会社の承認を要する仕組みにできる。\n【相続その他の一般承継】譲渡（特定承継）とは異なり、一般承継の場合は会社の承認は必要ない（134条4号参照）。そのため、株式会社は、相続その他の一般承継により譲渡制限株式を取得した者に対し、当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる（174条）。", "basis": "PDF p.181（本編 p.178）。台帳要素 book-kigyoho-01-ch03-t051-e02、book-kigyoho-01-ch03-t051-e03 の逐語引用に基づく。", "page": 181, "printed": 178}, {"id": "book-kigyoho-01-ch04-cmp001", "ch": 4, "topic": "出資の履行の仮装（払込みの仮装・給付の仮装）", "q": "会社設立時の出資について、出資額100万円につき「払込がなされなかった場合」と「払込がなされたが仮装であった場合」とでは、発起人・引受人の地位はどのように異なるか。", "a": "【払込がなされなかった場合（0円）】株主となる権利の喪失（失権）。36条3項（発起人の場合）、63条3項（引受人は当然失権）。\n【払込がなされたが仮装の場合（実際0円）】支払義務が生じ、株主の権利行使が可能である（52条の2、102条、102条の2、103条）。これらの規定は36条3項、63条3項の例外規定となり、出資の履行の仮装の場合は失権しない。", "basis": "PDF p.230（本編 p.227）。台帳要素 book-kigyoho-01-ch04-t029-e14 の逐語引用に基づく。", "page": 230, "printed": 227}, {"id": "book-kigyoho-01-ch04-cmp002", "ch": 4, "topic": "事後設立（467条1項5号）", "q": "事後設立（467条1項5号）は、現物出資・財産引受けに対する規制とどのように異なるか。", "a": "【事後設立】会社成立後直後の売買契約（成立後2年以内における、成立前から存在する財産で事業のために継続して使用するものの取得）であり、現物出資・財産引受けとは異なり変態設立事項ではなく、異なる規制を受ける。すなわち、効力発生日の前日までに株主総会の特別決議（309条2項11号）によって契約の承認を受けなければならない（467条1項5号）。本来、成立後の会社が高値で土地等を買うことも自由であるので、規制される事後設立というものは制限的に解される。\n【規制の趣旨】財産引受け規制の潜脱手段として利用されるおそれがあるからである。", "basis": "PDF p.215（本編 p.212）。台帳要素 book-kigyoho-01-ch04-t006-e04、book-kigyoho-01-ch04-t006-e05、book-kigyoho-01-ch04-t006-e06、book-kigyoho-01-ch04-t006-e02 の逐語引用に基づく。", "page": 215, "printed": 212}, {"id": "book-kigyoho-01-ch05-cmp001", "ch": 5, "topic": "（参考）払込がなされなかった場合と仮装の場合の比較", "q": "募集株式の発行時の出資について、出資額100万円につき「払込がなされなかった場合」と「払込がなされたが仮装であった場合」とでは、引受人の地位はどのように異なるか。", "a": "【払込がなされなかった場合（0円）】株主となる権利の喪失（208条5項、当然失権）。\n【払込がなされたが仮装の場合（実際0円）】支払義務が生じ、株主の権利行使が可能である（213条の2第1項、213条の3、209条2項3項）。これらの規定は208条5項の例外規定となり、仮装の場合は失権しない。", "basis": "PDF p.246（本編 p.243）。台帳要素 book-kigyoho-01-ch05-t016-e01 の逐語引用に基づく。", "page": 246, "printed": 243}, {"id": "book-kigyoho-01-ch05-cmp002", "ch": 5, "topic": "（論点）210条の差止事由と828条の無効原因の比較", "q": "募集株式の発行等の瑕疵への対処について、発行前の差止め（210条）と発行後の無効の訴え（828条）とでは、認められる瑕疵の範囲がどのように異なるか。その理由も述べよ。", "a": "【発行前の差止め（210条）】募集株式の発行等がなされる前は、新たな株主が現れていないので取引の安全を考慮する必要はない。したがって、差止事由は広く認めてもよい。\n【発行後の無効の訴え（828条）】募集株式の発行等がなされた後は、新たな株主が生まれ株式が流通することがあり得るので取引の安全を考慮する必要がある。そこで、新株発行の無効原因は重大な瑕疵（法令・定款違反）に限ると解する。", "basis": "PDF p.248（本編 p.245）。台帳要素 book-kigyoho-01-ch05-t019-e01、book-kigyoho-01-ch05-t019-e02 の逐語引用に基づく。", "page": 248, "printed": 245}, {"id": "book-kigyoho-01-ch05-cmp003", "ch": 5, "topic": "（論点）金銭以外の財産の出資（207条・現物出資）", "q": "現物出資の規制について、会社設立時の現物出資と、募集株式の発行時の現物出資（207条）とではどのような相違があるか。", "a": "【設立時の現物出資】定款の記載を要し、現物出資を行えるのは発起人に限られる。\n【募集時の現物出資】設立時の現物出資との相違は、①定款の記載が不要、②発起人に限らない、の2点である。\nなお、現物出資が規制される趣旨は設立時と同様であり、目的財産の過大な評価による不当な株式付与により、会社の財産的基礎を害するとともに金銭出資者を害するおそれがあるためである。", "basis": "PDF p.243（本編 p.240）。台帳要素 book-kigyoho-01-ch05-t011-e01、book-kigyoho-01-ch05-t011-e02 の逐語引用に基づく。", "page": 243, "printed": 240}, {"id": "book-kigyoho-01-ch06-cmp001", "ch": 6, "topic": "資本金の額の減少（決定機関・債権者異議・趣旨・欠損の定義）", "q": "資本金の額の減少（447条）と準備金の額の減少（448条）について、原則的な決定機関はどのように異なるか。その理由も述べよ。", "a": "【資本金の額の減少】原則：株主総会の特別決議（447条1項、309条2項9号）。資本金の額の減少は、会社の一部清算の性格を有し、株主の利益に重大な影響を与えるからである。\n【準備金の額の減少】原則：株主総会の普通決議（448条1項、309条1項）。資本金の額の減少の場合の手続要件より緩和することによって、まず準備金の額の減少を先に行うことを促し、資本金のクッションの役割を果たさせるためである（答案用としては、株主の利益に影響するが、資本金の額の減少の場合ほど株主に与える影響は大きくないからである）。", "basis": "PDF p.273（本編 p.270）、PDF p.274（本編 p.271）。台帳要素 book-kigyoho-01-ch06-t002-e02、book-kigyoho-01-ch06-t002-e06、book-kigyoho-01-ch06-t003-e01、book-kigyoho-01-ch06-t003-e06 の逐語引用に基づく。", "page": 273, "printed": 270}, {"id": "book-kigyoho-01-ch07-cmp001", "ch": 7, "topic": "持分会社の基本構造（社員の個性重視・所有と経営の一致）", "q": "株式会社と持分会社とでは、社員（株主）の個性の重視と、所有と経営の関係においてどのように異なるか。", "a": "【持分会社】社員の個性が重視される（580条1項の無限責任、590条1項・599条1項の業務執行権・代表権）。所有と経営が一致する（590条1項、599条1項）。\n【株式会社】株主の個性は（それほど）重視されない。株主の間接有限責任（104条）、所有と経営の分離（326条1項）。", "basis": "PDF p.284（本編 p.281）。台帳要素 book-kigyoho-01-ch07-t002-e03、book-kigyoho-01-ch07-t002-e04、book-kigyoho-01-ch07-t002-e05 の逐語引用に基づく。", "page": 284, "printed": 281}, {"id": "book-kigyoho-01-ch07-cmp002", "ch": 7, "topic": "出資の払戻し", "q": "持分会社における「出資の払戻し」（624条）と「退社に伴う持分の払戻し」（611条）は、社員の地位の点でどのように異なるか。", "a": "【出資の払戻し】社員たる地位が残る点で、「退社に伴う持分の払戻し」とは異なる。\n【退社に伴う持分の払戻し】退社に伴い社員たる地位を失う場合の払戻しである。\nなお、いずれも原則として制限なしである（出資の払戻しは624条、退社に伴う持分の払戻しは611条）。会社債権者を害さないからである。", "basis": "PDF p.290（本編 p.287）、PDF p.291（本編 p.288）。台帳要素 book-kigyoho-01-ch07-t017-e06、book-kigyoho-01-ch07-t017-e01、book-kigyoho-01-ch07-t018-e01 の逐語引用に基づく。", "page": 290, "printed": 287}, {"id": "book-kigyoho-01-ch08-cmp001", "ch": 8, "topic": "事業譲渡の位置づけ（組織再編行為ではなく取引行為）", "q": "事業譲渡と合併等の組織再編行為とは、法的位置づけにおいてどのように異なるか。", "a": "【事業譲渡】事業譲渡は467条〜に規定され、組織再編行為ではなく、取引行為に過ぎない。\n【合併等の組織再編行為】合併などの組織再編は743条〜に規定される組織再編行為である。\n両者は類似するので、比較して試験に出される。", "basis": "PDF p.293（本編 p.290）。台帳要素 book-kigyoho-01-ch08-t002-e01 の逐語引用に基づく。", "page": 293, "printed": 290}, {"id": "book-kigyoho-01-ch09-cmp001", "ch": 9, "topic": "吸収合併と事業の全部譲渡の比較", "q": "吸収合併と事業の全部譲渡とでは、譲渡側の株主への対価と、譲渡会社の存続においてどのように異なるか。", "a": "【吸収合併】甲社から乙社への移転が生じ、株主Aへの対価は乙社の株式である。甲社は消滅する。\n【事業の全部譲渡】甲社から乙社への移転が生じるが、対価は金銭である。事業譲渡は合併と異なり甲社は消滅しないので、たとえ事業の全部を譲渡したとしても甲社は消滅しない。甲社としては、対価として得た金銭などを元に新たな事業をする（定款変更して「目的」も変更）か、あらためて解散決議をするかであろう。", "basis": "PDF p.342（本編 p.339）。台帳要素 book-kigyoho-01-ch09-t039-e01、book-kigyoho-01-ch09-t039-e02 の逐語引用に基づく。", "page": 342, "printed": 339}, {"id": "book-kigyoho-01-ch09-cmp002", "ch": 9, "topic": "吸収分割と事業の重要な一部の譲渡の比較", "q": "吸収分割と事業の重要な一部の譲渡とでは、事業の移転の対価はどのように異なるか。", "a": "【吸収分割】甲社から乙社への移転が生じ、対価は乙社の株式（甲社に交付）である。\n【事業の重要な一部の譲渡】甲社から乙社への移転が生じるが、対価は金銭である。", "basis": "PDF p.342（本編 p.339）。台帳要素 book-kigyoho-01-ch09-t040-e01 の逐語引用に基づく。", "page": 342, "printed": 339}, {"id": "book-kigyoho-01-ch09-cmp003", "ch": 9, "topic": "略式と簡易の比較表", "q": "組織再編における略式手続と簡易手続とでは、反対株主の株式買取請求と差止め請求の有無はどのように異なるか。", "a": "【略式手続】①総会決議は不要。②反対株主の株式買取請求は、原則あり（例外：特別支配会社）。③債権者異議手続きはあり。④差止め請求はあり。⑤無効の訴えはあり。総会を開いても無駄であるが、株主に不利益はある場合である。\n【簡易手続】①総会決議は不要。②反対株主の株式買取請求はなし。③債権者異議手続きはあり。④差止め請求はなし。⑤無効の訴えはあり。株主の不利益は軽微な場合である。", "basis": "PDF p.343（本編 p.340）。台帳要素 book-kigyoho-01-ch09-t041-e01、book-kigyoho-01-ch09-t041-e02、book-kigyoho-01-ch09-t041-e03 の逐語引用に基づく。", "page": 343, "printed": 340}, {"id": "book-kigyoho-01-ch09-cmp004", "ch": 9, "topic": "反対「株主」「債権者」の戦い方", "q": "組織再編に反対する株主と債権者とでは、取りうる手段はどのように異なるか。", "a": "【反対する「株主」の戦い方】1 総会で反対（原則3分の1の反対あれば勝てる）、2 株式買取請求（せめて経済的救済を）、3 差止め（合併等をやめさせる）、4 無効の訴え（合併等を無効とする）。\n【反対する「債権者」の戦い方】1 総会には参加できない、2 債権者異議手続き（異議をいえば、一応債権の満足あり）、3 差止めは株主でないから不可能、4 無効の訴えは「承認しなかった債権者」なら可能。", "basis": "PDF p.341（本編 p.338）。台帳要素 book-kigyoho-01-ch09-t037-e01、book-kigyoho-01-ch09-t037-e02 の逐語引用に基づく。", "page": 341, "printed": 338}, {"id": "book-kigyoho-01-ch09-cmp005", "ch": 9, "topic": "（問題1）吸収合併の承認決定手続（対価の種類による違い）", "q": "吸収合併（甲社を消滅会社、乙社を存続会社とする）において、合併対価が、①乙社株式の場合、②譲渡制限株式である乙社株式の場合、③持分の場合とで、甲社の承認決定手続はどのように異なるか。", "a": "【①乙社株式の場合】甲社は株主総会の特別決議（783条1項、309条2項12号）。乙社も株主総会の特別決議（795条1項、309条2項12号）。\n【②譲渡制限株式である乙社株式の場合】甲社は株主総会の特殊決議（783条1項、309条3項2号）。乙社は株主総会の特別決議（795条1項、309条2項12号）。\n【③持分の場合】甲社は総株主の同意（783条2項）。乙社は株主総会の特別決議（795条1項、309条2項12号）。\n発想としては、株主に不利益のおそれ⇒株主総会の特別決議、株主にもっと不利益のおそれ⇒株主総会の特殊決議、株主にもっともっと不利益のおそれ⇒総株主の同意、と決議が重くなる。", "basis": "PDF p.316（本編 p.313）。台帳要素 book-kigyoho-01-ch09-t013-e04、book-kigyoho-01-ch09-t013-e05、book-kigyoho-01-ch09-t013-e07、book-kigyoho-01-ch09-t013-e03 の逐語引用に基づく。", "page": 316, "printed": 313}, {"id": "book-kigyoho-01-ch10-cmp001", "ch": 10, "topic": "定款変更の原則（株主総会の特別決議）", "q": "定款変更に必要な決議について、通常の場合と、ある種類の株主に損害を及ぼすおそれがある場合とではどのように異なるか。", "a": "【通常の場合】定款変更には、原則として株主総会の特別決議が必要である（466条、309条2項11号）。\n【ある種類の株主に損害を及ぼすおそれがある場合】定款変更によって、ある種類株式の種類株主に損害を及ぼすおそれがある場合は、原則、さらに当該種類株主総会の特別決議も必要である（322条1項各号、324条2項4号）。", "basis": "PDF p.348（本編 p.345）。台帳要素 book-kigyoho-01-ch10-t001-e01、book-kigyoho-01-ch10-t002-e01 の逐語引用に基づく。", "page": 348, "printed": 345}, {"id": "book-kigyoho-01-ch11-cmp001", "ch": 11, "topic": "支配人の競業の禁止（12条）", "q": "支配人の競業の禁止（12条1項）と取締役の競業避止義務（356条1項1号）とでは、禁止される行為の範囲はどのように異なるか。その理由も述べよ。", "a": "【支配人（12条1項）】会社の許可を受けなければ、①自ら営業を行うこと、②自己又は第三者のために会社の事業の部類に属する取引をすること、③他の会社又は商人（会社を除く）の使用人となること、④他の会社の取締役、執行役又は業務を執行する社員となること、をしてはならない。\n【取締役（356条1項1号）】競業避止義務の対象は、「自己又は第三者のために会社の事業の部類に属する取引をすること」のみである。\n【相違の理由】支配人は、会社と委任関係である取締役と異なり雇用関係であるので、営業主のために専心勤務すべきであるからである。", "basis": "PDF p.356（本編 p.353）。台帳要素 book-kigyoho-01-ch11-t008-e01、book-kigyoho-01-ch11-t008-e02、book-kigyoho-01-ch11-t008-e03 の逐語引用に基づく。", "page": 356, "printed": 353}, {"id": "book-kigyoho-01-ch11-cmp002", "ch": 11, "topic": "支配人の代理権（11条）", "q": "支配人の代理権（11条）は、代表取締役等の代表権とどこが共通し、どこが異なるか。", "a": "【共通点】支配人の代理権は、株式会社の代表取締役・代表執行役、持分会社の社員の代表権と同じく包括性・不可制限性を表す規定である（349条4項5項、420条3項、599条4項5項）。支配人は、会社に代わってその事業に関する一切の裁判上又は裁判外の行為をする権限を有し（11条1項）、支配人の代理権に加えた制限は、善意の第三者に対抗することができない（11条3項）。\n【相違点】もっとも、支配人の代理権は、本店・支店によって個別化される。", "basis": "PDF p.355（本編 p.352）。台帳要素 book-kigyoho-01-ch11-t007-e01、book-kigyoho-01-ch11-t007-e02 の逐語引用に基づく。", "page": 355, "printed": 352}], "cases": [{"id": "book-kigyoho-01-ch02-case002", "ch": 2, "topic": "全員出席総会（招集手続を欠く総会の効力）", "caseText": "甲会社は、公開会社ではない取締役会設置会社である。甲会社の創業者であるAは高齢のため取締役を辞任したものの、依然として会社経営に口出しをして代表取締役Bとの対立が深まった。そこで、AはBを取締役から解任させたいと考え、自らを除く全株主6名に対して電子メールにて、Bを取締役から解任することを議題議案とする株主総会を臨時で開催するので集まってほしいと独断で連絡した。Xを除く5名の株主からは異議なく参加可能との連絡があったが、Xは都合が悪いため、委任状を作成してYを代理人として当該株主総会に出席させることとした。そして、本件株主総会にXを除く6名の株主及びXの代理人であるYの計7名が出席し、Bを取締役から解任する旨の決議は全員一致で可決された。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：招集手続を欠く株主総会決議の効力（全員出席総会）。株主総会は取締役会の招集決定により代表取締役が招集するのが原則であり（296条3項・298条4項）、取締役を辞任したAが招集した本件総会の決議は不存在であるのが原則である（830条1項参照）。もっとも、招集手続の趣旨は株主に総会への出席の機会と準備の余裕を与えることにあるため、株主全員が開催に同意し出席した場合は株主が自らその利益を放棄したといえ、決議は有効となるのではないか。また、Xのように議題を了知して代理人を出席させた場合に瑕疵が治癒されるかも問題となる。なお、招集手続の省略（300条）とは別の論点である。", "basis": "PDF p.22（本編 p.19）。台帳要素 book-kigyoho-01-ch02-t109-e01、e04、e05、e06 の逐語引用・要約に基づく。", "page": 22, "printed": 19}, {"id": "book-kigyoho-01-ch02-case003", "ch": 2, "topic": "（論点）取締役会設置会社である非公開会社における、株主総会決議により代表取締役を選定する旨の定款の効力", "caseText": "甲会社は取締役会設置会社であり、公開会社でない会社である。甲会社の定款には、「代表取締役は、取締役会決議によって定めるものとするが、必要に応じ株主総会決議によって定めることができる。」旨の定めがある。甲会社の株主総会決議によって代表取締役に選ばれたAが、甲会社を代表して、乙会社から20万円相当の日用品を購入した。そこで、乙会社は、甲会社に対して、20万円の代金の支払請求をした。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役会設置会社である非公開会社における、株主総会決議により代表取締役を選定する旨の定款の効力。乙会社の請求が認められるかは、Aが代表取締役といえるか、すなわち上記定款規定が有効かによる。取締役会設置会社において株主総会は法律及び定款で定めた事項に限り決議できるが（295条2項）、定款により株主総会の権限とすることができる範囲を制限する明文規定は設けられておらず、株主総会決議による選定を認めても取締役会の選定・解職権限（362条2項3号）は否定されず、取締役会の監督権限の実効性を失わせるとはいえないかが問題となる（最決平成29年2月21日）。", "basis": "PDF p.28（本編 p.25）。台帳要素 book-kigyoho-01-ch02-t112-e01、e02、e03 の逐語引用・要約に基づく。", "page": 28, "printed": 25}, {"id": "book-kigyoho-01-ch02-case004", "ch": 2, "topic": "（論点）代理人を株主に限定する定款規定の効力（定款による代理人資格の制限）", "caseText": "甲社の定款には、株主総会のかく乱を防ぐため「代理人は株主に限る」旨の定めがある。株主Aは総会屋であるDを、病気入院中の株主Bは息子Eを、法人株主Cは従業員Fを、それぞれ代理人として株主総会に出席させようとしたが、D、E、Fはいずれも株主ではない。甲社は、D、E、Fの株主総会への出席を認めず、株主総会決議がなされた。Bは、本件株主総会の決議の効力を争いたいと考えている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：代理人を株主に限定する定款規定の効力（定款による代理人資格の制限）と、その適用排除。Eの出席を認めなかったことが決議取消事由となるかは、①当該定款規定が有効か、②当該事案に当該定款規定を適用するか（定款の射程範囲）による。310条は株主に議決権行使の機会を保障することが趣旨であるが、代理人資格を制限すべき合理的理由がある場合に相当程度の制限を加えることまで禁止したものとは解されず（最判昭和43年11月1日）、かく乱防止を趣旨とする本定款規定は有効と解される。もっとも、その趣旨から、株主以外の第三者による総会のかく乱のおそれがない場合は定款規定の適用が排除されると解され、Bの息子に過ぎないEについては適用が排除されるため、Eを排除してなされた決議には決議方法の法令（310条）違反という決議取消原因（831条1項1号）があることが問題となる。", "basis": "PDF p.33（本編 p.30）、PDF p.34（本編 p.31）。台帳要素 book-kigyoho-01-ch02-t117-e03、e05、e08 の逐語引用・要約に基づく。", "page": 33, "printed": 30}, {"id": "book-kigyoho-01-ch02-case005", "ch": 2, "topic": "利益供与の禁止（120条1項）の要件とあてはめ", "caseText": "甲社の株主Aは、甲社に対し「決議に賛成してやるから金よこせ」「株主総会において説明を求めないから」などと言った。これを受けて、甲社はAの配偶者Bに10万円を供与した。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：利益供与の禁止（120条1項）。株式会社は、①何人に対しても、②株主の権利の行使に関し、③財産上の利益の供与（当該株式会社又はその子会社の計算においてするものに限る）をしてはならない（120条1項）。本件では、受領者が株主本人ではなく配偶者Bである点が「何人に対しても」に当たり、また、供与の対価が「株主総会において説明を求めない」こと、すなわち質問権（314条）の不行使である点が、「株主の権利の行使に関して」（行使のみならず不行使も含む）に当たるかが問題となる。議決権（105条1項3号）についても同様である。", "basis": "PDF p.38（本編 p.35）。台帳要素 book-kigyoho-01-ch02-t121-e01、e02、e03 の逐語引用・要約に基づく。", "page": 38, "printed": 35}, {"id": "book-kigyoho-01-ch02-case006", "ch": 2, "topic": "利益供与の禁止の趣旨と120条2項の推定", "caseText": "甲社では、取締役会決議により、おしぼり（3万円相当/月）のリース契約（10万円/月）を5ヶ月間締結した。契約を実際に締結したのは代表取締役X1であり、取締役X2は取締役会決議に賛成した。リースの相手方は株主Aである。A、X1、X2は、「取引行為であって、株主の権利行使に関するものでない」と主張している。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：利益供与の禁止における120条2項の推定。株式会社が特定の株主に対して有償で財産上の利益の供与をした場合において、当該株式会社又はその子会社の受けた利益が当該財産上の利益に比して著しく少ないときは、「株主の権利の行使に関し」財産上の利益の供与をしたものと推定される（120条2項後段）。本件では、3万円相当のおしぼりリースに10万円/月を支払うもので、甲社の受けた利益が供与した利益に比して著しく少ないため、Aらの「株主の権利行使に関するものでない」との主張に対しても推定が働き、120条1項違反の利益供与となるかが問題となる。派生して、Aへの返還請求（120条3項）、関与取締役X1・X2への支払請求（120条4項）も問題となりうる。", "basis": "PDF p.39（本編 p.36）。台帳要素 book-kigyoho-01-ch02-t122-e01、e02、e03 の逐語引用・要約に基づく。", "page": 39, "printed": 36}, {"id": "book-kigyoho-01-ch02-case007", "ch": 2, "topic": "利益供与の返還請求の設例（問題1・問題2）", "caseText": "甲社は、株主Aに土地1（5000万円相当）を無償で譲渡（贈与）した。その後、甲社はAに土地1の返還請求をすることができるか問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：利益供与を受けた者の返還義務（120条3項）と120条2項前段の推定。甲社が「特定の株主」であるAに土地1を「無償」で譲渡したことは、「株主の権利の行使に関し」「財産上の利益の供与」をしたものと推定され（120条2項前段）、120条1項により禁止される。それにもかかわらず無償譲渡がされた以上、Aが上記推定を覆さない限り、甲社は「当該利益の供与を受けた者」Aに対して土地1の返還を求めることができる（120条3項）。", "basis": "PDF p.42（本編 p.39）。台帳要素 book-kigyoho-01-ch02-t125-e01、e02 の逐語引用・要約に基づく。", "page": 42, "printed": 39}, {"id": "book-kigyoho-01-ch02-case008", "ch": 2, "topic": "利益供与の返還請求の設例（問題1・問題2）", "caseText": "甲社の代表取締役Aは、甲社の株主Bに「総会において、会社提案の議案に反対しないでくれ」と依頼した。Bは「配偶者Cに土地2を売ってくれるなら」と応じ、Aは子会社である乙社に指示して、乙社はBの配偶者C（非株主）に土地2を売却した。乙社はCに土地2の返還請求をすることができるか問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：子会社の計算において第三者（株主の配偶者）に対してされた利益供与と返還請求（120条1項・3項）。甲社は、株主Bの配偶者Cに対して（「何人に対しても」）、子会社乙社の「計算において」土地2という「財産上の利益」の供与をしている。そして、この供与は、Bが甲社総会において反対しないという株主の権利（議決権・105条1項3号）の不行使と引換えであるので、「株主の権利の行使に関し」といえる。したがって甲社は120条1項に違反して利益を供与したことになり、乙社は「利益の供与を受けた」Cに土地2の返還請求をすることができる（120条3項）。なお、Cが土地2に相当する対価を支払っていたとしても、土地を買えること自体が「利益」の供与に当たる。", "basis": "PDF p.43（本編 p.40）。台帳要素 book-kigyoho-01-ch02-t125-e01、e03、e04 の逐語引用・要約に基づく。", "page": 43, "printed": 40}, {"id": "book-kigyoho-01-ch02-case009", "ch": 2, "topic": "（問題）Cが369条2項の「特別の利害関係を有する取締役」か", "caseText": "甲社の取締役会は、取締役A、B、C、D、Eで構成され、代表取締役Aの解職決議が審議されている。AとBは対立しており、CはA派である。Cは、Aが代表取締役を解職されるとBが力をつけ、C自身の会社における影響力が低下するのをおそれ、Aの解職を検討すること自体に批判を繰り返してきた。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役Cが369条2項の「特別の利害関係を有する取締役」に当たるか。特別の利害関係を有する取締役は公正な議決権行使が期待できないため議決に加わることができない（369条2項）。本件では、決議の対象は代表取締役Aの解職であるから、会社に対する忠実義務に違反するおそれがあり取締役会の決議の公正を害するおそれがある取締役はAであって、Cではないのではないか。Cの影響力低下のおそれは、決議事項そのものとの特別の利害関係といえるかが問題となる。", "basis": "PDF p.63（本編 p.60）。台帳要素 book-kigyoho-01-ch02-t218-e01、e02 の逐語引用・要約に基づく。", "page": 63, "printed": 60}, {"id": "book-kigyoho-01-ch02-case010", "ch": 2, "topic": "（問題）取締役会規則による事前承認を欠く保証と349条5項", "caseText": "甲社は、取締役会規則により、「会社が保証をする場合常に事前の取締役会の承認を要する」としていた。甲社の取引先である乙社が、X銀行から50万円の借入をするに際して、甲社代表取締役Aは甲社を代表して当該借入金債務を保証したが、その際、甲社取締役会の承認を得ていなかった。X銀行が甲社に当保証債務に基づき50万円の請求をした場合、甲社はX銀行の請求を拒むことができるか問題となっている。なお、当該保証は多額の借財にあたらないものとする。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役会規則（内規）による代表権の制限を第三者に対抗できるか（349条5項）。代表取締役は包括的代表権を有するが（349条4項）、代表取締役の権限に加えた制限は善意の第三者に対抗できない（349条5項）。そして、重過失は悪意と同視しうるので、善意とは善意・無重過失を意味すると解される。本件では、X銀行が取締役会規則によるAの権限の制限について善意・無重過失ならば、甲社はX銀行に制限を対抗できず、その請求を拒むことができないことが問題となる。", "basis": "PDF p.67（本編 p.64）。台帳要素 book-kigyoho-01-ch02-t222-e03、e04 の逐語引用・要約に基づく。", "page": 67, "printed": 64}, {"id": "book-kigyoho-01-ch02-case011", "ch": 2, "topic": "（比較問題）保証金額が総資産の15％を超える場合に事前承認を要する事案", "caseText": "甲社は、取締役会規則により、「保証金額が会社の総資産の15％を超える場合には、事前の取締役会の承認を要する」としていた。甲社の取引先である乙社が、X銀行から1億円（甲社の総資産の20％にあたる）の借入をするに際して、甲社代表取締役Aは甲社を代表して当該借入金債務を保証したが、その際、甲社取締役会の承認を得ていなかった。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役会決議を要する「多額の借財」（362条4項2号）に当たる保証を、取締役会決議を欠いて代表取締役が行った場合の効力。「甲社が乙社の債務を保証した。」とあれば、362条4項2号の「借財」にあたるので、「多額」の要件を満たすかを考える。その際、取締役会規則（内規）の定めは、「従来の取扱い」という「多額」の意義の考慮要素のあてはめで使うことになる。本件では保証額1億円が総資産の20％に当たることから「多額」に当たるかが問題となる。", "basis": "PDF p.68（本編 p.65）。台帳要素 book-kigyoho-01-ch02-t223-e02 の逐語引用・要約に基づく。", "page": 68, "printed": 65}, {"id": "book-kigyoho-01-ch02-case012", "ch": 2, "topic": "（論点）表見代表取締役（354条）の要件", "caseText": "甲会社の取締役会はA、B、C、Dの4名の取締役で構成され、Aが代表取締役として選任されていた。登記簿上も、前記の4名が取締役として、Aが代表取締役として登記されていた。Cは、常日頃、甲会社社長の肩書で行動していた。甲会社と契約を望んだ乙は、Cに代表権があると信じ、甲会社の登記を確認することなく、Cとの間で契約を締結した。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：表見代表取締役（354条）。代表権のない取締役が会社を代表して行為をしても、それは無権代表行為であって、その効果は会社に帰属しないのが原則である（効果不帰属）。もっとも、株式会社は、①代表取締役以外の取締役に社長、副社長その他株式会社を代表する権限を有するものと認められる名称を②付した場合には、当該取締役がした行為について、③善意の第三者に対してその責任を負う（354条）。要件は①虚偽の外観の存在、②本人の帰責性（外観への与因）、③外観への信頼である。本件では、Cの「社長」の肩書という外観、甲会社が名称を付したといえるか、登記を確認しなかった乙が善意（・無重過失）といえるかが問題となり、甲会社が本件契約について責任を負うかが問われる。", "basis": "PDF p.72（本編 p.69）。台帳要素 book-kigyoho-01-ch02-t227-e01、e02、e03、e05 の逐語引用・要約に基づく。", "page": 72, "printed": 69}, {"id": "book-kigyoho-01-ch02-case013", "ch": 2, "topic": "競業取引の趣旨と＜事例1＞", "caseText": "甲社はパンの製造販売を営む会社である。甲社の取締役Aは、自己のためにB等に対してパンの製造販売を行い、800万円の利益を得た。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：競業取引（356条1項1号・365条）の成否。取締役の競業取引を放任すれば、会社のノウハウを取締役が利用して取引機会や得意先を奪うおそれがあるので、会社の利益を保護するため、取締役が自己又は第三者のために株式会社の事業の部類に属する取引をしようとするときは、事前の承認（356条1項柱書・365条1項）と事後の報告（365条2項）が必要である。ここで「自己又は第三者のために」とは名義ではなく自己又は第三者の計算においてを意味し（計算説）、「会社の事業の部類に属する取引」とは会社が実際に行っている事業と市場において競合し利益衝突が生じるおそれがある取引をいう。本件でAの行為がこれに当たるかが問題となる。", "basis": "PDF p.95（本編 p.92）。台帳要素 book-kigyoho-01-ch02-t332-e01、e02 の逐語引用・要約に基づく。", "page": 95, "printed": 92}, {"id": "book-kigyoho-01-ch02-case014", "ch": 2, "topic": "＜事例2＞同業他社の代表取締役への就任と競業取引", "caseText": "甲株式会社（取締役会設置会社）の取締役Aが、同業他社である乙株式会社の代表取締役に就任しようとしている。就任自体に甲会社の取締役会の承認が必要となるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：同業他社の代表取締役への就任自体が競業取引（356条1項1号）に当たるか。同業他社の代表取締役に「就任」すること自体は競業「取引」ではないから、就任自体は競業取引にあたらず、取締役会の承認は必要ではない。しかし、就任すればその後は継続的に競業取引をするのは明らかであるから、Aが乙会社の代表取締役に就任後に同種の事業を行う場合は競業取引にあたり承認が必要となる。もっとも、取引のたびごとに承認を要求するのは煩雑であるため、初めて「取引」をする際の包括的承認を肯定すべきかが問題となる。", "basis": "PDF p.97（本編 p.94）。台帳要素 book-kigyoho-01-ch02-t338-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 97, "printed": 94}, {"id": "book-kigyoho-01-ch02-case015", "ch": 2, "topic": "[問題]＜事例3＞関西進出を計画する会社と取締役の競業取引", "caseText": "甲社は関東でパンの製造販売の事業を行っている。甲社の取締役Aは、関西でパンの製造販売を行い、B等との取引で800万円の利益を得た。なお、甲社は関西進出を計画して準備も進めていた。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：市場の異なる地域での同種事業が競業取引（356条1項1号・365条1項）に当たるか。Aが甲会社の承認を得る必要があるかは、Aの関西でのパンの製造販売行為が競業取引にあたるかによる。競業取引とは、取締役が自己又は第三者のために（＝自己又は第三者の計算において）する株式会社の事業の部類に属する取引であり、「会社の事業の部類に属する取引」とは、会社が実際に行っている事業が市場において競業し利益衝突が生じるおそれがある取引をいう。本件では、関東と関西と市場が異なるともいえるが、甲社が関西進出を計画し準備も進めていたことから、Aの行為は関西市場において競業し利益衝突が生じるおそれがある取引といえるかが問題となる。", "basis": "PDF p.98（本編 p.95）。台帳要素 book-kigyoho-01-ch02-t339-e01、e05 の逐語引用・要約に基づく。", "page": 98, "printed": 95}, {"id": "book-kigyoho-01-ch02-case016", "ch": 2, "topic": "[問題]甲社・乙社間の取引と両社の承認の要否", "caseText": "甲社（代表取締役A、取締役B）と乙社（代表取締役B、取締役C）との間で取引が行われようとしている。すなわち、甲社の取締役Bは、乙社の代表取締役を兼ねている。この取引について、甲社及び乙社は会社の承認を得る必要があるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：兼任取締役が一方の会社を代表して他方の会社と取引する場合の直接・間接利益相反取引（356条1項2号・3号、365条1項）の成否。甲社については、甲社の取締役Bが乙社の代表取締役として甲社と取引しているので、Bは第三者のために甲社と取引をしているといえ、直接利益相反取引にあたるかが問題となる。乙社については、Bが甲社を代表・代理して取引を行っているわけではないので直接利益相反取引にはあたらず、また甲社が利益を受けてもそれがBの利益となるわけではないから、乙社とBの利益が相反する取引とはいえず間接利益相反取引にもあたらないかが問題となる。", "basis": "PDF p.107（本編 p.104）。台帳要素 book-kigyoho-01-ch02-t352-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 107, "printed": 104}, {"id": "book-kigyoho-01-ch02-case017", "ch": 2, "topic": "（問題）配偶者Bへの土地売却は直接利益相反取引にあたるか", "caseText": "甲社の代表取締役Aは、甲社の土地を、Aの配偶者であるBに売却した。Bはその後、土地をCに転売した。Bに有利な取引がなされ、甲社とAとの間で利益が相反するようにも見える。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役の配偶者との取引が直接利益相反取引（356条1項2号）に当たるか。たしかに、Bに有利な取引がなされ利益が相反するともいえそうであるが、356条1項2号の要件（取締役が自己又は第三者のために株式会社と取引すること）を満たすかが問題となる。AとBが配偶者や親族の関係であっても、法的にはAとBは別人格であり、原則、Bの利益＝Aの利益と考えてはいけない点がポイントとなる。", "basis": "PDF p.108（本編 p.105）。台帳要素 book-kigyoho-01-ch02-t353-e01、e02 の逐語引用・要約に基づく。", "page": 108, "printed": 105}, {"id": "book-kigyoho-01-ch02-case018", "ch": 2, "topic": "（問題）甲社の保証は間接利益相反行為にあたるか（配偶者Bの借入）", "caseText": "甲社の代表取締役Aの配偶者であるBは、乙銀行から借入をした。甲社は、このBの借入債務について乙銀行との間で保証をした。Bが利益を受け、それが取締役Aの利益ともいえ、甲社に不利益のおそれがあり、利益が相反するようにも見える。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役の配偶者の債務に対する会社の保証が間接利益相反取引（356条1項3号）に当たるか。間接利益相反取引は、株式会社と取締役以外の者との間において株式会社と当該取締役との利益が相反する取引をいうが、本件保証が356条1項3号の要件を満たすかが問題となる。AとBが配偶者や親族の関係であっても、法的にはAとBは別人格であり、原則、Bの利益＝Aの利益と考えてはいけない点がポイントとなる。", "basis": "PDF p.108（本編 p.105）。台帳要素 book-kigyoho-01-ch02-t354-e01、e02 の逐語引用・要約に基づく。", "page": 108, "printed": 105}, {"id": "book-kigyoho-01-ch02-case019", "ch": 2, "topic": "（論点）代表取締役の権限濫用", "caseText": "甲社の代表取締役Aは、自己の住宅ローン返済目的で、独断で、乙銀行から甲社名義で7000万円を借入し、自己の住宅ローンの返済に充てた。甲社の取締役会規則には1億円以上を借り入れる場合には取締役会の承認が必要とされていた。返済期において、乙銀行は甲社に7000万円の返済請求をすることができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：代表取締役の権限濫用。代表取締役の権限濫用とは、客観的には代表権の範囲内の行為をしているが、主観的には自己または第三者の利益を図るためにする行為をいう。本件借入は7000万円であり、取締役会規則上「多額の借財」（362条4項2号）として取締役会承認を要する1億円以上には当たらないため、客観的には代表権の範囲内の行為である。ただ、主観的には自己の利益を図るためにする行為であるから権限濫用の問題となり、代理権の濫用規定である民法107条の類推適用により、相手方乙銀行がその目的を知り、又は知ることができたときは、代理権を有しない者がした行為とみなされるかが問題となる。なお、（間接）利益相反取引（356条1項）と考えるのは、甲乙間の金銭消費貸借契約それ自体が客観的に代表取締役の利益になるものではないため、不正解である。", "basis": "PDF p.109（本編 p.106）。台帳要素 book-kigyoho-01-ch02-t355-e01、e02、e07、e08、e12 の逐語引用・要約に基づく。", "page": 109, "printed": 106}, {"id": "book-kigyoho-01-ch02-case020", "ch": 2, "topic": "教材設例：競業取引（パンの製造販売）に対する423条1項のあてはめ", "caseText": "甲社は東京でパンの製造販売を営んでいる。甲社の取締役Aは、甲社の承諾なく、東京でパンの製造販売を行い、B等との取引で800万円の利益を得た。甲社は取締役Aに損害賠償請求することができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役の会社に対する損害賠償責任（423条1項）の成否。当該責任が生じるためには、①役員等であること、②会社に対する任務懈怠があること、③会社に損害が発生していること、④損害の発生と任務懈怠の間に相当因果関係があること、⑤故意または過失があることが必要である。本件では、Aが甲社の承諾なくパンの製造販売をした点に競業避止義務（356条1項1号・365条1項）違反の任務懈怠があるかが中心となり、さらに会社の損害額は、取締役が競業取引によって得た利益の額と推定される（423条2項）点が問題となる。", "basis": "PDF p.124（本編 p.121）。台帳要素 book-kigyoho-01-ch02-t405-e01、e04 の逐語引用・要約に基づく。", "page": 124, "printed": 121}, {"id": "book-kigyoho-01-ch02-case021", "ch": 2, "topic": "（論点）内部統制システム構築義務", "caseText": "甲社には内部統制システムは存在していたが、使用人Xの巧妙な偽装工作によって甲社に損害が発生した。内部統制システムの不備を理由に、代表取締役Yの任務懈怠が認められるかが問題となっている（最判平成21年7月9日参照）。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：内部統制システム構築義務（362条4項6号・5項）とその程度。大会社である取締役会設置会社においては取締役会に内部統制システムの構築が義務づけられているため、各取締役は取締役会の構成員として、善管注意義務の一内容として内部統制システムの構築義務を負う。そして、その程度は、通常想定される不正行為を防止し得る程度のもので足り（一切の不正行為を完全に排除するようなシステムまでは要しない）と解される。本件では、使用人Xによる通常の想定を超えた巧妙な偽装工作がされた場合にまで、代表取締役Yに構築義務違反・任務懈怠が認められるかが問題となる（423条1項）。", "basis": "PDF p.128（本編 p.125）。台帳要素 book-kigyoho-01-ch02-t408-e03、e05、e06 の逐語引用・要約に基づく。", "page": 128, "printed": 125}, {"id": "book-kigyoho-01-ch02-case022", "ch": 2, "topic": "（論点）内部統制システム運用義務", "caseText": "甲社では内部統制システムの構築は適正であり（不備はない）、内部通報をリスク担当取締役が受け、取締役会へ報告するシステムも適正であった。従業員Xが違法行為を行い甲社に損害が発生したが、従業員Yから内部通報を受けたリスク担当取締役Bは、これを取締役会へ報告しなかった。代表取締役Aに任務懈怠が認められるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：内部統制システム運用義務と信頼の原則。各取締役は取締役会の構成員として、善管注意義務の一内容として内部統制システムを運用する義務を負う（362条4項6号・5項）。もっとも、内部統制システムの構築が適正な場合、取締役は、内部統制システムにしたがって他の取締役が適切に職務を遂行しているものと信頼することが許される（信頼の原則）。あえて疑念を差し挟むべき事情があるにもかかわらずこれを放置したなどの特段の事情がない限り、運用義務違反は認められないかが問題となる。なお、報告を怠ったリスク担当取締役B自身については、内部統制システムを適切に運用したとはいえず、善管注意義務違反としての任務懈怠が認められるかが別途問題となる。", "basis": "PDF p.129（本編 p.126）、PDF p.130（本編 p.127）。台帳要素 book-kigyoho-01-ch02-t409-e01、e02、e04 の逐語引用・要約に基づく。", "page": 129, "printed": 126}, {"id": "book-kigyoho-01-ch02-case023", "ch": 2, "topic": "（論点）経営判断の原則", "caseText": "甲社は、グループ事業の再編の一環として、乙社を甲社の完全子会社とするために、乙株式を約5倍の価格で買い取ることを取締役会の決議で決定した。取締役Xはこの決議に賛成した。その後、この買取りにより甲社に損害が生じたとして、Xの責任が問題となっている（アパマンショップホールディングス事件参照）。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：経営判断の原則と423条1項の責任。問われるのは、取締役会の構成員としてのXの判断（乙株式を約5倍の価格で買い取る判断）が任務懈怠に当たるかであり、根拠条文は423条1項である。経営はリスクを伴うものであり、会社に損害が生じたといって取締役の義務違反が容易に認められると経営は萎縮する。そこで経営判断については取締役に広い裁量が認められるべきであり、その判断の過程・内容において著しく不合理な点がなければ、善管注意義務（330条・民法644条）違反ではないと解される（最判平成22年7月15日）。判断の「過程」（情報収集・分析・検討）と「内容」の双方で著しい不合理があるかが問題となる。ただし、違法行為を行うことを判断した場合には経営判断原則は適用できない。", "basis": "PDF p.131（本編 p.128）。台帳要素 book-kigyoho-01-ch02-t410-e01、e02 の逐語引用・要約に基づく。", "page": 131, "printed": 128}, {"id": "book-kigyoho-01-ch02-case024", "ch": 2, "topic": "（論点）取締役による従業員の引き抜き行為（退職勧誘行為）", "caseText": "甲社（製薬会社）の取締役Yは、退任して自ら製薬事業を開始しようとしている。Yは在任中、甲社の研究主任Aに「一緒に退職して事業に参加しないか」と勧誘した。Aは勧誘に従い退職し、甲社に損害が発生した。甲社はYに対し423条1項の損害賠償請求をしようとしている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役による従業員の引き抜き行為（退職勧誘行為）が任務懈怠に当たるか。検討は、423条1項の要件のうち「勧誘」が会社に対する任務懈怠となるかを、①競業取引該当性、②その他の任務懈怠の順に考える。①在任中に部下の研究主任を自己の事業への参加を勧誘する行為（引き抜き行為）自体は「取引」（356条1項1号）ではないから、競業取引にはあたらず、356条1項1号・365条1項違反という任務懈怠は認められない。②そこで、取締役が善管注意義務・忠実義務（330条、民法644条、355条）の一内容として負う「会社の利益を犠牲にして自己または第三者の利益を図らない義務」に違反するかが問題となる。Yは退任前に研究主任Aを勧誘し、Aの退職によって甲社の利益を犠牲にし、Yの利益を図ることになるかがポイントである。", "basis": "PDF p.133（本編 p.130）。台帳要素 book-kigyoho-01-ch02-t411-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 133, "printed": 130}, {"id": "book-kigyoho-01-ch02-case025", "ch": 2, "topic": "教材設例1・2：429条1項のあてはめと（論点）間接損害の場合に株主も「第三者」に含むか", "caseText": "公開会社である甲社において、代表取締役Aは独断で多額の借財を行い、その結果、第三者Xに損害が生じた。Xは甲社取締役Aに対して会社法上損害賠償請求をすることができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役の第三者に対する損害賠償責任（429条1項）の成否。429条1項は第三者保護の観点から法が認めた特別の法定責任であり、①役員等に任務懈怠について悪意・重過失があること、②第三者に直接・間接を問わず損害があること、③役員の任務懈怠と第三者の損害との間に相当因果関係があることが必要である。本件では、甲社は取締役会設置会社であるから多額の借財には取締役会決議が必要であるところ（362条4項2号）、Aは独断で多額の借財をしており任務懈怠があり、多額の借財に取締役会決議が必要なことは取締役なら通常知りうるので少なくとも重過失があるといえるか、Xに間接損害が生じたといえるかが問題となる。", "basis": "PDF p.141（本編 p.138）。台帳要素 book-kigyoho-01-ch02-t417-e01、e02 の逐語引用・要約に基づく。", "page": 141, "printed": 138}, {"id": "book-kigyoho-01-ch02-case026", "ch": 2, "topic": "教材設例1・2：429条1項のあてはめと（論点）間接損害の場合に株主も「第三者」に含むか", "caseText": "公開会社である甲社において、代表取締役Aは独断で多額の借財を行い、その結果、甲社の株価が下落し、株主X2は間接損害を被った。X2は甲社取締役Aに対して会社法上損害賠償請求をすることができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：間接損害の場合に、株主も429条1項の「第三者」に含むか。429条1項の成立には、第三者に直接・間接を問わず損害があることが必要であるところ、本件のX2は「株主」であり「第三者」に当たるかが争点となる。否定説は、株主が間接損害を被った場合、代表訴訟（847条）によって会社の損害を回復でき、その結果株主の間接損害も回復できるから、株主に直接の損害賠償請求を認める必要はなく「第三者」に株主は含まないとする。肯定説は、429条1項は「第三者」と規定するだけで株主を排除しておらず、代表訴訟には6ヶ月の株式保有要件（847条1項）や担保提供（847条の4第2項）の負担もあるから、株主による直接の損害賠償請求を否定すべきでないとする。有力説は否定説だが、判例は必ずしもどちらともいえないとされる。", "basis": "PDF p.142（本編 p.139）。台帳要素 book-kigyoho-01-ch02-t417-e03、e04、e05 の逐語引用・要約に基づく。", "page": 142, "printed": 139}, {"id": "book-kigyoho-01-ch02-case027", "ch": 2, "topic": "教材問題：429条1項責任（名目的取締役B・退任取締役C）と解答例", "caseText": "甲株式会社は、公開会社でなく、取締役会設置会社であり、飲食業を営む会社である。株主総会においてA、B及びCを取締役とする選任決議がなされ、就任の承諾もなされていた。登記簿上、取締役としてA、B及びCが、代表取締役としてAが記載されていた。BはAの配偶者という理由から取締役に就任しただけで取締役の職務を何も行っていなかった。Cは取締役の辞任を申し出て甲会社は了承したが、Cの退任登記はなされておらず、CはAとはもう連絡をとりたくないと思いこれを放置していた。甲会社が倒産に瀕する状態に至った時期に、Aは返済の見込みがないのにあえて代表取締役としてXから事業用資金の借入をした。その後、甲会社は返済期に本件借入金の返済をXに行うことができなかった。Xは、B及びCに対して本件借入金相当額の損害賠償請求をした。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：429条1項責任における名目的取締役・退任取締役の責任。429条1項は第三者保護の観点から法が認めた特別の法定責任であり、①役員等の会社に対する任務懈怠があること、②任務懈怠について悪意・重過失があること、③第三者に損害があること、④相当因果関係があることが必要である。Bについては、名目的取締役であっても適法に選任され就任承諾をしている以上429条1項の「役員等」であることに変わりなく、取締役会の構成員として負う監視義務（362条2項2号）の懈怠と相当因果関係の有無が問題となる。Cについては、退任取締役が不実の取締役登記を残存させることに明示的な承諾を与えていた場合に908条2項の類推適用により責任を負うかが問題となる（本件Cは放置していたにすぎず明示的な承諾はない）。", "basis": "PDF p.148（本編 p.145）。台帳要素 book-kigyoho-01-ch02-t422-e01、e02、e05、e06 の逐語引用・要約に基づく。", "page": 148, "printed": 145}, {"id": "book-kigyoho-01-ch02-case028", "ch": 2, "topic": "取締役等の説明義務（314条）と株主の質問権", "caseText": "甲会社は、株主総会に先だって多数の質問状が出されていたため、事前質問事項のうち必要と思われるものにつき、株主からの質問を待つことなく株主総会であらかじめ一括して説明・回答した（一括回答）。そのうえである事項について株主総会決議がなされた。株主Aは、一括回答は314条に違反するとして、本件決議の取消の訴えを提起した。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：一括回答と取締役等の説明義務（314条）。一括回答とは、株主総会に先だって多数の質問状が出されている場合（事前質問）に、会社側が事前質問事項のうち必要と思われるものにつき、株主からの質問を待つことなく株主総会であらかじめ一括して説明・回答することをいう。決議取消の訴え（831条1項）が認められるかは、一括回答では必要な説明義務を果たしていないといえ「決議方法の法令（314条）違反」（同項1号）があるといえるかによる。説明義務が生じるためには、①株主総会において株主から特定の事項について説明を求められたこと、②ただし書き列挙事由にあたらないことが必要である（314条）。本件では株主総会において株主からの質問がなされていないので要件①を満たさず、そもそも必要な説明義務が発生していないため、314条違反はないかが問題となる。", "basis": "PDF p.45（本編 p.42）。台帳要素 book-kigyoho-01-ch02-t126-e02、e04、e05 の逐語引用・要約に基づく。", "page": 45, "printed": 42}, {"id": "book-kigyoho-01-ch02-case029", "ch": 2, "topic": "特別利害関係株主（831条1項3号）と取締役・株主の視点の相違", "caseText": "甲社の株主総会において、事業の重要な一部（10億円相当）を対価1億円で株主Dに譲渡する旨の決議がなされた。甲社の株主構成はA（40％）・B（30％）・C（20％）・D（10％）であり、A・B・Dが賛成した。この決議の取消しができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：特別利害関係株主が議決権を行使したことによる決議の取消し（831条1項3号）。取消原因となるのは、①株主総会等の決議について特別の利害関係を有する者が②議決権を行使したことによって、著しく不当な決議がされたときである。「特別利害関係を有する」株主とは、決議の結果について他の株主とは異なる共通しない利害を有する株主をいい、譲渡の相手方であるDはこれに当たる。一方、「著しく不当」かは多数決濫用で判断するところ、本件譲渡の対価が1億円と低価ではあるが、決議はA（40％）とB（30％）も賛成していることから、多数決の濫用とはいえず「著しく不当」な決議とはいえないかが問題となる。なお、取締役の場合（369条2項）と異なり、株主については会社との利害ではなく他の株主との利害の相違が問われる点が視点の相違である。", "basis": "PDF p.64（本編 p.61）。台帳要素 book-kigyoho-01-ch02-t219-e02、e03、e04、e05、e06 の逐語引用・要約に基づく。", "page": 64, "printed": 61}, {"id": "book-kigyoho-01-ch02-case030", "ch": 2, "topic": "（論点）-b 無効の主張権者（会社以外のものも無効主張できるか）", "caseText": "事実上倒産したA社は、その唯一価値ある債権を、取締役会決議を経ないでX社に譲渡した。X社は、A社が取締役会決議を経ていないことについて悪意であった。債権の債務者であるY社は、X社から支払いを求められたのに対し、「A社は取締役会決議を経ていないから債権譲渡は無効だ」と主張して支払いを拒もうとしている（最判平成21年4月17日の事案）。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：取締役会決議を欠く重要な財産の処分の無効を、会社以外の者が主張できるか（無効の主張権者）。362条4項が重要な業務執行についての決定を取締役会の決議事項と定めたのは、代表取締役への権限の集中を抑制し、取締役相互の協議による結論に沿った業務の執行を確保することによって会社の利益を保護しようとする趣旨に出たものである。この趣旨からすれば、代表取締役が取締役会の決議を経ないで重要な業務執行に該当する取引をした場合、その無効は、原則として会社のみが主張することができ、会社以外の者は、当該会社の取締役会が無効を主張する旨の決議をしているなどの特段の事情がない限り、これを主張することはできないと解される（最判平成21年4月17日）。前提として、本件債権譲渡が「重要な財産の処分」（362条4項1号）に当たるか、取締役会決議を欠く処分の効力が無効となるかも順に問題となる。", "basis": "PDF p.71（本編 p.68）。台帳要素 book-kigyoho-01-ch02-t226-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 71, "printed": 68}, {"id": "book-kigyoho-01-ch02-case031", "ch": 2, "topic": "旧株主による責任追及等の訴え（847条の2）", "caseText": "甲会社の株主Xは、甲社の取締役Yの任務懈怠について、株主代表訴訟（847条）による責任追及を検討していた。ところが、株式交換により甲社が乙社の完全子会社となり、Xは乙社の株式を取得して、甲社の株主ではなくなった。Xはいかなる請求をすべきかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：旧株主による責任追及等の訴え（847条の2）。この制度の趣旨は、株主が責任追及の訴えを提起する前に株式交換等がなされ、株主による役員等の責任追及を不可能にすることを防ぐことにある。行為の効力が生じた日の6ヶ月前から当該日まで引き続き株主であった者（旧株主）は、株主でなくなった場合であっても、株式交換等完全子会社に対し、責任追及等の訴え（効力が生じた時までに原因となった事実が生じた責任・義務に係るものに限る）の提起を請求することができ（847条の2第1項・第2項）、会社が請求の日から60日以内に訴えを提起しないときは、旧株主は会社のために責任追及等の訴えを提起することができる（同条6項）。ただし、訴えが旧株主若しくは第三者の不正な利益を図り又は会社に損害を加えることを目的とする場合はこの限りでない。なお、代表訴訟の係属中に株主でなくなった者の訴訟追行（851条）とは場面が異なる。", "basis": "PDF p.136（本編 p.133）、PDF p.137（本編 p.134）。台帳要素 book-kigyoho-01-ch02-t413-e01、e03、e05 の逐語引用・要約に基づく。", "page": 136, "printed": 133}, {"id": "book-kigyoho-01-ch03-case001", "ch": 3, "topic": "（論点）株主優待制度と株主平等原則", "caseText": "甲社は、株主優待制度目当ての個人投資家による投資を促すため、長年、保有株式1000株までの株主には500円の商品券5枚、1万株までの株主には同商品券10枚を進呈してきた。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：株主優待制度と株主平等原則（109条1項）。保有株式数に応じて商品券の枚数を区別する進呈行為が、株主平等原則に反するかが問題となる。判断は、①区別の目的に合理性があるか、②区別の程度が軽微か、③制度の内容が相当程度周知され株主に不測の損害を与えないか、の観点から行う。本件では、個人投資家による投資を促すという合理的目的のためであり、金額も比較的少額で区別の程度も軽微であり、長年なされ制度内容が相当程度周知され株主に不測の損害を与えないため、株主平等原則に反しないかが問われる。", "basis": "PDF p.163（本編 p.160）。台帳要素 book-kigyoho-01-ch03-t018-e02、e03 の逐語引用・要約に基づく。", "page": 163, "printed": 160}, {"id": "book-kigyoho-01-ch03-case002", "ch": 3, "topic": "（論点）特定の株主に対する贈与契約", "caseText": "甲社は業績悪化のため、一般の株主には無配としながら、株主総会の決議に賛成してもらうために、大株主Aに対してのみ、無配による損失填補のための金銭100万円を贈与する契約を締結した。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：特定の株主に対する贈与契約と株主平等原則（109条1項）。贈与は形式的には株主としての資格に基づく法律関係ではないが、実質的には剰余金の配当であり株主としての資格に基づく法律関係にあたるため、454条3項に違反し株主平等原則に反するとする判例（最判昭和45年11月24日）の論証が問題となる。また、学説の有力説によると、「決議に賛成してもらうため」は合理的目的ではなく、100万円の贈与は区別の程度が軽微ではなく、周知され不測の損害を与えないものでもないため、株主平等原則に反する。なお、この事案は利益供与の禁止（120条）違反にもなる。", "basis": "PDF p.163（本編 p.160）。台帳要素 book-kigyoho-01-ch03-t019-e01、e02、e03、e04 の逐語引用・要約に基づく。", "page": 163, "printed": 160}, {"id": "book-kigyoho-01-ch03-case003", "ch": 3, "topic": "（論点）譲渡等承認請求がない場合に、会社から譲受人に権利行使を認めることの可否", "caseText": "甲社の譲渡制限株式について、譲渡人A・譲受人Bのいずれも譲渡等承認請求をしないまま株式が譲渡された。その後、甲社の代表取締役Xは、譲受人Bに対して株主総会の招集通知を発送した。この措置が適法かが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：譲渡等承認請求がないままされた譲渡制限株式の譲渡の会社に対する効力。譲渡は当事者間では有効であるが、会社に対する関係では無効であり、会社は譲渡人を株主として扱う義務を負う。したがって、譲受人Bを株主として扱いBに対して招集通知を発送した代表取締役Xの措置が違法となるかが問題となる（最判平成9年9月9日、最判昭和63年3月15日）。", "basis": "PDF p.172（本編 p.169）。台帳要素 book-kigyoho-01-ch03-t039-e01、e02、e03 の逐語引用・要約に基づく。", "page": 172, "printed": 169}, {"id": "book-kigyoho-01-ch03-case004", "ch": 3, "topic": "相続人等への売渡請求（174条〜177条）", "caseText": "甲社の株主Aが死亡し、甲社にとって好ましくない者Dが、Aの唯一の相続人として甲株式（譲渡制限株式）を取得した。甲社はDに甲株式の売渡請求をすることができるかが問題となっている。", "q": "この事例で問題となる論点を挙げよ。", "a": "論点：相続人等に対する株式売渡請求（174条〜177条）。「相続その他の一般承継」と「譲渡（特定承継）」は異なり、一般承継の場合は会社の承認は必要ない（134条4号参照）ため、譲渡制限（107条1項1号・108条1項4号）だけでは好ましくない相続人の取得を防げない。そこで174条により、株式会社は、相続その他の一般承継により譲渡制限株式を取得した者に対し、当該株式を会社に売り渡すことを請求することができる旨を定款で定めることができるかが問題となる。売渡請求の決定は株主総会
