p.86）。台帳要素 t321-e03（代表執行役（420条）。代表執行役の包括的・不可制限的代表権（420条3項、349条4項5項）） の逐語引用に基づく。", "caution": "", "articles": ["420条3項"], "page": 89, "loc": "8 指名委員会等設置会社／執行役・代表執行役・表見代表執行役（418条〜421条）"}, {"id": "book-kigyoho-01-ch02-q5119", "ch": 2, "type": "何条", "q": "株主による執行役の行為の差止めが認められるためには、①6ヶ月前から株式を継続保有する株主であること、②執行役の行為が法令・定款に反するおそれがあること、③当該行為によって会社に回復することができない損害が生じるおそれがあることが必要である。この差止めを定める条文は、会社法何条か。", "a": "会社法422条。", "reason": "株主による執行役の行為の差止めは422条が定める。", "basis": "PDF p.89（本編 p.86）。台帳要素 t322-e01（認められるためには、①6ヶ月前から株式を継続保有する株主であること、②執行役の行為が法令・定款に反するおそれがあること、③当該行為によって会社に回復することができない損害が生じるおそれがあることが必要である） の逐語引用に基づく。", "caution": "監査委員による差止め（407条）の要件が「会社に著しい損害」であるのに対し、422条は「会社に回復することができない損害」である点に注意。", "articles": ["422条"], "page": 89, "loc": "8 指名委員会等設置会社／株主による執行役の行為の差止め（422条）"}, {"id": "book-kigyoho-01-ch02-q5120", "ch": 2, "type": "何条", "q": "監査等委員会設置会社において、取締役会の権限を定める中心的な条文は、会社法何条か。", "a": "会社法399条の13。", "reason": "監査等委員会設置会社の「権限」の条文は399条の2〜に置かれており、特に取締役会の権限とくれば399条の13である。", "basis": "PDF p.92（本編 p.89）。台帳要素 t326-e01（399条の2〜は、主として監査等委員会設置会社の「権限」の条文。権限を探すときは399条の2〜を見る。特に取締役会の権限とくれば399条の13） の逐語引用に基づく。", "caution": "", "articles": ["399条の13"], "page": 92, "loc": "9 監査等委員会設置会社／権限の条文は399条の2〜（特に取締役会の権限は399条の13）"}, {"id": "book-kigyoho-01-ch02-q5121", "ch": 2, "type": "条文構造", "q": "監査等委員会に関する条文群（399条の2〜399条の14）は、款ごとにどのような構造で配置されているか。", "a": "会社法第9節の2「監査等委員会」に置かれ、第1款「権限等」（399条の2〜399条の7）、第2款「運営」（399条の8〜399条の12）、第3款「監査等委員会設置会社の取締役会の権限等」（399条の13・399条の14）からなる。", "reason": "399条の2〜の条文群は「権限等→運営→取締役会の権限等」という款の流れで配置されており、条文を探すときはこの構造から当たりを付けることができる。", "basis": "PDF p.93（本編 p.90）。台帳要素 t329-e01（条文構造：第9節の2 監査等委員会。第1款 権限等（399条の2〜399条の7）、第2款 運営（399条の8〜399条の12）、第3款 監査等委員会設置会社の取締役会の権限等（399条の13・399条の14）） の逐語引用に基づく。", "caution": "本問の根拠は、レジュメの図表（条文構造図）の記載に基づく。", "articles": ["399条の2", "399条の13"], "page": 93, "loc": "9 監査等委員会設置会社／399条の2〜の条文構造と監査等委員会設置会社の機関構造"}, {"id": "book-kigyoho-01-ch02-q5122", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「株式会社と役員及び会計監査人との関係は、委任に関する規定に従う。」", "a": "会社法330条。", "reason": "330条により、株式会社と役員及び会計監査人との関係は委任に関する規定に従い、ここから役員等の善管注意義務（民法644条）が導かれる。", "basis": "PDF p.94（本編 p.91）。台帳要素 t330-e01（330条（株式会社と役員等との関係）：株式会社と役員及び会計監査人との関係は、委任に関する規定に従う） の逐語引用に基づく。", "caution": "", "articles": ["330条"], "page": 94, "loc": "10 役員等の義務（1）善管注意義務・（2）忠実義務／善管注意義務（330条・402条3項・民法644条）"}, {"id": "book-kigyoho-01-ch02-q5123", "ch": 2, "type": "何条", "q": "次の文言が掲げられているのは、会社法何条何項何号か。「株式会社が取締役の債務を保証すること」", "a": "会社法356条1項3号。", "reason": "356条1項3号は、「取締役以外の者との間において株式会社と当該取締役との利益が相反する取引をしようとするとき」を定め、その例として、株式会社が取締役の債務を保証することが掲げられる（間接取引）。", "basis": "PDF p.99（本編 p.96）。主対象は台帳要素 t341-e01（「株式会社が取締役の債務を保証すること」）。引用は t341-e01（「株式会社が取締役の債務を保証すること」） ／ t341-e03（「取締役以外の者との間において株式会社と当該取締役との利益が相反する取引をしようとするとき」） の逐語引用に基づく。", "caution": "", "articles": ["356条1項3号"], "page": 99, "loc": "10 役員等の義務（4）利益相反取引／間接取引（356条1項3号）の要件"}, {"id": "book-kigyoho-01-ch02-q5124", "ch": 2, "type": "何条", "q": "次の文言は、会社法何条何項何号のものか。「取締役が自己又は第三者のために株式会社と取引をしようとするとき」", "a": "会社法356条1項2号。", "reason": "356条1項2号は、取締役が自己又は第三者のために株式会社と取引をする場合（直接取引）を定める。", "basis": "PDF p.100（本編 p.97）。台帳要素 t342-e01（取締役が自己又は第三者のために株式会社と取引をしようとするとき） の逐語引用に基づく。", "caution": "", "articles": ["356条1項2号"], "page": 100, "loc": "10 役員等の義務（4）利益相反取引／直接取引（356条1項2号）の要件"}, {"id": "book-kigyoho-01-ch02-q5125", "ch": 2, "type": "規定→趣旨", "q": "会社法423条4項は、監査等委員会設置会社については、3項の任務懈怠の推定を及ぼさないこととしている。このような定めを置いた趣旨は何か。", "a": "監査等委員会設置会社への移行を促すためである（政策的制度）。", "reason": "423条4項は、推定規定の及ばない扱いとすることで、監査等委員会設置会社への移行を促す政策的な制度である。", "basis": "PDF p.105（本編 p.102）。台帳要素 t350-e05（423条4項：＜趣旨＞監査等委員会設置会社への移行を促すため（政策的制度）） の逐語引用に基づく。", "caution": "", "articles": ["423条4項"], "page": 105, "loc": "10 役員等の義務（4）利益相反取引／利益相反取引と取締役の任務懈怠責任（423条1項・3項・428条）"}, {"id": "book-kigyoho-01-ch02-q5126", "ch": 2, "type": "何条", "q": "次の定めは、民法何条のものか。「代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。」", "a": "民法107条（代理権の濫用）。", "reason": "民法107条は代理権の濫用の規定であり、代表取締役の権限濫用の場合にも類推適用が論じられる。", "basis": "PDF p.110（本編 p.107）。台帳要素 t355-e12（民法107条（代理権の濫用）：「代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。」） の逐語引用に基づく。", "caution": "", "articles": ["民法107条"], "page": 110, "loc": "10 役員等の義務・代表取締役の権限濫用／（論点）代表取締役の権限濫用"}, {"id": "book-kigyoho-01-ch02-q5127", "ch": 2, "type": "規定→趣旨", "q": "会社法361条5項は、監査等委員である取締役の報酬等について定めている。その趣旨は何か。", "a": "監査等委員である取締役の監査の適正、独立性を確保するためである。", "reason": "361条5項の趣旨は、監査等委員である取締役の監査の適正と独立性を確保することにある。", "basis": "PDF p.113（本編 p.110）。台帳要素 t357-e06（5項の趣旨：監査等委員である取締役の監査の適正、独立性を確保するため） の逐語引用に基づく。", "caution": "", "articles": ["361条5項"], "page": 113, "loc": "10 役員等の義務（5）取締役の報酬等の決定／取締役の報酬等の決定（361条）"}, {"id": "book-kigyoho-01-ch02-q5128", "ch": 2, "type": "規定→趣旨", "q": "会社法361条6項は、監査等委員である取締役以外の取締役の報酬等について定めている。その趣旨は何か。", "a": "指名委員会等設置会社の報酬委員会に準じた機能を発揮することで、経営監督機能の実効性を確保するためである。", "reason": "361条6項の趣旨は、報酬委員会に準じた機能を通じて、経営監督機能の実効性を確保することにある。", "basis": "PDF p.113（本編 p.110）。台帳要素 t357-e07（6項の趣旨：指名委員会等設置会社の報酬委員会に準じた機能を発揮することで経営監督機能の実効性を確保するため） の逐語引用に基づく。", "caution": "", "articles": ["361条6項"], "page": 113, "loc": "10 役員等の義務（5）取締役の報酬等の決定／取締役の報酬等の決定（361条）"}, {"id": "book-kigyoho-01-ch02-q5129", "ch": 2, "type": "何条", "q": "取締役が、会社に著しい損害を及ぼすおそれのある事実を発見した場合、その報告の宛先は、監査役ではなく株主である。この報告について定める条文は、会社法何条何項か。", "a": "会社法357条1項。", "reason": "357条1項は、取締役が会社に著しい損害を及ぼすおそれのある事実を発見した場合の報告について定め、その宛先が株主である点に特徴がある。", "basis": "PDF p.121（本編 p.118）。台帳要素 t370-e01（②会社に著しい損害を及ぼすおそれのある事実を発見した場合の取締役の報告の宛先は、監査役ではなく株主である（357条1項）） の逐語引用に基づく。", "caution": "", "articles": ["357条1項"], "page": 121, "loc": "10 役員等の義務（6）株主の監督権限の強化／具体例②〜④（357条1項・367条・371条）"}, {"id": "book-kigyoho-01-ch02-q5130", "ch": 2, "type": "何条", "q": "株主は、一定の場合に、取締役会の招集を請求し、または自ら招集することができ（招集請求権・招集権）、その取締役会への出席・意見陳述も認められている。この株主の権利を定める条文は、会社法何条か。", "a": "会社法367条（招集請求権・招集権は1項・3項、出席・意見陳述権は4項）。", "reason": "367条は、株主の監督権限の強化の一環として、株主に取締役会招集請求権・招集権と、当該取締役会への出席・意見陳述権を認めている。", "basis": "PDF p.121（本編 p.118）。台帳要素 t370-e02（③株主は一定の場合には取締役会招集請求権・招集権を行使でき（367条1項3項）、当該取締役会への出席・意見陳述権を有する（同条4項）） の逐語引用に基づく。", "caution": "", "articles": ["367条"], "page": 121, "loc": "10 役員等の義務（6）株主の監督権限の強化／具体例②〜④（357条1項・367条・371条）"}, {"id": "book-kigyoho-01-ch02-q5131", "ch": 2, "type": "何条", "q": "株主の取締役会議事録の閲覧請求については、行使要件が緩和され、裁判所の許可は不要とされている。この閲覧請求について定める条文は、会社法何条か。", "a": "会社法371条（2項・3項）。", "reason": "371条2項・3項により、株主の取締役会議事録の閲覧請求は裁判所の許可を要しないものとされ、株主の監督権限が強化されている。", "basis": "PDF p.121（本編 p.118）。台帳要素 t370-e03（④株主の取締役会議事録閲覧請求権の行使要件が緩和され裁判所の許可が不要（371条2項3項）） の逐語引用に基づく。", "caution": "", "articles": ["371条"], "page": 121, "loc": "10 役員等の義務（6）株主の監督権限の強化／具体例②〜④（357条1項・367条・371条）"}, {"id": "book-kigyoho-01-ch02-q5132", "ch": 2, "type": "何条", "q": "役員等の任務懈怠責任（423条1項）の一部免除には3つの方法がある。①事後の株主総会の特別決議による方法、②事前の定款の定めと事後の取締役会決議（取締役の過半数）による方法、③事前の定款の定めと非業務執行取締役等との責任限定契約による方法は、それぞれ会社法何条に基づくか。", "a": "①は425条、②は426条、③は427条。", "reason": "一部免除の方法は、425条（事後の株主総会特別決議）、426条（事前の定款規定＋事後の取締役会決議）、427条（事前の定款規定＋責任限定契約）と、条文ごとに手続が対応している。なお、全部免除は424条（総株主の同意）である。", "basis": "PDF p.123（本編 p.120）。台帳要素 t404-e02（一部免除の方法：425条は事後の株主総会特別決議による一部免除、426条は事前の定款規定＋事後の取締役会決議（取締役の過半数）による一部免除、427条は事前の定款規定＋事前の非業務執行取締役等との責任限定契約） の逐語引用に基づく。", "caution": "", "articles": ["425条", "426条", "427条"], "page": 123, "loc": "11 役員等の会社に対する責任（任務懈怠責任、423条）―要件・任務懈怠・免除等／任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"}, {"id": "book-kigyoho-01-ch02-q5133", "ch": 2, "type": "条文構造", "q": "役員等の責任に関する推定規定について、競業取引と利益相反取引とで、会社法423条の各項はどのような構造で配置されているか。あわせて428条の位置づけも述べよ。", "a": "競業取引については、423条1項に2項が組み合わさり、2項が損害額を推定する。利益相反取引については、（423条1項に）3項が組み合わさり、3項が任務懈怠を推定する。これに対し、428条は無過失責任を定める。", "reason": "423条は「1項＝責任の本体」「2項＝損害額の推定（競業取引）」「3項＝任務懈怠の推定（利益相反取引）」という構造であり、428条は推定ではなく無過失責任そのものを定める点で位置づけが異なる。", "basis": "PDF p.123（本編 p.120）。台帳要素 t404-e06（423条の推定構造（図）：競業取引は423条1項＋2項（③損害額を推定）、利益相反取引は（423条1項＋）3項（②任務懈怠を推定）、428条は無過失責任） の逐語引用に基づく。", "caution": "", "articles": ["423条2項", "423条3項", "428条"], "page": 123, "loc": "11 役員等の会社に対する責任（任務懈怠責任、423条）―要件・任務懈怠・免除等／任務懈怠責任の免除・一部免除（424条〜427条）と推定規定・連帯責任の参照"}, {"id": "book-kigyoho-01-ch02-q5134", "ch": 2, "type": "何条", "q": "株主が会社に対して責任追及等の訴えの提起を請求する制度（株主代表訴訟）は、次の要件のもとで認められる。①6ヶ月前から引き続き株式を保有する株主によること（非公開会社では6ヶ月の保有は不要）、②責任追及等の訴えの提起請求であること、③株主に図利加害目的がないこと。この制度を定める条文は、会社法何条か。", "a": "会社法847条。", "reason": "株主代表訴訟の提起請求は847条が定め、非公開会社では6ヶ月の保有要件が2項により不要となる。会社が提訴請求の日から60日以内に責任追及等の訴えを提起しないこと（3項）が、株主が訴えを提起できる要件となる。", "basis": "PDF p.135（本編 p.132）。台帳要素 t412-e02（要件：①6ヶ月株式を保有する株主による（非公開会社は6ヶ月要件不要、2項）、②責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項）） の逐語引用に基づく。", "caution": "", "articles": ["847条"], "page": 135, "loc": "12 株主による責任追及等の訴え等／株主による責任追及等の訴え（株主代表訴訟、847条）"}, {"id": "book-kigyoho-01-ch02-q5135", "ch": 2, "type": "何条", "q": "最終完全親会社等の株主による特定責任追及の訴え（多重代表訴訟）は、次の要件のもとで提起を請求できる。①6ヶ月継続して最終完全親会社等の総議決権の100分の1以上の株式を有する株主によること、②特定責任追及等の訴えの提起請求であること、③株主に図利加害目的がないこと。この制度を定める条文は、会社法何条か。", "a": "会社法847条の3。", "reason": "多重代表訴訟は847条の3が定め、非公開会社では6ヶ月の継続保有要件が6項により不要となる。", "basis": "PDF p.138（本編 p.135）。台帳要素 t414-e02（要件：①6ヶ月継続して最終完全親会社等の総議決権の1/100以上株式を有する株主による（非公開会社は6ヶ月要件不要、6項）、②特定責任追及等の訴えの提起請求、③株主に図利加害目的がないこと（1項）） の逐語引用に基づく。", "caution": "", "articles": ["847条の3"], "page": 138, "loc": "12 株主による責任追及等の訴え等／最終完全親会社等の株主による特定責任追及の訴え（多重代表訴訟等、847条の3）"}, {"id": "book-kigyoho-01-ch02-q5136", "ch": 2, "type": "条文構造", "q": "会社法429条2項は、どのような構造で第三者に対する責任を定めているか。本文とただし書の役割を述べよ。", "a": "本文は、各号に掲げる者が当該各号に定める行為をしたときも、前項（1項）と同様とすることを定める。ただし書は、その者が当該行為をすることについて注意を怠らなかったことを証明したときは、この限りでないとし、証明による免責を定める。会計監査人については、4号が、会計監査報告に記載し、又は記録すべき重要な事項についての虚偽の記載又は記録を掲げる。", "reason": "429条2項は「本文＝1項と同様の責任」「各号＝対象者と行為の列挙」「ただし書＝注意を怠らなかったことの証明による免責」という構造である。", "basis": "PDF p.150（本編 p.147）。台帳要素 t423-e01（429条2項：各号に掲げる者が当該各号に定める行為をしたときも前項と同様とする。ただし、その者が当該行為をすることについて注意を怠らなかったことを証明したときはこの限りでない。4号は会計監査人による会計監査報告に記載し、又は記録すべき重要な事項についての虚偽の記載又は記録） の逐語引用に基づく。", "caution": "", "articles": ["429条2項"], "page": 150, "loc": "13 教材問題（429条1項）と（2）429条2項・役員等の連帯責任（430条）／429条2項（会計監査人の責任を例に）"}, {"id": "book-kigyoho-01-ch02-q5137", "ch": 2, "type": "何条", "q": "次の定めは、会社法何条のものか。「役員等が株式会社又は第三者に生じた損害を賠償する責任を負う場合において、他の役員等も当該損害を賠償する責任を負うときは、これらの者は、連帯債務者とする。」", "a": "会社法430条。", "reason": "役員等が会社又は第三者に生じた損害を賠償する責任を負う場合の連帯責任は、430条が定める。", "basis": "PDF p.150（本編 p.147）。台帳要素 t424-e01（430条：役員等が株式会社又は第三者に生じた損害を賠償する責任を負う場合において、他の役員等も当該損害を賠償する責任を負うときは、これらの者は連帯債務者とする） の逐語引用に基づく。", "caution": "", "articles": ["430条"], "page": 150, "loc": "13 教材問題（429条1項）と（2）429条2項・役員等の連帯責任（430条）／役員等の連帯責任（430条）"}, {"id": "book-kigyoho-01-ch02-q5138", "ch": 2, "type": "条文構造", "q": "補償契約について定める会社法430条の2は、1項と2項でどのような構造になっているか。", "a": "1項は、補償契約の内容の決定手続（株主総会の普通決議・取締役会決議）を定め、補償の対象として、「対処するために支出する費用」（防御費用。例：訴訟費用や弁護士報酬。1号）と、429条・民法709条の賠償金等（賠償金は2号イ、和解金は2号ロ）を掲げる。2項は、補償することができない場合を定め、3号により、429条1項の賠償金等の補償をすることができない場合がある。", "reason": "430条の2は「1項＝補償契約の内容と手続」「2項＝補償することができない場合」という構造である。", "basis": "PDF p.151（本編 p.148）。主対象は台帳要素 t426-e01（430条の2第1項：補償契約の内容決定手続は株主総会の普通決議・取締役会決議（趣旨②に対応））。引用は t426-e01（430条の2第1項：補償契約の内容決定手続は株主総会の普通決議・取締役会決議（趣旨②に対応）） ／ t426-e03（「対処するために支出する費用」（防御費用、例：訴訟費用や弁護士報酬）は補償内容とする契約締結が可能である（1号）） ／ t426-e04（429条・民法709条の賠償金等の補償を内容とする契約の締結は可能である（賠償金は2号イ、和解金は2号ロ）） ／ t426-e05（2項（「補償することができない」場合）：3号により、429条1項の賠償金等の補償をすることができない場合がある） の逐語引用に基づく。", "caution": "", "articles": ["430条の2"], "page": 151, "loc": "14 補償契約（430条の2）・役員等のための保険契約（430条の3）／補償契約（430条の2）"}, {"id": "book-kigyoho-01-ch02-q5139", "ch": 2, "type": "条文構造", "q": "株主による取締役の行為の差止めについて定める会社法360条は、2項と3項で、1項の定めをどのように読み替える構造になっているか。", "a": "1項は、6箇月前から引き続き株式を有する株主は、取締役が法令・定款に違反する行為をし、又はするおそれがある場合において、当該行為によって会社に著しい損害が生ずるおそれがあるときは、差止めを請求できることを定める。2項は、公開会社でない株式会社における1項の適用については、「6箇月前から引き続き株式を有する株主」とあるのは「株主」と読み替える。3項は、監査役設置会社、監査等委員会設置会社又は指名委員会等設置会社における1項の適用については、「著しい損害」とあるのは「回復することができない損害」と読み替える。", "reason": "360条は「1項＝原則」「2項＝公開会社でない株式会社についての読替え」「3項＝監査役設置会社等についての読替え」という構造であり、会社の類型によって請求権者と損害の要件がどう変わるかは、項の対応で把握する。", "basis": "PDF p.153（本編 p.150）。主対象は台帳要素 t428-e03（360条2項：公開会社でない株式会社における1項の適用については、「6箇月前から引き続き株式を有する株主」とあるのは「株主」とする）。引用は t428-e02（360条1項：6箇月前から引き続き株式を有する株主は、取締役が株式会社の目的の範囲外の行為その他法令若しくは定款に違反する行為をし、又はこれらの行為をするおそれがある場合において、当該行為によって株式会社に著しい損害が生ずるおそれがあるときは、当該取締役に対し当該行為をやめることを請求することができる） ／ t428-e03（360条2項：公開会社でない株式会社における1項の適用については、「6箇月前から引き続き株式を有する株主」とあるのは「株主」とする） ／ t428-e04（360条3項：監査役設置会社、監査等委員会設置会社又は指名委員会等設置会社における1項の適用については、「著しい損害」とあるのは「回復することができない損害」とする） の逐語引用に基づく。", "caution": "", "articles": ["360条1項", "360条2項", "360条3項"], "page": 153, "loc": "15 取締役等の行為の差止請求等／取締役・執行役の行為の差止請求"}, {"id": "book-kigyoho-01-ch02-q5140", "ch": 2, "type": "何条", "q": "レジュメのⅡ重要条文（暗記すべき条文）において、「株主有限責任」の根拠条文として挙げられているのは、会社法何条か。", "a": "会社法104条。", "reason": "株主有限責任の根拠条文は104条である。", "basis": "PDF p.155（本編 p.152）。台帳要素 t431-e01（暗記対象条文：株主有限責任 ― 104条） の逐語引用に基づく。", "caution": "", "articles": ["104条"], "page": 155, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：機関設計・株主総会関係"}, {"id": "book-kigyoho-01-ch02-q5141", "ch": 2, "type": "何条", "q": "レジュメのⅡ重要条文（暗記すべき条文）において、「機関設計の自由」の根拠条文として挙げられているのは、会社法何条何項か。", "a": "会社法326条2項。", "reason": "機関設計の自由の根拠条文は326条2項である（例外は327条・328条）。", "basis": "PDF p.155（本編 p.152）。台帳要素 t431-e02（暗記対象条文：機関設計の自由 ― 326条2項） の逐語引用に基づく。", "caution": "", "articles": ["326条2項"], "page": 155, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：機関設計・株主総会関係"}, {"id": "book-kigyoho-01-ch02-q5142", "ch": 2, "type": "何条", "q": "株主提案権は、議題提案権・議案提案権・議案の要領の通知請求権からなる。これらは、それぞれ会社法何条に基づくか。", "a": "議題提案権は303条、議案提案権は304条、議案の要領の通知請求権は305条。", "reason": "株主提案権は303条〜305条に分かれて定められており、議題提案権＝303条、議案提案権＝304条、議案の要領の通知請求権＝305条と対応する。", "basis": "PDF p.155（本編 p.152）。台帳要素 t431-e09（暗記対象条文：株主提案権 ― 303条～305条（議題提案権（303条）、議案提案権（304条）、議案の要領の通知請求権（305条））） の逐語引用に基づく。", "caution": "", "articles": ["303条", "304条", "305条"], "page": 155, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：機関設計・株主総会関係"}, {"id": "book-kigyoho-01-ch02-q5143", "ch": 2, "type": "何条", "q": "レジュメのⅡ重要条文（暗記すべき条文）において、「利益供与の刑事罰」の根拠条文として挙げられているのは、会社法何条か。", "a": "会社法970条。", "reason": "利益供与（120条）に対する刑事罰の根拠条文は970条である。", "basis": "PDF p.155（本編 p.152）。台帳要素 t431-e18（暗記対象条文：利益供与の刑事罰 ― 970条） の逐語引用に基づく。", "caution": "", "articles": ["970条"], "page": 155, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：機関設計・株主総会関係"}, {"id": "book-kigyoho-01-ch02-q5144", "ch": 2, "type": "何条", "q": "取締役会設置会社の株主総会は、議題以外の事項を決議することができない。このことを定める条文は、会社法何条何項か。", "a": "会社法309条5項。", "reason": "取締役会設置会社の株主総会が議題以外の事項を決議できないことの根拠条文は309条5項である。", "basis": "PDF p.155（本編 p.152）。台帳要素 t431-e21（暗記対象条文：取締役会設置会社の株主総会は議題以外決議できない ― 309条5項） の逐語引用に基づく。", "caution": "", "articles": ["309条5項"], "page": 155, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：機関設計・株主総会関係"}, {"id": "book-kigyoho-01-ch02-q5145", "ch": 2, "type": "何条", "q": "株主総会決議取消しの訴えにおける「裁量棄却」を定める条文は、会社法何条何項か。", "a": "会社法831条2項。", "reason": "裁量棄却の根拠条文は、決議取消しの訴えを定める831条の2項である。", "basis": "PDF p.155（本編 p.152）。台帳要素 t431-e23（暗記対象条文：裁量棄却 ― 831条2項） の逐語引用に基づく。", "caution": "", "articles": ["831条2項"], "page": 155, "loc": "Ⅱ 重要条文（暗記すべき条文）―機関―／Ⅱ重要条文（暗記すべき条文）：機関設計・株主総会関係"}, {"id": "book-kigyoho-01-ch03-q5000", "ch": 3, "type": "規定→趣旨", "q": "種類株式や株式の内容についての特別の定めを新たに付する定款変更では、内容に応じて、株主総会の特別決議のみで足りる場合、その種類株主総会の特殊決議を要する場合、その種類株主全員の同意を要する場合など、決議の厳格さに差が設けられている。この厳格さの差は、何に対応しているか。", "a": "決議の厳格さは、株主の不利益のおそれの大きさに対応している。すなわち、株主に不利益のおそれあり→特別決議、株主にもっと不利益のおそれあり→特殊決議、株主にもっともっと不利益のおそれあり→全員の同意、である。", "reason": "台帳は、決議の厳格さと趣旨のキーワード（不利益のおそれの程度）との対応として整理している。規定側の手続の差は同項目の手続表（t003-e01〜t007-e01、t011-e01〜t013-e01）に基づく。", "basis": "PDF p.159（本編 p.156）", "caution": "", "articles": [], "page": 159, "loc": "項目2 種類株式（108条）"}, {"id": "book-kigyoho-01-ch03-q5001", "ch": 3, "type": "規定→趣旨", "q": "会社法109条1項は「株式会社は、株主を、その有する株式の内容及び数に応じて、平等に取り扱わなければならない」と定める。この株主平等原則の趣旨は何か。", "a": "多数決の濫用や代表者の恣意的な業務執行行為から少数株主を保護し、株式投資を促すためである。", "reason": "規定（109条1項の文言）と趣旨を対応させた。", "basis": "PDF p.162（本編 p.159）。台帳要素 t015-e01、t015-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 162, "loc": "項目4 株主平等原則（109条1項）"}, {"id": "book-kigyoho-01-ch03-q5002", "ch": 3, "type": "規定→趣旨", "q": "会社法109条2項は、非公開会社では、株主ごとに異なる取扱いをする属人的な権利の定め（例：1株主1議決権）を認める。この定めが認められる趣旨は何か。", "a": "非公開会社では株主の関係は緊密であるから、株式ではなく株主に着目して異なる取扱いを認めても不都合はないからである。", "reason": "規定（109条2項の属人的定め）と趣旨を対応させた。", "basis": "PDF p.164（本編 p.161）。台帳要素 t021-e01、t021-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 164, "loc": "項目4 株主平等原則（109条1項）"}, {"id": "book-kigyoho-01-ch03-q5003", "ch": 3, "type": "規定→趣旨", "q": "株式は自由に譲渡できるのが原則である（会社法127条、株式譲渡自由の原則）。この原則が要請される趣旨を、必要性と許容性の両面から答えよ。", "a": "必要性の面からは、株主が有限責任（104条）しか負わない株式会社では会社財産の実質的払戻しに厳格な規制があるため（461条）、投下資本回収の方法として株式譲渡を認める必要がある。許容性の面からは、所有と経営が制度的に分離されている（326条1項）ため株主の個性は問題とならず、自由な交替を認めても影響がない。そこで株式譲渡自由の原則が要請される。", "reason": "規定（127条の原則）を提示し、台帳の趣旨（必要性・許容性）と結びつけた。", "basis": "PDF p.166（本編 p.163）。台帳要素 t025-e01、t025-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 166, "loc": "項目6 株式譲渡自由の原則（127条）"}, {"id": "book-kigyoho-01-ch03-q5004", "ch": 3, "type": "規定→趣旨", "q": "株式の譲渡制限には、法律による制限（権利株・株券発行前・自己株式取得・子会社による親会社株式取得）、定款による制限（107条1項1号、108条1項4号）、契約による制限の3類型がある。これらの制限を規定する条文を解釈する際の基本的視点（趣旨）は何か。", "a": "株式譲渡自由の原則（127条）は基本的には唯一の投下資本回収手段といえるので、自由譲渡性は可能な限り保障されなければならず、例外的に制限を規定する条文は、できるだけ最小限の制限になるように解釈しなければならない。", "reason": "規定側として譲渡制限の3類型（e01）を提示し、基本的視点（e02）と結びつけた。", "basis": "PDF p.166（本編 p.163）。台帳要素 t026-e01、t026-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 166, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5005", "ch": 3, "type": "規定→趣旨", "q": "株主となる権利（権利株）の譲渡は、成立後の株式会社に対抗することができない（35条、50条2項、63条2項、208条4項）。この譲渡制限の趣旨は何か。", "a": "設立手続または募集株式発行手続の混乱防止（会社の利益保護）である。", "reason": "規定（対抗不可の定め）と趣旨を対応させた。", "basis": "PDF p.167（本編 p.164）。台帳要素 t027-e01、t027-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 167, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5006", "ch": 3, "type": "規定→趣旨", "q": "会社法128条2項は「株券の発行前にした譲渡は、株券発行会社に対し、その効力を生じない」と定める。この制限の趣旨は何か。", "a": "株券発行事務の混乱防止のためである（会社の利益保護）。", "reason": "規定（128条2項の文言）と趣旨を対応させた。", "basis": "PDF p.168（本編 p.165）。台帳要素 t029-e01、t029-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 168, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5007", "ch": 3, "type": "規定→趣旨", "q": "定款で定める株式の譲渡制限では、譲渡に会社の承認を要し、承認機関は取締役会設置会社にあっては取締役会、株主総会の場合は普通決議による（139条）。この定款による譲渡制限の趣旨は何か。", "a": "会社にとって好ましくない者が株式取得によって対会社関係に入ってくることを防止するためである。", "reason": "規定側として承認機関の定め（e02）を提示し、趣旨（e01）と結びつけた。", "basis": "PDF p.170（本編 p.167）。台帳要素 t034-e02、t034-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 170, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5008", "ch": 3, "type": "規定→趣旨", "q": "会社が譲渡を承認せず自ら買い取る場合、買取の決議は株主総会の特別決議に限られ（140条2項、309条2項1号）、譲渡等承認請求者は議決権を有しない（140条3項）。買取の決議が特別決議に限られる趣旨は何か。", "a": "会社にとっては自己株式の取得であって弊害があるからである。", "reason": "規定（140条の手続）と趣旨を対応させた。", "basis": "PDF p.170（本編 p.167）。台帳要素 t035-e01、t035-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 170, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5009", "ch": 3, "type": "規定→趣旨", "q": "特定の株主からの自己株式の取得では、あらかじめ株主総会の特別決議で、156条1項の事項に併せて「特定の株主」に対してのみ158条の通知を行う旨を決定しなければならない（160条1項）。このように特別決議が要求される趣旨は何か。", "a": "株主間で不平等が生じるおそれがあるためである。また、会社が特定の株主から不当に高い価格で自己株式を取得することで他の株主が損失を被ったり（株主間の利益移転）、不当な目的で取得したりする（会社支配の不公正）危険性が高いためである。", "reason": "規定（160条1項の手続）と趣旨を対応させた。", "basis": "PDF p.176（本編 p.173）。台帳要素 t043-e02、t043-e03 の逐語引用に基づく。", "caution": "なお、売主追加請求（160条2項3項）の趣旨は、株主に平等に投下資本回収の機会を与えるためである（t043-e04）。", "articles": [], "page": 176, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5010", "ch": 3, "type": "規定→趣旨", "q": "会社法161条は、市場価格のある株式の取得については、売主追加請求権の規定（160条2項3項）を適用しないと定める。その趣旨は何か。", "a": "市場価格のある株式については他の株主は市場において株式を売却する機会を有するから要保護性がなく、また市場価格以下で取得する場合は他の株主を害するおそれがないからである。", "reason": "規定（161条の適用除外）と趣旨を対応させた。", "basis": "PDF p.177（本編 p.174）。台帳要素 t044-e01、t044-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 177, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5011", "ch": 3, "type": "規定→趣旨", "q": "会社法162条は、相続人等からの取得については、売主追加請求権の規定（160条2項3項）を適用しないと定める。その趣旨は何か。", "a": "非公開会社で、相続等により当該会社にとって好ましくない者が株主となった場合に、当該株主も株式を手放すことに異論がないときは、その状態を解消しやすくする必要があるからである。", "reason": "規定（162条の適用除外）と趣旨を対応させた。", "basis": "PDF p.178（本編 p.175）。台帳要素 t045-e01、t045-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 178, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5012", "ch": 3, "type": "規定→趣旨", "q": "会社法164条は、定款に定めがある場合、売主追加請求権（160条2項3項）を排除する。この排除が認められる趣旨は何か。", "a": "株主全員の同意を必要とする定款規定（164条2項）に基づくのであれば、会社が合意により特定の株主のみから自己株式を有償取得することを認めても、他の株主に不測の損害を与えるおそれは小さいからである。", "reason": "規定（164条の排除）と趣旨を対応させた。", "basis": "PDF p.178（本編 p.175）。台帳要素 t046-e01、t046-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 178, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5013", "ch": 3, "type": "規定→趣旨", "q": "会社法163条は、株主総会の普通決議（取締役会設置会社では取締役会決議）で子会社から自己株式を取得できるとし、157条〜160条の適用を排除する。この特則が設けられた趣旨は何か。", "a": "子会社は相当の時期に親会社株式を処分しなければならない（135条3項）が、その処分が容易でない場合もあるため、容易に親会社が子会社保有の親会社株式を取得することを可能にしたものである。", "reason": "規定（163条の特則）と趣旨を対応させた。", "basis": "PDF p.179（本編 p.176）。台帳要素 t047-e01、t047-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 179, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5014", "ch": 3, "type": "規定→趣旨", "q": "会社法135条1項は、子会社による親会社株式の取得を原則として禁止する。この原則禁止の趣旨は何か。", "a": "親子会社間の経済的一体性や支配・従属関係から、取得を自由に認めると親会社からの実質的な出資の払戻しになるおそれや、親会社の経営者の不正な支配がなされるおそれがあるためである。", "reason": "規定側として135条の構造（e02）を提示し、1項の趣旨（e03）と結びつけた。", "basis": "PDF p.188（本編 p.185）。台帳要素 t101-e02、t101-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 188, "loc": "項目9 子会社による親会社株式の原則取得禁止（135条）"}, {"id": "book-kigyoho-01-ch03-q5015", "ch": 3, "type": "規定→趣旨", "q": "子会社が適法に保有する親会社株式については、議決権を有しない（308条1項本文かっこ書）。議決権が否定される趣旨（理由）は何か。", "a": "親会社の支配の公正を害するおそれがあるためである。", "reason": "規定（議決権の否定）と趣旨を対応させた。", "basis": "PDF p.189（本編 p.186）。台帳要素 t102-e01、t102-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 189, "loc": "項目9 子会社による親会社株式の原則取得禁止（135条）"}, {"id": "book-kigyoho-01-ch03-q5016", "ch": 3, "type": "規定→趣旨", "q": "基準日制度（124条1項）では、一定の日（基準日）に株主名簿に記載・記録された株主を、その権利を行使することができる者として確定する（基準日後に株式を譲渡しても、株主総会では基準日株主が権利行使する）。この制度の趣旨は何か。", "a": "権利行使時における権利行使株主を一時に確定することを容易にするためである（会社の利益）。", "reason": "規定側として基準日制度の仕組み（図表要素e01の内容）を提示し、124条1項の趣旨（e02）と結びつけた。", "basis": "PDF p.190（本編 p.187）。台帳要素 t104-e01、t104-e02 の逐語引用に基づく。", "caution": "e01は時系図の要素であり、引用は図中ラベルの抽出順の記録である。", "articles": [], "page": 190, "loc": "項目10 株主名簿"}, {"id": "book-kigyoho-01-ch03-q5017", "ch": 3, "type": "規定→趣旨", "q": "株式の譲受人は、株主名簿の名義書換を受けない限り、会社に対して株主であることを対抗できない（130条、確定的効力）。それにもかかわらず、会社側から名義書換未了の譲受人を株主と認めて権利行使させることが許されるのは、株主名簿制度の趣旨からどう説明されるか。", "a": "株主名簿制度を設けた趣旨は会社の事務処理の便宜を図ることにある。とすれば、会社が自らこの利益を放棄して株式譲受人を株主として取り扱うことは認められてよいはずである。また、130条の文言は「会社に対抗することができない」となっており対抗要件にすぎないからである。", "reason": "規定（130条の確定的効力、e01）と株主名簿制度の趣旨（e02）を結びつけた。", "basis": "PDF p.192（本編 p.189）・PDF pp.192–193（本編 pp.189–190）。台帳要素 t107-e01、t107-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 193, "loc": "項目10 株主名簿"}, {"id": "book-kigyoho-01-ch03-q5018", "ch": 3, "type": "規定→趣旨", "q": "株式の消却は、取締役会決議（取締役会非設置会社では取締役の決定）で足り、株主総会決議は要求されない（178条）。株主総会決議まで要求されない趣旨は何か。", "a": "株式の消却の対象は自己株式のみであって（178条1項）、他の株主に不利益がないので、株主総会決議まで要求する必要がないからである。", "reason": "規定（178条の手続）と趣旨を対応させた。", "basis": "PDF p.198（本編 p.195）。台帳要素 t112-e02、t112-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 198, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5019", "ch": 3, "type": "規定→趣旨", "q": "株式の併合をしようとするときは、その都度、株主総会の決議によって併合の割合等を定めなければならず（180条2項）、その決議は特別決議である。特別決議が要求される趣旨は何か。", "a": "株式の併合は、併合割合如何によっては端数が生じたり、小さい単位で株式を譲渡する利益を失われる等、株主に不利益のおそれがあるからである。", "reason": "規定（180条2項の手続）と趣旨を対応させた。", "basis": "PDF p.198（本編 p.195）・PDF p.199（本編 p.196）。台帳要素 t113-e03、t113-e05 の逐語引用に基づく。", "caution": "", "articles": [], "page": 199, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5020", "ch": 3, "type": "規定→趣旨", "q": "株式の分割は、株主総会の普通決議または取締役会決議で行うことができ、株主総会の特別決議は要求されない（183条2項）。特別決議が要求されない趣旨は何か。", "a": "株式分割は、基本的には既存株主に不利益を与えないので、株主総会特別決議は要求されていない。", "reason": "規定（183条2項の手続）と趣旨を対応させた。", "basis": "PDF p.200（本編 p.197）。台帳要素 t115-e02、t115-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 200, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5021", "ch": 3, "type": "規定→趣旨", "q": "会社法184条2項は、株式分割の際に、発行可能株式総数を分割割合の範囲内で、株主総会の決議によらないで増加することを認める（本来、発行可能株式総数の変更は定款変更として株主総会の特別決議が必要である）。この例外が認められる趣旨は何か。", "a": "株式分割と同時に、発行可能株式総数を分割割合の範囲内で増加しても、既存株主の支配比率に不利益を与えないからである。", "reason": "規定側として原則（定款変更＝特別決議）と184条2項の例外（e04）を提示し、趣旨（e05）と結びつけた。", "basis": "PDF p.201（本編 p.198）。台帳要素 t116-e04、t116-e05 の逐語引用に基づく。", "caution": "", "articles": [], "page": 201, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5022", "ch": 3, "type": "規定→趣旨", "q": "株式無償割当ての手続について、会社法186条3項は、定款に別段の定めがある場合は株主総会（取締役会設置会社にあっては取締役会）の決議によらないことができる旨を定める。この定めで足りる趣旨は何か。", "a": "株主割当てによって、基本的には既存株主に不利益を与えないからである。", "reason": "規定（186条3項）と趣旨を対応させた。", "basis": "PDF p.202（本編 p.199）。台帳要素 t117-e02、t117-e03 の逐語引用に基づく。", "caution": "台帳注記のとおり、原文の表記は「株主割当てによって」である。", "articles": [], "page": 202, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5023", "ch": 3, "type": "規定→趣旨", "q": "単元株制度の採用および単元株式数の増加には、原則として定款変更のための株主総会の特別決議が必要である（188条1項、466条、309条2項11号）。特別決議が要求される趣旨は何か。", "a": "単元株制度の採用及び単元株式数の増加により、議決権を失う株主が出てくる可能性もあるなど、既存株主に不利益のおそれがあるからである。", "reason": "規定側として手続の表（e02）を提示し、趣旨（e04）と結びつけた。", "basis": "PDF p.203（本編 p.200）。台帳要素 t118-e02、t118-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 203, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5024", "ch": 3, "type": "規定→趣旨", "q": "特別支配株主の株式等売渡請求（179条〜）では、株主総会の決議を経ることなく、対象会社の承認（取締役会決議）等の手続によって少数株主の株式を取得し、キャッシュ・アウトを行うことができる。この制度が設けられた趣旨は何か。", "a": "株主総会の決議を経ずに、キャッシュ・アウトを行う要請に応えるためである。", "reason": "規定側として売渡請求の手続（e03）を提示し、趣旨（e02）と結びつけた。cf.金銭を対価とする略式株式交換は、税制上の理由から従来あまり利用されてこなかった。", "basis": "PDF p.209（本編 p.206）。台帳要素 t123-e03、t123-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 209, "loc": "項目13 キャッシュ・アウト"}, {"id": "book-kigyoho-01-ch03-q5025", "ch": 3, "type": "条文構造", "q": "会社の承認を欠く譲渡制限株式の譲渡の効力について、原則と、例外的に会社に対する関係でも有効となる場合を、構造的に整理して答えよ。", "a": "原則として、譲渡は譲渡当事者間では有効であるが、会社に対する関係では無効である。例外的に、①一人株主が譲渡する場合は他の株主の利益保護を考慮する必要はないから、②譲渡株主以外の全株主が譲渡に同意している場合は譲渡株主以外の株主の利益が害されることはないから、いずれも会社の承認がなくても会社に対する関係でも譲渡は有効である。", "reason": "原則（t036-e02）と例外2類型（t037-e02一人会社、t038-e02全株主同意）を、制度趣旨（好ましくない者の取得防止を通じた他の株主の利益保護）との関係で構造化した。", "basis": "PDF p.171（本編 p.168）・PDF p.172（本編 p.169）。台帳要素 t036-e02、t037-e02、t038-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 171, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5026", "ch": 3, "type": "条文構造", "q": "特定の株主からの自己株式の取得における売主追加請求（160条2項3項）の手続が不要となる（適用が排除される）場合を、全て挙げよ。", "a": "①市場価格のある株式の取得の場合（161条）、②相続人等からの取得の場合（162条）、③定款に売主追加請求を排除する定めがある場合（164条）の3つの場合は、売主追加請求の手続（160条2項3項）は不要である。なお、164条の場合は売主追加請求権が排除されるだけである。", "reason": "160条2項3項を原則とし、161条・162条・164条をその適用除外として構造化した（t043-e10の整理に基づく）。", "basis": "PDF p.177（本編 p.174）・PDF p.178（本編 p.175）。台帳要素 t043-e10、t044-e01、t045-e01、t046-e01 の逐語引用に基づく。", "caution": "", "articles": [], "page": 177, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5027", "ch": 3, "type": "条文構造", "q": "株式の消却・併合・分割・無償割当てについて、それぞれの決定機関（決議の種類）を対比して答えよ。", "a": "消却は取締役会決議（取締役会非設置会社では取締役の決定）による（178条2項）。併合は株主総会の特別決議による（180条2項、309条2項4号）。分割は株主総会の普通決議または取締役会決議による（183条2項）。無償割当ては株主総会（取締役会設置会社にあっては取締役会）の決議によるが、定款に別段の定めがある場合はこの限りでない（186条3項）。", "reason": "4つの株式変動行為について、決定機関の重さの構造を横断的に対比した。", "basis": "PDF p.198（本編 p.195）・PDF p.200（本編 p.197）・PDF p.202（本編 p.199）。台帳要素 t112-e02、t113-e03、t115-e02、t117-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 198, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5028", "ch": 3, "type": "何条", "q": "「株式会社は、株主を、その有する株式の内容及び数に応じて、平等に取り扱わなければならない。」これは会社法何条の定めか。", "a": "109条1項（株主平等原則）である。", "reason": "条文の文言から条番号を識別する問題。", "basis": "PDF p.162（本編 p.159）", "caution": "", "articles": [], "page": 162, "loc": "項目4 株主平等原則（109条1項）"}, {"id": "book-kigyoho-01-ch03-q5029", "ch": 3, "type": "何条", "q": "「株券の発行前にした譲渡は、株券発行会社に対し、その効力を生じない。」これは会社法何条の定めか。", "a": "128条2項である。", "reason": "条文の文言から条番号を識別する問題。", "basis": "PDF p.168（本編 p.165）", "caution": "", "articles": [], "page": 168, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5030", "ch": 3, "type": "何条", "q": "「前項の規定にかかわらず、株式会社は、自己株式については、議決権を有しない。」これは会社法何条の定めか。", "a": "308条2項", "reason": "自己株式には議決権・配当・残余財産のいずれの権利も認められないという構造（t053）の中で、議決権を否定する文言から条番号を識別する問題。", "basis": "PDF p.184（本編 p.181）", "caution": "", "articles": [], "page": 184, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5031", "ch": 3, "type": "何条", "q": "「株式会社は、その株主（当該株式会社を除く。）に対し、剰余金の配当をすることができる。」これは会社法何条の定めか。", "a": "453条である。", "reason": "条文の文言（「当該株式会社を除く」という自己株式の除外）から条番号を識別する問題。", "basis": "PDF p.184（本編 p.181）", "caution": "", "articles": [], "page": 184, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5032", "ch": 3, "type": "何条", "q": "基準日株主が行使することができる権利が株主総会又は種類株主総会における議決権である場合、会社は、基準日後に株式を取得した者の全部又は一部を権利行使者と定めることができる（ただし、基準日株主の権利を害することができない）。これは会社法何条の定めか。", "a": "124条4項である。", "reason": "基準日制度の特則的な定めの内容から条番号を識別する問題。", "basis": "PDF p.190（本編 p.187）", "caution": "", "articles": [], "page": 190, "loc": "項目10 株主名簿"}, {"id": "book-kigyoho-01-ch03-q5033", "ch": 3, "type": "何条", "q": "株券の占有者は、株式についての権利を適法に有するものと推定される（株券の資格授与的効力）。これは会社法何条の定めか。", "a": "131条1項である。", "reason": "Ⅱ重要条文の「株券の資格授与的効力―131条1項」（t125-e01）と、t106-e04における「株券の占有者」（131条1項）の推定の記載に基づく。", "basis": "Ⅱ重要条文リスト（PDF p.211（本編 p.208））・PDF p.191（本編 p.188）。台帳要素 t125-e01、t106-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―"}, {"id": "book-kigyoho-01-ch03-q5034", "ch": 3, "type": "何条", "q": "子会社は、その親会社である株式会社の株式を原則として取得することができず、例外的に取得した場合には「相当の時期」に処分しなければならない。これは会社法何条の定めか。", "a": "135条である（1項：原則取得禁止、2項：例外許容、3項：保有した場合は「相当の時期」に処分）。", "reason": "原則・例外・処分義務という定めの構造から条番号を識別する問題。", "basis": "PDF p.188（本編 p.185）", "caution": "", "articles": [], "page": 188, "loc": "項目9 子会社による親会社株式の原則取得禁止（135条）"}, {"id": "book-kigyoho-01-ch03-q5035", "ch": 3, "type": "何条", "q": "譲渡制限株式の譲渡についての会社の承認機関を定め、取締役会設置会社にあっては取締役会決議、株主総会の場合は普通決議によるとする（定款に別段の定めも可能）のは、会社法何条か。", "a": "139条である。", "reason": "承認機関という定めの内容から条番号を識別する問題。", "basis": "PDF p.170（本編 p.167）", "caution": "", "articles": [], "page": 170, "loc": "項目7 株式の譲渡制限"}, {"id": "book-kigyoho-01-ch03-q5036", "ch": 3, "type": "何条", "q": "株式会社は、相続その他の一般承継により譲渡制限株式を取得した者に対し、当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。これは会社法何条の定めか。", "a": "174条である。", "reason": "条文の文言から条番号を識別する問題。", "basis": "PDF p.181（本編 p.178）", "caution": "", "articles": [], "page": 181, "loc": "項目8 自己株式の取得"}, {"id": "book-kigyoho-01-ch03-q5037", "ch": 3, "type": "何条", "q": "株式分割をする場合に、発行可能株式総数を、株主総会の決議によらないで、分割割合の範囲内で増加させることができる特例は、会社法何条の定めか。", "a": "184条2項", "reason": "発行可能株式総数の増加は本来定款変更（466条・特別決議）を要するところ、その例外を定める条文を識別する問題。根拠はt116-e04の整理に基づく。", "basis": "PDF p.201（本編 p.198）", "caution": "", "articles": [], "page": 201, "loc": "項目12 株式の消却・併合・分割・無償割当て、単元株"}, {"id": "book-kigyoho-01-ch03-q5038", "ch": 3, "type": "何条", "q": "株式会社が定款を変更するには、株主総会の決議によらなければならないとする、定款変更の原則を定めるのは会社法何条か。", "a": "466条", "reason": "Ⅱ重要条文の「定款変更（原則）―466条、309条2項11号」の対応に基づき、原則規定そのものを識別する問題。", "basis": "Ⅱ重要条文リスト（PDF p.211（本編 p.208））", "caution": "", "articles": [], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―"}, {"id": "book-kigyoho-01-ch03-q5039", "ch": 3, "type": "何条", "q": "種類株式については、その内容として1項各号に掲げる事項を、また定款で定める事項として2項各号に掲げる事項を、それぞれ定款に記載するものとされている。これは会社法何条の定めか。", "a": "108条である（種類株式の内容および定款記載事項を定める）。", "reason": "台帳要素 t002-e01 は、種類株式について108条1項各号・108条2項各号の事項を定款に記載すると整理している。", "basis": "PDF p.159（本編 p.156）。台帳要素 t002-e01の逐語引用に基づく。", "caution": "株式の内容についての特別の定めは107条であり、種類株式についての定めは108条である。", "articles": ["108条"], "page": 159, "loc": "2 種類株式（108条）／種類株式と定款記載事項（108条）"}, {"id": "book-kigyoho-01-ch03-q5040", "ch": 3, "type": "何条", "q": "ある種類株式の種類株主に損害を及ぼすおそれがある場合には、その種類株主総会の決議を要する。この決議を要する根拠規定と、決議の種類（特別決議）を定める規定は、それぞれ会社法何条か。", "a": "決議を要する根拠は322条1項1号であり、決議の種類は324条2項4号（特別決議）である。", "reason": "台帳要素 t008-e01 の整理どおり、損害を及ぼすおそれがある場合は種類株主総会の特別決議（322条1項1号、324条2項4号）が手続に加わる。", "basis": "PDF p.160（本編 p.157）。台帳要素 t008-e01の逐語引用に基づく。", "caution": "111条は322条の特則であり、111条が適用される場面では111条が優先する。", "articles": ["322条1項1号", "324条2項4号"], "page": 160, "loc": "2 種類株式（108条）／種類株主に損害を及ぼすおそれがある場合の種類株主総会決議（322条）と111条の特則関係"}, {"id": "book-kigyoho-01-ch03-q5041", "ch": 3, "type": "何条", "q": "株式の内容についての特別の定めについては、1項各号に掲げる事項および2項各号に掲げる事項を定款に記載するものとされている。これは会社法何条の定めか。", "a": "107条である（株式の内容についての特別の定め）。", "reason": "台帳要素 t010-e01 は、株式の内容についての特別の定めは107条1項各号・107条2項各号の事項を定款に記載すると整理している。", "basis": "PDF p.161（本編 p.158）。台帳要素 t010-e01の逐語引用に基づく。", "caution": "種類株式についての定款記載事項は108条である。", "articles": ["107条"], "page": 161, "loc": "3 株式の内容についての特別の定め（107条）／株式の内容についての特別の定めと定款記載（107条）"}, {"id": "book-kigyoho-01-ch03-q5042", "ch": 3, "type": "何条", "q": "既存株式の全部を取得条項付株式に変更する定款変更には、株主全員の同意が必要とされる（この場合、反対株主の株式買取請求権はない）。全員の同意を要する根拠は会社法何条か。", "a": "110条である。", "reason": "台帳要素 t013-e01 の表は、既存株式の全部を取得条項付株式に変更するには株主全員の同意（110条）が必要で、株式買取請求権はないと整理している。", "basis": "PDF p.161（本編 p.158）。台帳要素 t013-e01の逐語引用に基づく。", "caution": "定款変更の原則は株主総会の特別決議（466条、309条2項11号）であり、110条はその特則である。", "articles": ["110条"], "page": 161, "loc": "3 株式の内容についての特別の定め（107条）／既存株式の全部を取得条項付株式に変更する定款変更"}, {"id": "book-kigyoho-01-ch03-q5043", "ch": 3, "type": "何条", "q": "非公開会社では、株主ごとに異なる取扱いをする属人的な権利の定め（例：1株主1議決権）が認められる。これは会社法何条の定めか。", "a": "109条2項である。", "reason": "台帳要素 t021-e01 は、非公開会社では属人的な権利の定めが109条2項で認められると整理している。", "basis": "PDF p.164（本編 p.161）。台帳要素 t021-e01の逐語引用に基づく。", "caution": "株主平等原則そのものは109条1項である。", "articles": ["109条2項"], "page": 164, "loc": "4 株主平等原則（109条1項）／非公開会社における属人的な権利の定め（109条2項）"}, {"id": "book-kigyoho-01-ch03-q5044", "ch": 3, "type": "何条", "q": "株券に関する効力のうち、株券の善意取得を定めるのは会社法何条か。", "a": "131条2項である。なお、資格授与的効力は131条1項であり、ほかに免責的効力がある。", "reason": "台帳要素 t024-e01 は、株券に関する効力として資格授与的効力（131条1項）、免責的効力、善意取得（131条2項）を整理している。", "basis": "PDF p.165（本編 p.162）。台帳要素 t024-e01の逐語引用に基づく。", "caution": "資格授与的効力（131条1項）と善意取得（131条2項）を混同しないこと。", "articles": ["131条2項"], "page": 165, "loc": "5 株券／株券に関する効力（資格授与的効力・免責的効力・善意取得）"}, {"id": "book-kigyoho-01-ch03-q5045", "ch": 3, "type": "何条", "q": "株式譲渡自由の原則を定めるのは会社法何条か。", "a": "127条である。", "reason": "台帳要素 t025-e01 は、株式譲渡自由の原則は127条に定められると整理している。", "basis": "PDF p.166（本編 p.163）。台帳要素 t025-e01の逐語引用に基づく。", "caution": "", "articles": ["127条"], "page": 166, "loc": "6 株式譲渡自由の原則（127条）／株式譲渡自由の原則（127条）とその趣旨"}, {"id": "book-kigyoho-01-ch03-q5046", "ch": 3, "type": "何条", "q": "株主となる権利（権利株）の譲渡が成立後の株式会社に対抗できないことを定める条文は、対象者によって異なる。出資の履行「後」の発起人について定めるのは会社法何条か。", "a": "50条2項である。", "reason": "台帳要素 t027-e02 の対応表どおり、35条は出資の履行前の発起人、50条2項は出資の履行後の発起人、63条2項は設立時募集株式の引受人、208条4項は募集株式の引受人について定める。", "basis": "PDF p.167（本編 p.164）。台帳要素 t027-e02の逐語引用に基づく。", "caution": "35条（出資の履行前）と50条2項（出資の履行後）の区別に注意。", "articles": ["50条2項"], "page": 167, "loc": "7 株式の譲渡制限／権利株の譲渡制限（35条・50条2項・63条2項・208条4項）"}, {"id": "book-kigyoho-01-ch03-q5047", "ch": 3, "type": "何条", "q": "会社が譲渡制限株式の譲渡を承認しない場合に、会社が自ら当該株式を買い取る手続を定めるのは会社法何条か。", "a": "140条（1項〜3項）である。140条2項の株主総会の決議は特別決議（309条2項1号）であり、譲渡等承認請求者（自己株式の売主）は議決権を有しない（140条3項）。", "reason": "台帳要素 t035-e01 は、会社が買い取る場合の手続を140条1項〜3項とし、2項の決議が特別決議であること、売主に議決権がないことを整理している。", "basis": "PDF p.170（本編 p.167）。台帳要素 t035-e01の逐語引用に基づく。", "caution": "", "articles": ["140条"], "page": 170, "loc": "7 株式の譲渡制限／会社が譲渡を承認しない場合の手続（会社による買取・指定買取人の指定）"}, {"id": "book-kigyoho-01-ch03-q5048", "ch": 3, "type": "条文構造", "q": "会社法140条は、会社が譲渡を承認しない場合の手続について、1項〜3項と4項・5項でどのように規律を分けているか。", "a": "1項〜3項は会社が自ら買い取る場合の手続であり、4項・5項は指定買取人を指定する場合の手続である。指定は、株主総会（取締役会設置会社にあっては取締役会）の決議または定款に別段の定めによるものとし、140条5項の株主総会の決議は特別決議である。", "reason": "台帳要素 t035-e02 は、指定買取人の指定を140条4項5項とし、決議機関と5項の決議の種類を整理している（1項〜3項の会社買取部分は t035-e01）。", "basis": "PDF p.170（本編 p.167）。台帳要素 t035-e02の逐語引用に基づく。", "caution": "", "articles": ["140条"], "page": 170, "loc": "7 株式の譲渡制限／会社が譲渡を承認しない場合の手続（会社による買取・指定買取人の指定）"}, {"id": "book-kigyoho-01-ch03-q5049", "ch": 3, "type": "何条", "q": "自己株式の売主に議決権がないことを定める条文は3つある。すべて挙げよ。", "a": "175条2項、140条3項、160条4項である。", "reason": "台帳要素 t035-e04 は「（重要）議決権がない自己株式の売主3つ」として、175条2項、140条3項、160条4項を整理している。", "basis": "PDF p.170（本編 p.167）。台帳要素 t035-e04の逐語引用に基づく。", "caution": "いずれも自己株式の取得の相手方（売主）の議決権を排除する定めである。", "articles": ["175条2項", "140条3項", "160条4項"], "page": 170, "loc": "7 株式の譲渡制限／会社が譲渡を承認しない場合の手続（会社による買取・指定買取人の指定）"}, {"id": "book-kigyoho-01-ch03-q5050", "ch": 3, "type": "何条", "q": "株式会社が自己株式を取得することができる場合（取得事由）を列挙するのは会社法何条か。", "a": "155条である。各取得事由ごとに、取得手続規制と財源規制が個別の条文で定められている。", "reason": "台帳要素 t041-e01 の一覧表は「自己株式の取得が可能な場合（155条）」として、取得事由ごとの手続規制・財源規制を対照している。", "basis": "PDF p.174（本編 p.171）。台帳要素 t041-e01の逐語引用に基づく。", "caution": "155条は取得事由の列挙であり、手続・財源の内容そのものは個別の条文による。", "articles": ["155条"], "page": 174, "loc": "8 自己株式の取得／自己株式の取得が可能な場合の一覧（155条）"}, {"id": "book-kigyoho-01-ch03-q5051", "ch": 3, "type": "何条", "q": "株主との合意による有償取得の原則的取得方法では、まず「あらかじめ」株主総会の普通決議によって株式取得事項（取得枠）を決定する。この取得枠の決定を定めるのは会社法何条か。", "a": "156条である。なお、その都度の取得の決定は157条、すべての株主への通知・公告による売却の勧誘は158条、株主の申込みによる売買契約の成立は159条が定める。", "reason": "台帳要素 t042-e01 は原則的取得方法（156条〜159条）の流れを、①156条（取得枠の決定）②157条（取得の決定）③158条（通知・公告）④159条（申込み）と整理している。", "basis": "PDF p.175（本編 p.172）。台帳要素 t042-e01の逐語引用に基づく。", "caution": "", "articles": ["156条"], "page": 175, "loc": "8 自己株式の取得／株主との合意による有償取得の原則的取得方法の手続（156条〜159条）"}, {"id": "book-kigyoho-01-ch03-q5052", "ch": 3, "type": "規定→趣旨", "q": "特定の株主からの自己株式の取得では、株主は、「特定の株主に自己をも含めたもの」を株主総会の議案にすることを会社に請求できる（売主追加請求、160条2項3項）。この仕組みが設けられた趣旨は何か。", "a": "株主に平等に投下資本回収の機会を与えるためである。", "reason": "台帳要素 t043-e04 は、160条2項3項の趣旨を「株主に平等に投下資本回収の機会を与えるため」と明示している。", "basis": "PDF p.176（本編 p.173）。台帳要素 t043-e04の逐語引用に基づく。", "caution": "160条1項（特別決議）の趣旨（株主間の不平等の防止等）とは別の、2項3項固有の趣旨である。", "articles": ["160条2項", "160条3項"], "page": 176, "loc": "8 自己株式の取得／特定の株主からの取得の手続規制（160条）"}, {"id": "book-kigyoho-01-ch03-q5053", "ch": 3, "type": "規定→趣旨", "q": "特定の株主からの自己株式の取得の決議では、「特定の株主」（売主追加請求権の行使者を含む）は議決権を行使することができない（160条4項）。この趣旨は何か。", "a": "決議の公平を保つためである。", "reason": "台帳要素 t043-e05 は、160条4項の趣旨を「決議の公平を保つため」と明示している。", "basis": "PDF p.177（本編 p.174）。台帳要素 t043-e05の逐語引用に基づく。", "caution": "", "articles": ["160条4項"], "page": 177, "loc": "8 自己株式の取得／特定の株主からの取得の手続規制（160条）"}, {"id": "book-kigyoho-01-ch03-q5054", "ch": 3, "type": "条文構造", "q": "特定の株主からの自己株式の取得を規律する160条は、1項から4項まででどのように役割が分かれているか。", "a": "1項は、あらかじめ株主総会の特別決議で、156条1項の事項に併せて「特定の株主」に対してのみ158条の通知を行う旨を決定すること（「特定の株主」の氏名・名称も決議事項と解されている）、2項は株主に売主追加請求ができる旨を通知すること、3項は株主による売主追加請求、4項は「特定の株主」（売主追加請求権の行使者を含む）の議決権の排除である。", "reason": "台帳要素 t043-e02 は手続①の内容として、160条1項の決定事項、2項の通知、3項の売主追加請求、4項の議決権排除を整理している。なお、特定の株主への通知・売却勧誘（5項）と159条の申込みは t043-e08 の範囲である。", "basis": "PDF p.176（本編 p.173）。台帳要素 t043-e02の逐語引用に基づく。", "caution": "", "articles": ["160条"], "page": 176, "loc": "8 自己株式の取得／特定の株主からの取得の手続規制（160条）"}, {"id": "book-kigyoho-01-ch03-q5055", "ch": 3, "type": "何条", "q": "子会社から自己株式を取得する特則を定めるのは会社法何条か。", "a": "163条である。株主総会の普通決議（取締役会設置会社では取締役会決議）で取得でき、163条は156条1項の適用を修正し、157条〜160条の適用を排除する。", "reason": "台帳要素 t047-e01 は、163条の決議機関と、①156条1項の適用の修正、②157条〜160条の適用排除を整理している。", "basis": "PDF p.179（本編 p.176）。台帳要素 t047-e01の逐語引用に基づく。", "caution": "", "articles": ["163条"], "page": 179, "loc": "8 自己株式の取得／子会社からの株式の取得（163条）"}, {"id": "book-kigyoho-01-ch03-q5056", "ch": 3, "type": "条文構造", "q": "市場取引等による自己株式の取得を定める165条は、1項と2項・3項で、156条〜160条の適用関係をどのように定めているか。", "a": "1項は157条〜160条の適用を排除し、2項・3項は156条1項の適用を修正する。その結果、株主総会の普通決議または定款に定めれば取締役会決議（取締役会設置会社の場合）で取得できる。", "reason": "台帳要素 t048-e01 は、165条1項（157条〜160条の適用排除）、2項3項（156条1項の適用の修正）と整理し、普通決議で足りるのは165条1項が160条1項を除外しているためとする。", "basis": "PDF p.179（本編 p.176）。台帳要素 t048-e01の逐語引用に基づく。", "caution": "", "articles": ["165条"], "page": 179, "loc": "8 自己株式の取得／市場取引等による取得（165条）"}, {"id": "book-kigyoho-01-ch03-q5057", "ch": 3, "type": "規定→趣旨", "q": "株主との合意による有償取得などの自己株式の有償取得には、財源規制（分配可能額規制、461条1項2号3号）が課される。その趣旨は何か。", "a": "自己株式の有償取得は、実質的には株主への会社財産の分配であるから、株主が有限責任（104条）しか負わない株式会社においては、会社債権者を害するおそれがあるためである。", "reason": "台帳要素 t049-e01 は、財源規制の趣旨を、実質的な会社財産の分配であることと有限責任の下での債権者保護の観点から明示している。", "basis": "PDF p.179（本編 p.176）。台帳要素 t049-e01の逐語引用に基づく。", "caution": "", "articles": ["461条1項2号", "461条1項3号"], "page": 179, "loc": "8 自己株式の取得／財源規制（分配可能額規制）の趣旨（461条1項2号3号）"}, {"id": "book-kigyoho-01-ch03-q5058", "ch": 3, "type": "条文構造", "q": "財源規制（461条）違反の場合の責任を定める462条は、1項・2項・3項でどのように規律が分かれているか。", "a": "1項は責任を負う主体（3者）とその効果、2項はそのうち2者（B・C）の（立証責任が転換された）過失責任、3項は総株主の同意による免除（B・Cに関して認められる）である。", "reason": "台帳要素 t052-e01 は「462条はしっかり読めるように」として、1項（主体3者と効果）、2項（B・Cの過失責任）、3項（総株主の同意による免除）の構造を整理している。", "basis": "PDF p.183（本編 p.180）。台帳要素 t052-e01の逐語引用に基づく。", "caution": "", "articles": ["462条"], "page": 183, "loc": "8 自己株式の取得／財源規制（461条）と違反責任（462条）・自己株式の保有・消却・処分"}, {"id": "book-kigyoho-01-ch03-q5059", "ch": 3, "type": "何条", "q": "「第一項第二号に掲げる事項（＝残余財産の割当てに関する事項）についての定めは、株主（当該清算株式会社及び前項第一号の種類の株式の株主を除く。）の有する株式の数……に応じて残余財産を割り当てることを内容とするものでなければならない。」これは会社法何条の定めか。", "a": "504条3項である。これにより、自己株式については残余財産分配請求権も認められない。", "reason": "台帳要素 t053-e03 は残余財産分配請求権について504条3項の文言を引用し、t053-e04 は自己株式には自益権・共益権とも認められないと結論づけている。", "basis": "PDF p.184（本編 p.181）。台帳要素 t053-e03の逐語引用に基づく。", "caution": "議決権の308条2項、剰余金配当の453条と併せて、自己株式に権利が認められない根拠として整理する。", "articles": ["504条3項"], "page": 184, "loc": "8 自己株式の取得／適法な自己株式の法律上の地位（議決権・配当・残余財産）"}, {"id": "book-kigyoho-01-ch03-q5060", "ch": 3, "type": "条文構造", "q": "子会社による親会社株式の取得を規律する135条は、1項・2項・3項でどのように規律が分かれているか。", "a": "1項は子会社による親会社株式の取得の原則禁止、2項はやむを得ない取得の場合の例外許容、3項は取得した場合に「相当の時期」に処分すべきことである。", "reason": "台帳要素 t101-e02 は「135条の構造」として、1項で原則取得禁止、2項で例外許容、3項で相当の時期の処分と整理している。", "basis": "PDF p.188（本編 p.185）。台帳要素 t101-e02の逐語引用に基づく。", "caution": "親会社・子会社の定義は2条3号4号である。また、親会社が子会社保有の親会社株式を取得する特則として163条がある。", "articles": ["135条"], "page": 188, "loc": "9 子会社による親会社株式の原則取得禁止（135条）／子会社による親会社株式の取得禁止・例外・処分（135条）"}, {"id": "book-kigyoho-01-ch03-q5061", "ch": 3, "type": "何条", "q": "子会社は、保有する親会社株式については議決権を有しない。これは会社法308条のどこに定められているか。", "a": "308条1項本文のかっこ書である。", "reason": "台帳要素 t102-e01 は、子会社は保有する親会社株式について議決権を有しないことを308条1項本文かっこ書に基づくと整理している。", "basis": "PDF p.189（本編 p.186）。台帳要素 t102-e01の逐語引用に基づく。", "caution": "自己株式について議決権を有しないことは308条2項であり、混同しないこと。", "articles": ["308条1項本文かっこ書"], "page": 189, "loc": "9 子会社による親会社株式の原則取得禁止（135条）／（論点）子会社が適法に保有している親会社株式の法律上の地位"}, {"id": "book-kigyoho-01-ch03-q5062", "ch": 3, "type": "何条", "q": "名義書換の効力のうち、確定的効力（株式の譲受人が会社に対して株主であることを対抗できる効力）の根拠は会社法何条か。", "a": "130条である。名義書換の効力には、このほか資格授与的効力と免責的効力がある。", "reason": "台帳要素 t105-e01 は名義書換の効力として、①確定的効力（会社への対抗力）（130条）②資格授与的効力③免責的効力を整理している。", "basis": "PDF p.191（本編 p.188）。台帳要素 t105-e01の逐語引用に基づく。", "caution": "", "articles": ["130条"], "page": 191, "loc": "10 株主名簿／名義書換の効力（確定的効力・資格授与的効力・免責的効力）"}, {"id": "book-kigyoho-01-ch03-q5063", "ch": 3, "type": "何条", "q": "「株式会社は、第百九十九条第一項の募集において、株主に株式の割当てを受ける権利を与えることができる。」これは会社法何条の定めか。", "a": "202条1項である。「与えることができる」にとどまるため、株式の割当てを受ける権利は株主にとって法律上当然の権利ではない。", "reason": "台帳要素 t110-e02 は202条1項の文言を引用し、会社が与えても与えなくてもよいので株主からみたら「権利」ではないと整理している。", "basis": "PDF p.196（本編 p.193）。台帳要素 t110-e02の逐語引用に基づく。", "caution": "", "articles": ["202条1項"], "page": 196, "loc": "10 株主名簿／狭義の失念株（株主割当てで募集株式を発行した場合）"}, {"id": "book-kigyoho-01-ch03-q5064", "ch": 3, "type": "条文構造", "q": "社債、株式等の振替に関する法律（振替法）第七章「株式の振替」は、節と条文範囲でどのように構成されているか。", "a": "第一節「通則」（第百二十八条）、第二節「振替口座簿」（第百二十九条―第百三十九条）、第三節「振替の効果等」（第百四十条―第百四十九条）、第四節「会社法等の特例」（第百五十条―第百六十一条）、第五節「雑則」（第百六十二条）である。", "reason": "台帳要素 t111-e02 は振替法第七章の構成を、節名と条文範囲で整理している。", "basis": "PDF p.197（本編 p.194）。台帳要素 t111-e02の逐語引用に基づく。", "caution": "", "articles": ["振替法第七章"], "page": 197, "loc": "11 株式振替制度／株式振替制度の概要（振替法）"}, {"id": "book-kigyoho-01-ch03-q5065", "ch": 3, "type": "何条", "q": "振替株式の譲渡は、振替の申請により、譲受人がその口座における保有欄に当該譲渡に係る数の増加の記載又は記録を受けなければ、その効力を生じない。これは何法何条の定めか。", "a": "社債、株式等の振替に関する法律（振替法）140条である。", "reason": "台帳要素 t111-e03 は、振替法140条（振替株式の譲渡）の文言を引用している。", "basis": "PDF p.197（本編 p.194）。台帳要素 t111-e03の逐語引用に基づく。", "caution": "会社法ではなく振替法の定めである点に注意。", "articles": ["振替法140条"], "page": 197, "loc": "11 株式振替制度／株式振替制度の概要（振替法）"}, {"id": "book-kigyoho-01-ch03-q5066", "ch": 3, "type": "何条", "q": "株式の消却は自己株式のみ可能であり、その手続は取締役会決議（取締役会非設置会社では取締役の決定）による。これは会社法何条の定めか。", "a": "178条である（1項で自己株式のみ消却可能、2項で取締役会決議）。", "reason": "台帳要素 t112-e02 は、消却の手続（178条2項）と、消却できるのは自己株式のみであること（178条1項）を整理している。", "basis": "PDF p.198（本編 p.195）。台帳要素 t112-e02の逐語引用に基づく。", "caution": "", "articles": ["178条"], "page": 198, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／株式の消却（178条）"}, {"id": "book-kigyoho-01-ch03-q5067", "ch": 3, "type": "何条", "q": "株式の併合・分割・無償割当て等によって1株未満の端数が生じる場合、その端数の合計数に相当する株式を売却し（原則として競売の方法で）、売却代金を株主に交付する。この端数処理を定めるのは会社法何条か。", "a": "235条である。", "reason": "台帳要素 t113-e06 は、端数の処理として235条（端数合計数に相当する株式の売却と売却代金の交付）を整理している。", "basis": "PDF p.199（本編 p.196）。台帳要素 t113-e06の逐語引用に基づく。", "caution": "", "articles": ["235条"], "page": 199, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／株式の併合（180条～）"}, {"id": "book-kigyoho-01-ch03-q5068", "ch": 3, "type": "何条", "q": "株式の分割は、株主総会の普通決議または取締役会決議（取締役会設置会社）によって行う。これは会社法何条の定めか。", "a": "183条2項である。", "reason": "台帳要素 t115-e02 は、株式分割の手続を株主総会の普通決議または取締役会決議（183条2項）と整理している。", "basis": "PDF p.200（本編 p.197）。台帳要素 t115-e02の逐語引用に基づく。", "caution": "", "articles": ["183条2項"], "page": 200, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／株式の分割（183条～）"}, {"id": "book-kigyoho-01-ch03-q5069", "ch": 3, "type": "条文構造", "q": "発行可能株式総数の増加に伴う定款変更について、184条2項は、定款変更の原則（466条）との関係でどのような位置づけの規定か。", "a": "発行可能株式総数は定款に記載しなければならず（37条1項）、その変更は本来、466条により株主総会の特別決議を要する定款変更である。しかし、184条2項は、株式分割に伴い分割割合の範囲内で増加させる場合に限って、株主総会の決議によらないで増加する定款変更を認める、466条の例外である。", "reason": "台帳要素 t116-e04 は、発行可能株式総数の定款記載（37条1項）、定款変更には本来466条の特別決議が必要であること、184条2項はその例外となることを整理している。", "basis": "PDF p.201（本編 p.198）。台帳要素 t116-e04の逐語引用に基づく。", "caution": "184条2項の趣旨（既存株主の支配比率に不利益を与えないこと）は t116-e05 の範囲である。", "articles": ["184条2項", "466条"], "page": 201, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／株式分割と発行可能株式総数の増加（184条2項）"}, {"id": "book-kigyoho-01-ch03-q5070", "ch": 3, "type": "何条", "q": "株式無償割当ては、株主総会（取締役会設置会社にあっては、取締役会）の決議による。ただし、定款に別段の定めがある場合は、この限りでない。この決議に関する定めは会社法何条か。", "a": "186条3項である。", "reason": "台帳要素 t117-e02 は、株式無償割当ての手続を186条3項（決議および定款に別段の定めがある場合のただし書）と整理している。", "basis": "PDF p.202（本編 p.199）。台帳要素 t117-e02の逐語引用に基づく。", "caution": "", "articles": ["186条3項"], "page": 202, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／株式無償割当て（185条～）"}, {"id": "book-kigyoho-01-ch03-q5071", "ch": 3, "type": "何条", "q": "株式分割に伴い単元株式数を変更しても（例：1株を2株に分割し、1単元が100株から200株になっても議決権は1個のまま）、株主Ａに不利益のおそれがない場合には、定款変更であるにもかかわらず株主総会の特別決議は不要とされる。これは会社法何条の定めか。", "a": "191条である。", "reason": "台帳要素 t118-e05 は、191条を「定款変更なのに株主総会決議不要」とし、株主に不利益のおそれがない例で整理している。", "basis": "PDF p.203（本編 p.200）。台帳要素 t118-e05の逐語引用に基づく。", "caution": "原則として単元株制度の採用・単元株式数の増加は株主総会の特別決議を要する（188条1項、466条、309条2項11号）。191条はその例外である。", "articles": ["191条"], "page": 203, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／単元株制度（188条～）と単元未満株主の権利"}, {"id": "book-kigyoho-01-ch03-q5072", "ch": 3, "type": "何条", "q": "単元未満株主の権利について定めるのは会社法何条か。", "a": "189条である。", "reason": "台帳要素 t118-e06 は「単元未満株主の権利（189条）」と整理している。", "basis": "PDF p.204（本編 p.201）。台帳要素 t118-e06の逐語引用に基づく。", "caution": "", "articles": ["189条"], "page": 204, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／単元株制度（188条～）と単元未満株主の権利"}, {"id": "book-kigyoho-01-ch03-q5073", "ch": 3, "type": "規定→趣旨", "q": "単元未満株主は、会社に対して単元未満株式の買取りを請求することができる（単元未満株式買取請求権、192条）。この権利が認められる趣旨は何か。", "a": "単元未満株主の投下資本回収のためである。", "reason": "台帳要素 t118-e07 は、192条の趣旨を「単元未満株主の投下資本回収のため」と明示している。なお、単元未満株式売渡請求権（194条）の趣旨は単元株主の権利を確保するためである。", "basis": "PDF p.204（本編 p.201）。台帳要素 t118-e07の逐語引用に基づく。", "caution": "", "articles": ["192条"], "page": 204, "loc": "12 株式の消却・併合・分割・無償割当て、単元株／単元株制度（188条～）と単元未満株主の権利"}, {"id": "book-kigyoho-01-ch03-q5074", "ch": 3, "type": "何条", "q": "既存株式を全部取得条項付種類株式に変更する定款変更では、「取得対価の価額の決定方法」を定款に記載しなければならない。この定款記載事項を定めるのは会社法何条か。", "a": "108条2項7号イである。", "reason": "台帳要素 t120-e02 は、全部取得条項付種類株式によるキャッシュ・アウトの手順②において、「取得対価の価額の決定方法」を定款に記載する根拠を108条2項7号イとしている。", "basis": "PDF p.206（本編 p.203）。台帳要素 t120-e02の逐語引用に基づく。", "caution": "変更の決議そのもの（株主総会の特別決議および種類株主総会の特別決議、111条2項・324条2項1号）とは別の、定款記載事項の根拠である。", "articles": ["108条2項7号イ"], "page": 206, "loc": "13 キャッシュ・アウト／全部取得条項付種類株式の取得（171条）によるキャッシュ・アウト"}, {"id": "book-kigyoho-01-ch03-q5075", "ch": 3, "type": "何条", "q": "全部取得条項付種類株式の取得について、取得対価に不満な株主が裁判所に対して価格の決定を申し立てることができる。これは会社法何条の定めか。", "a": "172条1項である。", "reason": "台帳要素 t120-e03 は、全部取得条項付種類株式の取得（171条）の手続として、裁判所に対する価格決定の申立権を172条1項と整理している。", "basis": "PDF p.206（本編 p.203）。台帳要素 t120-e03の逐語引用に基づく。", "caution": "差止請求権は171条の3であり、混同しないこと。", "articles": ["172条1項"], "page": 206, "loc": "13 キャッシュ・アウト／全部取得条項付種類株式の取得（171条）によるキャッシュ・アウト"}, {"id": "book-kigyoho-01-ch03-q5076", "ch": 3, "type": "何条", "q": "株式の併合について、法令・定款に違反し、株主が不利益を受けるおそれがある場合に認められる差止請求権は、会社法何条の定めか。", "a": "182条の3である。", "reason": "台帳要素 t121-e02 は、株式併合（180条）によるキャッシュ・アウトの手続として、差止請求権を182条の3（要件：①法令・定款違反②株主が不利益を受けるおそれがあること）と整理している。", "basis": "PDF p.207（本編 p.204）。台帳要素 t121-e02の逐語引用に基づく。", "caution": "", "articles": ["182条の3"], "page": 207, "loc": "13 キャッシュ・アウト／株式併合（180条）によるキャッシュ・アウト"}, {"id": "book-kigyoho-01-ch03-q5077", "ch": 3, "type": "何条", "q": "株式の併合によって生じた端数について、反対株主が会社に対して株式の買取りを請求することができる。これは会社法何条の定めか。", "a": "182条の4である。価格について協議が整わない場合には、裁判所に対する価格決定の申立権（182条の5第2項）がある。", "reason": "台帳要素 t121-e03 は、端数についての反対株主の株式買取請求権を182条の4、価格決定の申立権を182条の5第2項と整理している（端数が多いと市場価格が下落し適切な対価を期待できないため）。", "basis": "PDF p.207（本編 p.204）。台帳要素 t121-e03の逐語引用に基づく。", "caution": "", "articles": ["182条の4"], "page": 207, "loc": "13 キャッシュ・アウト／株式併合（180条）によるキャッシュ・アウト"}, {"id": "book-kigyoho-01-ch03-q5078", "ch": 3, "type": "何条", "q": "略式株式交換の場合、株式交換完全子会社においては株主総会の決議が不要である。この根拠は会社法何条か。", "a": "784条1項本文である。なお、株式交換完全親会社においては株主総会の特別決議による承認が必要である（795条1項、309条2項12号）。", "reason": "台帳要素 t122-e02 は、略式株式交換の場合は株式交換完全子会社において株主総会決議が不要である根拠を784条1項本文と整理している。", "basis": "PDF p.208（本編 p.205）。台帳要素 t122-e02の逐語引用に基づく。", "caution": "", "articles": ["784条1項本文"], "page": 208, "loc": "13 キャッシュ・アウト／金銭を対価とする（略式）株式交換によるキャッシュ・アウト"}, {"id": "book-kigyoho-01-ch03-q5079", "ch": 3, "type": "何条", "q": "株式交換の効力を事後に争うための株式交換無効の訴えは、会社法何条の定めか。", "a": "828条1項11号である。", "reason": "台帳要素 t122-e04 は、株式交換について事後に効力を争う方法として株式交換無効の訴え（828条1項11号）があると整理している。", "basis": "PDF p.208（本編 p.205）。台帳要素 t122-e04の逐語引用に基づく。", "caution": "", "articles": ["828条1項11号"], "page": 208, "loc": "13 キャッシュ・アウト／金銭を対価とする（略式）株式交換によるキャッシュ・アウト"}, {"id": "book-kigyoho-01-ch03-q5080", "ch": 3, "type": "何条", "q": "特別支配株主の株式等売渡請求について、売渡請求が法令に違反する場合や、特別支配株主が定めた売渡対価が著しく不当である場合などに認められる差止請求権は、会社法何条の定めか。", "a": "179条の7である。", "reason": "台帳要素 t123-e03 は、特別支配株主の株式等売渡請求の手続として、差止請求権を179条の7（売渡株主が不利益を受けるおそれがあることが要件）と整理している。", "basis": "PDF p.209（本編 p.206）。台帳要素 t123-e03の逐語引用に基づく。", "caution": "裁判所に対する価格決定の申立権は179条の8第1項である。", "articles": ["179条の7"], "page": 209, "loc": "13 キャッシュ・アウト／特別支配株主の株式等売渡請求（179条～）"}, {"id": "book-kigyoho-01-ch03-q5081", "ch": 3, "type": "規定→趣旨", "q": "キャッシュ・アウトの差止請求では、「対価の著しい不当性」が差止事由となるのは、略式株式交換と特別支配株主の株式等売渡請求の場合だけである。この2つの制度でのみ、対価の著しい不当性が差止事由とされるのはなぜか。", "a": "この2制度は株主総会決議を要求していないため、他のキャッシュ・アウトの方法と異なり、対価を不当と考える株主が株主総会で反対の意思表示をすることができない。そこで、株主保護の観点から、対価を不当と考える株主に差止請求権を認めたのである。", "reason": "台帳要素 t123-e04 は、＊1・＊2（対価の著しい不当性が差止事由）の理由を、両制度が株主総会決議を要求していないことと株主保護の観点から説明している。", "basis": "PDF p.209（本編 p.206）。台帳要素 t123-e04の逐語引用に基づく。", "caution": "", "articles": ["179条の7第1項3号"], "page": 209, "loc": "13 キャッシュ・アウト／特別支配株主の株式等売渡請求（179条～）"}, {"id": "book-kigyoho-01-ch03-q5082", "ch": 3, "type": "何条", "q": "特別支配株主の株式等売渡請求による取得の効力を事後に争う売渡株式等取得無効の訴えは、会社法何条の定めか。", "a": "846条の2（以下）である。被告は特別支配株主であり、無効判決の効力には対世効（846条の7）と将来効（846条の8）がある。", "reason": "台帳要素 t123-e05 は、売渡株式等取得無効の訴えを846条の2〜とし、828条ではない点への注意を明示している（被告・効力は t123-e08）。", "basis": "PDF p.210（本編 p.207）。台帳要素 t123-e05の逐語引用に基づく。", "caution": "組織再編等の無効の訴えの根拠である828条ではない点に注意。", "articles": ["846条の2"], "page": 210, "loc": "13 キャッシュ・アウト／特別支配株主の株式等売渡請求（179条～）"}, {"id": "book-kigyoho-01-ch03-q5083", "ch": 3, "type": "何条", "q": "株主有限責任を定めるのは会社法何条か。", "a": "104条である。", "reason": "台帳要素 t124-e01 は、Ⅱ重要条文（暗記すべき条文）として「株主有限責任 ― 104条」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t124-e01の逐語引用に基づく。", "caution": "", "articles": ["104条"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株主の権利・種類株式・定款変更関係"}, {"id": "book-kigyoho-01-ch03-q5084", "ch": 3, "type": "何条", "q": "「株主の権利」を定めるのは会社法何条か。", "a": "105条である。", "reason": "台帳要素 t124-e02 は、Ⅱ重要条文として「『株主の権利』の条文 ― 105条」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t124-e02の逐語引用に基づく。", "caution": "", "articles": ["105条"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株主の権利・種類株式・定款変更関係"}, {"id": "book-kigyoho-01-ch03-q5085", "ch": 3, "type": "何条", "q": "公開会社が、全部の株式を譲渡制限株式とする定款変更をして非公開会社になるには、株主総会の特殊決議が必要である。この特殊決議の根拠は会社法何条か。", "a": "309条3項1号である（譲渡制限の定め自体は107条1項1号に基づく）。", "reason": "台帳要素 t124-e09 は、Ⅱ重要条文として「公開会社を非公開会社に（全ての株式を譲渡制限株式に）― 309条3項、107条1項1号」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t124-e09の逐語引用に基づく。", "caution": "定款変更の原則は特別決議（309条2項11号）であり、特殊決議はそれより重い決議である。", "articles": ["309条3項1号"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株主の権利・種類株式・定款変更関係"}, {"id": "book-kigyoho-01-ch03-q5086", "ch": 3, "type": "何条", "q": "株券発行会社は、遅滞なく株券を発行しなければならない。これは会社法何条の定めか。", "a": "215条1項である。", "reason": "台帳要素 t125-e06 は、Ⅱ重要条文として「株券の発行、遅滞なく ― 215条1項」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t125-e06の逐語引用に基づく。", "caution": "", "articles": ["215条1項"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株券・譲渡制限・自己株式関係"}, {"id": "book-kigyoho-01-ch03-q5087", "ch": 3, "type": "何条", "q": "定款による株式の譲渡制限の定めは、株式の内容についての特別の定めとして、また種類株式の内容として置くことができる。それぞれの根拠は会社法何条か。", "a": "株式の内容についての特別の定めとしては107条1項1号、種類株式の内容としては108条1項4号である。", "reason": "台帳要素 t125-e07 は、Ⅱ重要条文として「定款による譲渡制限 ― 107条1項1号、108条1項4号」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t125-e07の逐語引用に基づく。", "caution": "", "articles": ["107条1項1号", "108条1項4号"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株券・譲渡制限・自己株式関係"}, {"id": "book-kigyoho-01-ch03-q5088", "ch": 3, "type": "何条", "q": "譲渡等承認請求の根拠条文は、請求する者によって異なる。譲渡しようとする株主側と、株式取得者側で、それぞれ会社法何条か。", "a": "譲渡しようとする株主側は136条・138条1号、株式取得者側は137条・138条2号である。", "reason": "台帳要素 t125-e08 は、Ⅱ重要条文として「譲渡承認請求 ― 136条、138条1号、137条、138条2号」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t125-e08の逐語引用に基づく。", "caution": "承認機関そのものは139条である。", "articles": ["136条", "138条1号", "137条", "138条2号"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株券・譲渡制限・自己株式関係"}, {"id": "book-kigyoho-01-ch03-q5089", "ch": 3, "type": "何条", "q": "自己株式の取得についての財源規制（分配可能額規制）の根拠は会社法何条か。", "a": "461条1項である（取得事由ごとに各号で定められている）。", "reason": "台帳要素 t125-e11 は、Ⅱ重要条文として「自己株式の取得・財源規制 ― 461条」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t125-e11の逐語引用に基づく。", "caution": "461条違反の場合の責任は462条である。", "articles": ["461条1項"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株券・譲渡制限・自己株式関係"}, {"id": "book-kigyoho-01-ch03-q5090", "ch": 3, "type": "何条", "q": "特定の株主からの自己株式の取得についての、原則的な取得手続規制を定めるのは会社法何条か。", "a": "160条である。市場価格のある株式の取得（161条）、相続人等からの取得（162条）、子会社からの取得（163条）、市場取引等による取得（165条）などは、その例外である。", "reason": "台帳要素 t125-e12 は、Ⅱ重要条文として「特定の株主からの自己株式の取得 原則：160条（取得手続規制）」を挙げている（例外は t125-e13：161条〜165条）。", "basis": "PDF p.211（本編 p.208）。台帳要素 t125-e12の逐語引用に基づく。", "caution": "", "articles": ["160条"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：株券・譲渡制限・自己株式関係"}, {"id": "book-kigyoho-01-ch03-q5091", "ch": 3, "type": "何条", "q": "基準日制度の根拠は会社法何条か。", "a": "124条である（特に124条4項が重要とされる）。", "reason": "台帳要素 t126-e01 は、Ⅱ重要条文として「基準日 ― 124条、特に124条4項が重要」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t126-e01の逐語引用に基づく。", "caution": "", "articles": ["124条"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：基準日・名義書換・消却〜キャッシュ・アウト関係"}, {"id": "book-kigyoho-01-ch03-q5092", "ch": 3, "type": "何条", "q": "株式の併合の根拠条文は会社法何条か。", "a": "180条（以下）である。", "reason": "台帳要素 t126-e04 は、Ⅱ重要条文として「株式の併合 ― 180条～」を挙げている。", "basis": "PDF p.211（本編 p.208）。台帳要素 t126-e04の逐語引用に基づく。", "caution": "", "articles": ["180条"], "page": 211, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：基準日・名義書換・消却〜キャッシュ・アウト関係"}, {"id": "book-kigyoho-01-ch03-q5093", "ch": 3, "type": "何条", "q": "株式無償割当ての根拠条文は会社法何条か。", "a": "185条（以下）である。", "reason": "台帳要素 t126-e06 は、Ⅱ重要条文として「株式無償割当 ― 185条～」を挙げている。", "basis": "PDF p.212（本編 p.209）。台帳要素 t126-e06の逐語引用に基づく。", "caution": "", "articles": ["185条"], "page": 212, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：基準日・名義書換・消却〜キャッシュ・アウト関係"}, {"id": "book-kigyoho-01-ch03-q5094", "ch": 3, "type": "何条", "q": "単元株制度の根拠条文は会社法何条か。", "a": "188条（以下）である。", "reason": "台帳要素 t126-e07 は、Ⅱ重要条文として「単元株式制度 ― 188条～」を挙げている。", "basis": "PDF p.212（本編 p.209）。台帳要素 t126-e07の逐語引用に基づく。", "caution": "", "articles": ["188条"], "page": 212, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：基準日・名義書換・消却〜キャッシュ・アウト関係"}, {"id": "book-kigyoho-01-ch03-q5095", "ch": 3, "type": "何条", "q": "全部取得条項付種類株式の取得手続の根拠条文は会社法何条か。", "a": "171条である（取得は株主総会の特別決議による。171条1項、309条2項3号）。", "reason": "台帳要素 t126-e08 は、Ⅱ重要条文として「全部取得条項付種類株式の取得 ― 171条」を挙げている。", "basis": "PDF p.212（本編 p.209）。台帳要素 t126-e08の逐語引用に基づく。", "caution": "", "articles": ["171条"], "page": 212, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：基準日・名義書換・消却〜キャッシュ・アウト関係"}, {"id": "book-kigyoho-01-ch03-q5096", "ch": 3, "type": "何条", "q": "特別支配株主の株式等売渡請求の根拠条文は会社法何条か。", "a": "179条（以下）である。", "reason": "台帳要素 t126-e09 は、Ⅱ重要条文として「特別支配株主の株式等売渡請求 ― 179条～」を挙げている。", "basis": "PDF p.212（本編 p.209）。台帳要素 t126-e09の逐語引用に基づく。", "caution": "", "articles": ["179条"], "page": 212, "loc": "Ⅱ 重要条文（暗記すべき条文）―株式―／Ⅱ重要条文（暗記すべき条文）：基準日・名義書換・消却〜キャッシュ・アウト関係"}, {"id": "book-kigyoho-01-ch04-q5000", "ch": 4, "type": "規定→趣旨", "q": "現物出資（金銭以外の財産をもってする出資、28条1号）は、変態設立事項として、定款に記載しなければ効力を生じず、検査役の調査（33条）等の規制を受ける。この現物出資規制の趣旨は何か。", "a": "目的財産の過大な評価による不当な株式付与により、会社の財産的基礎を害するとともに、金銭出資者を害するからである。", "reason": "規定側の枠組み（変態設立事項としての定款記載・検査役調査）はt003-e02・t009-e01に基づく。", "basis": "会社法28条1号。PDF p.214（本編 p.211）・PDF p.214（本編 p.211）。台帳要素 t004-e01、t004-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 214, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5001", "ch": 4, "type": "規定→趣旨", "q": "財産引受け（株式会社の成立後に譲り受けることを約した財産、28条2号）は、変態設立事項として、定款に記載しなければ効力を生じず、検査役の調査（33条）等の規制を受ける。この規制の趣旨は何か。", "a": "目的財産の過大な評価による不当な対価支払いにより会社の財産的基礎を害され、また、現物出資規制の潜脱手段として利用されるおそれがあるからである。", "reason": "規定側の枠組み（変態設立事項としての定款記載・検査役調査）はt003-e02・t009-e01に基づく。", "basis": "会社法28条2号。PDF p.214（本編 p.211）・PDF p.214（本編 p.211）。台帳要素 t005-e01、t005-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 214, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5002", "ch": 4, "type": "規定→趣旨", "q": "事後設立（会社成立後2年以内に、成立前から存在する財産で事業のために継続して使用するものを取得すること）については、効力発生日の前日までに株主総会の決議によって契約の承認を受けなければならない（467条1項5号）。この事後設立規制の趣旨は何か。", "a": "財産引受け規制の潜脱手段として利用されるおそれがあるからである。", "reason": "規定（467条1項5号の承認要件）と趣旨を対応させた。", "basis": "会社法467条1項5号（条文引用）。PDF p.215（本編 p.212）・PDF p.215（本編 p.212）。台帳要素 t006-e05、t006-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 215, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5003", "ch": 4, "type": "規定→趣旨", "q": "発起人の報酬・特別利益（特別利益とは、会社の設備利用の特権授与など将来にわたる継続的利益をいう、28条3号）は、変態設立事項として、定款に記載しなければ効力を生じない。この規制の趣旨は何か。", "a": "発起人が多額の報酬や特別利益を自由に決定できるとすると、会社の財産的基礎を害するからである。", "reason": "規定側の枠組み（変態設立事項としての定款記載）はt003-e02に基づく。", "basis": "PDF p.216（本編 p.213）。台帳要素 t007-e01、t007-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 216, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5004", "ch": 4, "type": "規定→趣旨", "q": "設立費用（発起人が会社設立のために支出した費用、28条4号）は、変態設立事項として、定款に記載しなければ効力を生じない。この規制の趣旨は何か。", "a": "発起人の濫費・過大な見積もりにより会社の財産的基礎を害するからである。", "reason": "規定側の枠組み（変態設立事項としての定款記載）はt003-e02に基づく。", "basis": "PDF p.216（本編 p.213）。台帳要素 t008-e01、t008-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 216, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5005", "ch": 4, "type": "規定→趣旨", "q": "不足額塡補責任（52条）において、現物出資者等であるBは、過失がなくても常に責任を負う（無過失責任、52条2項）。Bが無過失責任を負う趣旨は何か。", "a": "会社の犠牲において、現物出資者等に利得させるべきでないからである。", "reason": "規定（Bの無過失責任、e03）と趣旨（e04）を対応させた。", "basis": "会社法52条2項。PDF p.227（本編 p.224）・PDF p.227（本編 p.224）。台帳要素 t024-e03、t024-e04 の逐語引用に基づく。", "caution": "募集設立の場合に他の発起人も無過失責任となる趣旨は、現物出資財産等について十分な調査の機会のない株式引受人を保護するためである（t024-e07）。", "articles": [], "page": 227, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5006", "ch": 4, "type": "規定→趣旨", "q": "出資の履行を仮装したAは、支払・給付義務を果たせば「株主の権利を行使すること」ができる（52条の2第4項、102条3項）。Aの権利行使が認められる趣旨は何か。", "a": "会社財産が充実した以上、仮装払込をした発起人・引受人の権利行使を否定する理由はないからである。", "reason": "規定（義務履行後の権利行使、e05）と趣旨（e06）を対応させた。", "basis": "会社法52条の2第4項・102条3項。PDF p.229（本編 p.226）・PDF p.229（本編 p.226）。台帳要素 t029-e05、t029-e06 の逐語引用に基づく。", "caution": "", "articles": [], "page": 229, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5007", "ch": 4, "type": "条文構造", "q": "定款の絶対的記載・記録事項（27条・37条）と変態設立事項（28条）とでは、定款に記載・記録を欠いた場合の効果はどのように異なるか、対比して答えよ。", "a": "絶対的記載・記録事項は、記載・記録がなければ定款自体が無効になる。これに対し変態設立事項（現物出資・財産引受・発起人の報酬・特別利益・設立費用）は、定款に記載し、又は記録しなければ、その事項が効力を生じない（28条柱書）にとどまる。", "reason": "記載を欠いた場合の効果の及ぶ範囲（定款全体か当該事項か）という構造の違いを対比した。", "basis": "会社法27条・37条。PDF p.213（本編 p.210）・会社法28条柱書・各号。PDF p.213（本編 p.210）。台帳要素 t002-e02、t003-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 213, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5008", "ch": 4, "type": "条文構造", "q": "仮装払込の類型である預合いと見せ金について、払込資金の出所・現実の払込の有無・払込の効力を対比して答えよ。", "a": "預合いは、発起人が払込取扱機関の役職員（支店長等）と通謀して、払込取扱機関から借入れをしてそれを払込みに充てるが、借入れを返済するまでは預金を引き出さないことを約束する行為であり、現実の拠出なく実質的に会社財産の形成に役立っていないから、払込は無効と解する。見せ金は、発起人が払込取扱機関以外のものから借り入れた金銭を株式の払込みに充て、会社の成立後にそれを引き出して借入金の返済に充てることであり、現実の払込はあるが、一連の行為を全体的に考察すれば当初から計画された払込み仮装のためのからくりの一環であるから、払込は無効と解する。", "reason": "2類型の構造（通謀の相手方・資金の出所・現実の拠出の有無）と、無効の理由づけの違いを対比した。", "basis": "PDF p.218（本編 p.215）・PDF p.219（本編 p.216）。台帳要素 t012-e02、t012-e04、t013-e01、t013-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 219, "loc": "項目4 出資の確定"}, {"id": "book-kigyoho-01-ch04-q5009", "ch": 4, "type": "条文構造", "q": "不足額塡補責任（52条、103条1項）における責任の構造を、主体ごとに整理して答えよ（現物出資者等・他の発起人・専門家証明をした者）。", "a": "現物出資者等は常に責任を負う無過失責任である（52条2項）。現物出資者等以外の発起人は原則として過失責任であり、検査役の調査を経た場合、または過失がないことを証明した場合は責任を負わない。ただし、募集設立の場合は無過失責任となる（103条1項）。専門家証明をした弁護士等（52条3項）は過失責任である。", "reason": "責任の性質（無過失責任か過失責任か）を主体ごとに整理する構造問題。募集設立の場合の特則（103条1項）を含む。", "basis": "会社法52条2項。PDF p.227（本編 p.224）・PDF p.227（本編 p.224）・会社法52条3項。PDF p.227（本編 p.224）。台帳要素 t024-e03、t024-e05、t024-e08 の逐語引用に基づく。", "caution": "", "articles": [], "page": 227, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5010", "ch": 4, "type": "何条", "q": "会社は、設立の登記をすることによって成立し、団体は法人格を取得する。この設立登記について定めるのは会社法何条か。", "a": "49条である。", "reason": "4つの実体形成に設立登記が加わって会社が成立するという定め（e01）から条番号を識別する問題。", "basis": "会社法49条。PDF p.213（本編 p.210）", "caution": "", "articles": [], "page": 213, "loc": "項目1 会社設立手続の概要"}, {"id": "book-kigyoho-01-ch04-q5011", "ch": 4, "type": "何条", "q": "現物出資・財産引受・発起人の報酬・特別利益・設立費用の4事項は、定款に記載し、又は記録しなければ、その効力を生じない。これらの変態設立事項を定めるのは会社法何条か。", "a": "28条", "reason": "変態設立事項の4事項と「記載しなければ効力を生じない」という効果から条番号を識別する問題。", "basis": "会社法28条柱書・各号。PDF p.213（本編 p.210）", "caution": "", "articles": [], "page": 213, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5012", "ch": 4, "type": "何条", "q": "変態設立事項については、原則として検査役の調査を受けなければならない（例外あり）。この検査役の調査を定めるのは会社法何条か。", "a": "33条である。", "reason": "変態設立事項の規制「3」のうち検査役の調査（e01）から条番号を識別する問題。", "basis": "会社法28条柱書・33条・96条。PDF p.216（本編 p.213）", "caution": "", "articles": [], "page": 216, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5013", "ch": 4, "type": "何条", "q": "現物出資財産等の価額が、定款に記載・記録された価額に著しく不足するときは、発起人等がその不足額を支払う義務を負う（不足額塡補責任）。これは会社法何条の定めか（発起設立の場合）。", "a": "52条である（募集設立の場合は103条1項）。", "reason": "責任の内容（不足額の支払義務）から条番号を識別する問題。", "basis": "会社法52条・103条1項。PDF p.227（本編 p.224）", "caution": "", "articles": [], "page": 227, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5014", "ch": 4, "type": "何条", "q": "発起人は、払込みを仮装した場合には払込みを仮装した出資に係る金銭の全額の支払を、給付を仮装した場合には金銭以外の財産の全部の給付をする義務を負う。これは会社法何条の定めか。", "a": "52条の2第1項", "reason": "条文の文言（仮装の場合の全額支払・全部給付）から条番号を識別する問題。", "basis": "会社法52条の2第1項（条文引用）。PDF p.231（本編 p.228）・会社法52条の2・102条の2・103条・102条。PDF p.229（本編 p.226）。台帳要素 t030-e01、t029-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 231, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5015", "ch": 4, "type": "何条", "q": "株式会社は、成立後2年以内における成立前から存在する財産で事業のために継続して使用するものの取得については、効力発生日の前日までに株主総会の決議によって契約の承認を受けなければならない（事後設立）。これは会社法何条の定めか。", "a": "467条1項5号である。", "reason": "条文の文言から条番号を識別する問題。承認決議は株主総会の特別決議である（309条2項11号、t006-e06）。", "basis": "会社法467条1項5号（条文引用）。PDF p.215（本編 p.212）", "caution": "", "articles": [], "page": 215, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5016", "ch": 4, "type": "何条", "q": "会社の設立の無効は、株主等が、会社設立から2年以内に訴えをもって主張することができる（設立無効の訴え）。この訴えについて定めるのは会社法何条か。", "a": "828条1項1号である（提訴権者は同条2項1号）。", "reason": "提訴期間（2年以内）を含む定めの内容から条番号を識別する問題。", "basis": "会社法828条1項1号・2項1号。PDF p.233（本編 p.230）", "caution": "", "articles": [], "page": 233, "loc": "項目9 設立の瑕疵"}, {"id": "book-kigyoho-01-ch04-q5017", "ch": 4, "type": "何条", "q": "会社の組織に関する訴え（設立無効の訴え等）について認容判決が確定した場合、その無効の効力は判決確定の時から将来に向かってのみ生じ、確定までになされた取引は有効のままである（将来効）。これは会社法何条の定めか。", "a": "839条である。", "reason": "民法の原則（遡及効）に対する例外としての将来効の定めから条番号を識別する問題。", "basis": "会社法839条。PDF p.234（本編 p.231）・PDF p.234（本編 p.231）。台帳要素 t033-e02、t033-e04 の逐語引用に基づく。", "caution": "", "articles": [], "page": 234, "loc": "項目9 設立の瑕疵"}, {"id": "book-kigyoho-01-ch04-q5018", "ch": 4, "type": "何条", "q": "預合い（発起人と払込取扱機関の役職員との通謀による仮装払込）に対する刑事罰（預合いの罪）を定めるのは会社法何条か。", "a": "965条である。", "reason": "刑事罰の対象行為から条番号を識別する問題。なお、図利加害目的等の要件を満たせば960条（取締役等の特別背任罪）も適用されうる（t012-e07）。", "basis": "会社法965条・960条。PDF p.218（本編 p.215）", "caution": "", "articles": [], "page": 218, "loc": "項目4 出資の確定"}, {"id": "book-kigyoho-01-ch04-q5019", "ch": 4, "type": "何条", "q": "株式会社の設立方法には、発起人が発行する株式の総数を引き受ける発起設立と、発起人が発行する株式の一部を引き受け、残りの引受人を募集する募集設立とがある。この発起設立・募集設立を定めるのは、会社法何条何項何号か。", "a": "発起設立は会社法25条1項1号、募集設立は同項2号である。", "reason": "レジュメは設立方法を「発起設立とは、25条1項1号」「募集設立とは、25条1項2号」と対応づけて示している。", "basis": "PDF p.213（本編 p.210）。台帳要素 t001-e02（株式会社の設立方法：発起設立は25条1項1号、募集設立は25条1項2号）の逐語引用に基づく。", "caution": "", "articles": ["25条1項1号", "25条1項2号"], "page": 213, "loc": "項目1 会社設立手続の概要"}, {"id": "book-kigyoho-01-ch04-q5020", "ch": 4, "type": "条文構造", "q": "会社法28条（変態設立事項）は、どのような構造の条文か。柱書と各号がそれぞれ何を定めているか述べよ。", "a": "柱書が、28条各号に掲げる事項は定款に記載し、又は記録しなければ、その効力を生じないという効力発生の要件を定め、各号が変態設立事項を列挙する構造である。1号は現物出資、2号は財産引受、3号は発起人の受ける報酬・特別利益、4号は会社の負担する設立費用である。", "reason": "レジュメは変態設立事項を「28条各号に掲げる事項」とし、4つの事項の列挙と柱書の効力要件をセットで示している。", "basis": "PDF p.213（本編 p.210）。台帳要素 t003-e02（変態設立事項とは28条各号に掲げる事項。具体的には①現物出資（28条1号）②財産引受（同条2号）③発起人の報酬・特別利益（同条3号）④設立費用（同条4号）の4つ…）の逐語引用に基づく。", "caution": "", "articles": ["28条", "28条1号", "28条2号", "28条3号", "28条4号"], "page": 213, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5021", "ch": 4, "type": "条文構造", "q": "会社法467条1項5号（事後設立）は、どのような構造の条文か。本文とただし書がそれぞれ何を定めているか述べよ。", "a": "本文（467条1項柱書と5号）が、株式会社が成立後2年以内に、成立前から存在する財産で事業のために継続して使用するものを取得する場合には、効力発生日の前日までに株主総会の決議によって契約の承認を受けなければならないという原則を定め、ただし書が、対価として交付する財産の帳簿価額の合計額（イ）の純資産額（ロ）に対する割合が5分の1（定款で定めた場合はその割合）を超えない場合は承認を要しないという例外を定める構造である。", "reason": "レジュメが引用する467条1項の条文は、柱書による承認の要求、5号による対象行為の特定、ただし書による割合（イとロの対比）での例外から構成されている。", "basis": "PDF p.215（本編 p.212）。台帳要素 t006-e05（467条1項5号の条文：株式会社は、成立後2年以内における成立前から存在する財産で事業のために継続して使用するものの取得については、効力発生日の前日までに株主総…）の逐語引用に基づく。", "caution": "", "articles": ["467条1項5号"], "page": 215, "loc": "項目2 定款の作成"}, {"id": "book-kigyoho-01-ch04-q5022", "ch": 4, "type": "何条", "q": "会社の設立に際し、出資の全額払込み・全部給付を定めるのは、会社法何条か。発起設立の場合と募集設立の場合に分けて答えよ。", "a": "発起設立については会社法34条、募集設立については会社法63条である。", "reason": "レジュメは「全額払込み・全部給付（34条、63条）」と示し、34条1項と63条1項の比較から、現物出資を行えるのは（会社設立時に）発起人に限ることも読み取れる。", "basis": "PDF p.218（本編 p.215）。台帳要素 t011-e01（全額払込み・全部給付（34条、63条）。34条1項と63条1項の比較から、現物出資を行えるのは（会社設立時に）発起人に限ることがわかる）の逐語引用に基づく。", "caution": "", "articles": ["34条", "63条"], "page": 218, "loc": "項目4 出資の確定"}, {"id": "book-kigyoho-01-ch04-q5023", "ch": 4, "type": "何条", "q": "会社の設立の手続において、設立時取締役等による調査の根拠条文は、会社法何条か。発起設立の場合と募集設立の場合に分けて答えよ。", "a": "発起設立については会社法46条、募集設立については会社法93条である。", "reason": "レジュメは「その他の手続き」として「設立時取締役等による調査（46条、93条）」を掲げている。", "basis": "PDF p.221（本編 p.218）。台帳要素 t017-e01（＜その他の手続き＞として、設立時取締役等による調査（46条、93条）が掲げられる（見出しのみで、本文に内容説明はない））の逐語引用に基づく。", "caution": "レジュメでは見出しのみの記載で、本文に内容の説明はない。", "articles": ["46条", "93条"], "page": 221, "loc": "項目6 その他の手続き"}, {"id": "book-kigyoho-01-ch04-q5024", "ch": 4, "type": "規定→趣旨", "q": "不足額塡補責任（52条）について、現物出資者等以外の発起人は、発起設立では原則として過失責任であるのに対し、募集設立では無過失責任とされる（103条1項）。募集設立の場合に無過失責任とする趣旨は何か。", "a": "現物出資財産等について十分な調査の機会のない株式引受人を保護するためである。", "reason": "レジュメは、募集設立の場合に無過失責任とする趣旨を「現物出資財産等について十分な調査の機会のない株式引受人を保護」と明示している。", "basis": "PDF p.227（本編 p.224）。台帳要素 t024-e07（募集設立の場合に無過失責任とする趣旨：現物出資財産等について十分な調査の機会のない株式引受人を保護するため）の逐語引用に基づく。", "caution": "", "articles": ["103条1項", "52条"], "page": 227, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5025", "ch": 4, "type": "条文構造", "q": "会社法53条（発起人等の任務懈怠責任）は、どのような構造の条文か。1項と2項がそれぞれ何を定めているか述べよ。", "a": "1項が会社に対する任務懈怠責任を、2項が第三者に対する任務懈怠責任を定める構造である。なお、1項の責任は423条1項の責任と同様の責任、2項の責任は429条1項の責任と同様の責任である。", "reason": "レジュメは53条について「1項：会社に対する責任 cf.423条1項と同様の責任。2項：第三者に対する責任 cf.429条1項と同様の責任」と整理している。", "basis": "PDF p.227（本編 p.224）。台帳要素 t025-e01（発起人等の任務懈怠責任（53条）：1項は会社に対する責任（cf.423条1項と同様の責任）、2項は第三者に対する責任（cf.429条1項と同様の責任））の逐語引用に基づく。", "caution": "", "articles": ["53条1項", "53条2項"], "page": 227, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5026", "ch": 4, "type": "何条", "q": "発起人等が53条1項・2項の任務懈怠責任を負う場合に、その責任が連帯債務となること（連帯責任）を定めるのは、会社法何条か。", "a": "会社法54条である。", "reason": "レジュメは「54条：発起人等の連帯責任←53条1項2項責任」と示している。", "basis": "PDF p.227（本編 p.224）。台帳要素 t025-e02（54条の発起人等の連帯責任は、53条1項2項責任にかかる）の逐語引用に基づく。", "caution": "", "articles": ["54条"], "page": 227, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5027", "ch": 4, "type": "何条", "q": "発起人等の責任のうち、52条1項の不足額塡補責任、52条の2第1項・第2項の支払・給付義務、53条1項の任務懈怠責任は、総株主の同意によって免除することができる。この免除を定めるのは、会社法何条か。", "a": "会社法55条である。", "reason": "レジュメは「55条：総株主の同意による責任の免除←52条1項責任、52条の2第1項2項、53条1項責任」と示している。", "basis": "PDF p.227（本編 p.224）。台帳要素 t025-e03（55条の総株主の同意による責任の免除の対象は、52条1項責任、52条の2第1項2項、53条1項責任である）の逐語引用に基づく。", "caution": "", "articles": ["55条"], "page": 227, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5028", "ch": 4, "type": "何条", "q": "会社法は、株式会社が不成立の場合の発起人の責任について定めを置いている。これは会社法何条の定めか。", "a": "会社法56条である。", "reason": "レジュメは項目として「会社不成立の場合の発起人の責任（56条）」を掲げている。", "basis": "PDF p.228（本編 p.225）。台帳要素 t026-e01（会社不成立の場合の発起人の責任は56条（見出しのみで、本文に内容説明はない））の逐語引用に基づく。", "caution": "レジュメでは見出しのみの記載で、本文に内容の説明はない。", "articles": ["56条"], "page": 228, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5029", "ch": 4, "type": "何条", "q": "募集設立における「擬似発起人の責任」を定めるのは、会社法何条何項か。", "a": "会社法103条4項である。", "reason": "レジュメは「擬似発起人の責任（103条4項）」と見出しに条文を対応づけている。", "basis": "PDF p.228（本編 p.225）。台帳要素 t027-e01（擬似発起人の責任は103条4項（見出しのみ））の逐語引用に基づく。", "caution": "レジュメでは見出しのみの記載で、本文に内容の説明はない。", "articles": ["103条4項"], "page": 228, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5030", "ch": 4, "type": "規定→趣旨", "q": "擬似発起人の責任（103条4項）が認められる趣旨は何か。", "a": "擬似発起人の賛助を信頼して株式を引き受けた者を保護するためである。", "reason": "レジュメは擬似発起人の責任の趣旨を「擬似発起人の賛助を信頼して株式を引き受けたものを保護するため」と明示している。", "basis": "PDF p.228（本編 p.225）。台帳要素 t027-e02（擬似発起人の責任の趣旨：擬似発起人の賛助を信頼して株式を引き受けたものを保護するため）の逐語引用に基づく。", "caution": "", "articles": ["103条4項"], "page": 228, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5031", "ch": 4, "type": "何条", "q": "募集設立における払込取扱機関の払込金保管証明責任を定めるのは、会社法何条何項か。", "a": "会社法64条2項である。", "reason": "レジュメは「払込取扱機関の払込金保管証明責任（64条2項）」と見出しに条文を対応づけている。", "basis": "PDF p.228（本編 p.225）。台帳要素 t028-e01（払込取扱機関の払込金保管証明責任は64条2項（見出しのみ））の逐語引用に基づく。", "caution": "レジュメでは見出しのみの記載で、本文に内容の説明はない。", "articles": ["64条2項"], "page": 228, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5032", "ch": 4, "type": "規定→趣旨", "q": "払込取扱機関の払込金保管証明責任（64条2項）の趣旨は何か。", "a": "募集設立における株式引受人を保護するためである。", "reason": "レジュメは払込金保管証明責任の趣旨を「募集設立における株式引受人を保護するため」と明示している。", "basis": "PDF p.228（本編 p.225）。台帳要素 t028-e02（払込金保管証明責任の趣旨：募集設立における株式引受人を保護するため）の逐語引用に基づく。", "caution": "", "articles": ["64条2項"], "page": 228, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5033", "ch": 4, "type": "何条", "q": "出資の履行を仮装した者が負う、仮装した出資に係る金銭の全額の支払・金銭以外の財産の全部の給付の義務（無過失責任）を定めるのは、会社法何条か。その者が発起人の場合と設立時募集株式の引受人の場合に分けて答えよ。", "a": "発起人については会社法52条の2第1項、設立時募集株式の引受人については会社法102条の2第1項である。", "reason": "レジュメは「Aの支払・給付義務（52条の2第1項、102条の2第1項）。無過失責任」とし、発起設立・募集設立を問わず、Aが発起人の場合と引受人の場合で適用条文が分かれることを示している。", "basis": "PDF p.229（本編 p.226）。台帳要素 t029-e02（Aの支払・給付義務（52条の2第1項、102条の2第1項）は無過失責任である（発起設立・募集設立を問わず、Aが発起人の場合は52条の2第1項、Aが引受人の場合は…）の逐語引用に基づく。", "caution": "", "articles": ["52条の2第1項", "102条の2第1項"], "page": 229, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5034", "ch": 4, "type": "規定→趣旨", "q": "出資の履行を仮装して発行された株式の譲受人Bは、悪意・重過失でなければ、株主の権利を行使することができる（52条の2第5項）。このように譲受人の権利行使を認める趣旨は何か。", "a": "株式取引の安全を図るためである。", "reason": "レジュメは譲受人Bが株主の権利を行使できる趣旨を「株式取引の安全を図るため」と明示している。", "basis": "PDF p.229（本編 p.226）。台帳要素 t029-e08（Bが株主の権利を行使できる趣旨：株式取引の安全を図るため）の逐語引用に基づく。", "caution": "", "articles": ["52条の2第5項"], "page": 229, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5035", "ch": 4, "type": "規定→趣旨", "q": "出資の履行を仮装した場合に、仮装した発起人・引受人の支払・給付義務および仮装に関与した者の支払義務が課される趣旨について、レジュメが第一に挙げるものは何か。", "a": "出資の履行が仮装された場合に、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転が生じるのを防ぐためである（関与していない株主の利益が希釈化されるのを防ぐため）。", "reason": "レジュメは趣旨①として「出資の履行が仮装された場合、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転が生じるのを防ぐため」と明示している。", "basis": "PDF p.230（本編 p.227）。台帳要素 t029-e11（Aの支払・給付義務、X・Yの支払い義務の趣旨①：出資の履行が仮装された場合、これに関与していない（設立時）株主から、仮装した（設立時）株主に不当な株式価値の移転…）の逐語引用に基づく。", "caution": "第二の趣旨（会社債権者の保護）は別問で扱う。", "articles": ["52条の2"], "page": 230, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5036", "ch": 4, "type": "規定→趣旨", "q": "出資の履行を仮装した場合の支払・給付義務の趣旨について、レジュメが第二に挙げるもの（学者の有力な考えによるもの）は何か。", "a": "会社の資金が確保されたと信じた会社債権者の保護の必要性である。", "reason": "レジュメは趣旨②として「会社の資金が確保されたと信じた会社債権者の保護の必要性」を挙げ、会社法の立法担当者は①（不当な株式価値の移転の防止）のみを強調すること、55条が総株主の同意による義務の免除を認めていることから②は不要かとの指摘があることも併記している。", "basis": "PDF p.230（本編 p.227）。台帳要素 t029-e12（趣旨②：会社の資金が確保されたと信じた会社債権者の保護の必要性。会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加える。もっとも、55条が総株主…）の逐語引用に基づく。", "caution": "", "articles": ["52条の2"], "page": 230, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5037", "ch": 4, "type": "何条", "q": "会社の設立の際、発起人や株式引受人が払込み・給付を全く行わなかった場合（出資の履行の仮装ではなく不履行の場合）に、株主となる権利を失うこと（失権）を定めるのは、会社法何条か。発起人の場合と引受人の場合に分けて答えよ。", "a": "発起人については会社法36条3項、株式引受人については会社法63条3項である（引受人は当然失権）。", "reason": "レジュメは出資をめぐる3類型の比較の中で「払込がなされなかった（0円）……株主となる権利の喪失（失権）36条3項（発起人の場合）63条3項（引受人は当然失権）」と示し、仮装の場合の支払義務の規定（52条の2等）がこれらの例外規定となることも併記している。", "basis": "PDF p.230（本編 p.227）。台帳要素 t029-e14（（参考）出資額100万円の場合の3類型：1 払込がなされなかった（0円）場合は株主となる権利の喪失（失権。36条3項（発起人の場合）、63条3項（引受人は当然失…）の逐語引用に基づく。", "caution": "", "articles": ["36条3項", "63条3項"], "page": 230, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5038", "ch": 4, "type": "条文構造", "q": "会社法52条の2第1項（出資の履行を仮装した場合の発起人の義務）は、どのような構造の条文か。本文（柱書）と各号がそれぞれ何を定めているか述べよ。", "a": "本文（柱書）が、発起人は各号に掲げる場合には株式会社に対し当該各号に定める行為をする義務を負うという枠組みを定め、1号が、払込みを仮装した場合の、払込みを仮装した出資に係る金銭の全額の支払を、2号が、給付を仮装した場合の、給付を仮装した出資に係る金銭以外の財産の全部の給付（株式会社が当該給付に代えて当該財産の価額に相当する金銭の支払を請求した場合にあっては、当該金銭の全額の支払）を定める構造である。", "reason": "レジュメが引用する52条の2第1項の条文は、柱書の義務の枠組みと、1号（払込みの仮装）・2号（給付の仮装）の場合分け、2号の括弧書きによる金銭支払への代替から構成されている。", "basis": "PDF p.231（本編 p.228）。台帳要素 t030-e01（52条の2第1項の条文：発起人は、①34条1項の規定による払込みを仮装した場合には払込みを仮装した出資に係る金銭の全額の支払、②34条1項の規定による給付を仮装…）の逐語引用に基づく。", "caution": "", "articles": ["52条の2第1項", "52条の2第1項1号", "52条の2第1項2号"], "page": 231, "loc": "項目8 設立に関する責任"}, {"id": "book-kigyoho-01-ch04-q5039", "ch": 4, "type": "何条", "q": "設立無効の訴えを含む会社の組織に関する訴え（828条から833条までの訴え）について、請求認容の確定判決が第三者に対しても効力を有すること（対世効）を定めるのは、会社法何条か。", "a": "会社法838条である。", "reason": "レジュメは「認容判決の対世効（838条）」とし、会社の組織に関する訴えとは828条から833条の訴えをいい、設立無効の訴え（828条1項1号、同条2項1号）を含むと説明している。", "basis": "PDF p.234（本編 p.231）。台帳要素 t033-e01（a）認容判決の対世効（838条）：会社の組織に関する訴えとは828条から833条の訴えをいい、設立無効の訴え（828条1項1号、同条2項1号）を含む）の逐語引用に基づく。", "caution": "", "articles": ["838条"], "page": 234, "loc": "項目9 設立の瑕疵"}, {"id": "book-kigyoho-01-ch05-q5000", "ch": 5, "type": "規定→趣旨", "q": "上場会社が株式報酬として募集株式を発行する場合の募集事項（202条の2第1項1号）では、取締役に財産の出資を求めない旨を定めることができる。出資を求めない趣旨は何か。", "a": "会社は取締役の職務執行の対価として募集株式を交付するのであるから、あえて取締役に財産の出資を求める必要はないからである。", "reason": "規定（202条の2第1項の募集事項）と1号の趣旨を対応させた。", "basis": "会社法202条の2第1項。PDF p.238（本編 p.235）・会社法202条の2第1項1号。PDF p.238（本編 p.235）。台帳要素 t004-e01、t004-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 238, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5001", "ch": 5, "type": "規定→趣旨", "q": "公開会社における募集株式の割当て等が支配株主の変更を伴う場合、原則として取締役会決議によるが、総株主の議決権の10分の1以上の株主の反対があれば株主総会決議が必要となる（206条の2第4項）。株主総会決議が要求される趣旨は何か。", "a": "支配株主の変更は合併・株式交換等に準じる会社の基礎の変更であって、株主に影響があるからである。", "reason": "規定（206条の2第4項の仕組み、e01）と趣旨（e02）を対応させた。なお、同条5項の決議が普通決議で足りる趣旨については別要素（t010-e03）で扱われている。", "basis": "会社法206条の2。PDF p.243（本編 p.240）・会社法206条の2第4項。PDF p.243（本編 p.240）。台帳要素 t010-e01、t010-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 243, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5002", "ch": 5, "type": "規定→趣旨", "q": "募集株式の発行の際の現物出資（207条）についても、検査役の調査（同条9項で省略できる場合あり）等の規制が及ぶ。この現物出資規制の趣旨は何か。", "a": "設立時と同様に、目的財産の過大な評価による不当な株式付与により、会社の財産的基礎を害するとともに金銭出資者を害するおそれがあるため、規制されている。", "reason": "規定側として207条の規制（検査役の調査、e03）を提示し、趣旨（e02）と結びつけた。", "basis": "会社法207条9項5号。PDF p.243（本編 p.240）・会社法207条。PDF p.243（本編 p.240）。台帳要素 t011-e03、t011-e02 の逐語引用に基づく。", "caution": "台帳の引用文では「おそれかある」と表記されるが、台帳注記によればページ画像では「おそれがある」と読め、抽出層の表記とみられる。解答文では「おそれがある」と表記した。", "articles": [], "page": 243, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5003", "ch": 5, "type": "規定→趣旨", "q": "募集株式の引受人Aが払込みを仮装した場合、Aは払込みを仮装した払込金額の全額の支払義務を負い（213条の2第1項）、仮装に関与した取締役Xも支払義務を負う（213条の3）。これらの支払義務が課される趣旨は何か。", "a": "①出資の履行が仮装された場合、これに関与していない株主から仮装した株主に不当な株式価値の移転が生じるのを防ぐため（関与していない株主の利益が希釈化されるのを防ぐため）、②会社の資金が確保されたと信じた会社債権者を保護するためである。", "reason": "規定（213条の2第1項の条文、e06）を提示し、支払義務の趣旨（e08）と結びつけた。", "basis": "会社法213条の2第1項。PDF p.245（本編 p.242）・会社法213条の2・213条の3。PDF p.246（本編 p.243）。台帳要素 t015-e06、t015-e08 の逐語引用に基づく。", "caution": "趣旨をめぐっては、会社法の立法担当者は①のみを強調し、学者の有力な考えは②も趣旨に加えるという立場の違いがある（t015-e09）。", "articles": [], "page": 246, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5004", "ch": 5, "type": "規定→趣旨", "q": "募集社債に関する事項の決定は、取締役会非設置会社では取締役の決定、取締役会設置会社では取締役会の決議による。このように株主総会の決議を要しない趣旨は何か。", "a": "社債の発行は本質的には借入れであり、業務執行の一環であるからである。", "reason": "規定側として決定機関の表（e01）を提示し、趣旨（e02）と結びつけた。", "basis": "会社法348条1項・2項・362条2項1号4項5号。PDF p.270（本編 p.267）・会社法362条。PDF p.270（本編 p.267）。台帳要素 t041-e01、t041-e02 の逐語引用に基づく。", "caution": "", "articles": [], "page": 270, "loc": "項目3 社債の発行"}, {"id": "book-kigyoho-01-ch05-q5005", "ch": 5, "type": "条文構造", "q": "募集事項の決定に関する199条・200条・201条・202条の役割分担について、正しいものはどれか。", "a": "199条が募集事項の決定（原則として株主総会が決定）を定め、200条がその決定の取締役または取締役会への委任を、201条が公開会社における特則（「特に有利な金額」の場合を除き取締役会が決定）を、202条が株主割当ての場合の決定機関を定める", "reason": "募集事項の決定をめぐる4条文の役割分担（決定・委任・公開会社特則・株主割当て）という条文構造を問う問題。", "basis": "会社法199条。PDF p.237（本編 p.234）・会社法200条。PDF p.237（本編 p.234）・会社法201条。PDF p.237（本編 p.234）・会社法202条。PDF p.237（本編 p.234）。台帳要素 t002-e01、t002-e02、t002-e03、t002-e04 の逐語引用に基づく。", "caution": "309条2項5号により、199条2項・200条1項・202条3項4号の株主総会決議は特別決議である（t002-e05）。", "articles": [], "page": 237, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5006", "ch": 5, "type": "条文構造", "q": "募集に係る責任等の規定（211条〜213条の3）の対応関係について、正しいものはどれか。", "a": "211条は引受の無効・取消の主張の制限、212条は引受人の責任、213条は212条1項2号の場合の取締役等の責任、213条の2は仮装払込みをした引受人の責任、213条の3は仮装払込みをした取締役等の責任を定める", "reason": "責任規定群の条文と内容の対応関係という条文構造を問う問題。213条・213条の2・213条の3は本範囲では見出しのみの記載であり、内容はt014・t015の論点で扱われている（台帳注記）。", "basis": "会社法211条。PDF p.240（本編 p.237）・会社法212条。PDF p.240（本編 p.237）・会社法213条・213条の2・213条の3。PDF p.240（本編 p.237）。台帳要素 t007-e01、t007-e02、t007-e03 の逐語引用に基づく。", "caution": "", "articles": [], "page": 240, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5007", "ch": 5, "type": "何条", "q": "募集株式の募集事項は、原則として株主総会（特別決議）によって決定しなければならない。これは会社法何条の定めか。", "a": "199条（2項）である。", "reason": "募集事項の決定という定めの内容から条番号を識別する問題。", "basis": "会社法199条。PDF p.237（本編 p.234）", "caution": "", "articles": [], "page": 237, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5008", "ch": 5, "type": "何条", "q": "公開会社については、「特に有利な金額」の場合を除き、募集事項の決定機関である「株主総会」を「取締役会」と読み替える特則がある。これは会社法何条の定めか。", "a": "201条", "reason": "公開会社の特則という定めの内容から条番号を識別する問題。", "basis": "会社法201条。PDF p.237（本編 p.234）", "caution": "", "articles": [], "page": 237, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5009", "ch": 5, "type": "何条", "q": "既存の株主に、持株数に比例して株式の割当てを受ける権利を付与して募集株式を割り当てる方法を「株主割当て」という。この株主割当てについて定めるのは会社法何条か。", "a": "202条である。", "reason": "方法の定義から条番号を識別する問題。", "basis": "会社法202条。PDF p.238（本編 p.235）", "caution": "", "articles": [], "page": 238, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5010", "ch": 5, "type": "何条", "q": "公開会社における募集株式の割当て等が支配株主の変更を伴う場合に、総株主の議決権の10分の1以上の株主の反対があれば株主総会決議を必要とする特則は、会社法何条の定めか。", "a": "206条の2（4項）である。", "reason": "特則の仕組み（通知・反対・普通決議）の内容から条番号を識別する問題。", "basis": "会社法206条の2。PDF p.243（本編 p.240）", "caution": "", "articles": [], "page": 243, "loc": "項目1 募集株式の発行等（2）〜（8）論証"}, {"id": "book-kigyoho-01-ch05-q5011", "ch": 5, "type": "何条", "q": "募集株式の発行の際、金銭以外の財産を出資の目的とする場合（現物出資）の規制（検査役の調査とその省略等）を定めるのは会社法何条か。", "a": "207条", "reason": "現物出資規制の場面（設立時か募集時か）から条番号を識別する問題。", "basis": "会社法207条9項5号。PDF p.243（本編 p.240）", "caution": "", "articles": [], "page": 239, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-kigyoho-01-ch05-q5012", "ch": 5, "type": "何条", "q": "募集株式の引受人の出資の履行について、全額払込・全部給付・相殺の禁止を定め、出資を履行しない場合は株主となる権利を失う（当然失権）とするのは、会社法何条か。", "a": "208条である。", "reason": "出資の履行に関する定めのまとまりから条番号を識別する問題。", "basis": "会社法208条。PDF p.239（本編 p.236）", "caution": "", "articles": [], "page": 239, "loc": "項目1 募集株式の発行等（1）条文構造"}, {"id": "book-
